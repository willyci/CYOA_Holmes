  <script>
    // Embedded Bilingual Story Graphs
    const STORY_DATA = {"en": {"title": "The Hound of the Baskervilles: Multi-POV Interactive Edition", "author": "Sir Arthur Conan Doyle (Interactive Adaptation)", "description": "A Choose Your Own Adventure adaptation experienced through three perspectives: Dr. John H. Watson, Sherlock Holmes, and Jack Stapleton. Starting from Chapter 1 at 221B Baker Street.", "start_nodes": {"watson": "watson_ch1_baker_street", "holmes": "holmes_ch1_baker_street", "stapleton": "stapleton_ch1_london"}, "pov_roles": {"watson": {"name": "Dr. John H. Watson", "description": "Field observation, social interviews, and protective vigilance at Baskerville Hall."}, "holmes": {"name": "Sherlock Holmes", "description": "Covert surveillance from the moor stone hut, chemical analysis, and deduction."}, "stapleton": {"name": "Jack Stapleton", "description": "Mire navigation, deception, and managing hound preparations without raising suspicion."}}, "nodes": {"watson_ch1_baker_street": {"id": "watson_ch1_baker_street", "title": "Chapter 1: Mr. Sherlock Holmes", "pov": "watson", "pov_name": "Dr. John H. Watson", "node_type": "anchor", "anchor_name": "anchor_chapter1", "content": "Mr. Sherlock Holmes, who was usually very late in the mornings, save upon those not infrequent occasions when he was up all night, was seated at the breakfast table at 221B Baker Street. I stood upon the hearth-rug and picked up the stick which our visitor had left behind him the night before. It was a fine, thick piece of wood, bulbous-headed, of the sort known as a 'Penang lawyer'. Just under the head was a broad silver band nearly an inch across: 'To James Mortimer, M.R.C.S., from his friends of the C.C.H., 1884.'\n\n'Well, Watson, what do you make of it?' asked Holmes, his back turned to me. 'Since we missed him and have no notion of his errand, this accidental souvenir becomes of importance. Reconstruct the man by an examination of it.'", "is_ending": false, "clues": ["Penang-lawyer stick engraved: To James Mortimer, M.R.C.S., from his friends of the C.C.H., 1884", "Tooth-marks of a curly-haired spaniel"], "choices": [{"id": "w_guess_hunt_club", "text": "Conclude that C.C.H. stands for a local hunt club, noting the worn iron ferrule and dog tooth-marks.", "target": "watson_ch2_mortimer", "pov_switch": null, "pov_switch_name": null}, {"id": "w_guess_hospital", "text": "Deduce from M.R.C.S. that C.C.H. refers to Charing Cross Hospital and a country practitioner.", "target": "watson_ch2_mortimer", "pov_switch": null, "pov_switch_name": null}]}, "watson_ch2_mortimer": {"id": "watson_ch2_mortimer", "title": "Chapter 2: The Curse of the Baskervilles", "pov": "watson", "pov_name": "Dr. John H. Watson", "node_type": "branch", "anchor_name": null, "content": "Dr. James Mortimer entered our room—a tall, thin man with a prominent beak of a nose and two grey eyes behind gold-rimmed glasses. From his coat pocket he drew an old, yellowed manuscript dated 1742, recounting the terrible legend of wicked Hugo Baskerville and the foul demon hound that tore out his throat upon the moor.\n\nThen Mortimer laid before us the May 14 issue of the Devon County Chronicle detailing the sudden demise of Sir Charles Baskerville at the Yew Alley gate three months ago. Looking cautiously round the room, Mortimer lowered his voice to a trembling whisper:\n'Mr. Holmes, they were the footprints of a gigantic hound!'", "is_ending": false, "clues": ["1742 Hugo Baskerville manuscript of the spectral hound", "Footprints of a gigantic hound found twenty yards from Sir Charles's body"], "choices": [{"id": "w_ask_footprint", "text": "Cross-examine Mortimer on why he concealed the hound footprints from the public inquest.", "target": "watson_ch4_henry", "pov_switch": null, "pov_switch_name": null}, {"id": "w_ask_heir", "text": "Inquire about the arriving heir, young Henry Baskerville, landing at Waterloo from Canada.", "target": "watson_ch4_henry", "pov_switch": null, "pov_switch_name": null}]}, "watson_ch4_henry": {"id": "watson_ch4_henry", "title": "Chapter 4: Sir Henry Baskerville", "pov": "watson", "pov_name": "Dr. John H. Watson", "node_type": "branch", "anchor_name": null, "content": "The following morning brought Sir Henry Baskerville himself to Baker Street—a sturdy, fiery, dark-eyed gentleman of thirty, fresh from his farm in Canada. Upon his arrival at the Northumberland Hotel, an anonymous envelope had been delivered to him, containing words cut with short nail-scissors from yesterday's Times: 'As you value your life or your reason keep away from the moor.'\n\nMore baffling still, Sir Henry reported that one of his brand-new tan boots had mysteriously vanished outside his hotel bedroom door!", "is_ending": false, "clues": ["Anonymous warning letter: 'As you value your life or your reason keep away from the moor'", "Stolen new tan boot at Northumberland Hotel"], "choices": [{"id": "w_follow_henry_regent", "text": "Accompany Holmes into the street to secretly shadow Sir Henry down Regent Street.", "target": "watson_ch5_london_spy", "pov_switch": null, "pov_switch_name": null}, {"id": "w_examine_letter", "text": "Examine the Times clipped newsprint under Holmes's magnifying lens for watermarks and perfume.", "target": "watson_ch5_london_spy", "pov_switch": null, "pov_switch_name": null}]}, "watson_ch5_london_spy": {"id": "watson_ch5_london_spy", "title": "Chapter 5: Three Broken Threads", "pov": "watson", "pov_name": "Dr. John H. Watson", "node_type": "anchor", "anchor_name": "anchor_london_mission", "content": "Trailing Sir Henry down Regent Street, Holmes pointed out a hansom cab crawling along the curb. Through its side glass glared a passenger sporting a heavy black beard and sharp spectacles! When Holmes sprinted forward, the cab driver lashed his horse and vanished into Oxford Circus.\n\nAt the hotel, another bizarre twist occurred: Sir Henry's missing tan boot was returned, but an old, worn black boot was stolen in its place! The cabman, John Clayton, came forward and testified that his passenger had brazenly declared: 'You may tell him that your passenger was Mr. Sherlock Holmes!'\n\nWith the danger now acute, Holmes turned to me: 'Watson, there is deep water here. You must accompany Sir Henry to Baskerville Hall, guard him day and night with your service revolver, and report every fact to me!'", "is_ending": false, "clues": ["Bearded spy in Cab No. 2704 who mocked Holmes", "Stolen old black boot saturated with Sir Henry's scent"], "choices": [{"id": "w_board_express", "text": "Pack your revolver and luggage, and board the Devonshire express train from Paddington with Sir Henry.", "target": "watson_start", "pov_switch": null, "pov_switch_name": null}, {"id": "w_review_clues", "text": "Review the stolen boots and cab mystery with Holmes before departing for Dartmoor.", "target": "watson_start", "pov_switch": null, "pov_switch_name": null}]}, "watson_start": {"id": "watson_start", "title": "Chapter 6: Arrival at Dartmoor", "pov": "watson", "pov_name": "Dr. John H. Watson", "node_type": "anchor", "anchor_name": "anchor_arrival", "content": "The train ground to a shuddering halt at the small Devonshire platform. Sir Henry Baskerville stepped onto the gravel, adjusting his tweed cap against the chill October wind that swept down from the desolate granite tors. Mounted soldiers with carbines patrolled the tracks; the notorious convict Selden has broken out of Princetown Gaol.\n\nHolmes has entrusted me with the guardianship of Sir Henry. As our wagonette rattles toward the gloomy twin towers of Baskerville Hall, the vast moor stretches ahead like a petrified ocean.", "is_ending": false, "clues": ["Soldiers hunting Selden on Dartmoor"], "choices": [{"id": "w_to_hall", "text": "Proceed directly to Baskerville Hall to interview Barrymore the butler.", "target": "watson_baskerville_hall", "pov_switch": null, "pov_switch_name": null}, {"id": "w_to_alley", "text": "Inspect the perimeter of the Yew Alley where Sir Charles met his death.", "target": "watson_yew_alley", "pov_switch": null, "pov_switch_name": null}, {"id": "w_to_stapleton", "text": "Take a solitary walk along the edge of the moor toward Merripit House.", "target": "watson_meet_stapleton", "pov_switch": null, "pov_switch_name": null}]}, "watson_baskerville_hall": {"id": "watson_baskerville_hall", "title": "The Shadows of Baskerville Hall", "pov": "watson", "pov_name": "Dr. John H. Watson", "node_type": "branch", "anchor_name": null, "content": "Baskerville Hall is an imposing, shadowed pile of granite draped in ivy. Barrymore, the butler, received us with grave courtesy, yet his dark eyes flickered with restlessness. Later that night, muffled sobbing drifted from Mrs. Barrymore's chambers.\n\nI must uncover whether Barrymore is concealing a complicity in the curse, or if there is another thread to pull in Coombe Tracey where Sir Charles was known to receive letters.", "is_ending": false, "clues": ["Barrymore's nervous demeanor", "Weeping woman in the Hall"], "choices": [{"id": "w_watch_barrymore", "text": "Mount a silent night watch in the long corridor to discover Barrymore's purpose.", "target": "watson_night_watch", "pov_switch": null, "pov_switch_name": null}, {"id": "w_visit_lyons", "text": "Hire a trap and ride to Coombe Tracey to interview Mrs. Laura Lyons.", "target": "watson_laura_lyons", "pov_switch": null, "pov_switch_name": null}]}, "watson_yew_alley": {"id": "watson_yew_alley", "title": "The Yew Alley and the Moor Gate", "pov": "watson", "pov_name": "Dr. John H. Watson", "node_type": "branch", "anchor_name": null, "content": "The Yew Alley is a gloomy corridor flanked by twelve-foot yew hedges. At the far end, a small wicket-gate opens upon the vast expanse of the moor. It was here that Sir Charles stood for some minutes, dropping cigar ash, before fleeing in blind panic.\n\nDr. Mortimer's whisper echoes in my memory: 'Mr. Holmes, they were the footprints of a gigantic hound!' Beyond the gate, the path meanders toward the green quagmire of the Great Grimpen Mire.", "is_ending": false, "clues": ["Cigar ash at wicket gate", "Footprints leading toward moor"], "choices": [{"id": "w_alley_to_mire", "text": "Follow the footpath outward into the moor toward Merripit House.", "target": "watson_meet_stapleton", "pov_switch": null, "pov_switch_name": null}, {"id": "w_alley_to_hall", "text": "Return to Sir Henry and prepare for the night watch in the west wing.", "target": "watson_night_watch", "pov_switch": null, "pov_switch_name": null}]}, "watson_meet_stapleton": {"id": "watson_meet_stapleton", "title": "The Naturalist of Grimpen Mire", "pov": "watson", "pov_name": "Dr. John H. Watson", "node_type": "branch", "anchor_name": null, "content": "A small, neat man with a butterfly net and tin botanical box hailed me. It was Jack Stapleton, naturalist of Merripit House. As we conversed, a distant brown pony wandered onto the bright green turf of the Great Grimpen Mire. Within seconds, it was dragged down into the mire's bottomless throat, vanishing with a mournful whinny.\n\n'A false step means death,' smiled Stapleton. Moments later, his sister, Miss Beryl Stapleton, hurried up. Mistaking me in the mist for Sir Henry, she whispered passionately: 'Go back! Go back to London instantly!'", "is_ending": false, "clues": ["Great Grimpen Mire treacherous paths", "Beryl's urgent warning"], "choices": [{"id": "w_interrogate_beryl", "text": "Pull Miss Stapleton aside and demand the reason for her desperate warning.", "target": "watson_beryl_warning", "pov_switch": null, "pov_switch_name": null}, {"id": "w_return_with_caution", "text": "Note her words, decline to press her in front of Jack, and return to the Hall.", "target": "watson_night_watch", "pov_switch": null, "pov_switch_name": null}]}, "watson_beryl_warning": {"id": "watson_beryl_warning", "title": "A Whispered Warning", "pov": "watson", "pov_name": "Dr. John H. Watson", "node_type": "branch", "anchor_name": null, "content": "When Miss Stapleton discovered I was Dr. Watson and not the Baskerville heir, her face turned pale. 'Forget what I said,' she pleaded, though her eyes were wild with terror. 'My brother Jack must not know I spoke. But danger clings to every stone of this moor. If you love Sir Henry's life, take him away!'\n\nAs dusk fell, my eyes caught a tall, solitary figure silhouetted against the rising moon atop the high pinnacle of Black Tor.", "is_ending": false, "clues": ["Figure on the Tor", "Beryl's terror of her brother"], "choices": [{"id": "w_beryl_to_watch", "text": "Return to Baskerville Hall to keep Sir Henry under close guard.", "target": "watson_night_watch", "pov_switch": null, "pov_switch_name": null}, {"id": "w_scout_the_tor", "text": "Climb toward the rocky tors to investigate the solitary watcher.", "target": "watson_stalk_figure", "pov_switch": null, "pov_switch_name": null}]}, "watson_night_watch": {"id": "watson_night_watch", "title": "The Candle at the West Window", "pov": "watson", "pov_name": "Dr. John H. Watson", "node_type": "anchor", "anchor_name": "anchor_convict", "content": "At two in the morning, Sir Henry and I crept down the corridor. Barrymore stood at the end window, holding a candle to the pane and peering into the moor. Confronted, he broke down: the signal was for Selden, the escaped convict, who is Mrs. Barrymore's wayward brother!\n\nSuddenly, from the black moor outside, rose a long, deep howl—a blood-freezing sound that swelled and reverberated through the night. It was neither hound nor wolf, but a shriek of unnatural malice.", "is_ending": false, "clues": ["Barrymore signaling Selden", "The Hound's night howl"], "choices": [{"id": "w_pursue_moor", "text": "Seize revolvers and plunge into the darkness with Sir Henry to hunt down the signal.", "target": "watson_moor_pursuit", "pov_switch": null, "pov_switch_name": null}, {"id": "w_track_watcher", "text": "Leave the convict to the police and track the mysterious watcher on the tor.", "target": "watson_stalk_figure", "pov_switch": null, "pov_switch_name": null}]}, "watson_moor_pursuit": {"id": "watson_moor_pursuit", "title": "Pursuit Across the Tors", "pov": "watson", "pov_name": "Dr. John H. Watson", "node_type": "branch", "anchor_name": null, "content": "Cold rain stung our cheeks as Sir Henry and I scrambled over granite boulders. In the flash of a candle, we glimpsed the gaunt, savage face of Selden scurrying like an animal among the crevices. Sir Henry fired, but the convict vanished into the labyrinth of rocks.\n\nLooking up against the moonlit cloudbreak, I froze. High on the granite crag of the tor stood a second man—tall, thin, cloaked, his arms folded, watching the entire chase in motionless contemplation.", "is_ending": false, "clues": ["Man on the Tor confirmed cloaked and tall"], "choices": [{"id": "w_follow_second_man", "text": "Ascend the steep crags toward the stone huts where the watcher made his lair.", "target": "watson_stalk_figure", "pov_switch": null, "pov_switch_name": null}, {"id": "w_switch_to_holmes", "text": "[Switch POV to Sherlock Holmes inside his moor redoubt]", "target": "holmes_hut_interior", "pov_switch": "holmes", "pov_switch_name": "Sherlock Holmes"}]}, "watson_stalk_figure": {"id": "watson_stalk_figure", "title": "The Prehistoric Stone Hut", "pov": "watson", "pov_name": "Dr. John H. Watson", "node_type": "branch", "anchor_name": null, "content": "I climbed to the ancient circular stone huts left by prehistoric Britons. Inside one, sheltered from the gale, lay a blanket, a loaf of bread, and a tin of tongue. On a flat granite slab lay a discarded cigarette stub—imprinted with 'Bradley, Oxford Street'—and a scrawled note: 'Dr. Watson has gone to Coombe Tracey.'\n\nA shadow fell across the entrance. A hand rested on the doorframe.", "is_ending": false, "clues": ["Bradley cigarette stub", "Watson surveillance note"], "choices": [{"id": "w_wait_gun_drawn", "text": "Cock your service revolver and order the occupant to surrender.", "target": "watson_hut_reunion", "pov_switch": null, "pov_switch_name": null}, {"id": "w_flank_hut", "text": "Slip outside to catch the stranger from the blind side of the stones.", "target": "holmes_moor_ambush", "pov_switch": null, "pov_switch_name": null}]}, "watson_laura_lyons": {"id": "watson_laura_lyons", "title": "The Secret of Laura Lyons", "pov": "watson", "pov_name": "Dr. John H. Watson", "node_type": "branch", "anchor_name": null, "content": "In Coombe Tracey, Mrs. Laura Lyons sat trembling before me. Under relentless questioning, she wept and confessed: 'It was Jack Stapleton who dictated the letter to Sir Charles, pleading for funds at the Yew Alley gate! Then, at the last minute, he forbade me from going, promising he would handle the matter himself.'\n\nThe truth struck me like a blow. Stapleton had lured Sir Charles to the gate to unleash the beast!", "is_ending": false, "clues": ["Stapleton orchestrated Sir Charles's midnight meeting"], "choices": [{"id": "w_lyons_to_hut", "text": "Race back to find the mysterious moor watcher who may hold the key to stopping Stapleton.", "target": "watson_hut_reunion", "pov_switch": null, "pov_switch_name": null}, {"id": "w_lyons_confront_stapleton", "text": "Ride directly to Merripit House to confront Stapleton before he strikes again.", "target": "watson_direct_confrontation", "pov_switch": null, "pov_switch_name": null}]}, "watson_hut_reunion": {"id": "watson_hut_reunion", "title": "Reunion on the Moor", "pov": "watson", "pov_name": "Dr. John H. Watson", "node_type": "branch", "anchor_name": null, "content": "A dry, amused voice broke the tension: 'A lovely evening, my dear Watson. Really, you should not sit so close to the entrance; your shadow was visible from fifty yards away.'\n\nI lowered my revolver in astonishment. Sherlock Holmes stepped into the hut, lean, keen-eyed, and smiling! 'I have been living on the moor, Watson, to see with my own eyes while Stapleton believed me in London. Now the net is closing. Stapleton is our man—and tonight Sir Henry dines at Merripit House!'", "is_ending": false, "clues": ["Holmes working incognito on Dartmoor"], "choices": [{"id": "w_reunion_to_dinner", "text": "Coordinate the Scotland Yard ambush with Holmes outside Merripit House.", "target": "holmes_merripit_dinner", "pov_switch": "holmes", "pov_switch_name": "Sherlock Holmes"}, {"id": "w_take_vantage", "text": "Position yourself beneath the lighted dining-room window of Merripit House.", "target": "watson_climax_vigil", "pov_switch": null, "pov_switch_name": null}]}, "watson_direct_confrontation": {"id": "watson_direct_confrontation", "title": "A Premature Encounter", "pov": "watson", "pov_name": "Dr. John H. Watson", "node_type": "branch", "anchor_name": null, "content": "I arrived at Merripit House alone. Stapleton met me in the hall, his smile tight and strained. From an outhouse across the yard came a deep, muffled growl that vibrated through the floorboards. Stapleton's hand slipped quietly toward his heavy walking stick.\n\n'You seem agitated, Doctor,' he said softly. 'Perhaps you would care to inspect my botanical specimens?'", "is_ending": false, "clues": [], "choices": [{"id": "w_force_outhouse", "text": "Demand to inspect the locked outhouse immediately.", "target": "watson_hound_early_release", "pov_switch": null, "pov_switch_name": null}, {"id": "w_feign_retreat", "text": "Feign an excuse about an urgent message from Sir Henry and retreat to signal Holmes.", "target": "watson_climax_vigil", "pov_switch": null, "pov_switch_name": null}]}, "watson_climax_vigil": {"id": "watson_climax_vigil", "title": "Vigil in the Moor Fog", "pov": "watson", "pov_name": "Dr. John H. Watson", "node_type": "anchor", "anchor_name": "anchor_climax", "content": "I crouched beneath the dining room window of Merripit House. Through the parted curtains, I could see Sir Henry and Stapleton conversing over port. Stapleton checked his watch repeatedly.\n\nOutside, a creeping disaster was unfolding: a thick, white sea of fog was rolling in from the Great Grimpen Mire, swiftly burying the path that Sir Henry must take to return home. If the fog covers the path before Sir Henry passes, we cannot protect him!", "is_ending": false, "clues": ["Dense fog rolling over Grimpen Mire"], "choices": [{"id": "w_signal_holmes", "text": "Signal Holmes and Lestrade on the ridge that the fog bank threatens the trap.", "target": "climax_fog_advance", "pov_switch": null, "pov_switch_name": null}, {"id": "w_storm_house", "text": "Burst through the dining room doors to extract Sir Henry before he walks outside.", "target": "ending_watson_heroic", "pov_switch": null, "pov_switch_name": null}]}, "watson_hound_early_release": {"id": "watson_hound_early_release", "title": "The Beast Unleashed", "pov": "watson", "pov_name": "Dr. John H. Watson", "node_type": "branch", "anchor_name": null, "content": "Stapleton twisted the iron key. The heavy timber door flew back! Out sprang a creature from the pit: a colossal hound, black as coal, with fire licking from its gaping jaws and muzzle glowing with supernatural blue luminescence! It lunged straight at my throat!", "is_ending": false, "clues": [], "choices": [{"id": "w_stand_and_fire", "text": "Plant your boots, steady your arm, and fire every chamber into the monster's chest!", "target": "ending_watson_heroic", "pov_switch": null, "pov_switch_name": null}, {"id": "w_dodge_for_cover", "text": "Dive behind the low granite boundary wall as Holmes's rifle cracks from the ridge!", "target": "ending_canon", "pov_switch": null, "pov_switch_name": null}]}, "holmes_ch1_baker_street": {"id": "holmes_ch1_baker_street", "title": "Chapter 1: The Science of Deduction", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "anchor", "anchor_name": "anchor_chapter1", "content": "Seated with my back to Watson at the breakfast table, watching his reflection in the polished coffee-pot, I listened to his well-meant analysis of Mortimer's Penang-lawyer walking stick. Watson is a splendid conductor of light; his very errors frequently illuminate the truth.\n\nTaking the cane to the window with my lens, the facts arranged themselves with mathematical precision: the thick iron ferrule worn down with rural walking; the 'C.C.H.' standing not for a hunt club, but for Charing Cross Hospital; the five-year-old date marking the departure of a young house-surgeon to rural Devonshire; and the canine tooth-impressions across the center of the wood denoting a creature larger than a terrier, smaller than a mastiff—a curly-haired spaniel. At that very moment, the bell rang, and through the window I saw the spaniel and its owner ascending our steps.", "is_ending": false, "clues": ["Mortimer: Charing Cross Hospital house-surgeon, now rural Devonshire practitioner", "Curly-haired spaniel confirmed at Baker Street threshold"], "choices": [{"id": "h_welcome_mortimer", "text": "Welcome Dr. James Mortimer and invite him to state his grave consultation.", "target": "holmes_ch2_mortimer", "pov_switch": null, "pov_switch_name": null}, {"id": "h_examine_cranial", "text": "Allow Mortimer to marvel at your dolichocephalic skull while preparing your questions.", "target": "holmes_ch2_mortimer", "pov_switch": null, "pov_switch_name": null}]}, "holmes_ch2_mortimer": {"id": "holmes_ch2_mortimer", "title": "Chapter 2: The Problem of the Moor", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "Dr. Mortimer laid before us the ancient curse of Sir Hugo and the mysterious demise of Sir Charles. While the public inquest deemed it heart failure, Mortimer revealed the crucial reality: twenty yards from the body, in the damp earth near the wicket gate, were the fresh pawprints of an enormous hound.\n\nSir Charles had stood waiting at the gate for five to ten minutes, dropping cigar ash twice. Then he had run in terror down the yew alley, his tracks changing as he ran upon his tiptoes until his diseased heart burst.\n\nYoung Sir Henry Baskerville lands at Waterloo from Canada in one hour. Should he be permitted to enter Dartmoor?", "is_ending": false, "clues": ["Giant hound footprints at Yew Alley gate", "Sir Charles stood smoking 5-10 minutes before fleeing on tiptoes"], "choices": [{"id": "h_plan_regent_meeting", "text": "Direct Mortimer to meet Sir Henry and bring him to 221B tomorrow at ten o'clock.", "target": "holmes_ch4_regent_street", "pov_switch": null, "pov_switch_name": null}, {"id": "h_smoke_meditation", "text": "Spend the night in concentrated smoke meditation with the Ordnance Survey map of Dartmoor.", "target": "holmes_ch4_regent_street", "pov_switch": null, "pov_switch_name": null}]}, "holmes_ch4_regent_street": {"id": "holmes_ch4_regent_street", "title": "Chapter 4: The Shadow in Regent Street", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "Sir Henry arrived bearing the cut-and-paste warning letter. The print was clipped from yesterday's Times leading article with short-bladed nail scissors, smelling faintly of white jessamine. A new tan boot had also disappeared from his hotel room.\n\nWhen Sir Henry and Mortimer left, Watson and I shadowed them down Regent Street. Ahead of them crawled a hansom cab. Through its side window glared a passenger sporting a heavy black beard and spectacles! The instant he caught my gaze, he raised his hand, and the cab dashed away down Oxford Circus.", "is_ending": false, "clues": ["Jessamine-scented Times clipped warning letter", "Spy with full black beard in Cab No. 2704"], "choices": [{"id": "h_trace_cab_2704", "text": "Trace the cab registration number (No. 2704) through the Cabmen's Union registry.", "target": "holmes_ch5_broken_threads", "pov_switch": null, "pov_switch_name": null}, {"id": "h_search_hotel_boots", "text": "Proceed directly to the Northumberland Hotel to investigate the boots.", "target": "holmes_ch5_broken_threads", "pov_switch": null, "pov_switch_name": null}]}, "holmes_ch5_broken_threads": {"id": "holmes_ch5_broken_threads", "title": "Chapter 5: The Master Strategy", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "anchor", "anchor_name": "anchor_london_mission", "content": "Cabman John Clayton answered my summons: his passenger had insolently proclaimed, 'You may tell him that your passenger was Mr. Sherlock Holmes!' At the hotel, the new boot had been returned, but an old, worn black boot was stolen.\n\nThe deduction was crystal clear: an unused boot carries no scent. The adversary required an old boot saturated with Sir Henry's scent to train a live hound to hunt the baronet!\n\nThis adversary is of no mean order. If I accompany Sir Henry to Devonshire openly, the culprit will retreat into hiding. I must ostensibly remain in London on other business, while secretly slipping down to Dartmoor to establish an undercover vigil in the prehistoric stone huts, sending Watson ahead as Sir Henry's visible shield.", "is_ending": false, "clues": ["Adversary requires worn boot to train tracking hound on Sir Henry's scent", "Undercover stone hut surveillance strategy initiated"], "choices": [{"id": "h_dispatch_watson_ahead", "text": "Brief Watson on his protective duties, dispatch him to Devonshire, and prepare your undercover post.", "target": "holmes_start", "pov_switch": null, "pov_switch_name": null}, {"id": "h_instruct_cartwright_secret", "text": "Instruct young Cartwright to prepare secret rations for your moor stone hut headquarters.", "target": "holmes_start", "pov_switch": null, "pov_switch_name": null}]}, "holmes_start": {"id": "holmes_start", "title": "Chapter 6: The Detective in the Stone Hut", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "anchor", "anchor_name": "anchor_arrival", "content": "The cold granite walls of the prehistoric hut have been my headquarters for three days. Watson believes me in Baker Street. Had he known I was here, his natural loyalty would have led him to communicate with me, and our opponent would have taken alarm.\n\nCartwright, the London lad, brings me bread and clean linen from Coombe Tracey. Two stolen boots—one tan, one black—from Sir Henry's hotel room hold the key. The first boot was new and discarded; the second boot was old and impregnated with Sir Henry's personal scent. Our adversary possesses a live hound.", "is_ending": false, "clues": ["Stolen boot used for scent conditioning"], "choices": [{"id": "h_analyze_boot", "text": "Examine the scent trail and the chemical traces on the Devon moor soil.", "target": "holmes_chemical_analysis", "pov_switch": null, "pov_switch_name": null}, {"id": "h_telescope_moor", "text": "Train the pocket telescope on Baskerville Hall and Merripit House.", "target": "holmes_moor_surveillance", "pov_switch": null, "pov_switch_name": null}, {"id": "h_intercept_cartwright", "text": "Intercept young Cartwright to read Watson's daily field report.", "target": "holmes_read_reports", "pov_switch": null, "pov_switch_name": null}]}, "holmes_chemical_analysis": {"id": "holmes_chemical_analysis", "title": "The Chemical Trace", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "My pocket laboratory reveals a curious substance scraped from a reed near Grimpen Mire: a compound of phosphorus and wax, entirely odorless so as not to overpower the hound's delicate olfactory senses, yet fiercely luminescent in the dark.\n\nThe legend of the spectral hound is being given flesh and blood by an intellect of no mean order. Who on this moor possesses both deep zoological knowledge and a claim to the Baskerville fortune?", "is_ending": false, "clues": ["Odorless luminous phosphorus preparation"], "choices": [{"id": "h_research_ancestry", "text": "Examine the genealogical records of the Baskerville family branches.", "target": "holmes_ancestral_clue", "pov_switch": null, "pov_switch_name": null}, {"id": "h_scout_mire_island", "text": "Venture onto the hidden mire path under cover of twilight to locate the kennel.", "target": "holmes_mire_recon", "pov_switch": null, "pov_switch_name": null}]}, "holmes_moor_surveillance": {"id": "holmes_moor_surveillance", "title": "Field Glass on the Moor", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "Through my Zeiss glasses, the moor reveals its secrets. I see Jack Stapleton netting insects along the bog's edge. He moves with uncanny confidence across ground where any other man would sink into eternity.\n\nWatson is approaching him. Stapleton's sister hurries out to intercept Watson, gesticulating wildly. A family quarrel? No—she is warning him! The woman is an unwilling accomplice.", "is_ending": false, "clues": ["Willow wand markers across Grimpen Mire"], "choices": [{"id": "h_surveillance_to_mire", "text": "Track Stapleton's secret willow wand markers into the Great Grimpen Mire.", "target": "holmes_mire_recon", "pov_switch": null, "pov_switch_name": null}, {"id": "h_surveillance_to_reports", "text": "Return to the hut to decipher Watson's incoming intelligence.", "target": "holmes_read_reports", "pov_switch": null, "pov_switch_name": null}]}, "holmes_read_reports": {"id": "holmes_read_reports", "title": "Watson's Bulletins", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "Watson writes admirably. He details Barrymore's candle signaling and identifies the convict Selden. More importantly, he notes that Sir Charles was waiting at the Yew Alley gate for a woman with initials L.L.\n\nA visit to Coombe Tracey parish records gives me the name: Laura Lyons, daughter of the old crank Frankland. And who paid for her divorce proceedings? None other than Jack Stapleton.", "is_ending": false, "clues": ["Stapleton funded Laura Lyons"], "choices": [{"id": "h_investigate_ancestry", "text": "Investigate the portrait gallery and heritage of the Baskerville line.", "target": "holmes_ancestral_clue", "pov_switch": null, "pov_switch_name": null}, {"id": "h_observe_night_chase", "text": "Take up vantage on Black Tor as night descends for the Barrymore confrontation.", "target": "holmes_figure_on_tor", "pov_switch": null, "pov_switch_name": null}]}, "holmes_ancestral_clue": {"id": "holmes_ancestral_clue", "title": "The Face of Hugo Baskerville", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "The family portraits at Baskerville Hall held the final revelation! When I masked the cavalier hat and curls from the portrait of wicked Sir Hugo, the face looking back at me was unmistakably Jack Stapleton!\n\nHe is Rodger Baskerville's son, born in Costa Rica. He fled to England, married Beryl Garcia, and adopted the name Stapleton. With Sir Charles dead and Sir Henry murdered, he stands as the undisputed legal heir to the vast Baskerville estates!", "is_ending": false, "clues": ["Stapleton is Rodger Baskerville's son and legal heir"], "choices": [{"id": "h_summon_lestrade", "text": "Telegraph Inspector Lestrade to bring Scotland Yard warrants to Devon immediately.", "target": "holmes_merripit_dinner", "pov_switch": null, "pov_switch_name": null}, {"id": "h_reunion_with_watson", "text": "Wait inside the stone hut to reveal the entire conspiracy to Watson.", "target": "watson_hut_reunion", "pov_switch": "watson", "pov_switch_name": "Dr. John H. Watson"}]}, "holmes_figure_on_tor": {"id": "holmes_figure_on_tor", "title": "The Figure on Black Tor", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "anchor", "anchor_name": "anchor_convict", "content": "The wind howls like a banshee atop Black Tor. Down in the valley, the flash of a candle sparks at Baskerville Hall, followed by the sound of two men pursuing Selden across the rocks. Suddenly, the dreadful baying of a hound echoes across the moor!\n\nBelow me, Selden runs for his life—wearing a suit of Sir Henry's cast-off clothing given to him by Barrymore! If the hound catches his scent, it will tear him to pieces believing him to be the baronet!", "is_ending": false, "clues": [], "choices": [{"id": "h_race_to_selden", "text": "Sprint down the tor to prevent the hound from murdering the convict.", "target": "holmes_selden_crisis", "pov_switch": null, "pov_switch_name": null}, {"id": "h_slip_back_to_hut", "text": "Slip back to your stone hut to coordinate with Watson before Stapleton discovers you.", "target": "holmes_hut_interior", "pov_switch": null, "pov_switch_name": null}, {"id": "h_switch_to_stapleton", "text": "[Switch POV to Jack Stapleton orchestrating the beast]", "target": "stapleton_moor_night", "pov_switch": "stapleton", "pov_switch_name": "Jack Stapleton"}]}, "holmes_selden_crisis": {"id": "holmes_selden_crisis", "title": "Tragedy on the Crags", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "A scream of mortal terror ripped through the fog, followed by the dull thud of a falling body. I arrived at the base of the sheer granite cliff. Selden lay motionless, his skull fractured against the rocks. A few paces away in the heather, the smell of sulfur and phosphor hung thick in the damp air.\n\nA soft footstep sounded behind me. Jack Stapleton appeared out of the mist, carrying a lantern, expecting to find the corpse of Sir Henry Baskerville!", "is_ending": false, "clues": [], "choices": [{"id": "h_confront_stapleton_now", "text": "Drop the mask and accuse Stapleton of murder on the spot!", "target": "ending_holmes_master_deduction", "pov_switch": null, "pov_switch_name": null}, {"id": "h_play_the_fool", "text": "Pretend the death was a mere drunken accident and lure him into the Merripit dinner trap.", "target": "holmes_merripit_dinner", "pov_switch": null, "pov_switch_name": null}]}, "holmes_hut_interior": {"id": "holmes_hut_interior", "title": "The Detective's Lair", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "I returned to the prehistoric hut to find someone had breached the perimeter. The scent of a Bradley cigarette still lingered. A shadow moved near the granite lintel—Watson, revolver in hand!\n\nWith a friendly greeting, I disarmed his tension. Together, we reviewed every thread: the stolen boots, the phosphorescent compound, and Stapleton's ancestral claim.", "is_ending": false, "clues": [], "choices": [{"id": "h_hut_to_dinner", "text": "Prepare the Scotland Yard ambush for tomorrow night's dinner at Merripit House.", "target": "holmes_merripit_dinner", "pov_switch": null, "pov_switch_name": null}, {"id": "h_hut_to_mire_recon", "text": "Conduct a nighttime raid on Stapleton's island kennel in the Grimpen Mire.", "target": "holmes_mire_recon", "pov_switch": null, "pov_switch_name": null}]}, "holmes_moor_ambush": {"id": "holmes_moor_ambush", "title": "Ambush at the Tor", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "I caught Watson attempting to circle my stone hut from the rear. 'An admirable tactical maneuver, my dear Watson,' I called out, stepping from behind a boulder. 'Though I would advise against stepping on dry heather when stalking a consulting detective.'\n\nWatson laughed with relief and gripped my hand. The time for secrecy is over; the time for action has arrived.", "is_ending": false, "clues": [], "choices": [{"id": "h_ambush_to_dinner", "text": "Brief Watson on the final trap and mobilize for the Merripit dinner.", "target": "holmes_merripit_dinner", "pov_switch": null, "pov_switch_name": null}]}, "holmes_mire_recon": {"id": "holmes_mire_recon", "title": "The Heart of Grimpen Mire", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "Following the submerged willow stakes, I penetrated the impenetrable Great Grimpen Mire. On a solitary island of dry peat stood the ruins of an abandoned tin-miner's shack. Inside, tethered with a logging chain, snarled a monstrous creature—a cross between a bloodhound and a mastiff, gaunt, savage, and starved for blood.\n\nNear the chain lay Sir Henry's stolen black boot.", "is_ending": false, "clues": [], "choices": [{"id": "h_recon_to_dinner", "text": "Slip back silently to lay the trap at Merripit House where the crime will be committed.", "target": "holmes_merripit_dinner", "pov_switch": null, "pov_switch_name": null}, {"id": "h_recon_strike_now", "text": "Raid the island kennel immediately with Lestrade and handcuffs!", "target": "ending_holmes_master_deduction", "pov_switch": null, "pov_switch_name": null}]}, "holmes_merripit_dinner": {"id": "holmes_merripit_dinner", "title": "The Ambush at Merripit House", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "anchor", "anchor_name": "anchor_climax", "content": "Lestrade of Scotland Yard joined Watson and me behind a ridge of rocks fifty yards from Merripit House. Sir Henry had dined with Stapleton and was scheduled to walk home alone across the moor.\n\nThe front door opened. Sir Henry stepped out into the night. But from the south, a white, impenetrable sea of fog was drifting swiftly toward us, swallowing the path! In five minutes, our field of fire will be gone!", "is_ending": false, "clues": [], "choices": [{"id": "h_hold_fire", "text": "Hold position until the creature emerges through the fog bank!", "target": "climax_fog_advance", "pov_switch": null, "pov_switch_name": null}, {"id": "h_charge_forward", "text": "Advance through the fog to intercept Sir Henry before the hound reaches him!", "target": "climax_fog_advance", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_ch1_london": {"id": "stapleton_ch1_london", "title": "Chapter 4: The Stalker in London", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "anchor", "anchor_name": "anchor_chapter1", "content": "Disguised beneath a full false black beard and dark spectacles, I shadowed young Sir Henry Baskerville from the moment his ship docked from Canada to the Northumberland Hotel. Beryl, my captive wife, secretly attempted to warn him with words cut from the Times, but I caught her in time—though the meddling letter had already slipped into the mail.\n\nAt the hotel, I tipped a chambermaid half a sovereign to purloin the baronet's boot from outside his door. To my fury, the careless girl brought me a brand-new tan boot that had never touched human skin! An unworn boot carries no scent. I cast it back and ordered a boot that Sir Henry had actually walked in—an old, worn black boot.", "is_ending": false, "clues": ["Disguise: false black beard and dark spectacles", "Unworn boot rejected; worn black boot needed for scent conditioning"], "choices": [{"id": "s_demand_worn_boot", "text": "Bribe the hotel servant to steal Sir Henry's old, worn black boot from the corridor.", "target": "stapleton_ch4_cab", "pov_switch": null, "pov_switch_name": null}, {"id": "s_shadow_baker_street", "text": "Follow Sir Henry and Dr. Mortimer as they walk toward Baker Street.", "target": "stapleton_ch4_cab", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_ch4_cab": {"id": "stapleton_ch4_cab", "title": "Chapter 5: The Encounter in Cab 2704", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "I hailed hansom cab No. 2704 on Trafalgar Square and instructed driver John Clayton to tail Sir Henry to 221B Baker Street. As the baronet entered the building, a cold jolt went through me: stepping onto the pavement came Sherlock Holmes himself, his piercing gaze sweeping the street!\n\nHis eyes fixed upon my cab window! Instantly I threw up the trap-door: 'Driver, gallop for Waterloo Station! Two sovereigns if you outrun him!' At Waterloo, as I pressed the coins into Clayton's hand, I could not resist leaving a mocking parting thrust: 'If you want to know, tell your friends your passenger was Sherlock Holmes!'", "is_ending": false, "clues": ["Cab No. 2704 escape from Sherlock Holmes", "Brazen mockery of Baker Street"], "choices": [{"id": "s_take_early_express", "text": "Collect the stolen worn black boot and take the early express train back to Devonshire.", "target": "stapleton_ch5_devon_prep", "pov_switch": null, "pov_switch_name": null}, {"id": "s_vanish_in_crowd", "text": "Disappear through the Waterloo crowd to ensure no detective followed.", "target": "stapleton_ch5_devon_prep", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_ch5_devon_prep": {"id": "stapleton_ch5_devon_prep", "title": "Chapter 5: Return to Grimpen Mire", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "anchor", "anchor_name": "anchor_london_mission", "content": "With Sir Henry's old, worn black boot securely wrapped in oiled silk in my valise, I caught the early Great Western express back to Devonshire. Sir Henry and Watson will follow in two days, entirely unaware that the London detective they so admire has been left far behind.\n\nThe stage at Merripit House is set. The hound in the abandoned mire tin-mine has not eaten meat in forty-eight hours. All that remains is to bring the boot to its muzzle.", "is_ending": false, "clues": ["Scented boot secured for the hound", "Merripit House trap prepared ahead of Watson's arrival"], "choices": [{"id": "s_to_mire_kennel", "text": "Trek across the hidden mire path to begin scent-training the beast on the island.", "target": "stapleton_start", "pov_switch": null, "pov_switch_name": null}, {"id": "s_to_merripit_prep", "text": "Return to Merripit House and enforce Beryl's total obedience before the baronet arrives.", "target": "stapleton_start", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_start": {"id": "stapleton_start", "title": "Chapter 6: The Web of Merripit House", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "anchor", "anchor_name": "anchor_arrival", "content": "Sir Charles is buried, dead of heart failure at the Yew Alley gate, exactly as I designed. Now the new heir, Sir Henry, has arrived in Devon. He brought with him a bumbling military doctor named Watson, while Sherlock Holmes remains in London, blind to what transpires on Dartmoor.\n\nThe prize is within my grasp: Baskerville Hall and a fortune of a million pounds. I only need to eliminate this last heir, and the estate will fall to me under my South American alias.", "is_ending": false, "clues": ["Stapleton's claim to Baskerville inheritance"], "choices": [{"id": "s_scout_watson", "text": "Take the butterfly net and intercept Dr. Watson along the fringe of Grimpen Mire.", "target": "stapleton_moor_stroll", "pov_switch": null, "pov_switch_name": null}, {"id": "s_check_hound", "text": "Venture onto the mire island to inspect the hound and test the scent trail.", "target": "stapleton_check_hound", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_moor_stroll": {"id": "stapleton_moor_stroll", "title": "Playing the Naturalist", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "I played the gentle entomologist to perfection. To impress Watson with the lethal nature of the moor, I pointed out a pony sinking helplessly into the bog. But suddenly Beryl ran toward us across the heather! Believing Watson was Sir Henry, she began to utter frantic warnings!\n\nIf that foolish woman ruins my months of preparation, I will silence her permanently.", "is_ending": false, "clues": [], "choices": [{"id": "s_chastise_beryl", "text": "Confront Beryl in private and break her rebellious spirit.", "target": "stapleton_beryl_control", "pov_switch": null, "pov_switch_name": null}, {"id": "s_charm_watson", "text": "Laugh off Beryl's eccentricity and divert Watson with botanical talk.", "target": "stapleton_deceive_watson", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_check_hound": {"id": "stapleton_check_hound", "title": "The Hound on the Mire Island", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "I stepped carefully across the hidden tussocks of Grimpen Mire to the abandoned tin mine. In the darkness, the bloodhound-mastiff brute rattled its iron chain and snarled hungrily. I held Sir Henry's stolen worn boot beneath its nostrils until its jowls dripped with saliva.\n\nThe phosphor paste is mixed—luminous, odorless, terrifying to superstitious fools.", "is_ending": false, "clues": ["Phosphor paste prepared on hound"], "choices": [{"id": "s_apply_phosphor", "text": "Coat the hound's jaws and eyes with the luminous compound.", "target": "stapleton_phosphor_prep", "pov_switch": null, "pov_switch_name": null}, {"id": "s_plan_dinner", "text": "Return to Merripit House to invite Sir Henry to his final dinner.", "target": "stapleton_invite_henry", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_beryl_control": {"id": "stapleton_beryl_control", "title": "The Captive Wife", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "Behind the locked door of our bedchamber, Beryl wept and defied me. She refuses to play the bait for Sir Henry any longer. 'You are a monster, Jack!' she cried.\n\nNo matter. I will bind and gag her in the upstairs room before Sir Henry arrives for dinner. Her silence is easily purchased with hemp rope.", "is_ending": false, "clues": [], "choices": [{"id": "s_bind_now", "text": "Bind Beryl securely to the bedpost and proceed with the dinner trap.", "target": "stapleton_bind_beryl", "pov_switch": null, "pov_switch_name": null}, {"id": "s_patrol_tors", "text": "Inspect the surrounding tors for any uninvited observers first.", "target": "stapleton_search_tors", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_deceive_watson": {"id": "stapleton_deceive_watson", "title": "Probing the Doctor", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "Over tea at Merripit House, I probed Watson regarding Sherlock Holmes. The doctor insists Holmes is occupied with an embezzlement case in London. Yet Watson's eyes wandered toward the tors.\n\nCould someone be hiding out among the prehistoric ruins? I noticed smoke rising from a stone hut earlier this afternoon.", "is_ending": false, "clues": [], "choices": [{"id": "s_investigate_hut", "text": "Take a carbine and scout the stone huts on the tor.", "target": "stapleton_search_tors", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ignore_smoke", "text": "Dismiss it as a shepherd or convict and press forward with Sir Henry's dinner.", "target": "stapleton_invite_henry", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_phosphor_prep": {"id": "stapleton_phosphor_prep", "title": "A Monster in the Dark", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "The luminous paste glistens over the beast's muzzle and brow. In the pitch black of the tin shack, it looks like a demon wrenched from the bowels of hell! No human heart could withstand its charge without freezing in terror.\n\nThe stage is set. All that remains is to bring Sir Henry out onto the moor alone at night.", "is_ending": false, "clues": [], "choices": [{"id": "s_phosphor_to_bind", "text": "Lock up the beast and secure Beryl in the upper room.", "target": "stapleton_bind_beryl", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_search_tors": {"id": "stapleton_search_tors", "title": "Smoke on the Tors", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "I climbed Black Tor with my field glass. Outside one of the stone huts, a boy was delivering supplies. Someone is living there—someone disciplined, orderly, and patient.\n\nIf it is a London detective, he must be eliminated before he joins forces with Watson.", "is_ending": false, "clues": [], "choices": [{"id": "s_hound_the_hut", "text": "Release the hound tonight toward the stone hut to eliminate the spy!", "target": "stapleton_attack_hut", "pov_switch": null, "pov_switch_name": null}, {"id": "s_proceed_with_henry", "text": "The spy poses no threat if Sir Henry dies tonight. Return to Merripit House.", "target": "stapleton_invite_henry", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_moor_night": {"id": "stapleton_moor_night", "title": "The Convict Hunt", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "anchor", "anchor_name": "anchor_convict", "content": "The moor is alive with shouts tonight. Watson and Sir Henry are hunting Selden, the escaped convict. I released the hound on Sir Henry's boot-scent to strike in the confusion!\n\nThe beast pursued its quarry up the jagged granite cliffs. A man plunged screaming to his death! I hurried forward with my lantern—only to discover Selden's corpse, dressed in Sir Henry's cast-off clothes!", "is_ending": false, "clues": [], "choices": [{"id": "s_salvage_plan", "text": "Curse the blunder, retreat before Watson arrives, and lure Sir Henry to dinner tomorrow.", "target": "stapleton_invite_henry", "pov_switch": null, "pov_switch_name": null}, {"id": "s_panic_escape", "text": "Panic! Assume the law is closing in and attempt a midnight flight across the mire.", "target": "ending_stapleton_tragedy", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_attack_hut": {"id": "stapleton_attack_hut", "title": "The Ambush at the Hut", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "I unleashed the hound toward the prehistoric hut. But as the beast leaped forward, a rifle cracked from the rocks! The bullet struck the hound's shoulder, sending it howling into the darkness. Out from the shadows stepped Sherlock Holmes, his revolver leveled at my chest!", "is_ending": false, "clues": [], "choices": [{"id": "s_run_for_mire", "text": "Turn and sprint blindly for the safety of the Great Grimpen Mire!", "target": "ending_stapleton_tragedy", "pov_switch": null, "pov_switch_name": null}, {"id": "s_surrender_holmes", "text": "Throw down your weapon and raise your hands in surrender.", "target": "ending_stapleton_arrest", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_bind_beryl": {"id": "stapleton_bind_beryl", "title": "Silencing the House", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "I dragged Beryl up the narrow stairs, tied her wrists to the brass bedpost, and gagged her with a scarf. She glared at me with pure hatred, but she can utter no sound.\n\nDownstairs, the heavy knocker sounded. Sir Henry Baskerville has arrived for dinner.", "is_ending": false, "clues": [], "choices": [{"id": "s_host_dinner", "text": "Smooth your coat, assume an air of genial hospitality, and welcome the baronet.", "target": "stapleton_dinner_trap", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_invite_henry": {"id": "stapleton_invite_henry", "title": "The Fatal Invitation", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "Sir Henry gladly accepted my invitation to dine at Merripit House. He is desperate to see Beryl again. I insisted he walk home alone across the moor, promising that the night air would clear his head.\n\nNow I must prepare the house and ensure Beryl does not whisper a single word of warning.", "is_ending": false, "clues": [], "choices": [{"id": "s_bind_beryl_now", "text": "Lock and bind Beryl in the upper bedchamber before Sir Henry arrives.", "target": "stapleton_bind_beryl", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_dinner_trap": {"id": "stapleton_dinner_trap", "title": "Dinner at Merripit House", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "anchor", "anchor_name": "anchor_climax", "content": "Dinner went flawlessly. Sir Henry drank freely of my port, saddened only by Beryl's 'sudden migraine.' At ten o'clock, he took his cane and stepped out the door to walk the lonely moor path back to Baskerville Hall.\n\nA magnificent, dense fog is rolling in across Grimpen Mire—a white wall that will smother his cries and blind any rescue. I slip quietly to the outhouse to release the flaming demon!", "is_ending": false, "clues": [], "choices": [{"id": "s_release_beast", "text": "Unlock the outhouse door and unleash the hound upon Sir Henry's trail!", "target": "climax_fog_advance", "pov_switch": null, "pov_switch_name": null}, {"id": "s_switch_to_watson", "text": "[Switch POV to Dr. Watson watching from the rocks outside]", "target": "watson_climax_vigil", "pov_switch": "watson", "pov_switch_name": "Dr. John H. Watson"}]}, "climax_fog_advance": {"id": "climax_fog_advance", "title": "The Hound of the Baskervilles", "pov": "watson", "pov_name": "Dr. John H. Watson", "node_type": "climax", "anchor_name": "anchor_climax", "content": "A sound came out of the rolling white fog—a patter of rapid footsteps and a low, guttural snarl. Suddenly, leaping through the curtain of vapor, came a beast that might have sprung from the nightmares of Dante! It was a hound of enormous size, coal-black, with fire bursting from its gaping mouth, its eyes glowing with smoldering blue flame, its muzzle and dewlaps outlined in flickering phosphor light!\n\nSir Henry screamed in terror and fell backward onto the turf. The monster soared through the air, its fangs aimed straight for his throat!", "is_ending": false, "clues": [], "choices": [{"id": "climax_shoot_beast", "text": "Holmes, Watson, and Lestrade unleash a simultaneous volley of revolver fire!", "target": "ending_canon", "pov_switch": null, "pov_switch_name": null}, {"id": "climax_watson_shield", "text": "Watson dives forward with his service revolver to shield Sir Henry with his own body!", "target": "ending_watson_heroic", "pov_switch": null, "pov_switch_name": null}, {"id": "climax_fog_blind", "text": "The dense white fog blinds the marksmen; the shots go wild into the night!", "target": "ending_stapleton_triumph", "pov_switch": null, "pov_switch_name": null}]}, "ending_canon": {"id": "ending_canon", "title": "Canon Triumph: The Hound Destroyed", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "ending", "anchor_name": null, "content": "Five revolver bullets slammed into the flank of the leaping beast. With a ferocious howl of agony, the monstrous hound crashed to earth, thrashing in its death throes upon the heather before lying stone dead.\n\nSir Henry was fainting, but untouched. We dashed to Merripit House, kicked down the locked bedroom door, and cut the cords that bound the bruised and weeping Beryl. She pointed toward the Great Grimpen Mire: 'He has fled to his island in the bog!'\n\nThe following morning, beneath the bright autumn sun, Holmes and I followed Stapleton's willow wands into the mire. Halfway across, on a wretched patch of slime, lay Sir Henry's stolen black boot. But of Jack Stapleton, there was no trace save for a single heel-mark sinking into the black, sucking peat.\n\nSomewhere in the heart of the Great Grimpen Mire, down in the foul slime of the bottomless quagmire, the cold, ruthless master of the hound sleeps forever.", "is_ending": true, "clues": [], "choices": []}, "ending_watson_heroic": {"id": "ending_watson_heroic", "title": "Watson's Valor: The Doctor's Triumph", "pov": "watson", "pov_name": "Dr. John H. Watson", "node_type": "ending", "anchor_name": null, "content": "Placing myself directly between Sir Henry and the leaping monster, I thrust the muzzle of my service revolver straight into the phosphorescent jaw and pulled the trigger three times! The beast dropped like a stone.\n\nCatching sight of a dark figure bolting through the fog, I gave chase with all the vigor of my Afghan campaign days. I cornered Jack Stapleton against the shear granite face of an abandoned quarry, holding him at gunpoint until Holmes and Lestrade rushed up with handcuffs.\n\n'Splendid, Watson!' cried Holmes, clapping me on the shoulder. 'A masterstroke of courage! England has many detectives, but only one John H. Watson!' The Baskerville curse is broken forever by the hand of the good doctor.", "is_ending": true, "clues": [], "choices": []}, "ending_holmes_master_deduction": {"id": "ending_holmes_master_deduction", "title": "Holmes's Masterstroke: Judicial Triumph", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "ending", "anchor_name": null, "content": "With the stolen boots, the phosphorus formula, and the Costa Rican birth records in my pocket, I stepped forward and presented the complete chain of evidence before Jack Stapleton could even unleash the hound.\n\nLestrade snapped the steel manacles onto Stapleton's wrists. 'Jack Stapleton—or rather, Rodger Baskerville—you are under arrest for the murder of Sir Charles Baskerville and the attempted murder of Sir Henry.'\n\nStapleton collapsed in defeat. Two months later at Exeter Assizes, the evidence was found incontestable, and the murderer met his just fate upon the scaffold. Another triumph of pure deduction.", "is_ending": true, "clues": [], "choices": []}, "ending_stapleton_triumph": {"id": "ending_stapleton_triumph", "title": "The Dark Inheritance: Stapleton's Victory", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "ending", "anchor_name": null, "content": "The rolling fog blinded the foolish London marksmen. Their bullets whistled harmlessly into the peat. By the time they reached the path, Sir Henry lay still, his heart stopped by sheer terror before the hound's flaming jaws, leaving no mark of human violence.\n\nI recalled the hound with a low whistle, washed its jaws in the mire stream, and slipped back to Merripit House. The Devon coroner once again ruled the death as heart failure caused by the ancient family curse.\n\nSix months later, residing in Paris under the name Vandeleur, I quietly stepped forward to claim the title, Baskerville Hall, and the fortune of a million pounds. The game is won.", "is_ending": true, "clues": [], "choices": []}, "ending_stapleton_tragedy": {"id": "ending_stapleton_tragedy", "title": "The Grimpen Mire Consumes Its Own", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "ending", "anchor_name": null, "content": "Panic gripped my heart. Gunfire and shouting echoed from all corners of the moor. I plunged headlong into the darkness toward my willow-marked path across the Great Grimpen Mire.\n\nIn the blinding swirl of fog, my foot plunged not onto firm reed tussock, but into foul, greasy black slime. I threw out my arms, but found only clutching quagmire. The bog seized my knees, my waist, my chest, pulling with inexorable, suffocating weight.\n\nI screamed into the mist, but only the crying of the plovers answered. The black mire bubbled once, twice, and closed forever over my head.", "is_ending": true, "clues": [], "choices": []}, "ending_stapleton_arrest": {"id": "ending_stapleton_arrest", "title": "Justice on Dartmoor", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "ending", "anchor_name": null, "content": "Surrounded by Holmes's revolver and Lestrade's Scotland Yard whistle, I threw down my weapons. The hound was shot, Beryl freed, and my brilliant plot shattered by the cold intellect of Baker Street.\n\nAs the carriage rattled away toward Exeter Gaol, I looked back one last time at the grim tors of Dartmoor, knowing that the gallows awaited me in the winter chill.", "is_ending": true, "clues": [], "choices": []}}}, "cn": {"title": "巴斯克维尔的猎犬：多视角互动小说", "author": "阿瑟·柯南·道尔 著（多视角改编）", "description": "改编自柯南·道尔经典侦探杰作《巴斯克维尔的猎犬》，从贝克街221B第一章启程，可从华生医生、歇洛克·福尔摩斯以及凶手斯台普吞三大视角亲历这场迷案。", "start_nodes": {"watson": "watson_ch1_baker_street", "holmes": "holmes_ch1_baker_street", "stapleton": "stapleton_ch1_london"}, "pov_roles": {"watson": {"name": "约翰·H·华生医生", "description": "实地观察、社交探访，在巴斯克维尔庄园护卫亨利爵士。"}, "holmes": {"name": "歇洛克·福尔摩斯", "description": "在荒原史前石屋隐蔽监视、化学痕迹分析与缜密司法推导。"}, "stapleton": {"name": "杰克·斯台普吞", "description": "穿行大格林盆泥潭密径、伪装昆虫学家，训育荧光猎犬夺取遗产。"}}, "nodes": {"watson_ch1_baker_street": {"id": "watson_ch1_baker_street", "title": "第一章 歇洛克·福尔摩斯先生", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "anchor", "anchor_name": "anchor_chapter1", "content": "歇洛克·福尔摩斯先生坐在贝克街221B的早餐桌旁。他除了时常彻夜不眠之外，早晨总是起得很晚的。我站在壁炉前的小地毯上，拿起了昨晚那位神秘客人遗忘在椅旁的手杖。这是一根很精致而沉重的手杖，顶端有个疙疸，由槟榔子木制成。紧挨顶端的下面是一圈近一英寸宽的银箍，上面刻着：‘送给皇家外科医学院学士杰姆士·摩梯末，C.C.H.的朋友们赠，一八八四年。’\n\n‘啊，华生，你对它的看法怎么样？’福尔摩斯背对着我，一边喝着咖啡一边发问，‘既然昨晚咱们错过了他，对他此来的目的也一无所知，这件意外的纪念品就变得更重要了。请你在仔细观察后，把这个人给我形容一番吧。’", "is_ending": false, "clues": ["刻有‘送给皇家外科医学院学士杰姆士·摩梯末，C.C.H.的朋友们赠，一八八四年’的槟榔子木手杖", "手杖中央留有卷毛长耳獚犬咬过的清晰牙印"], "choices": [{"id": "w_guess_hunt_club", "text": "推测C.C.H.代表当地某个猎人会，并指出磨损的铁包头和狗咬的牙印。", "target": "watson_ch2_mortimer", "pov_switch": null, "pov_switch_name": null}, {"id": "w_guess_hospital", "text": "根据M.R.C.S.头衔，推断C.C.H.代表查林十字医院，客人曾是一位任职医院的乡村医生。", "target": "watson_ch2_mortimer", "pov_switch": null, "pov_switch_name": null}]}, "watson_ch2_mortimer": {"id": "watson_ch2_mortimer", "title": "第二章 巴斯克维尔的灾祸", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "branch", "anchor_name": null, "content": "杰姆士·摩梯末医生走了进来——他是一个又高又瘦的人，长长的鼻子像只鸟嘴，金边眼镜后闪烁着两只敏锐的灰眼睛。他从胸前口袋里掏出一份泛黄破旧的古老手稿，年代确为一七四二年。那是巴斯克维尔家族祖传的恐怖传说：荒淫残暴的老修果·巴斯克维尔强掳少女，最终在沼地深处被一只巨大如妖魔的黑色猎犬咬断了喉咙。\n\n随后，摩梯末医生又拿出了五月十四日的《德文郡纪事报》，向我们披露了三个月前查尔兹·巴斯克维尔爵士在水松夹道栅门前的离奇暴毙。医生环视室内，声音颤抖地吐露出连验尸官都隐瞒的绝密事实：\n‘福尔摩斯先生，在距离尸体二十码外的湿软地面上……全都是一只巨大的猎犬的脚印！’", "is_ending": false, "clues": ["一七四二年修果·巴斯克维尔魔犬传说手稿", "查尔兹爵士尸体二十码外发现巨大猎犬爪印"], "choices": [{"id": "w_ask_footprint", "text": "追问摩梯末医生为何在官方验尸公听会上刻意隐瞒猎犬爪印的事实。", "target": "watson_ch4_henry", "pov_switch": null, "pov_switch_name": null}, {"id": "w_ask_heir", "text": "探询即将由加拿大抵达伦敦滑铁卢车站的合法继承人亨利·巴斯克维尔爵士的处境。", "target": "watson_ch4_henry", "pov_switch": null, "pov_switch_name": null}]}, "watson_ch4_henry": {"id": "watson_ch4_henry", "title": "第四章 亨利·巴斯克维尔爵士", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "branch", "anchor_name": null, "content": "次日早晨，新任继承人亨利·巴斯克维尔爵士亲临贝克街。他年约三十，短小精悍，生着一双黑眼睛，神情坚毅好斗。他刚在诺桑勃兰旅馆落脚，便收到了一封神秘匿名信，信封用粗糙笔迹写就，信瓤中央赫然是用短指甲剪从昨日《泰晤士报》社论上剪下贴成的警告文字：\n‘若你看重你的生命的价值或还有理性的话，远离沼地。’\n\n更离奇的是，亨利爵士昨晚放在门外等待擦拭的一双簇新浅棕色高筒靴，竟不翼而飞了一只！", "is_ending": false, "clues": ["匿名剪报警告信：‘若你看重你的生命的价值或还有理性的话，远离沼地。’", "诺桑勃兰旅馆神秘失窃的未着浅棕色新皮靴"], "choices": [{"id": "w_follow_henry_regent", "text": "跟随福尔摩斯敏捷地冲出公寓，暗中尾随亨利爵士与摩梯末步入摄政街。", "target": "watson_ch5_london_spy", "pov_switch": null, "pov_switch_name": null}, {"id": "w_examine_letter", "text": "用放大镜仔细检验警告信纸的水印、茉莉香气及剪贴刀口的特征。", "target": "watson_ch5_london_spy", "pov_switch": null, "pov_switch_name": null}]}, "watson_ch5_london_spy": {"id": "watson_ch5_london_spy", "title": "第五章 三条断了的线索", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "anchor", "anchor_name": "anchor_london_mission", "content": "我们尾随亨利爵士来到摄政街。福尔摩斯突然瞥见一辆缓缓滑行的双轮马车（车号2704号）。侧窗里探出一张留着浓密大黑胡须、戴着深色眼镜的面孔，正死死盯住亨利爵士！福尔摩斯拔步飞奔追赶，那马车夫却挥鞭狂奔，瞬间消失在牛津街的车水马龙之中。\n\n返回旅馆后，离奇的事情再次发生：失踪的浅棕色新鞋被悄悄归还，但亨利爵士一只穿过的旧黑皮靴却被偷走了！随后应召而来的车夫约翰·克雷顿更证实，那个黑胡子神秘乘客竟狂妄留言：‘你可以告诉他，你的乘客就是歇洛克·福尔摩斯！’\n\n危险已迫在眉睫。福尔摩斯神情严肃地拍着我的肩膀：‘华生，这是一汪深不可测的险水。你必须带上陆军左轮手枪，日夜寸步不离地护卫亨利爵士前往巴斯克维尔庄园，并将荒原上的一举一动详尽向我报告！’", "is_ending": false, "clues": ["乘坐2704号双轮马车、黑胡须深色眼镜并出言挑衅福尔摩斯的神秘暗探", "真正被盗、带有亨利爵士浓重体味的旧黑皮靴"], "choices": [{"id": "w_board_express", "text": "整理行装与手枪，陪同亨利爵士登上前往德文郡的大西部特快列车。", "target": "watson_start", "pov_switch": null, "pov_switch_name": null}, {"id": "w_review_clues", "text": "在前往帕丁顿车站前，与福尔摩斯再次复盘失窃皮靴与幽灵马车的线索。", "target": "watson_start", "pov_switch": null, "pov_switch_name": null}]}, "holmes_ch1_baker_street": {"id": "holmes_ch1_baker_street", "title": "第一章 演绎法的推演", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "anchor", "anchor_name": "anchor_chapter1", "content": "我背对着华生坐在早餐桌旁，通过镀银咖啡壶光亮的曲面注视着他的动作。他正在壁炉毯上煞有介事地把玩昨夜客人遗落的手杖。华生是一根极佳的光的传导者——他那些充满善意而又漏洞百出的推论，往往能精准地将真理的大门推开一条缝隙。\n\n我取过那根沉重斑驳的槟榔子木手杖，在明媚的晨光下用放大镜扫视：底端磨损剥蚀的厚铁包头，昭示着持杖者常在粗粝的乡间砾石上步行；‘C.C.H.’并非什么乡野猎人会，而是伦敦查林十字医院的缩写；一八八四年的赠礼日期，正印证了一位有前途的年轻住院外科医生在结婚自行开业时辞别都市；而木杖中央清晰交错的凹痕，其牙距比狸犬宽、比獒犬窄——一条活泼的卷毛长耳獚犬！门铃声适时响起，窗外楼阶下，这条獚犬与它的主人正叩响贝克街的门扉。", "is_ending": false, "clues": ["摩梯末：查林十字医院住院外科医生，现达特沼地乡村医生", "在贝克街门阶得到印证的卷毛长耳獚犬"], "choices": [{"id": "h_welcome_mortimer", "text": "迎接杰姆士·摩梯末医生进门，请他陈述那桩令他深感棘手的非凡疑案。", "target": "holmes_ch2_mortimer", "pov_switch": null, "pov_switch_name": null}, {"id": "h_examine_cranial", "text": "让摩梯末医生惊叹于你的长颅骨标本价值，同时冷静梳理思绪准备切入正题。", "target": "holmes_ch2_mortimer", "pov_switch": null, "pov_switch_name": null}]}, "holmes_ch2_mortimer": {"id": "holmes_ch2_mortimer", "title": "第二章 荒原上的神秘疑案", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": null, "content": "摩梯末医生展开了一七四二年的羊皮古卷，讲述了修果·巴斯克维尔的恶灵血仇。尽管世俗法庭将查尔兹爵士之死归结为心脏衰竭，但摩梯末披露的密情却令人玩味：水松夹道栅门前的泥土里，清晰地印着一只体型骇人的巨犬爪印！\n\n查尔兹爵士曾在夜色中的栅门前伫立了五至十分钟，烟灰两度掉落在沙砾上。随后，他仿佛遭遇了难以名状的狂恐，发足沿夹道狂奔，足迹因极度惊骇甚至化为踮足奔跑的凹痕，直至脆弱的心脏破裂。\n\n最后一位法定继承人亨利·巴斯克维尔爵士尚余一小时便将自加拿大抵英。他是否应该踏入达特沼地那片凶险之地？", "is_ending": false, "clues": ["水松夹道栅门处的巨大猎犬爪印", "查尔兹爵士曾驻足吸雪茄五至十分钟后发足狂奔"], "choices": [{"id": "h_plan_regent_meeting", "text": "叮嘱摩梯末务必在滑铁卢车站接应亨利爵士，并于明日上午十点整一同来贝克街。", "target": "holmes_ch4_regent_street", "pov_switch": null, "pov_switch_name": null}, {"id": "h_smoke_meditation", "text": "在浓密的烟草冥想中展开达特沼地军用地图，彻夜推演水松夹道的地势与逃生路线。", "target": "holmes_ch4_regent_street", "pov_switch": null, "pov_switch_name": null}]}, "holmes_ch4_regent_street": {"id": "holmes_ch4_regent_street", "title": "第四章 摄政街的幽灵马车", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": null, "content": "年轻的亨利爵士如约而至，带来了那封散发着白茉莉清香的警告信。文字是从昨日《泰晤士报》社论上用短刃剪刀剪下的铅印字体，而他在诺桑勃兰旅馆的一只崭新浅棕色皮靴已离奇被窃。\n\n当客人离去后，我同华生紧紧缀在他们百码之后走入摄政街。街道对面，一辆车牌2704号的双轮出租马车正悄无声息地尾随追踪。隔着车窗，一个蓄着浓密黑髯、戴着遮光眼镜的暗探赫然在目！当我与之目光交汇的刹那，对手骤然喝令车夫扬鞭，马车疾驰没入车流。", "is_ending": false, "clues": ["带有茉莉香气、《泰晤士报》剪贴而成的警告信", "2704号双轮马车里浓密黑须、戴眼镜的跟踪者"], "choices": [{"id": "h_trace_cab_2704", "text": "通过出租马车登记处追查2704号车夫约翰·克雷顿，传唤其至贝克街对质。", "target": "holmes_ch5_broken_threads", "pov_switch": null, "pov_switch_name": null}, {"id": "h_search_hotel_boots", "text": "亲赴诺桑勃兰旅馆盘问侍者，追查皮靴失窃的内部接应。", "target": "holmes_ch5_broken_threads", "pov_switch": null, "pov_switch_name": null}]}, "holmes_ch5_broken_threads": {"id": "holmes_ch5_broken_threads", "title": "第五章 布局达特沼地", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "anchor", "anchor_name": "anchor_london_mission", "content": "车夫约翰·克雷顿向我证实：他的神秘乘客下车时竟狂傲地自称是‘歇洛克·福尔摩斯先生’！与此同时，旅馆传讯称：未穿过的新棕靴被退回，但亨利爵士一只饱含个人体味的旧黑皮靴却被偷换了。\n\n脉络瞬间洞若观火：新靴无气味，偷窃旧靴是为了让一头真正的猎兽熟悉并锁定亨利爵士的体味追踪扑杀！这是一位心思缜密、极度凶残的旗鼓相当的对手。若我大张旗鼓护送亨利爵士前往德文郡，狡狐必将遁入阴影。唯有伪装留守伦敦，让华生作为明盾护卫爵士，而我暗中潜入达特荒原史前石棚营地隐匿布控，方能引蛇出洞一网打尽！", "is_ending": false, "clues": ["对手盗窃旧黑皮靴系为训练实体恶犬嗅觉追踪", "启动达特沼地石棚营地绝密潜伏计划"], "choices": [{"id": "h_dispatch_watson_ahead", "text": "向华生交代保卫守则，派其护卫亨利爵士先行奔赴德文郡，同时暗度陈仓。", "target": "holmes_start", "pov_switch": null, "pov_switch_name": null}, {"id": "h_instruct_cartwright_secret", "text": "密令机敏少年卡特莱购置干粮装备，暗中运送至荒原史前石棚营地作为秘密指挥所。", "target": "holmes_start", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_ch1_london": {"id": "stapleton_ch1_london", "title": "第四章 潜伏伦敦的密谋", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "anchor", "anchor_name": "anchor_chapter1", "content": "戴着精心粘合的浓密假黑胡子和深色平光眼镜，我从南安普敦一路盯梢亨利·巴斯克维尔至伦敦诺桑勃兰旅馆。我那个心慈手软的妻子贝瑟尔妄图用剪自《泰晤士报》的字条向他预警，被我当场察觉并施以惩戒，可惜信件已先行落入邮筒。\n\n在旅馆走廊里，我用半枚金币买通了一个蠢笨的杂役，命他从爵士门外偷出一只皮靴。可那个蠢货竟偷来了一只从未着地的全新浅棕色高筒靴！未穿过的皮革毫无活人体味，如何能用以激发猛兽狂暴的嗅觉追踪？我必须退还废靴，命他换偷一只亨利实际穿过、浸透气味的旧黑皮靴。", "is_ending": false, "clues": ["化名与伪装：浓密假黑须与深色遮光眼镜", "未穿过的棕靴无气味被弃，锁定带有体味的旧黑皮靴"], "choices": [{"id": "s_demand_worn_boot", "text": "威逼利诱旅馆仆役，必须趁乱偷出亨利爵士穿过的那双旧黑皮靴。", "target": "stapleton_ch4_cab", "pov_switch": null, "pov_switch_name": null}, {"id": "s_shadow_baker_street", "text": "雇佣双轮马车，暗中监视亨利爵士与摩梯末医生前往贝克街求援的行踪。", "target": "stapleton_ch4_cab", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_ch4_cab": {"id": "stapleton_ch4_cab", "title": "第五章 2704号马车的较量", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "我雇下了特拉法尔加广场的2704号双轮马车，命车夫约翰·克雷顿尾随亨利前往贝克街221B。但当那个短小精悍的爵士踏入大门时，一个高瘦、生着鹰钩鼻的敏锐身影赫然步入街面——歇洛克·福尔摩斯！在摄政街的橱窗前，那双令全欧洲罪犯胆寒的灰眼睛猛地刺穿了马车的侧窗玻璃！\n\n我霍地顶开车顶望孔：‘车夫，拼命跑！去滑铁卢车站！甩掉他们我赏你两个金币！’在滑铁卢车站喧嚣的站台，接过浸透雨水的金币时，我忍不住对目瞪口呆的车夫报以狂妄的戏谑：‘回去告诉你所有的朋友，你刚才拉的乘客就是歇洛克·福尔摩斯！’", "is_ending": false, "clues": ["乘坐2704号马车成功从福尔摩斯眼皮底下脱身", "狂妄假报福尔摩斯之名羞辱贝克街名侦探"], "choices": [{"id": "s_take_early_express", "text": "收好取回的沾满气味的旧黑皮靴，搭乘早班大西部特快潜回德文郡大荒原。", "target": "stapleton_ch5_devon_prep", "pov_switch": null, "pov_switch_name": null}, {"id": "s_vanish_in_crowd", "text": "在滑铁卢人潮中曲折回旋，彻底切断贝克街眼线的任何追踪可能。", "target": "stapleton_ch5_devon_prep", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_ch5_devon_prep": {"id": "stapleton_ch5_devon_prep", "title": "第五章 返回大格林盆泥潭", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "anchor", "anchor_name": "anchor_london_mission", "content": "亨利·巴斯克维尔那只穿过的旧黑皮靴，已被我用涂油丝绸妥帖裹好藏在手提箱底。我登上了返回德文郡的特快列车。亨利与那位迟钝的军医华生将在两天后抵达，他们满以为那位伦敦大侦探会在此案中护佑左右，殊不知贝克街已经被我远远甩在了身后。\n\n梅利琵宅邸的戏台已经搭好。大格林盆泥潭深处废弃锡矿棚里的那头混血恶兽，已经整整绝食了两天。只待将这只散发着猎物浓郁气息的旧皮靴送到它涎水淋漓的巨吻之下。", "is_ending": false, "clues": ["已取得沾染亨利爵士体味的旧皮靴供猎犬嗅闻", "梅利琵宅邸陷阱已备，静候华生与爵士到来"], "choices": [{"id": "s_to_mire_kennel", "text": "踏上隐秘的沼泽栈道，前往泥潭孤岛展开恶犬的气味嗜血训练。", "target": "stapleton_start", "pov_switch": null, "pov_switch_name": null}, {"id": "s_to_merripit_prep", "text": "返回梅利琵宅邸彻底威慑贝瑟尔，为年轻爵士的踏入布设致命鸿门宴。", "target": "stapleton_start", "pov_switch": null, "pov_switch_name": null}]}, "watson_start": {"id": "watson_start", "title": "第六章 抵达达特沼地", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "anchor", "anchor_name": "anchor_arrival", "content": "列车在德文郡达特沼地的小站颤抖着停了下来。十月的寒风夹杂着凄清与荒凉，从高耸黝黑的花岗石山岗上呼啸吹来。亨利·巴斯克维尔爵士踏上了石子月台，端正了一下粗花呢猎帽。持枪的骑警在铁道两侧来回巡逻——臭名昭著的逃犯塞尔登刚刚从王子镇大监狱脱逃。\n\n歇洛克·福尔摩斯先生将亨利爵士的安危托付于我。当我们乘坐的双轮敞篷马车向着暮色中阴森对峙的巴斯克维尔双塔疾驰而去时，那片辽阔苍茫的大沼地在眼前伸展开来，宛如一片凝固而沉寂的波涛巨浪。", "is_ending": false, "clues": ["沼地上搜捕逃犯塞尔登的武装卫兵"], "choices": [{"id": "w_to_hall", "text": "直接前往巴斯克维尔庄园，向神色慌乱的总管白瑞摩探询内情。", "target": "watson_baskerville_hall", "pov_switch": null, "pov_switch_name": null}, {"id": "w_to_alley", "text": "先勘察查尔兹爵士猝死的水松夹道与通往沼地的栅门边缘。", "target": "watson_yew_alley", "pov_switch": null, "pov_switch_name": null}, {"id": "w_to_stapleton", "text": "沿着荒原边缘独自行走，前往附近的梅利琵宅邸拜访邻里。", "target": "watson_meet_stapleton", "pov_switch": null, "pov_switch_name": null}]}, "watson_baskerville_hall": {"id": "watson_baskerville_hall", "title": "巴斯克维尔庄园的阴影", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "branch", "anchor_name": null, "content": "巴斯克维尔庄园是一座被常春藤遮蔽的古老花岗石宅邸，到处弥漫着阴暗与霉烂的气息。总管白瑞摩虽以深沉周到的礼数接待了我们，但他那双黑眼睛却闪烁着难以掩饰的局促与心神不宁。午夜时分，长廊深处竟隐隐传来白瑞摩太太压抑而凄凉的抽泣声。\n\n我必须查明白瑞摩夫妇究竟在隐瞒什么，还是应当按照福尔摩斯的叮嘱，前往考姆·特雷西调查查尔兹爵士生前通信的另一端。", "is_ending": false, "clues": ["白瑞摩惊慌失措的神情", "深夜宅邸长廊中的女人哭泣声"], "choices": [{"id": "w_watch_barrymore", "text": "在深夜走廊中设下伏击暗哨，暗中监视白瑞摩鬼祟的夜行举动。", "target": "watson_night_watch", "pov_switch": null, "pov_switch_name": null}, {"id": "w_visit_lyons", "text": "雇佣轻便双轮车前往考姆·特雷西，当面质询那位神秘的劳拉·里昂斯夫人。", "target": "watson_laura_lyons", "pov_switch": null, "pov_switch_name": null}]}, "watson_yew_alley": {"id": "watson_yew_alley", "title": "水松夹道与通往沼地的栅门", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "branch", "anchor_name": null, "content": "水松夹道是一条被十二英尺高茂密水松树篱紧紧围拢的长道，幽深如隧道。在长道的尽头处，一道简陋的小栅门直通那片浩瀚无垠的达特沼地。数月前的深夜，查尔兹爵士曾在此站立良久，弹落了两次雪茄烟灰，随后便陷入狂乱奔逃骤然猝死。\n\n摩梯末医生那令人胆寒的耳语仍在我耳际回响：‘福尔摩斯先生，那地上分明是一只极大的猎狗的爪印！’栅门之外，几丛石楠植物在秋风中瑟瑟发抖，荒原小径蜿蜒伸向致命的大格林盆泥潭深处。", "is_ending": false, "clues": ["栅门处的雪茄烟灰残余", "伸向荒原深处的野草折痕"], "choices": [{"id": "w_alley_to_mire", "text": "穿过水松夹道栅门，顺着荒地小径探向远方的梅利琵宅邸。", "target": "watson_meet_stapleton", "pov_switch": null, "pov_switch_name": null}, {"id": "w_alley_to_hall", "text": "返回庄园主楼，与亨利爵士汇合并筹备今夜的长廊守夜。", "target": "watson_night_watch", "pov_switch": null, "pov_switch_name": null}]}, "watson_meet_stapleton": {"id": "watson_meet_stapleton", "title": "大格林盆泥潭的博物学家", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "branch", "anchor_name": null, "content": "一个身形干练、手持捕蝶网和铁皮标本盒的男子在泥沼旁向我招手。他自称杰克·斯台普吞，梅利琵宅邸的博物学家。正当交谈间，一匹误入沼地的矮种马踏上了那片鲜绿的草皮，仅仅数秒间，沼泥便狂暴地吞噬了马匹的四蹄与脊背，在一阵凄惨的悲鸣中彻底沉没无踪！\n\n‘一步之差便是灭顶之灾，’斯台普吞微笑着说。片刻后，他的胞妹贝瑟尔·斯台普吞小姐仓皇赶来。在浓雾中，她误将我当成了亨利爵士，紧紧抓住我的衣袖，急迫而凄厉地颤声道：‘快回伦敦去！今晚就走，永远别再回来！’", "is_ending": false, "clues": ["大格林盆泥潭吞噬活物的绝险沼径", "贝瑟尔绝望而迫切的警告"], "choices": [{"id": "w_interrogate_beryl", "text": "将斯台普吞小姐拉至岩石旁，追问她这绝望预警的背后缘由。", "target": "watson_beryl_warning", "pov_switch": null, "pov_switch_name": null}, {"id": "w_return_with_caution", "text": "保持警惕，不当着杰克·斯台普吞的面打草惊蛇，折返庄园报告。", "target": "watson_night_watch", "pov_switch": null, "pov_switch_name": null}]}, "watson_beryl_warning": {"id": "watson_beryl_warning", "title": "凄切的低语警告", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "branch", "anchor_name": null, "content": "当斯台普吞小姐得知我是华生医生而非巴斯克维尔继承人时，面色惨白如纸。‘忘掉我刚才说的话吧！’她颤声哀求，眼眸中却翻涌着极度的恐惧，‘我哥哥绝不能知道我同你交谈过。但是危险正在这片沼地上的每一块岩石后潜伏！倘若你在乎亨利爵士的性命，立刻带他逃离此地！’\n\n暮色沉沉降临。我回眸远眺，只见在黑色岩岗那高耸入云的荒凉峰顶上，月华如水，一个孤单高大的黑影正如雕像般迎风屹立，冷冷注视着整座原野。", "is_ending": false, "clues": ["屹立在黑色岩岗顶端的神秘黑影", "贝瑟尔对兄长斯台普吞的极度畏惧"], "choices": [{"id": "w_beryl_to_watch", "text": "火速赶回巴斯克维尔庄园，寸步不离贴身保护亨利爵士。", "target": "watson_night_watch", "pov_switch": null, "pov_switch_name": null}, {"id": "w_scout_the_tor", "text": "攀登乱石嶙峋的花岗石孤峰，查探那位神秘的岩岗窥探者。", "target": "watson_stalk_figure", "pov_switch": null, "pov_switch_name": null}]}, "watson_night_watch": {"id": "watson_night_watch", "title": "西窗上的烛光", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "anchor", "anchor_name": "anchor_convict", "content": "凌晨两点，我和亨利爵士悄无声息地潜行在漆黑的回廊中。总管白瑞摩手持蜡烛伫立在西窗前，向着漆黑一片的荒原打出忽明忽暗的火光信号！在我们严厉逼问下，他痛哭承认：逃犯塞尔登正是白瑞摩太太的亲生胞弟！\n\n就在此刻，夜风中陡然自死寂的沼地深处腾起一声漫长、凄绝、撕心裂肺的狂暴狂吠！那声音在夜空中回荡震颤，不似寻常狼犬，而是充满了地狱恶魔般的狞恶杀气，令听者血凝心悸！", "is_ending": false, "clues": ["白瑞摩利用烛光向逃犯塞尔登报信", "深夜原野上那声毛骨悚然的狂吠"], "choices": [{"id": "w_pursue_moor", "text": "拔出左轮手枪，同亨利爵士冲入黑夜沼地，循着烛火信号追踪逃犯。", "target": "watson_moor_pursuit", "pov_switch": null, "pov_switch_name": null}, {"id": "w_track_watcher", "text": "将逃犯留待警方搜捕，集中精力暗查岩岗顶峰那位行踪莫测的监视者。", "target": "watson_stalk_figure", "pov_switch": null, "pov_switch_name": null}]}, "watson_moor_pursuit": {"id": "watson_moor_pursuit", "title": "荒原石丘上的追击", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "branch", "anchor_name": null, "content": "冰冷的雨丝刺痛了我和亨利爵士的脸颊。在忽明忽灭的闪电与微弱月光下，我们窥见了逃犯塞尔登那犹如野兽般粗犷凶狞的面孔。亨利爵士举枪射击，子弹在花岗岩上迸出火花，逃犯敏捷如猿猴般没入了犬牙交错的巨石阵中。\n\n我猛然抬头望向穿破云层的皓月——在不远处的尖耸石岗之巅，赫然伫立着另一个神秘人！那人身形消瘦修长，披着深色斗篷，双手抱臂，以君临大地般冷静深邃的目光俯瞰着这场惊心动魄的夜猎。", "is_ending": false, "clues": ["石岗顶峰那黑影身姿颀长，神态镇定从容"], "choices": [{"id": "w_follow_second_man", "text": "攀上陡峭的山岩，顺着脚印搜查那黑影落脚的史前石屋巢穴。", "target": "watson_stalk_figure", "pov_switch": null, "pov_switch_name": null}, {"id": "w_switch_to_holmes", "text": "【转换视角：切换至歇洛克·福尔摩斯在荒原石屋中的行动】", "target": "holmes_hut_interior", "pov_switch": "holmes", "pov_switch_name": "歇洛克·福尔摩斯"}]}, "watson_stalk_figure": {"id": "watson_stalk_figure", "title": "史前石屋中的窥探", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "branch", "anchor_name": null, "content": "我小心翼翼地攀上远古不列颠人遗留下的圆形石屋。屋内避风处铺着粗呢毯子，摆放着面包与牛舌肉罐头。在一块平整的花岗石板上，赫然躺着一枚抽剩的香烟蒂——上面清晰印着‘牛津街布莱德雷商店’字样！旁边还有一张铅笔草签：‘华生医生已前往考姆·特雷西。’\n\n门口光线陡然暗了下来。一具高挑的身影投射在石壁之上，一只手静静搭在石门框边。", "is_ending": false, "clues": ["布莱德雷商店的精制烟头", "记录着华生行踪的侦查便条"], "choices": [{"id": "w_wait_gun_drawn", "text": "扳开左轮手枪机头，厉声喝令来者举起双手投降！", "target": "watson_hut_reunion", "pov_switch": null, "pov_switch_name": null}, {"id": "w_flank_hut", "text": "侧身滑出石屋死角，自乱石背侧包抄伏击来客！", "target": "holmes_moor_ambush", "pov_switch": null, "pov_switch_name": null}]}, "watson_laura_lyons": {"id": "watson_laura_lyons", "title": "劳拉·里昂斯夫人的秘密", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "branch", "anchor_name": null, "content": "在考姆·特雷西，神色凄楚的劳拉·里昂斯夫人在我严词追问下掩面痛哭：‘是杰克·斯台普吞！是他指使我给查尔兹爵士写信，约他深夜在水松夹道栅门相会资助我的离婚官司！可到了最后一刻，他却严厉勒令我绝不可赴约，声称他自己会妥善料理一切……’\n\n真相犹如霹雳般在我脑海中炸裂！查尔兹爵士是在斯台普吞蓄意诱导的约会中，迎面遭遇了那头恶魔巨兽！", "is_ending": false, "clues": ["斯台普吞指使诱骗查尔兹爵士夜赴死地的铁证"], "choices": [{"id": "w_lyons_to_hut", "text": "火速折回原野寻找那位神秘隐士，合力揭发斯台普吞的弑亲毒计。", "target": "watson_hut_reunion", "pov_switch": null
