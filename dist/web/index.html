heir in Canada. In any case he would very soon learn it from his friend Dr. Mortimer, and he was told by the latter all details about the arrival of Henry Baskerville. Stapleton’s first idea was that this young stranger from Canada might possibly be done to death in London without coming down to Devonshire at all. He distrusted his wife ever since she had refused to help him in laying a trap for the old man, and he dared not leave her long out of his sight for fear he should lose his influence over her. It was for this reason that he took her to London with him. They lodged, I find, at the Mexborough Private Hotel, in Craven Street, which was actually one of those called upon by my agent in search of evidence. Here he kept his wife imprisoned in her room while he, disguised in a beard, followed Dr. Mortimer to Baker Street and afterwards to the station and to the Northumberland Hotel. His wife had some inkling of his plans; but she had such a fear of her husband—a fear founded upon brutal ill-treatment—that she dare not write to warn the man whom she knew to be in danger. If the letter should fall into Stapleton’s hands her own life would not be safe. Eventually, as we know, she adopted the expedient of cutting out the words which would form the message, and addressing the letter in a disguised hand. It reached the baronet, and gave him the first warning of his danger.\n\n“It was very essential for Stapleton to get some article of Sir Henry’s attire so that, in case he was driven to use the dog, he might always have the means of setting him upon his track. With characteristic promptness and audacity he set about this at once, and we cannot doubt that the boots or chamber-maid of the hotel was well bribed to help him in his design. By chance, however, the first boot which was procured for him was a new one and, therefore, useless for his purpose. He then had it returned and obtained another—a most instructive incident, since it proved conclusively to my mind that we were dealing with a real hound, as no other supposition could explain this anxiety to obtain an old boot and this indifference to a new one. The more _outré_ and grotesque an incident is the more carefully it deserves to be examined, and the very point which appears to complicate a case is, when duly considered and scientifically handled, the one which is most likely to elucidate it.\n\n“Then we had the visit from our friends next morning, shadowed always by Stapleton in the cab. From his knowledge of our rooms and of my appearance, as well as from his general conduct, I am inclined to think that Stapleton’s career of crime has been by no means limited to this single Baskerville affair. It is suggestive that during the last three years there have been four considerable burglaries in the west country, for none of which was any criminal ever arrested. The last of these, at Folkestone Court, in May, was remarkable for the cold-blooded pistolling of the page, who surprised the masked and solitary burglar. I cannot doubt that Stapleton recruited his waning resources in this fashion, and that for years he has been a desperate and dangerous man.\n\n“We had an example of his readiness of resource that morning when he got away from us so successfully, and also of his audacity in sending back my own name to me through the cabman. From that moment he understood that I had taken over the case in London, and that therefore there was no chance for him there. He returned to Dartmoor and awaited the arrival of the baronet.”\n\n“One moment!” said I. “You have, no doubt, described the sequence of events correctly, but there is one point which you have left unexplained. What became of the hound when its master was in London?”\n\n“I have given some attention to this matter and it is undoubtedly of importance. There can be no question that Stapleton had a confidant, though it is unlikely that he ever placed himself in his power by sharing all his plans with him. There was an old manservant at Merripit House, whose name was Anthony. His connection with the Stapletons can be traced for several years, as far back as the school-mastering days, so that he must have been aware that his master and mistress were really husband and wife. This man has disappeared and has escaped from the country. It is suggestive that Anthony is not a common name in England, while Antonio is so in all Spanish or Spanish-American countries. The man, like Mrs. Stapleton herself, spoke good English, but with a curious lisping accent. I have myself seen this old man cross the Grimpen Mire by the path which Stapleton had marked out. It is very probable, therefore, that in the absence of his master it was he who cared for the hound, though he may never have known the purpose for which the beast was used.\n\n“The Stapletons then went down to Devonshire, whither they were soon followed by Sir Henry and you. One word now as to how I stood myself at that time. It may possibly recur to your memory that when I examined the paper upon which the printed words were fastened I made a close inspection for the water-mark. In doing so I held it within a few inches of my eyes, and was conscious of a faint smell of the scent known as white jessamine. There are seventy-five perfumes, which it is very necessary that a criminal expert should be able to distinguish from each other, and cases have more than once within my own experience depended upon their prompt recognition. The scent suggested the presence of a lady, and already my thoughts began to turn towards the Stapletons. Thus I had made certain of the hound, and had guessed at the criminal before ever we went to the west country.\n\n“It was my game to watch Stapleton. It was evident, however, that I could not do this if I were with you, since he would be keenly on his guard. I deceived everybody, therefore, yourself included, and I came down secretly when I was supposed to be in London. My hardships were not so great as you imagined, though such trifling details must never interfere with the investigation of a case. I stayed for the most part at Coombe Tracey, and only used the hut upon the moor when it was necessary to be near the scene of action. Cartwright had come down with me, and in his disguise as a country boy he was of great assistance to me. I was dependent upon him for food and clean linen. When I was watching Stapleton, Cartwright was frequently watching you, so that I was able to keep my hand upon all the strings.\n\n“I have already told you that your reports reached me rapidly, being forwarded instantly from Baker Street to Coombe Tracey. They were of great service to me, and especially that one incidentally truthful piece of biography of Stapleton’s. I was able to establish the identity of the man and the woman and knew at last exactly how I stood. The case had been considerably complicated through the incident of the escaped convict and the relations between him and the Barrymores. This also you cleared up in a very effective way, though I had already come to the same conclusions from my own observations.\n\n“By the time that you discovered me upon the moor I had a complete knowledge of the whole business, but I had not a case which could go to a jury. Even Stapleton’s attempt upon Sir Henry that night which ended in the death of the unfortunate convict did not help us much in proving murder against our man. There seemed to be no alternative but to catch him red-handed, and to do so we had to use Sir Henry, alone and apparently unprotected, as a bait. We did so, and at the cost of a severe shock to our client we succeeded in completing our case and driving Stapleton to his destruction. That Sir Henry should have been exposed to this is, I must confess, a reproach to my management of the case, but we had no means of foreseeing the terrible and paralyzing spectacle which the beast presented, nor could we predict the fog which enabled him to burst upon us at such short notice. We succeeded in our object at a cost which both the specialist and Dr. Mortimer assure me will be a temporary one. A long journey may enable our friend to recover not only from his shattered nerves but also from his wounded feelings. His love for the lady was deep and sincere, and to him the saddest part of all this black business was that he should have been deceived by her.\n\n“It only remains to indicate the part which she had played throughout. There can be no doubt that Stapleton exercised an influence over her which may have been love or may have been fear, or very possibly both, since they are by no means incompatible emotions. It was, at least, absolutely effective. At his command she consented to pass as his sister, though he found the limits of his power over her when he endeavoured to make her the direct accessory to murder. She was ready to warn Sir Henry so far as she could without implicating her husband, and again and again she tried to do so. Stapleton himself seems to have been capable of jealousy, and when he saw the baronet paying court to the lady, even though it was part of his own plan, still he could not help interrupting with a passionate outburst which revealed the fiery soul which his self-contained manner so cleverly concealed. By encouraging the intimacy he made it certain that Sir Henry would frequently come to Merripit House and that he would sooner or later get the opportunity which he desired. On the day of the crisis, however, his wife turned suddenly against him. She had learned something of the death of the convict, and she knew that the hound was being kept in the outhouse on the evening that Sir Henry was coming to dinner. She taxed her husband with his intended crime, and a furious scene followed in which he showed her for the first time that she had a rival in his love. Her fidelity turned in an instant to bitter hatred, and he saw that she would betray him. He tied her up, therefore, that she might have no chance of warning Sir Henry, and he hoped, no doubt, that when the whole countryside put down the baronet’s death to the curse of his family, as they certainly would do, he could win his wife back to accept an accomplished fact and to keep silent upon what she knew. In this I fancy that in any case he made a miscalculation, and that, if we had not been there, his doom would none the less have been sealed. A woman of Spanish blood does not condone such an injury so lightly. And now, my dear Watson, without referring to my notes, I cannot give you a more detailed account of this curious case. I do not know that anything essential has been left unexplained.”\n\n“He could not hope to frighten Sir Henry to death as he had done the old uncle with his bogie hound.”\n\n“The beast was savage and half-starved. If its appearance did not frighten its victim to death, at least it would paralyze the resistance which might be offered.”\n\n“No doubt. There only remains one difficulty. If Stapleton came into the succession, how could he explain the fact that he, the heir, had been living unannounced under another name so close to the property? How could he claim it without causing suspicion and inquiry?”\n\n“It is a formidable difficulty, and I fear that you ask too much when you expect me to solve it. The past and the present are within the field of my inquiry, but what a man may do in the future is a hard question to answer. Mrs. Stapleton has heard her husband discuss the problem on several occasions. There were three possible courses. He might claim the property from South America, establish his identity before the British authorities there and so obtain the fortune without ever coming to England at all, or he might adopt an elaborate disguise during the short time that he need be in London; or, again, he might furnish an accomplice with the proofs and papers, putting him in as heir, and retaining a claim upon some proportion of his income. We cannot doubt from what we know of him that he would have found some way out of the difficulty. And now, my dear Watson, we have had some weeks of severe work, and for one evening, I think, we may turn our thoughts into more pleasant channels. I have a box for _Les Huguenots_. Have you heard the De Reszkes? Might I trouble you then to be ready in half an hour, and we can stop at Marcini’s for a little dinner on the way?”\n\nTHE END\n\n*** END OF THE PROJECT GUTENBERG EBOOK 2852 ***", "is_ending": true, "clues": ["Jack Stapleton captured at dawn, convicted at the Old Bailey on Mrs. Stapleton's testimony, and sentenced to the gallows"], "choices": []}, "holmes_ch01_part1_observation": {"id": "holmes_ch01_part1_observation", "title": "Chapter 1: Mr. Sherlock Holmes (Part I: The Science of Deduction)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "anchor", "anchor_name": "anchor_chapter1_holmes", "content": "The autumn sun broke through the yellow haze of Baker Street, casting pale, slanting rectangles of light across our sitting-room rug. I sat at the breakfast-table, my back deliberately turned towards the hearth, leaning back in my armchair while the bitter steam from my black coffee curled upward. In the polished convex surface of the silver-plated coffeepot before me, the whole room was distorted into a miniature, curved panorama: the bookshelf, the coal-scuttle, and the upright, earnest figure of Dr. John H. Watson standing upon the bearskin rug.\n\nFor ten full minutes Watson had been turning over the heavy walking stick left behind by our unknown nocturnal visitor. I watched his reflection with silent relish. His brow was furrowed into deep ridges of concentration; he squinted through his brows, tapped the wood against his knuckles, and held the silver band up to the morning light as though he were deciphering a Greek palimpsest.\n\n“Well, Watson,” said I softly, without turning my head, “what do you make of it?”\n\nHe started violently, nearly fumbling the cane. “How in heaven’s name did you know what I was doing?” he gasped, blinking at my shoulders. “I could swear you have eyes in the back of your head, Holmes!”\n\n“I have, at least, a very well-polished silver-plated coffee-pot in front of me,” I replied with a dry chuckle, turning my chair round to face him. “You see, Watson, you provide me with perpetual entertainment. Since we were so unfortunate as to miss our caller last evening and had no inkling of his errand, this accidental souvenir becomes an object of capital importance. Come, let me hear you reconstruct the man by a rigorous examination of his stick.”\n\nWatson squared his shoulders, cleared his throat, and assumed that peculiarly grave, judicial expression which he reserves for medical consultations. “I think,” said he, following as best he could the methods I had so frequently demonstrated, “that Dr. Mortimer is a successful, elderly medical man, held in high esteem, since those who know him have bestowed this mark of appreciation upon him.”\n\n“Good!” I nodded encouragingly. “Admirable!”\n\n“I think also that the probability is in favour of his being a country practitioner who does a great deal of his visiting on foot.”\n\n“Why so?”\n\n“Because this stick, though originally a handsome piece of timber, has been so knocked about that I can hardly imagine a town practitioner carrying it. The thick iron ferrule is worn down to half its depth, so it is evident that he has done an immense amount of rough walking with it.”\n\n“Perfectly sound!” said I. “Your observation of the ferrule does you credit.”\n\n“And then again,” Watson continued, visibly flushed with triumph, “there is the engraving: ‘To James Mortimer, M.R.C.S., from his friends of the C.C.H., 1884.’ I should hazard a guess that C.C.H. stands for the Something Hunt—the Charlington or Cambridgeshire Hunt—to whose sportsmen he has rendered some timely surgical aid, in return for which they presented him with this sturdy Penang lawyer.”\n\nI pushed back my chair, struck a wax match, and lit my morning pipe of pungent shag tobacco. “Really, Watson, you excel yourself. I am bound to say that in all the accounts with which you have favoured the public regarding my own small achievements, you habitually underrate your own faculties. It may be that you are not yourself luminous, but you are undeniably a conductor of light! Some men, lacking genius themselves, possess an extraordinary power of stimulating it in others. I confess, my dear fellow, that I am deeply in your debt.”\n\nWatson beamed with an honest, boyish pride that was touching to witness. It was almost cruel to dispel so innocent a satisfaction, yet the severe laws of science cannot bow to sentiment. I reached out and took the stick from his grasp, placing it across my knees beneath the bright glare of my pocket magnifying lens.\n\n“Interesting, though elementary,” I remarked, tracing the grain of the wood. “There are certainly several distinct indications upon this timber which furnish the basis for half a dozen certain deductions. I am afraid, my dear Watson, that most of your conclusions were completely erroneous.”\n\nWatson’s smile faded into an injured pucker. “Erroneous? Has anything of consequence escaped me?”\n\n“Almost everything of capital importance,” I answered, rotating the cane beneath the glass. “Consider the facts. When I said that you stimulated me, I meant that in noting your fallacies I was guided directly towards the truth. First: could a man presented with this stick be an elderly, established physician? Assuredly not. The initials C.C.H. do not stand for a hunt; hunts do not present modest Penang lawyers, nor do they append the letters of medical qualification. Turn your gaze to the Medical Directory on the shelf behind you. C.C.H. is Charing Cross Hospital. And who receives a presentation upon leaving a great London hospital? Only a young house-surgeon or house-physician who has completed his residency! The date is 1884—precisely five years ago. Our man is therefore not an elderly, venerable practitioner, but a young fellow under thirty, amiable, unambitious, absent-minded, and the possessor of a beloved dog.”\n\n“A dog!” cried Watson in sheer bewilderment. “Where on earth do you find a dog?”\n\nI pointed the tip of my lens at the middle of the shaft. “Here, running horizontally across the wood, are unmistakable tooth-impressions. The marks of the canine teeth are clearly defined. A dog has carried this stick behind its master by the balance-point. Look at the breadth of the jaw: too broad for a terrier, yet far too narrow for a mastiff. Notice the tiny white curl of canine hair lodged in the rough grain near the lower tooth-dent. It is, beyond question, a curly-haired spaniel.”\n\nAs the words left my lips, the sharp clatter of paws echoed from the pavement below, followed by the firm jangle of our front-door bell. I glanced through the lace curtains to the street.\n\n“And there, Watson,” I added with a smile, “stands the gentleman in question: a tall, thin figure in tweed, with a curly-haired spaniel panting at his heels!”", "is_ending": false, "clues": ["Mortimer walking stick worn iron ferrule indicates rural gravel walking", "C.C.H. 1884 inscription resolves to Charing Cross Hospital house-surgeon", "Tooth impressions identify a curly-haired spaniel retriever"], "choices": [{"id": "h_ch1_p1_c1", "text": "Greet Dr. James Mortimer and invite him to explain his extraordinary visit.", "target": "holmes_ch01_part2_consultation", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch1_p1_c2", "text": "[Switch POV to Dr. Watson] View Mortimer from Watson’s sympathetic gaze.", "target": "ch01_part2_mortimer", "pov_switch": "watson", "pov_switch_name": "Dr. John H. Watson"}]}, "holmes_ch01_part2_consultation": {"id": "holmes_ch01_part2_consultation", "title": "Chapter 1: Mr. Sherlock Holmes (Part II: The 1742 Manuscript)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "The door opened to the measured tread of our visitor. Dr. James Mortimer was an extraordinarily tall, thin man with a long beak of a nose projecting between two keen, grey eyes that twinkled brightly from behind a pair of gold-rimmed spectacles. His frock-coat was dingy and his trousers frayed, yet there was that in his bearing which bespoke the scholar. To my infinite amusement, the curly-haired spaniel made an immediate dart for the hearth-rug, curling up with a heavy canine sigh.\n\n“I had feared,” said our visitor, bowing with formal old-world courtesy, “that I might have left my walking stick here last night. I would not lose that stick for the world.”\n\n“A presentation, I observe,” said I.\n\n“Yes, sir, from friends at Charing Cross Hospital on the occasion of my marriage.”\n\n“Ah! Your marriage!” I shot a glance of malicious triumph at Watson, whose jaw slackened in rueful surrender. “And you retired to the country?”\n\n“Precisely, Mr. Holmes. I married and settled in Grimpen, Dartmoor, where my scientific pursuits in comparative pathology and craniology could be conducted far from the noise of London.” Mortimer suddenly fixed his gaze upon my brow with unmasked scientific passion. “Indeed, sir, you have an extraordinary skull! I had hardly expected such marked dolichocephalic development with such well-pronounced supra-orbital ridges. A cast of your skull, Mr. Holmes, until the original becomes available, would be an ornament to any anthropological museum in Europe!”\n\nWatson stared in horror at this cheerful contemplation of my post-mortem cranium. I could not repress a dry smile. “You are an enthusiast in your line of thought, sir, as I am in mine. But I presume it was not merely to examine my parietal bones that you honoured me with your visit?”\n\n“No, sir, no! Though I am happy to have had the opportunity. I come to you, Mr. Holmes, because I am confronted with a problem so singular, so dark, and so completely outside the pale of ordinary human experience that only the second highest expert in Europe could unravel it.”\n\nI stiffened slightly in my armchair. “Indeed, sir? And may I inquire who possesses the honour of being the first?”\n\n“To the man of precisely scientific mind, Monsieur Bertillon of Paris must always claim the pre-eminence,” Mortimer replied with disarming candour.\n\n“Then had you not better consult him?” I asked with freezing politeness.\n\n“Monsieur Bertillon, Mr. Holmes, is a master of physical measurement and classification. But for the balance of forces, the weighing of subtle psychological motives, and the intuitive comprehension of the inexplicable, you stand without a rival. And the matter I bring before you involves the sudden, horrifying death of my friend and patron, Sir Charles Baskerville.”\n\nThe atmosphere of the room shifted in an instant. The faint scientific banter evaporated like morning frost. Sir Charles Baskerville’s death on Dartmoor three months prior had formed a three-line paragraph in the daily press: an elderly philanthropist dying suddenly of heart failure in his garden alley. But the haunted shadow in Mortimer’s eyes told a far more terrible tale.\n\nReaching into his breast-pocket, Mortimer drew forth a thick, yellowed packet of foolscap, folded flat and tied with a faded ribbon of green silk.\n\n“This manuscript,” said Mortimer, laying it upon the breakfast table, “was entrusted to me by Sir Charles Baskerville three months before his lamented end. It is an heirloom of the Baskerville family, written in the year 1742. It sets forth the origin of that ghastly curse which has dogged that ancient house since the days of the Great Rebellion.”\n\nI leaned forward, my pipe resting unheeded in my fingers. “You speak of a family legend, Dr. Mortimer. My practice is confined to this world and the living beings who inhabit it. Are you asking me to investigate an 18th-century ghost?”\n\n“I am asking you, Mr. Holmes,” Mortimer replied, his voice dropping to a trembling whisper, “to hear the ancient chronicle, and then to examine the fresh, bloody footprints that stamped Sir Charles Baskerville into his grave!”", "is_ending": false, "clues": ["Dr. James Mortimer is a passionate physical anthropologist and comparative anatomist", "1742 Baskerville parchment describes the demonic hound curse originating with Hugo Baskerville", "Mortimer considers Holmes the second-highest expert in Europe after Monsieur Bertillon"], "choices": [{"id": "h_ch1_p2_c1", "text": "Listen attentively as Mortimer reads the dark 1742 manuscript aloud.", "target": "holmes_ch02_part1_legend", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch1_p2_c2", "text": "Demand Mortimer skip the ancient myth and present the recent physical evidence.", "target": "holmes_ch02_part2_footprints", "pov_switch": null, "pov_switch_name": null}]}, "holmes_ch02_part1_legend": {"id": "holmes_ch02_part1_legend", "title": "Chapter 2: The Curse of the Baskervilles (Part I: The Legend of Hugo)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": "anchor_curse", "content": "I settled back into the cushions of my settee, my fingers laced across my knee, and watched Dr. Mortimer through half-closed eyelids. Outside, the roar of London traffic was subdued by the heavy autumn fog that pressed against the windowpanes. Inside, the only sound was the rustle of brittle parchment as the physician smoothed out the manuscript of 1742.\n\nWith a solemn, resonant voice that trembled with genuine dread, Mortimer began to read the chronicle:\n\n“Of the origin of the Hound of the Baskervilles there have been many statements, yet as I am lineally descended from Hugo Baskerville, and had it from my father, I have put it down with all credence...”\n\nThe narrative was couched in the quaint, ornate diction of the early Georgian era. It told of this wild, profane Cavalier, Hugo Baskerville, who ruled the ancestral manor with an iron fist during the Great Rebellion. A lawless roisterer, he had conceived an unholy passion for the daughter of a modest yeoman whose lands lay near the estate. Finding his advances spurned, Hugo, aided by five or six desperate companions, rode to the yeoman’s farm on Michaelmas Eve, seized the terrified girl, and carried her off to the Hall, imprisoning her in an upper chamber whilst he and his drunken ruffians caroused below.\n\nThe girl, driven nearly mad by the riotous songs and foul oaths rising through the floorboards, did what might have daunted the bravest man: she climbed through the window, scrambled down the thick mantle of ivy covering the stone wall, and fled out into the black expanse of Dartmoor, running towards her father’s home some nine miles distant.\n\nWhen Hugo discovered her flight, he broke into a frenzy of rage so appalling that his companions drew back in horror. Leaping upon the banqueting table amid the overturned wine-jugs, he swore a terrible oath before God and Satan that he would render his body and soul to the Evil One that very night if he might but overtake the wench. Rushing to the courtyard, he loosed his pack of hounds, thrust the girl’s kerchief to their muzzles, and sprang upon his black mare, spurring furiously out into the moonlit moor.\n\nHis companions, partly sobered by his demonic madness, mounted their horses and galloped after him. For miles across the barren wastes they rode, until they came upon a solitary shepherd shivering upon the crags. Shaking with terror, the man pointed towards a deep granite goyal—a ravine cutting through the peat bog—and swore that he had seen Hugo riding hard upon his black mare, but that galloping close behind him was a hound such as God never made, running silently upon his heels.\n\nDashing forward, the horsemen reached the brink of the goyal. The black mare stood trembling, her flanks white with lather, staring down into the darkness. Half the hounds were whimpering near the edge, while the others crawled away into the heather with tails between their legs.\n\nThe three boldest riders rode down into the amphitheatre. In the center of the clearing lay the dead body of the unhappy maiden, perished of fear and fatigue. But beside her...\n\nMortimer’s voice dropped to a guttural rasp:\n\n“There, standing over the prostrate body of Hugo Baskerville, and plucking at his throat, was a foul thing, a great black beast, shaped like a hound yet larger than any hound that ever mortal eye had rested upon. And even as they looked, the monster tore the throat out of Hugo Baskerville, and turned its blazing eyes and dripping jaws upon them! With screams of terror, the three men spurred their horses and fled for their lives; one died that very night of the horror he had seen, and the other two were broken, gibbering madmen for the remainder of their days.”\n\nMortimer ceased reading. He folded the parchment with shaking hands and looked up at me through his spectacles, his face as pale as chalk.\n\n“Such, Mr. Holmes,” said he, “is the ancient legend. It concludes with an earnest injunction from the chronicler to his sons, that they should never cross the moor in those dark hours when the powers of evil are exalted.”\n\nI took a slow sip of my tepid coffee and suppressed a yawn. “A most picturesque piece of seventeenth-century melodrama,” I remarked coolly. “It would make an admirable nursery tale to frighten refractory children. But surely, Dr. Mortimer, you have not brought me this Gothic relic under the impression that it possesses any bearing upon modern criminal jurisprudence?”\n\n“Mr. Holmes,” said Mortimer, his hands gripping the arms of his chair until the knuckles whitened, “I have read this manuscript because it was Sir Charles Baskerville’s daily terror! He believed every syllable of it with his whole soul. And three months ago, on a night as black as pitch, Sir Charles was found dead at the foot of his garden alley—his face distorted into an expression of mortal agony that no man who beheld it will ever forget!”", "is_ending": false, "clues": ["1742 manuscript details Hugo Baskerville’s profane oath and pursuit of the yeoman’s daughter", "The spectral beast tore Hugo’s jugular vein in the great granite goyal under the moonlight", "The curse warns all heirs never to cross the moor in the dark hours when evil powers are exalted"], "choices": [{"id": "h_ch2_p1_c1", "text": "Cross-examine Mortimer on the physical reality of Sir Charles’s recent demise.", "target": "holmes_ch02_part2_footprints", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch2_p1_c2", "text": "[Switch POV to Jack Stapleton] Discover how the antagonist weaponized this ancient legend.", "target": "stapleton_ch02_part1_laura_trap", "pov_switch": "stapleton", "pov_switch_name": "Jack Stapleton"}]}, "holmes_ch02_part2_footprints": {"id": "holmes_ch02_part2_footprints", "title": "Chapter 2: The Curse of the Baskervilles (Part II: Footprints of a Gigantic Hound)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "I set down my coffee cup, and for the first time since Mortimer had crossed our threshold, my mind locked entirely onto the problem. The ancient myth was mere romantic froth, but a man driven to death by terror in a modern garden—that was solid ground.\n\n“Give me the facts, Dr. Mortimer,” I commanded, leaning forward, my eyes fixed upon his countenance. “Omit nothing. The official inquest returned a verdict of death by natural causes, did it not?”\n\n“It did, Mr. Holmes. The county coroner found that Sir Charles had suffered from long-standing neurosis and cardiac degeneration. His heart failed while he was taking his customary evening walk down the famous Yew Alley of Baskerville Hall. The medical evidence showed no trace of violence.”\n\n“And your own examination?”\n\n“I arrived at the scene within an hour of the discovery of the body,” Mortimer said, his voice lowering until it vibrated with suppressed excitement. “The local authorities saw only what was obvious. They noted that the gate leading to the open moor was unlatched. They saw that Sir Charles lay fifty yards from the gate, face downward upon the gravel path. But they did not see what I saw, Mr. Holmes, because they did not know how to look!”\n\n“Tell me what you saw.”\n\n“The Yew Alley,” Mortimer explained, gesturing with his long, bony fingers, “is a double line of old, impenetrable yew trees, twelve feet high, forming a tunnel down the eastern side of the Hall grounds. Outside the hedge lies the boundless moor. Midway down the alley is a wicket gate opening out into the heather. Now, observe: Sir Charles had walked from the house down to this wicket gate. There he had stood for some time—I calculated five to ten minutes at least, for the ash had dropped twice from his cigar upon the gravel.”\n\n“Excellent!” I ejaculated. “This man is a colleague after your own heart, Watson! He noted the ash!”\n\nMortimer bowed slightly. “Sir Charles had leaned his arms upon the wooden gate, looking out across the dark moor. And then—something occurred. Something so appalling that he turned and fled for his life back towards the house. But he did not run as an ordinary man runs.”\n\n“How did he run?”\n\n“He ran upon his tiptoes!” Mortimer whispered. “His tracks altered completely. The heel marks vanished. He bounded down that dark alley upon his toes, like a man possessed, his stride lengthening with frenzied panic, until his diseased heart burst beneath the strain and he pitched forward into the grass, his fingernails digging deep into the turf!”\n\nI sprang to my feet and began to pace the room. The scent of a true problem was in my nostrils. “And you say he was running away from the gate? Towards the house?”\n\n“Towards the Hall.”\n\n“And what lay beyond the gate?”\n\n“The open moor, Mr. Holmes. Miles of desolate heather and peat bog.”\n\n“And now, Dr. Mortimer—the central fact. Why did you say the inquest did not know the truth?”\n\nThe physician looked nervously at Watson, then back to me. He swallowed hard before answering. “Mr. Holmes, the coroner asked me if there were any marks upon the gravel near the body. I answered that there were none. But he did not ask me what was upon the damp, soft peat beside the pathway!”\n\n“And what was there?”\n\n“I walked twenty yards beyond the spot where Sir Charles had fallen, where the path passes near a moist depression in the soil. There, fresh and clearly defined in the black loam, were marks.”\n\n“Footprints?”\n\n“Yes, footprints.”\n\n“A man’s or a woman’s?”\n\nDr. Mortimer looked at us for a moment, and his voice sank into a whisper that chilled the room:\n\n“Mr. Holmes, they were the footprints of an enormous hound!”\n\nI stopped dead in my tracks. “You saw them yourself?”\n\n“As clearly as I see you now.”\n\n“And they were fresh?”\n\n“The night was damp and drizzling; the edges of the impressions were sharp and moist. They were the prints of a dog of gigantic proportions—a creature such as no keeper on the moor has ever bred.”\n\n“And did they approach the body?”\n\n“No. They circled the moor-gate, twenty yards distant, and then turned back towards the Great Grimpen Mire.”\n\nI rubbed my chin, my pulses racing. “This is deep water, Watson,” I murmured. “Deep and perilous water. And what is your immediate objective in consulting me, Dr. Mortimer?”\n\n“Tomorrow morning, Mr. Holmes,” the doctor replied, “Sir Henry Baskerville—the sole surviving nephew, son of Sir Charles’s younger brother—arrives at Waterloo from Canada to take possession of the title and the estate of £740,000. He is the last of the direct bloodline. What in God’s name am I to do with him?”", "is_ending": false, "clues": ["Sir Charles stood smoking for 5 to 10 minutes at the Yew Alley gate, dropping ash twice", "Footprints changed from flat heel-to-toe walking to running on tiptoes down the alley", "Twenty yards beyond the body, in the soft moist soil, were the enormous pawprints of a hound"], "choices": [{"id": "h_ch2_p2_c1", "text": "Formulate the operational hypothesis and prepare for Sir Henry’s arrival tomorrow.", "target": "holmes_ch03_problem", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch2_p2_c2", "text": "[Switch POV to Jack Stapleton] See how the mastermind arranged this fatal midnight meeting.", "target": "stapleton_ch02_part2_yew_alley", "pov_switch": "stapleton", "pov_switch_name": "Jack Stapleton"}]}, "holmes_ch03_problem": {"id": "holmes_ch03_problem", "title": "Chapter 3: The Problem (Dartmoor Topography and the Lone Vigil)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": "anchor_london_mission", "content": "When Dr. Mortimer and his panting spaniel had departed down the stairs, the quiet of our room seemed deeper, heavier with the dark freight of the problem left behind.\n\n“Well, Watson,” said I, “what do you think of it?”\n\n“It seems to me,” he replied earnestly, “that if Dr. Mortimer’s belief is well-founded, and some supernatural agency is at work—”\n\n“Ah, the supernatural!” I interrupted, shaking my head. “We have hitherto confined our cases to this planet, Watson. To invoke the supernatural is to confess intellectual bankruptcy. If an actual, physical hound can leave pawprints twenty yards wide in moist Devonshire peat, then that hound has teeth and claws, weighs so many stones, requires so many pounds of butcher’s meat a day, and can be brought down with an ordinary lead bullet from an Adams revolver!”\n\nI turned on my heel and walked to my desk. “Go out, Watson. The day is fine. Go to your club; walk in the park. But leave me alone with this room and my thoughts until dusk. I have a problem here that cannot be solved without a thorough clearing of the ground.”\n\nWhen Watson reluctantly closed the door behind him, I stripped off my frock-coat and pulled on my mouse-coloured dressing gown. From the mantelpiece I fetched down my blackened clay pipe and the Persian slipper containing a pound of strong, pungent shag tobacco. Next, I took from the corner shelf the huge, linen-backed Ordnance Survey map of Dartmoor—drawn to the scale of six inches to the mile—and pinned it across the center of our large oak table.\n\nFor the next eight hours, I did not leave that chair. A blue cloud of rank, suffocating tobacco smoke gathered beneath the ceiling, rolling in dense wreaths until the gas lamps burned like yellow lanterns in a maritime fog.\n\nMy eyes traversed every contour line, every boulder-strewn slope, every treacherous marsh of that wild Devon plateau. There lay Baskerville Hall, an ancient Tudor fortress flanked by its dark yew alley. Beyond it, three miles to the south, stood the sinister circle of the prehistoric stone huts atop the granite monolith of Black Tor. To the east, like a festering wound in the earth, stretched the Great Grimpen Mire—miles of bright green peat-bog concealing bottomless quagmires of liquid mud, where cattle and wandering ponies were swallowed alive in seconds. And nestled along the western margin of that dreadful swamp sat Merripit House, the isolated dwelling of a brother and sister named Stapleton, described in Mortimer’s notes as a naturalist and a schoolmaster.\n\nI lit match after match, watching the yellow flame flare against the map. Two distinct lines of reasoning began to take shape within my mind.\n\nFirst: The weapon. If the hound was flesh and blood, where had it been hidden? It could not be kept in a village kennel without setting every tongue in the county wagging. It required vast quantities of food; it required seclusion; it required an owner who possessed both scientific knowledge and ruthless nerve.\n\nSecond: The motive. Sir Charles had died of cardiac arrest induced by mortal terror. Who stood to gain from his sudden death? The estate was valued at nearly three quarters of a million pounds sterling. If young Sir Henry from Canada were to perish on the moor, who was the next of kin? Mortimer had mentioned an aged, distant cousin named Desmond, a saintly clergyman in Westmorland who had no interest in wealth. Was there another? An unacknowledged branch of the family tree?\n\nI leaned back, inhaling the bitter smoke deeply, watching the embers glow in the darkened room. A cold, methodical, highly cultivated intellect was directing this game. The murderer knew of Sir Charles’s weak heart; he knew of his obsessive superstition regarding the ancestral curse; and he had weaponized an 18th-century ghost story into an instrument of modern assassination!\n\nTomorrow morning, the last direct heir would walk into this room. And behind him, unseen and silent, walked the shadow of the beast.", "is_ending": false, "clues": ["Mortimer requested to meet Sir Henry Baskerville at Waterloo and bring him to 221B at ten tomorrow", "Ordnance Survey map of Dartmoor reveals the topography of Grimpen Mire, Princetown prison, and Black Tor", "Holmes deduces an acute, living intellect is weaponizing the hound superstition to eliminate the heir"], "choices": [{"id": "h_ch3_c1", "text": "Receive Sir Henry Baskerville and examine the warning letter clipped from The Times.", "target": "holmes_ch04_part1_warning", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch3_c2", "text": "[Switch POV to Dr. Watson] Experience Watson’s perspective during the Baker Street smoke vigil.", "target": "ch03_problem", "pov_switch": "watson", "pov_switch_name": "Dr. John H. Watson"}]}, "holmes_ch04_part1_warning": {"id": "holmes_ch04_part1_warning", "title": "Chapter 4: Sir Henry Baskerville (Part I: The Cut Times and the Missing Boot)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "At exactly ten o’clock the following morning, the door opened and Dr. Mortimer ushered into our room the young baronet whose life and fortune hung in the balance. Sir Henry Baskerville was a small, alert, dark-eyed man of about thirty years of age, very sturdily built, with thick black eyebrows and a strong, pugnacious face. He wore a ruddy-tinted tweed suit and possessed the weather-beaten complexion of one who has spent his best years in the open air of the Canadian prairies. Yet there was that calm, steady assurance in his gaze which proclaimed the English gentleman.\n\n“I am delighted to meet you, Mr. Holmes,” said he, shaking hands with a firm, sinewy grip. “If Dr. Mortimer had not suggested our visit, I should have come to you on my own account. I understand that you solve riddles, and I’ve run into one this morning that has completely floored me.”\n\n“Pray take a seat, Sir Henry,” said I, indicating the armchair. “Do I understand that you have already met with some unexpected adventure since your arrival in London?”\n\n“Nothing of serious consequence, perhaps, but queer enough to make a man scratch his head.” He drew an envelope from his breast pocket and tossed it onto the breakfast table. “Look at that.”\n\nThe envelope was of cheap cream-laid paper, addressed in rough, splotchy block capitals: “Sir Henry Baskerville, Northumberland Hotel.” It bore the postmark of Charing Cross and had been mailed the preceding evening.\n\nI unfolded the single sheet of ruled paper inside. Pasted across the center was a single sentence formed of printed words cut out and gummed to the page:\n\n“As you value your life or your reason keep away from the moor.”\n\nOnly the final word, “moor,” had been written in ink.\n\n“Now, Mr. Holmes,” Sir Henry asked, “what on earth can this mean, and who is taking such an interest in my affairs?”\n\n“A singular document,” I murmured, examining it under my pocket lens. “And one that speaks volumes to the trained eye.”\n\n“Can you tell who sent it?”\n\n“I can tell you a great deal about the mechanical circumstances under which it was composed,” I answered, rotating the slip beneath the bright gaslight. “Notice first the print. These words were cut from a leading article of yesterday’s Times. You can recognize the distinctive Bourgeois type used exclusively in the major editorials of that journal. Look at the ragged edge where the word ‘reason’ is severed: it was not cut with shears, but clipped with short-bladed nail scissors. The blade slipped twice; the operator was in frantic haste.”\n\n“In haste?” echoed Watson.\n\n“In desperate haste, and working under extreme agitation,” I replied. “Notice also the gum: it is office mucilage, applied with an unsteady brush. But hold the paper half an inch from your nostrils, Watson. What do you detect?”\n\nWatson sniffed gingerly. “A faint, delicate scent... like flowers.”\n\n“White jessamine,” I declared. “The subtle perfume used by women of refined taste. The hand that wielded those scissors was trembling, and the hand was female! A woman, coerced or terrified by an overbearing master, sat in a hotel sitting room last evening and desperately pasted together this warning to preserve the life of a stranger!”\n\nSir Henry stared at the paper with renewed awe. “By thunder, Mr. Holmes, you see further into a piece of paper than any man I ever met. But wait—that is not the only piece of lunacy that has happened to me!”\n\n“Indeed? Has something else occurred at your hotel?”\n\n“My boot has been stolen!” cried Sir Henry in exasperation. “I bought a pair of handsome tan boots on the Strand yesterday. I put them outside my door last night to be polished. This morning, one of them was gone! The hotel staff searched the entire floor from attic to cellar—vanished into thin air!”\n\n“A new tan boot?” I asked sharply, my pulse quickening. “Had it ever been worn?”\n\n“Never. Not once.”\n\nI leaned back, tapping my pipe bowl against my teeth. The puzzle was becoming crystalline. If an ordinary thief had taken the boot, he would have taken the pair. If a sneak-thief wanted leather, he would steal boots he could sell. But to steal a single boot? A single boot is useless to a thief—unless it is required by a predator seeking a scent! Yet a brand-new boot carries only the smell of factory varnish and calfskin—it possesses no human odour!\n\n“The thief has made an egregious blunder,” I thought silently. “He took the tan boot, discovered it had no scent, and discarded it. He will come back for a worn boot before this day is done!”\n\nI turned to Sir Henry. “Keep your eyes open, my dear sir. We are dealing with an enemy whose cunning matches his ruthlessness. Are you going straight back to your hotel?”\n\n“Dr. Mortimer and I are going to stroll down Regent Street to do a little shopping first,” Sir Henry replied.\n\n“Admirable,” said I. “Watson, fetch your hat and your service revolver. The game is afoot!”", "is_ending": false, "clues": ["Warning letter composed from words clipped with nail scissors from yesterday’s Times leading article", "Faint scent of white jessamine perfume reveals a woman’s involuntary presence in the drafting", "Sir Henry’s brand new unworn tan boot stolen from Northumberland Hotel room corridor"], "choices": [{"id": "h_ch4_p1_c1", "text": "Shadow Sir Henry and Mortimer down Regent Street to flush out their tail.", "target": "holmes_ch04_part2_cab_chase", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch4_p1_c2", "text": "[Switch POV to Jack Stapleton] See Stapleton stalking the baronet from Cab 2704.", "target": "stapleton_ch04_part1_hotel_shadow", "pov_switch": "stapleton", "pov_switch_name": "Jack Stapleton"}]}, "holmes_ch04_part2_cab_chase": {"id": "holmes_ch04_part2_cab_chase", "title": "Chapter 4: Sir Henry Baskerville (Part II: The Shadow in Regent Street)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "We waited until Sir Henry and Dr. Mortimer had descended the stairs and turned down Baker Street before slipping out through the front door. The morning mist had cleared, giving way to a crisp autumn chill. Ahead of us, two hundred yards down the bustling pavement, the tall, stooping figure of Mortimer and the sturdy baronet were clearly discernible.\n\n“Walk on the opposite side of the road, Watson,” I whispered, pulling my soft felt hat low over my eyes. “Keep your pace even. We must not alert them, and above all, we must not alert anyone who may be watching them.”\n\nWe crossed Oxford Street and turned into the broad sweep of Regent Street. The morning shopping traffic was thickening; carriages, omnibuses, and hansoms rattled noisily over the wooden paving blocks. Sir Henry and Mortimer paused before a shop window displaying sporting rifles.\n\nAnd then my eye was caught by an anomaly in the traffic.\n\nA hansom cab had pulled up along the kerb fifty yards behind our two friends. It did not discharge a passenger, nor did the driver raise his whip to solicit fares. Instead, it crawled at a snail’s pace, keeping precisely that distance between its yellow wheels and Sir Henry’s tweed back.\n\nI gripped Watson’s forearm with fingers of steel. “Look, Watson! Look at that cab!”\n\n“I see it. An ordinary hansom.”\n\n“Look at the side window! Look through the side glass!”\n\nThe driver sat high up on his perch, bundled in an oilskin cape. But through the square side glass of the hansom’s cab-body, I caught the unmistakable silhouette of a passenger. A man sat back in the dark interior, leaning forward just far enough to keep his eyes trained on Sir Henry. He had a bushy, square black beard that swept over his coat collar, and the sunlight caught the glint of a pair of gold-rimmed spectacles upon his nose!\n\nA spy! A professional tail, disguised with a heavy false beard!\n\nAt that instant, Sir Henry turned away from the shop and crossed the street. The cab immediately swung round and followed him.\n\n“By heavens, Watson, he’s onto them!” I muttered. “We must have his number! Run!”\n\nWe darted through the stream of omnibuses, dodging a dray horse and plunging straight towards the hansom. But my swift movement had caught the passenger’s vigilant eye. As I reached within thirty paces of the cab, the bearded face turned sharply towards me. For one fraction of a second, our eyes locked—mine blazing with hunting fury, his widening with shock and sudden, razor-sharp recognition.\n\nInstantly, a hand shot upward inside the cab. The trapdoor in the roof slammed shut with a wooden crack. The driver’s whip whistled through the air, cracking across the horse’s flank with the sound of a pistol shot.\n\nThe horse sprang forward like a courser. The hansom bounded over the curb, scattered a cluster of screaming pedestrians, and plunged recklessly into the roaring vortex of traffic converging on Oxford Circus!\n\n“Stop! Stop that cab!” I shouted, sprinting down the pavement.\n\nIt was utterly futile. A heavy brewer’s dray swung across the mouth of the street, blocking our path. By the time Watson and I fought our way past the lumbering shire horses, the hansom was a receding speck disappearing into the maze of Cavendish Square.\n\nI stopped beneath a lamp-post, leaning against the iron standard, breathing hard through my teeth. Yet even in the bitter sting of defeat, a savage satisfaction burned within me.\n\n“Well, Watson,” said I, smiling through my vexation, “we have met a foeman worthy of our steel! Our friend does not lack resource. He spotted me the instant I closed the distance.”\n\n“Did you get his number?” Watson panted.\n\n“No. 2704,” I answered, tapping my notebook. “A registered London cab. That gives us our first handle upon the mystery. And now, Watson, we must return to Baker Street and set our three lines of counter-attack in motion!”", "is_ending": false, "clues": ["Hansom Cab No. 2704 crawled behind Sir Henry and Mortimer down Regent Street", "Passenger possessed a bushy black square beard and gold-rimmed spectacles", "Passenger spotted Holmes, snapped roof trapdoor, and bolted down Oxford Circus"], "choices": [{"id": "h_ch4_p2_c1", "text": "Trace the three broken threads: Cartwright’s hotel search, the wire to Barrymore, and Cabman 2704.", "target": "holmes_ch05_threads", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch4_p2_c2", "text": "[Switch POV to Jack Stapleton] Experience the tension inside Cab 2704 as Holmes gives chase.", "target": "stapleton_ch04_part2_cab_chase", "pov_switch": "stapleton", "pov_switch_name": "Jack Stapleton"}]}, "holmes_ch05_threads": {"id": "holmes_ch05_threads", "title": "Chapter 5: Three Broken Threads (The Insolent Cabman & The Secret Expedition)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": "anchor_threads", "content": "By evening, the three threads upon which I had relied to seize the London conspirator had snapped in my fingers, one by one.\n\nThe first thread was young Cartwright, the messenger boy from the district telegraph office whom I had dispatched to inspect the waste-paper baskets of twenty-three hotels in the Charing Cross district, seeking the mutilated copy of yesterday’s Times. He returned to Baker Street at five o’clock, his face smudged with soot, shaking his head. In twenty-three hotels, not a single sheet of mutilated newsprint had been preserved; the chambermaids had emptied the grates into the furnace hours before his arrival.\n\nThe second thread was my test telegram addressed to Mr. Barrymore, the butler at Baskerville Hall. If Barrymore had been in London shadowing Sir Henry, my telegram—marked “to be delivered into his own hand”—would have been forwarded to the capital or held awaiting his return. But the wire from the postmaster of Grimpen arrived at six: “Telegram delivered as addressed. Mr. Barrymore being in the loft at the time, receipt was signed by his wife.” An ambiguous, maddening result! Barrymore might indeed have been in Devon, or he might have arrived by the morning train, or his wife might have lied to cover his absence.\n\nThere remained the third thread: the driver of Hansom Cab No. 2704.\n\nAt seven o’clock, heavy boots climbed our staircase, and a burly, red-faced cabman in a drab box-coat stood upon our threshold, twisting his bowler hat in his calloused hands.\n\n“John Clayton, sir,” said he, glancing nervously at our bookshelf and the chemical retorts on the side table. “I had a message from the yard that you wanted to see the man who drove cab No. 2704 down Regent Street this morning.”\n\n“Precisely, Mr. Clayton,” said I, tossing a half-sovereign onto the table. “Tell me everything about the fare who engaged you this morning to shadow those two gentlemen.”\n\nClayton’s jaw dropped. “Lord love you, sir! How could you know he was shadowing them? He hailed me at ten o’clock in the Trafalgar Square cab-rank. He told me he was a private detective, and that if I followed a gentleman in tweed and another in black spectacles without being spotted, he’d give me two sovereigns. We followed them to Baker Street, then down to Regent Street, until you came tearing across the street like a mad bull. The moment he saw you, he yelled through the trapdoor: ‘Drive like hell to Waterloo Station, and there’s another guinea for you!’”\n\n“And you drove him to Waterloo?”\n\n“Straight to the station, sir! He jumped out before the cab had even stopped, threw two guineas into my lap, and vanished into the crowd on the platform!”\n\n“Did he say anything before he left you?”\n\nClayton scratched his head, looking distinctly uncomfortable. “Well, sir, as he hopped out, he turned around and grinned at me through his black whiskers. ‘Cabman,’ says he, ‘if anyone asks who your passenger was, tell him that my name is Sherlock Holmes!’”\n\nWatson sprang from his chair with an oath of indignation. For my part, I burst into a roar of laughter.\n\n“A touch, Watson!” I cried, clapping my hands. “An undeniable touch! Our gentleman possesses a sense of humour as well as an iron nerve! He saw that I had marked his cab, he knew that I would trace the driver, and he sends me back his greeting with two sovereigns of insolence! This is no common criminal, Watson. This is a master of the craft!”\n\nAt that moment, the bell rang once more, and Sir Henry Baskerville burst into our sitting-room in a towering rage, accompanied by Mortimer.\n\n“By heaven, Mr. Holmes!” the baronet shouted, slamming his hat onto the sofa. “This hotel of mine is a den of thieves! The joke is played out! Yesterday it was my brand-new tan boot that went missing; this afternoon, while I was washing my hands, someone walked into my bedroom and stole one of my old black boots—the ones I bought in Toronto and wore all across the Atlantic!”\n\nI stopped laughing. In an instant, every trace of mirth vanished from my mind, replaced by a cold, deadly clarity.\n\n“An old black boot?” I asked, my voice dropping to an icy monotone. “A boot that had been worn for weeks? A boot saturated with the perspiration of your feet?”\n\n“Yes, sir! An old, worn, dirty boot!”\n\nI looked at Watson, and in his startled eyes I saw the reflection of my own dread. The initial theft of the tan boot had been a false start; the predator had realized his error, returned to the hotel, and secured the true prize. Somewhere on the wild wastes of Dartmoor, a savage, flesh-and-blood monster was at this moment having the scent of Sir Henry Baskerville pressed against its ravenous nostrils!\n\n“Sir Henry,” said I gravely, “there is no time to lose. You must leave for Dartmoor tomorrow morning. But you must not go alone.”\n\n“Dr. Mortimer goes with me,” said the baronet.\n\n“Dr. Mortimer has his patients, and his house is miles from the Hall. No, Sir Henry, you must take a companion whose courage and loyalty are beyond question, who will never leave your side by day and who will sleep outside your bedroom door with a loaded revolver by night.”\n\n“And who might that be, Mr. Holmes? Will you come yourself?”\n\n“My business in London imperatively forbids it,” I answered smoothly, avoiding Watson’s gaze. “I have vital matters here which chain me to the capital. But if he will consent, there is one man in all England whom I would trust with your life: my friend and comrade, Dr. Watson!”\n\nWatson’s eyes widened with proud, resolute surprise. He gripped Sir Henry’s hand without a second’s hesitation. “I will go with all my heart, Sir Henry!”\n\nLater that night, when Sir Henry and Mortimer had departed to pack, Watson looked at me across the hearth. “You really cannot come, Holmes? Is there no way you can accompany us to Devonshire?”\n\n“It is impossible, Watson,” I replied, staring into the flickering embers of the fire. “I must remain in London. But you will send me daily reports—minute, detailed reports of every face, every movement, every whisper upon that moor.”\n\nWatson nodded with soldierly devotion and retired to his chamber.\n\nAs the door clicked shut, I stepped to my desk and opened the secret drawer beneath the writing slope. From it, I took out my second passport, a rough peaked cap, a heavy frieze seaman’s pea-jacket, and a false identity papers under the name of “William Evans, surveyor.”\n\n“Forgive me, my dear Watson,” I whispered into the darkness of the room. “If they know that Sherlock Holmes is in Devon, the spider will never venture out of the web. You must be the visible shield; I must be the unseen sword!”", "is_ending": false, "clues": ["Thread 1 fails: Cartwright searched 23 hotel wastebaskets; found zero mutilated copies of The Times", "Thread 2 fails: Telegram to Barrymore at Baskerville Hall was delivered to his wife, proving nothing", "Thread 3 delivers a shock: Cabman John Clayton reveals his fare paid him two guineas and said “I am Sherlock Holmes!”", "Sir Henry’s old, scent-soaked black boot stolen from Northumberland Hotel, confirming predator now has the scent"], "choices": [{"id": "h_ch5_c1", "text": "Dispatch Watson to escort Sir Henry to Devon while you secretly infiltrate Dartmoor.", "target": "holmes_ch06_part1_secret_departure", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch5_c2", "text": "[Switch POV to Jack Stapleton] Discover how Stapleton secured the old black boot.", "target": "stapleton_ch05_black_boot", "pov_switch": "stapleton", "pov_switch_name": "Jack Stapleton"}]}, "holmes_ch06_part1_secret_departure": {"id": "holmes_ch06_part1_secret_departure", "title": "Chapter 6: Baskerville Hall (Part I: The Covert Deployment to Dartmoor)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": "anchor_arrival", "content": "On the morning of Saturday, the third of October, I stood beneath the soot-blackened girders of Paddington Station, leaning against a stack of luggage crates with an unlit clay pipe clenched between my teeth. I wore the coarse, grease-stained frieze jacket of a provincial mechanic, a pair of corduroy trousers caked with clay, and a rough peaked cap pulled low over my brow. Not a soul among the bustling throng of travelers and porters paid the slightest heed to the weather-worn figure in the shadows.\n\nFifty paces down the platform, the 10:30 express for the West of England was taking on its passengers. I watched my dear Watson hand Sir Henry’s dressing-case to the guard. Watson’s face was a study in grim, soldierly responsibility; his square jaw was set, and beneath his heavy traveling ulster I could see the distinct bulge of his service revolver resting in his hip pocket. Sir Henry stood beside him, chatting with Mortimer, his keen dark eyes taking in the bustle of London for the last time before his exile.\n\n“Good lad, Watson,” I murmured beneath my breath as the whistle shrieked and the great green engine belched white steam towards the glass roof. “You are the visible fortress that draws the enemy’s fire. Guard him with your life, and leave the night-work to me.”\n\nThe train groaned, slipped its wheels against the iron rails, and glided smoothly out into the autumn morning.\n\nThe moment the last carriage had cleared the signal box, I slipped through the side wicket of the station and vanished into the maze of back streets. Two hours later, under my assumed name of William Evans, surveyor, I was seated in the corner of a third-class wooden smoking carriage on a slow, grinding local train bound for Exeter and the south Devon junctions.\n\nBy nightfall, the gentle green pastures of Somerset and the orchards of Devon had fallen away behind us, replaced by the grim, forbidding ramparts of the great granite plateau. The air grew sharp and thin, bearing upon its wings the damp, earthy tang of decaying vegetation and sodden peat. At every crossroad and railway bridge along the moor boundary, two armed sentries stood shivering beneath oilskin capes, their carbines glinting beneath the carriage lamps.\n\nThe guard informed me in hushed tones of the cause: Selden, the Notting Hill murderer, had broken out of the great granite prison at Princetown three days prior. A savage, bloodthirsty brute whose atrocities had revolted the nation, he had vanished into the trackless bog, hunted like a wolf by two companies of the Devonshire Regiment.\n\n“A charming reception for young Sir Henry,” I thought with a grim smile as I shouldered my canvas rucksack at the lonely junction of Newton Abbot. “An escaped ghoul upon the rocks, an ancestral demon in the mire, and a living assassin holding the strings!”\n\nI struck out on foot into the teeth of a whistling autumn gale. In the darkness, the great moor rose up before me like the petrified billows of a prehistoric sea—vast, melancholy, and boundless. Miles of black heather stretched into the fog, broken only by the eerie, menacing silhouettes of the granite tors rising like jagged black teeth against the stormy sky. Here, upon this ancient battleground, the duel would be fought to the death.", "is_ending": false, "clues": ["Holmes watched Watson, Sir Henry, and Mortimer depart Paddington on the 10:30 express", "Holmes slipped out in the disguise of William Evans, surveyor, taking a slow local cattle train", "Dartmoor is under armed military cordon due to Selden, the Notting Hill murderer on the run"], "choices": [{"id": "h_ch6_p1_c1", "text": "Scale Black Tor and establish your covert operational base in the stone hut.", "target": "holmes_ch06_part2_hut_surveillance", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch6_p1_c2", "text": "[Switch POV to Dr. Watson] See Sir Henry and Watson arrive at the gloomy Hall.", "target": "ch06_part1_arrival", "pov_switch": "watson", "pov_switch_name": "Dr. John H. Watson"}]}, "holmes_ch06_part2_hut_surveillance": {"id": "holmes_ch06_part2_hut_surveillance", "title": "Chapter 6: Baskerville Hall (Part II: The Telescope on Black Tor)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "The wind upon the summit of Black Tor was like an invisible wall of ice. It howled through the clefts of the granite crags, screaming across the heather with the fury of a pack of wolves. Yet inside the ancient, circular stone hut which I had chosen for my redoubt, the air was dry, still, and sheltered.\n\nThese prehistoric dwellings, erected by the primitive Iberians thousands of years before the Roman legions set foot in Britain, are masterpieces of primitive engineering. The rough granite blocks, fitted without mortar, have withstood the Atlantic gales of thirty centuries. The low doorway, scarcely four feet in height, faces south-east away from the prevailing storms. In the center of the earthen floor, beneath an opening in the conical stone roof, I had scraped clean a circle of flat stones to serve as a hearth. For bedding, I had gathered thick armfuls of dried bracken and mountain heather, covering them with a waterproof groundsheet and a heavy seaman’s blanket.\n\nHere, in the very heart of the wilderness, I had established my headquarters.\n\nAt dawn, a faint, rhythmic whistle—like the call of a curlew—echoed from the gully beneath the tor. I stepped to the low lintel and peered out into the grey mist. A small, agile figure scrambled nimbly up the rock chimney, clutching a wicker hamper beneath his arm. It was young Cartwright, the sharpest lad in the district messenger service, whom I had stationed at an obscure tavern in the distant hamlet of Coombe Tracey.\n\n“Everything quiet, Mr. Evans?” the boy panted, ducking his cap as he squeezed through the low entrance.\n\n“Perfectly quiet, Cartwright,” I said, taking the hamper from his grasp. “What have you brought?”\n\n“A fresh loaf of cottage bread, sir, two tins of preserved tongue, a pound of coffee, and half a dozen candles. And here is a packet of letters from Baker Street that arrived by the morning post.”\n\n“Good boy. And has anyone in the village questioned your presence?”\n\n“Not a soul, sir! I tell ’em I’m an artist’s apprentice sketching wildflowers on the moor for a London botanical shop. They think I’m a harmless simpleton.”\n\n“Admirable. Keep that character, Cartwright. Return to Coombe Tracey by the sheep-paths along the river. If any letters or telegrams arrive from Dr. Watson, bring them to me after sunset under cover of the dark.”\n\nWhen the boy had slipped away down the gully, I climbed to the natural stone platform on the southern face of the tor. Concealing my body behind two upright slabs of lichen-covered granite, I set up my high-powered brass field telescope upon its folding tripod and adjusted the brass focus-ring with steady fingers.\n\nThe whole panorama of Dartmoor leaped into startling, microscopic clarity.\n\nTwo miles to the south-east, nestled in a dense hollow of ancient oaks, rose the twin castellated towers and dark slate roofs of Baskerville Hall. With a quarter-turn of the screw, I brought the famous Yew Alley into focus: a long, dark, green tunnel terminating in the fateful wicket gate where Sir Charles had met his doom. I could see the gravel path where Watson and Sir Henry now walked side by side, their silhouettes tiny as chessmen, yet every gesture of Watson’s arm discernible as he pointed across the grounds.\n\nI swung the barrel three miles eastward, traversing the vast, trembling expanse of the Great Grimpen Mire. Even through the brass tube, the swamp possessed an evil, treacherous beauty: undulating patches of emerald-green slime, glittering pools of black, stagnant water, and jagged ridges of dark peat. And perched upon the very brink of that watery graveyard, surrounded by a few stunted fir trees, sat Merripit House—an austere, whitewashed stone cottage that seemed to shudder in the moorland gale.\n\nAs I watched, the front door of Merripit House opened. A man stepped out into the autumn sunshine, carrying a long, slender pole in his right hand and a green butterfly net over his shoulder.\n\nI locked the brass clamp and leaned into the eyepiece. “Jack Stapleton,” I whispered, my pulse steadying into ice. “Let us see what kind of specimens you collect in the heart of the dead bog.”", "is_ending": false, "clues": ["Prehistoric circular granite stone hut on Black Tor serves as Holmes’s covert fortress", "Messenger Cartwright delivers bread, tinned tongue, and clean water under cover of darkness", "High-powered brass telescope provides unobstructed surveillance of Baskerville Hall and Merripit House"], "choices": [{"id": "h_ch6_p2_c1", "text": "Train your telescope upon the Grimpen Mire to monitor Jack Stapleton’s movements.", "target": "holmes_ch07_part1_naturalist", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch6_p2_c2", "text": "[Switch POV to Jack Stapleton] Discover how Stapleton watched the carriage arrive.", "target": "stapleton_ch06_part1_arrival_watch", "pov_switch": "stapleton", "pov_switch_name": "Jack Stapleton"}]}, "holmes_ch07_part1_naturalist": {"id": "holmes_ch07_part1_naturalist", "title": "Chapter 7: The Stapletons of Merripit House (Part I: The Man with the Net)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "Through the crystal optics of the brass telescope, Jack Stapleton was under constant, merciless dissection.\n\nHe was a small, slim, clean-shaven man of about thirty-five years, with straw-coloured hair and a narrow, ferret-like jaw. He wore a prim suit of grey flannel and a straw hat that gave him the ridiculous air of an overgrown schoolboy. Yet as I observed his movements across the treacherous margin of the Great Grimpen Mire, every trace of absurdity vanished, replaced by a cold, calculating awe.\n\nThe man walked with the effortless, springy tread of a panther. Where another man would have sunk to his hips in the treacherous green slime, Stapleton skipped from one tiny tussock of dry rushes to another with uncanny certainty. He carried a ten-foot pole with a barbed iron ferrule, testing the mire ahead of him, stepping only where some submerged, invisible pathway afforded purchase beneath the mud.\n\nSuddenly, an agonizing shriek echoed across the waste.\n\nHalf a mile to the east of his position, a wild moor pony—a handsome dun creature that had wandered from the higher crags—had stepped onto a patch of bright emerald moss. In an instant, the crust gave way beneath its hooves. The pony plunged into the black peat slurry, thrashing its neck in frenzied terror, screaming with a sound so horribly human that it made my blood run cold. Its eyes rolled white; its nostrils flared; and then, with sickening, relentless suction, the mire closed over its flailing flanks, its arched neck, its tossing mane, until within sixty seconds nothing remained but a few oily green bubbles bursting upon the slime!\n\nI lowered the glass for a fraction of a second, my jaw clenched tight. Then I swung the barrel back to Stapleton.\n\nHe had not flinched. He had not even broken his stride. He stood upon a dry ridge of peat, holding his butterfly net, watching the death agony of that noble animal with the mild, detached amusement of a schoolboy observing a beetle kicking on a pin!\n\n“That,” I muttered to the granite stones beneath me, “is our man. A creature capable of watching agony with a smile; a man devoid of the common instincts of humanity; an intellectual monster of the first water.”\n\nPresently, my telescope caught a second figure striding along the post-road from Baskerville Hall. It was Watson, clad in his brown tweed suit, his stout ash stick swinging in his hand. He had left Sir Henry at the Hall and had walked out towards the moor to reconnoitre the countryside.\n\nStapleton saw him instantly. The transformation was startling: the cold, aloof predator vanished behind a mask of cheerful, boyish amiability. Waving his straw hat, Stapleton bounded across the heather to intercept our good doctor at the junction of the Grimpen lane.\n\nI could not hear their words, but their pantomime was as eloquent as an open book. Stapleton bowed, introduced himself with theatrical warmth, pointed with his cane towards the distant mire, and gesticulated towards Baskerville Hall. His head cocked to one side like a bird’s, probing, questioning, testing the limits of Watson’s knowledge. And Watson—bless his honest heart!—stood upright, hands behind his back, replying with that guarded, noncommittal gravity which he imagines to be the height of Machiavellian diplomacy.\n\nYet even as they talked, a sudden flutter of white linen on the distant moor track caught my attention. A woman had emerged from the gate of Merripit House, running frantically along the heather towards them!", "is_ending": false, "clues": ["Stapleton navigated the deadly Great Grimpen Mire with uncanny agility using hidden bog paths", "A moor pony was swallowed alive by the quagmire before Stapleton’s callous, indifferent gaze", "Stapleton intercepted Watson upon the moor road to probe his connection with Sherlock Holmes"], "choices": [{"id": "h_ch7_p1_c1", "text": "Observe Beryl Stapleton’s frantic attempt to intercept and warn Watson.", "target": "holmes_ch07_part2_beryl_warning", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch7_p1_c2", "text": "[Switch POV to Jack Stapleton] Experience Stapleton’s calculated performance as the innocent naturalist.", "target": "stapleton_ch07_part1_naturalist_act", "pov_switch": "stapleton", "pov_switch_name": "Jack Stapleton"}]}, "holmes_ch07_part2_beryl_warning": {"id": "holmes_ch07_part2_beryl_warning", "title": "Chapter 7: The Stapletons of Merripit House (Part II: The Desperate Warning)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "I adjusted the focus-screw until the lens brought the approaching woman into vivid, razor-sharp magnification.\n\nShe was an extraordinarily beautiful woman, of a type as alien to the fair-skinned Saxon folk of Devonshire as could well be imagined. Slim, tall, and elegant, she possessed a proud, olive-tinted oval face, rich dark coils of hair, and enormous, expressive eyes that burned with feverish intensity. Yet in every line of her features was stamped a terror so abject, so raw, that it made my heart contract.\n\nStapleton had stepped fifty yards away into a hollow of reeds, pretending to chase a moth. The moment his back was turned, the woman reached Watson’s side.\n\nShe did not walk; she lunged towards him, her bosom heaving beneath her bodice, her slender hands clutching at the sleeve of his tweed coat. Through the glass, I could see her lips moving with frantic, desperate speed.\n\n“Go back!” her lips formed the words unmistakably. “Go straight back to London, this very night! As you value your life, never set foot upon this moor again!”\n\nWatson, completely taken aback by this sudden apparition of beauty and panic, stared at her in utter bewilderment. He raised his hat, attempting to introduce himself, but she cut him off with an impassioned gesture, glancing frantically over her shoulder towards the hollow where her supposed brother had disappeared.\n\n“You must go!” her face contorted with agony. “Sir Henry, I beg of you upon my knees—hush, he is coming! Say nothing, on your life, say nothing!”\n\nAt that instant, Stapleton popped up over the bank of the hollow, his butterfly net trailing behind him.\n\nThe reaction of the woman was a revelation that gave me the master-key to the entire conspiracy.\n\nHad she been his sister, a sudden interruption might have caused a blush, a start of surprise, or an embarrassed laugh. But what I witnessed through the lens was the reaction of a terrified captive before her torturer. Her eyes dilated with sheer, naked horror. Her head snapped down; her hands fell to her sides as though paralyzed; and her whole body seemed to shrink, trembling in every limb, as Stapleton sauntered towards them with an easy, mocking smile upon his lips!\n\n“Ah!” I breathed aloud against the cold brass tube. “The veil is torn, Jack Stapleton! That is not a sister’s dread of an eccentric brother. That is the helpless, broken submission of a battered wife!”\n\nI followed the pantomime as Stapleton engaged Watson in conversation, lightly introducing his “sister” Beryl, his voice evidently charming and smooth, while Beryl stood rigid beside him, her pale lips pressed tight, her dark eyes fixed upon the ground. Watson, polite as ever, bowed to the lady, accepted an invitation to take tea at Merripit House, and presently took his leave, striding back along the post-road towards Baskerville Hall.\n\nI did not take my eye from the lens until the two figures at Merripit House had re-entered the cottage. The moment the heavy oak door closed behind them, I caught a brief, sickening glimpse through the parlour window: Stapleton’s hand shot out and gripped the woman’s wrist with savage, bruising force, dragging her violently towards the staircase!\n\n“Hold on, madam,” I whispered, lowering the telescope into its leather case. “Your ordeal is nearing its end. Your brutal husband has set himself against Sherlock Holmes, and the day of reckoning is coming upon the moor!”", "is_ending": false, "clues": ["Beryl Stapleton possesses stunning, dark, foreign elegance and terrified, haunted eyes", "Beryl mistook Watson for Sir Henry Baskerville, begging him to flee to London instantly", "Holmes deduces Beryl is not Stapleton’s sister, but his terrified, coerced lawful wife"], "choices": [{"id": "h_ch7_p2_c1", "text": "Await Watson’s written report to synthesize the movements at Baskerville Hall.", "target": "holmes_ch08_watson_report", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch7_p2_c2", "text": "[Switch POV to Jack Stapleton] Discover how Stapleton neutralized Beryl’s blunder.", "target": "stapleton_ch07_part2_beryl_blunder", "pov_switch": "stapleton", "pov_switch_name": "Jack Stapleton"}]}, "holmes_ch08_watson_report": {"id": "holmes_ch08_watson_report", "title": "Chapter 8: First Report of Dr. Watson (Dispatches Deciphered in the Hut)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": "anchor_first_report", "content": "The October gales intensified with the coming of night, hurling sheets of freezing rain against the curved granite exterior of my stone hut. Inside, sheltered behind a stack of flat peat slabs, a single tallow candle burned with a steady, yellow flame. I sat cross-legged upon my blanket, wrapped in my pea-jacket, with my blackened clay pipe clamped firmly between my teeth.\n\nSpread out across my knee were four dense sheets of fine, thin paper, closely written in the neat, upright hand of Dr. John H. Watson.\n\nCartwright had brought them two hours after sunset, splashing through the sodden heather like an otter. The boy was now snoring peacefully in the corner of the hut, curled like a hound in a pile of dry bracken.\n\nI smoothed out the first page, my eyes dancing with satisfaction.\n\n“Capital, Watson!” I murmured aloud. “Admirable fellow! He has kept his eyes open, and his pen does not spare the ink.”\n\nWatson’s dispatch was a masterly digest of the situation at Baskerville Hall. With his customary fidelity to f
