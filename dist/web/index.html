": "holmes_ch01_part1_observation", "title": "第一章 歇洛克·福尔摩斯先生（上：演绎的科学与手杖）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "anchor", "anchor_name": "anchor_chapter1_holmes", "content": "我坐在贝克街221号B起居室的早餐桌旁，背对着壁炉前的地毯，通过那把擦拭得锃光瓦亮的纯银咖啡壶的反光，静静端详着华生医生的身影。在过去的十分钟里，他一直捧着那位神秘访客遗留下的槟榔屿手杖，眉头深锁，神情专注得近乎一位在显微镜下解剖标本的学者。\n\n‘那么，华生，’我适时开口道，‘对于这根手杖，你究竟得出了什么高见？’\n\n‘你怎么知道我在做什么？’华生惊愕地抬起头，脸上流露出那种每每令我由衷愉悦的单纯诧异，‘我敢发誓你后脑勺上一定长着眼睛！’\n\n‘眼睛倒是没有，但我面前恰好有一把反光极佳的镀银咖啡壶，’我微笑着转过身，‘来吧，华生，把你的推论讲给我听听。让我听听你是如何根据这件器物来勾勒出主人的面貌的。’\n\n华生清了清嗓子，以其惯有的庄重语调给出了推断：一位年长而受人爱戴的乡村老医生，深得当地狩猎俱乐部的信赖，因而获赠了这根粗壮结实的槟榔屿手杖。这是一个充满温情的假说，饱含着华生善良天性所特有的浪漫联想，然而在严密冰冷的观察法则面前，却破绽百出。\n\n‘坦白讲，华生，你真让我刮目相看，’我接过手杖，赞赏地点了点头，‘在指出你的谬误的过程中，真理往往反而变得清晰可见。你自己或许并非发光体，但你却是一位极佳的光之导体！’\n\n我掏出口袋里的放大镜，借着晨光细细审视手杖的纹理。事实如同铅字印刷般清晰地刻在木质之上。厚重的铁箍已被粗糙的碎石路磨去了一半，证明主人经常在崎岖的乡间长途跋涉；‘C.C.H.’并非某种乡村猎狐俱乐部，而是伦敦著名的查令十字医院（Charing Cross Hospital）；手杖上刻有‘一八八四年’的赠别年份，这表明一位才华横溢、前途远大的青年住院外科医士，在五年前离开都市前往德文郡乡间行医；而最有趣的是手杖正中那一排清晰可见的凹陷齿痕——那是犬类在叼衔手杖时留下的牙印。上下颚齿距比㹴犬宽，却远比马士提夫獒犬狭窄，毫无疑问，那是一只卷毛西班牙猎犬。而此时此刻，这只小猎犬正欢快地跟随着它的主人踏上我们门前的台阶！\n\n楼下的门铃适时响起。透过临街的窗户，我已望见一位身材瘦高的绅士与一只气喘吁吁的小狗正伫立在贝克街的雾气之中。", "is_ending": false, "clues": ["摩梯末手杖磨损过半的铁箍印证了德文郡荒原碎石路的长期跋涉", "C.C.H. 1884铭文证实其为查令十字医院五年前离职的青年外科医士", "手杖齿痕精准测定为一只卷毛西班牙猎犬所留"], "choices": [{"id": "h_ch1_p1_c1", "text": "迎接杰姆士·摩梯末医生入座，请他陈述此番非同寻常的来访缘由。", "target": "holmes_ch01_part2_consultation", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch1_p1_c2", "text": "【视角切换：约翰·H·华生】以华生医生的同理心视角端详这位来客。", "target": "ch01_part2_mortimer", "pov_switch": "watson", "pov_switch_name": "约翰·H·华生医生"}]}, "holmes_ch01_part2_consultation": {"id": "holmes_ch01_part2_consultation", "title": "第一章 歇洛克·福尔摩斯先生（下：古老手稿与医学专家的求助）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": null, "content": "房门应声而开，杰姆士·摩梯末医生大步迈入房内。他身材高瘦得惊人，鼻梁如鹰喙般挺拔凸起，在两只灰色锐目间显得分外醒目；镜片之后的眼神充满着学者的狂热与探求。他的装束带着专业医者的体面，却又略显不修边幅——长礼服下摆微微泛黄，长裤裤脚也有磨损的毛边。尽管年纪尚轻，他的后背已微微前屈，走起路来头颈前倾，整个人散发着一种专注而略带拘谨的仁慈学究气息。\n\n‘我原本不敢抱太大奢望，’他笨拙而谦逊地欠身行礼，‘竟能如此顺利地拜会二位。想必阁下就是歇洛克·福尔摩斯先生？而这位便是华生医生了。啊，福尔摩斯先生，您的头部结构实在令我着迷至极！我万万没有想到，您的颅骨竟然呈现如此完美的超长头型（dolichocephalic），眉间上眶的骨骼突起更是如此显著！您介意让我用手指抚摸一下您的顶骨骨缝吗？倘若在令尊令堂百年之后能为您翻制一座颅骨模型，那必将成为任何人类学博物馆的无上珍宝！’\n\n我微笑着抬手请他在扶手椅上就坐，对这位狂热的人类学家不免感到几分莞尔。‘先生，在您所专精的领域里，您无疑是一位饱含热忱的专家，正如同我在我的行当一样。不过从您食指内侧的焦黄痕迹来看，您平日习惯自己卷烟，请不必客气，尽情抽吧。’\n\n摩梯末医生闻言，神经质地从长礼服内袋中掏出一卷泛黄的纸卷。‘实不相瞒，福尔摩斯先生，我此次登门，乃是为了委托一件极度离奇、性命攸关的重大事件。在某些专门的研究领域里，您的声望放眼全欧洲，恐怕仅次于巴黎的贝蒂荣先生（Monsieur Bertillon）。’\n\n‘哦，果真如此吗？那么阁下或许应当直接渡海去向贝蒂荣先生求教才对。’\n\n‘在人体测量学的绝对精度上，或许贝蒂荣先生独步一时，’他急切地辩解道，‘但在实际纷繁复杂的事务处理上，在解开幽暗阴森的绝望谜团方面，全欧洲绝无人能与您比肩！我今日带来的，正是关于巴斯克维尔家族的惊天疑案。我的口袋里装着一份一七四二年的古代家族手稿，它是在三个月前不幸猝死的查尔斯·巴斯克维尔爵士生前亲手托付给我的遗物。而查尔斯爵士的骤然离世，至今仍让整片达特穆尔荒原笼罩在无尽的恐怖阴霾之中。’\n\n他小心翼翼地将那卷发脆发暗的手稿平铺在膝盖上，苍白的镜片后透出一种绝非纯粹学术研究所能解释的恐惧。", "is_ending": false, "clues": ["摩梯末将福尔摩斯列为仅次于贝蒂荣的欧洲第二高明专家", "摩梯末胸袋中珍藏的一七四二年巴斯克维尔庄园古老手稿"], "choices": [{"id": "h_ch1_p2_c1", "text": "请摩梯末医生展开那份一七四二年的古老手稿，宣读巴斯克维尔的诅咒传说。", "target": "holmes_ch02_part1_legend", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch1_p2_c2", "text": "直接向摩梯末询问查尔斯·巴斯克维尔爵士猝死案的现代物理线索。", "target": "holmes_ch02_part2_footprints", "pov_switch": null, "pov_switch_name": null}]}, "holmes_ch02_part1_legend": {"id": "holmes_ch02_part1_legend", "title": "第二章 巴斯克维尔的灾祸（上：雨果传说与迷信神话）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "anchor", "anchor_name": "anchor_curse_holmes", "content": "摩梯末医生将眼镜推到高耸的前额上，用一种尖细而略显沙哑的声音宣读起那份一七四二年的手稿。字里行间充斥着十八世纪初那种古朴刻板的法言法语，郑重告诫巴斯克维尔家族的历代子嗣，警惕自大叛乱（Great Rebellion）时期便纠缠不散的祖传魔咒。\n\n这段故事若放在乡野民间传说的范畴里，倒也算得上一桩典型的志异题材：庄园先祖雨果·巴斯克维尔是一个狂暴放荡、目无神明的恶棍。他在达特穆尔荒原上看中了怀德康附近一位自耕农的美貌女儿。某一年的米迦勒节前夜，雨果纠集了五名狐朋狗友，强行将那少女掳掠至巴斯克维尔庄园并囚禁在楼上的客房中。正当恶汉们在楼下彻夜狂饮作乐之际，惊恐绝望的姑娘顺着窗外的常春藤滑下高墙，趁着惨淡的月色狂奔向九英里外的父亲农庄。\n\n雨果发现少女逃跑后暴跳如雷，公然发下毒誓：若能追上此女，宁愿将肉体与灵魂悉数奉献给魔鬼！他随即牵出整整一队猎犬扑入荒野，同伙们亦策马穷追不舍。当狂欢者们追至荒原深处的一处花岗岩裂谷时，首先映入眼帘的是雨果那匹狂奔脱缰、口吐白沫的纯黑战马。他们战战兢兢地策马探入谷底，只见那不幸的少女已因惊惧和力竭香消玉殒于石楠花丛之中。而在不远处雨果倒毙的尸骸之上，正踞坐着一头令人毛骨悚然的怪兽——那是一只巨大如恶魔般的纯黑凶兽，身形虽酷似猎犬，其体魄却比凡间任何巨犬更为可怖！这头地狱巨兽正大口撕咬着雨果的喉管，当它转过两只喷吐烈焰的血红巨眼与滴淌腥血的獠牙望向来人时，所有人吓得魂飞魄散，狂呼逃窜！\n\n我靠在扶手椅背上，极力克制着一个呵欠，双手指尖轻轻相对。\n\n‘那么，福尔摩斯先生？’摩梯末医生从镜片上方凝视着我，‘这篇文字难道未能引起您的兴趣吗？’\n\n‘倘若对于一位搜集乡村志异的民间学者而言，或许颇具趣味，’我冷淡地答道，‘字里行间充满了十八世纪通俗哥特剧那华丽而夸张的辞藻。然而，摩梯末医生，您总不至于指望我在公元一八八九年的今天，去侦破一桩百年前的中世纪童话吧？’", "is_ending": false, "clues": ["一七四二年手稿记载了恶棍雨果·巴斯克维尔掳掠少女并遭地狱猎犬撕裂喉管的诅咒始末", "手稿郑重告诫巴斯克维尔家族子嗣切勿在黑暗降临后夜渡达特穆尔荒原"], "choices": [{"id": "h_ch2_p1_c1", "text": "聆听查尔斯爵士猝死案的现代事实与现场留下的物理脚印。", "target": "holmes_ch02_part2_footprints", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch2_p1_c2", "text": "驳斥封建中世纪的神话传说，要求摩梯末出示当下发生的切实证据。", "target": "holmes_ch02_part2_footprints", "pov_switch": null, "pov_switch_name": null}]}, "holmes_ch02_part2_footprints": {"id": "holmes_ch02_part2_footprints", "title": "第二章 巴斯克维尔的灾祸（下：巨大恶犬的足迹）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": null, "content": "‘传说固然陈旧，福尔摩斯先生，’摩梯末医生的声音骤然降低，变得森冷沉重，‘但我接下来要读给二位听的，却是发生在此刻的事实！’\n\n他从口袋中掏出一张折叠整齐的《德文郡纪事报》，宣读了关于查尔斯·巴斯克维尔爵士猝死案的验尸官官方裁决。查尔斯爵士在南非矿业投机中积累了数以十万计的巨额财富，晚年回归故里斥资重修祖宅。他为人慷慨仁厚，却长期罹患严重的心脏器质性病变并伴有极度神经衰弱。五月四日深夜，他按照惯例前往庄园著名的红豆杉小径（Yew Alley）散步，却再也没有归来。午夜时分，管家白利墨在通往荒原的侧门旁发现了老爵士仆倒在地的尸身。尸检未见任何机械性损伤痕迹，陪审团最终裁定死因为急性心力衰竭。\n\n摩梯末医生将报纸重新折好。‘这是公开的版本，福尔摩斯先生。也是提交给验尸法庭的唯一陈述。然而，我却隐瞒了最致命的核心事实——因为身为他的私人医师与遗产托管人，我深知一旦将真相公之于众，整片达特穆尔地区的居民都将陷入无法遏制的癫狂恐慌，庄园也将就此荒废废弃！’\n\n我的神经瞬间紧绷起来，坐直了身子。‘你亲自勘验了案发现场的地面？’\n\n‘正是！那条红豆杉小径两旁是足有十二英尺高、密不透风的严密树篱。中央是八英尺宽的平整草坪，两侧铺有碎石小径。查尔斯爵士沿着小径走到通向荒原的木栅侧门旁，他在那里足足驻足抽烟了二十分钟以上——散落在地面的两小撮雪茄烟灰可以确凿无误地证明这一点！然而，当他离开侧门折返时，地面的脚印彻底改变了！他绝非步行返回——而是在极度的绝望与恐慌中亡命狂奔！他的脚尖深深扎入泥土，整个脚掌几乎离地飞奔，直到心脏终于不堪重负破裂骤停，面朝下扑倒在草坪之中！’\n\n‘那么地面上可曾发现其他印记？’我立刻追问道。\n\n摩梯末医生猛地前倾身躯，苍白的面孔几乎贴到了我的鼻尖。他的瞳孔因极度的骇异而剧烈放大。\n\n‘福尔摩斯先生，死者身上没有任何伤痕。然而在距离尸体倒卧处二十码外、位于侧门外潮湿松软的泥炭沼地之上——在绝无牛羊能够涉足的盲区之中——我清清楚楚地看到了一串崭新的印记！’\n\n‘脚印？’\n\n‘正是脚印。’\n\n‘是男人的，还是女人的？’\n\n摩梯末医生凝视着我和华生，吐出了一句令整间起居室温度骤降的惊悚耳语：\n\n‘福尔摩斯先生……那是属于一只巨大无朋的恶犬的足印！’", "is_ending": false, "clues": ["查尔斯爵士猝死前在通往荒原的侧门足足驻足抽烟二十分钟", "现场足印突然变为脚尖点地，证明其在极度恐慌中亡命飞奔", "距尸体二十码外的松软湿泥上，留有清晰无误的巨大恶犬足印"], "choices": [{"id": "h_ch2_p2_c1", "text": "决定全力接手这桩现代命案，要求调阅整幅达特穆尔军用测量地形图。", "target": "holmes_ch03_problem", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch2_p2_c2", "text": "就侧门周遭的物理地势、泥土湿润度及树篱阻隔向摩梯末展开高强度盘问。", "target": "holmes_ch03_problem", "pov_switch": null, "pov_switch_name": null}]}, "holmes_ch03_problem": {"id": "holmes_ch03_problem", "title": "第三章 疑案（达特穆尔地图与浓烟沉思）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": null, "content": "摩梯末医生刚一告辞，我便劝说华生外出散心。至于我自己，则完全没有任何漫步街头的兴致。摆在我面前的，是一桩足以令全欧洲最顶尖的大脑为之高度亢奋的头等智力悬案。\n\n我换上了那件鼠灰色的旧晨袍，从波斯软头拖鞋尖里掏出那袋最冲、最浓烈的黑色烟丝塞满石楠烟斗，将起居室的门窗紧紧反锁。正午时分，整间屋子早已弥漫着浓密得伸手不见五指的蓝灰色烟雾。长条木桌之上，赫然摊开着一幅大比例尺的德文郡达特穆尔军用测量局地形图。\n\n在这方圆五英里的荒蛮泥潭与花岗岩巨石丛中，便是我们将要与凶手博弈的生死擂台。我用没蘸墨水的钢笔尖细细摩挲着每一条等高线。巴斯克维尔庄园被厚密的古树林环绕，正面朝向荒凉无垠的荒原；东北方四英里处，便是密密麻麻标有沼泽危险十字的大格林盆泥潭（Great Grimpen Mire）——那是一处足以将整头活牛吞噬得尸骨无存的万丈泥渊！而在泥潭边缘孤零零伫立的，是一座名为梅利琵（Merripit House）的宅邸，据摩梯末称，那里住着一位名叫斯台普吞的昆虫博物学家及其胞妹；再往南，则是库姆马西村以及酷爱诉讼的弗兰克兰老头。\n\n而这桩案件背后的经济脉络更是显豁至极。查尔斯爵士生前未立正式遗嘱，整座庄园、大批证券、林地及银行现款——总额高达惊人的七十四万英镑巨款——按继承法则将悉数归于其侄儿亨利·巴斯克维尔名下！这位年轻的加拿大垦殖农夫，此时此刻正搭乘列车抵达滑铁卢车站！\n\n倘若恶犬的迷信乃是凡间歹徒假借幽灵之名所设的杀人工具，那么究竟何人能从这场连环死亡中攫取巨利？倘若亨利爵士亦步其后尘暴毙荒原，下一个法定继承人又是谁？摩梯末曾提及远在威斯特摩兰郡的一位年迈穷牧师詹姆斯·戴斯蒙。然而在达特穆尔荒原的迷雾背后，是否隐匿着另一只操盘全局的无形黑手？那只恶犬必定是具备实体血肉的造物——留在泥炭上的真实足印已无可辩驳地证实了这一点！既然是血肉之躯，便需要有人饲养、隐匿，并指引其展开血腥撕咬！\n\n当暮色笼罩伦敦街头时，我将第三斗烟灰磕入壁炉。一位足以令我倾尽心力的强大对手已然向我掷下了战书。明早十点，亨利·巴斯克维尔爵士将踏入贝克街221号B。且让我们看看，究竟是人类的理性科学能刺破迷雾，还是乡野的邪恶阴谋能继续肆虐！", "is_ending": false, "clues": ["查尔斯爵士唯一法定继承人亨利·巴斯克维尔爵士正从加拿大抵英", "军用测绘地图标注出大格林盆泥潭、梅利琵宅邸及荒原险要岩岗", "巴斯克维尔庄园总估值高达七十四万英镑，形成极度庞大的买凶谋财动机"], "choices": [{"id": "h_ch3_c1", "text": "整理达特穆尔地理论据，准备明早十点在贝克街迎接亨利爵士与摩梯末。", "target": "holmes_ch04_part1_warning", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch3_c2", "text": "【视角切换：约翰·H·华生】从华生的视角见证他傍晚归来时被浓烈烟丝笼罩的贝克街。", "target": "ch03_problem", "pov_switch": "watson", "pov_switch_name": "约翰·H·华生医生"}]}, "holmes_ch04_part1_warning": {"id": "holmes_ch04_part1_warning", "title": "第四章 亨利·巴斯克维尔爵士（上：剪报警告与失窃的靴子）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "anchor", "anchor_name": "anchor_london_mission_holmes", "content": "上午十点整，亨利·巴斯克维尔爵士在摩梯末医生的陪同下准时跨入了贝克街的房门。他身材不高却精悍结实，年约三十上下，生着一对机敏果决的黑眼睛，浓密的剑眉下一张轮廓分明、带有昂扬斗志的面庞。他身着一套红褐色的粗花呢猎装，皮肤黝黑发亮，浑身上下散发着长期在加拿大荒野风吹日晒所特有的粗犷活力。\n\n他没有把时间浪费在繁文缛节上。‘福尔摩斯先生，’他大步走到桌前，将一封信封啪的一声掷在桌上，‘今早我在诺森伯兰旅馆收到了这封莫名其妙的信！但愿您能告诉我，这究竟见鬼的是怎么一回事！’\n\n那是一只廉价粗糙的平价信封，上面用笨拙印刷体字样写着‘诺森伯兰旅馆，亨利·巴斯克维尔爵士收’。抽开信封，里面是一张四开大小的信纸，纸上整整齐齐地粘贴着一排从报纸上裁剪下来的印刷词句：\n\n‘倘若你珍视你的性命与理智，切切远离那片荒原。’\n\n唯独‘荒原’（moor）二字，是用粗糙的黑墨水手写补全的。\n\n我立刻抽出口袋里的放大镜，将信纸贴近镜片细细检视。‘一件极其精妙的标本！’我赞叹道，‘华生，注意这些铅字字模。这是典型的五号铅字（Bourgeois），通栏加空铅排版。这些词句全部裁剪自昨天的《泰晤士报》——确切地说，是关于关税问题的主题社论！而裁剪这些字迹的工具，是一把刃口极短的女士修甲剪刀，因为边缘处留有弧形微小的咬痕。再留神一下纸张边缘隐隐散发的香气——这是素馨花（white jessamine）的清香，一位受过良好教育的女性留下的印记！’\n\n‘上帝啊！’摩梯末失声惊呼，‘一位有教养的女人？’\n\n‘这还不是全部呢！’亨利爵士按捺不住心头的怒火打断道，‘昨晚在旅馆里，还有某个该死的贼骨头跟我开了一个荒谬绝伦的恶劣玩笑！我昨晚把刚买的一双崭新黄褐色皮靴放在房门外的地垫上等着擦油，结果今天早晨一瞧，其中一只竟然不翼而飞了！旅馆的领班和擦鞋童把整栋楼翻了个底朝天，那只靴子就像蒸发了一样！’\n\n‘一双新买的黄褐色皮靴？’我眼神一敛，追问道，‘一双此前从未上过脚的新靴子？’\n\n‘从没穿过！我昨天刚在河岸街（Strand）买回来的，鞋底连一点灰尘都没沾过！’\n\n我靠回椅背，大脑深处飞速运转。一个隐蔽的仇敌正以骇人的胆量在伦敦市区紧咬着亨利爵士不放。然而，凶手盗取一只完全没有穿过的新靴子，究竟意欲何为？", "is_ending": false, "clues": ["匿名警告信所有词句均从昨日《泰晤士报》社论中剪裁拼贴而成", "使用指甲短刃剪刀裁剪，涂抹植物树胶，带有极其微弱的素馨花香水气息", "亨利爵士置于诺森伯兰旅馆门外的一只崭新黄褐色皮靴不翼而飞"], "choices": [{"id": "h_ch4_p1_c1", "text": "尾随亨利爵士与摩梯末步入摄政街，引蛇出洞侦测暗中盯梢的眼线。", "target": "holmes_ch04_part2_cab_chase", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch4_p1_c2", "text": "【视角切换：杰克·斯台普吞】从跟踪者的视角窥视他戴着假黑胡子监视旅馆的阴谋。", "target": "stapleton_ch04_part1_hotel_shadow", "pov_switch": "stapleton", "pov_switch_name": "杰克·斯台普吞"}]}, "holmes_ch04_part2_cab_chase": {"id": "holmes_ch04_part2_cab_chase", "title": "第四章 亨利·巴斯克维尔爵士（下：摄政街的幽灵与马车2704）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": null, "content": "亨利爵士与摩梯末前脚刚踏出贝克街的大门，我便霍地从扶手椅上一跃而起。\n\n‘快，华生！抓起你的帽子和大衣！一秒钟都不能耽搁！’\n\n我们如幽灵般穿入街市，在两百码外的距离悄然尾随其后。他们二人拐入牛津街，随即顺着摄政街信步南行。而在他们前方的马路对面，一辆双轮轻便小马车（hansom cab）正以反常的慢速悄然并排行进。透过马车的车窗玻璃，隐约可以看见车厢里端坐着一个微微前倾的黑影，两只阴鸷的眼睛正死死锁定着前方的爵士。\n\n我骤然加快了脚步。电光石火之间，车厢内的乘客突然转过脸来，目光与我正正撞在了一起！他在一瞬间认出了我！一只手猛地顶开了车顶上的通话小窗，车夫的长鞭在空中抽出刺耳的脆响，那匹拉车骏马瞬间扬蹄狂奔，小马车如离弦之箭般沿着摄政街朝滑铁卢广场方向绝尘而去！\n\n‘2704号！’我厉声高呼，死死记住了车尾那排白色的编号，‘满脸漆黑浓密的连鬓大胡子，目光锐利如刀！华生，我们当真遇上了一位值得交锋的强悍劲敌！’\n\n我带着华生径直奔向地区信差所，雇佣了我手下最机灵的小厮卡特赖特。我塞给他五枚金镑，命他逐一搜查查令十字街附近的全部二十三家大旅馆，务必将清洁工收集的垃圾纸篓翻个底朝天，搜寻那份被剪掉社论字句的昨日《泰晤士报》。\n\n下午两点，我们如约来到诺森伯兰旅馆拜会亨利爵士。一进房门，只见这位年轻的男爵气得满脸通红，正在起居室内暴跳如雷。\n\n‘福尔摩斯先生，您快瞧瞧这叫什么事！’他指着墙角的衣柜怒吼道，‘那个疯子又对我下手了！我那只丢了的新黄皮靴，竟然莫名其妙地出现在了墙角藤椅底下！可现在——见他妈的大头鬼——我的一只旧黑皮靴，一双我特意从加拿大穿过来、踩满泥巴的旧靴子，又在门外被人顺手牵羊给偷了！’\n\n我的心脏猛地剧烈狂跳了一下。脑海中散落的所有拼图碎块在一刹那间严丝合缝地拼接在了一起！\n\n‘一只旧黑皮靴？’我脱口追问道，‘一双你确确实实长途穿过的皮靴？’\n\n‘对啊，鞋帮上甚至还沾着昨天下雨踩的烂泥呢！’\n\n‘啊！’我转头向华生低声耳语道，‘一只崭新的靴子根本没有任何气味。然而一双穿过的旧鞋，却吸附着活人血肉特有的鲜明气味！’", "is_ending": false, "clues": ["车号为2704号的双轮小马车在摄政街对亨利爵士展开贴身尾随", "车内密探生有一双鹰隼般的黑眼睛与满脸浓密浓黑的假连鬓大胡子", "那只新黄皮靴竟被悄悄送回旅馆，但亨利爵士的一只旧黑皮靴却紧接着被盗走"], "choices": [{"id": "h_ch4_p2_c1", "text": "派遣小厮卡特赖特搜查二十三家旅馆垃圾纸篓，并传唤2704号马车夫前来说明。", "target": "holmes_ch05_threads", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch4_p2_c2", "text": "就皮靴调包失窃案对诺森伯兰旅馆大堂经理与侍者展开现场高压质询。", "target": "holmes_ch05_threads", "pov_switch": null, "pov_switch_name": null}]}, "holmes_ch05_threads": {"id": "holmes_ch05_threads", "title": "第五章 三条断了的线索（傲慢的马车夫与秘密出征）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "anchor", "anchor_name": "anchor_arrival_holmes", "content": "到了傍晚时分，我们在伦敦查探的三条线索，竟如同腐朽的细麻绳般悉数崩断。\n\n第一条线索：卡特赖特满身灰尘、精疲力竭地返回贝克街。他翻遍了全部二十三家旅馆的废纸篓，却连半片被裁剪的《泰晤士报》残页也没找到。那个狡猾的写信人显然早已将剩下的废报纸付之一炬，或是随手扔进了阴沟。\n\n第二条线索：我发往巴斯克维尔庄园给管家白利墨的核实电报，已被当地邮差童亲手递交到了白利墨手中，这表明摄政街上那个满脸黑胡子的密探，绝不可能是擅离职守远赴伦敦的管家。\n\n而第三条线索，更是彻底将案情推向了白热化。2704号双轮马车的车夫约翰·克莱顿在警方的传唤下应声来到了贝克街。这是一个老实憨厚的朴素汉子，毫无保留地吐露了实情。\n\n‘那位先生是在特拉法尔加广场叫上我的车，’克莱顿擦着脑门上的汗水道，‘他留着一大把乌黑浓密的连鬓大胡子，戴着一副黑墨镜，衣着考究体面。他吩咐我远远咬住那位穿着褐色粗花呢大衣的加拿大绅士，一路上从摄政街跟到了滑铁卢广场。后来当您二位拔腿追过来时，他把头伸进小窗大喊，让我拼了老命把车赶向滑铁卢车站！’\n\n‘当他在车站付钱下车时，可曾留下姓名？’我冷冷问道。\n\n克莱顿咧嘴苦笑了一声。‘先生，说出来您大概都不敢信。当他把两枚沉甸甸的金镑拍在我手心里时，他狠狠瞪着我，傲慢地甩下一句话：“记住了，车夫，我的名字叫歇洛克·福尔摩斯！”’\n\n我忍不住仰天大笑起来，但一股刺骨的战意与怒火却瞬间传遍了我的每一根神经！这个胆大包天的恶徒，竟然当面将我的名字当成了玩弄警方的嘲弄盾牌！\n\n‘好一记漂亮的反击，华生！’我按捺着内心的波澜，在壁炉前大步踱步，‘他谙熟我的办案路数，甚至预判了我的调查节奏，如今他怀里揣着亨利爵士带有体味的旧皮靴，从我们的指缝中彻底溜回了老巢！亨利爵士明天一早便要启程前往德文郡。华生，你必须作为他的私人护卫一同前行！你必须成为他的坚固盾牌、他的耳目与形影不离的同伴，将达特穆尔发生的一切细节毫无保留地据实向我汇报！’\n\n华生以其一贯的崇高忠诚毫不犹豫地接下了这桩九死一生的重托。然而，当起居室的大门在他身后缓缓合上时，我脑海中的整盘大棋却已成竹在胸。我绝不可能安坐于伦敦的壁炉旁，眼睁睁看着我挚爱的挚友只身步入恶狼的血盆大口！我将乔装潜伏，暗度陈仓秘密潜入达特穆尔荒原，在苍凉的花岗岩石屋中构筑隐秘的前线指挥所，在最致命的危局时刻给黑暗中的凶手以雷霆万钧的致命一击！", "is_ending": false, "clues": ["卡特赖特翻遍二十三家旅馆垃圾篓未见被裁剪的《泰晤士报》残页", "发往庄园的测试电报确认管家白利墨当时身在达特穆尔庄园内", "2704号车夫约翰·克莱顿证实那名黑胡子乘客傲慢挑衅地自称：‘我的名字叫歇洛克·福尔摩斯’"], "choices": [{"id": "h_ch5_c1", "text": "命华生作为公开护卫陪同亨利爵士奔赴德文郡，自己暗中筹备秘密潜入达特穆尔荒原。", "target": "holmes_ch06_part1_secret_departure", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch5_c2", "text": "【视角切换：杰克·斯台普吞】目睹恶谋得逞的恶魔怀揣染有气味的旧靴潜回达特穆尔。", "target": "stapleton_ch05_black_boot", "pov_switch": "stapleton", "pov_switch_name": "杰克·斯台普吞"}]}, "holmes_ch06_part1_secret_departure": {"id": "holmes_ch06_part1_secret_departure", "title": "第六章 巴斯克维尔庄园（上：暗度陈仓南下达特穆尔）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "anchor", "anchor_name": "anchor_arrival_moor_holmes", "content": "瞒天过海的伪装堪称天衣无缝。在华生、亨利爵士以及那双在贝克街门外暗中窥伺的鹰犬眼中，歇洛克·福尔摩斯先生正被德文郡公爵那桩扑朔迷离的敲诈勒索案死死拖在伦敦，分身乏术。\n\n然而在深夜浓黑的掩护下，我换上了一身落魄古怪的年迈植物学者的行头，肩挎磨破的帆布帆布包，手提一只绿漆斑驳的标本铁盒，登上一列无人注意的运奶货运列车秘密西行。我巧妙地避开了埃克塞特与牛顿阿博特等繁华换乘大站，在荒原以北数英里外一个荒凉冷清的乡村小站悄然滑入夜色。\n\n整套行动方案按照军用特战标准精密展开。我早已密令小厮卡特赖特从伦敦启程，隐匿在距离庄园六英里外平静古朴的库姆马西集镇（Coombe Tracey）。他的使命危险而关键：充当我的绝密后勤官。每周两次，他将负责采买面包、冷肉、洁净水以及我赖以提神的黑烟丝，沿着隐蔽的羊肠小径翻山越岭，将补给神不知鬼不觉地送入我的秘密藏身点。更为关键的是，他将全权负责从镇邮局截取华生寄往伦敦的密报，第一时间送达我手中，而华生对此将毫不知情！\n\n而我的作战前哨更是经过了千挑万选。在黑色岩岗（Black Tor）犬牙差互的悬崖绝壁顶端，有一片三千年前古代不列颠土著遗留下的新石器时代圆形史前石屋群。这里的视野辽阔无匹，居高临下足以俯瞰巴斯克维尔庄园的森严高墙、大格林盆泥潭那片致命的惨绿泥沼，以及通往梅利琵宅邸的必经小道！\n\n其中一座圆形石屋历经三千年风霜，其圆锥形的厚重石板屋顶与花岗岩石壁依然坚固完整，滴水不漏。我清扫了地面碎石，铺上厚厚一层干燥柔软的野生石楠花，垫上我那件厚重的防水大氅，一座隐蔽的战略反击前哨便告落成。透过狭窄昏暗的石门望去，荒原上一座座花岗岩峰峦犹如远古巨人般在狂风与苍茫的灰雾中冷冷肃立。", "is_ending": false, "clues": ["福尔摩斯避开干线火车站，于深夜乔装潜行秘密南下德文郡", "安排小厮卡特赖特驻扎库姆马西负责采买干粮、烟草与转递华生信件", "选定黑色岩岗上一座干燥隐蔽的史前新石器时代圆形石屋作为绝密基地"], "choices": [{"id": "h_ch6_p1_c1", "text": "进驻黑色岩岗史前石屋，架起军用远望镜俯瞰监视整片达特穆尔荒原。", "target": "holmes_ch06_part2_hut_surveillance", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch6_p1_c2", "text": "【视角切换：约翰·H·华生】从华生的视角经历他与亨利爵士抵达阴森庄园大门的一刻。", "target": "ch06_part1_arrival", "pov_switch": "watson", "pov_switch_name": "约翰·H·华生医生"}]}, "holmes_ch06_part2_hut_surveillance": {"id": "holmes_ch06_part2_hut_surveillance", "title": "第六章 巴斯克维尔庄园（下：黑色岩岗石屋的隐秘哨位）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": null, "content": "十月十五日的暮色时分，荒原死一般的寂静被一阵急促杂乱的马蹄声骤然撕碎。我屈身潜伏在黑色岩岗犬牙交错的花岗岩裂隙之后，将那架高倍双筒海军军用远望镜稳稳架在巨石之间，镜头牢牢锁定了从波维特雷西方向蜿蜒而来的雪白碎石驿道。\n\n视野中的景象分外引人瞩目。一辆由两匹健马拉乘的双排轻便敞篷马车在荒原上疾驰。车厢之中，端坐着身裹厚重呢大氅的亨利·巴斯克维尔爵士与我的挚友华生医生，身旁还紧紧跟随着两名荷枪实弹的郡警。而在数英里外的道路交叉口，两名跨骑骏马、大腿上横挎卡宾枪的骑兵如铁铸般在苍凉的晚霞中巍然屹立。\n\n情报早已传到了我的石屋：三天前，臭名昭著的诺丁山残忍杀人犯塞尔登（Selden）凿穿了普林斯敦的达特穆尔重犯监狱，正潜藏在方圆数十里的花岗岩乱石迷宫之中！这无疑是一桩极度危险的不可控变量！一个在荒原上濒临绝境、茹毛饮血的狂暴逃犯，随时可能将这盘原本就命悬一线的智力棋局搅入血腥的混乱。\n\n我缓缓转动镜筒，将视线投向了巴斯克维尔庄园。那座古老森严的庞大宅邸在枯死林木的环抱中宛如一座从地狱深处钻出的幽灵城堡。两座高耸的城垛式雉堞塔楼在阴霾的天空下显得分外森冷阴郁。随着马车辚辚驶入坍塌的拱门，那两扇沉重锈蚀的生铁大门伴随着刺耳的巨响重重合拢。华生与亨利爵士，已然正式跨入了恶魔布下的捕兽夹！\n\n而在东方一英里外，横跨大格林盆泥潭那片泛着诡异磷光的惨绿泥淖边缘，另一栋孤零零的烟囱正冒出缕缕青烟。梅利琵宅邸（Merripit House）！在那座看似清幽僻静的乡村农舍之中，便盘踞着操纵整场死亡恐慌的幕后大脑。我微调镜头焦距，平静地呼出一口白气，准备迎接一场漫长、冰冷而绝不容情的铁血坚守。", "is_ending": false, "clues": ["荷枪实弹的骑兵正在荒原各处关卡荷枪戒备，搜捕诺丁山屠夫逃犯塞尔登", "透过高倍军用远望镜，福尔摩斯亲眼目睹华生与亨利爵士跨入阴森肃杀的庄园大门"], "choices": [{"id": "h_ch6_p2_c1", "text": "调整远望镜焦距，将侦查视线延伸至大格林盆泥潭深处与梅利琵宅邸。", "target": "holmes_ch07_part1_naturalist", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch6_p2_c2", "text": "【视角切换：杰克·斯台普吞】从梅利琵宅邸窗口俯视猎物入瓮的阴冷狞笑。", "target": "stapleton_ch06_part1_arrival_watch", "pov_switch": "stapleton", "pov_switch_name": "杰克·斯台普吞"}]}, "holmes_ch07_part1_naturalist": {"id": "holmes_ch07_part1_naturalist", "title": "第七章 梅利琵宅邸的主人斯台普吞（上：捕蝶网背后的窥探）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "anchor", "anchor_name": "anchor_naturalist_holmes", "content": "十月十六日清晨的惨白日光撕开了荒原弥漫的浓雾，大格林盆泥潭令人毛骨悚然的险恶全貌终于清晰地呈现在我的镜片之下。这片浩瀚万顷的巨大死沼，远看犹如一张铺展在天地间的鲜绿翡翠绒毯，然而在那片生机勃勃的草皮之下，却密布着一口口咕嘟翻滚着毒气恶臭的吞人泥浆深渊与零星凸起的花岗岩残礁。\n\n不多时，泥潭小径上出现了一个敏捷小巧的身影。那是一个中等身材、体态利落轻盈的男子，生着一头淡黄色头发，下巴刮得干干净净，面容清秀而线条冷硬。他手里挥舞着一面绿色的长柄捕蝶网，肩上斜跨着一只植物标本铁盒。\n\n杰克·斯台普吞！\n\n我以冷峻严密的眼光凝视着他的一举一动，心中对其在泥沼中的身手不免升起一丝近乎赞叹的警惕。若换作任何常人，只要踏错三步，便会瞬间被这万丈泥渊吞噬得尸骨无存；然而这个家伙却如同一只轻灵的山羊，在零星点缀在泥沼间的草墩石块上轻巧跳跃，精准地踩踏着一条唯有他自己掌握的隐秘暗径。突然间，他高高举起捕蝶网，狂奔跳跃着穿过一片看似必死的沼泽，疯狂扑捕着一只珍稀的环纹蝶（cyclopides）。\n\n而在数百码外，华生正迈着军人特有的稳健步伐沿着从庄园通来的小径漫步。斯台普吞很快察觉到了华生的到来，他猛地转身迎上前去，脸上洋溢着一位纯良无害的乡村学者那种热情爽朗、滔滔不绝的温和笑容。\n\n然而正当他们二人在泥潭边缘攀谈之际，一声刺耳凄厉的惨嘶骤然划破长空。一幕惨烈至极的自然悲剧在镜筒中上演：一匹在荒原上觅食的野生矮种马因贪食嫩草，一脚踏破了伪装成草坪的致命泥壳！透过高倍远望镜，我清晰地看到了那匹可怜牲畜垂死挣扎的惨状——它的脖颈绝望地向上伸长，马眼因恐惧而剧烈凸出翻白，短短两分钟内，那贪婪粘稠的黑浆便彻底漫过了它的鼻孔。水泡咕嘟翻滚，泥潭表面随即重新恢复了令人窒息的死寂平整。\n\n斯台普吞微笑着抬手指着马匹灭顶之处，神色自若地向惊骇万状的华生指点解说，神态从容得宛如一位在大学讲堂里为学生演示显微镜切片的博学教授。好一个戴着学者面具、骨子里却冷血残虐至极的恶魔！", "is_ending": false, "clues": ["斯台普吞在凶险万状的大格林盆泥潭中健步如飞，展现出令人惊骇的泥沼暗径掌控力", "一匹野生达特穆尔矮种小马在泥潭中惨叫下陷、活活灭顶，证明了泥沼吞噬万物的致命绝境"], "choices": [{"id": "h_ch7_p1_c1", "text": "紧密转动远望镜，监视华生与从草丛中疾步冲出的斯台普吞‘胞妹’贝丽尔的接触。", "target": "holmes_ch07_part2_beryl_warning", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch7_p1_c2", "text": "【视角切换：杰克·斯台普吞】以斯台普吞视角体验他手挥捕蝶网在沼泽边伪装学者的狡诈嘴脸。", "target": "stapleton_ch07_part1_naturalist_act", "pov_switch": "stapleton", "pov_switch_name": "杰克·斯台普吞"}]}, "holmes_ch07_part2_beryl_warning": {"id": "holmes_ch07_part2_beryl_warning", "title": "第七章 梅利琵宅邸的主人斯台普吞（下：泥潭小径上的慌乱警告）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": null, "content": "斯台普吞忽然为了追扑另一只飞蛾再次钻入了远处的石楠丛，留下华生一人孤零零地伫立在荒原小径旁。恰在此刻，一个身材高挑、容貌绝美的年轻女子蓦地从灌木丛后疾步冲出，径直拦住了华生的去路！\n\n贝丽尔·斯台普吞！\n\n那是一种在英格兰本土极其罕见、带有浓郁南美异域风情的惊人美貌：橄榄色的细腻肌肤，轮廓分明而高贵冷艳的五官，以及一双黑亮如夜却满溢着极度恐慌的深眸。此刻她面色惨白如纸，胸脯因剧烈的喘息而剧烈起伏。\n\n借由这架强大的军用远望镜，我几乎能够毫不费力地读懂她与华生交谈时的每一个肢体动作。她显然将华生误认成了刚刚抵英的亨利·巴斯克维尔爵士！只见她一把死死抓住了华生的衣袖，嘴唇飞速开合，神情急迫凄厉得令人窒息。她拼命打着手势指向南方通往外界的大道，苦苦哀求——乃至近乎发疯般命令对方立刻收拾行囊，务必在今晚夜幕降临之前滚回伦敦去，永远不要再踏足这片受诅咒的土地半步！\n\n华生显然被这位突如其来的异国佳人吓了一跳，连忙试图安抚她的狂躁。而当华生表明自己并非亨利爵士、而是约翰·H·华生医生时，那女人的反应更是耐人寻味：一丝劫后余生般的庆幸一闪而过，紧接着涌上的却是更为深重的绝望与惶恐！\n\n就在此时，斯台普吞的身影已然越过了山脊，捕蝶网在他腿边漫不经心地摇晃。那女子在察觉到动静的刹那间发生的变化，堪称戏剧性——她浑身骤然僵硬得如同一具石雕，脸上那副撕心裂肺的急迫在一秒钟内被冰冷麻木的机械笑容所取代，整个人甚至本能地向后瑟缩倒退了一步，仿佛脸上刚刚挨了一记无形的皮鞭！\n\n斯台普吞微笑着迎向自己的‘胞妹’，然而那抹笑容却始终无法渗透进他那双毒蛇般森冷阴鸷的小眼睛里。好一个巧舌如簧的伪装大师！然而在这对看似和谐体面的乡居‘兄妹’表象之下，我敏锐地嗅出了一种暴君与其掌中囚徒之间令人作呕的恐怖高压。这位美丽的女子绝非心甘情愿的共谋者——她是一个在暴力威胁下忍辱负重、试图暗中打破枷锁的惊弓之鸟！\n\n我缓缓放下了远望镜，大脑深处的思绪如电光石火般飞速流转。所有的线索正在迅速交织闭合。在伦敦，那封剪报警告信出自受过高等教养的女性之手，并隐隐散发着素馨花的幽香；而在这片危机四伏的荒原之上，这位神秘的‘妹妹’竟然冒着性命之危试图搭救爵士的性命。决战的战线，已然彻底划定！", "is_ending": false, "clues": ["贝丽尔·斯台普吞误将华生认作亨利爵士，在荒原小径上极度恐慌地发出绝命撤离警告", "福尔摩斯敏锐捕获这对所谓‘兄妹’之间弥漫的家庭暴力威慑与反常心理控制"], "choices": [{"id": "h_ch7_p2_c1", "text": "返回石屋做好准备，接收并破译华生从庄园寄往伦敦的第一份长篇战报。", "target": "holmes_ch08_watson_report", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch7_p2_c2", "text": "将视线转向岩岗隐蔽隘口，锁定小厮卡特赖特送粮投递邮件的秘密交接点。", "target": "holmes_ch08_watson_report", "pov_switch": null, "pov_switch_name": null}]}, "holmes_ch08_watson_report": {"id": "holmes_ch08_watson_report", "title": "第八章 华生医生的第一份报告（石屋中拆阅的前线密报）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": null, "content": "十月十八日的深夜，小厮卡特赖特气喘吁吁地爬进了黑色岩岗石屋。他从油腻的粗帆布书包里掏出一包凉烤牛肉、两块粗面包、一整包我视若性命的黑色拉塔基亚散烟丝，以及一封厚实沉重、封漆完好的大信封——上面的收件人写着贝克街，笔迹正是华生那工整挺拔的军人字迹！\n\n我擦亮一根火柴，点燃了牛油蜡烛，小心翼翼地展开了挚友的第一份亲笔长篇密报。\n\n华生的表现堪称卓越绝伦。他以陆军军医特有的严密细致，毫无遗漏地记录了庄园内的一切动静。他生动地描摹了橡木护墙长廊那令人窒息的阴森、历代祖先肖像画的冷酷凝视，以及仆从们神经质的惊恐。\n\n而在密密麻麻的墨水字迹中，有三条至关重要的核心情报如闪电般跃入我的眼帘：\n\n第一，管家白利墨在凌晨两点钟蹑手蹑脚地潜入西侧长廊，手持蜡烛死死贴在一扇俯瞰荒原的窗户前，神情极度紧绷地凝视着黑暗，仿佛在向荒原深处的某个神秘人传递烛火暗号！\n\n第二，白利墨太太在白天多次被人目睹掩面痛哭，双眼红肿。究竟是什么不可告人的罪孽将这位体面的老管家与危险的荒原死死拴在一起？我的思绪瞬间联想到了潜逃的诺丁山杀人犯塞尔登！一个女人的眼泪，一个管家的午夜放哨——难道那个嗜血的逃犯，竟是白利墨太太血脉相连的至亲？\n\n第三，亨利爵士与贝丽尔·斯台普吞正式相识，并在一瞬间陷入了无法自拔的热恋！然而斯台普吞非但没有为妹妹能够嫁入豪门成为爵士夫人而狂喜，反而如疯狗般当场爆发出了歇斯底里的病态嫉妒与狂怒，当面厉声喝止亨利爵士，严禁其向贝丽尔吐露半句爱意！\n\n我向着粗糙的石屋顶吐出一口浓郁的青烟。世间哪有一个穷困潦倒的乡居博物学者，会在一位家财万贯的年轻男爵向其‘未婚胞妹’求婚时气急败坏、暴跳如雷？\n\n在全部犯罪心理学的法典之中，合乎理性的解释唯有一条：那个女人根本就不是他的妹妹！她是他的合法妻子！一个被恶魔当作致命诱饵、却又被其极度病态的占有欲死死锁在掌中的可怜囚徒！\n\n这道至高无上的逻辑演绎终于水落石出！我将自己紧紧裹在大氅之中，将装满子弹的左轮手枪枕在头下，阖上双目，静候今晚午夜钟声的敲响。", "is_ending": false, "clues": ["华生密报管家白利墨深夜手持蜡烛在庄园西塔空屋鬼祟徘徊探照荒原", "白利墨太太红肿的泪眼证实这对仆人夫妇深藏不可告人的隐秘悲痛", "亨利爵士不可救药地坠入爱河，对贝丽尔·斯台普吞展开热烈追求"], "choices": [{"id": "h_ch8_c1", "text": "入夜后将远望镜死死锁定庄园西塔窗口，静候管家白利墨的午夜烛火暗号。", "target": "holmes_ch09_part1_midnight_watch", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch8_c2", "text": "【视角切换：约翰·H·华生】阅读华生在庄园书房奋笔疾书寄出的第一份原汁原味战报。", "target": "ch08_watson_report", "pov_switch": "watson", "pov_switch_name": "约翰·H·华生医生"}]}, "holmes_ch09_part1_midnight_watch": {"id": "holmes_ch09_part1_midnight_watch", "title": "第九章 沼地上的烛光（上：黑夜西窗的灯火暗号）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "anchor", "anchor_name": "anchor_convict_holmes", "content": "十月二十日凌晨两点，整片达特穆尔荒原沉浸在一片冷冽凄清的银白月海之中。空气中凝结着刺骨的秋霜。我伫立在石屋外的花岗岩突岩上，夜视远望镜稳稳贴紧眼眶。\n\n分毫不差，正如华生所奏报的那样，巴斯克维尔庄园西侧塔楼那一扇狭窄幽暗的高窗上，骤然亮起了一粒黄豆般大小的惨黄色烛火！那簇火苗足足静止燃烧了五分钟之久，随即在窗口有力地来回挥动了两次！\n\n我迅速转动镜筒，在荒凉死寂的花岗岩峭壁间来回搜寻。果不其然，在相距一英里外、一座突兀孤立的花岗岩峰峦裂隙之中，一记微弱的暗号闪烁着应声亮起！那是一簇极其微小的摇曳火光，在荒古的巨石间犹如一只荧光惨淡的萤火虫。\n\n一切谜底终于彻底揭晓：白利墨夫妇正在暗中接济潜逃的杀人犯塞尔登！白利墨太太正是这个恶贯满盈屠夫的亲生姐姐；手足之情最终战胜了对绞刑架的恐惧！\n\n突然间，两个矫健的身影猛地从庄园围墙的阴影中疾冲而出，踏着碎石与石楠花朝着荒原上的那簇微光全速飞奔！华生与亨利爵士！他们显然早已在长廊中设下埋伏抓获了管家，逼其吐露实情后，竟不顾生死亲自拔枪冲入月光荒原，誓要将这名嗜血狂徒当场擒获！\n\n干得漂亮，华生！这位忠勇的退伍军官正为了保护爵士，在险象环生的巨石阵中出生入死。借着惨白的月光，我亲眼目睹了一场扣人心弦的荒原夜猎：那个满头杂草、身形宛如猿猴般褴褛凶残的逃犯察觉到了追兵，他恶狠狠地掀翻一块巨石砸入峡谷，随即如羚羊般在花岗岩裂缝间疯狂跳跃遁逃，华生的左轮手枪在他身后爆发出清脆震耳的枪声与火光！\n\n而那个逃犯逃窜的方向，恰好直逼我所在的这片悬崖底部。该是让我的挚友明白，在这片危机四伏的荒原之上，并非唯有恶魔在游荡，还有一位冷眼监视全局的守护神！", "is_ending": false, "clues": ["凌晨两点整庄园西塔昏暗的窗棂上亮起了一道惨黄的烛火暗号", "黑色岩岗对面的花岗岩绝壁缝隙中，随即闪烁起微弱的烛光回应", "证实诺丁山逃犯塞尔登正潜伏在史前石洞中，靠白利墨夫妇暗中供给衣食残喘"], "choices": [{"id": "h_ch9_p1_c1", "text": "登上月色笼罩下的黑色岩岗之巅，俯瞰华生与亨利爵士夜巡荒原围捕逃犯。", "target": "holmes_ch09_part2_figure_on_the_tor", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch9_p1_c2", "text": "【视角切换：约翰·H·华生】与亨利爵士并肩在乱石横行的月光荒原上展开惊险狂奔。", "target": "ch09_part2_moor_chase", "pov_switch": "watson", "pov_switch_name": "约翰·H·华生医生"}]}, "holmes_ch09_part2_figure_on_the_tor": {"id": "holmes_ch09_part2_figure_on_the_tor", "title": "第九章 沼地上的烛光（下：月色岩岗上的静默黑影）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": null, "content": "我敏捷地攀上黑色岩岗最顶端的兀岩巨石，在皎洁圆月的万丈清辉之下，将自己挺拔孤峭的剪影清晰地投射在整片荒原的高空之中。我双臂环抱于胸前，犹如一尊冷硬的青铜雕像，静静俯瞰着山谷中的一切。\n\n在下方数百英尺外的石楠丛中，气喘吁吁的华生与亨利爵士终于停下了无功而返的追击脚步。电光石火之间，华生本能地抬起了头颅。透过清澈透明的寒夜空气，他的目光与山巅上的我正正撞在了一起！\n\n我看到华生浑身剧烈一震，一把死死抓住了身旁亨利爵士的肩膀，右手中的左轮手枪下意识地对准了岩岗顶端我的身影！在他眼中，一个身材瘦高、双臂交叉、沉静如石的神秘黑影，正孤独傲立于达特穆尔之巅，宛如荒原黑夜的的主宰者！\n\n然而就在这极具戏剧性的对峙瞬间，一声撕心裂肺、足以冻结骨髓的恐怖嚎叫骤然在大地深处炸响！\n\n那是一阵从地底深处泛起的低沉闷吼，转瞬间化为凄厉、绝望而狂暴的凄凉长嗥！那声音带着嗜血残虐的滔天凶焰，在整片寂静的花岗岩荒原上空疯狂回荡回响，震得脚下的巨石都隐隐颤抖！那是巨大恶犬的嚎叫！那是从大格林盆泥潭最幽深恶臭的泥浆底下喷吐而出的恶魔之音！\n\n我清晰地看见华生与亨利爵士整个人被定格在了碎石丛中，他们的面孔瞬间褪尽了最后一丝血色！亨利爵士甚至踉跄着撞在岩壁上，在极度的祖传恐惧中颤抖着按住胸口；即便是身经百战的迈万德老兵华生，握着手枪的右手亦因骇然战栗而无力垂下！\n\n那只恶兽确实存在！斯台普吞正在泥潭深处磨砺獠牙，准备发动最后的致命一击！\n\n正当华生重整心神、准备端枪顺着石壁向岩岗顶端攀爬搜索之际，我脚下一滑，敏捷地缩入了巨石的浓厚阴影之中，悄然隐没在史前石屋的迷宫暗处，未曾留下半点可寻之迹。", "is_ending": false, "clues": ["华生在荒原追捕尽头抬头仰望，瞥见了傲立在黑色岩岗之巅的瘦高孤峭剪影", "一阵令人毛骨悚然、仿佛来自地狱深渊的恶犬凄厉长嚎在夜空炸响，令华生与爵士当场惊骇僵立"], "choices": [{"id": "h_ch9_p2_c1", "text": "隐身退回史前石屋内部，静候卡特赖特转交华生关于劳拉·里昂斯信件的绝密日记。", "target": "holmes_ch10_diary_and_laura", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch9_p2_c2", "text": "【视角切换：杰克·斯台普吞】目睹恶魔在午夜潜入大格林盆泥潭深处饲喂恶兽的阴森狂喜。", "target": "stapleton_ch09_part1_feeding_the_hound", "pov_switch": "stapleton", "pov_switch_name": "杰克·斯台普吞"}]}, "holmes_ch10_diary_and_laura": {"id": "holmes_ch10_diary_and_laura", "title": "第十章 华生医生日记摘录（L.L.的烧毁信件与达特穆尔之网）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": null, "content": "十月二十三日清晨，卡特赖特准时送来了华生的第二份绝密战报。这份墨迹未干的亲笔手稿中，终于补齐了将伦敦的一系列阴谋与查尔斯爵士之死彻底焊死在一起的最后环扣！\n\n管家白利墨为了感激亨利爵士宽宏大量没有追究其接济杀人犯内弟的重罪，终于良心发现，向爵士与华生吐露了一个折磨了他数月之久的惊天隐秘！\n\n在查尔斯爵士暴毙的当天早晨，老爵士曾收到一封来自库姆马西集镇的私人来信。当晚案发之后，白利墨太太在清理书房壁炉时，在一堆灰烬中发现了那封被烧得残缺不全的信件残片。整封信的大部分内容已化为焦炭，唯独纸张最底端用娟秀女性笔迹写就的一行附言侥幸留存：\n\n‘求求您，求求您，倘若您当真是一位绅士，读罢请务必将此信烧毁，并于今晚十点整在侧门相见！’\n\n而在这行绝命哀求之下的署名缩写，赫然正是‘L.L.’！\n\n我霍地从石屋里的石楠花堆上一跃而起，胸腔中的心脏剧烈撞击着肋骨！‘L.L.’！\n\n在这方圆二十英里的荒蛮教区之中，究竟何人拥有这组字母的姓名缩写？我脑海中关于达特穆尔常住居民的档案库以光速飞旋——劳拉·里昂斯（Laura Lyons）！克兰默庄园那个诉讼成癖的弗兰克兰老头与之断绝父女关系的苦命女儿！她当年盲目冲动地嫁给了一位名叫里昂斯的落魄画家，最终惨遭抛弃沦落赤贫。由于暴怒的父亲拒绝施以援手，这位容貌出众的女人只能在库姆马西开办了一家打字行勉强度日，全靠查尔斯爵士以及——杰克·斯台普吞的私下救济！\n\n整个致命杀局的物理齿轮在我眼前展露无遗！查尔斯爵士生前极度迷信魔咒，天黑之后绝不肯踏出庄园半步。究竟何等力量才能诱骗这位年迈体弱的老绅士在夜间十点孤身一人驻足在通往地狱的木栅侧门旁？\n\n唯有一记以救苦救难之名、直击其骑士精神与善心的致命诱饵！一个走投无路的绝望女人，为了挽救自己的名誉或争取离婚自由而发出的午夜密会哀求！而在这封哀求信的背后，那个伏在她耳边吐着毒液、一字一句指点她写下这封索命符的真正操盘手——唯有杰克·斯台普吞！\n\n我迅速将左轮手枪贴身系牢在大衣内侧。是时候亲赴库姆马西，会一会这位劳拉·里昂斯夫人了！", "is_ending": false, "clues": ["管家白利墨吐露查尔斯爵士猝死当晚前往侧门，系赴一位署名‘L.L.’的神秘女性之约", "通过排查锁定‘L.L.’正是诉讼狂弗兰克兰老头与之断绝关系的贫困女儿劳拉·里昂斯", "壁炉残灰碎屑拼出绝命信尾：‘倘若您是位绅士，请将此信烧毁，并于今晚十点在侧门相候’"], "choices": [{"id": "h_ch10_c1", "text": "微服潜下黑色岩岗奔赴库姆马西，直接对劳拉·里昂斯夫人展开高压质询。", "target": "holmes_ch11_part1_lyons", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch10_c2", "text": "密令卡特赖特紧盯劳拉·里昂斯的打字行，调取其全部私人财务账目与借贷记录。", "target": "holmes_ch11_part1_lyons", "pov_switch": null, "pov_switch_name": null}]}, "holmes_ch11_part1_lyons": {"id": "holmes_ch11_part1_lyons", "title": "第十一章 岩岗上的人（上：库姆马西的锋芒质询）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "anchor", "anchor_name": "anchor_tor_holmes", "content": "我在库姆马西集镇一处清贫简朴的公寓里见到了劳拉·里昂斯夫人。她无疑是一位具有非凡美貌的绝色女子，拥有如绸缎般浓密的栗色秀发与明澈的眼眸，然而她的唇角却带着一种因长期遭受社会冷眼欺凌与贫困折磨而特有的坚硬苦涩。\n\n起初，面对我的试探，她极力保持着傲慢与戒备，断然否认自己在老爵士暴毙当天曾与之通邮。\n\n‘里昂斯夫人，’我身躯微微前倾，以最冷峻锐利的目光死死锁定她的双眸，‘人命关天，此案已绝非任何妇人之仁的虚与委蛇所能掩盖。我们正在调查一桩蓄谋已久的谋杀案！你写给爵士的亲笔信固然被投入了炉膛，然而留在灰烬中的附言却已铁证如山：“求求您，倘若您当真是一位绅士，读罢请将此信烧毁，并于今晚十点在侧门相见！”倘若你此刻依然拒绝吐露实情，那么等待你的将是作为谋杀从犯同赴绞刑架的万劫不复！’\n\n刹那间，她面上的血色褪得一干二净，惨白得如同一尊大理石雕。她用颤抖的双手死死捂住面孔，浑身如风中落叶般剧烈战栗起来。\n\n‘我真的不知道……我发誓我什么都不知道！’她掩面失声痛哭，‘以上帝的名义起誓，我当年以为那是拯救我脱离苦海的唯一生路！是斯台普吞先生告诉我，只要能筹集到两千英镑办理合法的离婚手续，他便会明媒正娶我为合法的妻子！整封信是他一字一句口述逼我写下的！他说查尔斯爵士生性矜持好面子，唯有深夜在侧门私下哀求，才能彻底打动那位老人的善心！’\n\n‘那么你当晚为何失约未去？’\n\n‘因为斯台普吞先生在当天下午突然闯进了我的公寓！’她凄厉地抽泣道，‘他向我发誓，说他的大男子尊严绝不能容忍由另一个男人的施舍来赎买我的自由身！他信誓旦旦地保证由他自己筹措这笔巨款，并以我们之间的爱情为由，严令我当晚绝不许踏足巴斯克维尔庄园半步！结果到了第二天早晨，报纸上便刊登出了查尔斯爵士暴毙的死讯！’\n\n整桩魔鬼杀局在这一刻终于彻底水落石出！斯台普吞利用这个苦命女人作为将爵士诱出高墙的诱饵，随后强令其失约退场，自己则牵着那只涂满磷光的恶魔巨兽，在侧门外完成了对老爵士的心脏处决！\n\n任凭这位悔恨交加的妇人在屋内抱头痛哭，我已裹紧风衣大步流星跨入荒原。天际残阳如血，阴影正在迅速吞噬群峰，我知道，忠诚的华生此刻必定正在搜寻石屋的主人！", "is_ending": false, "clues": ["劳拉·里昂斯在严厉逼问下招认确实写信约见查尔斯爵士于夜间十点在侧门碰头", "斯台普吞以许诺与其结婚为诱饵，诱骗其诱出爵士为其筹措高额离婚诉讼费", "斯台普吞在当晚强令劳拉取消约会绝不许现身，让老爵士在寒夜侧门孤立无援静候死神"], "choices": [{"id": "h_ch11_p1_c1", "text": "在夜幕彻底吞没荒原前全速赶回黑色岩岗石屋，准备与华生迎来戏剧性会师。", "target": "holmes_ch11_part2_stone_hut", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch11_p1_c2", "text": "【视角切换：约翰·H·华生】端详华生在黄昏中端枪逼近石屋、誓要缉拿‘岩岗怪客’的英姿。", "target": "ch11_part2_stone_hut", "pov_switch": "watson", "pov_switch_name": "约翰·H·华生医生"}]}, "holmes_ch11_part2_stone_hut": {"id": "holmes_ch11_part2_stone_hut", "title": "第十一章 岩岗上的人（下：石屋会师与撕破画皮）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": null, "content": "当最后一抹血红色的残阳在西天尽头彻底熄灭时，我已疾步返回了黑色岩岗石屋。当我轻手轻脚接近低矮的石门入口时，我那敏锐的感官瞬间捕捉到了一股极其鲜明的陌生气息——那是一股埃及卷烟（Egyptian cigarette）特有的辛辣醇香，正是我的老伙计约翰·H·华生医生平日专用的品牌！\n\n我悄无声息地迈入低矮的门槛。在昏暗紫郁的暮色中，一个矫健的身影猛地从石楠花铺上一跃而起，黑洞洞的左轮手枪枪口在暮色中泛着森冷的光芒！\n\n‘天气真好，我亲爱的华生！’我从容地迎向那柄手枪，微笑着开口道，‘坦白讲，我觉得你坐在外面的草地上吹吹晚风，总比死死窝在这块硬邦邦的花岗岩上要舒服得多。’\n\n‘福尔摩斯！’华生失声惊呼，手中的左轮手枪啪的一声落在了花堆上，嗓音中交织着死里逃生的极度欣喜与被蒙在鼓里的难以置信，‘福尔摩斯！仁慈的上帝啊，真的是你？难道这段日子以来，你竟然一直潜伏在这片荒原上？！’\n\n‘分分秒秒都在这里，我亲爱的老伙计，’我划着火柴点燃了烟斗，‘请原谅我这番必要的善意隐瞒。倘若亨利爵士或是斯台普吞得知我亲临此地，我们那位狡猾阴毒的对手必将退缩到绝对密不透风的坚壳之中。正是借由你那份光明磊落、毫不作伪的公开行动作为掩护，我才能隐蔽在幕后完成全部致命线索的合围！’\n\n华生狠狠握住了我的双手，展现出他老兵特有的热血温情。我们肩并肩席地坐在干燥的石楠花丛上，迅速汇总各自掌握的情报。\n\n‘现在，华生，’我神色肃穆，吐出一口浓烟，‘让我为你递上打开整座迷宫的终极万能钥匙。你多次拜会过那位斯台普吞小姐。难道你就未曾觉得不可思议——一个穷困潦倒的兄长，在面对一位品行高洁、家财万贯的年轻男爵向其胞妹求婚时，竟然会歇斯底里地爆发出一股病态的杀人狂怒？’\n\n‘这件事确实让我百思不得其解！’华生承认道。\n\n‘那是因为你轻信了一句弥天大谎！那位美丽的女士根本就不是他的胞妹，华生。她是他的合法结发妻子！一个他在南美洲迎娶的哥斯达黎加女人！他带着她隐姓埋名潜逃至此，逼迫她伪装成未婚妹妹充当引诱富豪步入死地的致命诱饵，却又在骨子里如恶犬般对她施以惨无人道的严密监控与病态嫉妒！’\n\n华生的面庞因崇高的正义之怒而涨得通红。‘全能的上帝啊！这么说来，斯台普吞竟是一个——’\n\n‘这世间有史以来最冷血、最缜密、最丧心病狂的连环谋杀巨魔！’", "is_ending": false, "clues": ["华生端枪摸入石屋设伏；福尔摩斯在阴影中泰然吐出经典问候：‘天气真好，我亲爱的华生！’", "福尔摩斯彻底撕破画皮：揭露贝丽尔实为斯台普吞的原配妻子而非胞妹", "斯台普吞真实身份乃是蓄谋侵吞七十四万英镑巨额遗产的巴斯克维尔旁系恶魔"], "choices": [{"id": "h_ch11_p2_c1", "text": "与华生并肩步出石屋登上悬崖峭壁，就近在咫尺的生死危局商讨决战策略。", "target": "holmes_ch12_part1_revelations", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch11_p2_c2", "text": "在石屋月光下全面核对关于劳拉·里昂斯笔供与斯台普吞恶谋的全部绝密拼图。", "target": "holmes_ch12_part1_revelations", "pov_switch": null, "pov_switch_name": null}]}, "holmes_ch12_part1_revelations": {"id": "holmes_ch12_part1_revelations", "title": "第十二章 沼地的惨剧（上：悬崖峭壁上的恶犬狂吠）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "anchor", "anchor_name": "anchor_death_holmes", "content": "我和华生并肩踏上石屋外狭窄的花岗岩露台。惨白的月轮已被天际涌起的一层厚重乌云所遮蔽，整片浩瀚无垠的达特穆尔荒原陷入了令人窒息的漆黑深渊。\n\n‘整桩铁案的证据链已然近乎完备，华生，’我按住他的肩膀，神色凝重地低语道，‘劳拉·里昂斯夫人已彻底招供了查尔斯爵士被诱往侧门的全部细节；我们也已洞悉了伦敦失窃旧靴的真相——凶手偷盗穿过的旧皮靴，正是为了训练这只嗜血凶兽死死锁定亨利爵士个人的血肉气味！然而，若要将这个恶魔送上英国法庭的绞刑架，我们还缺少最核心的现行实体物证！在没有抓获恶犬现行之前，纯粹的逻辑演绎还不足以彻底说服陪审团——’\n\n突然之间，从荒原那片死寂漆黑的无底深渊之中，骤然炸响了一声令我们周身血液瞬间凝结成冰的咆哮！\n\n恶犬！那是一种低沉、浑厚、在山谷间激荡共鸣的恐怖轰鸣！\n\n那绝非凡间家犬的吠叫，而是一头来自九幽深渊的食人怪兽咬死热血猎物时的狂欢！而紧接着，在这阵凄厉恶犬狂吠的上空，猛地拔起了一声凄厉尖锐、撕裂云霄的垂死惨嚎！\n\n‘万能的上帝啊！’华生惊骇失声，右手闪电般拔出了腰间的左轮手枪，‘你听到了吗？！’\n\n‘亨利爵士！’我倒吸一口冷气，冷汗如瀑布般从前额狂涌而下，‘他今晚竟然真的擅自踏上了荒原！’\n\n那声惨嚎再次划破夜空——距离我们更近了！其间还伴随着鞋底在碎石碎岩上疯狂打滑的摩擦声，以及一双沉重狂暴的巨爪踩踏苔原的狂暴奔袭声！紧接着，最后一声凄厉欲绝的悲鸣在空中戛然而止，取而代之的是悬崖绝壁底部一声令人毛骨悚然、骨骼碎裂的沉闷撞击巨响！随后，一切重归死寂——那是一种比任何狂嚎更为可怖的永恒死寂！\n\n‘这边，华生！看在上帝的份上，全速冲刺！’\n\n我们毫不犹豫地扑向险峻的花岗岩陡坡，在漆黑的乱石堆中飞身跳跃疾驰，手中的左轮手枪扳机全开，全速冲向绝壁悬崖底部！", "is_ending": false, "clues": ["浓雾弥漫的花岗岩悬崖方向爆发出一阵震耳欲聋、撕心裂肺的恶犬狂吠与垂死人类惨呼", "福尔摩斯与华生拔出左轮手枪，在崎岖遍布的花岗岩乱石间全速飞奔施救"], "choices": [{"id": "h_ch12_p1_c1", "text": "顺着惨叫声拼死冲向绝壁悬崖底部，拔枪截击地狱恶犬与凶手。", "target": "holmes_ch12_part2_selden_death", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch12_p1_c2", "text": "【视角切换：杰克·斯台普吞】从斯台普吞视角体会他手持旧靴放出恶犬噬人的癫狂杀意。", "target": "stapleton_ch12_part1_screams_on_crags", "pov_switch": "stapleton", "pov_switch_name": "杰克·斯台普吞"}]}, "holmes_ch12_part2_selden_death": {"id": "holmes_ch12_part2_selden_death", "title": "第十二章 沼地的惨剧（下：摔碎的替死者与迎面交锋）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": null, "content": "在一座足有四十英尺高的刀削般垂直花岗岩绝壁脚下，横卧着一具扭曲折断、血肉模糊的黑影。\n\n华生猛地扑倒在尸骸旁，发出了近乎崩溃的绝望痛呼：‘亨利爵士！天啊，福尔摩斯，恶犬到底还是得手了！’\n\n那具尸体身上紧紧包裹着一套厚重扎实的红褐色粗花呢猎装——正是亨利·巴斯克维尔爵士在伦敦贝克街初次登门时所穿的那套一模一样的衣裳！死者的头颅在乱石上撞得粉碎，颈椎彻底折断扭曲。\n\n我霍地跪下身躯，擦亮一根火柴，一把掰正了那张沾满腥血的死人脸孔。下一秒，我忍不住在夜色中爆发出一声昂扬狂喜的厉声高呼！\n\n‘华生！快看他的胡须！看他的眉骨！这根本不是亨利爵士！这是潜逃的诺丁山杀人犯塞尔登！’\n\n华生目瞪口呆地死死盯着那张狰狞丑陋的面孔。‘逃犯？可看在老天爷的份上，他身上怎么会穿着亨利爵士的贴身行头？！’\n\n‘这是白利墨的施舍善举！’我心中的万钧重担在刹那间烟消云散，忍不住大笑出声，‘爵士将换下来的旧粗花呢大衣随手赏给了老管家，管家转手就送给了荒原上挨冻的杀人犯内弟！斯台普吞用那只偷盗的旧皮靴让恶犬牢牢吸足了爵士的体味——恶兽在夜色中闻着旧衣服的气味一路穷追不舍，硬是将这个倒霉的替死鬼生生逼下了万丈悬崖，摔了个脑浆迸裂！’\n\n就在这千钧一发之际，一束昏黄摇曳的马灯光柱穿透浓雾，自乱石林后缓缓探出。一个身形轻巧利落的影子漫步踱入空地。\n\n杰克·斯台普吞！\n\n这个恶魔专程赶来欣赏亨利爵士横尸荒野的杰作！然而当他手中的马灯光柱骤然照亮我那张冷峻的面庞时，整个人如遭九天惊雷当头劈中，面孔在瞬间褪尽了血色，惨白得犹如一具活尸！足足有三秒钟之久，这位犯罪巨枭彻底僵死在了原地，在濒死的恐惧与亡命的狡诈之间剧烈挣扎！\n\n‘福……福尔摩斯先生！’他拼尽全身力气强行克制住牙关的颤抖，结结巴巴地强挤出一丝干瘪的假笑，‘这怎么可能？当真是三生有幸的大驾光临！只是……这位不幸罹难的先生究竟是哪位？’\n\n‘一个在荒原上越狱的逃犯，斯台普吞先生，’我悠闲地吐出一口烟圈，面无表情地拍了拍大衣上的碎石，‘看来是他失足坠崖跌断了脖子。纯属一桩令人遗憾的意外悲剧。我和华生明天一早便要搭乘早班火车返回伦敦，我们的德文郡度假之旅到此结束了。’\n\n斯台普吞长长地松了一口气，脸上绽放出了一抹如释重负的恶毒冷笑。这个自作聪明的蠢材天真地以为自己的秘密依然固若金汤！再过四十八小时，收口的猎网便将彻底将他送上绞刑架！", "is_ending": false, "clues": ["惨死绝壁之下的死者并非爵士，而是身穿亨利爵士淘汰粗花呢旧衣的逃犯塞尔登", "盗取旧皮靴的气味锁定了旧衣服的体味，导致饥饿巨兽将逃犯误作男爵扑下悬崖摔死", "斯台普吞手提马灯自夜色中现身试探虚实，被福尔摩斯不动声色的从容伪装彻底迷惑"], "choices": [{"id": "h_ch12_p2_c1", "text": "返回巴斯克维尔庄园检视历代祖先肖像画，铺设彻底歼灭凶手的终极决战罗网。", "target": "holmes_ch13_portrait", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch12_p2_c2", "text": "在花岗岩乱石堆前与惊魂未定的斯台普吞针锋相对，以高超演技掩盖全部底牌。", "target": "holmes_ch13_portrait", "pov_switch": null, "pov_switch_name": null}]}, "holmes_ch13_portrait": {"id": "holmes_ch13_portrait", "title": "第十三章 设网（雨果画像的真面目与致命陷阱）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "anchor", "anchor_name": "anchor_portrait_holmes", "content": "当晚，在巴斯克维尔庄园那座空旷阴森的古老橡木大宴会厅里，借着摇曳的烛光，我们用罢冷肉与波尔多红酒。我叼着烟斗，目光长久地在墙壁上那一整排历代先祖油画肖像间缓缓游移。华生与亨利爵士在一旁屏息静候。\n\n突然间，我的目光死死钉在了一幅绘制于一六四七年的古旧肖像画上。画布上描摹着一位面相冷酷残忍的保王党骑士，身着一袭黑丝绒长袍，领口缀着华贵的蕾丝花边。\n\n‘请问那位先生尊姓大名？’我看似漫不经心地随口一问。\n\n‘那正是恶棍雨果·巴斯克维尔本人，’亨利爵士苦笑着摇头，‘引发了我们全家族百年生死诅咒的罪魁祸首。’\n\n我耐心地等待亨利爵士告退回房歇息。随后，我毫不犹豫地搬起一把餐椅踏上高处，手举烛台凑近画布。我伸出两只手掌，精准地遮挡住了画中骑士那顶宽大的插羽软帽与披肩长鬈假发，完全隐去了属于十七世纪的一切时代装束。\n\n华生猛地从餐桌旁一跃而起，在空荡荡的大厅里爆发出了一声惊骇欲绝的高呼！\n\n‘仁慈的上帝啊！’他失声尖叫，‘那是杰克·斯台普吞的脸！’\n\n‘分毫不差！’我跳下餐椅，眼中闪烁着洞悉一切的冰冷光芒，‘这是一起惊人的隔代遗传返祖现象（atavism），两百年前的魔鬼血脉在两百年后肉身复活！杰克·斯台普吞本质上就是一个如假包换的巴斯克维尔！他是查尔斯爵士那位劣迹斑斑、流亡南美洲客死异乡的幼弟罗杰·巴斯克维尔的亲生儿子！只要除掉亨利爵士，他便是七十四万英镑巨额信托遗产的唯一合法继承人！’\n\n收网的时机已然彻底成熟。第二天清晨，我和华生当众演了一出乘马车返英返京的大戏，以麻痹斯台普吞布下的耳目。然而在库姆马西车站，我们悄然潜下车厢，与苏格兰场王牌刑警雷斯垂德（Inspector Lestrade）胜利会师。\n\n而我对亨利爵士下达的最终指令冰冷严酷至极：他必须按原计划孤身前往梅利琵宅邸赴宴，宣称我和华生已然离境；而在深夜十点钟宴席散去之后，他必须孤身一人踏上夜色荒原，沿着大格林盆泥潭边缘的那条必经之路步行折返庄园！\n\n年轻男爵的钢铁意志没有丝毫动摇，他慨然答应充当诱捕恶魔的唯一诱饵。当浓黑的夜幕再次笼罩死沼之时，我、华生与雷斯垂德三人已然荷枪实弹，屏息潜伏在距梅利琵宅邸窗口两百码外那片冰冷刺骨的花岗岩暗礁之后。", "is_ending": false, "clues": ["遮挡雨果·巴斯克维尔画像上的宽檐阔帽与长卷假发，赫然露出与斯台普吞一模一样的脸庞", "确凿证实斯台普吞实为查尔斯爵士流亡南美的幼弟罗杰·巴斯克维尔之子，谋财篡位动机昭然若揭", "命亨利爵士依约孤身赴梅利琵宅邸赴鸿门宴，并严格按照凶手设计在夜间十点沿泥潭小径步行返家"], "choices": [{"id": "h_ch13_c1", "text": "前往车站汇合苏格兰场刑警雷斯垂德，深夜埋伏在梅利琵宅邸外围的绝命巨石阵中。", "target": "holmes_ch14_part1_fog_ambush", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch13_c2", "text": "【视角切换：杰克·斯台普吞】窥视恶魔在梅利琵宅邸暗中研磨剧毒磷光、设宴备战的阴鸷心机。", "target": "stapleton_ch13_fatal_dinner", "pov_switch": "stapleton", "pov_switch_name": "杰克·斯台普吞"}]}, "holmes_ch14_part1_fog_ambush": {"id": "holmes_ch14_part1_fog_ambush", "title": "第十四章 巴斯克维尔的猎犬（上：大雾与喷火巨兽）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "anchor", "anchor_name": "anchor_climax_holmes", "content": "寒夜刺骨入髓，然而在此绝命关头，最致命的强敌并非凶顽狡黠的匪徒，而是大自然无常的造化！\n\n从大格林盆泥潭深处，一堵厚重粘稠、在月光下泛着死白光泽的浓雾之墙正疯狂向内陆滚滚推进！那迷雾如雪崩般寂静无声却迅猛狂暴，寸寸吞噬着石楠花与花岗岩巨石，正以肉眼可见的速度向唯一的返程羊肠小道疯狂蔓延！\n\n‘倘若在爵士踏出房门之前大雾切断了小道，’我咬紧牙关，牙缝中迸出森寒的低语，‘我们便永远无法救下他的性命！’\n\n九点五十五分，梅利琵宅邸的大门吱呀一声被推开了。亨利爵士身裹大衣迈步踏入黑夜。他停下脚步环视四周，深吸了一口寒气，随即迈开稳健急促的步子，顺着紧挨泥潭边缘的那条必经石道快步折返。\n\n他刚从我们埋伏的巨石圈前走过五十码远，大雾深处骤然响起了一阵令人魂飞魄散的死神脚步！\n\n那是一阵沉重、狂暴、踩得湿漉漉的泥炭大地隐隐震颤的狂暴奔蹄声！\n\n‘注意隐蔽！’我厉声暴喝，瞬间将手中的左轮手枪扳机压到极限，‘它来了！’\n\n下一秒，从那堵雪白如墙的翻滚浓雾之中，赫然凌空飞扑出一具即便是最狂乱的疯人梦境也绝难描摹的旷世恶魔！\n\n一只恶犬！然而那是一只凡间肉眼从所未见的巨兽！一头体型硕大如牛犊、毛色漆黑如焦炭的狂暴恶兽，体格兼具寻血猎犬的追踪狂暴与马士提夫獒犬的骇人骨架！更令人毛骨悚然的是，两道幽绿惨淡的烈焰正从其张开的血盆大口中熊熊喷吐，一双巨眼有如燃烧的炭火般闪烁着血光，甚至连它的吻部、颈项的鬃毛与垂肉，都整整齐齐地勾勒在一层闪烁跳跃的幽蓝地狱鬼火之中！\n\n那怪兽以惊人的长距离飞跃在石楠丛上狂暴掠过，带着扑面而来的硫磺焦臭，直取亨利爵士脆弱的咽喉！爵士闻声回头，吓得发出一声撕心裂肺的绝望惨叫，两腿一软当场瘫倒在泥泞小道上！\n\n我猛地从乱石堆上一跃而起，双手握枪稳如磐石，对着那头狂暴巨兽的肋骨连发五枪！\n\n子弹精准命中要害！巨兽在半空中爆发出了一声震耳欲聋、撕裂苍穹的凄厉嚎叫，沉重的躯体在空中猛烈翻滚着重重砸向地面，四只巨爪疯狂抓挠着空气！它在血泊中发狂般挣扎着再次挺起上半身，试图张开滴淌腥血与磷火的獠牙做殊死一搏，然而我和华生同时扣动了扳机！一发铅弹瞬间贯穿了它的颅骨！\n\n那头巨兽浑身剧烈战栗抽搐了一下，庞大的身躯噗通一声瘫软在枯萎的石楠花堆之中，四肢一挺，彻底绝了生息！\n\n巴斯克维尔家族两百年的不散阴魂，在这一刻被现代科学的铅弹彻底打得粉碎！", "is_ending": false, "clues": ["大格林盆泥潭涌起滔天雪白浓雾，如白色潮水般迅速向伏击巨石圈疯狂逼近", "一头体格如小牛般庞大的纯黑巨兽破雾而出，口鼻獠牙与双眼周遭燃烧着幽绿的磷光鬼火", "福尔摩斯在恶兽凌空扑咬的电光石火间连射五枪，在距离爵士咽喉数寸处将恶魔当场毙命"], "choices": [{"id": "h_ch14_p1_c1", "text": "强攻破入梅利琵宅邸解救惨遭绑架的贝丽尔，紧追凶手足迹杀入大格林盆泥潭深处。", "target": "holmes_ch14_part2_mire_pursuit", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch14_p1_c2", "text": "【视角切换：杰克·斯台普吞】目睹恶犬被枪毙的绝望崩溃，仓皇逃入噬人死沼深渊。", "target": "stapleton_ch14_part2_panic_flight", "pov_switch": "stapleton", "pov_switch_name": "杰克·斯台普吞"}]}, "holmes_ch14_part2_mire_pursuit": {"id": "holmes_ch14_part2_mire_pursuit", "title": "第十四章 巴斯克维尔的猎犬（下：魔窟搜寻与沉入泥淖）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": null, "content": "我和华生半跪在那具死透的恶犬尸骸旁。我伸出手指抚摸着它那焦糊的口鼻。虽然烈焰般的荧光已然熄灭，但其皮毛表面依然附着着一层滑腻粘稠的特制油脂。\n\n‘磷光涂料！’雷斯垂德伸手捻了捻湿漉漉的皮毛，忍不住倒吸一口凉气。\n\n‘极其精妙的无机化学配方，’我用手帕擦拭着指尖，冷静地评述道，‘无色无嗅，因而完全不会干扰猎犬敏锐的嗅觉追踪；然而一旦置于暗处，却能泛出骇人的地狱磷火。这是一只兼具马士提夫獒犬体魄与寻血猎犬野性的杂交品种，长期被囚禁在饥饿与暴虐之中以激发嗜血兽性。’\n\n命雷斯垂德在小道上好生照料瘫软战栗的亨利爵士，我和华生拔腿冲向梅利琵宅邸，飞脚踹开了紧闭的厚重大门。\n\n一楼死一般寂静，空无一人。当我们顺着狭窄的楼梯冲向二楼并破开反锁的客房木门时，一幕惨绝人寰的暴行赫然呈现在眼前！贝丽尔·斯台普吞被沉重的窗帘粗绳死死绑在冰冷的黄铜床柱之上，一条厚厚的丝巾勒紧了她的嘴唇。在她雪白幼嫩的手腕与修长的脖颈上，赫然布满了令人触目惊心的乌青掐痕与皮鞭抽打的血印！\n\n华生闪电般割断了绳索。当取下口中的丝巾时，这位饱受折磨的绝美贵妇用尽最后一丝力气凄厉地哀求道：\n\n‘他……他还活着吗？！亨利爵士他死里逃生了吗？！’\n\n‘他安然无恙，’我温和地扶住她摇摇欲坠的身躯，‘而且那只恶犬已被我们当场击毙！’\n\n‘谢天谢地！感谢上帝！’她泪如雨下，浑身剧烈颤抖，‘斯台普吞已经逃进了大格林盆泥潭深处！他在沼泽最核心的孤岛上一座废弃锡矿工棚里筑造了魔窟，平日正是将猎犬隐匿在彼处！然而今晚的大雾如此遮天蔽日，他绝对不可能看清脚下的暗径！’\n\n次日清晨，当惨白的艳阳终于驱散了漫天浓雾时，依照这位重获自由夫人的指引，我和华生踏入了这片死神盘踞的绿色绝境。我们小心翼翼地踩着斯台普吞生前沿途插下用来标记暗径的折断树枝向前摸索。在行进至前往孤岛正中、整片泥浆如绿色果冻般剧烈颤抖翻滚的绝命死地时，一件半陷在黑泥中的黑色异物猛地刺入了我的眼帘。\n\n我探出手杖的长柄弯钩，小心翼翼地将那件物品挑上了结实的草墩。\n\n一只破旧的黑色皮靴，鞋舌内侧清清楚楚地印着多伦多‘迈尔斯鞋行’（Meyers, Toronto）的烫金铭文！正是那只从伦敦诺森伯兰旅馆盗走、险些置爵士于死地的关键证物——恶魔在昨夜惊慌绝命狂奔时随手抛弃的累赘！\n\n而越过这只皮靴，前方标记暗径的折枝彻底断绝了。在浩瀚平整、散发着剧毒硫磺气味的茫茫黑泥表面，再也找不到任何折返的脚印。唯有一道深深滑向万丈深渊的绝望脚跟滑痕，清晰地烙印在浮草边缘——那里见证了一个恶徒在失足倾覆的最后一刹那，曾如何绝望抓挠泥沼试图挽回生机，却最终彻底失败的痕迹！翻滚的黑色泥浆已然无情漫过他的头顶，将其彻底封死在了大地最黑暗的幽室之中。\n\n在大格林盆泥潭那万劫不复的腥臭污泥极深处，那颗冷血、狡诈而残忍至极的心脏已然永远停止了跳动。这片吞噬了无辜生命的古老死沼，最终成为了恶魔自掘的万年坟墓！", "is_ending": false, "clues": ["破门救出被反绑在黄铜床柱上、满身伤痕口塞手帕的贝丽尔·斯台普吞", "在泥潭核心孤岛的废弃锡矿工棚中查获磷光特制涂料与亨利爵士失窃的旧黑皮靴", "斯台普吞在浓雾慌乱中踏空暗径，被大格林盆泥潭万丈黑泥活活吞噬，尸骨无存"], "choices": [{"id": "h_ch14_p2_c1", "text": "返抵贝克街起居室，在暖融融的壁炉旁为华生展开全案精妙绝伦的总回顾演绎。", "target": "ch15_holmes", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch14_p2_c2", "text": "高举酒杯向身手果决的华生医生致敬，铭记传奇搭档破灭百年魔咒的不朽篇章。", "target": "ch15_watson", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch14_p2_c3", "text": "见证正义昭彰与理性大获全胜，巴斯克维尔庄园重归宁静祥和的圆满凯旋。", "target": "ch15_victory", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch14_p2_c4", "text": "凝视着秋雨敲打的窗扉，为无辜者遭受的沉痛神经创伤与代价肃穆沉思。", "target": "ch15_tragedy", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch14_p2_c5", "text": "凝视壁炉余烬，感叹那吞噬恶魔的大格林盆远古死沼才是罪恶最公正的天然坟墓。", "target": "ch15_mire", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch14_p2_c6", "text": "翻阅各大报纸头版，审视法网恢恢老贝利法庭对潜逃罪枭作出的至高正义审判。", "target": "ch15_arrest", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_ch01_part1_heritage": {"id": "stapleton_ch01_part1_heritage", "title": "第一章 阴谋的序曲（上：罗杰·巴斯克维尔的血脉与野心）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "anchor", "anchor_name": "anchor_chapter1_stapleton", "content": "我坐在梅利琵宅邸的书房里，正用细钢针将一只罕见的沼泽网蛱蝶标本精准刺入软木板中。透过临窗的狭小玻璃，达特穆尔荒原浩瀚苍凉的苔原向着远方灰暗的花岗岩峰峦无垠蔓延。在世人眼中，我是杰克·斯台普吞——一个戴着金丝眼镜、温文尔雅的落魄乡村教师兼昆虫学者，整日挥舞着一面绿纱网在泥潭边扑捉飞蛾度日。\n\n蠢材！一帮瞎了眼的乡巴佬！\n\n在我的骨髓与血管深处，奔淌着的乃是巴斯克维尔家族最纯正、最桀骜不驯的狂暴贵族之血！我的亲生父亲罗杰·巴斯克维尔，是查尔斯爵士那一辈三兄弟中最年幼的幼弟——那个在放荡败家后潜逃中美洲、被家族族谱彻底抹杀的浪子。我出生在哥斯达黎加酷热的种植园里，继承了父亲的名字，更继承了他冷酷果决的惊人头脑。当我携带着美艳绝伦的异国娇妻贝丽尔·加西亚重返英格兰时，我曾在约克郡以凡德勒（Vandeleur）之名开办了一所贵族男子寄宿学校。然而一场突如其来的斑疹伤寒夺走了三名男童的性命，学校在一夜间破产清算，我也瞬间沦为了负债累累的落魄乞丐。\n\n正是在那场仓皇逃亡的穷途末路之中，命运向我掀开了最璀璨的宝藏帷幕。我的亲伯父查尔斯·巴斯克维尔爵士从南非金矿载誉归来，一个膝下无子、身患绝症的鳏夫老人，怀揣着高达七十四万英镑的金边债券与现款，正在达特穆尔斥资重修祖业！\n\n在那座令人发狂的金山与我之间，仅仅阻隔着两条微不足道的脆弱性命：一个心脏彻底损坏、苟延残喘的糟老头子，以及一个远在加拿大冰原上挥舞锄头的粗鄙农夫侄子！\n\n我变卖了约克郡的全部破烂家当，带着贝丽尔隐姓埋名潜入德文郡，在紧挨大格林盆泥潭边缘租下了这座孤零零的梅利琵宅邸。我以暴力威慑严令贝丽尔对外宣称是我的未婚胞妹。而在老爵士好客热情的引荐下，我在庄园古老的藏书室中掘出了最完美的索命神器：那份记载着恶棍雨果·巴斯克维尔遭地狱猎犬撕碎咽喉的一七四二年祖传诅咒手稿！\n\n一个传承两百年的家族血腥魔咒！放眼全天下，还有什么比这个幽灵神话更适合充当毫无物理痕迹的完美谋杀工具？！", "is_ending": false, "clues": ["斯台普吞真实血统乃是流亡南美的幼弟罗杰·巴斯克维尔之亲生骨肉", "在约克郡开办贵族学校破产倒闭后，携娇妻贝丽尔隐姓埋名伪装兄妹潜入达特穆尔", "吞并高达七十四万英镑庞大信托遗产的宏图，必须彻底扫除堂兄查尔斯与堂侄亨利两大路障"], "choices": [{"id": "s_ch1_p1_c1", "text": "踏上大格林盆泥潭暗径深入绝密孤岛，检视囚禁在废弃锡矿工棚中的嗜血巨兽。", "target": "stapleton_ch01_part2_beast", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch1_p1_c2", "text": "【视角切换：歇洛克·福尔摩斯】切换至伦敦贝克街，目睹名侦探以手杖展开神准演绎。", "target": "holmes_ch01_part1_observation", "pov_switch": "holmes", "pov_switch_name": "歇洛克·福尔摩斯"}]}, "stapleton_ch01_part2_beast": {"id": "stapleton_ch01_part2_beast", "title": "第一章 阴谋的序曲（下：泥潭孤岛的巨兽与磷光配方）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "我踩着那些唯有我自己知晓的沉水暗石，轻巧穿过大格林盆泥潭的致命泥浆，踏上了位于沼泽核心孤立无援的花岗岩小岛。在这里，隐匿在一座伊丽莎白时代废弃旧锡矿的坍塌石棚之中，囚禁着我的毕生杰作。\n\n我推开厚重的旧工棚木门。一阵从喉管深处爆发出的低沉闷吼在幽暗中轰然作响，伴随着铁链哗啦啦剧烈拉扯的金属摩擦声。\n\n两只在黑暗中泛着嗜血绿光的凶残巨眼瞬间死死锁定了我的咽喉。\n\n那是一头堪称庞然巨物的怪兽，通体如炭黑，兼具马士提夫獒犬的恐怖骨骼与寻血猎犬的杀戮本能。这是我亲自赶赴伦敦富勒姆路‘罗斯与曼格尔斯’名犬行重金购得的极品。我通过北部的货运支线将其秘密运抵德文郡，趁着夜色徒步翻山越岭，从未让任何世人的目光瞥见过它的半点影子。它肩高足有三十英寸，颚骨粗壮如猛虎，四肢肌肉坚硬如钢铁。\n\n我从皮包里掏出了我潜心研制的绝密化学配方：一种将高纯度白磷溶解于精炼骨油与甘油中的特制冷光油膏。它不含任何刺激性挥发气味，完全不会破坏恶犬那敏锐无匹的嗅觉追踪系统。\n\n我安抚着狂躁低吼的恶兽，伸手抚摸着它坚硬如铁的头颅，小心翼翼地将磷光油膏均匀涂抹在它的口吻、獠牙边缘、双眼眼眶以及颈下那圈骇人的鬃毛垂肉之上。\n\n我向后退开三步，啪的一声合上了马灯的遮光罩。\n\n即便是早有心理准备的我，在黑暗降临的一刹那也不禁倒吸了一口凉气！在伸手不见五指的幽暗工棚之中，眼前的猛兽彻底蜕变成了一头降临人间的地狱幽冥恶魔！它的血盆大口仿佛在向外疯狂喷吐着惨绿幽蓝的熊熊烈焰；两只巨眼宛如从炼狱深处抠出的烧红火炭；滴淌腥血的獠牙周围环绕着刺骨的阴冷鬼火！\n\n查尔斯老爵士是一个长期深陷中世纪迷信恐惧的垂死老人，他的心脏衰弱得宛如一只中箭的惊弓之鸟。他绝对无法承受这等毁天灭地的视觉暴击！我的恶犬甚至根本不需要碰他一根汗毛——只要让这头喷吐烈焰的巨兽在红豆杉树篱后咆哮现身，老东西脆弱的心脏便会瞬间在胸膛中彻底炸裂！\n\n死神的镰刀已然磨砺完毕。现在，我只需抛出一根致命的诱饵，将那个深居简出的老顽固从庄园高墙里引诱至午夜的黑暗荒原！", "is_ending": false, "clues": ["从伦敦富勒姆路著名的‘罗斯与曼格尔斯’犬商处暗中购得血统最暴虐的獒犬杂交种", "囚禁在大格林盆泥潭最幽深绝密的核心孤岛废弃锡矿工棚之中", "研制出独门秘方：将白磷溶入骨油与甘油制成无嗅冷光涂料，使恶兽在暗夜中通体喷火而不伤毛皮"], "choices": [{"id": "s_ch1_p2_c1", "text": "利用爱情陷阱彻底套牢劳拉·里昂斯，指使她写下深夜约见查尔斯爵士的致命诱饵信。", "target": "stapleton_ch02_part1_laura_trap", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch1_p2_c2", "text": "在泥潭孤岛上以新鲜生牛肉逗弄恶犬，测试其在极度饥饿状态下的凶暴撕咬力。", "target": "stapleton_ch02_part1_laura_trap", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_ch02_part1_laura_trap": {"id": "stapleton_ch02_part1_laura_trap", "title": "第二章 查尔斯爵士之死（上：被诱骗的棋子劳拉·里昂斯）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "anchor", "anchor_name": "anchor_laura_trap_stapleton", "content": "将查尔斯老爵士引诱入陷阱的最佳工具，就现成地摆在库姆马西集镇：劳拉·里昂斯夫人。\n\n这是一个虚荣心极强、而在现实中又被贫困彻底逼入绝境的脆弱女人。她被无赖丈夫抛弃，又被那个成天打官司的暴躁父亲弗兰克兰断绝了父女关系，整日生活在债台高筑的屈辱之中。我以极具欺骗性的绅士温情精心编织了一张罗网。我扮演着慷慨高贵的庇护者，倾听她的抽泣，并在不经意间用一纸虚幻的婚姻诺言彻底俘获了她的心智。\n\n‘倘若你能摆脱那个无赖里昂斯的法律枷锁，’我轻抚着她的秀发低语道，‘只要有一笔钱能支付伦敦昂贵的离婚诉讼费，我和贝丽尔便会张开双臂，迎接你成为梅利琵宅邸真正的主人！’\n\n结清债务并聘请顶级大律师需要整整两千英镑。在这片荒原上，究竟何人拥有这等巨富且生性乐善好施？唯有查尔斯·巴斯克维尔爵士！\n\n五月四日清晨，我踏入了劳拉的打字行。她正因债权人发出的破产传票而精神濒临崩溃。\n\n‘查尔斯爵士明天清晨就要动身前往伦敦，’我神色严峻地催促道，‘他年迈体衰，心脏随时可能衰竭。倘若你寄去一份公事公办的求援信，他只会将你推给冷酷的律师团！你必须当面见他！你必须当面哭诉以唤醒他骨子里的骑士精神！’\n\n我坐在她身旁，一字一句口述出了那行致命的绝命信：\n\n‘求求您，求求您，倘若您当真是一位绅士，读罢请将此信烧毁，并于今晚十点整在侧门相候！’\n\n她在极度惶恐中颤抖着签下了名字，将信函火速投递往巴斯克维尔庄园。\n\n下午五点，我再次跨入她的寓所，脸上换上了一副严厉而自尊受辱的悲愤表情。\n\n‘劳拉，’我一把抓住她的双手，‘我绝不容许这种事发生！作为一个男人的尊严，我绝不能容忍我未来的妻子去向另一个男人摇尾乞怜！我已经从我自己的海外投资中变现了这两千英镑！今晚，你绝对不许踏足巴斯克维尔庄园半步！’\n\n她感动得扑入我的怀中放声大哭，将我视作救世主。这个天真的蠢女人！她做梦也想不到，她亲手签下的不仅是老爵士的死刑判决书，更是彻底斩断了她自己今后所有公开抗辩的退路！", "is_ending": false, "clues": ["斯台普吞以虚假结婚诺言为饵，诱骗走投无路的劳拉·里昂斯向查尔斯爵士索要两千镑赎身费", "亲自口述并逼迫劳拉写下绝命密约信，要求老爵士在深夜十点务必孤身在侧门相会"], "choices": [{"id": "s_ch2_p1_c1", "text": "当面严令劳拉·里昂斯今晚绝不许赴约，自己则暗中牵出涂满磷光的恶犬奔赴红豆杉侧门。", "target": "stapleton_ch02_part2_yew_alley", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch2_p1_c2", "text": "在夕阳沉入地平线之际完成恶犬的磷光涂抹，将杀戮倒计时推向最后一刻。", "target": "stapleton_ch02_part2_yew_alley", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_ch02_part2_yew_alley": {"id": "stapleton_ch02_part2_yew_alley", "title": "第二章 查尔斯爵士之死（下：小树道侧门的致命恐惧）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "五月四日深夜，暴雨将至，夜色浓黑如墨。九点整，我用一条粗麻绳牵着恶犬悄然溜出了梅利琵宅邸。在厚重的羊毛毯包裹掩盖之下，这头巨兽的口吻与双眼依然隐隐透出令人窒息的磷光幽火。\n\n差一刻十点，我们抵达了巴斯克维尔庄园的边界。在红豆杉树篱外的荒原沼泽地上，湿漉漉的泥炭寂静得犹如一座乱葬岗。我伏身在一丛带刺的金雀花灌木后，距离那扇通向荒原的木栅侧门刚好二十码远。\n\n透过红豆杉树篱的缝隙，一截暗红色的雪茄烟头亮光清晰可见。\n\n查尔斯老爵士如约而至！他推开侧门，神色焦躁地向荒原黑夜中眺望，在狭窄的草坪上不安地来回踱步，隔几分钟便掏出怀表借着烟火查看时间。\n\n谷地对面的村庄教堂沉闷地敲响了十点的钟声。\n\n老爵士显得越发焦躁不安。他弹落了第一撮雪茄烟灰，擦亮第二根火柴点燃了新的烟卷，在刺骨的寒风中又苦苦等了十分钟。\n\n死神降临的时刻到了。\n\n我一把猛地扯掉了蒙在恶犬头上的厚毛毯！我死死攥住它颈项上的沉重黄铜项圈，贴在它喷吐热气的耳朵旁吐出恶魔般的命令，将那颗燃烧着幽蓝烈焰的巨头猛地指向侧门的方向！\n\n‘去！咬死他！’我咬牙厉喝。\n\n那恶兽发出一声惊天动地的闷吼，狂暴地凌空飞跃而出！\n\n透过树篱，查尔斯爵士听到了巨爪踏碎枯枝的雷霆奔袭声，猛然回首。然而映入这位长期深陷家族诅咒梦魇的老人眼帘的，是一具彻底撕碎其理智的活体梦魇：一头体型如牛、两眼喷吐着地狱绿火的巨大黑魔，正张牙舞爪自虚空中狂暴扑杀而来！\n\n老爵士发出一声被扼死在喉咙里的凄厉绝叫！他甚至根本来不及关上侧门，猛然转身沿着红豆杉小径用脚尖亡命狂奔，双手绝望地死死撕扯着胸口的衣襟！仅仅狂奔了五十码远，他那颗脆弱的心脏便彻底破裂碎裂，整个人面孔朝下，轰然仆倒在草坪之中！\n\n我立刻吹响了高频无声犬笛（Galton whistle）。受过严苛训练的恶犬在距离尸体二十码远的地方硬生生刹住了脚步，欢快地折返奔回我的身旁。我将厚毛毯重新罩上它的头颅，拍了拍它的背脊，牵着它如幽灵般悄然隐没在大格林盆泥潭那片深不可测的黑色庇护所中。\n\n死者身上没有留下任何物理创口。一桩完美绝伦、毫无破绽的绝世谋杀！第一块绊脚石已然彻底扫清！", "is_ending": false, "clues": ["查尔斯爵士在侧门足足抽烟等待了二十分钟，期盼着劳拉·里昂斯前来赴约", "当喷吐烈焰的地狱恶兽在夜色中破草扑出时，老爵士在极致的恐怖中心脏彻底爆裂", "斯台普吞吹响无声犬笛引回猎犬遁入泥潭，在现场二十码外的湿泥上留下了不可磨灭的鬼印"], "choices": [{"id": "s_ch2_p2_c1", "text": "筹划远赴伦敦的秘密暗杀行动，抢在年轻的加拿大继承人踏足荒原前将其就地格杀。", "target": "stapleton_ch03_new_heir", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch2_p2_c2", "text": "【视角切换：歇洛克·福尔摩斯】切换至贝克街，看名侦探如何从摩梯末口中审讯现场足印。", "target": "holmes_ch01_part2_consultation", "pov_switch": "holmes", "pov_switch_name": "歇洛克·福尔摩斯"}]}, "stapleton_ch03_new_heir": {"id": "stapleton_ch03_new_heir", "title": "第三章 疑案（来自加拿大的威胁与伦敦暗杀计划）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "验尸法庭给出的官方裁决完美得超出了我最狂妄的祈求：急性心力衰竭，自然猝死。这帮脑满肠肥的乡村陪审员除了红豆杉树篱外什么也看不见；即便是摩梯末那个整日沉溺在颅骨测量中的书呆子，也出于对乡民恐慌的顾虑对现场足印三缄其口。\n\n我原本以为那座七十四万镑的金山已然落入囊中。然而短短两周之后，德文郡的各大地方报纸却刊登出了一条令我五内俱焚的噩耗：查尔斯爵士在世上竟然还有一个亲侄儿——亨利·巴斯克维尔！二伯父的亲生骨肉！这位年轻男爵早年远涉重洋前往加拿大苏必利尔湖畔开荒务农，如今伦敦的高瑟父子律师行已通过跨洋电报紧急将其召回本土，全权继承头衔与整座庞大的家族信托！\n\n我心中的狂怒险些撕裂胸膛！难道我冒着同赴绞刑架的万丈深渊夺得的泼天富贵，竟要眼睁睁拱手让给一个粗鄙无知的殖民地庄稼汉？！\n\n绝不可能！\n\n必须立刻发动第二轮致命打击！然而若在达特穆尔荒原上接连暴毙两位庄园继承人，即便是最愚钝的郡警也必将嗅出人为谋杀的气息。最理想的猎杀擂台，唯有庞大臃肿的伦敦市区——一座吞吐着四百万孤魂野鬼的迷雾之都，在这里，一场车祸、一次溺水或是一场醉酒斗殴，不出一天便会被忘得干干净净！\n\n我给囚禁在孤岛上的恶兽备足了整整三十磅马肉与洁水。我收拾好两只牛皮提箱，备齐了一副墨镜与一把精巧的人造黏贴黑胡须，强行将贝丽尔掳上火车，在圣约翰伍德（St. John's Wood）以凡德勒之名租下了一间幽暗的寄宿公寓。\n\n贝丽尔跪倒在地板上撕心裂肺地痛哭流涕，苦苦哀求我放弃这笔沾满鲜血的罪恶遗产，求我带她远走高飞逃回中美洲。\n\n‘你敢碰一下那扇门，’我恶狠狠地拧紧她娇嫩纤细的手腕，疼得她倒抽冷气发出尖叫，‘或是胆敢向任何活人吐露半个字，我向地狱起誓，你的那位加拿大堂弟必将死得比他伯父惨烈十倍！’\n\n十月十二日，亨利爵士搭乘的邮轮在南安普顿靠港。短短两小时后，我便在滑铁卢车站咬住了他和摩梯末医生的行踪，一路贴身尾随至河岸街的诺森伯兰旅馆。猎杀的舞台，已然正式迁入了帝国的心脏！", "is_ending": false, "clues": ["获悉远在加拿大的年轻农夫亨利·巴斯克维尔正作为唯一法定继承人受召返英", "斯台普吞决意化名潜入伦敦，务必在亨利爵士抵达达特穆尔前将其彻底清除", "强逼妻子贝丽尔同行，日夜严密监控，严防其走漏半点风声"], "choices": [{"id": "s_ch3_c1", "text": "尾随亨利爵士入驻诺森伯兰旅馆，以重金买通大堂侍者搜集暗杀情报。", "target": "stapleton_ch04_part1_hotel_shadow", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch3_c2", "text": "【视角切换：约翰·H·华生】切换至贝克街，见证华生与福尔摩斯在浓密烟雾中推敲疑案。", "target": "ch03_problem", "pov_switch": "watson", "pov_switch_name": "约翰·H·华生医生"}]}, "stapleton_ch04_part1_hotel_shadow": {"id": "stapleton_ch04_part1_hotel_shadow", "title": "第四章 亨利·巴斯克维尔爵士（上：诺森伯兰旅馆的眼线与剪报）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "anchor", "anchor_name": "anchor_london_shadow_stapleton", "content": "十月十二日傍晚，当我返回圣约翰伍德的幽暗寓所时，赫然发现贝丽尔正蜷缩在桌角抽泣。地板上散落着一份被裁得千疮百孔的昨日《泰晤士报》，以及一把小巧弯曲的女士修甲剪刀。\n\n社论通栏上那排犬牙差互的空白瞬间刺痛了我的双眼。我一把揪住她的长发，硬生生将她的头颈向后扯起，令她那双充满泪水的黑眼睛死死迎向我充血的双眸。\n\n‘你干了什么？！’我牙缝中挤出毒蛇般的低吼。\n\n她吓得浑身瘫软，痛哭失声：‘我警告了他！我把那些剪下来的字贴在纸上，投进了查令十字街的邮筒！杰克，我不能眼睁睁看着你再杀害一个无辜的年轻人！我们的灵魂承受不起更多的血债了！’\n\n一声狂暴的咒骂从我口中喷涌而出！我狠狠一记耳光将她抽翻在沙发上。这个成事不足败事有余的贱人，险些将我毕生的心血彻底毁于一旦！信件已然落入邮政管道，绝无追回可能！倘若那个胆小的加拿大男爵被这封匿名信吓破了胆，连夜卷铺盖逃回美洲，那七十四万英镑的金山便将永远离我而去！\n\n必须抢在一切不可挽回之前以雷霆万钧之势就地格杀！\n\n清晨时分，我换上一袭黑色常礼服，戴上深色墨镜潜入了诺森伯兰旅馆。我将半枚金镑悄悄塞进了正在二楼长廊打扫卫生的女仆围裙口袋里。\n\n‘好姑娘，’我换上一副优雅温和的管家笑容，‘34号房间的那位加拿大贵客吩咐我，替他将一只破损的皮靴送往河岸街的鞋匠铺修补。把门外那双靴子交给我一只，这枚金币就是你的了。’\n\n女仆贪婪地摩挲着金币，眉开眼笑，飞快地溜到34号门前。短短三十秒后，她便将一只沉甸甸的皮靴塞到了我的手中。\n\n我迅速将靴子塞入皮包，顺着后门安全通道疾步溜出旅馆，踏入了清晨喧嚣的伦敦街头。然而，当我拐入一条僻静的暗巷、满怀狂喜地将皮靴掏出皮包的一瞬间，我忍不住在晨风中爆发出一声暴怒至极的咆哮！\n\n那竟然是一只崭新锃亮的黄褐色新皮靴！鞋面的牛皮坚硬挺括，鞋底一尘不染——一双从未上过脚的全新靴子！\n\n一双没穿过的鞋子根本没有任何体味！我的恶犬绝不可能凭借毫无气味的鞣制皮革去追踪活人——它必须吸饱活人毛孔深处分泌出的酸性汗液与热血气味！\n\n被这个愚蠢的女仆气得七窍生烟的我，只得咬碎钢牙收起行头。我必须亲自贴身咬住亨利爵士的一举一动，在今天之内务必顺走他穿过的旧靴！", "is_ending": false, "clues": ["贝丽尔背叛丈夫，用修甲剪刀从昨日《泰晤士报》社论裁剪词句拼贴匿名警告信", "斯台普吞当场截获通敌行径并将贝丽尔毒打威慑，然而警告信却已被其暗中投入邮筒", "斯台普吞重金贿赂旅馆女侍盗取亨利爵士置于门外的皮靴，企图为恶犬锁定致命气味"], "choices": [{"id": "s_ch4_p1_c1", "text": "惊见女仆竟偷来一只毫无气味的新黄皮靴；戴上假黑胡子雇佣马车在摄政街紧咬爵士不放。", "target": "stapleton_ch04_part2_cab_chase", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch4_p1_c2", "text": "【视角切换：歇洛克·福尔摩斯】切换至贝克街，看名侦探用显微镜拆解素馨花香气与五号铅字。", "target": "holmes_ch04_part1_warning", "pov_switch": "holmes", "pov_switch_name": "歇洛克·福尔摩斯"}]}, "stapleton_ch04_part2_cab_chase": {"id": "stapleton_ch04_part2_cab_chase", "title": "第四章 亨利·巴斯克维尔爵士（下：摄政街的对决与马车2704）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "我将一圈浓密黑亮的黏贴假连鬓胡须死死粘在下颚，把一顶深色阔边软呢帽压低到眉际，在河岸街转角处守株待兔。\n\n十点整，亨利爵士与摩梯末并肩走出旅馆大堂，快步朝牛津街方向走去。我顺手拦下了一辆由一个名叫克莱顿的魁梧汉子拉乘的双轮轻便马车。\n\n‘远远咬住前面那两位先生，保持两百码距离，’我将半枚金镑掷进他怀里，‘走马路对面，别靠得太近！’\n\n在整整二十分钟的时间里，追踪进行得如丝般顺滑。我们在摄政街的车流中缓缓并排前行。我仔细研读着亨利爵士激动的肢体语言；摩梯末显然正在陪同他前往某处接受极高规格的私人专业咨询。然而究竟是去见谁？\n\n突然之间，一股寒彻骨髓的绝命恐惧瞬间扼死了我的心脏！\n\n就在亨利爵士身后不远处的人行道上，一个身形挺拔、生着一张在全欧洲无人不晓的鹰喙般锐利侧颜的高大绅士，正目光如炬地步步紧逼！身旁还紧跟着一位步履沉稳的军医装束同伴——约翰·H·华生！\n\n歇洛克·福尔摩斯！摩梯末竟然把这个名震英伦的活阎王给请出了山！\n\n就在我认出他的电光石火之间，福尔摩斯猛然转过了头颅！他那双鹰隼般的灰色寒眸如同两柄出鞘的利刃，竟穿透车窗玻璃直直刺入了我的瞳孔！他识破了我的暗中盯梢！\n\n‘快！’我发疯般用手杖顶开马车车顶的传话天窗，死死戳在车夫的后背上厉声咆哮，‘拼死赶往滑铁卢车站！甩掉他们，我多赏你一整枚金镑！’\n\n车夫的长鞭在空中抽出凄厉的裂响，骏马狂性大发，拉着马车在摄政街密密麻麻的双层公共马车与货车车流中亡命穿梭飞驰！把狂奔追赶的福尔摩斯彻底甩在了烟尘之后！我们风驰电掣般杀过滑铁卢广场，轰鸣着冲过泰晤士河大桥，猛地急刹在喧嚣混乱的滑铁卢车站进站口！\n\n我跳下车厢，掏出两枚金光闪闪的金镑重重拍进车夫的手心里。\n\n‘干得漂亮，车夫，’我嘴角咧开一抹狂妄至极的恶毒狞笑，‘待会儿要是有个瘦高个绅士向你打听刚才坐车的是哪位大人物，你便如实回他：“老子的名字叫歇洛克·福尔摩斯，可千万给老子记牢了！”’\n\n我一个闪身潜入了滑铁卢车站浩瀚杂乱的人流迷宫之中，顺着南侧货运出口神不知鬼不觉地溜之大吉，只留给全英国最顶尖的神探一片抓不住的虚妄青烟！然而这场对决在这一秒已然彻底变成了不死不休的你死我活——我已然正式拔剑，与歇洛克·福尔摩斯狭路相逢！", "is_ending": false, "clues": ["斯台普吞贴上假黑胡子、戴上墨镜雇佣2704号双轮马车在摄政街尾随爵士", "在与歇洛克·福尔摩斯目光凌空撞击的瞬间果断策马飞驰逃逸，并傲慢挑衅地假借名侦探之名脱身"], "choices": [{"id": "s_ch4_p2_c1", "text": "潜回旅馆趁乱调换盗取亨利爵士踩满泥巴的旧黑皮靴，带上致命气味火速潜回达特穆尔。", "target": "stapleton_ch05_black_boot", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch4_p2_c2", "text": "【视角切换：歇洛克·福尔摩斯】切换至贝克街，见证名侦探在马车夫口中得知自己姓名被盗用的震怒。", "target": "holmes_ch05_threads", "pov_switch": "holmes", "pov_switch_name": "歇洛克·福尔摩斯"}]}, "stapleton_ch05_black_boot": {"id": "stapleton_ch05_black_boot", "title": "第五章 三条断了的线索（盗取旧黑靴与遁回达特穆尔）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "anchor", "anchor_name": "anchor_arrival_stapleton", "content": "摄政街上与福尔摩斯那电光石火的生死遭遇，虽令我的骨髓深处泛起阵阵彻骨寒意，却丝毫未能撼动我钢铁般的杀心。换作任何凡夫俗子，此刻早已吓得抱头鼠窜逃离伦敦；而我却反其道而行之，杀了一记漂亮的回马枪，径直折返了诺森伯兰旅馆！\n\n趁着午后大堂人员换岗、而亨利爵士与摩梯末正赶赴贝克街向福尔摩斯闭门求教的绝佳空当，我再次潜入了二楼长廊。我将那只毫无气味的崭新黄皮靴随手塞回了二楼起居室的藤椅底下以掩人耳目。而在34号房门外的地垫上，命运之神向我露出了最狰狞的微笑！\n\n那里整整齐齐摆放着一双饱经风霜的旧黑皮靴，鞋跟磨损倾斜，鞋头与鞋帮上厚厚结着一层加拿大荒野跋涉遗留下来的深红泥垢！\n\n我闪电般抄起其中一只旧黑靴塞入大衣内衬，神色从容如常地从容迈出旅馆正门，施施然消失在河岸街熙攘的人潮之中！\n\n我拿到了！最致命的核心气味样本！那双旧靴深处吸附着的人体汗液、毛孔油脂与牛皮混合而成的鲜明体味，足以令我那头饥肠辘辘的恶兽在风声鹤唳的方圆二十英里荒原上死死锁定目标！\n\n当天傍晚，我在贝克街暗中布下的眼线更是送来了一道价值千金的绝密喜讯：亨利爵士与华生医生在火车站预定了次日清晨奔赴德文郡的干线车票，然而歇洛克·福尔摩斯先生却留守伦敦，分身乏术！这位名震天下的大神探，竟然自以为是地将他的温顺羔羊独自送入了屠宰场！\n\n在阴暗的站台角落里，我忍不住发出了快意至极的低声狂笑。若正面与福尔摩斯那等妖孽较量，鹿死谁手尚未可知；然而若对手仅仅是约翰·H·华生那个头脑简单、四肢发达的钝拙退伍军医，这场狩猎简直宛如杀鸡宰鹅般轻而易举！\n\n我返回圣约翰伍德，粗暴地扯起面如死灰的贝丽尔，搭乘午夜的邮政快车秘密西行。十月十四日拂晓时分，我们已然重返达特穆尔荒原深处的梅利琵宅邸。\n\n我片刻未歇，踏着暗径直奔泥潭核心孤岛。我将那只沾满干泥的旧黑靴死死贴在那头嗜血巨兽喷吐粗气的鼻孔前。恶兽贪婪地深吸着这股浓烈的人肉体味，两只凶残的黄瞳骤然收紧，喉咙里爆发出一阵滴淌口水、狂暴难耐的嗜血呜咽！\n\n陷阱已然全面合围。亨利·巴斯克维尔，正一步步踏入我为你量身定做的地狱血盆大口！", "is_ending": false, "clues": ["斯台普吞悄然潜回旅馆物归原主退回新黄靴，成功盗取亨利爵士穿过、沾满烂泥的旧黑皮靴", "暗探获悉歇洛克·福尔摩斯借故公务缠身留守伦敦，仅派军医华生随行护送男爵", "怀揣浸透目标体味的绝密旧靴狂喜返回梅利琵宅邸，着手以血腥气味饲喂训练恶兽"], "choices": [{"id": "s_ch5_c1", "text": "登上梅利琵宅邸高坡山脊隐蔽处，架起单筒望远镜等候亨利爵士与华生自伦敦入瓮。", "target": "stapleton_ch06_part1_arrival_watch", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch5_c2", "text": "【视角切换：约翰·H·华生】切换至西行快车车厢，体验华生护送男爵奔赴古老庄园的凝重思绪。", "target": "ch06_part1_arrival", "pov_switch": "watson", "pov_switch_name": "约翰·H·华生医生"}]}, "stapleton_ch06_part1_arrival_watch": {"id": "stapleton_ch06_part1_arrival_watch", "title": "第六章 巴斯克维尔庄园（上：猎物入瓮与荷枪护送）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "anchor", "anchor_name": "anchor_arrival_moor_stapleton", "content": "十月十五日的午后，我伫立在贝利弗岩岗（Belliver Tor）最高处的花岗岩脊线上，单筒黄铜望远镜死死锁定了波维大道的尽头。深秋的天空阴霾低沉，一股裹挟着湿气的冰冷朔风正掠过大西洋浩瀚的荒原。\n\n在大道转角处，一扬漫天而起的黄色尘土宣告了双排敞篷马车的疾驰逼近。\n\n借由镜片，来客的面容清晰可辨。那位年轻的亨利爵士正满怀好奇与新奇地眺望着他祖辈留下的苍凉荒原，身上裹着一件加皮毛领的厚实大氅；坐在他身侧的便是华生医生，方下巴，身板笔挺，右手警惕地按在大衣口袋沉甸甸的凸起处——那里显然紧贴着他那把大口径军用左轮手枪；而在马车两侧，两名郡警正横挎卡宾枪如临大敌般护卫随行。\n\n滑稽可笑的武装护卫！这帮蠢货竟然天真地以为，凡间的铅弹当真能够挡得住一头诞生于九幽地狱火海与古老魔咒之中的复仇恶兽？！\n\n而这批武装骑警的全副戒备，源于另一桩令整片教区人心惶惶的突发事变：三天前，残杀多名无辜者的诺丁山屠夫逃犯塞尔登凿壁越狱，此刻正潜藏在花岗岩乱石迷宫中茹毛饮血！这真是一个绝妙而极具利用价值的意外收获！倘若世人皆知荒原上游荡着一个穷凶极恶的持刀越狱犯，那么在这片土地上发生的任何暴行、任何夜半凄厉的惨叫，乃至任何横尸悬崖的碎尸惨案，都将在第一时间被愚蠢的世人顺理成章地扣在逃犯头上！\n\n我目送着马车辚辚驶入巴斯克维尔庄园那两座古老的石柱大门，两扇沉重锈蚀的铁门在他们身后重重闭合。\n\n羊羔终于正式赶入了屠宰圈！如今亨利爵士已被方圆二十英里的荒蛮荒原与现代文明彻底切断，在他脆弱的脖颈前，仅仅横隔着一个头脑简单、极易受骗的糊涂军医！\n\n一股野兽撕咬猎物前的狂暴快感瞬间传遍了我的四肢百骸。查尔斯那七十四万镑的黄金巨矿，已然在我眼前绽放出触手可及的夺目光彩！我收起望远镜，快步走下山脊折返梅利琵宅邸，务必在狩猎拉开序幕之前，将我的家宅牢笼彻底封死！", "is_ending": false, "clues": ["亨利爵士与华生医生在持枪骑警全副戒备的武装护卫下踏入巴斯克维尔庄园大门", "惊悉诺丁山残暴屠夫逃犯塞尔登越狱潜伏荒原，将其锁定为随时可资利用的嗜血乱局棋子"], "choices": [{"id": "s_ch6_p1_c1", "text": "折返梅利琵宅邸，以最残忍的暴力手段将企图反抗的贝丽尔彻底威慑囚禁在掌中。", "target": "stapleton_ch06_part2_beryl_chains", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch6_p1_c2", "text": "【视角切换：歇洛克·福尔摩斯】切换至黑色岩岗史前石屋，看名侦探如何用军用远望镜俯瞰马车抵庄。", "target": "holmes_ch06_part2_hut_surveillance", "pov_switch": "holmes", "pov_switch_name": "歇洛克·福尔摩斯"}]}, "stapleton_ch06_part2_beryl_chains": {"id": "stapleton_ch06_part2_beryl_chains", "title": "第六章 巴斯克维尔庄园（下：梅利琵宅邸的暴虐枷锁）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "我穿过满是煤灰的后厨侧门跨入了梅利琵宅邸。整栋宅院阴冷刺骨，弥漫着我用来毒杀昆虫标本的氰化钾药瓶散发出的微苦杏仁味与刺鼻酸气。\n\n在昏暗狭窄的起居室里，贝丽尔正伫立在窗棂前，双眼失魂落魄地凝视着远方巴斯克维尔庄园那两座森严高耸的雉堞塔楼。当听到我那熟悉的皮鞋踩踏木地板的脚步声时，她整个人如中箭的雌鹿般猛地一颤，脸上的血色瞬间退至毫无生气的惨白。\n\n‘他到了，’我随手掩上房门，神色平静地将门锁徐徐反拧到底。\n\n她背脊死死抵住冰冷的墙壁，两只黑亮深邃的眼眸因极度的恐惧而剧烈放大。‘杰克……我求求你！看在上帝的面子上，放过那个年轻人吧！他从未做过任何对不起你的事！带上我们所有的积蓄，求你带我远走高飞吧！’\n\n我两步跨越房间，右手如铁钳般瞬间卡死了她那纤细雪白的咽喉，将她整个人狠狠按死在扶手椅中，直到她的喉管发出急促痛苦的窒息抽噎！\n\n‘给我听清楚了，我美艳绝伦的小伪君子，’我俯下身躯，温热的呼吸吐在她发颤的耳垂上，‘在伦敦，你用那张破报纸险些砸了我毕生的心血。我没有杀你，仅仅是因为这具绝美的皮囊日后还有大用！然而在这片荒蛮嗜血的达特穆尔荒原上，博弈的筹码是滚烫的活人热血，而不是小女人的剪纸游戏！倘若你敢向亨利爵士吐露半个字——倘若你敢向任何人走漏半句你是我的合法妻子而非胞妹的真相——我不仅会当场要了他的命，更会将你亲手拖进大格林盆泥潭的废弃工棚，用铁链死死锁在墙角的石环上，将你一个人扔在漆黑的绝境中，与那头饥肠辘辘的恶兽同处一室！’\n\n一阵濒临神经崩溃的剧烈抽搐瞬间传遍了她娇柔的身躯。她无力地从扶手椅上滑跪在地板上，掩面放声痛哭，发出绝望无助的凄厉悲鸣。\n\n‘我闭嘴……我发誓我什么都不会说！’她屈辱地亲吻着我的皮鞋边沿抽泣道，‘求求上帝救救我，我一个字都不会说的！’\n\n‘最好如此，’我面无表情地跨过她瘫软的身躯，‘明天一早，那位自以为是的华生医生必定会巡查荒原。我将带上我的捕蝶网亲自出迎。一个博学热情、滔滔不绝的温良学者——天下还有什么比这更适合博取一位直肚肠退伍老兵的无条件信赖？！’\n\n我旋开门锁，径直踏入暗室调配我的化学毒药。天罗地网已然彻底织就；捕杀猎物的剧毒蜘蛛，已然磨砺好了致命的毒牙！", "is_ending": false, "clues": ["斯台普吞以恶犬撕碎咽喉为要挟，严令贝丽尔绝不许向新爵士吐露半字实情", "在孤立无援的荒原农舍中将美貌异国娇妻彻底囚禁，充当引诱富豪的致命玩偶"], "choices": [{"id": "s_ch6_p2_c1", "text": "手提捕蝶网漫步荒原泥潭小径，主动结识华生医生并当面测试其观察力与警惕心。", "target": "stapleton_ch07_part1_naturalist_act", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch6_p2_c2", "text": "踏着暗径潜入大格林盆泥潭孤岛，为今晚恶兽的血食配给制定精准时刻表。", "target": "stapleton_ch07_part1_naturalist_act", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_ch07_part1_naturalist_act": {"id": "stapleton_ch07_part1_naturalist_act", "title": "第七章 梅利琵宅邸的主人斯台普吞（上：温雅博物学者的伪装）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "anchor", "anchor_name": "anchor_naturalist_stapleton", "content": "十月十六日清晨，惨淡湿润的深秋日光洒满荒原。我手挽绿纱长柄捕蝶网，肩跨采集铁盒，悠闲地漫步在从梅利琵宅邸通往庄园的大道碎石路旁。\n\n果不其然，正如我所预料的那样，华生医生那敦实魁梧的身形很快出现在了山脊的转角处。他双手插在风衣口袋里，嘴里叼着石楠烟斗，正用一个外来异乡人特有的好奇与警惕审视着这片荒凉的荒原。\n\n我加快脚步迎上前去，脸上堆满了常年隐居乡野的学者在偶遇同道时特有的爽朗与狂热。\n\n‘想必阁下定是华生医生了！万望恕我冒昧未递名片，但在这片天高地阔的荒原之上，繁文缛节早已被我们抛之脑后。在下杰克·斯台普吞，梅利琵宅邸的主人。’\n\n这位善良憨厚的退伍军官瞬间被我的热情所打动。短短两分钟之内，我们已然如故交老友般并肩侃侃而谈。我信手指向远古石屋遗址向他考据新石器时代的不列颠土著，滔滔不绝地品评着泥炭藓类的珍稀属性，并适时流露出对可怜查尔斯爵士猝然长逝的无限哀思。\n\n突然之间，我们身后的大格林盆泥潭深处猛地炸响了一声凄厉绝望的惨嘶！一匹野生矮种小马因贪恋嫩草，一脚踩穿了伪装成草坪的致命泥壳，正在万丈黑浆中绝望扑腾灭顶！\n\n我一把死死抓住华生的手腕，捕蝶网的竹柄遥指泥沼：‘瞧啊，华生医生！这便是大格林盆泥潭！踏错半步，便是神仙难救的万劫不复！不出两分钟，那匹马便会彻底沉入地心！’\n\n华生目瞪口呆、浑身战栗地亲眼目睹着那头可怜的活物被翻滚恶臭的水泡彻底吞噬。这堂生动惨烈的现场解剖课已将深入骨髓的恐惧深深烙印在了他的脑海深处：达特穆尔是一座动辄吞人嚼骨的绝命死渊！\n\n紧接着，在漫不经心的谈笑之间，我漫不经心地抛出了那枚致命的试探之针：\n\n‘原本全教区的人都热切期盼着大名鼎鼎的歇洛克·福尔摩斯先生能亲临德文郡避暑视察，真是令人遗憾万分。不知传闻是否属实，那位大神探果真彻底留守伦敦未曾成行吗？’\n\n华生脸上流露出一丝军人特有的含蓄自豪：‘伦敦有一桩极其重大的公海勒索要案死死缠住了他的身躯。在目前这段时期内，亨利爵士的一切安全防务全权交由我一人全权照料。’\n\n全权交由你一人照料！我必须死死咬住舌尖，才勉强压抑住了那抹险些撕破我温雅伪装的狰狞狂笑！通往七十四万英镑黄金王座的康庄大道，已然坦荡如砥！", "is_ending": false, "clues": ["手持捕蝶网在荒原小径截获华生，以博学温和的学者谈吐博取对方信任", "当场向华生展示达特穆尔矮种野马失足陷顶惨死全过程，借泥潭神威震慑其胆魄", "旁敲侧击试探歇洛克·福尔摩斯的真实行踪，确凿核实神探确未随行亲临德文郡"], "choices": [{"id": "s_ch7_p1_c1", "text": "假意扑打珍稀环纹蝶脱身深入草丛，暗中窥视华生与从后方冲出的贝丽尔之接触。", "target": "stapleton_ch07_part2_beryl_blunder", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch7_p1_c2", "text": "【视角切换：约翰·H·华生】切换至华生视角，见证他如何对这位古怪学者产生最初好感。", "target": "ch07_part1_naturalist", "pov_switch": "watson", "pov_switch_name": "约翰·H·华生医生"}]}, "stapleton_ch07_part2_beryl_blunder": {"id": "stapleton_ch07_part2_beryl_blunder", "title": "第七章 梅利琵宅邸的主人斯台普吞（下：泥潭小径上的惊险破绽）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "我故作狂喜失态，指着石楠花丛中一只翻飞的褐色飞蛾，挥舞着捕蝶网狂奔深入沼泽，留下华生一人沿着小道信步漫游。\n\n我的抽身绝非偶然。我本意是借着巨石盲区暗中反向监视这位军医的独处神态。然而，当我翻上一处花岗岩山脊回首眺望的一刹那，眼前的景象险些将我浑身的血液彻底烧沸！\n\n贝丽尔！那个该死、愚不可及的反叛贱人竟然趁我不备偷偷溜出了宅邸，正气喘吁吁地在石楠丛中亡命飞奔！\n\n透过荆棘丛的空隙，我惊见她猛地扑上前死死抓住了华生的衣袖！她双手狂乱地比划着，眼中喷涌着撕心裂肺的绝望哀求！即便隔着整整两百码的距离，我也能轻易读懂她那疯狂的肢体语言：她在声嘶力竭地逼迫对方立刻滚回伦敦，逃离这片必死的诅咒荒原！她竟然把这个敦实的矮个子军医误当成了远道而来的加拿大堂弟！\n\n我的右手死死捏紧了手里的竹柄捕蝶网，指节泛出青白，竹竿甚至被我硬生生捏裂！只要她从牙缝里吐出半句关于恶犬的实情，或是泄露半点我们真实夫妻关系的秘密，不出七天，粗糙的绞索便将套死在我的脖颈之上！\n\n我猛地从巨石后飞身跃下，嘴里轻快地吹着一曲欢快的歌剧口哨，捕蝶网在空中漫不经心地摇晃，俨然一副刚刚大获全胜归来的无邪模样。\n\n‘哈喽，贝丽尔！’我爽朗地高声呼喊道，‘究竟是什么兴致把你这位娇小姐也引到了荒原上？’\n\n奇迹般的震慑效果在一刹那间显现无遗。她整个人宛如被数万伏特的高压电穿透了脊椎，浑身剧烈一僵，面孔在半秒钟之内被冻结成了一张毫无生气的惨白大理石面具——正是每当皮鞭举起时她所展现出的绝望麻木。\n\n‘我只是出来散散步，杰克，’她结结巴巴地强咽下一口唾沫，‘而我……我刚才误将这位先生认成了亨利爵士。’\n\n我仰天大笑起来，笑声温厚、慈爱而充满了长兄对幼妹那种宠溺的宽容包容。\n\n‘啊，我亲爱的华生医生，您可千万别见怪！我这妹妹生性胆怯脆弱，对这片荒原畏之如虎，查尔斯老爵士的不幸暴毙更是彻底摧毁了她的神经。走吧，华生，既然到了家门口，务必请随我们一同踏入梅利琵宅邸品上一杯热咖啡再返庄园！’\n\n华生完全被这温馨体面的家庭伪装彻底缴械，毫无半点戒心。然而当我们三人并肩穿过碎石车道时，我的指甲已然深深刺入了掌心的皮肉，鲜血顺着指缝悄然滴落。\n\n贝丽尔的桀骜不驯已然演变成了最致命的定时炸弹。等到最后动手猎杀的那个良夜降临之时，我绝不会仅仅满足于言语恐吓——我将用粗麻绳将她彻底五花大绑、用布条死死塞住嘴唇，让她连半个背叛的音节都休想吐露！", "is_ending": false, "clues": ["贝丽尔背地里狂奔出农舍拦路阻截，误将华生当作亨利爵士发出绝命撤退警告", "斯台普吞假意扑蝶折返撞破密谈，以高超冷酷的‘兄长’伪装掩饰滔天杀机", "清醒认识到妻子内心的反叛烈火仍在燃烧，决意在决战前夜施加更残酷的高压管制"], "choices": [{"id": "s_ch7_p2_c1", "text": "正式向华生与亨利爵士发出梅利琵宅邸午后茶会之约，将猎物引入社交死角。", "target": "stapleton_ch08_probing_watson", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch7_p2_c2", "text": "踏着暗径返回泥潭孤岛，复查恶兽项圈铁链的坚固度与绝密防御设施。", "target": "stapleton_ch08_probing_watson", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_ch08_probing_watson": {"id": "stapleton_ch08_probing_watson", "title": "第八章 华生医生的第一份报告（品茶试探与虚假的安心）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "接下来的几天堪称一场教科书级别的社交心理战杰作。\n\n我以邻家热心学者的体面身份正式登门造访巴斯克维尔庄园。在这座空旷阴冷、犹如古墓般死寂的花岗岩城堡里，百无聊赖、渴望交际的年轻亨利爵士如获至宝般抓住了我的友谊。短短四十八小时之内，他便已然成为了梅利琵宅邸茶席上的常客。\n\n正是在这里，我杀局的另一重毒计结出了令我狂喜沉醉的丰硕果实：亨利爵士无可救药、彻底盲目地疯狂迷恋上了贝丽尔！\n\n他的那对黑眼睛一刻也舍不得从她那张绝美动人的异国面庞上挪开。每当贝丽尔为他斟倒红茶时，他的手指甚至在抑制不住地微微发颤；每当她用那软糯带有异国腔调的嗓音开口时，这位年轻男爵的眸子里便喷涌出无限的崇拜与爱慕！\n\n这是一记价值连城的王牌，然而却需要最为精确的走钢丝操作。倘若我放任他们公开热恋，亨利爵士很可能当场求婚并将其强行带往伦敦完婚，从而在我的猎杀动手前戳破我们乃是合法夫妻的真相！\n\n于是，我当众上演了一出堪称心理学奇迹的癫狂大戏：一记蓄谋已久的病态吃醋狂怒！\n\n当亨利爵士试图在荒原小径旁背地里向贝丽尔吐露炽热衷肠时，我如疯狗般猛地从金雀花丛中杀出，面孔扭曲、浑身发颤。我当着华生的面厉声痛骂男爵居心叵测、竟敢企图玷污侮辱一个无依无靠的乡野纯洁孤女，并当场将他粗暴地轰出了我的领地！\n\n亨利爵士被骂得无地自容、羞愧万分，然而这记当头棒喝却将他骨子里的占有欲与征服欲瞬间点燃了上百倍！得不到的阻隔，反而让他发疯般下定决心务必娶到贝丽尔。他登门谢罪，苦苦哀求我的宽恕，并信誓旦言在未获得我这位‘大舅哥’的首肯之前绝不越雷池半步！\n\n与此同时，那位可爱的华生医生正整日窝在庄园壁炉旁奋笔疾书。透过村邮局的私下眼线，我确凿获悉，华生每周都会雷打不动地向伦敦贝克街寄出厚厚两大包详尽的日记战报。\n\n任由这个蠢材去写吧！让他去极尽能事地描摹荒原的落叶、凄凉的乌云、红眼睛的管家以及我那些看似人畜无害的珍稀昆虫标本！当华生在写着他的骑士小说、而歇洛克·福尔摩斯正安坐于伦敦壁炉旁无聊吐着烟圈之际，死亡的钟摆正在一分一秒地逼近最后的末日审判！", "is_ending": false, "clues": ["亨利爵士亲临梅利琵宅邸登门拜访，在茶会上一眼不可自拔地迷恋上了贝丽尔", "斯台普吞假意暴跳如雷上演‘护妹心切’的病态吃醋狂怒，严防二人私相授受", "确信华生正日夜不停向伦敦贝克街寄出毫无威胁的书信战报，对全局毫无警觉"], "choices": [{"id": "s_ch8_c1", "text": "趁着午夜万籁俱寂，手提生鲜血食潜入大格林盆泥潭深处，犒劳饥渴暴虐的恶兽。", "target": "stapleton_ch09_part1_feeding_the_hound", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch8_c2", "text": "【视角切换：歇洛克·福尔摩斯】切换至黑色岩岗石屋，看名侦探就着烛光逐字剖析华生密报。", "target": "holmes_ch08_watson_report", "pov_switch": "holmes", "pov_switch_name": "歇洛克·福尔摩斯"}]}, "stapleton_ch09_part1_feeding_the_hound": {"id": "stapleton_ch09_part1_feeding_the_hound", "title": "第九章 沼地上的烛光（上：夜入泥潭饲喂恶兽）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "anchor", "anchor_name": "anchor_convict_stapleton", "content": "十月二十日凌晨一点整，当整座宅邸万籁俱哀、贝丽尔已被我反锁在二楼卧室之后，我悄然踏入了茫茫夜雾之中。\n\n在沉重的帆布粗麻袋里，装着我从阿什伯顿附近偏远农庄秘密采买来的十磅血淋淋的羊杂与碎肉。在深更半夜只身横穿大格林盆泥潭，是对人类神经极限的最残酷考验。两侧的无底黑浆咕嘟翻滚着致命的毒气与气泡；只要脚下踏错四英寸，便会瞬间被拖入永无天日的地下万丈深渊！然而我的双脚对于每一块沉水暗石与草墩的熟悉程度，宛如一只剧毒蜘蛛熟知自己的蛛网。\n\n我踏上了孤岛。就在我的鞋尖刚刚触及废弃锡矿工棚门槛的一瞬间，一阵从地底深处泛起的低沉共鸣震得整面木板墙壁嗡嗡作响！\n\n恶犬嗅到了我熟悉的气味。\n\n我摘下马灯挂在中央的横梁上。在昏黄摇曳的光柱中，那头庞然巨兽宛如一具从幽冥血海中爬出的活体恶魔。它的肋骨根根毕现，两只黄瞳中喷涌着饥肠辘辘的狂暴凶焰。我将大块带血的鲜肉重重掷在地板上。它发出一声狂暴的低吼，两排如匕首般锋利的利齿伴随着刺耳的骨骼脆响疯狂咀嚼撕扯，那咀嚼血肉的动静足以令任何硬汉的心脏彻底冰封。\n\n在它狼吞虎咽之际，我用浸湿的抹布擦拭着它口角结痂的干涸血迹，梳理着它背脊上纠结成团的硬硬黑毛。\n\n当最后一块碎骨被嚼碎咽下肚时，这头巨兽猛地扬起庞大沉重的头颅，从肺腑最深处爆发出一声凄厉、悠长、在天地间悲怆回荡的恐怖长嗥！那嚎叫如狂暴的海潮般忽高忽低，穿透坍塌的石板屋顶，在整片皎洁月色笼罩下的浩瀚荒原上空滚滚奔涌！\n\n我没有制止它的狂吠。\n\n让这片土地在它恶魔的咆哮声中战栗吧！让亨利爵士在庄园冰冷的被褥深处瑟瑟发抖吧！让这两百年的血腥神话更深地扎入乡野愚民迷信的骨髓之中！每一声震碎夜空的恶犬狂嗥，都在为日后验尸官与陪审团心甘情愿地将男爵之死归咎于天谴恶咒而打下最完美的心理铺垫！", "is_ending": false, "clues": ["斯台普吞在凌晨一点踏着暗径潜入孤岛，以鲜血淋漓的碎肉喂养饥肠辘辘的恶魔巨兽", "任由恶兽饱食后压抑沉闷的嗜血长嚎在荒原黑夜中滚滚回荡，在全教区播撒深入骨髓的恐怖"], "choices": [{"id": "s_ch9_p1_c1", "text": "听闻花岗岩绝壁方向骤然爆发出清脆枪响，隐蔽在巨石后窥视华生夜巡围捕逃犯。", "target": "stapleton_ch09_part2_night_alarm", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch9_p1_c2", "text": "【视角切换：约翰·H·华生】切换至荒原乱石堆，体验华生与爵士端枪疾驰围捕狂暴越狱犯。", "target": "ch09_part2_moor_chase", "pov_switch": "watson", "pov_switch_name": "约翰·H·华生医生"}]}, "stapleton_ch09_part2_night_alarm": {"id": "stapleton_ch09_part2_night_alarm", "title": "第九章 沼地上的烛光（下：追捕逃犯与荒原暗机）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "我锁好工棚木门，踩着暗石折返陆地。然而就在我的双足刚刚踏上北侧山脊结实的石楠苔原时，一声清脆震耳的手枪枪响骤然撕碎了冰冷的寒夜！\n\n紧接着是第二声枪响，在空旷的花岗岩峰峦间激荡起久久不绝的脆烈回音！\n\n我瞬间伏倒在一处泥炭沟的浓黑阴影中，左手啪的一声解开了大衣下左轮手枪的枪套扣带。难道是这帮该死的郡警摸到了我隐匿恶犬的巢穴？！\n\n然而，借由皎洁明亮的银白月色，我很快看清了骚乱的真相：在相距两英里外的高原乱石滩上，一个身穿黄色条纹囚服、蓬头垢面的狂暴身影正如被追捕的野鹿般在巨石间疯狂跳跃飞奔。而在他身后拔枪穷追不舍、在黑夜中连发数枪的，赫然正是亨利爵士与华生医生！\n\n他们在围捕越狱犯塞尔登！这帮自作聪明的蠢材，竟然把珍贵的火药浪费在一个快要冻死的丧家犬身上！\n\n我正暗自冷笑鄙夷，然而当我的视线顺着黑色岩岗那陡峭高耸的脊线、投向圆月悬挂的夜空背景时，我的心脏猛地爆发出了一记剧烈沉重的狂跳！\n\n在黑色岩岗最险峻孤绝的巨岩之巅，在万丈月光那惨白的照耀之下，赫然傲立着一个如同玄武岩铁铸般的瘦高黑影！\n\n那是一个身材异常瘦削挺拔的神秘人，双臂冷冷环抱于胸前，头颈微微前倾，以一种近乎全知全能的深邃与警惕，居高临下死死俯瞰着谷底亨利爵士的一举一动！\n\n他是谁？！\n\n那绝非笨拙愚钝的乡野巡警，更不可能是本地的羊倌。在这片蛮荒贫瘠的土地上，绝无任何凡夫俗子能够展现出如此冷峻孤高、傲视一切的统帅威仪！难道是逃犯暗中联络的同伙？抑或是……某个比逃犯凶险千百倍的索命克星？！\n\n伦敦摄政街上那惊心动魄的对视如烙铁般再次烫痛了我的记忆——2704号马车车窗外，那对穿透玻璃的鹰隼般灰色寒眸！\n\n难道歇洛克·福尔摩斯在贝克街演了一场弥天大谎？！难道全欧洲最顶尖的神探早已隐姓埋名潜入了德文郡，如同一头野兽般在达特穆尔荒原上秘密筑巢扎寨？！\n\n一阵刺骨的寒意顺着我的颈椎疯狂向下攀爬。我必须彻查黑色岩岗上究竟盘踞着何方神圣！然而在此之前，我必须首先加固后方的防线：库姆马西的劳拉·里昂斯，绝不能让她漏出半点威胁我的口风！", "is_ending": false, "clues": ["华生与亨利爵士开枪追击诺丁山逃犯塞尔登，枪声打破荒原午夜死寂", "斯台普吞在返程途中惊见黑色岩岗绝壁顶端巍然伫立着一个神秘的瘦高黑影"], "choices": [{"id": "s_ch9_p2_c1", "text": "火速亲赴库姆马西集镇密会劳拉·里昂斯，加固对其精神控制，彻底封死信件口风。", "target": "stapleton_ch10_coombe_control", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch9_p2_c2", "text": "带上猎枪暗中摸向黑色岩岗史前石屋群，彻查那个在月下傲视荒原的神秘暗哨。", "target": "stapleton_ch11_part1_spy_on_tor", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_ch10_coombe_control": {"id": "stapleton_ch10_coombe_control", "title": "第十章 华生医生日记摘录（封锁劳拉·里昂斯之口）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "十月二十二日清晨，我单骑快马赶往库姆马西集镇。村妇们的窃窃私语已然传到了我的耳中：那位多管闲事的华生医生，近来正在四处打听查尔斯老爵士生前暗中资助的慈善对象！\n\n倘若华生当真找上了劳拉·里昂斯，我那盘耗尽心血的大棋将面临万劫不复的灭顶之灾！\n\n我不宣而入径直推开了她的起居室房门。劳拉正神色惶恐地坐在雷明顿打字机前发呆。当看到我的身影时，她如溺水者抓住浮木般猛地扑上前死死搂住我的脖颈，展现出那种令我心底作呕的黏腻依附。\n\n‘杰克！’她泪如雨下地抽泣道，‘我快要被吓疯了！庄园来的那个军医正在镇上到处打听老爵士的往事！倘若让他们知道在爵士暴毙当天是我写信约他在侧门相见——’\n\n我稳稳扣住她的手腕，温柔而坚定地将她按回扶手椅中。我居高临下凝视着她那双充满泪水的栗色眼眸，换上了一副充满深情却又痛心疾首的忧郁神情。\n\n‘劳拉，我唯一的挚爱，’我抚摩着她冰凉的面颊低语道，‘难道你对我坚贞的誓言就如此缺乏信任吗？难道你当真不明白，我对外界保持绝对缄默，才是在这场风暴中保全你名节与性命的唯一坚盾？！’\n\n‘保全我？’她战战兢兢地颤声问道。\n\n‘动动你的脑子，看清你当下的处境！’我的嗓音骤然降温，变得如冰冷的刀锋般森寒刺骨，‘你在案发当天亲笔写下一封十万火急的密信，哀求一位家财万贯的贵族老人在深夜十点独自在偏僻荒凉的花岗岩侧门与你私会！而就在当晚，老爵士便横死侧门！倘若这封信的内容公之于众，英国法庭的法官与陪审团会怎么想？！他们会指控你伙同奸夫敲诈勒索！他们会认定是你充当诱饵将一个体面的老绅士送入了死地！全伦敦的讼棍会把你撕得体无完肤，最终把你推上绞刑架！’\n\n她发出了一声撕心裂肺的凄厉尖叫，双手死死捂住面孔，在极致的恐慌中如触电般剧烈抽搐。\n\n‘我发誓我一个字都不会说的！’她在泪流满面中近乎发狂般起誓道，‘看在上帝的十字架份上，杰克！我已经烧毁了所有信件，哪怕天塌下来，我也绝不承认自己曾给他写过半个字！’\n\n‘这才是我的乖女孩，’我伏身在她前额印上一记冰冷的吻，‘再死死咬牙坚持七天。为你赎买自由身的巨额离婚费已然尽在我的掌控之中。一周之后，劳拉，我们将永远离开德文郡，在汪洋大海的彼岸开启我们辉煌的新生。’\n\n我将这个惊弓之鸟彻底锁死在被恐慌与虚幻美梦编织的心理牢笼之中。然而当我策马折返荒原时，我深知死神留给我的时间已然所剩无几。华生的猎犬鼻子已然嗅到了我的脚后跟，终极决战的屠刀必须以最快速度悍然挥下！", "is_ending": false, "clues": ["亲赴库姆马西重申婚姻虚妄诺言，用甜言蜜语与金钱资助进一步麻痹劳拉·里昂斯", "声色俱厉恐吓劳拉一旦向任何人透露半句侧门烧毁信件之事，必将名誉扫地同赴刑场"], "choices": [{"id": "s_ch10_c1", "text": "手持望远镜严密盘查黑色岩岗，暗中跟踪给史前石屋神秘怪客送饭的小厮行踪。", "target": "stapleton_ch11_part1_spy_on_tor", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch10_c2", "text": "【视角切换：歇洛克·福尔摩斯】切换至石屋，见证名侦探根据华生日记锁定L.L.真容。", "target": "holmes_ch10_diary_and_laura", "pov_switch": "holmes", "pov_switch_name": "歇洛克·福尔摩斯"}]}, "stapleton_ch11_part1_spy_on_tor": {"id": "stapleton_ch11_part1_spy_on_tor", "title": "第十一章 岩岗上的人（上：黑色岩岗石屋的神秘暗哨）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "anchor", "anchor_name": "anchor_spy_stapleton", "content": "十月二十三日下午，我手提强力单筒远望镜，如猎豹般潜上了海岩岗（High Tor）的最高峰峦。我的观察目标，直指黑色岩岗那片三千年前不列颠土著留下的史前石屋群。\n\n连续整整三天，那个在月夜顶峰傲立的神秘黑影如跗骨之蛆般折磨着我的神经。倘若那个暗哨当真是苏格兰场的密探——甚至更糟，倘若正是歇洛克·福尔摩斯本人——我留给自己的生路将按小时计算！\n\n我将镜头牢牢对准那些粗糙的圆形花岗岩石壁。在漫长的两个小时里，除了朔风摇曳石楠花外没有任何生机。然而就在午后三点，一个敏捷瘦小的身影突然踩着从库姆马西方向延伸而来的羊肠小径，悄然出现在山脊拐角处！\n\n一个十四五岁的精明伦敦报童打扮的小厮，手里提着一只蒙着粗麻布的野餐竹篮！\n\n我的镜头死死锁定了这个毛头小子。只见他警惕地四下张望，随后身形一猫，径直钻入了最大也是保存最完好的那座圆形石屋之中！仅仅五分钟后，小厮两手空空提着空竹篮疾步钻出石屋，一溜烟奔下了山道。\n\n铁证如山！\n\n那座石屋里确确实实活生生住着一个凡人！一个靠库姆马西集镇提供吃食的神秘密使！一个如老狐狸般昼伏夜出、对庄园和警局彻底隐匿全部踪迹的最高统帅！\n\n放眼全英伦三岛，究竟何人拥有这等惊天动地的胆识、钢铁铸造的耐力以及近乎走火入魔的戏剧化狂热，竟敢在达特穆尔刺骨的冰霜寒夜里餐风露宿在三千年前的史前石窟之中？！\n\n歇洛克·福尔摩斯！\n\n太阳穴两侧的青筋狂暴突跳，血液如战鼓般擂击着我的耳膜。这位名满天下的神探以彼之道还施彼身，狠狠将了我一军！当我自以为得计他在伦敦虚耗光阴时，他竟然早已如雄鹰般盘旋在我头顶的黑色绝壁之上，冷眼俯瞰着我的一举一动！\n\n没有时间再玩弄文绉绉的借刀杀人了！更没有时间再去周旋什么繁复的法理借口！一旦让福尔摩斯彻底合拢证据链，他必将把恶犬、劳拉·里昂斯以及伦敦失窃的旧靴彻底焊死在我的脖颈上！\n\n必须在今晚将亨利爵士格杀勿论！只要这位唯一的拦路虎横尸荒野，按继承法典，我作为仅存的至亲血脉将合法加冕全部七十四万镑巨款！手握如此滔天富贵，我足以买通一切官僚，或是远走高飞逍遥法外！\n\n我啪的一声合上望远镜，飞身跃下峭壁，直扑大格林盆泥潭深处的魔窟孤岛！", "is_ending": false, "clues": ["斯台普吞暗中抓到小厮卡特赖特定期向黑色岩岗史前石屋运送面包与烟草的规律", "确凿证实有一位隐秘统帅正深藏荒原石屋严密监控全局，决意先下手为强除掉亨利"], "choices": [{"id": "s_ch11_p1_c1", "text": "火速奔赴泥潭孤岛，将从伦敦偷来的旧黑皮靴浸透气味喂给饥渴暴怒的恶犬。", "target": "stapleton_ch11_part2_setting_scent", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch11_p1_c2", "text": "【视角切换：约翰·H·华生】见证华生在库姆马西打字行以正义辞令攻破劳拉防线。", "target": "ch11_part1_lyons", "pov_switch": "watson", "pov_switch_name": "约翰·H·华生医生"}]}, "stapleton_ch11_part2_setting_scent": {"id": "stapleton_ch11_part2_setting_scent", "title": "第十一章 岩岗上的人（下：给猎犬闻取旧靴气味）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "我一步迈入泥潭孤岛的旧锡矿工棚，胸膛中的心脏已然冷硬如玄武岩石。\n\n为了彻底激发最原始狂暴的杀戮兽性，我已经整整两天未曾给这头恶兽喂食半星生肉。当它在黑暗中见到我手中提着的皮囊时，发头发狂般猛扑向前，庞大的身躯狠狠扯动着精钢铁链，震得镶嵌在花岗岩石壁里的铁环沙沙作响！黏稠恶臭的涎水顺着它白森森的獠牙不断滴落，两只充血的血瞳在饥饿与绝望的驱使下已近乎癫狂！\n\n我从油布皮囊里掏出了那只从伦敦诺森伯兰旅馆顺手牵羊而来的亨利爵士旧黑皮靴。\n\n我缓缓逼近暴躁的巨兽，嘴唇深处发出那种足以将其逼入杀戮狂态的尖锐嘶鸣。我用那只沾满干泥的旧鞋帮在它剧烈耸动的湿漉漉鼻翼上狠狠来回摩擦！我甚至粗暴地将磨损的鞋跟直接塞入它的血盆大口之中，逼迫它狠狠撕咬着牛皮，将亨利·巴斯克维尔肉体毛孔深处散发出的酸性汗液与热血气味，深深吸入它的五脏六腑！\n\n恶兽的喉咙深处猛地爆发出一阵被遏制不住的狂喜呜咽！它的尾巴犹如铁棒般狂暴地抽打着地面！它记住了这个气味！它认准了这个它受训毕生、誓要从骨髓深处撕咬嚼碎的唯一死敌！\n\n我抓起特制的白磷冷光油膏。以最娴熟冷酷的手法，迅速涂满了它的双眼眼眶、獠牙边缘以及背脊上根根倒竖的硬直鬃毛。\n\n在工棚外，深沉的暮色已然被整片翻滚涌动的阴森灰雾所彻底吞噬。凄厉的夜风在花岗岩绝壁间发出鬼哭狼嚎般的尖啸。\n\n我啪的一声按开了黄铜项圈上的弹簧锁扣！\n\n‘杀！’我指着巴斯克维尔庄园的方向厉声咆哮，‘循着气味，撕碎他的喉咙！’\n\n那头恶魔巨兽如同一支从重弩中射出的夺命铁箭，轰然破门而出！一团在浓墨死沼上狂暴掠过的幽绿烈焰，咆哮着瞬间撕开重重迷雾，沿着旧靴指引的致命气味，狂暴扑向黑夜荒原！\n\n我傲立在工棚门槛上，在凛冽的夜风中狂热战栗，静候着撕心裂肺的绝望惨嚎滚滚传遍整片死沼！", "is_ending": false, "clues": ["故意剥夺恶兽两日饮食激发极致狂暴，用从伦敦盗来的亨利旧黑皮靴死死擦拭恶犬獠牙与吻部", "在狂风大作的黄昏全面备齐磷光油膏，决意在黑夜降临时放出巨兽清洗荒原"], "choices": [{"id": "s_ch11_p2_c1", "text": "趁着浓雾涌起解开铁链放出恶魔巨兽，在荒原冷夜中侧耳倾听绝命哀嚎。", "target": "stapleton_ch12_part1_screams_on_crags", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch11_p2_c2", "text": "【视角切换：歇洛克·福尔摩斯】切换至石屋，见证名侦探撕破斯台普吞假面具的经典一幕。", "target": "holmes_ch11_part2_stone_hut", "pov_switch": "holmes", "pov_switch_name": "歇洛克·福尔摩斯"}]}, "stapleton_ch12_part1_screams_on_crags": {"id": "stapleton_ch12_part1_screams_on_crags", "title": "第十二章 沼地的惨剧（上：巨兽出柙与夜空绝叫）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "anchor", "anchor_name": "anchor_screams_stapleton", "content": "我手提熄灭的马灯，在恶兽后方三百码远的距离如鬼魅般在石楠苔原上全速跟进。\n\n翻滚的浓雾已然填满了低洼的山谷，唯有那些刀削般的黑色花岗岩峰峦如漆黑的孤岛般漂浮在惨白粘稠的乳海之上。整片天地死寂无声。\n\n突然之间，从黑色岩岗正前方的山脊方向，猛然爆发出了惊天动地的狂暴狂吠！\n\n那是一阵浑厚沉重、纯粹由嗜血仇恨淬炼而成的绝命咆哮！恶犬已然彻底锁定了目标！它在以狂暴至极的时速在高岩绝壁上疯狂奔驰扑杀！\n\n我立刻拔腿狂奔，皮靴在碎石与湿泥炭上飞掠而过。\n\n电光石火之间，在高耸入云的花岗岩峭壁之巅，一个人类的嗓音在极度的绝望中爆发出了撕心裂肺的凄厉呼救！\n\n‘救命！看在上帝的份上，救救我啊——！’\n\n呼救声在一瞬间被一阵狂暴凶残的獠牙撕咬声与巨爪践踏声所打断！碎石在悬崖边沿疯狂倾泻坍塌——那是一个亡命徒在悬崖绝壁边缘被死神紧逼时的绝望奔逃！\n\n紧接着，第二声凄厉至极的破胆尖叫撕裂了茫茫雾海：\n\n‘不！不要啊！啊啊啊啊——！’\n\n下一秒，在四十英尺高的垂直悬崖底部，骤然回荡起一声令人毛骨悚然、骨骼寸寸碎裂的沉闷撞击巨响！那是肉体与头颅狠狠砸在坚硬花岗岩上时的钝响！随后，天地重归永恒的冰冷死寂。\n\n一股近乎令人窒息的狂热狂喜瞬间从我胸腔中喷涌而出！\n\n他坠崖了！我的恶犬终于硬生生将亨利爵士逼下了万丈深渊！那个粗鄙的加拿大农夫，此刻已然在悬崖底部撞得粉身碎骨、脑浆涂地！\n\n巴斯克维尔的直系血脉彻底断绝！七十四万镑的黄金属于我了！\n\n我擦亮火柴点燃了手中的昏黄马灯，迈开轻快狂喜的大步，在漆黑错落的花岗岩乱石滩上飞速前行，急不可耐地要亲眼鉴赏我亲手缔造的尸骸杰作！", "is_ending": false, "clues": ["斯台普吞循着恶犬在花岗岩裂谷间激荡回响的恐怖长嚎，紧随其后见证收割成果", "黑色岩岗方向骤然炸响一声撕心裂肺的垂死人类惨呼与重重坠崖摔碎的沉闷巨响"], "choices": [{"id": "s_ch12_p1_c1", "text": "手提马灯快步穿过乱石滩赶往绝壁脚下，亲手检验亨利爵士脑浆迸裂的尸骸成果。", "target": "stapleton_ch12_part2_confronting_holmes", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch12_p1_c2", "text": "【视角切换：歇洛克·福尔摩斯】切换至悬崖底部，目睹福尔摩斯如何擦亮火柴识破死者乃逃犯替身。", "target": "holmes_ch12_part2_selden_death", "pov_switch": "holmes", "pov_switch_name": "歇洛克·福尔摩斯"}]}, "stapleton_ch12_part2_confronting_holmes": {"id": "stapleton_ch12_part2_confronting_holmes", "title": "第十二章 沼地的惨剧（下：错杀逃犯与遭遇福尔摩斯）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "我提着马灯转过悬崖底部的巨石转角，迫不及待地大步迈向横卧在碎石中的那摊扭曲血肉。\n\n然而在尸骸旁，竟然早已跪伏着两条矫健的人影。\n\n我高高举起马灯。昏黄的光柱在照亮那位身材瘦高绅士面庞的一刹那，我肺腑里的呼吸在一秒钟内彻底停滞！\n\n歇洛克·福尔摩斯！\n\n他静静直立起身躯，那对鹰隼般的灰色寒眸在黑暗中宛如两柄剥皮抽骨的手术刀，正冷冷地凝视着我！身旁端立着面带杀气的华生，手中的左轮手枪黑洞洞的枪口直指前方！\n\n极致的眩晕与恐慌瞬间撕裂了我的神智！然而更可怕、比噩梦还要恐怖万倍的景象，却横亘在冰冷的花岗岩地面之上！\n\n死者身上的确紧紧包裹着亨利爵士那套红褐色的粗花呢猎装。然而在马灯光芒的照耀下，那张沾满鲜血脑浆的死人脸，绝非年轻男爵那张轮廓分明的面孔！那是一张狰狞丑陋如野猿、满脸虬结杂乱黑须的凶徒面孔——臭名昭著的诺丁山越狱杀人犯塞尔登！\n\n塞尔登！我的恶犬循着旧靴的气味，追踪的仅仅是这套衣服！是管家白利墨将爵士淘汰的行头施舍给了逃亡的内弟，而饥渴嗜血的恶兽，竟然把这个倒霉的替死鬼硬生生逼下了悬崖！\n\n我内心的每一个细胞都在狂怒与挫败中泣血悲鸣！然而此时此刻，面对近在咫尺的歇洛克·福尔摩斯，我必须强行从脸上挤出最无辜、最优雅的笑容！\n\n‘福……福尔摩斯先生！’我的喉咙干渴得如同荒原的沙砾，结结巴巴地强颜欢笑道，‘真没想到竟能在此地得见真颜！只是……这位不幸罹难的先生究竟是哪位？’\n\n福尔摩斯面无表情地吐出一口烟圈，眼神中带着一种高深莫测的冷酷淡漠：‘一个在荒原上逃亡的重犯，斯台普吞先生。似乎是他失足坠崖跌断了脖子。纯属意外。我和华生明天一早便要搭乘早班火车返回伦敦，我们的假期到此结束了。’\n\n他要回伦敦！福尔摩斯竟然要撤退回京！\n\n他根本不知道内情！他以为这仅仅是一桩普通的逃犯失足意外！这位大神探到底还是漏算了最核心的玄机！\n\n我恭敬地欠身行礼，假惺惺地挤出几句叹惋的辞令，随即转身踩着虚浮的步子遁回迷雾深处的梅利琵宅邸。我的双膝在恐惧中剧烈颤抖，然而我的大脑却在绝境逢生中被疯狂的嗜血杀念重新引燃！\n\n老天爷还留给了我最后一次逆天改命的绝杀契机！明晚，亨利爵士已然应允孤身前来梅利琵宅邸赴宴！只要福尔摩斯一上火车，年轻男爵在深夜十点便必须孤身一人步行横穿达特穆尔！而这一次，我绝不会再犯任何错误！", "is_ending": false, "clues": ["惨死悬崖脚下的竟非爵士，而是身穿亨利淘汰旧西装的诺丁山越狱逃犯塞尔登", "歇洛克·福尔摩斯大侦探本尊竟全副武装携华生屹立在尸体身旁，目光森冷如刀", "斯台普吞在濒死的极度恐慌中强撑笑颜扮演纯良邻居，深知已陷入绝境，唯有最后一击方能翻盘"], "choices": [{"id": "s_ch12_p2_c1", "text": "强压内心的万丈惊恐遁回梅利琵宅邸，下定决心布下最后的夺命鸿门宴做殊死一搏。", "target": "stapleton_ch13_fatal_dinner", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch12_p2_c2", "text": "【视角切换：歇洛克·福尔摩斯】切换至庄园画廊，看神探遮挡雨果画像揭开两百年魔鬼血脉。", "target": "holmes_ch13_portrait", "pov_switch": "holmes", "pov_switch_name": "歇洛克·福尔摩斯"}]}, "stapleton_ch13_fatal_dinner": {"id": "stapleton_ch13_fatal_dinner", "title": "第十三章 设网（梅利琵宅邸的最后鸿门宴）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "anchor", "anchor_name": "anchor_dinner_stapleton", "content": "十月二十四日的这个良夜，是我整整半年呕心沥血布下这盘惊世棋局的最高潮！\n\n午后时分，贝丽尔再次如疯妇般跪倒在地板上死死抱住我的膝盖，指甲抠破了我的皮鞋，歇斯底里地发誓若我敢伤害那位加拿大堂弟，她便一头撞死在泥潭巨石上。\n\n我再也没有跟她浪费半句唇舌。我干脆利落地一拳将她击倒在地，粗暴地将她拖上狭窄的木质楼梯塞入后院最偏僻的次卧。我用厚重的窗帘粗绳将她的手腕与脚踝死死反绑在冰冷的黄铜床柱之上，用一条厚丝巾死死勒紧了她的嘴唇，直到她只能从鼻腔中发出绝望凄厉的悲咽。我反锁了房门，将那把沉甸甸的铁钥匙塞入怀中内袋。\n\n晚间七点整，亨利·巴斯克维尔爵士单刀赴会、如约而至。\n\n他显得兴致极高，红光满面，充满着年轻人的勃勃生机。他亲自向我证实，福尔摩斯与华生确实已搭乘清晨的西行列车返回了伦敦，留他一人在庄园向教区邻里从容告别。\n\n‘福尔摩斯先生未能赏光亲临寒舍共进晚餐，当真是万分遗憾，’我脸上挂着体面而得体的惋惜微笑，为他斟满了一大杯醇厚芬芳的陈年波尔多红酒，‘那真是一位头脑非凡的大人物，只是行事风格未免过于戏剧化了些。’\n\n宴席在极具欺骗性的欢声笑语中顺利推展。我扮演着一位博学风趣的庄园主人，从农耕畜牧一直高谈阔论到加拿大的原始森林采伐。亨利爵士一杯接一杯地畅饮着美酒，然而他的目光却总是不自觉地飘向空荡荡的侧门，显然为贝丽尔因‘突发严重偏头痛’无法作陪而深感怅惘。\n\n九点四十分，我借故离席跨入后厨，推开后窗凝视黑夜。\n\n大自然母亲在这一刻竟然全心全意地站在了我的阵营！\n\n从大格林盆泥潭深处，一堵厚重粘稠、遮天蔽日的雪白大雾正犹如汹涌的海啸般顺着石楠苔原向内陆狂暴席卷！不出十五分钟，整片荒原的小径、岔路与指示石块将被彻底吞没！任何凡人在如此浓密如浆的绝命大雾中涉足荒原，都将脆弱盲目得犹如一个刚出生的婴儿！\n\n我飞步穿过后院隐蔽的储藏石棚。我解开恶兽的铁链，将冰冷黏稠的特制白磷油膏飞速涂满了它的双眼、獠牙与背脊，直到整头恶兽在黑暗中通体燃烧起地狱幽火！\n\n客厅里的老式自鸣钟当啷当啷敲响了十点的丧钟。在走廊尽头，亨利爵士已然穿好了厚大衣准备推门告辞！\n\n巴斯克维尔家族的灭顶之刻，终于轰然降临！", "is_ending": false, "clues": ["亨利爵士单刀赴会孤身抵梅利琵宅邸赴宴，深信福尔摩斯与华生已然乘车返回伦敦", "斯台普吞在二楼反锁的卧房中将企图示警的贝丽尔彻底五花大绑在床柱上封嘴囚禁", "借口查看天色溜出后院，调配剧毒冷光白磷，静候大雾将唯一的泥潭小道彻底切断"], "choices": [{"id": "s_ch13_c1", "text": "在深夜十点亨利爵士踏入夜色时，解开暗室铁链放出通体燃烧地狱磷火的嗜血巨兽。", "target": "stapleton_ch14_part1_release_hound", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch13_c2", "text": "【视角切换：歇洛克·福尔摩斯】切换至巨石埋伏圈，见证神探三人组在滚滚白雾中拔枪以待。", "target": "holmes_ch14_part1_fog_ambush", "pov_switch": "holmes", "pov_switch_name": "歇洛克·福尔摩斯"}]}, "stapleton_ch14_part1_release_hound": {"id": "stapleton_ch14_part1_release_hound", "title": "第十四章 巴斯克维尔的猎犬（上：迷雾施放猎犬与枪声骤响）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "anchor", "anchor_name": "anchor_climax_stapleton", "content": "我蜷缩在后厨大门的深黑阴影之中，屏息凝视着亨利爵士迈开步子踏上碎石小道。他在院门前停顿了片刻，系紧了大衣的纽扣抵御刺骨寒气，随后大步流星踏上了紧挨大格林盆泥潭边缘的返程小道。\n\n仅仅走出了二十码远，滚滚翻涌的雪白大雾便如怪兽巨口般将他的身形彻底吞噬。\n\n就是现在！\n\n我如离弦之箭般冲入储藏石棚。那头恶犬在极度饥饿的狂怒驱使下早已癫狂嗜血，两排巨齿咬得空气噼啪作响，口吻与眼眶喷涌着骇人的幽绿地狱鬼火！\n\n我一把扯掉了项圈上的保险栓！\n\n‘去！’我指着小道的方向咬牙厉哮，‘把他撕成碎片！’\n\n巨兽发出一声惊天动地的狂暴咆哮，轰然破雾扑出！一道在石楠苔原上凌空飞跃的幽绿闪电，以惊人的狂飙时速瞬间没入了茫茫白雾之墙！\n\n我傲立在庭院碎石上，两手死死按住狂跳的心脏，贪婪地侧耳倾听着即将响彻天际的骨碎肉烂绝命惨叫！\n\n一秒……两秒……五秒……\n\n然而，从大雾深处猛然炸响的一声厉声暴喝，却如九天玄雷般将我的三魂七魄当场震碎！\n\n‘注意隐蔽！它来了！’\n\n歇洛克·福尔摩斯！\n\n还没等我僵死的大脑理清这场灭顶之灾，整片迷雾荒原瞬间化作了一片火海！\n\n砰！砰！砰！砰！砰！\n\n密集如爆豆般的重型军用左轮手枪齐射火光刺破浓雾！一声撕裂苍穹的凄厉嚎叫——绝非人类的惨呼，而是恶兽中弹濒死的绝命长嗥！紧接着是一阵巨体砸落草丛的疯狂翻滚抓挠声，随后是最后一记清脆补枪的枪响，伴随着一声微弱的抽搐悲鸣，彻底绝了生息。\n\n死寂。\n\n我的恶犬被打死了！\n\n福尔摩斯根本未曾离境！他在巨石圈外布下了天罗地网！苏格兰场的神探与荷枪实弹的宪警距离我的家门仅仅只有五十码远！\n\n恐慌——一种原始、盲目、彻底扼死理智的绝灭恐惧瞬间摧毁了我钢铁般的意志！一旦被捕，埃克塞特监狱那冰冷的绞刑架便将套死在我的脖颈之上！\n\n我猛然转身撞入后门，一把抓起防湿长筒靴，一头扎入了翻滚如海的大雾之中，亡命奔向大格林盆泥潭的无底深渊！", "is_ending": false, "clues": ["借着滚滚白雾掩护解开项圈，指使燃烧着幽蓝烈焰的食人恶兽扑向亨利爵士后背", "浓雾深处突然爆发出密集如爆豆般的左轮手枪齐射火光，伴随着恶犬临死前震碎云霄的凄厉悲鸣"], "choices": [{"id": "s_ch14_p1_c1", "text": "深知大势已去，抛下一切仓皇逃入漆黑大雾笼罩的大格林盆泥潭深处。", "target": "stapleton_ch14_part2_panic_flight", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch14_p1_c2", "text": "【视角切换：歇洛克·福尔摩斯】切换至决战前线，看神探连射五枪粉碎两百年魔咒。", "target": "holmes_ch14_part1_fog_ambush", "pov_switch": "holmes", "pov_switch_name": "歇洛克·福尔摩斯"}]}, "stapleton_ch14_part2_panic_flight": {"id": "stapleton_ch14_part2_panic_flight", "title": "第十四章 巴斯克维尔的猎犬（下：恶犬毙命与绝命逃遁）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "我跌跌撞撞地一头撞入了大格林盆泥潭那片翻滚涌动的雪白大雾之中，胸膛中的心脏狂暴撞击得犹如一台濒临爆炸的引擎。\n\n在我身后梅利琵宅邸的方向，男人们愤怒的呐喊声穿透浓雾滚滚袭来。我清晰地听到了雷斯垂德那威严刺耳的搜查命令，以及大头皮鞋践踏地板的沉重撞击声！他们找到贝丽尔了！那个饱受皮鞭折磨的女人必将招供出一切——她会带着军警径直抄了我隐匿在孤岛上的魔窟！\n\n我必须登上孤岛！我必须取回藏在石缝里的假护照、巨额金镑现钞以及那只定罪的加拿大旧皮靴，借着大雾一路向北潜逃至布里斯托尔海峡登船出境！\n\n然而四周的迷雾浓稠得宛如一堵移动的大理石墙壁，伸手不见五指，我甚至连自己的膝盖都看不清。我全凭记忆踏上暗径，胸口剧烈起伏抽搐。\n\n左三步……右两步……横跨三英尺泥炭……随后斜向猛跃踏上那块沉在水下的花岗岩暗石！\n\n我的皮靴重重踏上了石头。我再次飞身一跃。\n\n可是插在泥潭里的柳树标记枝条在哪儿？！我伸出颤抖的双手在白茫茫的死雾中发狂般摸索。标记不见了！是被受惊的野马踩断了？还是上涨的泥浆吞没了标记？！\n\n一声惊骇欲绝的尖叫从我干涸的喉咙深处喷涌而出。在极致的恐慌中，我仓皇向前迈出了一大步！\n\n然而就在我的右脚踏落的一刹那，脚下结实的泥土瞬间崩溃了！\n\n那不是开裂——而是融化！一股令人作呕、犹如巨大冰冷果冻般的万钧吸力死死咬住了我的脚踝，以无可抗拒的蛮力将我向下疯狂拖拽！\n\n‘不——！’我撕心裂肺地尖叫，十指如鹰爪般发疯抓挠着表面伪装成草坪的绿色浮苔！\n\n浮苔在我的血肉模糊的指甲缝中碎裂剥离。我的整条右腿膝盖瞬间陷入了翻滚恶臭的黑色烂泥之中。我拼尽一头濒死恶狼的全部野性疯狂扑腾、蹬踹，拼命将整个后背向后拉扯倾斜！\n\n然而每一次挣扎，都只是在成倍加速那万丈深渊的吞噬速度！冰冷刺骨、腥臭难闻的远古污泥迅速漫过了我的大腿——漫过了我的腰际——漫过了我的胸膛！那股混合着剧毒硫磺与腐殖质的地狱恶臭死死堵塞了我的鼻腔！\n\n穿透重重迷雾，在遥远的天地尽头，我隐约听到了普利茅斯开往伦敦的夜班特快列车那雄浑清脆的汽笛长鸣。那是现代文明！那是泼天的富贵！那是活生生的生命！然而这一切，都在不可逆转地向着万丈黑渊急速坠落！\n\n‘贝丽尔——！’我绝望地对着虚无的雾海仰天凄厉哀嚎，‘救救我啊——！’\n\n回应我的，唯有泥沼深处那咕嘟翻滚的一串串冰冷恶臭的毒气水泡。粘稠冰冷的黑色泥浆无情漫过了我的下巴，漫过了我绝望抽搐的嘴唇，最终彻底吞噬了我那双圆睁暴突的眼球。\n\n大格林盆泥潭，用它那永恒无底的冰冷怀抱，将恶魔永远封锁在了大地的最核心。", "is_ending": false, "clues": ["斯台普吞在伸手不见五指的大雾中惊慌失措仓皇踏入大格林盆泥潭", "在狂乱狂奔中迷失了沉水暗石的方向，失足踏破浮草坠入万丈泥浆死渊", "被大格林盆泥潭那万劫不复的冰冷污泥彻底漫过头顶活活吞噬，化作永恒坟墓"], "choices": [{"id": "s_ch14_p2_c1", "text": "在绝望挣扎中彻底沉入大格林盆泥潭无底深渊，魂归死沼（正统宿命终局）。", "target": "ch15_mire", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch14_p2_c2", "text": "在泥潭边缘遭雷斯垂德生擒活捉，解往老贝利法庭领受绞刑架的正义裁决。", "target": "ch15_arrest", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch14_p2_c3", "text": "见证福尔摩斯在贝克街暖融融的壁炉旁，彻底解剖斯台普吞全部罪恶解构。", "target": "ch15_holmes", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch14_p2_c4", "text": "见证忠诚果决的华生医生神勇发枪击毙恶犬，破除百年恶咒的英雄篇章。", "target": "ch15_watson", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch14_p2_c5", "text": "正义终得昭雪，巴斯克维尔庄园重沐理性晨曦，百年阴霾一扫而空的圆满凯旋。", "target": "ch15_victory", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch14_p2_c6", "text": "反思亨利爵士罹患重度神经衰弱远渡重洋的惨痛创伤，罪恶虽诛伤痛难泯。", "target": "ch15_tragedy", "pov_switch": null, "pov_switch_name": null}]}}}};
