 his footing in the dense fog and was swallowed alive by Great Grimpen Mire"], "choices": [{"id": "h_ch14_p2_c1", "text": "Return to Baker Street to reconstruct the complete retrospective deduction.", "target": "ch15_holmes", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch14_p2_c2", "text": "Celebrate the heroic partnership with Dr. Watson by the crackling fireside.", "target": "ch15_watson", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch14_p2_c3", "text": "Review the full triumph of justice and the closure of the Baskerville curse.", "target": "ch15_victory", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch14_p2_c4", "text": "Reflect solemnly upon the tragic cost exacted from the innocent.", "target": "ch15_tragedy", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch14_p2_c5", "text": "Ponder the grim justice of the mire that swallowed the cruel murderer.", "target": "ch15_mire", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch14_p2_c6", "text": "Envision the trial and judgment of the villain before the bar of law.", "target": "ch15_arrest", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_ch01_part1_heritage": {"id": "stapleton_ch01_part1_heritage", "title": "Chapter 1: The Genesis of the Plot (Part I: The Blood of Rodger Baskerville)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "anchor", "anchor_name": "anchor_chapter1_stapleton", "content": "I sat in my study at Merripit House, pinning a rare specimen of the marsh fritillary to the cork board. Through the small window, the vast, treeless wilderness of Dartmoor rolled away toward the gray granite rampart of the tors. To the world, I was Jack Stapleton, an inoffensive, bespectacled schoolmaster turned naturalist, spending his blameless days chasing butterflies with a green gauze net.\n\nFools! Blind, provincial dolts!\n\nIn my veins ran the proud, turbulent blood of the Baskervilles. My father was Rodger Baskerville, the youngest of the three brothers—the reckless, dark-faced rover who had fled England in disgrace to seek his fortune in Central America. I was born in the heat of Costa Rica, christened with his name, and endowed with his fiery, ruthless intellect. When I returned to England with my exquisite wife, Beryl Garcia, I established a boarding school in Yorkshire under the name of Vandeleur. An epidemic of typhus broke out; three boys died, the school collapsed into ruin, and I found myself an impoverished outcast with a fortune in debts.\n\nIt was then, in the depths of our flight, that I discovered the fortune awaiting me. My uncle, Sir Charles Baskerville, had returned from the South African diamond fields, an invalid childless widower with £740,000 invested in gold and consols, restoring the ancestral seat at Baskerville Hall.\n\nBetween that colossal fortune and myself stood only two lives: an ailing old man with a ruined heart, and a distant nephew farming the Canadian bush!\n\nI sold the remnants of my Yorkshire property, moved south to Devonshire, and rented this lonely cottage upon the very edge of the Great Grimpen Mire. I compelled Beryl, under threat of death, to pass as my unmarried sister. And here, in the ancient library of Sir Charles, I unearthed the weapon of my salvation: the 1742 manuscript detailing the legend of the spectral hound that had torn the throat of wicked Hugo Baskerville!\n\nAn ancestral curse! What genius could invent a more perfect instrument of untraceable murder?", "is_ending": false, "clues": ["Stapleton is born the son of Rodger Baskerville, the South American black sheep", "Past bankruptcy of his Yorkshire school forced the adoption of the name Stapleton", "Inheritance of the £740,000 Baskerville estate requires eliminating Charles and Henry"], "choices": [{"id": "s_ch1_p1_c1", "text": "Inspect the secret lair on the mire island and examine the beast.", "target": "stapleton_ch01_part2_beast", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch1_p1_c2", "text": "[Switch POV to Sherlock Holmes] See Holmes examining Mortimer's walking stick.", "target": "holmes_ch01_part1_observation", "pov_switch": "holmes", "pov_switch_name": "Sherlock Holmes"}]}, "stapleton_ch01_part2_beast": {"id": "stapleton_ch01_part2_beast", "title": "Chapter 1: The Genesis of the Plot (Part II: The Monster in Grimpen Mire)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "I crossed the quagmire along my secret path of sunken stones, stepping onto the isolated granite knoll at the heart of Grimpen Mire. Here, concealed within the crumbling stone huts of an abandoned Elizabethan tin-mine, lay my masterpiece.\n\nI pushed open the heavy wooden door of the old smelting shed. A low, terrifying growl rattled from the darkness, accompanied by the metallic rasp of an iron chain.\n\nTwo eyes, burning with savage hunger, fixed upon me.\n\nIt was an immense creature, coal-black, a devilish cross between a bloodhound and a mastiff, which I had purchased in London from Ross and Mangles in the Fulham Road. I had brought it down by northern routes, walking it by night across the tors so that no human eye had rested upon it. It stood nearly thirty inches at the shoulder, with the jaw of a tiger and the iron sinews of a lion.\n\nFrom my leather bag, I produced my secret chemical concoction: a paste of white phosphorus dissolved in refined bone oil and glycerin. It was completely odorless, so as not to deaden the creature's keen hunting scent.\n\nI approached the snarling brute, stroked its massive head, and smeared the paste over its muzzle, across the circles of its eyes, and down its bristling dewlap.\n\nI stepped back and extinguished my lantern.\n\nA cry of involuntary awe broke from my lips! In the pitch blackness of the shed, the beast stood transformed into a thing of pure nightmare! Its mouth appeared to vomit forth green and bluish flames; its eyes smouldered like twin coals from the pit; its massive jaws were dripping with cold fire!\n\nSir Charles was an old man, steeped in superstitious terror, with a heart that fluttered like a wounded sparrow. He would never survive the shock. The hound would not need to set a tooth in him. One glimpse of this roaring phantom springing from the yew trees would burst his heart in his chest!\n\nThe weapon was ready. Now, I needed the lure to draw the old baronet from his sanctuary into the dark.", "is_ending": false, "clues": ["Giant mastiff-bloodhound cross purchased from Ross and Mangles in Fulham Road", "Hidden in abandoned tin mine island in the heart of Great Grimpen Mire", "Luminous chemical preparation: phosphorus dissolved in bone oil glow without scorching"], "choices": [{"id": "s_ch1_p2_c1", "text": "Entangle Laura Lyons into writing the appointment letter to lure Sir Charles.", "target": "stapleton_ch02_part1_laura_trap", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch1_p2_c2", "text": "Test the hound's ferocity upon the bog island with fresh red meat.", "target": "stapleton_ch02_part1_laura_trap", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_ch02_part1_laura_trap": {"id": "stapleton_ch02_part1_laura_trap", "title": "Chapter 2: The Fall of Sir Charles (Part I: The Pawn of Coombe Tracey)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "anchor", "anchor_name": "anchor_laura_trap_stapleton", "content": "The instrument to lure Sir Charles into my trap was ready to hand in Coombe Tracey: Mrs. Laura Lyons.\n\nShe was a woman of desperate vanity and even more desperate poverty. Abandoned by her scoundrel husband, disowned by her cantankerous father Frankland, she was drowning in debt. I cultivated her with sweet, insidious sympathy. I played the chivalrous protector, listened to her tears, and gradually fed her romantic imagination with promises of marriage.\n\n'If only you were free of this monster Lyons,' I would whisper, stroking her hair. 'If only you had the funds to obtain a legal divorce, Beryl and I would welcome you as mistress of Merripit House!'\n\nTwo thousand pounds was the sum required to clear her debts and fund the London lawyers. Who had such wealth and the generosity to bestow it? Sir Charles Baskerville!\n\nOn the morning of May 4th, I called upon Laura at her cottage. I found her in a state of high agitation, receiving threats of legal attachment from her creditors.\n\n'Sir Charles leaves for London tomorrow,' I told her urgently. 'He is old, frail, and his heart is failing. If you write him a formal appeal, he will refer you to his lawyers. You must see him yourself, face to face! You must touch his chivalry before he departs!'\n\nI sat beside her and dictated the fateful words:\n\n'Please, please, as you are a gentleman, burn this letter, and be at the gate by ten o'clock.'\n\nShe signed it with a trembling hand and posted it to Baskerville Hall.\n\nAt five o'clock that afternoon, I returned to her cottage with a look of stern, wounded pride.\n\n'Laura,' I said, seizing her hands, 'I cannot permit it! My honor as a man revolts at the thought of my future wife begging money from another man! I have secured the two thousand pounds from my own investments. You shall not go to Baskerville Hall tonight!'\n\nShe fell upon my neck with tears of overwhelming gratitude. The fool! She believed she was saved. In reality, she had sealed Sir Charles's death warrant, while leaving herself without an alibi to reveal my hand!", "is_ending": false, "clues": ["Stapleton promises marriage to Laura Lyons if she secures divorce funds from Sir Charles", "Dictates the desperate letter demanding a meeting at 10 PM at the yew alley gate"], "choices": [{"id": "s_ch2_p1_c1", "text": "Command Laura Lyons to stay away while you bring the hound to the yew alley.", "target": "stapleton_ch02_part2_yew_alley", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch2_p1_c2", "text": "Prepare the hound with the phosphorus paste as twilight falls upon the moor.", "target": "stapleton_ch02_part2_yew_alley", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_ch02_part2_yew_alley": {"id": "stapleton_ch02_part2_yew_alley", "title": "Chapter 2: The Fall of Sir Charles (Part II: Terror at the Wicker Gate)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "The night of May 4th was pitch-black and damp. At nine o'clock, I slipped out of Merripit House, leading my hound upon a heavy hemp lead. Its muzzle and eyes blazed with their hideous coat of phosphor, shielded beneath a thick woolen blanket.\n\nWe reached the boundary of Baskerville Hall at a quarter to ten. Outside the dense, twelve-foot yew hedge that bordered the alley, the damp peat of the moor was silent as a tomb. I crouched behind a clump of furze bushes, twenty yards from the wooden wicker gate that opened onto the heath.\n\nThrough the gaps in the hedge, I saw the red glow of a cigar.\n\nSir Charles had arrived! He had opened the gate, looked out into the darkness, and was pacing nervously upon the turf, checking his pocket watch every few minutes.\n\nTen o'clock struck from the village church across the valley.\n\nThe old man grew restless. He tossed his first cigar ash to the gravel, struck a second match, and waited another ten minutes. The cold night air was tormenting his lungs.\n\nIt was time.\n\nI stripped the blanket from the hound. I held the beast by its heavy brass collar, whispered into its ear, and pointed its glowing muzzle through the gloom toward the gate.\n\n'Go, boy!' I hissed. 'Take him!'\n\nThe beast leaped forward with a low, bloodcurdling roar!\n\nThrough the wicket, Sir Charles heard the thud of giant paws and turned. What met his superstitious gaze was the nightmare that had haunted his family for two hundred years: an immense, coal-black demon charging through the darkness, its jaws and eyes spouting hellish flame!\n\nHe uttered a shriek that died in his throat. He did not even attempt to shut the gate. He whirled round and ran down the alley on his tiptoes, his hands clawing at his chest in mortal agony! After fifty yards, his heart ruptured, and he crashed headlong onto the turf.\n\nI blew my high-pitched galton whistle. The hound, trained to instant obedience, swerved twenty yards short of the body and bounded back to my side. I slipped the blanket over its head, patted its flank, and led it safely back into the black sanctuary of Grimpen Mire.\n\nNot a mark was on his body. A clean, untraceable kill! The first hurdle was down!", "is_ending": false, "clues": ["Sir Charles waited 20 minutes smoking at the gate expecting Laura Lyons", "The phosphorescent hound was unleashed; Sir Charles fled in terminal cardiac panic", "The hound was recalled into the mire, leaving only footprints twenty yards away"], "choices": [{"id": "s_ch2_p2_c1", "text": "Plan the London expedition to eliminate the new Canadian heir, Sir Henry Baskerville.", "target": "stapleton_ch03_new_heir", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch2_p2_c2", "text": "[Switch POV to Sherlock Holmes] View Holmes receiving the case from Dr. Mortimer.", "target": "holmes_ch01_part2_consultation", "pov_switch": "holmes", "pov_switch_name": "Sherlock Holmes"}]}, "stapleton_ch03_new_heir": {"id": "stapleton_ch03_new_heir", "title": "Chapter 3: The Threat from Canada (The Obstacle to the £740,000 Estate)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "The coroner's verdict was everything I had prayed for: death from natural causes, cardiac syncope. The fools had looked at the yew hedge and seen nothing. Even Mortimer, with his ridiculous anthropological chatter, had kept silent out of fear of rural hysteria.\n\nI believed the prize was within my grasp. But within a fortnight, the Devon papers announced a bitter complication: Sir Charles had a surviving nephew, Henry Baskerville, son of his middle brother. The young man had emigrated to Canada in his youth, was farming near Lake Superior, and had already been summoned home by the family solicitors, Messrs. Gautier and Brown of London, to assume the title and the £740,000 estate!\n\nMy fury was boundless! Was I to allow a colonial clodhopper to wrest the ancestral gold from my grasp after I had braved the gallows to win it?\n\nNever!\n\nA second strike was imperative. But to strike Sir Henry on the open moor would invite instant suspicion from the county constabulary. The ideal ground was London—a city of four million souls, where street accidents, river drownings, and drunken affrays are forgotten in a day!\n\nI locked my hound on the mire island with thirty pounds of horseflesh. I packed two leather valises, purchased a disguise of dark spectacles and an adhesive black beard, and dragged Beryl with me to a quiet boarding house in St. John's Wood under the name of Vandeleur.\n\nShe wept, she pleaded, she went upon her knees, begging me to renounce the inheritance and fly with her back to Central America.\n\n'Touch that door,' I snarled, twisting her slender wrist until she cried out, 'or speak one word to a living soul, and I swear by heaven your Canadian lover will die a death ten times more hideous than his uncle!'\n\nOn October 12th, Sir Henry landed at Southampton. Within two hours, I had picked up his trail at Waterloo station and followed him and Dr. Mortimer to the Northumberland Hotel in the Strand. The hunt had moved to the capital!", "is_ending": false, "clues": ["Sir Henry Baskerville is summoned from Canada as sole heir to the estate", "Stapleton travels to London under an alias to shadow and eliminate Sir Henry", "Beryl is forced to accompany him, watched day and night under constant surveillance"], "choices": [{"id": "s_ch3_c1", "text": "Shadow Sir Henry to the Northumberland Hotel and secure an agent within the staff.", "target": "stapleton_ch04_part1_hotel_shadow", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch3_c2", "text": "[Switch POV to Dr. Watson] View Watson discussing the Dartmoor problem with Holmes at 221B.", "target": "ch03_problem", "pov_switch": "watson", "pov_switch_name": "Dr. John H. Watson"}]}, "stapleton_ch04_part1_hotel_shadow": {"id": "stapleton_ch04_part1_hotel_shadow", "title": "Chapter 4: Sir Henry Baskerville (Part I: Shadows at the Northumberland Hotel)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "anchor", "anchor_name": "anchor_london_shadow_stapleton", "content": "On the evening of October 12th, I returned to our lodgings in St. John's Wood to find Beryl crouched beside the table, her face bathed in tears. Scattered upon the rug lay an open copy of yesterday's Times and a pair of curved nail-scissors.\n\nMy eye caught the jagged gap in the leading article. I seized her by the hair, dragging her head back until her dark eyes stared into mine.\n\n'What have you done?' I hissed.\n\nShe sobbed in terror. 'I warned him! I pasted the words upon a sheet and dropped it into the Charing Cross pillar-box! I could not let you slaughter an innocent boy, Jack! I could not bear the blood on our souls!'\n\nA savage oath escaped my lips! I struck her across the face, hurling her against the sofa. The little traitress had almost destroyed my life's work! The letter was already in the post; it was beyond recall. If Sir Henry took fright and returned to Canada, the estate would slip through my fingers forever!\n\nI must act without an hour's delay.\n\nAt dawn, disguised in a dark frock coat and heavy tinted glasses, I entered the Northumberland Hotel. I slipped half a sovereign into the apron pocket of the chambermaid who was cleaning the second-floor corridor.\n\n'My girl,' said I with a polite smile, 'the gentleman in Room 34 has asked me to take one of his boots to the cobbler in the Strand to be repaired. Hand me one from outside his door, and keep the gold for yourself.'\n\nShe looked at the coin, grinned greedily, and darted to Room 34. She returned in thirty seconds, pressing a boot into my hands.\n\nI slipped it into my bag, hurried down the service stairs, and walked briskly into the morning air. But when I reached an alleyway and drew the boot from my bag, I uttered a roar of frustrated fury!\n\nIt was a brand-new tan boot! The leather was stiff, polished, and virgin—it had never touched a human foot!\n\nAn unworn boot carries no scent! The hound cannot hunt an abstract shape of calfskin—it requires the unmistakable, pungent scent of living sweat and blood!\n\nFurious at the maid's blundering stupidity, I resolved to follow Sir Henry on his morning walk, watch his movements, and contrive to seize a worn boot before the day was out!", "is_ending": false, "clues": ["Beryl secretly composes warning letter using words cut from yesterday's Times", "Stapleton discovers the betrayal, terrifies Beryl, but the letter is already mailed", "Stapleton bribes chambermaid to steal Sir Henry's boot to secure his scent"], "choices": [{"id": "s_ch4_p1_c1", "text": "Discover the maid brought an unworn tan boot; trail Sir Henry into Regent Street in a hansom.", "target": "stapleton_ch04_part2_cab_chase", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch4_p1_c2", "text": "[Switch POV to Sherlock Holmes] View Holmes analyzing the cut Times letter at 221B.", "target": "holmes_ch04_part1_warning", "pov_switch": "holmes", "pov_switch_name": "Sherlock Holmes"}]}, "stapleton_ch04_part2_cab_chase": {"id": "stapleton_ch04_part2_cab_chase", "title": "Chapter 4: Sir Henry Baskerville (Part II: The Duel in Regent Street: Cab 2704)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "I applied a thick, adhesive black beard to my chin, pulled a dark slouch hat over my brow, and stationed myself near the Strand.\n\nAt ten o'clock, Sir Henry and Mortimer emerged, walking briskly toward Oxford Street. I hailed a hansom cab driven by a burly fellow named Clayton.\n\n'Follow those two gentlemen at two hundred yards,' I commanded, tossing him a half-sovereign. 'Keep pace on the opposite side of the road!'\n\nFor twenty minutes, the hunt proceeded smoothly. We crawled down Regent Street behind them. I observed their energetic gestures; Mortimer was evidently taking Sir Henry to a professional consultation. But to whom?\n\nSuddenly, cold horror seized my heart!\n\nWalking briskly down the pavement behind Sir Henry, his keen, aquiline profile unmistakable to any educated man in Europe, was Sherlock Holmes! Accompanying him was a sturdy military gentleman—Dr. Watson!\n\nMortimer had brought Holmes into the case! The foremost detective in the world had taken the field!\n\nAt that instant, Holmes turned his head. His hawk-like gray eyes bored straight through the glass of my cab! He had penetrated my shadow!\n\n'Quick!' I roared, thrusting my stick through the roof-trap into the cabby's back. 'Drive like the devil to Waterloo! A sovereign if you shake them off!'\n\nClayton lashed his horse into a wild gallop. The hansom tore down Regent Street, swerving between omnibuses and drays, leaving Holmes sprinting in our wake. We careened into Waterloo Place, crossed the river, and pulled up amidst the chaos of Waterloo station.\n\nI leaped from the cab, pulled out two golden sovereigns, and pressed them into Clayton's palm.\n\n'You did well, cabby,' said I with a mocking, insolent grin. 'And if a tall gentleman asks you who your fare was, tell him: My name is Sherlock Holmes, and don't you forget it!'\n\nI plunged into the labyrinth of the station, vanished through the southern exit, and left the greatest detective in England grasping at smoke! But the game was now deadly earnest. I had crossed swords with Sherlock Holmes!", "is_ending": false, "clues": ["Stapleton hires cab No. 2704 disguised with adhesive black beard and dark glasses", "Sherlock Holmes spots him; Stapleton escapes and brazenly uses Holmes's own name"], "choices": [{"id": "s_ch4_p2_c1", "text": "Return to the hotel corridor to steal Sir Henry's worn black boot and flee to Devon.", "target": "stapleton_ch05_black_boot", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch4_p2_c2", "text": "[Switch POV to Sherlock Holmes] View Holmes receiving the report from cabman Clayton.", "target": "holmes_ch05_threads", "pov_switch": "holmes", "pov_switch_name": "Sherlock Holmes"}]}, "stapleton_ch05_black_boot": {"id": "stapleton_ch05_black_boot", "title": "Chapter 5: Three Broken Threads (Securing the Old Black Boot)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "anchor", "anchor_name": "anchor_arrival_stapleton", "content": "The encounter in Regent Street had sent an icy shudder of danger through my marrow, but it did not shake my resolve. A lesser intellect would have fled the city. I did the opposite: I doubled back to the Northumberland Hotel.\n\nIn the confusion of the afternoon, while Sir Henry and Mortimer were closeted in consultation with Holmes in Baker Street, I re-entered the hotel. I slipped that useless, unscented tan boot beneath a wicker chair in the second-floor sitting-room. And outside the door of Room 34, my patience was rewarded by the gods of fortune!\n\nThere, set out upon the drugget to be brushed, lay a pair of old black boots, their heels worn down and their toes caked with dried red mud from Sir Henry's Canadian rambles!\n\nI snatched one of the black boots, jammed it beneath my overcoat, and walked calmly out of the front entrance into the Strand.\n\nI had it! The master scent! The heavy, unmistakable odour of human sweat and leather that my starved beast could track across twenty miles of wind-swept bog!\n\nThat evening, my private surveillance outside Baker Street bore another piece of priceless fruit: Sir Henry and Dr. Watson were observed purchasing railway tickets for Devonshire, but Sherlock Holmes was remaining behind in London! The great detective was sending his sheep to the slaughter while he occupied himself with metropolitan trifles!\n\nI laughed aloud in the shadows of the platform. Against Sherlock Holmes, the battle would have been fierce; against Dr. John Watson, the blundering, good-natured army surgeon, it would be child's play!\n\nI returned to St. John's Wood, dragged Beryl by the arm, and boarded the midnight mail train westward. By sunrise on October 14th, we were back at Merripit House.\n\nI went straight to the mire island. I held the muddy black boot beneath the panting nostrils of the monster. The beast snorted, its yellow eyes narrowing in ferocious recognition, and let out a low, slobbering whimper of bloodlust.\n\nThe stage was set. Sir Henry was walking into the jaws of hell!", "is_ending": false, "clues": ["Stapleton returns the new tan boot and successfully steals Sir Henry's old black boot", "Learns Holmes declined to go to Devon, sending only Dr. Watson as bodyguard", "Returns triumphant to Merripit House to prepare the hound with the fatal scent"], "choices": [{"id": "s_ch5_c1", "text": "Take position upon the ridge overlooking the moor road to watch Sir Henry's arrival.", "target": "stapleton_ch06_part1_arrival_watch", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch5_c2", "text": "[Switch POV to Dr. Watson] View Watson traveling west on the express to Devonshire.", "target": "ch06_part1_arrival", "pov_switch": "watson", "pov_switch_name": "Dr. John H. Watson"}]}, "stapleton_ch06_part1_arrival_watch": {"id": "stapleton_ch06_part1_arrival_watch", "title": "Chapter 6: Baskerville Hall (Part I: The Arrival of the Quarry)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "anchor", "anchor_name": "anchor_arrival_moor_stapleton", "content": "On the afternoon of October 15th, I stood upon the granite crest of Belliver Tor, pressing my brass pocket telescope to my eye. The autumn sky was dull and overcast, and a cold, wet wind blew from the Atlantic across the waste.\n\nUpon the Bovey road, a cloud of dust heralded the approach of the wagonette.\n\nThrough the glass, I brought the travelers into focus. There was young Sir Henry, looking eagerly about him at his ancestral moors, wrapped in a Canadian fur-trimmed coat. Beside him sat Dr. Watson, square-jawed, upright, his hand resting conspicuously upon the bulge of his tweed overcoat pocket where his army service revolver lay ready for action. And flanking the vehicle rode two county constables with carbines resting upon their saddlebows.\n\nA comical escort! As though a lead bullet could stop a demon forged of hell-fire and ancient darkness!\n\nThe presence of the armed police had an unexpected cause: Selden, the Notting Hill murderer, had escaped from the granite cells at Princetown three days before and was starving somewhere upon the tors. A delicious complication! If an escaped cutthroat was known to roam the moor, any sudden violence, any cry in the dark, any mangled corpse upon the stones would instantly be laid at the convict's door!\n\nI watched the wagonette turn through the ancient stone piers of Baskerville Hall. The heavy iron gates swung shut behind them.\n\nThe sheep was in the pen! Sir Henry was now separated from civilization by twenty miles of untamed moorland, with only a credulous doctor to shield his throat!\n\nA thrill of predatory exultation pulsed through my veins. The gold of Sir Charles was already glittering before my eyes. I packed my glass and hastened down the slope to Merripit House to ensure that my domestic cage was secure.", "is_ending": false, "clues": ["Sir Henry and Dr. Watson arrive under armed police escort due to Selden's prison break", "Stapleton spots the Escaped Convict Selden factor as a chaotic wildcard"], "choices": [{"id": "s_ch6_p1_c1", "text": "Return to Merripit House and brutally terrorize Beryl into absolute submission.", "target": "stapleton_ch06_part2_beryl_chains", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch6_p1_c2", "text": "[Switch POV to Sherlock Holmes] View Holmes observing the wagonette from the Black Tor hut.", "target": "holmes_ch06_part2_hut_surveillance", "pov_switch": "holmes", "pov_switch_name": "Sherlock Holmes"}]}, "stapleton_ch06_part2_beryl_chains": {"id": "stapleton_ch06_part2_beryl_chains", "title": "Chapter 6: Baskerville Hall (Part II: The Tyrant of Merripit House)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "I entered Merripit House through the kitchen scullery. The house was cold and damp, filled with the sharp, acidic odor of the cyanide jars I used to kill my insect specimens.\n\nIn the sitting-room, Beryl was standing by the window, staring out toward the dark towers of Baskerville Hall. When she heard my step, she started like a struck deer, her face blanching to the lips.\n\n'He has arrived,' I said, shutting the door behind me and locking it with a slow, deliberate turn of the key.\n\nShe pressed her back against the wall, her dark eyes wide with terror. 'Jack... I implore you! In the name of the Christ you blaspheme, let this boy live! He has never wronged you! Take what money we have and let us fly!'\n\nI crossed the room in two strides, seized her by the throat, and forced her down into an armchair until her breath came in ragged, choking gasps.\n\n'Listen to me, my beautiful little hypocrite,' I murmured, leaning over her until my lips brushed her ear. 'You tried to ruin me in London with your cut newspaper. I forgave you because I needed your face. But here on Dartmoor, the game is played with blood, not paper! If you whisper one syllable to Sir Henry—if you breathe one hint that you are my wife and not my sister—I will not merely kill him. I will take you out to the tin-shed in the mire, chain you to the iron ring in the wall, and leave you in the dark with the beast!'\n\nA shudder of convulsive horror racked her slender frame. She slid from the chair onto her knees, weeping in broken, hopeless despair.\n\n'I will be silent,' she moaned, kissing the hem of my coat. 'God help me, I will be silent!'\n\n'See that you are,' I said, stepping over her. 'Tomorrow, the doctor will explore the moor. I shall go out with my butterfly net and introduce myself. A charming, garrulous naturalist—the very man to win an honest soldier's confidence!'\n\nI unlocked the door and went into the kitchen to prepare my poisons. The web was spun; the spider was ready.", "is_ending": false, "clues": ["Stapleton violently threatens Beryl with the hound if she speaks to Sir Henry", "Beryl is kept prisoner in the lonely house surrounded by the deadly bog"], "choices": [{"id": "s_ch6_p2_c1", "text": "Stroll onto the moor with butterfly net to intercept Watson and evaluate his intellect.", "target": "stapleton_ch07_part1_naturalist_act", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch6_p2_c2", "text": "Prepare the hound's feeding schedule on the mire island for the coming night.", "target": "stapleton_ch07_part1_naturalist_act", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_ch07_part1_naturalist_act": {"id": "stapleton_ch07_part1_naturalist_act", "title": "Chapter 7: The Stapletons of Merripit House (Part I: The Mask of the Naturalist)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "anchor", "anchor_name": "anchor_naturalist_stapleton", "content": "The morning of October 16th was brilliant with pale, watery autumn sunshine. Armed with my green gauze net and botanical collecting box, I strolled along the cart track leading from Merripit House toward the Hall.\n\nPresently, as I had anticipated, the square, burly figure of Dr. Watson appeared upon the crest of the hill. He walked with his hands in his pockets, his pipe between his teeth, scanning the wilderness with the curious eye of a stranger.\n\nI quickened my pace, calling out with the cheerful, uninhibited warmth of an isolated country enthusiast.\n\n'Dr. Watson, I presume! Pray excuse the lack of ceremony, but here upon the moor we dispense with provincial etiquette. I am Jack Stapleton, of Merripit House.'\n\nThe good doctor was charmed. In two minutes, we were conversing like old comrades. I pointed out the ancient ruins of the Neolithic stone huts upon the tors, descanted upon the rare flora of the peat-bogs, and spoke with tender melancholy of poor Sir Charles's tragic demise.\n\nSuddenly, from the emerald quagmire behind us, a wild shriek broke upon our ears. A Dartmoor pony, venturing onto the false green moss, was being sucked alive into the black morass!\n\nI gripped Watson's arm, pointing with my net. 'Look, Dr. Watson! The Great Grimpen Mire! A false step means instant, inescapable death! That pony will be under in two minutes!'\n\nWatson stared in frozen horror as the beast vanished beneath the bubbling slime. The lesson was etched into his soul: the moor was a place of deadly horror.\n\nThen, with casual indifference, I dropped the probe:\n\n'We were all deeply disappointed that Mr. Sherlock Holmes did not honor our county with a visit. Is it true that he remains entirely in London?'\n\nWatson smiled with modest pride. 'He is immersed in an urgent metropolitan affair. For the present, Sir Henry is under my sole charge.'\n\nUnder your sole charge! I had to bite my lips to suppress the triumphant grin that threatened to unmask my face. The road to the fortune was clear!", "is_ending": false, "clues": ["Stapleton charms Watson with eccentric naturalist persona near Grimpen Mire", "Demonstrates pony swallowed in mire to establish bog's terrifying lethality", "Inquires about Sherlock Holmes to confirm the great detective is truly in London"], "choices": [{"id": "s_ch7_p1_c1", "text": "Pursue a cyclopides moth into the heather, leaving Watson to encounter Beryl.", "target": "stapleton_ch07_part2_beryl_blunder", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch7_p1_c2", "text": "[Switch POV to Dr. Watson] View Watson's first encounter with Stapleton upon the moor.", "target": "ch07_part1_naturalist", "pov_switch": "watson", "pov_switch_name": "Dr. John H. Watson"}]}, "stapleton_ch07_part2_beryl_blunder": {"id": "stapleton_ch07_part2_beryl_blunder", "title": "Chapter 7: The Stapletons of Merripit House (Part II: The Blunder on the Path)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "I feigned sudden excitement, pointing my net toward a fluttering speck of brown among the heather, and sprinted away across the bog, leaving Watson to walk down the track alone.\n\nMy departure was no accident. I wished to observe the doctor from behind the boulders. But what met my eyes as I crested the granite ridge turned my blood to liquid fire!\n\nBeryl! The wretched, rebellious little fool had slipped from the cottage and was running breathless across the heath!\n\nThrough the gaps in the gorse, I watched her seize Watson by the arm. Her hands were flying, her eyes wild with passionate appeal. Even from a distance of two hundred yards, I could read her frantic pantomime: she was commanding him to turn back, to flee to London, to escape the doom of the Baskervilles! She had mistaken the stocky doctor for the Canadian baronet!\n\nMy hand clenched around my butterfly stick until the bamboo groaked. One word of the hound, one whisper of our true marriage, and my neck would feel the hemp before the week was out!\n\nI leaped from the rocks, swinging my net, whistling a light operatic air as though returning from a successful chase.\n\n'Halloa, Beryl!' I shouted cheerfully. 'What brings you out upon the moor?'\n\nThe effect was instantaneous. She stiffened as though an electric shock had passed through her spine. She stepped back from Watson, her face freezing into that blank, marble mask she wore when the whip was raised.\n\n'I was out walking, Jack,' she stammered, 'and I... I mistook this gentleman for Sir Henry.'\n\nI laughed, a rich, pleasant brotherly laugh that radiated amused indulgence.\n\n'Ah, my dear, you must forgive my sister, Dr. Watson! She is terrified of the moor, and the tragedy of poor Sir Charles has unstrung her nerves. Come, Watson, you must walk back with us to Merripit House and take a cup of coffee before you return to the Hall!'\n\nWatson was utterly disarmed. He suspected nothing. But as we walked three abreast down the gravel lane, my nails dug into the palms of my hands until the blood ran.\n\nBeryl's defiance was becoming an acute, intolerable hazard. When the night of the final kill arrived, she would not merely be warned—she would be bound, gagged, and broken beyond the power to betray!", "is_ending": false, "clues": ["Beryl secretly ran out to intercept Watson, mistaking him for Sir Henry", "Stapleton catches her, suppresses her with cold sisterly domestic facade", "Realizes Beryl's rebellious spirit must be crushed before the final strike"], "choices": [{"id": "s_ch7_p2_c1", "text": "Invite Watson and Sir Henry to dine at Merripit House to cement the social trap.", "target": "stapleton_ch08_probing_watson", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch7_p2_c2", "text": "Inspect the hound's chains and security upon the mire island.", "target": "stapleton_ch08_probing_watson", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_ch08_probing_watson": {"id": "stapleton_ch08_probing_watson", "title": "Chapter 8: First Report of Dr. Watson (Probing the Doctor over Tea)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "The days that followed were a masterpiece of calculated sociability.\n\nI called at Baskerville Hall, paying my respects to the young baronet with all the deferential charm of an eccentric country neighbor. Sir Henry, starving for companionship in that cavernous granite mausoleum, seized upon my company with boyish gratitude. Within forty-eight hours, he was a regular visitor at Merripit House.\n\nAnd there, the second half of my strategy bore instant, intoxicating fruit: Sir Henry fell passionately, blindly, head-over-heels in love with Beryl!\n\nHe could not take his eyes from her exquisite face. Whenever she poured his tea, his hand trembled; whenever she spoke in that soft, foreign cadence, his eyes shone with adoration.\n\nIt was a magnificent advantage, yet one that required razor-sharp navigation. If I permitted an open courtship, Sir Henry might marry her, take her away to London, and discover our true marriage before I could strike!\n\nI executed a stroke of psychological genius: I staged a scene of violent, hysterical jealousy!\n\nWhen Sir Henry attempted to declare his passion to Beryl upon the moor path, I burst from the gorse bushes, white with simulated fury. I insulted the baronet, accused him of taking advantage of an unprotected maiden, and ordered him from my property!\n\nSir Henry was humiliated and bewildered, but his desire was inflamed a hundredfold. Opposition merely stoked his determination to possess her. He apologized, begged for my forgiveness, and promised to keep his distance until I gave my brotherly consent.\n\nMeanwhile, Dr. Watson was scribbling away in his notebook by the hall fireside. Through the village postmaster, whose daughter was friendly with my scullery maid, I learned that Watson was mailing voluminous packets of manuscript to Baker Street twice a week.\n\nLet the fool write! Let him describe the trees, the clouds, the melancholy butler, and my eccentric botanical collections! While Dr. Watson wrote romance and Sherlock Holmes sat idly smoking by his London fireplace, the clock was ticking down to the final catastrophe!", "is_ending": false, "clues": ["Sir Henry visits Merripit and falls violently in love with Beryl at first sight", "Stapleton feigns hysterical brotherly jealousy to prevent dangerous intimacy", "Watson writes extensive reports to Baker Street, unaware Holmes is secretly deployed"], "choices": [{"id": "s_ch8_c1", "text": "Sneak into the Great Grimpen Mire at midnight to feed raw meat to the hungry beast.", "target": "stapleton_ch09_part1_feeding_the_hound", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch8_c2", "text": "[Switch POV to Sherlock Holmes] View Holmes in his stone hut reading Watson's first dispatch.", "target": "holmes_ch08_watson_report", "pov_switch": "holmes", "pov_switch_name": "Sherlock Holmes"}]}, "stapleton_ch09_part1_feeding_the_hound": {"id": "stapleton_ch09_part1_feeding_the_hound", "title": "Chapter 9: The Light upon the Moor (Part I: Feeding the Demon in the Mire)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "anchor", "anchor_name": "anchor_convict_stapleton", "content": "At one in the morning of October 20th, when the house was silent and Beryl was safely locked in her bedroom, I slipped out into the fog.\n\nIn my canvas sack, I carried ten pounds of bloody sheep-offal obtained from an outlying farm near Ashburton. The journey across the Great Grimpen Mire by night was a test that would have shattered the nerve of any ordinary man. The black slime bubbled and hissed on either side; a misstep of four inches would have meant plunging into the subterranean abyss. But my feet knew every sunken tussock and granite footing as a spider knows its web.\n\nI reached the island. The moment my boot scraped the threshold of the tin shed, a deep, resonant rumble vibrated the timber walls.\n\nThe hound knew my step.\n\nI unhitched the lantern and hung it from the central beam. In the dim yellow glow, the beast loomed like a nightmare from the nether world. Its ribs were lean, its eyes blazing with famished fury. I flung the raw meat across the floor. It seized the flesh with savage, crunching jaws, tearing the sinews with sounds that turned my own heart to ice.\n\nWhile it fed, I dipped a rag into my bucket of water, wiped its crusted jaws, and smoothed the matted black fur of its flank.\n\nWhen the last scrap was devoured, the creature threw back its massive head and gave vent to a long, mournful, shuddering howl that rose and fell in a dreadful cadence, echoing out through the broken roof of the shed across the vast, moonlit expanse of the moor!\n\nI did not silence it.\n\nLet the moor hear the voice of its demon! Let Sir Henry tremble beneath his blankets in the Hall! Let the legend sink deeper into the superstitious marrow of the countryside! Every howl prepared the minds of the coroner and the jury to accept his death as the inevitable visitation of the ancestral curse!", "is_ending": false, "clues": ["Stapleton sneaks across the mire at 1 AM to feed blood and meat to the starving hound", "The beast's muffled baying rolls across the moor, striking terror into the district"], "choices": [{"id": "s_ch9_p1_c1", "text": "Hear gunshots across the granite tors and observe Watson chasing the convict.", "target": "stapleton_ch09_part2_night_alarm", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch9_p1_c2", "text": "[Switch POV to Dr. Watson] View Watson and Sir Henry hunting Selden across the moonlit moor.", "target": "ch09_part2_moor_chase", "pov_switch": "watson", "pov_switch_name": "Dr. John H. Watson"}]}, "stapleton_ch09_part2_night_alarm": {"id": "stapleton_ch09_part2_night_alarm", "title": "Chapter 9: The Light upon the Moor (Part II: Chaos on the Moor)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "I locked the shed and picked my way back to the mainland. But as I reached the firm heather of the northern ridge, the crack of a pistol shot ripped through the freezing air!\n\nA second shot followed, echoing sharp and clean against the granite tor!\n\nI crouched in the shadow of a peat-hagg, unbuttoning my revolver. Had the county police discovered my island?\n\nThen, through the silver moonlight, I saw the true cause of the commotion: across the high plateau, two miles distant, a shaggy, wild figure in yellow prison rags was leaping from boulder to boulder like a hunted stag. Pursuing him, firing into the dark, were Sir Henry and Dr. Watson!\n\nThey were hunting Selden! The fools were wasting their powder on a starving wretch!\n\nI watched the chase with contemptuous amusement. But then, as my gaze followed the ridge of Black Tor against the brilliant disc of the full moon, my heart gave a sudden, violent thud!\n\nHigh upon the jagged pinnacle of rock, standing motionless as a pillar of basalt, was the silhouette of a man!\n\nA tall, gaunt figure, his arms crossed over his chest, his head bent forward in profound, vigilant concentration! He looked down into the valley where Sir Henry ran, watching the hunt like an omniscient bird of prey.\n\nWho was he?\n\nIt was neither a constable nor a shepherd. No rustic ever held himself with that commanding, aristocratic poise. Could it be an accomplice of the convict? Or... could it be someone far more dangerous?\n\nI remembered the duel in Regent Street—the piercing gray eyes through the glass of cab No. 2704!\n\nCould Sherlock Holmes have lied? Could the great detective have slipped into Devonshire under a false name, camping upon the open moor like a wild beast?\n\nAn icy prickle of unease rippled down my neck. I must know who lived upon Black Tor! But first, I had to ensure that my rear was secure: Laura Lyons must be silenced beyond all possibility of betrayal!", "is_ending": false, "clues": ["Watson and Sir Henry hunt Selden across the moonlit granite crags", "Stapleton spots an unknown tall, thin figure standing upon the summit of Black Tor"], "choices": [{"id": "s_ch9_p2_c1", "text": "Visit Laura Lyons at Coombe Tracey to ensure her absolute silence.", "target": "stapleton_ch10_coombe_control", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch9_p2_c2", "text": "Scout the prehistoric huts upon Black Tor to unmask the mysterious watcher.", "target": "stapleton_ch11_part1_spy_on_tor", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_ch10_coombe_control": {"id": "stapleton_ch10_coombe_control", "title": "Chapter 10: Extract from the Diary of Dr. Watson (Muzzling Laura Lyons)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "On the morning of October 22nd, I rode into Coombe Tracey. A rumor had reached me through the village gossip that Dr. Watson had been inquiring into the charitable beneficiaries of the late Sir Charles Baskerville.\n\nIf Watson approached Laura Lyons, the entire edifice of my plot was in mortal danger!\n\nI stepped into her modest parlor unannounced. Laura was sitting at her Remington typewriter, looking pale and nervous. When she saw me, she sprang to her feet, throwing her arms around my neck with that clinging, suffocating affection that made my gorge rise.\n\n'Jack!' she wept. 'I have been so terrified! The doctor from the Hall has been asking questions in the village! If they discover that I wrote to Sir Charles on the very day he died—'\n\nI caught her wrists and forced her gently back into her chair. I looked deep into her hazel eyes with an expression of tender, sorrowful reproach.\n\n'Laura, my dearest,' I murmured, stroking her trembling cheek. 'Have you so little faith in my love? Do you not understand that my silence is your only shield?'\n\n'My shield?' she stammered.\n\n'Consider your position!' I said, my voice hardening to the coldness of steel. 'You wrote an urgent letter pleading for a secret midnight interview at an isolated garden gate. That very night, Sir Charles died of terror. What will an English jury say if that letter comes to light? They will say you were an accomplice in a scheme of extortion! They will say you lured an old man to his doom! The lawyers will tear your character to shreds, and you will stand in the dock as a felon!'\n\nShe shrieked, burying her face in her hands, shivering in convulsive terror.\n\n'I will never speak!' she gasped through her tears. 'I swear it by the holy cross, Jack! I burned his reply, and I will deny that I ever wrote a line!'\n\n'Good girl,' I whispered, pressing a kiss upon her brow. 'Keep silent for seven more days. The money for your divorce is almost in my hands. In one week, Laura, we shall leave Devonshire forever and begin our new life across the sea.'\n\nI left her comforted and terrified—the ideal psychological cage. But as I rode back to the moor, I knew that time was running out. Watson was sniffing at my heels. The climax could not be delayed!", "is_ending": false, "clues": ["Stapleton visits Laura Lyons, renewing false promises of marriage and financial aid", "Warns her that any mention of the burnt letter will ruin her reputation and bring prison"], "choices": [{"id": "s_ch10_c1", "text": "Scout Black Tor with field glass and track the boy delivering supplies to the stone hut.", "target": "stapleton_ch11_part1_spy_on_tor", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch10_c2", "text": "[Switch POV to Sherlock Holmes] View Holmes reading Watson's diary extract regarding L.L.", "target": "holmes_ch10_diary_and_laura", "pov_switch": "holmes", "pov_switch_name": "Sherlock Holmes"}]}, "stapleton_ch11_part1_spy_on_tor": {"id": "stapleton_ch11_part1_spy_on_tor", "title": "Chapter 11: The Man on the Tor (Part I: The Unknown Watcher on Black Tor)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "anchor", "anchor_name": "anchor_spy_stapleton", "content": "On the afternoon of October 23rd, I climbed to the crest of High Tor with my powerful field glass. My target was the ancient British settlement upon Black Tor.\n\nFor three days, the mysterious silhouette against the moon had haunted my nightmares. If that watcher was an agent of Scotland Yard—or worse, if it was Sherlock Holmes himself—my time was measured in hours!\n\nI focused my lens upon the circular stone huts. For two hours, nothing moved save the wind in the gorse. Then, picking his way up the sheep-track from the direction of Coombe Tracey, came a boy!\n\nA sharp London lad of fourteen, carrying a wicker basket covered with a coarse cloth!\n\nI followed the urchin with my glass. He scrambled up the rocks, looked warily about him, and ducked straight into the low entrance of the largest stone hut. Five minutes later, he emerged with an empty basket and sprinted back toward the road.\n\nThe proof was incontrovertible!\n\nA man was living in that hut! A man supplied with provisions from Coombe Tracey! A man who lived like a hunted fox, observing everything, keeping his existence a secret from the Hall and from the village!\n\nWho else in England possessed the audacity, the iron endurance, and the dramatic eccentricity to camp in a prehistoric stone hut in the freezing autumn winds of Dartmoor?\n\nSherlock Holmes!\n\nThe blood drummed against my temples like a war-drum. The master detective had outmaneuvered me! While I believed he was idling in London, he had been perched upon the tor above my head, watching my every stroll, tracking my every movement!\n\nThere was no time for subtlety. No time for intricate legal traps. If Holmes completed his inquiries, he would tie me to the hound, to Laura Lyons, and to the stolen boots.\n\nI must strike Sir Henry down tonight! Once the heir was dead, the estate would pass to me as the next of kin. With seven hundred and forty thousand pounds, I could bribe, flee, or defy the world!\n\nI shut my glass, scrambled down the crags, and made straight for the mire island!", "is_ending": false, "clues": ["Stapleton spots young boy Cartwright delivering food parcels to Neolithic huts on Black Tor", "Confirms a secret operative is camping upon the moor observing his movements"], "choices": [{"id": "s_ch11_p1_c1", "text": "Hasten to the mire island and lay Sir Henry's stolen black boot before the hound.", "target": "stapleton_ch11_part2_setting_scent", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch11_p1_c2", "text": "[Switch POV to Dr. Watson] View Watson cornering Laura Lyons in Coombe Tracey.", "target": "ch11_part1_lyons", "pov_switch": "watson", "pov_switch_name": "Dr. John H. Watson"}]}, "stapleton_ch11_part2_setting_scent": {"id": "stapleton_ch11_part2_setting_scent", "title": "Chapter 11: The Man on the Tor (Part II: Laying the Fatal Scent)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "I entered the tin shed upon the mire island, my heart hardened to granite.\n\nThe hound had not tasted meat for two days. When it saw me, it lunged against its chain with a ferocity that shook the iron staples in the wall. Foam dripped from its jaws; its red eyes were glazed with murderous hunger.\n\nI drew Sir Henry's stolen black boot from my oilskin pouch.\n\nI approached the beast, speaking in that low, harsh hiss that drove it to madness. I rubbed the muddy leather across its quivering nostrils. I thrust the worn heel between its jaws, forcing it to gnaw the leather, to inhale the sweat, the skin, the living essence of Henry Baskerville!\n\nThe creature let out a low, choking whine of recognition. Its tail lashed like an iron rod. It knew its quarry! It knew the scent that it was born to tear from the bone!\n\nI took up my pot of phosphorus paste. With swift, merciless strokes, I painted the glowing venom over its eyes, down its muzzle, and along the ridges of its bristling spine.\n\nOutside, twilight was fading into an ocean of clinging, gray moorland fog. The wind shrieked through the rifts in the granite tor.\n\nI snapped the release on the brass collar.\n\n'Kill!' I snarled, pointing toward the Hall. 'Hunt him down and tear his throat!'\n\nThe monster sprang through the open door like a bolt from a crossbow! A streak of roaring green fire across the black slime, vanishing into the fog toward the scent that called it!\n\nI stood upon the threshold, shivering with triumphant anticipation, waiting for the screams of death to roll back across the waste!", "is_ending": false, "clues": ["Stapleton starves the beast and rubs Sir Henry's worn black boot across its jaws", "Prepares to release the hound into the darkness to slaughter the baronet"], "choices": [{"id": "s_ch11_p2_c1", "text": "Unleash the hound into the foggy night and listen for the slaughter upon the crags.", "target": "stapleton_ch12_part1_screams_on_crags", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch11_p2_c2", "text": "[Switch POV to Sherlock Holmes] View Holmes revealing Stapleton's identity to Watson.", "target": "holmes_ch11_part2_stone_hut", "pov_switch": "holmes", "pov_switch_name": "Sherlock Holmes"}]}, "stapleton_ch12_part1_screams_on_crags": {"id": "stapleton_ch12_part1_screams_on_crags", "title": "Chapter 12: Death on the Moor (Part I: The Hound Unleashed)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "anchor", "anchor_name": "anchor_screams_stapleton", "content": "I followed the beast at a distance of three hundred yards, moving lightly across the heather with my unlit lantern.\n\nThe fog had rolled into the hollows, leaving the granite crests floating like dark islands upon a milky sea. The silence was absolute.\n\nThen, from the direction of Black Tor, the baying began!\n\nA deep, rolling roar of pure malice that shook the granite rocks! The hound was in full cry! It had found the trail! It was running at speed across the high plateau!\n\nI quickened my pace to a run, my boots flying over the peat.\n\nSuddenly, high upon the crags above me, a human voice shrieked in mortal agony!\n\n'Help! For God's sake, help!'\n\nThe scream was choked off by a frenzied snarling of jaws and the heavy thud of bounding paws. A wild scramble of feet echoed across the shale—the desperate, frantic flight of a hunted man sprinting along the edge of the abyss!\n\nA second scream tore through the mist, rising to a piercing, despairing shriek:\n\n'No! No! Ahhhh—'\n\nA sickening, splintering crash echoed from the base of the forty-foot precipice! The dull, heavy thud of bone and flesh smashing against solid granite! Then—total, unbroken silence.\n\nMy heart surged with intoxicating, triumphant ecstasy!\n\nHe had fallen! The hound had driven Sir Henry over the edge of the cliff! The young baronet lay dashed to pieces upon the stones!\n\nThe title was extinct! The gold was mine!\n\nI struck a match, lit my yellow lantern, and hastened with eager, bounding strides through the dark boulders toward the foot of the crag to gaze upon my conquest!", "is_ending": false, "clues": ["Stapleton tracks the hound's progress by its muffled bays echoing off the crags", "A scream of mortal terror and a heavy falling crash ring out near Black Tor"], "choices": [{"id": "s_ch12_p1_c1", "text": "Hasten with your lantern to inspect the broken corpse at the foot of the cliff.", "target": "stapleton_ch12_part2_confronting_holmes", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch12_p1_c2", "text": "[Switch POV to Sherlock Holmes] View Holmes discovering the dead convict in Sir Henry's suit.", "target": "holmes_ch12_part2_selden_death", "pov_switch": "holmes", "pov_switch_name": "Sherlock Holmes"}]}, "stapleton_ch12_part2_confronting_holmes": {"id": "stapleton_ch12_part2_confronting_holmes", "title": "Chapter 12: Death on the Moor (Part II: Face to Face with Sherlock Holmes)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "I swung my lantern around the base of the crag, stepping eagerly toward the crumpled heap upon the stones.\n\nTwo men were already kneeling beside the body.\n\nI raised the lantern. The yellow beam struck the face of the taller man, and my breath stopped dead in my lungs!\n\nSherlock Holmes!\n\nHe was standing upright, his gray eyes piercing the gloom like cold daggers! Beside him stood Watson, his pistol drawn!\n\nMy mind convulsed in sheer, dizzying terror! But worse—infinitely worse—was the sight upon the ground!\n\nThe dead man was clad in Sir Henry's ruddy tweed suit. But the face turned up to the lantern was not the strong, clean-shaven face of the baronet! It was a hideous, ape-like countenance, framed in a thick, matted black beard—the broken corpse of Selden, the Notting Hill convict!\n\nSelden! The dog had hunted Sir Henry's clothes, not Sir Henry himself! Barrymore had given the Canadian garments to his starving brother-in-law, and the beast had slaughtered the wrong man!\n\nMy entire soul screamed in frustrated agony. Yet I had to stand there, thirty inches from Sherlock Holmes, and smile!\n\n'Mr. Holmes!' I stammered, my throat parched as sand. 'Is it possible? What an unexpected honour! And... who is this unfortunate man?'\n\nHolmes looked at me with cool, impenetrable amusement. 'An escaped convict, Mr. Stapleton. He seems to have fallen from the crags and broken his neck. A tragic accident. My friend Watson and I return to London tomorrow; our little holiday is at an end.'\n\nHe was leaving! Holmes was returning to London!\n\nHe did not know! He thought it was a common accident! The fool had missed the connection!\n\nI bowed, uttered a few hypocritical condolences, and walked back into the fog toward Merripit House. My knees were shaking, but my brain was afire with renewed, desperate resolve.\n\nOne last throw of the dice remained! Tomorrow night, Sir Henry was dining with me at Merripit House. If Holmes was in London, the baronet would walk home alone across the moor! And this time, there would be no mistake!", "is_ending": false, "clues": ["Corpse is not Sir Henry, but Selden the convict wearing Sir Henry's old clothes", "Sherlock Holmes is standing by the body in the flesh alongside Dr. Watson", "Stapleton is forced to play the innocent neighbor while his life hangs by a thread"], "choices": [{"id": "s_ch12_p2_c1", "text": "Retreat to Merripit House to invite Sir Henry to his final, fatal dinner.", "target": "stapleton_ch13_fatal_dinner", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch12_p2_c2", "text": "[Switch POV to Sherlock Holmes] View Holmes revealing the face of Hugo Baskerville.", "target": "holmes_ch13_portrait", "pov_switch": "holmes", "pov_switch_name": "Sherlock Holmes"}]}, "stapleton_ch13_fatal_dinner": {"id": "stapleton_ch13_fatal_dinner", "title": "Chapter 13: Fixing the Nets (The Last Supper at Merripit House)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "anchor", "anchor_name": "anchor_dinner_stapleton", "content": "The evening of October 24th was the culmination of six months of meticulous preparation.\n\nIn the afternoon, Beryl had fallen upon her knees before me once more, clawing at my hands, weeping that she would throw herself into the bog if I harmed the Canadian boy.\n\nI did not waste words. I struck her down, dragged her up the narrow staircase to the rear bedroom, and tied her wrists and ankles to the brass uprights of the bed with heavy sash cords. I wound a silk scarf tightly across her mouth until she could only moan through her nostrils, locked the door, and pocketed the heavy iron key.\n\nAt seven o'clock, Sir Henry Baskerville arrived alone.\n\nHe was in high spirits, cheerful and robust. He announced that Holmes and Watson had indeed boarded the morning express for London, leaving him to make his farewells to his neighbors.\n\n'A pity Mr. Holmes could not join us,' I remarked with polished regret, pouring him a generous goblet of old port. 'A remarkable intellect, though perhaps a trifle theatrical for country tastes.'\n\nDinner went with deceptive brilliance. I was the charming host, discussing agriculture, cattle-breeding, and Canadian timber. Sir Henry drank freely, his eyes straying constantly toward the door, visibly saddened by Beryl's 'sudden, severe migraine.'\n\nAt twenty minutes to ten, I excused myself, stepped into the scullery, and peered out into the night.\n\nNature itself was fighting upon my side!\n\nFrom the Great Grimpen Mire, a dense, suffocating white fog was rolling inland across the heather like a rising tide! In fifteen minutes, it would swallow the rocks, the paths, and the gates! A man wandering upon the moor in that blinding white vapour would be helpless as a newborn babe!\n\nI hurried to the outhouse where I had concealed the hound. I smeared the cold, oily phosphorus across its jaws, its eyes, and its back until it glowed like an infernal forge.\n\nTen o'clock chimed from my grandfather clock. In the parlor, Sir Henry was rising to take his leave! The hour of retribution had arrived!", "is_ending": false, "clues": ["Sir Henry arrives alone for dinner at Merripit House, believing Holmes returned to London", "Beryl is brutally tied and gagged upstairs in the locked bedroom to ensure silence", "Stapleton prepares the phosphorus paste and slips out into the dense rolling fog"], "choices": [{"id": "s_ch13_c1", "text": "Unleash the phosphorescent hound into the rolling fog as Sir Henry walks home.", "target": "stapleton_ch14_part1_release_hound", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch13_c2", "text": "[Switch POV to Sherlock Holmes] View Holmes, Watson, and Lestrade waiting in the fog ambush.", "target": "holmes_ch14_part1_fog_ambush", "pov_switch": "holmes", "pov_switch_name": "Sherlock Holmes"}]}, "stapleton_ch14_part1_release_hound": {"id": "stapleton_ch14_part1_release_hound", "title": "Chapter 14: The Hound of the Baskervilles (Part I: The Fog and the Gunfire)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "anchor", "anchor_name": "anchor_climax_stapleton", "content": "I watched from the shadows of the scullery door as Sir Henry stepped down the gravel path into the night. He paused at the garden gate, buttoned his collar against the damp chill, and set off along the stone track that led across the moor.\n\nWithin twenty yards, the white fog swallowed him up.\n\nNow!\n\nI darted to the shed door. The hound was snarling in a frenzy of famished madness, snapping at the air, its mouth and eyes blazing with green fire.\n\nI slipped the lead from its collar.\n\n'Go!' I hissed, pointing down the path. 'Tear him to pieces!'\n\nThe beast leaped into the fog with a monstrous roar! A flash of emerald fire, tearing across the heather with giant bounds! In three seconds, it had vanished into the white wall of vapour.\n\nI stood upon the gravel, listening with wild, exultant heartbeats for the screams of death.\n\nOne second... two seconds... five seconds...\n\nSuddenly, a voice roared through the fog—a voice of brass that struck terror into my very soul:\n\n'Look out! It's coming!'\n\nSherlock Holmes!\n\nBefore my paralyzed brain could comprehend the disaster, the night exploded into flame!\n\nCrack! Crack! Crack! Crack! Crack!\n\nA volley of heavy revolver shots tore through the mist! A shriek of agony—not of a man, but of a beast—rent the heavens! A sound of thrashing bodies, a second sharp report, and then... a dying whimper that ceased in the wet heather.\n\nSilence.\n\nMy hound was dead!\n\nHolmes had never left! He had laid an ambush in the rocks! The law was fifty yards from my doorstep, armed, triumphant, and closing the net!\n\nPanic—blind, primal, suffocating terror—shattered my iron nerves! If I was taken, the gallows at Exeter awaited me!\n\nI whirled round, bolted into the house, grabbed my boots, and fled into the swirling fog toward the Great Grimpen Mire!", "is_ending": false, "clues": ["Stapleton releases the phosphorescent hound into the rolling fog after Sir Henry", "A sudden volley of revolver shots tears through the mist, accompanied by the dying shriek of the beast"], "choices": [{"id": "s_ch14_p1_c1", "text": "Flee into the swirling fog of the Great Grimpen Mire to escape the law.", "target": "stapleton_ch14_part2_panic_flight", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch14_p1_c2", "text": "[Switch POV to Sherlock Holmes] View Holmes emptying his revolver into the fire-breathing beast.", "target": "holmes_ch14_part1_fog_ambush", "pov_switch": "holmes", "pov_switch_name": "Sherlock Holmes"}]}, "stapleton_ch14_part2_panic_flight": {"id": "stapleton_ch14_part2_panic_flight", "title": "Chapter 14: The Hound of the Baskervilles (Part II: The Flight into the Abyss)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "I stumbled into the churning white fog of the Great Grimpen Mire, my heart hammering like a dying engine.\n\nBehind me, in the direction of Merripit House, the shouts of men echoed through the vapor. I could hear the sharp, barking orders of Lestrade and the heavy pounding of boots! They had found Beryl! She would tell them everything—she would guide them straight to my island lair!\n\nI must reach the tin shed. I must seize my passport, my gold notes, and the Canadian boots, and escape north toward the Bristol Channel!\n\nThe fog was an impenetrable white blanket, so thick that I could not see my own knees. I ran onto the bog path, gasping for breath.\n\nLeft... right... three paces across the peat... then the diagonal jump to the submerged granite slab.\n\nMy boot struck stone. I leaped again.\n\nWhere was the willow wand? I reached out into the blinding white mist, my fingers trembling. The guide-pole was gone! Had a pony knocked it down? Had the rising mire swallowed the marker?\n\nA scream of panic broke from my parched throat. I took a wild step forward.\n\nUnder my right foot, the solid earth gave way!\n\nIt did not crack—it dissolved! A sickening, jelly-like suction clamped around my ankle and dragged me down!\n\n'No!' I shrieked, clawing frantically at the false green moss.\n\nThe moss tore away in my bleeding fingers. My knee sank into the foul, bubbling black slime. I struggled with all the strength of a dying wolf, thrashing, kicking, throwing my body backward!\n\nEvery movement only accelerated the suction! The cold, foul mud rose to my thigh—to my waist—to my chest! The sulfurous stench of the primeval abyss choked my nostrils.\n\nThrough the drifting fog, across the waste, I heard the faint, distant whistle of the Plymouth express roaring toward London. Civilization! Wealth! Life! All slipping away into the black pit!\n\n'Beryl!' I screamed into the void. 'Help me!'\n\nOnly the gurgling bubbles of the mire answered. The cold slime closed over my chin, over my lips, over my staring eyes.\n\nThe Great Grimpen Mire held me in its eternal, bottomless embrace.", "is_ending": false, "clues": ["Stapleton flees into the Great Grimpen Mire in pitch-black blinding fog", "Loses his secret path of sunken stones amidst the churning white morass", "Swallowed alive by the foul slime of the Great Grimpen Mire"], "choices": [{"id": "s_ch14_p2_c1", "text": "Plunge forever into the bottomless morass of Grimpen Mire (Canonical Ending).", "target": "ch15_mire", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch14_p2_c2", "text": "Face trial and the gallows at the Old Bailey before the bar of justice.", "target": "ch15_arrest", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch14_p2_c3", "text": "Witness Holmes deduce the complete anatomy of the crime in Baker Street.", "target": "ch15_holmes", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch14_p2_c4", "text": "Acknowledge the heroic triumph of Dr. Watson and the breaking of the curse.", "target": "ch15_watson", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch14_p2_c5", "text": "Witness the complete restoration of Baskerville Hall and the victory of reason.", "target": "ch15_victory", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch14_p2_c6", "text": "Reflect upon the shattered nerves of Sir Henry and the bitter cost of crime.", "target": "ch15_tragedy", "pov_switch": null, "pov_switch_name": null}]}}}, "cn": {"title": "巴斯克维尔的猎犬：多视角原著互动典藏版", "author": "阿瑟·柯南·道尔", "description": "完整重现阿瑟·柯南·道尔原著十五个章节的宏篇巨著。三大人物视角全篇15章完整覆盖：华生医生（全15章原汁原味长篇探案纪实）、福尔摩斯（全15章神探第一人称破案纪实）与斯台普吞（全15章反派罪枭第一人称沉浸密谋）。", "start_nodes": {"watson": "ch01_part1_stick", "holmes": "holmes_ch01_part1_observation", "stapleton": "stapleton_ch01_part1_heritage"}, "pov_roles": {"watson": {"name": "约翰·H·华生医生", "description": "实地观察、社交探访，在巴斯克维尔庄园护卫亨利爵士。"}, "holmes": {"name": "歇洛克·福尔摩斯", "description": "在荒原史前石屋隐蔽监视、化学痕迹分析与缜密司法推导。"}, "stapleton": {"name": "杰克·斯台普吞", "description": "穿行大格林盆泥潭密径、伪装昆虫学家，训育荧光猎犬夺取遗产。"}}, "nodes": {"ch01_part1_stick": {"id": "ch01_part1_stick", "title": "第一章 歇洛克·福尔摩斯先生（上：手杖与来客）", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "anchor", "anchor_name": "anchor_chapter1", "content": "歇洛克·福尔摩斯先生坐在桌旁早餐，他除了时常彻夜不眠之外，早晨总是起得很晚的。我站在壁炉前的小地毯上，拿起了昨晚那位客人遗忘的手杖。这是一根很精致而又沉重的手杖，顶端有个疙疸；这种木料产于槟榔屿，名叫槟榔子木。紧挨顶端的下面是一圈很宽的银箍，宽度约有一英寸。上刻“送给皇家外科医学院学士杰姆士·摩梯末，Ｃ．Ｃ．Ｈ．的朋友们赠”，还刻有“一八八四年”。这不过是一根旧式的私人医生所常用的那种既庄重、坚固而又实用的手杖。\n\n“啊，华生，你对它的看法怎么样？”\n\n福尔摩斯正背对着我坐在那里，我原以为我摆弄手杖的事并没有叫他发觉呢。\n\n“你怎么知道我在干什么呢？我想你的后脑勺儿上一定长了眼睛了吧。”\n\n“至少我的眼前放着一把擦得很亮的镀银咖啡壶。”他说，“可是，华生，告诉我，你对咱们这位客人的手杖怎样看呢？\n\n遗憾的是咱们没有遇到他，对他此来的目的也一无所知，因此，这件意外的纪念品就变得更重要了。在你把它仔细地察看过以后，把这个人给我形容一番吧。”\n\n“我想，”我尽量沿用着我这位伙伴的推理方法说，“从认识他的人们送给他这件用来表示敬意的纪念品来看，摩梯末医生是一位功成名就、年岁较大的医学界人士，并且很受人尊敬。”\n\n“好哇！”福尔摩斯说：“好极了！”\n\n“我还认为，他很可能是一位在乡村行医的医生，出诊时多半是步行的。”\n\n“为什么呢？”\n\n“因为这根手杖原来虽很漂亮，可是，已经磕碰得很厉害了，很难想象一位在城里行医的医生还肯拿着它。下端所装的厚铁包头已经磨损得很厉害了，因此，显然他曾用它走过很多的路。”\n\n“完全正确！”福尔摩斯说。\n\n“还有，那上面刻着‘Ｃ．Ｃ．Ｈ．的朋友们’，据我猜想，所指的大概是个猎人会［因为猎人（Ｈｕｎｔｅｒ）一词的头一个字母是Ｈ，所以华生推想Ｃ．Ｃ．Ｈ．可能是个什么猎人会组织名称的缩写字。——译者注］；他可能曾经给当地的这个猎人会的会员们作过一些外科治疗，因此，他们才送了他这件小礼物表示酬谢。”\n\n“华生，你真是大有长进了，”福尔摩斯一面说着，一面把椅子向后推了推，并点了支纸烟，“我不能不说，在你热心地为我那些微小的成就所作的一切记载里面，你已经习惯于低估自己的能力了。也许你本身并不能发光，但是，你是光的传导者。有些人本身没有天才，可是有着可观的激发天才的力量。我承认，亲爱的伙伴，我真是太感激你了。”\n\n他以前从来没有讲过这么多的话，不可否认，他的话给了我极大的快乐。因为过去他对于我对他的钦佩和企图将他的推理方法公诸于众所作的努力，常是报以漠然视之的态度，这样很伤我的自尊心。而现在我居然也能掌握了他的方法，并且实际应用起来，还得到了他的赞许，想起这点我就感到很骄傲。现在他从我手中把手杖拿了过去，用眼睛审视了几分钟，然后带着一副很感兴趣的神情放下了纸烟，把手杖拿到窗前又用放大镜仔细察看起来。\n\n“虽很简单，但还有趣，”他说着就重新在他所最喜欢的那只长椅的一端坐下了，“手杖上确实有一两处能够说明问题。它给我们的推论提供了根据。”\n\n“我还漏掉了什么东西吗？”我有些自负地问道，“我相信我没有把重大的地方忽略掉。”\n\n“亲爱的华生，恐怕你的结论大部分都是错误的呢！坦白地说吧，当我说你激发了我的时候，我的意思是说：在我指出你谬误之处的同时，往往就把我引向了真理。但并不是说这一次你完全错误了。那个人肯定是一位在乡村行医的医生，而且他确是常常步行的。”\n\n“那么说，我的猜测就是对的了。”\n\n“也只是到这个程度而已。”\n\n“但是，那就是全部事实了。”\n\n“不，不，亲爱的华生，并非全部——决不是全部。譬如说，我倒愿意提出，送给这位医生的这件礼物，与其说是来自猎人会，倒不如说是来自一家医院；由于两个字头‘Ｃ．Ｃ．’是放在‘医院’一词（在英文中，医院一词的字头也是Ｈ）之前的。因此，很自然的使人想起了ＣｈａｒｉｎｇＣｒｏｓｓ这两个字来。”\n\n“也许是你对了。”\n\n“很可能是这样的。如果咱们拿这一点当作有效的假设的话，那我们就又有了一个新的根据了。由这个根据出发，就能对这位未知的来客进行描绘了。”\n\n“好吧！假设‘Ｃ．Ｃ．Ｈ．’所指的就是查林十字医院，那么我们究竟能得出什么进一步的结论呢？”\n\n“难道就没有一点能够说明问题的地方了吗？既然懂得了我的方法，那么就应用吧！”\n\n“我只能想出一个明显的结论来，那个人在下乡之前曾在城里行过医。”\n\n“我想咱们可以大胆地比这更前进一步，从这样的角度来看，最可能是在什么样的情况下，才会发生这样的赠礼的行动呢？在什么时候，他的朋友们才会联合起来向他表示他们的好意呢？显然是在摩梯末为了自行开业而离开医院的时候。\n\n我们知道有过一次赠礼的事；我们相信他曾从一家城市医院转到乡村去行医。那么咱们下结论，说这礼物是在这个转换的当儿送的不算过分吧。”\n\n“看来当然是可能的。”\n\n“现在，你可以看得出来，他不会是主要医师，因为只有当一个人在伦敦行医已有了相当名望的时候，才能据有这样的地位，而这样的一个人就不会迁往乡村去了。那么，他究竟是个做什么的呢？如果说他是在医院里工作而又不算在主要医师之列，那么他就只可能是个住院外科医生或者是住院内科医生——地位稍稍高于医学院最高年级的学生；而他是在五年以前离开的——日期是刻在手杖上的，因此你的那位严肃的、中年的医生就化为乌有了。亲爱的华生，可是这里出现了一位青年人，不到三十岁，和蔼可亲、安于现状、马马虎虎，他还有一只心爱的狗，我可以大略地把它形容成比狸犬大，比獒犬小。”\n\n我不相信地笑了起来。歇洛克·福尔摩斯向后靠在长椅上，向天花板上吐着飘荡不定的小烟圈。\n\n“至于后一部份，我无法检查你是否正确，”我说，“但是要想找出几个有关他的年龄和履历的特点来，至少是不怎么困难的。”我从我那小小的放医学书籍的书架上拿下一本医药手册来，翻到人名栏的地方。里面有好几个姓摩梯末的，但只有一个可能是我们的来客。我高声地读出了这段记载：\n\n“杰姆士·摩梯末，一八八二年毕业于皇家外科医学院，德文郡达特沼地格林盆人。一八八二至一八八四年在查林十字医院任住院外科医生。因著文《疾病是否隔代遗传》而获得杰克逊比较病理学奖金。瑞典病理学协会通讯会员。曾著有《几种隔代遗传的畸形症》（载于一八八二年的《柳叶刀》），［《柳叶刀》（原文为Ｌａｎｃｅ）是英国的一种医学杂志，至今仍继续出版。——译者注］《我们在前进吗？》（载于一八八三年三月份的《心理学报》）。曾任格林盆、索斯利和高冢村等教区的医务官。”\n\n“并没有提到那个本地的猎人会啊，华生！”福尔摩斯带着嘲弄的微笑说，“正象你所说的观察结果一样，他不过是个乡村医生；我觉得我的推论是很正确的了。至于那些形容词，如果我记得不错的话，我说过‘和蔼可亲、安于现状和马马虎虎’。根据我的经验，在这个世界里只有待人亲切的人才会收到纪念品；只有不贪功名的人才会放弃伦敦的生涯而跑到乡村去；只有马马虎虎的人才会在你的屋里等了一小时以后不留下自己的名片，反而留下自己的手杖。”\n\n“那狗呢？”\n\n“经常是叼着这根手杖跟在它主人的后面。由于这根木杖很重，狗不得不紧紧地叼着它的中央，因此，它的牙印就能看得很清楚了。从这些牙印间的空隙看来，我以为这只狗的下巴要比狸犬下巴宽，而比獒犬下巴窄。它可能是……对了，它一定是一只卷毛的长耳獚犬。”\n\n他站了起来，一面说着一面在屋里来回地走着。他在向楼外突出的窗台前站住了。他的语调里充满了自信，引得我抬起头来，以惊奇的眼光望着他。\n\n“亲爱的伙伴，对这一点，你怎么能这样地肯定呢？”\n\n“原因很简单，我现在已经看到那只狗正在咱们大门口的台阶上，而且它主人按铃的声音也传了上来。不要动，我恳求你，华生。他是你的同行兄弟，你在场对我也许会有帮助。\n\n华生，现在真是命运之中最富戏剧性的时刻了，你听得到楼梯上的脚步声了吧，他正在走进你的生活；可是，你竟不知道是祸是福。这位医学界的人物，杰姆士·摩梯末医生要向犯罪问题专家歇洛克·福尔摩斯请教些什么呢？请进！”", "is_ending": false, "clues": ["刻有‘一八八四年，C.C.H.的朋友们赠给皇家外科医学院会员杰姆士·摩梯末’字样的槟榔屿手杖", "手杖上被猎犬利齿咬出的齿痕"], "choices": [{"id": "ch1_p1_c1", "text": "专心聆听摩梯末医生说明来意与所携文书。", "target": "ch01_part2_mortimer", "pov_switch": null, "pov_switch_name": null}, {"id": "ch1_p1_c2", "text": "询问摩梯末医生为何专程造访‘欧洲第二高明的专家’。", "target": "ch01_part2_mortimer", "pov_switch": null, "pov_switch_name": null}]}, "ch01_part2_mortimer": {"id": "ch01_part2_mortimer", "title": "第一章 歇洛克·福尔摩斯先生（下：神秘的手稿）", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "branch", "anchor_name": null, "content": "这位客人的外表，对我来说真是值得惊奇的事，因为我先前预料的是一位典型的乡村医生，而他却是一个又高又瘦的人，长长的鼻子象只鸟嘴，突出在一双敏锐而呈灰色的眼睛之间，两眼相距很近，在一副金边眼镜的后面炯炯发光。他穿的是他这一行人常爱穿的衣服，可是相当落拓，因为他的外衣已经脏了，裤子也已磨损。虽然还年轻，可是长长的后背已经弯曲了，他在走路的时候头向前探着，并具有贵族般的慈祥风度。他一进来，眼光马上就落在福尔摩斯拿着的手杖上了，他欢呼一声就向他跑了过去。“我太高兴了！”他说道，“我不能肯定究竟是把它忘在这里了呢？还是忘在轮船公司里了。我宁可失去整个世界，也不愿失去这根手杖。”\n\n“我想它是件礼物吧。”福尔摩斯说。\n\n“是的，先生。”\n\n“是查林十字医院送的吗？”\n\n“是那里的两个朋友在我结婚时送的。”\n\n“唉呀！天哪，真糟糕！”福尔摩斯摇着头说。\n\n摩梯末医生透过眼镜稍显惊异地眨了眨眼。\n\n“为什么糟糕？”\n\n“因为您已经打乱了我们的几个小小的推论。您说是在结婚的时候，是吗？”\n\n“是的，先生，我一结婚就离开了医院，也放弃了成为顾问医生［顾问医生为医生中之地位最高者。顾问医生停止一般医疗工作而专门协助诊断治疗一般医生难以诊治之疑难病症。——译者注］的全部希望。可是，为了能建立起自己的家庭来，这样做是完全必要的。”\n\n“啊哈！我们总算还没有弄错。”福尔摩斯说道，“嗯，杰姆士·摩梯末博士……”\n\n“您称我先生好了，我是个卑微的皇家外科医学院的学生。”\n\n“而且显而易见，还是个思想精密的人。”\n\n“一个对科学略知一二的人，福尔摩斯先生；一个在广大的未知的海洋岸边拣贝壳的人。我想我是在对歇洛克·福尔摩斯先生讲话，而不是……”\n\n“不，这是我的朋友华生医生。”\n\n“很高兴能见到您，先生。我曾听到人家把您和您朋友的名字相提并论。您使我很感兴趣，福尔摩斯先生。我真想不到会看见这样长长的头颅或是这种深深陷入的眼窝。您不反对我用手指沿着您的头顶骨缝摸一摸吧，先生？在没有得到您这具头骨的实物以前，如果按照您的头骨做成模型，对任何人类学博物馆说来都会是一件出色的标本。我并不想招人讨厌，可是我承认，我真是羡慕您的头骨。”\n\n歇洛克·福尔摩斯用手势请我们的陌生客人在椅子上坐下。“先生，我看得出来，您和我一样，是个很热心于思考本行问题的人，如同我对我的本行一样。”他说道，“我从您的食指上能看出来您是自己卷烟抽的；不必犹豫了，请点一支吧。”\n\n那人拿出了卷烟纸和烟草，在手中以惊人的熟练手法卷成了一支。他那长长的手指抖动着，好象昆虫的触须一样。\n\n福尔摩斯很平静，可是他那迅速地转来转去的眼珠使我看出，他已对我们这位怪异的客人发生了兴趣。\n\n“我认为，先生，”他终于说起话来了，“您昨晚赏光来访，今天又来，恐怕不仅仅是为了研究我的头颅吧？”\n\n“不，先生，不是的，虽然我也很高兴有机会这样做。我所以来找您，福尔摩斯先生，是因为我知道我自己是个缺乏实际经验的人，而且我忽然遇到了一件最为严重而又极为特殊的问题。由于我确知您是欧洲第二位最高明的专家……”\n\n“喝，先生！请问，荣幸地站在第一位的是谁呢？”福尔摩斯有些刻薄地问道。\n\n“对于一个具有精确的科学头脑的人来说，贝蒂荣先生办案的手法总是具有很强的吸引力的。”\n\n“那么您去找他商讨不是更好吗？”\n\n“先生，我是说，就具有精确的科学头脑的人说来。可是，就对事物的实际经验说来，众所共知的，您是独一无二的了。东西\n\n我相信，先生，我并没有在无意之中……”\n\n“不过稍微有一点罢了，”福尔摩斯说道，“我想，摩梯末医生，最好请您立刻把要求我协助的问题明白地告诉我吧。”", "is_ending": false, "clues": ["摩梯末医生就查尔斯·巴斯克维尔爵士猝死案向福尔摩斯求助", "摩梯末医生胸前口袋中深藏的一份一七四二年古代手稿"], "choices": [{"id": "ch1_p2_c1", "text": "请摩梯末医生展开宣读一七四二年巴斯克维尔诅咒手稿。", "target": "ch02_part1_legend", "pov_switch": null, "pov_switch_name": null}, {"id": "ch1_p2_c2", "text": "向摩梯末医生询问查尔斯·巴斯克维尔爵士生前的心态与恐惧。", "target": "ch02_part1_legend", "pov_switch": null, "pov_switch_name": null}]}, "ch02_part1_legend": {"id": "ch02_part1_legend", "title": "第二章 巴斯克维尔的灾祸（上：古老的手稿）", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "anchor", "anchor_name": "anchor_curse", "content": "“我口袋里有一篇手稿，”杰姆士·摩梯末医生说道。\n\n“在您进屋时我就看出来了，”福尔摩斯说。\n\n“是一张旧手稿。”\n\n“是十八世纪初期的，否则就是假造的了。”\n\n“您怎么知道的呢，先生？”\n\n“在您说话的时候，我看到那手稿一直露着一两英寸的光景。如果一位专家不能把一份文件的时期估计得相差不出十年左右的话，那他就真是一位差劲儿的蹩脚专家了。可能您已经读过了我写的那篇关于这问题的小论吧。据我判断，这篇手稿是在一七三○年写成的。”\n\n“确切的年代是一七四二年。”摩梯末医生从胸前的口袋里把它掏了出来，“这份祖传的家书，是查尔兹·巴斯克维尔爵士交托给我的，三个月前他忽遭惨死，在德文郡引起了很大的惊恐。可以说，我是他的朋友，同时又是他的医生。他是个意志坚强的人，先生，很敏锐，经验丰富，并和我一样地讲求实际。他把这份文件看得很认真，他心里早已准备接受这样的结局了；而结果，他竟真的得到了这样的结局。”\n\n福尔摩斯接过了手稿，把它平铺在膝头上。\n\n“华生，你注意看，长Ｓ和短Ｓ的换用，这就是使我能确定年代的几个特点之一。”\n\n我凑在他的肩后看着那张黄纸和退了色的字迹。顶上写着“巴斯克维尔庄园”，再下面就是潦草的数字“１７４２”。\n\n“看来好象是一篇什么记载似的。”\n\n“对了，是关于一件在巴斯克维尔家流传的传说。”\n\n“不过我想您来找我恐怕是为了当前的和更有实际意义的事情吧？”\n\n“是近在眼前的事，这是一件最为现实和急迫的事了，必须在二十四小时之内做出决定。不过这份手稿很短，而且与这件事有着密切联系。如果您允许的话，我就把它读给您听。”\n\n福尔摩斯靠在椅背上，两手的指尖对顶在一起，闭上了眼睛，显出一副听其自然的神情。摩梯末将手稿拿向亮处，以高亢而嘶哑的声音朗读着下面的奇特而古老的故事：\n\n“关于巴斯克维尔的猎犬一事有过很多的说法，我所以要写下来是因为我相信确曾发生过象我所写的这样的事。我是修果·巴斯克维尔的直系后代，这件事是我从我父亲那里听来的，而我父亲又是直接听我祖父说的。儿子们，但愿你们相信，公正的神明能够惩罚那些有罪的人，但是只要他们能祈祷悔过，无论犯了多么深重的罪，也都能得到宽恕。你们知道了这件事，也不用因为前辈们所得的恶果而恐惧，只要自己将来谨慎就可以了，以免咱们这家族过去所尝到的深重的痛苦重新落在咱们这些败落的后代身上。\n\n“据说是在大叛乱时期［指英国１６４２—１６６０年的内战而言。——译者注］（我真心地向你们推荐，应该读一读博学的克莱仑顿男爵所写的历史），这所巴斯克维尔大厦本为修果·巴斯克维尔所占用，无可否认，他是个最卑俗粗野、最目无上帝的人了。事实上，如果只是这一点的话，乡邻本是可以原谅他的，因为在这一地区圣教从来就没有兴旺过。他的天性狂妄、残忍，在西部已是家喻户晓了。这位修果先生偶然地爱上了（如果还能用这样纯洁的字眼称呼他那卑鄙的情欲的话）在巴斯克维尔庄园附近种着几亩地的一个庄稼人的女儿。可是这位少女一向有着谨言慎行的好名声，当然要躲着他了，何况她还惧怕他的恶名。后来有一次，在米可摩斯节［基督教纪念圣徒麦可（Ｓｔ．Ｍｉｃｈａｅｌ）的节日（每年９月２９日）。——译者注］那天，这位修果先生知道她的父兄俩都出门去了，就和五六个游手好闲的下流朋友一起，偷偷地到她家去把这个姑娘抢了回来。他们把她弄进了庄园，关在楼上的一间小屋子里，修果就和朋友们围坐狂欢痛饮起来，他们在夜里是常常这样干的。这时，楼上的那位可怜的姑娘听到了楼下狂歌乱吼和那些不堪入耳的脏字，已是惊恐万分不知所措了。有人说，修果·巴斯克维尔酒醉时所说的那些话，不管是谁，即使是重说一遍都可能会遭到天谴。最后，她在恐惧已极的情况之下竟干出来一桩就连最勇敢和最狡黠的人都会为之咋舌的事来。\n\n她从窗口出来，攀缘着至今仍爬满南墙的蔓藤由房檐下面一直爬了下来，然后就穿过沼地直往家里跑去了，庄园离她家约有九英里的样子。\n\n“过了一会儿，修果离开了客人，带着食物和酒——说不定还有更糟糕的东西呢——就去找被他掳来的那个姑娘去了，可是竟发现笼中之鸟已经逃走了。随后，他就象中了魔似地冲下楼来，一到饭厅就跳上了大餐桌，眼前的东西，不管是酒瓶还是木盘全都被他踢飞了。他在朋友面前大嚷大闹着说：只要当晚他能追上那丫头，他愿把肉体和灵魂全都献给恶魔任其摆布。当那些纵酒狂饮的浪子们被他的暴怒吓得目瞪口呆的时候，有一个特别凶恶的家伙——也许是因为他比别人喝得更醉——大叫着说应当把猎狗都放出去追她。修果听他一说就跑了出去，高呼马夫牵马备鞍并把犬舍里的狗全都放出来，把那少女丢下的头巾给那些猎狗闻了闻就把它们一窝蜂地轰了出去，这些狗在一片狂吠声中往被月光照耀着的沼地上狂奔而去。\n\n“这些浪子们目瞪口呆地站着，不知道这样匆匆忙忙地搞了半天究竟是怎么回事。过了一会儿他们才弄明白了到沼地里去要干什么，接着又都大喊大叫起来了，有的人喊着要带手枪，有的人找自己的马，有的人甚至还想再带一瓶酒。最后，他们那疯狂的头脑终于恢复了一点理智，十三个人全体上马追了下去。头顶上的月亮清清楚楚地照着他们，他们彼此紧靠一起顺着那少女返家的必经之途疾驰而去。\n\n“在他们跑了一二英里路的时候，遇到了一个沼地里的牧人，他们大喊着问他看到了他们所追捕的人没有。据说那牧人当时被吓得简直都说不出话来了，后来，他终于说他确实看到了那个可怜的少女，后面还有一群追索着她的猎狗。‘我看到的还不止这些呢，’他说道，‘修果·巴斯克维尔也骑着他那黑马从这里过去了，还有一只魔鬼似的大猎狗一声不响地跟在他的后面。上帝啊，可别让那样的狗跟在我的后面！’那些醉鬼老爷们骂了那牧人一顿就又骑着马赶了下去。可是不久他们就被吓得浑身发冷了。因为他们听到沼地里传来了马跑的声音，随后就看到了那匹黑马，嘴里流着白沫跑了过去，鞍上无人，缰绳拖在地上。从那时起那些浪子们就都挤到了一起，因为他们已经感到万分恐怖了，可是他们总还是在沼地里前进着。如果他们只是一个人走在那里的话，无疑地早就会拨转马头跑回去了。他们就这样慢慢地骑着前进，最后终于赶上了那群猎狗。这些狗虽然都是以骁勇和优种出名的，可是这时竟也挤在沼地里的一条深沟的尽头处，竞相哀鸣起来，有些只已经逃之夭夭了，有些则颈毛直竖，两眼直瞪瞪地向前面一条窄窄的小沟里望着。\n\n“这帮人勒住了马，可以猜想得到，他们现在已比出发的时候清醒得多了。其中大多数已经不想再前进了，可是有三个胆子最大的——也许是醉得最厉害的——继续策马向山沟走了下去。前面出现了一片宽阔的平地，中间立着两根大石柱——至今还可以看到——是古时不知是谁立起来的。月光把那块空地照得很亮，那因惊恐和疲惫而死的少女就躺在那块空地的中央。可是使这三个胆大包天的酒鬼毛骨悚然的既不是少女的尸体，也不是躺在她近旁的修果·巴斯克维尔的尸体，而是站在修果身旁撕扯着他喉咙的那个可怕的东西，一只既大又黑的畜生，样子象一只猎狗，可是谁也没见过这样大的猎狗。正当他们看着那家伙撕扯修果·巴斯克维尔的喉咙的时候，它把闪亮的眼睛和直流口涎的大嘴向他们转了过来。三个人一看就吓得大叫起来，赶忙拨转马头逃命去了，甚至在穿过沼地的时候还惊呼不已。据说其中的一个因为看到了那家伙当晚就吓死了，另外两个也落得个终身精神失常。\n\n“我的儿子们啊，这就是那只猎狗的传说的来历，据说从那时起那只狗就一直可怕地骚扰着咱们的家族。我所以要把它写下来，还因为我觉得：随便听到的东西和猜测的东西要比知道得清清楚楚的东西可怕得多。不可否认，在咱家的人里，有许多都是未得善终的，死得突然、凄惨而又神秘。但愿能得上帝无边慈爱的庇护，不致降罚于我等三代以至四代唯圣经是听的人们。我的儿子们，我借上帝之名命令你们，并且劝你们要多加小心，千万要避免在黑夜降临、罪恶势力嚣张的时候走过沼地。\n\n“〔这是修果·巴斯克维尔［此修果·巴斯克维尔为这篇家书开头所提到之修果·巴斯克维尔之同名后代。——译者注］留给两个儿子罗杰和约翰的家书，并敦嘱二人万勿将此事告知其姊伊莉莎白。〕”\n\n
