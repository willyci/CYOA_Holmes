hed panting at my knee. \n\nI threw the blanket over its head, snapped the lead onto its collar, and led it swiftly back across the bog into the black sanctuary of the Grimpen Mire.\n\nNot a single tooth had touched his skin. Not a drop of blood had been spilled. A clean, undetectable execution! The coroner would find nothing save natural heart failure; the superstitious locals would whisper of the curse; and the first of the two lives standing between myself and seven hundred and forty thousand pounds was extinguished forever!", "is_ending": false, "clues": ["Sir Charles waited 20 minutes smoking at the gate expecting Laura Lyons", "The phosphorescent hound was unleashed; Sir Charles fled in terminal cardiac panic", "The hound was recalled into the mire, leaving only footprints twenty yards away"], "choices": [{"id": "s_ch2_p2_c1", "text": "Plan the London expedition to eliminate the new Canadian heir, Sir Henry Baskerville.", "target": "stapleton_ch03_new_heir", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch2_p2_c2", "text": "[Switch POV to Sherlock Holmes] View Holmes receiving the case from Dr. Mortimer.", "target": "holmes_ch01_part2_consultation", "pov_switch": "holmes", "pov_switch_name": "Sherlock Holmes"}]}, "stapleton_ch03_new_heir": {"id": "stapleton_ch03_new_heir", "title": "Chapter 3: The Threat from Canada (The Obstacle to the £740,000 Estate)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "The coroner’s inquest at Widecombe proceeded with the blind, bovine predictability that I had counted upon. The jury of rustic dunderheads listened to the medical evidence of Dr. Mortimer, stared at the diagrams of the yew alley, nodded their solemn wigs, and brought in a unanimous verdict: death from natural causes, due to long-standing cardiac disease. Mortimer, obsessed with his craniological measurements and terrified of igniting a county-wide panic, kept his mouth shut concerning the giant footprint in the peat twenty yards from the body. The local sheets praised the deceased baronet for his benevolence, and within a fortnight the world had buried Sir Charles Baskerville and moved on.\n\nI believed the prize was in my hands. I had only to wait a decent interval, bring forward my birth certificates from Costa Rica, establish my descent from Rodger Baskerville, and claim the estate as the next of kin. \n\nAnd then, on the morning of October 8th, a thunderbolt struck.\n\nThe Western Morning News carried an announcement that turned my blood to gall. Messrs. Gautier and Brown, the family solicitors in London, had established communication through the High Commissioner for Canada with a direct heir: Sir Henry Baskerville! The young man was the son of my father’s elder brother, the middle brother who had died in America thirty years before. He was young, thirty years of age, robust as a pine tree, and had spent his youth clearing timber and cattle-farming near Lake Superior. He had already taken passage upon the transatlantic steamship RMS Etruria, was due to land at Southampton within the week, and intended to take immediate possession of Baskerville Hall!\n\nMy rage in the solitude of my study was so violent that I smashed my microscope against the stone hearth! \n\nWas I to be cheated at the very threshold of paradise? Had I braved the gallows, lived for months on the edge of a pestilential bog, and stained my soul with my uncle’s blood, only to see the seven hundred and forty thousand pounds handed to an illiterate colonial clodhopper?\n\nNever! Not while breath remained in my body!\n\nA second blow was imperative, and it must be struck without mercy. But to repeat the tragedy upon Dartmoor immediately after Sir Henry’s arrival was out of the question. Even the dullest constables in Devonshire would smell foul play if two successive heirs dropped dead at the gates of the Hall within five months. The assassination must take place in London—in that vast, indifferent labyrinth of four million souls, where street accidents, river drownings, and drunken affrays are buried beneath tomorrow’s newspapers!\n\nI acted with lightning speed. I took fifty pounds of horse-flesh across the mire to my island, securing the hound with extra chains and water enough for a fortnight. I packed two valises, purchased an adhesive black beard and heavy tinted spectacles from a theatrical costumier in Exeter, and dragged Beryl with me to the railway station.\n\nShe guessed my intent. On the train to London, she knelt upon the floor of our first-class compartment, weeping, clinging to my knees, begging me to renounce the inheritance and fly with her to South America.\n\nI seized her throat with my left hand and forced her head back against the carriage cushions until her lips turned blue.\n\n“Listen to me, Beryl,” I hissed, smiling into her terror-stricken eyes. “If you breathe one word to a living soul—if you drop one hint that I am not Jack Stapleton, or that you are my wife—I will not merely send your handsome Canadian cousin to his grave. I will bring you back to the mire, strip you naked, and chain you to the post inside the smelting shed with the hound!”\n\nShe fainted in my hands. When we reached Waterloo, I took modest lodgings in a quiet street in St. John’s Wood under the name of Vandeleur. Within twenty-four hours, my inquiries had located Sir Henry Baskerville and Dr. Mortimer at the Northumberland Hotel in the Strand. The quarry was in London, and the hunter had closed the ring!", "is_ending": false, "clues": ["Sir Henry Baskerville is summoned from Canada as sole heir to the estate", "Stapleton travels to London under an alias to shadow and eliminate Sir Henry", "Beryl is forced to accompany him, watched day and night under constant surveillance"], "choices": [{"id": "s_ch3_c1", "text": "Shadow Sir Henry to the Northumberland Hotel and secure an agent within the staff.", "target": "stapleton_ch04_part1_hotel_shadow", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch3_c2", "text": "[Switch POV to Dr. Watson] View Watson discussing the Dartmoor problem with Holmes at 221B.", "target": "ch03_problem", "pov_switch": "watson", "pov_switch_name": "Dr. John H. Watson"}]}, "stapleton_ch04_part1_hotel_shadow": {"id": "stapleton_ch04_part1_hotel_shadow", "title": "Chapter 4: Sir Henry Baskerville (Part I: Shadows at the Northumberland Hotel)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "anchor", "anchor_name": "anchor_london_shadow_stapleton", "content": "On the evening of October 12th, returning to our lodgings in St. John’s Wood after reconnoitering the Strand, I stepped into the parlour to find Beryl crouched upon the hearth-rug in an attitude of guilty panic. Beside her lay a discarded copy of yesterday’s Times, its leading article disfigured by gaping, razor-cut holes, and a pair of curved nail-scissors still gripped in her trembling fingers.\n\nMy eye fell upon the gum-pot and the slips of printed paper scattered across the mahogany table.\n\nA snarling oath broke from my lips! I crossed the room in two strides, gripped her long hair, and dragged her to her knees.\n\n“What have you done, you wretched traitress?” I hissed, shaking her until her teeth rattled.\n\n“I warned him!” she gasped through a torrent of weeping. “I pasted the words upon an envelope and posted it to the Northumberland Hotel! I told him to keep away from Dartmoor! I could not bear the damnation of another murder on our souls, Jack! Strike me if you will, kill me if you dare, but the letter is in the Charing Cross post and beyond your reach!”\n\nA surge of volcanic fury almost drove me to strangle her on the spot. I hurled her against the sofa with a blow that bruised her shoulder. The miserable fool! If Sir Henry took fright at an anonymous scrap of print and fled back to the Canadian backwoods, the estate would slip through my grasp forever! \n\nThere was not a moment to be lost. My hand was forced. If the young fool was not to escape me, I must acquire the means to hunt him down wherever he fled. And to hunt a man with my beast across any terrain, there was one indispensable requirement: a personal article saturated with his living scent.\n\nAt six o’clock the following morning, wearing a dark Inverness cape and tinted spectacles, I entered the bustling lobby of the Northumberland Hotel amidst the confusion of the morning departures. I mounted the rear service stairs to the second floor, where Sir Henry occupied Suite 34. A sleepy Irish chambermaid was sweeping the drugget corridor.\n\nI stepped beside her, dropped my voice to a respectful, confidential murmur, and pressed a golden half-sovereign into her apron pocket.\n\n“My good girl,” said I, smiling with polite deference, “the Canadian gentleman in Room 34 has asked me to take one of his boots to the cobbler in the Strand to have a heel-plate adjusted. He is still asleep, but he left them outside the door to be cleaned. Give me one of them, and this gold is yours for your trouble.”\n\nThe girl’s eyes widened at the sight of the gold coin. She darted to the doorway of Room 34, snatched a boot from the mat, and thrust it beneath my cape.\n\nI hurried down the service staircase, exited through the luggage door into the autumn morning, and walked briskly into the nearest alley off the Strand. With trembling fingers, I drew the boot from beneath my cloak.\n\nA roar of choked, impotent fury burst from my throat!\n\nIt was a brand-new tan boot! The polished calfskin was stiff, pristine, and unstained by a single drop of rain or perspiration! The fool of a Canadian had purchased it in London only the day before and had put it out to be polished for the first time!\n\nAn unworn boot! It was as useless to my hound as a lump of wood! A bloodhound cannot hunt an abstract silhouette of tanned leather; it requires the pungent, acidic odour of human sweat, the oily secretions of living skin ground into the lining by days of vigorous walking!\n\nMy teeth ground together in bitter frustration. The maid’s stupidity had foiled me. But I could not abandon the chase. Sir Henry would soon emerge for breakfast; I would take up my post outside the hotel, trail him into the city, and discover who was advising him and what steps he intended to take next!", "is_ending": false, "clues": ["Beryl secretly composes warning letter using words cut from yesterday’s Times", "Stapleton discovers the betrayal, terrifies Beryl, but the letter is already mailed", "Stapleton bribes chambermaid to steal Sir Henry’s boot to secure his scent"], "choices": [{"id": "s_ch4_p1_c1", "text": "Discover the maid brought an unworn tan boot; trail Sir Henry into Regent Street in a hansom.", "target": "stapleton_ch04_part2_cab_chase", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch4_p1_c2", "text": "[Switch POV to Sherlock Holmes] View Holmes analyzing the cut Times letter at 221B.", "target": "holmes_ch04_part1_warning", "pov_switch": "holmes", "pov_switch_name": "Sherlock Holmes"}]}, "stapleton_ch04_part2_cab_chase": {"id": "stapleton_ch04_part2_cab_chase", "title": "Chapter 4: Sir Henry Baskerville (Part II: The Duel in Regent Street: Cab 2704)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "I applied a thick, bushy black beard of theatrical hair to my chin and upper lip, pressed a soft slouch hat down to the bridge of my nose, and took up my station beneath the colonnade near the corner of Trafalgar Square. \n\nAt a quarter past ten, Sir Henry Baskerville and Dr. Mortimer emerged from the hotel vestibule. They walked briskly up Cockspur Street and turned into Pall Mall, Sir Henry gesticulating with animated Canadian vigor, Mortimer clutching his gold-headed cane. I hailed a passing two-wheeled hansom cab—No. 2704, driven by a burly, red-whiskered fellow named John Clayton.\n\n“Keep those two gentlemen ahead of you at a distance of two hundred yards,” I instructed, tossing him a half-sovereign through the trap in the roof. “Do not overtake them, and follow them wherever they lead.”\n\nWe crawled into Regent Street amidst the thick press of morning traffic. For twenty minutes, the stalk proceeded with mathematical perfection. My quarry walked along the eastern pavement, pausing occasionally to admire the shopfronts. I leaned back into the dark corner of the hansom, my pulse steady, congratulating myself upon my surveillance. Mortimer was evidently escorting the young heir to a consultation with a man of business. But who?\n\nSuddenly, a cold shock of sheer, paralyzing horror stopped the breath in my lungs!\n\nWalking briskly along the opposite pavement, twenty paces behind Sir Henry, were two men whose appearance struck me like a blow between the eyes. One was a sturdy, military gentleman with an upright carriage and a brown moustache—Dr. John H. Watson. And beside him, tall, gaunt, wrapped in an ulster coat, his hawk-like, aquiline profile unmistakable to any educated man in Europe, was Sherlock Holmes!\n\nMortimer had brought the foremost intellect in the world into the arena!\n\nAt that very fraction of a second, as though drawn by a psychic needle of danger, Holmes turned his head sharply towards the roadway. His piercing, grey eyes bored straight through the glass window of my hansom! For one dreadful, eternal heartbeat, our gazes collided across the crowded street! He had seen my face; he had recognized that the two gentlemen were being stalked!\n\n“Drive!” I roared through the roof-trap, ramming the ferrule of my cane into the cabman’s back. “Drive like the devil to Waterloo! A full sovereign if you shake them off!”\n\nClayton’s whip cracked like a pistol shot over the horse’s flank! The hansom leaped forward with a violent lurch, throwing me against the cushions! We tore down Regent Street, cutting recklessly through the line of omnibuses, scattering pedestrian crossing-sweepers, with Holmes sprinting in our wake along the pavement! We careened into Waterloo Place, rocketed across Westminster Bridge through the swirling river mists, and screeched to a halt amidst the deafening roar and steam of Waterloo station.\n\nI leaped from the cab before the wheels had ceased turning. I pulled two golden sovereigns from my purse and slapped them into Clayton’s astonished palm.\n\n“You drove like a champion, cabby,” said I, leaning close, my mouth twisting in an insolent, mocking grin. “And if a tall, sharp-eyed gentleman should ask you who your fare was, tell him: My name is Mr. Sherlock Holmes, and don’t you forget it!”\n\nI plunged into the roaring, soot-filled labyrinth of the railway platforms, ducked through the luggage tunnel, and emerged into the southern streets, vanishing like smoke into the London fog. \n\nI had cheeked the great detective to his face! I had thrown his own name in his teeth! Yet as I walked through the damp alleys, my hands were shaking with cold adrenaline. The mask of provincial obscurity was shattered. Sherlock Holmes was in the game! The contest had become a mortal duel between the finest brain of the law and the finest brain of crime!", "is_ending": false, "clues": ["Stapleton hires cab No. 2704 disguised with adhesive black beard and dark glasses", "Sherlock Holmes spots him; Stapleton escapes and brazenly uses Holmes’s own name"], "choices": [{"id": "s_ch4_p2_c1", "text": "Return to the hotel corridor to steal Sir Henry’s worn black boot and flee to Devon.", "target": "stapleton_ch05_black_boot", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch4_p2_c2", "text": "[Switch POV to Sherlock Holmes] View Holmes receiving the report from cabman Clayton.", "target": "holmes_ch05_threads", "pov_switch": "holmes", "pov_switch_name": "Sherlock Holmes"}]}, "stapleton_ch05_black_boot": {"id": "stapleton_ch05_black_boot", "title": "Chapter 5: Three Broken Threads (Securing the Old Black Boot)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "anchor", "anchor_name": "anchor_arrival_stapleton", "content": "The encounter in Regent Street would have driven an ordinary conspirator into blind panic, sending him fleeing on the first packet-boat to the Continent. But my intellect operates with the cold precision of a mathematical instrument under pressure. I knew that Holmes would spend the afternoon questioning cabman Clayton and chasing down district messenger boys. The Northumberland Hotel, having already been inspected, would be the very last place where he would anticipate my return!\n\nAt two o’clock, having shaved off my theatrical beard and discarded my tinted glasses, I walked calmly through the side entrance of the Northumberland Hotel in the guise of a quiet tourist returning to his room.\n\nI ascended to the second-floor corridor. Sir Henry and Dr. Mortimer were absent, locked in earnest consultation in Baker Street. I slipped that useless, scentless tan boot beneath a wicker arm-chair in the corner of the corridor to divert suspicion. And then, glancing down at the mat outside Room 34, my patience was rewarded by the gods of fortune!\n\nThere, placed upon the drugget to be cleaned by the boots, stood a pair of worn black boots! The leather was supple and creased by months of walking; the heels were worn down at the outer edge; and the welts and soles were heavily caked with the dried red mud of Canadian pastures!\n\nI snatched one of the black boots, jammed it beneath the breast of my heavy overcoat, and walked calmly down the grand staircase and out the revolving front doors into the Strand.\n\nI had it! The master key to Sir Henry’s life! A boot soaked through with the living, pungent essence of his sweat, carrying the unique chemical signature of his bloodstream! With this talisman, my starved demon could track the Canadian baronet across twenty miles of wind-swept moor and never lose the scent for an instant!\n\nThat evening, my private surveillance outside 221B Baker Street bore a second piece of priceless fruit: a porter at Paddington station, bribed by my telegram, confirmed that Sir Henry Baskerville and Dr. Watson had booked first-class tickets for the 10:30 express to Devonshire for the following Saturday. But of Sherlock Holmes, there was no mention! The great detective was remaining behind in London to attend to other pressing cases!\n\nI laughed aloud in the shadows of the platform until a passing constable glanced at me in suspicion. \n\nHolmes was not coming! He was sending his sheep to the slaughter under the sole protection of a blundering army doctor! Against Sherlock Holmes, the struggle would have been a razor-edge gamble; against Dr. John Watson, the good-natured, literal-minded veteran of Maiwand, it would be child’s play!\n\nI returned to St. John’s Wood, packed our bags, and dragged Beryl to Paddington. We took the midnight mail train westward, and by sunrise on October 14th we were back in the bleak seclusion of Merripit House.\n\nWithout removing my traveling coat, I took the muddy black boot straight across the secret stepping-stones to the mire island. I unlocked the smelting shed. The hound sprang towards me, rattling its chains. I thrust the boot directly beneath its quivering, black nostrils.\n\nThe creature snorted, inhaled deeply, and its yellow eyes narrowed to slits of murderous recognition. A deep, slobbering whimper of bloodlust rattled in its throat. It tasted the man; it memorized the prey.\n\nThe trap was sprung. Sir Henry Baskerville was walking straight into the jaws of eternity!", "is_ending": false, "clues": ["Stapleton returns the new tan boot and successfully steals Sir Henry’s old black boot", "Learns Holmes declined to go to Devon, sending only Dr. Watson as bodyguard", "Returns triumphant to Merripit House to prepare the hound with the fatal scent"], "choices": [{"id": "s_ch5_c1", "text": "Take position upon the ridge overlooking the moor road to watch Sir Henry’s arrival.", "target": "stapleton_ch06_part1_arrival_watch", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch5_c2", "text": "[Switch POV to Dr. Watson] View Watson traveling west on the express to Devonshire.", "target": "ch06_part1_arrival", "pov_switch": "watson", "pov_switch_name": "Dr. John H. Watson"}]}, "stapleton_ch06_part1_arrival_watch": {"id": "stapleton_ch06_part1_arrival_watch", "title": "Chapter 6: Baskerville Hall (Part I: The Arrival of the Quarry)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "anchor", "anchor_name": "anchor_arrival_moor_stapleton", "content": "On the afternoon of October 15th, I took up my station upon the high granite crest of Belliver Tor, pressing my brass pocket telescope against the rough lichen of a boulder to steady my hands. The autumn sky was a sullen vault of leaden grey, and a piercing, damp wind blew out of the Atlantic, flattening the brown heather and howling through the granite clefts. \n\nFar down the Bovey valley, where the white ribbon of the highroad wound through the moorland, a drifting plume of dust announced the approach of the wagonette from Coombe Tracey station.\n\nI adjusted the brass draw-tubes until the vehicle sprang into sharp focus. \n\nThere, perched upon the high rear seat, was young Sir Henry Baskerville. He had discarded his London bowler for a traveling cap and was wrapped to the chin in a heavy, Canadian fur-trimmed ulster. His dark, alert eyes scanned the desolate waste with an expression of youthful wonder and awe, drunk with the romantic grandeur of entering his ancestral kingdom. Beside him sat Dr. John Watson, rigid, vigilant, his square jaw thrust forward, his right hand resting conspicuously inside the flap of his tweed overcoat pocket—where, beyond any shadow of a doubt, his service Webley revolver lay cocked and ready for action. And flanking the horses, trotting upon two sturdy moorland cobs, were two mounted county constables in dark blue tunics, their Lee-Metford carbines resting across their saddlebows, their eyes roving nervously over every peat-hagg and gorse-clump!\n\nA comical escort! What pathetic, childish vanity! As though a lead bullet or a pair of village bobbies could ward off a demonic incarnation of hell-fire and ancient darkness!\n\nYet the presence of those carbines had a specific, sinister significance which I had already learned from the postman that morning: Selden, the Notting Hill murderer, had burrowed out of the granite fortress at Princetown three nights earlier and was starving among the tors! The authorities had flooded the highroad with armed patrols, and every farmer on the moor was bolting his shutters before sundown.\n\nA delicious complication! What could be more opportune for my designs? If an escaped cutthroat was known to be prowling the wastes with a butcher’s knife, every sudden death, every scream in the night, every mangled corpse discovered among the rocks would instantly and inevitably be laid at the convict’s door! The police would scour the heather for a wild human beast, while my phantom completed its bloody work unmolested!\n\nThe wagonette turned through the moss-grown granite piers of Baskerville Hall. The ancient, wrought-iron gates groaned upon their rusty hinges and clanged shut behind them.\n\nThe sheep was in the pen! Sir Henry was now cut off from the civilized world by twenty miles of untamed, treacherous wilderness, with only a credulous, blundering army doctor to stand between his throat and my waiting beast!\n\nA predatory thrill, cold and intoxicating, pulsed through my veins. The golden hoard of Sir Charles seemed already glittering beneath my touch. I collapsed my telescope, thrust it into my pocket, and hastened down the rocky slope towards Merripit House to ensure that my domestic prisoner was broken to the harness before the game began!", "is_ending": false, "clues": ["Sir Henry and Dr. Watson arrive under armed police escort due to Selden’s prison break", "Stapleton spots the Escaped Convict Selden factor as a chaotic wildcard"], "choices": [{"id": "s_ch6_p1_c1", "text": "Return to Merripit House and brutally terrorize Beryl into absolute submission.", "target": "stapleton_ch06_part2_beryl_chains", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch6_p1_c2", "text": "[Switch POV to Sherlock Holmes] View Holmes observing the wagonette from the Black Tor hut.", "target": "holmes_ch06_part2_hut_surveillance", "pov_switch": "holmes", "pov_switch_name": "Sherlock Holmes"}]}, "stapleton_ch06_part2_beryl_chains": {"id": "stapleton_ch06_part2_beryl_chains", "title": "Chapter 6: Baskerville Hall (Part II: The Tyrant of Merripit House)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "I entered Merripit House through the stone-flagged scullery. The cottage was bitter cold, reeking of damp lime-wash and the sharp, peach-blossom odour of potassium cyanide from the killing jars lining my specimen shelves.\n\nIn the sitting-room, Beryl stood motionless by the mullioned window, her forehead pressed against the cold glass, staring across the wasteland towards the distant, twin towers of Baskerville Hall. When my boot scraped upon the threshold, she started violently, spinning round like a trapped bird, her exquisite Spanish face drained of all colour.\n\n“He is at the Hall,” I said calmly, stepping inside and locking the oak door behind me with a deliberate, metallic click. I dropped the heavy key into my waistcoat pocket.\n\nShe backed away until her shoulders struck the plaster wall, her dark, lustrous eyes wide with terror. “Jack... in the name of the God whose cross you wear, I beseech you! Abandon this horror! Let this boy live! He is young; he has never lifted a finger against you! We have our savings; take me away from this desolate swamp! Take me back to Costa Rica, where we may walk in the sunshine without blood upon our hands!”\n\nI crossed the room in two strides. Before she could raise her arms, my right hand clamped around her slender throat like a steel vise, forcing her down into the high-backed horsehair chair until her breathing came in desperate, suffocating gasps.\n\n“Listen to me, my pious little fool,” I whispered, leaning my face so close that my glasses touched her temple. “In London, you dared to cut my newspapers and send an anonymous warning to Sir Henry. I did not kill you then because your face is the only magnet that can draw the young fool across the moor to his destruction. But hear me now, Beryl, and let every syllable burn into your memory: we are not in London now! There are no police within five miles, no neighbours within two leagues, and the Great Grimpen Mire is thirty yards from our back door!”\n\nTears of physical agony and despair leaked from her tightly squeezed eyelids.\n\n“If you whisper one syllable to Sir Henry when he visits this house—if by word, look, or gesture you hint that you are my lawful wife and not my maiden sister—I will not merely send your handsome young baronet to his grave. I will drag you across the stepping-stones in the dead of night, bind you to the iron ring in the floor of the smelting shed, and leave you in the dark with the starving beast! Do you understand me, Beryl?”\n\nI loosened my grip slightly. She slid from the horsehair cushions onto the floor, trembling convulsively from head to foot, burying her face against the hem of my trousers, weeping in broken, animal terror.\n\n“I will be silent!” she sobbed, her voice muffled in the cloth. “God forgive me, I will be silent! I will say nothing—nothing!”\n\n“See that you remember it,” I said coldly, stepping over her prostrate body. “Tomorrow morning, Dr. Watson will undoubtedly walk out to survey the moorland topography. I shall take my green gauze net and intercept him near the mire. A garrulous, enthusiastic country naturalist—the very model of an unworldly eccentric! An honest, thick-headed army surgeon will take me into his confidence within ten minutes. And once I have Watson under my thumb, Sir Henry will walk straight into our parlour!”\n\nI unlocked the door, walked into my study, and began laying out the pins and corkboards for tomorrow’s catch. The web was spun; the spider was poised for the feast!", "is_ending": false, "clues": ["Stapleton violently threatens Beryl with the hound if she speaks to Sir Henry", "Beryl is kept prisoner in the lonely house surrounded by the deadly bog"], "choices": [{"id": "s_ch6_p2_c1", "text": "Stroll onto the moor with butterfly net to intercept Watson and evaluate his intellect.", "target": "stapleton_ch07_part1_naturalist_act", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch6_p2_c2", "text": "Prepare the hound’s feeding schedule on the mire island for the coming night.", "target": "stapleton_ch07_part1_naturalist_act", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_ch07_part1_naturalist_act": {"id": "stapleton_ch07_part1_naturalist_act", "title": "Chapter 7: The Stapletons of Merripit House (Part I: The Mask of the Naturalist)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "anchor", "anchor_name": "anchor_naturalist_stapleton", "content": "The morning of October 16th broke with a pale, watery brilliance, the autumn sun glistening upon the miles of wet heather. Equipped with my green gauze butterfly net, my zinc specimen box strapped across my shoulder, and an old tweed Norfolk jacket that lent me the air of an eccentric academic, I strolled along the cart-track that led from Merripit House towards the Hall.\n\nWithin half an hour, my patience was rewarded. The square, sturdy silhouette of Dr. John Watson appeared upon the crest of the hill, walking at a brisk military pace, his briar pipe sending a blue spiral of smoke into the clear air, his eyes roving over the undulating moorland.\n\nI quickened my pace, cutting across a patch of bilberry scrub, waving my hat with the uninhibited, bustling enthusiasm of an isolated country enthusiast starved for cultivated conversation.\n\n“Dr. Watson, I presume!” I hailed him in a high, cheerful voice. “Pray forgive the lack of rural ceremony, but when a man lives on the borders of the Great Grimpen Mire, he dispenses with the formalities of St. James’s! I am Jack Stapleton, of Merripit House.”\n\nThe honest soldier stopped, removed his pipe, and greeted me with that frank, open warmth which makes an English gentleman so easy to manipulate. In five minutes, I had him completely disarmed. I chatted with boyish animation about the rare orchids hiding in the peat-hags, pointed out the ancient circular stone huts of the Neolithic tribesmen clinging to the tors, and lamented with grave, melancholy deference the untimely death of our mutual friend, poor Sir Charles.\n\nSuddenly, as we stood upon a low granite knoll overlooking the emerald expanse of the Great Grimpen Mire, a sound tore through the quiet air—a wild, agonized scream that rose into a bubbling gurgle!\n\nTwenty yards away, a small Dartmoor pony, venturing onto the deceptive green turf in search of fresh bog-cotton, had broken through the crust! The black, oily slime was already up to its withers. It threw back its shaggy head, its eyes rolling in terror, thrashing frantically with its forelegs; but with every convulsive movement, the subterranean suction dragged it deeper, faster!\n\nI gripped Watson’s arm with my hand, pointing my butterfly net towards the tragedy.\n\n“Look, Dr. Watson!” I cried, my voice dropping to a tense, dramatic whisper. “The Great Grimpen Mire! It is a quicksand of bottomless depth! A misstep of six inches from the firm path, and a man or beast is sucked into the bowels of the earth! That pony will be dead within two minutes!”\n\nWatson stood frozen, his face pale with horror, watching the animal’s muzzle vanish beneath the bubbling, iridescent slime. A foul belch of swamp gas broke the surface, and the green moss closed smoothly over the spot, leaving not a ripple behind.\n\nThe demonstration was sublime! The horror of the moor was burned into the good doctor’s soul. He would never venture onto the bog alone, nor would he allow Sir Henry to wander from the beaten track without a shudder of dread!\n\nThen, while his guard was lowered by the shock, I dropped my probe—smooth, casual, and delivered with an air of innocent curiosity:\n\n“We were all grievously disappointed down here that Mr. Sherlock Holmes was unable to accompany Sir Henry. May we hope to see that illustrious gentleman visit Devonshire before the season ends?”\n\nWatson smiled with modest, professional pride. “His hands are completely tied by an affair of international importance in London. For the present, the safety of Sir Henry Baskerville rests entirely in my hands.”\n\nEntirely in your hands! \n\nI had to drop my gaze to the heather and feign a sudden sneeze to conceal the triumphant grin that twitched at the corners of my mouth! The great detective was safely bottled up in London! The game was ours to play, and the prize was within my grasp!", "is_ending": false, "clues": ["Stapleton charms Watson with eccentric naturalist persona near Grimpen Mire", "Demonstrates pony swallowed in mire to establish bog’s terrifying lethality", "Inquires about Sherlock Holmes to confirm the great detective is truly in London"], "choices": [{"id": "s_ch7_p1_c1", "text": "Pursue a cyclopides moth into the heather, leaving Watson to encounter Beryl.", "target": "stapleton_ch07_part2_beryl_blunder", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch7_p1_c2", "text": "[Switch POV to Dr. Watson] View Watson’s first encounter with Stapleton upon the moor.", "target": "ch07_part1_naturalist", "pov_switch": "watson", "pov_switch_name": "Dr. John H. Watson"}]}, "stapleton_ch07_part2_beryl_blunder": {"id": "stapleton_ch07_part2_beryl_blunder", "title": "Chapter 7: The Stapletons of Merripit House (Part II: The Blunder on the Path)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "I feigned a sudden, ecstatic burst of scientific passion, pointing my butterfly net towards a tiny fluttering speck of grey among the heather.\n\n“A cyclopides!” I shouted with the frenzy of an enthusiast. “A rare skipper moth, long believed extinct in the southwest! Pray excuse me, Dr. Watson—it must not escape!”\n\nI plunged headlong into the bilberry bushes, leaping across the peat-rifts, swinging my net with comical exaggeration until I had put two granite knolls between Watson and myself. \n\nMy sprint was a calculated diversion. I wished to double back under the cover of the rocks and observe the good doctor’s unguarded demeanour through my field-glass. But as I scrambled to the summit of the ridge, the sight that greeted my eyes struck my heart like an icy spear!\n\nBeryl! \n\nThe miserable, defiant creature had slipped from the house and was running breathless across the moor, her black Spanish mantilla trailing in the wind! \n\nThrough the gaps in the gorse, I watched her rush up to Dr. Watson. Her face was flushed with passionate agitation, her dark eyes flashing with terror and desperate appeal! Even across three hundred yards of moorland air, her pantomime was unmistakable: she was grasping the doctor’s coat sleeve, gesturing violently towards the south, commanding him to turn back, to quit Dartmoor, to flee for his life to London that very day! \n\nThe blind idiot had mistaken Watson’s square-shouldered, tweed-clad figure for Sir Henry Baskerville!\n\nMy fingers clenched around the bamboo cane of my net until the wood groaked and split in my palm. One word of the hound—one whisper of our true marriage—and the hangman’s rope would be around my neck before Sunday!\n\nI did not hesitate for a heartbeat. I leaped from behind the boulders, swinging my net aloft, whistling a jaunty air from Carmen as though returning triumphant from my chase.\n\n“Halloa, Beryl!” I hailed them, descending the slope with bounding, cheerful strides. “What brings you out upon the heath in this raw autumn wind?”\n\nThe transformation was instantaneous. She stiffened as though an electric current had shot down her spine. She stepped back from Watson in guilty haste, her lips blanching, her face freezing into that marble, expressionless mask she always wore when the whip was raised over her head.\n\n“I was out walking, Jack,” she stammered, her voice shaking with suppressed terror. “And I... I was admiring the moorland views with this gentleman.”\n\nI laughed—a rich, hearty, indulgent laugh that resonated with brotherly affection.\n\n“You must forgive my sister’s eccentricities, Dr. Watson!” said I, stepping between them and clapping Watson on the shoulder with easy familiarity. “She is a delicate plant from sunny climes, and this gloomy Devonshire moor terrifies her nervous constitution. The tragic fate of poor Sir Charles has completely unstrung her imagination. Come, Dr. Watson! You must not return to the Hall without tasting our hospitality. Walk back with us to Merripit House; Beryl shall make you a cup of genuine Costa Rican coffee, and I shall show you my cabinet of Dartmoor Lepidoptera!”\n\nWatson was utterly enchanted by my geniality. The suspicion planted by Beryl’s frantic warnings dissolved like morning mist before my polished, sunny charm.\n\nYet as we walked three abreast down the narrow sheep-track, my nails dug into the palms of my clenched fists until blood welled beneath the skin. \n\nBeryl’s defiance had ceased to be an annoyance; it had become an acute, mortal hazard. Her sentimental conscience was a leaking dam that threatened to drown me at any hour. When the fatal night arrived, words and threats would no longer suffice. She must be gagged, bound to the bedposts with hemp cords, and locked in darkness where no human ear could catch her screams!", "is_ending": false, "clues": ["Beryl secretly ran out to intercept Watson, mistaking him for Sir Henry", "Stapleton catches her, suppresses her with cold sisterly domestic facade", "Realizes Beryl’s rebellious spirit must be crushed before the final strike"], "choices": [{"id": "s_ch7_p2_c1", "text": "Invite Watson and Sir Henry to dine at Merripit House to cement the social trap.", "target": "stapleton_ch08_probing_watson", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch7_p2_c2", "text": "Inspect the hound’s chains and security upon the mire island.", "target": "stapleton_ch08_probing_watson", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_ch08_probing_watson": {"id": "stapleton_ch08_probing_watson", "title": "Chapter 8: First Report of Dr. Watson (Probing the Doctor over Tea)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "The fortnight that followed was a masterclass in social manipulation and psychological camouflage.\n\nI paid a formal call at Baskerville Hall, presenting my compliments to the new master with all the deference of an eccentric, bookish neighbour. Young Sir Henry, suffocating in the gloomy vastness of that ancient granite mausoleum, seized upon my society with transparent, boyish enthusiasm. Within forty-eight hours, the path between the Hall and Merripit House was beaten bare by his boots.\n\nAnd there, beneath my own roof, the second grand engine of my plot began to revolve with intoxicating power: Sir Henry fell head-over-heels, blindly, passionately in love with Beryl!\n\nHe could not tear his eyes from her dark, foreign beauty. Whenever she poured his tea, his hands trembled; whenever she sang a Spanish romance to her guitar, his honest Canadian face glowed with adoration. It was a card of immense strategic value, yet one that required the balance of a tightrope walker over an abyss. If I permitted an open courtship, Sir Henry would propose marriage within a week, whisk her away to a London church, and our true marital status would be unmasked before I had struck the blow!\n\nI resolved the dilemma with a stroke of theatrical genius: I staged a scene of violent, pathological brotherly jealousy!\n\nWhen Sir Henry contrive to meet Beryl upon the moor path near the quarry to declare his love, I sprang from the rocks like a madman. I cursed the baronet, accused him of abusing our hospitality and attempting to dishonor an unprotected maiden, and ordered him from our presence with every insult my tongue could summon!\n\nThe young baronet was bewildered and humiliated, but his Canadian stubbornness was inflamed a hundredfold. Opposition transformed an infatuation into an all-consuming obsession! He called upon me the next day, offered an abject apology for his precipitation, and pledged his sacred honour to keep his distance until I should formally bestow my brotherly consent upon his suit.\n\nI had him completely in my web. He was bound by his own code of chivalry, while Beryl was kept under my immediate surveillance.\n\nMeanwhile, what of the doughty Dr. Watson?\n\nThe good doctor spent his evenings sitting before the roaring hearth at the Hall, his service revolver on the mantlepiece, industriously covering reams of foolscap paper with his observations. Through the daughter of the Grimpen postmaster, who was on terms of intimacy with my kitchen-maid, I learned that Watson was despatching immense packets of manuscript addressed to Mr. Sherlock Holmes at 221B Baker Street twice a week.\n\nLet the fool write! Let him describe the melancholy trees, the crying of the curlews, the suspicious tears of the butler Barrymore, and the blameless eccentricities of Jack Stapleton! While Dr. Watson penned his romance and Sherlock Holmes sat five hundred miles away smoking his pipe by the London fire, the clock was ticking relentlessly down towards the final catastrophe!", "is_ending": false, "clues": ["Sir Henry visits Merripit and falls violently in love with Beryl at first sight", "Stapleton feigns hysterical brotherly jealousy to prevent dangerous intimacy", "Watson writes extensive reports to Baker Street, unaware Holmes is secretly deployed"], "choices": [{"id": "s_ch8_c1", "text": "Sneak into the Great Grimpen Mire at midnight to feed raw meat to the hungry beast.", "target": "stapleton_ch09_part1_feeding_the_hound", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch8_c2", "text": "[Switch POV to Sherlock Holmes] View Holmes in his stone hut reading Watson’s first dispatch.", "target": "holmes_ch08_watson_report", "pov_switch": "holmes", "pov_switch_name": "Sherlock Holmes"}]}, "stapleton_ch09_part1_feeding_the_hound": {"id": "stapleton_ch09_part1_feeding_the_hound", "title": "Chapter 9: The Light upon the Moor (Part I: Feeding the Demon in the Mire)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "anchor", "anchor_name": "anchor_convict_stapleton", "content": "At one o’clock in the morning of October 20th, when the silence of the dead had settled over Merripit House and Beryl was safely locked in her upstairs bedroom, I slipped through the scullery door into the pitch-black fog.\n\nIn my canvas pack, I carried fifteen pounds of raw, dripping butcher’s offal and bullock’s liver, purchased under cover of night from an isolated slaughter-house near Bovey. The midnight traverse of the Great Grimpen Mire was an ordeal that would have driven an ordinary man screaming into madness. The quagmire on either side hissed and gurgled with noxious marsh gases; the foul water bubbled around my waterproof leggings; and a misstep of four inches would have meant sinking into an icy, subterranean grave from which no human hand could drag me forth. But my feet knew every submerged granite block, every tussock of firm rush, with the mechanical instinct of a wolf.\n\nI reached the island knoll and unlocked the heavy padlock on the smelting shed.\n\nThe moment the bolt grated, a sound rumbled from the gloom that set the very marrow of my bones vibrating—a low, rhythmic, thunderous growl of ravenous, untamed fury.\n\nThe beast knew my step.\n\nI lit my storm lantern and hung it upon the iron bracket. In the yellow light, the monster loomed against the stone wall like an apparition from the book of Revelation. Its coat was matted, its flanks lean and hollow with hunger, its fiery yellow eyes fixed upon my canvas sack with a ferocity that strained the heavy iron staples in the granite wall. \n\nI cut the cords and emptied the contents of the sack onto the stone floor.\n\nThe hound threw itself upon the bloody offal with a savage, crunching roar! In the dim shed, the sounds of snapping sinews and fracturing marrow-bones were so sickening, so terrifyingly primal, that even my hardened nerves were tested. While it devoured the meat, I dipped a sponge into a bucket of fresh rain-water, wiped the crusted dried blood from its jowls, and inspected the heavy links of its chain.\n\nWhen the last shred of gristle had disappeared down its throat, the creature threw back its massive, bull-like head, pointed its black muzzle towards the broken rafters of the roof, and gave vent to a long, shuddering, bloodcurdling howl!\n\nIt was a sound that began in a deep, subterranean rumble, rose to a piercing, despairing shriek of ancient malice, and died away in a mournful, sobbing cadence that echoed across the vast, moonlit desert of the moor!\n\nI stood motionless, smiling in the shadows of the shed. I made no effort to silence it.\n\nLet the moor hear the voice of its phantom! Let Sir Henry Baskerville start awake beneath the heavy counterpanes of his bed, clutching his blankets in superstitious terror! Let the ignorant rustics cower by their hearths and cross themselves! Every echo of that demon voice was preparing the public mind—preparing the coroner, the magistrates, and the jury—to accept the heir’s coming death as the inevitable, supernatural vengeance of the Baskerville curse!", "is_ending": false, "clues": ["Stapleton sneaks across the mire at 1 AM to feed blood and meat to the starving hound", "The beast’s muffled baying rolls across the moor, striking terror into the district"], "choices": [{"id": "s_ch9_p1_c1", "text": "Hear gunshots across the granite tors and observe Watson chasing the convict.", "target": "stapleton_ch09_part2_night_alarm", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch9_p1_c2", "text": "[Switch POV to Dr. Watson] View Watson and Sir Henry hunting Selden across the moonlit moor.", "target": "ch09_part2_moor_chase", "pov_switch": "watson", "pov_switch_name": "Dr. John H. Watson"}]}, "stapleton_ch09_part2_night_alarm": {"id": "stapleton_ch09_part2_night_alarm", "title": "Chapter 9: The Light upon the Moor (Part II: Chaos on the Moor)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "I locked the heavy oak door of the shed and picked my way back across the secret stepping-stones. But just as my boots struck the firm, springy heather of the mainland shore, a sound shattered the freezing night air like the snapping of dry pine!\n\nA gunshot!\n\nA sharp, whip-like pistol report, followed instantly by a second crack that echoed off the jagged granite cliffs of Black Tor!\n\nI dropped flat into the deep shadow of a dry peat-hagg, unbuttoning the flap of my revolver holster. Had the Princetown constabulary located my island?\n\nLifting my head above the heather, I scanned the vast, moonlit amphitheater of the waste. High upon the northern plateau, illuminated by the brilliant silver glare of the full moon, three human figures were sprinting across the crags! In the lead, bounding from boulder to boulder like a hunted mountain goat, was a wild, shaggy wretch clad in the mud-stained yellow convict garb—Selden! And fifty yards in his rear, their revolvers flashing in the moonlight, firing wild shots into the dark, ran Sir Henry Baskerville and Dr. Watson!\n\nThey were chasing the convict! The fools had interrupted a midnight rendezvous and were wasting their powder upon a starving wretch!\n\nI watched the pursuit with contemptuous amusement. But then, as my gaze followed the towering black ridge of Black Tor against the silver disc of the moon, my breath stopped dead in my throat!\n\nHigh upon the very pinnacle of the highest crag, standing motionless as a statue carved from basalt rock, was the silhouette of a man!\n\nHe stood with his arms folded across his breast, his head bent forward in an attitude of intense, vigilant scrutiny. His tall, gaunt frame was framed sharply against the pale moonlight; a peaked traveling cap was drawn low over his brow. He looked down upon the valley where Sir Henry ran, watching the hunt like an omniscient bird of prey perched upon its roost.\n\nWho in heaven or hell was he?\n\nIt was not a parish constable. No rustic bumpkin ever stood with that commanding, aristocratic poise. Could it be a confederate of the convict? Or was it... someone infinitely more dangerous?\n\nIn a flash of cold sweat, the memory of Regent Street rushed back upon my mind—the hawk-like profile, the cold, steel-grey eyes that had bored through the glass of cab No. 2704!\n\nCould Sherlock Holmes have deceived the world? Could the great detective have slipped into Devonshire in secret, living upon the open moor like a wild Indian, directing Watson’s movements from the shadows?\n\nAn icy shiver of dread crawled down my spine. If Holmes was upon Dartmoor, the game was a matter of life and death! I must discover who occupied that crag. But before I launched a probe into the tors, my flank had to be secured: Laura Lyons in Coombe Tracey must be muzzled beyond any possibility of betrayal!", "is_ending": false, "clues": ["Watson and Sir Henry hunt Selden across the moonlit granite crags", "Stapleton spots an unknown tall, thin figure standing upon the summit of Black Tor"], "choices": [{"id": "s_ch9_p2_c1", "text": "Visit Laura Lyons at Coombe Tracey to ensure her absolute silence.", "target": "stapleton_ch10_coombe_control", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch9_p2_c2", "text": "Scout the prehistoric huts upon Black Tor to unmask the mysterious watcher.", "target": "stapleton_ch11_part1_spy_on_tor", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_ch10_coombe_control": {"id": "stapleton_ch10_coombe_control", "title": "Chapter 10: Extract from the Diary of Dr. Watson (Muzzling Laura Lyons)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "On the morning of October 22nd, I rode my horse into the market town of Coombe Tracey. A rumour had reached my ears through the village blacksmith that Dr. Watson had been inquiring into the charitable beneficiaries of the late Sir Charles Baskerville.\n\nIf Watson or his invisible master approached Laura Lyons, the entire architecture of my plot was in mortal danger!\n\nI entered her small parlour behind the typing office unannounced. Laura was sitting before her Remington machine, her face pale, her dark hair disheveled. When the door opened and she recognized my figure, she sprang up with a cry of mingled terror and relief, throwing herself against my chest with that suffocating, desperate passion that made my gorge rise.\n\n“Jack!” she wept, clutching my lapels. “Thank God you have come! The doctor from Baskerville Hall was seen speaking to my father’s tenants! If they discover that I wrote to Sir Charles on the very night he died—if they find out about the appointment at the wicket-gate—”\n\nI took her wrists, disengaged her clinging arms, and forced her gently but inexorably back into her chair. I drew up a stool, sat directly before her, and looked into her hazel eyes with an expression of profound, tender reproach.\n\n“Laura, my dearest,” I said softly, smoothing the dark curls from her clammy forehead. “Have you so little faith in the man who has risked everything for your happiness? Do you not understand that my silence—and yours—is the only shield that stands between you and destruction?”\n\nShe stared at me, trembling. “Destruction, Jack?”\n\n“Consider your position before the law!” My voice dropped to the cold, cutting hardness of a scalpel. “You are a destitute, abandoned woman. You wrote a desperate letter to an elderly, wealthy gentleman, begging for a private meeting in the dead of night at an isolated garden gate. You commanded him, upon his honour as a gentleman, to burn the letter. That very night, within minutes of the appointment, Sir Charles dropped dead of heart failure! What will an English jury say if that letter is dragged into the light? They will say you were an accomplice in a scheme of extortion! They will say you lured an old man into the darkness to be frightened into his grave! The barristers will strip your character to ribbons; you will stand in the felon’s dock at Exeter; and you will be condemned as a common criminal!”\n\nA piercing shriek broke from her lips. She buried her face in her hands, her whole body shaking in an agony of convulsive terror.\n\n“I will never speak!” she sobbed through her fingers. “I swear it before Almighty God, Jack! I will die before I utter a word! If the doctor comes, I will deny that I ever wrote a line! I will swear I know nothing of Sir Charles’s death!”\n\n“Good girl,” I whispered, pressing a cold kiss upon her brow. “Keep silent for just one more week. The money for your divorce is almost in my hands. Within seven days, Laura, we shall quit England forever and begin our glorious new life under the southern sun.”\n\nI left her weeping with gratitude and bound in a psychological cage of my own making. But as I mounted my horse and rode out onto the high moor, I knew that time was running out. Watson was sniffing at my heels. The climax could not be delayed another forty-eight hours!", "is_ending": false, "clues": ["Stapleton visits Laura Lyons, renewing false promises of marriage and financial aid", "Warns her that any mention of the burnt letter will ruin her reputation and bring prison"], "choices": [{"id": "s_ch10_c1", "text": "Scout Black Tor with field glass and track the boy delivering supplies to the stone hut.", "target": "stapleton_ch11_part1_spy_on_tor", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch10_c2", "text": "[Switch POV to Sherlock Holmes] View Holmes reading Watson’s diary extract regarding L.L.", "target": "holmes_ch10_diary_and_laura", "pov_switch": "holmes", "pov_switch_name": "Sherlock Holmes"}]}, "stapleton_ch11_part1_spy_on_tor": {"id": "stapleton_ch11_part1_spy_on_tor", "title": "Chapter 11: The Man on the Tor (Part I: The Unknown Watcher on Black Tor)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "anchor", "anchor_name": "anchor_spy_stapleton", "content": "On the afternoon of October 23rd, armed with my powerful naval field glass, I climbed to the jagged summit of High Tor. My target lay a mile to the west: the ancient, ruined British settlement that clustered like honeycombs upon the granite crest of Black Tor.\n\nFor three nights, the memory of that tall, motionless silhouette framed against the moonlit disc of the sky had haunted my sleep with the persistence of an open grave. If that watcher was an agent of Scotland Yard—or worse, if it was the man with the grey eyes from cab No. 2704—my life was hanging by a thread of spider’s silk!\n\nI wedged my body into a cleft of the rock, shielded from the biting northern wind, and leveled the twin brass barrels upon the Neolithic huts. \n\nFor two hours, nothing moved across the desolate waste save the scudding shadows of autumn clouds and a stray sheep grazing among the gorse. Then, at a quarter to four, my patience was rewarded.\n\nMoving along the sheep-track that wound up from the Coombe Tracey road came a small, nimble figure. Through the high-magnification lenses, I brought the intruder into sharp focus: a lad of fourteen, wearing the patched jacket and cloth cap of a London street Arab. Over his shoulder hung a wicker basket, covered with a clean white napkin.\n\nI followed the boy’s progress step by step. He scrambled over the boulders with the agility of a mountain goat, glancing warily to his right and left at every stride, his London street instincts alive to danger. Reaching the high knoll of Black Tor, he made straight for the largest circular hut—the only dwelling whose ancient corbelled granite roof remained partially intact. He ducked beneath the low stone lintel.\n\nFive minutes elapsed. Then the boy emerged. The basket on his arm was empty, but he held a white envelope in his right hand. He thrust the paper into his pocket, leaped down the crags, and sprinted away down the valley towards Coombe Tracey!\n\nThe chain of proof was forged to the final link!\n\nA man was living in that prehistoric hovel! A man who received daily provisions of bread and meat from the market town! A man who despatched written orders to London! A man who lived like a hunted outlaw, enduring the freezing winds of Dartmoor, keeping his very existence a profound secret from Sir Henry Baskerville and Dr. Watson!\n\nWho in the British Empire possessed the iron endurance, the audacity, and the theatrical mania to live in a stone hut on a freezing moor while directing an investigation of murder?\n\nSherlock Holmes!\n\nThe blood drummed against my temples like the hammers of a forge. The master detective had outmaneuvered me! While I had gloated that he was lounging in London, he had been perched like an eagle above my head, studying every step I took, watching every visit to the mire!\n\nThere was no time now for legal subtlety, no time for elaborate financial plots. If Holmes completed his inquiries, he would tie me to Laura Lyons, to the stolen boots, and to the hound within forty-eight hours! The law was closing in, and the shadow of the Exeter gallows fell dark across my path!\n\nI must strike Sir Henry down tonight! Once the heir was dead, the direct line of Baskerville was extinct. I would present my claims through South American agents, seize the seven hundred and forty thousand pounds, and vanish across the Atlantic before Holmes could assemble his proofs!\n\nI shut my glass, scrambled down the rocky slope, and made straight across the bog for the island of the beast!", "is_ending": false, "clues": ["Stapleton spots young boy Cartwright delivering food parcels to Neolithic huts on Black Tor", "Confirms a secret operative is camping upon the moor observing his movements"], "choices": [{"id": "s_ch11_p1_c1", "text": "Hasten to the mire island and lay Sir Henry’s stolen black boot before the hound.", "target": "stapleton_ch11_part2_setting_scent", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch11_p1_c2", "text": "[Switch POV to Dr. Watson] View Watson cornering Laura Lyons in Coombe Tracey.", "target": "ch11_part1_lyons", "pov_switch": "watson", "pov_switch_name": "Dr. John H. Watson"}]}, "stapleton_ch11_part2_setting_scent": {"id": "stapleton_ch11_part2_setting_scent", "title": "Chapter 11: The Man on the Tor (Part II: Laying the Fatal Scent)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "I entered the rotting timber shed upon the mire island, my face set like a slab of Dartmoor granite.\n\nFor forty-eight hours, I had deliberately denied the hound a single scrap of meat or water. The creature had been driven to the outer frontiers of starvation. When it heard my key rattle in the iron padlock, it hurled its massive body against the chains with an explosion of famished fury that threatened to pull the iron ringbolts from the stone foundation! Yellow foam flecked its black dewlaps; its bloodshot eyes glowed with murderous madness; and its breath whistled through its bared fangs in dry, choking gasps.\n\nFrom my oilskin satchel, I drew forth the talisman of death: Sir Henry Baskerville’s worn black boot, stolen from the Northumberland Hotel in the Strand.\n\nI approached the snarling brute, speaking in that low, harsh hiss that had signaled every blood-kill since its puppyhood. I held the mud-encrusted leather directly beneath its quivering, black nostrils. I pressed the worn heel between its jaws, forcing it to bite the stiffened calfskin, to lick the dried perspiration, to inhale the oily, animal odour of the Canadian’s living skin until its brain was intoxicated by the scent!\n\nThe effect was instantaneous and terrifying!\n\nThe beast let out a deep, strangling moan of recognition. Its tail whipped like an iron rod against the flagstones; its neck muscles swelled as it inhaled the trail; its claws dug frenzied furrows into the dirt. It knew its quarry! It understood that this was the living flesh that would slake the torment of its belly!\n\nSetting the boot upon the stone shelf, I took up my jar of white phosphorus preparation. With rapid, merciless sweeps of my hog’s-bristle brush, I coated the beast for its final flight. \n\nI painted the cold, luminous venom around its gaping sockets until its eyes seemed to smoulder with volcanic brimstone. I dragged the brush along the serrated edges of its teeth, over its black, slobbering lips, and down the deep creases of its throat and chest.\n\nOutside the shed, twilight had dissolved into an ocean of rolling, clammy white moorland fog. The freezing wind shrieked through the gaps in the slate roof.\n\nI stepped to the iron collar, gripped the brass release catch, and snapped the bolt!\n\n“Kill!” I snarled, pointing through the open door into the gathering night. “Hunt him down and tear his throat!”\n\nThe monster erupted into the fog like a thunderbolt hurled from the abyss! \n\nA streak of roaring green and bluish flame, it bounded across the black quagmire, its giant paws skimming over the treacherous slime, vanishing into the swirling white vapour in the direction of the high tor!\n\nI stepped out upon the threshold of the shed, shivering with predatory ecstasy, my head cocked towards the crags, waiting for the screams of agony that would announce my victory to the stars!", "is_ending": false, "clues": ["Stapleton starves the beast and rubs Sir Henry’s worn black boot across its jaws", "Prepares to release the hound into the darkness to slaughter the baronet"], "choices": [{"id": "s_ch11_p2_c1", "text": "Unleash the hound into the foggy night and listen for the slaughter upon the crags.", "target": "stapleton_ch12_part1_screams_on_crags", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch11_p2_c2", "text": "[Switch POV to Sherlock Holmes] View Holmes revealing Stapleton’s identity to Watson.", "target": "holmes_ch11_part2_stone_hut", "pov_switch": "holmes", "pov_switch_name": "Sherlock Holmes"}]}, "stapleton_ch12_part1_screams_on_crags": {"id": "stapleton_ch12_part1_screams_on_crags", "title": "Chapter 12: Death on the Moor (Part I: The Hound Unleashed)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "anchor", "anchor_name": "anchor_screams_stapleton", "content": "I followed the fiery trail of the beast at a distance of three hundred yards, moving across the heather with the swift, silent stealth of a panther, my unlit dark-lantern clutched in my left hand.\n\nThe autumn fog had rolled into every valley and depression, turning the hollows into lakes of swirling white vapour from which the black granite tor-crests rose like jagged islands in an arctic sea. The silence was absolute, broken only by the whistling of the freezing wind through the gorse.\n\nThen, echoing off the vertical cliffs of Black Tor, the baying began!\n\nIt was a sound to freeze the blood of the bravest soldier—a deep, rolling, hollow roar that reverberated through the granite tors like subterranean thunder! The hound was in full cry! It had struck the scent! It was coursing across the high stony plateau at the speed of a racehorse!\n\nI broke into a dead run, my boots tearing through the bilberry scrub, my breath coming in short, exultant gasps.\n\nSuddenly, high upon the crags half a mile to my right, a human voice shrieked aloud into the night—a piercing cry of mortal agony and despair that rent the freezing air!\n\n“Help! Help! For God’s sake, help!”\n\nThe scream was choked off by a savage, frenzied snarling of iron jaws and the dull thud of heavy paws bounding across the turf! A wild scramble of feet echoed across the shale—the frantic, blind flight of a hunted man running for his life along the razor-edge of a sheer granite precipice!\n\nA second shriek tore through the mist, rising to a dreadful, blood-chilling crescendo:\n\n“No! Keep off! Oh, God—ahhhhh!”\n\nThen came a sound that turned my triumph into ice—a sickening, splintering crash at the foot of the fifty-foot cliff! The heavy, bone-breaking thud of a human body smashing headlong onto the jagged granite boulders below!\n\nSilence fell over the moor. Complete, terrible, unbroken silence.\n\nMy heart surged with a wave of wild, dizzying delirium!\n\nHe had fallen! The hound had driven Sir Henry Baskerville over the edge of the precipice! The Canadian heir lay dashed to pieces upon the rocks! \n\nThe direct line was extinct! The £740,000 was mine! The title, the ancestral halls, the golden securities—all mine!\n\nI struck a vesta match, touched the wick of my lantern, pulled down the shutter, and sprinted with leaping strides through the dark boulders towards the base of the crag to gaze upon my fallen enemy!", "is_ending": false, "clues": ["Stapleton tracks the hound’s progress by its muffled bays echoing off the crags", "A scream of mortal terror and a heavy falling crash ring out near Black Tor"], "choices": [{"id": "s_ch12_p1_c1", "text": "Hasten with your lantern to inspect the broken corpse at the foot of the cliff.", "target": "stapleton_ch12_part2_confronting_holmes", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch12_p1_c2", "text": "[Switch POV to Sherlock Holmes] View Holmes discovering the dead convict in Sir Henry’s suit.", "target": "holmes_ch12_part2_selden_death", "pov_switch": "holmes", "pov_switch_name": "Sherlock Holmes"}]}, "stapleton_ch12_part2_confronting_holmes": {"id": "stapleton_ch12_part2_confronting_holmes", "title": "Chapter 12: Death on the Moor (Part II: Face to Face with Sherlock Holmes)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "I swung my lantern around the massive base of the crag, my pulse racing with predatory triumph, stepping eagerly towards the dark, crumpled heap that lay sprawled upon the scree.\n\nTwo men were already standing over the corpse.\n\nI raised the lantern. The bright yellow beam struck the face of the taller man—and every drop of blood in my body turned to liquid ice!\n\nSherlock Holmes!\n\nHe was standing erect, wrapped in his dark ulster, his keen, eagle face set in lines of iron determination, his grey eyes piercing the gloom like cold daggers! And beside him, his service revolver cocked in his right hand, stood Dr. John Watson!\n\nMy soul convulsed in dizzying, paralyzing terror! But worse—infinitely worse—was the horror that greeted my eyes upon the ground!\n\nThe dead man was dressed from neck to heel in Sir Henry’s unmistakable ruddy tweed suit—the very suit he had worn in London! But the face turned up to the lantern light was not the clean-shaven, handsome countenance of the Canadian baronet! It was a brutal, low-browed, bestial visage, framed in a filthy, matted black beard—the mangled corpse of Selden, the Notting Hill convict!\n\nSelden! \n\nThe hound had hunted the clothes, not the man! Barrymore had given the discarded Canadian garments to his starving brother-in-law, and my starved demon had torn the wrong throat!\n\nEvery nerve in my brain screamed in frustrated, murderous fury! I stood within thirty inches of the greatest detective in Europe, and if my face betrayed one flicker of guilt, the handcuffs would close upon my wrists!\n\nI summoned every atom of my will to force my mouth into an expression of bewildered, horrified innocence.\n\n“Mr. Holmes!” I stammered, my throat dry as lime. “Is it possible? What an unexpected honour! And... who is this unfortunate gentleman?”\n\nHolmes looked at me with cool, impenetrable amusement. “An escaped convict, Mr. Stapleton. He appears to have broken his neck among the rocks. A very ordinary accident. My friend Watson and I return to London tomorrow; our little holiday in Devonshire is at an end.”\n\nHe was leaving! Holmes was returning to London!\n\nHe did not know! The fool had seen only an accident! He had missed the scent, the boot, the phosphorus, everything!\n\nI bowed, uttered a few hypocritical condolences with shaking lips, and turned into the fog towards Merripit House. My knees trembled with reaction, but my brain was afire with renewed, desperate resolve.\n\nOne last chance remained! Tomorrow night, Sir Henry was engaged to dine with me at Merripit House. If Holmes was in London, the baronet would walk home alone across the moor at ten o’clock! And this time, there would be no mistake!", "is_ending": false, "clues": ["Corpse is not Sir Henry, but Selden the convict wearing Sir Henry’s old clothes", "Sherlock Holmes is standing by the body in the flesh alongside Dr. Watson", "Stapleton is forced to play the innocent neighbour while his life hangs by a thread"], "choices": [{"id": "s_ch12_p2_c1", "text": "Retreat to Merripit House to invite Sir Henry to his final, fatal dinner.", "target": "stapleton_ch13_fatal_dinner", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch12_p2_c2", "text": "[Switch POV to Sherlock Holmes] View Holmes revealing the face of Hugo Baskerville.", "target": "holmes_ch13_portrait", "pov_switch": "holmes", "pov_switch_name": "Sherlock Holmes"}]}, "stapleton_ch13_fatal_dinner": {"id": "stapleton_ch13_fatal_dinner", "title": "Chapter 13: Fixing the Nets (The Last Supper at Merripit House)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "anchor", "anchor_name": "anchor_dinner_stapleton", "content": "The evening of October 24th was the grand climax towards which every beat of my heart had driven me for six grueling months.\n\nAt three o’clock that afternoon, Beryl had fallen upon her knees before me in the dining-room, clawing at my coat, weeping that she would throw herself into the Great Grimpen Mire before she allowed me to murder Sir Henry under our roof.\n\nI wasted no breath on argument. I struck her across the temple with my clenched fist. While she lay stunned upon the rug, I bound her wrists and ankles with stout window-sash cords, gagged her with a silk scarf knotted behind her ears, dragged her up the stairs to the rear bedroom, and lashed her securely to an upright of the brass bedstead. I locked the oak door, double-turned the key, and placed it in my waistcoat pocket.\n\nAt seven o’clock, Sir Henry Baskerville arrived alone.\n\nHe was in radiant spirits, brimming with robust Canadian health. He confirmed that Holmes and Watson had indeed taken the morning express from Coombe Tracey to London.\n\n“A pity Mr. Holmes could not join us,” I remarked with suave regret, filling his glass with vintage port. “A brilliant mind, no doubt, but perhaps a trifle eccentric for rustic tastes.”\n\nDinner was a triumph of deceit. I was the gracious, witty host, discussing timber tracts and Canadian railways. Sir Henry drank deeply, his eyes straying wistfully towards the empty chair, visibly downcast by Beryl’s “severe, sudden migraine.”\n\nAt twenty minutes to ten, I rose, made an excuse of consulting the weather, and slipped into the scullery.\n\nI pushed open the back door. Nature had allied herself with my genius!\n\nFrom the Great Grimpen Mire, a dense, blinding bank of white fog was rolling inland across the heather like a tidal wave! Within fifteen minutes, the path between Merripit House and the Hall would be completely submerged! A man walking the moor path in that impenetrable white wall would be blind and helpless as a newborn babe!\n\nI ran to the stone outhouse where I had concealed the hound. I smeared the cold, oily phosphorus paste over its jaws, its eyes, and along the ridges of its spine until it blazed with hellish green fire!\n\nTen o’clock chimed from the tall clock in the hall. Sir Henry was buttoning his coat in the vestibule! The hour of retribution was here!", "is_ending": false, "clues": ["Sir Henry arrives alone for dinner at Merripit House, believing Holmes returned to London", "Beryl is brutally tied and gagged upstairs in the locked bedroom to ensure silence", "Stapleton prepares the phosphorus paste and slips out into the dense rolling fog"], "choices": [{"id": "s_ch13_c1", "text": "Unleash the phosphorescent hound into the rolling fog as Sir Henry walks home.", "target": "stapleton_ch14_part1_release_hound", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch13_c2", "text": "[Switch POV to Sherlock Holmes] View Holmes, Watson, and Lestrade waiting in the fog ambush.", "target": "holmes_ch14_part1_fog_ambush", "pov_switch": "holmes", "pov_switch_name": "Sherlock Holmes"}]}, "stapleton_ch14_part1_release_hound": {"id": "stapleton_ch14_part1_release_hound", "title": "Chapter 14: The Hound of the Baskervilles (Part I: The Fog and the Gunfire)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "anchor", "anchor_name": "anchor_climax_stapleton", "content": "I watched from the black shadow of the scullery door as Sir Henry stepped out into the night. He paused at the garden gate, buttoned his collar against the chill, and set off briskly along the stone cart-track that led towards Baskerville Hall.\n\nWithin thirty yards, the dense, white wall of fog swallowed him up.\n\nNow!\n\nI dashed to the outhouse, threw open the door, and slipped the heavy brass lead from the hound’s collar.\n\n“Go, boy!” I snarled into its ear. “Tear him to ribbons!”\n\nWith an earth-shattering roar, the monster leaped into the fog! A streak of emerald flame, bound after bound across the heather! In two seconds, it had vanished into the white shroud of vapour.\n\nI stood upon the gravel, my pulse hammering in savage, triumphant ecstasy, waiting for the screams of death.\n\nOne second... three seconds... five seconds...\n\nSuddenly, a voice of thunder tore through the fog:\n\n“Look out! It’s coming!”\n\nSherlock Holmes!\n\nBefore my brain could grasp the catastrophe, the night exploded into sheets of orange flame!\n\nCrack! Crack! Crack! Crack! Crack!\n\nA volley of heavy revolver shots ripped through the mist! A shriek of agony—a dreadful, animal howl of dying fury—rent the heavens! The sound of a heavy body thrashing in the heather... a final, sharp pistol shot... and then, a dying rattle that ceased into total silence.\n\nMy hound was dead!\n\nHolmes had laid an ambush in the rocks! The law was fifty yards from my door, armed and closing the net!\n\nBlind panic shattered my nerves! The gallows of Exeter loomed before my eyes! I whirled, bolted into the house, seized my boots, and fled into the swirling fog of the Great Grimpen Mire!", "is_ending": false, "clues": ["Stapleton releases the phosphorescent hound into the rolling fog after Sir Henry", "A sudden volley of revolver shots tears through the mist, accompanied by the dying shriek of the beast"], "choices": [{"id": "s_ch14_p1_c1", "text": "Flee into the swirling fog of the Great Grimpen Mire to escape the law.", "target": "stapleton_ch14_part2_panic_flight", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch14_p1_c2", "text": "[Switch POV to Sherlock Holmes] View Holmes emptying his revolver into the fire-breathing beast.", "target": "holmes_ch14_part1_fog_ambush", "pov_switch": "holmes", "pov_switch_name": "Sherlock Holmes"}]}, "stapleton_ch14_part2_panic_flight": {"id": "stapleton_ch14_part2_panic_flight", "title": "Chapter 14: The Hound of the Baskervilles (Part II: The Flight into the Abyss)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "I plunged blindly into the churning white fog of the Great Grimpen Mire, my heart knocking against my ribs like a dying beast.\n\nBehind me, the shouts of men echoed across the heather. I heard the sharp, imperious voice of Lestrade and the heavy pounding of police boots against the gravel! They had broken into Merripit House; they had released Beryl; she was guiding them to the back door!\n\nI must reach my island fortress. In the tin shed lay my false passport, my golden sovereigns, and the stolen boots. From there, under the cover of night, I could strike north towards the Bristol Channel and board a tramp steamer for the Americas!\n\nThe fog was an impenetrable wall of curdled milk. I could not see my own hands stretched before my face. I stepped onto the secret bog-path, gasping for air.\n\nTwo paces forward... leap to the flat granite boulder... three paces across the firm peat...\n\nWhere was the willow wand? \n\nI reached out into the blinding mist, my bleeding fingers sweeping the empty air. The guide-stick had vanished! Had a wild pony trodden it into the mire? Had the rising black water washed it away?\n\nA scream of animal terror broke from my throat! In blind panic, I took a wild, desperate stride forward!\n\nThe earth dissolved beneath my right boot!\n\nIt did not crack—it gave way like cold grease! A sickening, jelly-like suction seized my ankle and dragged me down!\n\n“No!” I shrieked, throwing my body backward, clawing frantically at the false green moss.\n\nThe moss tore away in my bleeding hands. My knee sank into the foul, bubbling black slime. The more I kicked, the deeper the subterranean vacuum dragged me down! The icy, foul-smelling mud rose to my waist—to my chest! The sulfurous stench of the ancient bog choked my lungs.\n\nFar across the waste, the distant whistle of the night express tore through the fog. Civilization! Wealth! Life! All slipping away into the black abyss!\n\n“Beryl!” I screamed into the void. “Help me!”\n\nOnly the gurgling bubbles of the mire answered. The cold slime closed over my chin, over my lips, over my staring eyes.\n\nThe Great Grimpen Mire held me forever in its bottomless embrace.", "is_ending": false, "clues": ["Stapleton flees into the Great Grimpen Mire in pitch-black blinding fog", "Loses his secret path of sunken stones amidst the churning white morass", "Swallowed alive by the foul slime of the Great Grimpen Mire"], "choices": [{"id": "s_ch14_p2_c1", "text": "Plunge forever into the bottomless morass of Grimpen Mire (Canonical Ending).", "target": "ch15_mire", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch14_p2_c2", "text": "Face trial and the gallows at the Old Bailey before the bar of justice.", "target": "ch15_arrest", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch14_p2_c3", "text": "Witness Holmes deduce the complete anatomy of the crime in Baker Street.", "target": "ch15_holmes", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch14_p2_c4", "text": "Acknowledge the heroic triumph of Dr. Watson and the breaking of the curse.", "target": "ch15_watson", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch14_p2_c5", "text": "Witness the complete restoration of Baskerville Hall and the victory of reason.", "target": "ch15_victory", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch14_p2_c6", "text": "Reflect upon the shattered nerves of Sir Henry and the bitter cost of crime.", "target": "ch15_tragedy", "pov_switch": null, "pov_switch_name": null}]}}}, "cn": {"title": "巴斯克维尔的猎犬：多视角原著互动典藏版", "author": "阿瑟·柯南·道尔", "description": "完整重现阿瑟·柯南·道尔原著十五个章节的宏篇巨著。三大人物视角全篇15章完整覆盖：华生医生（全15章原汁原味长篇探案纪实）、福尔摩斯（全15章神探第一人称破案纪实）与斯台普吞（全15章反派罪枭第一人称沉浸密谋）。", "start_nodes": {"watson": "ch01_part1_stick", "holmes": "holmes_ch01_part1_observation", "stapleton": "stapleton_ch01_part1_heritage"}, "pov_roles": {"watson": {"name": "约翰·H·华生医生", "description": "实地观察、社交探访，在巴斯
