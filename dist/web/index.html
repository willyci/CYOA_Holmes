摩梯末医生读完了这篇怪异的记载之后就把眼镜推上了前额，直望着歇洛克·福尔摩斯。福尔摩斯打完呵欠就把烟头扔进了炉火。\n\n“嗯？”他说。\n\n“您不觉得很有趣味吗？”\n\n“对一个搜集神话的人来说，是很有趣味的。”\n\n摩梯末医生从衣袋里掏出来一张折叠着的报纸。", "is_ending": false, "clues": ["一七四二年手稿：雨果·巴斯克维尔的罪恶行径与地狱火犬传说", "对手足子孙的严厉告诫：夜黑之时切莫穿行达特沼地"], "choices": [{"id": "ch2_p1_c1", "text": "问询查尔斯爵士近期的生活习惯及验尸官的调查结论。", "target": "ch02_part2_footprints", "pov_switch": null, "pov_switch_name": null}, {"id": "ch2_p1_c2", "text": "询问摩梯末医生是否也坚信超自然的巨犬传说是真实的。", "target": "ch02_part2_footprints", "pov_switch": null, "pov_switch_name": null}]}, "ch02_part2_footprints": {"id": "ch02_part2_footprints", "title": "第二章 巴斯克维尔的灾祸（下：巨犬的足迹）", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "branch", "anchor_name": null, "content": "“福尔摩斯先生，现在我要告诉您一件发生时间较近的事。这是一张今年五月十四日的《德文郡纪事报》。是一篇有关几天前查尔兹·巴斯克维尔爵士死亡的简短叙述。”\n\n我的朋友上身稍向前倾，神色也变得专注起来。\n\n我们的来客重新放好了眼镜，又开始读了起来：\n\n“最近，查尔兹·巴斯克维尔爵士之暴卒，使本郡不胜哀悼。据云，在下届选举中，此人可能被选为中部德文郡自由党候选人。虽然查尔兹爵士在巴斯克维尔庄园居住不久，但其厚道与慷慨已深得周围群众之敬爱。值此暴发户充斥之时，如查尔兹这样一支名门之后，竟能致富还乡，重振因厄运而中衰之家声，诚为可喜之事。众所周知之查尔兹爵士曾在南非投机致富。但他较之一直于到倒霉为止的人们聪明，他带着变卖了的资财返回英伦。他来到巴斯克维尔庄园不过两年，人们普遍在谈论着他那庞大的重建和修幕的计划，然此计划已因其本人逝世而中断。因他并无子嗣，他曾公开表示，在他有生之日整个乡区将得到他的资助，因此，有很多人都悲悼他的暴亡。至于他对本地及郡慈善机关的慷慨捐输，本栏曾常有登载。\n\n“验尸之结果尚未能将与查尔兹爵士之死亡相关之诸情况弄清，至少尚未能消除由于当地之迷信所引起之诸种谣传。毫无理由怀疑有任何犯罪成分，或想象死亡并非由于自然原因。查尔兹爵士为鳏夫，据说他在某些方面表现精神状态有些反常。他虽有如许财产，但个人所好却很简单。巴斯克维尔庄园中之仆人只有白瑞摩夫妇二人，丈夫是总管，妻子当管家妇。他们的已被几个朋友证实了的证词说明：查尔兹爵士曾有健康情况不良之征象，尤其是几点心脏症状；表现在面色改变、呼吸困难和严重的神经衰弱。死者的朋友和私人医生杰姆士·摩梯未也提供了同样的证明。\n\n“案件实情甚为简单。查尔兹·巴斯克维尔有一种习惯，每晚在就寝前，须沿巴斯克维尔庄园出名之水松夹道散步。白瑞摩夫妇的证词说明死者之习惯确是如此。五月四日，查尔兹爵士曾声称他第二天想去伦敦，并曾命白瑞摩为他准备行李。当晚他照常出去作晚间散步，他常吸着雪茄散步，可是他再也没有回来。在十二点钟的时候，白瑞摩发现厅门还开着，他吃了一惊，于是就点了灯笼，出去寻找主人。当时外面很潮湿，所以沿着夹道下去很容易看到爵士的足迹，小路的中间有个通向沼地的栅门。种种迹象都说明查尔兹爵士曾站在门前，然后他就沿着夹道走了下去，他的尸体就是在夹道的末端被发现的。有一件尚未得到解释的事实就是：白瑞摩说，他主人的足迹在过了通往沼地的栅门后就变了样，好象是从那以后就换用足尖走路了。有一个叫作摩菲的吉卜赛马贩子，当时正在沼地里距出事地点不远的地方，可是他自己承认当时酒醉得很厉害。他说他曾听到过呼喊声，但说不清是来自哪方。在查尔兹爵士身上找不出遭受暴力袭击的痕迹，可是医生的证明中曾指出面容变形到几乎难以相信的程度的、躺在他面前的就是他的朋友和病人的尸体——据解释说，这是一种在因呼吸困难和心脏衰竭而死的时候常有的现象。这一解释已为尸体解剖所证明，说明存在着由来已久的官能上的病症。法院验尸官也缴呈了一份与医生证明相符的判断书。如此结束究属妥善，因查尔兹爵士之后代仍将在庄园居住，并将继续不幸为之中断的善行，因此，显然此点具有极端重要性，如验尸官平凡的发现不能最后扑灭那些邻里相传的有关此事的荒诞故事，则欲为巴斯克维尔庄园找个住户就很困难了。据了解，如果说爵士还有活着的最近的亲属的话，那就是他弟弟的儿子亨利·巴斯克维尔先生了。以前曾听说这位年轻人在美洲。现已进行调查，以便通知他来接受这笔为数庞大的财产。”\n\n摩梯末把报纸叠好，放回口袋去。\n\n“福尔摩斯先生，这些都是众所周知的有关查尔兹·巴斯克维尔爵士死亡的事实。”\n\n“我真得感谢您，”歇洛克·福尔摩斯说，“能引起我对这件饶有兴趣的案件的注意。当时我曾读过一些报纸的报导，但那时我正专心致力于梵蒂冈宝石案那件小事，在受着教皇急迫的嘱托之下竟忽略了在英伦发生的一些案件。您说这段新闻已包括了全部公开的事实吗？”\n\n“是的。”\n\n“那么再告诉我一些内幕的事实吧！”他靠在椅背上，把两只手的指尖对顶在一起。显出了他那极为冷静的、法官似的表情。\n\n“这样一来，”摩梯末医生一面说着，一面感情开始激动起来，“就会把我还没有告诉过任何人的事情都说出来了，我连验尸官都隐瞒了。因为一个从事科学工作的人，最怕在公众面前显得他似乎是相信了一种流传的迷信。我的另一个动机，就象报纸上所说的那样，如果有任何事情再进一步恶化它那已经相当可怕的名声，那么巴斯克维尔庄园就真的再不会有人敢住了。为了这两个原因，我想，不把我知道的全部事情都说出来还是正确的，因为那样做不会有什么好处，但是对你说来，我没有理由不开诚布公，彻底谈出来。\n\n“沼地上的住户们住得彼此相距都很远，而彼此居住较近的人们就产生了密切的关系。因此我和查尔兹·巴斯克维尔爵士见面的机会就很多。除了赖福特庄园的弗兰克兰先生和生物学家斯台普吞先生而外，方圆数十英里之内就再没有受过教育的人了。查尔兹爵士是一位喜欢隐居独处的人，可是他的病把我们俩拉到了一起，而且对科学的共同兴趣也大大有助于使我们两人亲近起来。他从南非带回来很多科学资料，我还常常将整个美好动人的傍晚和他共同消磨在研讨对布史人［南非一种原始的、以游牧狩猎为生的种族。——译者注］和豪腾脱人［南非黑人中的一个种族。——译者注］的比较解剖学上。\n\n“在最后的几个月里我看得愈来愈清楚，查尔兹爵士的神经系统已经紧张到极点了。他深信着我读给你听的那个传说——虽然他经常在自己的宅邸之内散步，但一到晚上就说什么也不肯到沼地上去了。福尔摩斯先生，在你看来是那样的不可信，可是，他竟深信他的家已经是厄运临头了。当然，他由上辈得知的传说确实使人不快。可怕的事就要在眼前出现的想法经常占据着他的身心，他不只一次地问过我，是否在夜间出诊的途中看到过什么奇怪的东西，或是听见过一只猎狗的嗥叫。后边这个问题他曾问过我好多次，而且总是带着惊慌颤抖的声调。\n\n“我记得很清楚，有一天傍晚我驾着马车到他家去，那是在这件致命的事情发生以前约有三个星期的时候。碰巧他正在正厅门前。我已经从我的小马车上下来站在他的面前了，我忽然看到他的眼里带着极端恐怖的表情，死死地盯视着我的背后。我猛然转过身去，刚刚来得及看到一个象大牛犊似的黑东西飞快地跑了过去。他惊慌恐怖得那样厉害，我不得不走到那动物曾经走过的地方四下寻找了一番。它已经跑了。但是，这件事似乎在他心中造成了极为恶劣的影响。我陪着他呆了一晚，就在那时，为了解释他所表现的情绪，他就把我刚来的时候读给您听的那篇记载托我保存了。我所以要提到这一小小的插曲，是因为它在随后发生的悲剧中可能有些重要性，可是在当时，我确实认为那只是一件微不足道的小事，他的惊恐也是没有来由的。\n\n“还是听从了我的劝告，查尔兹爵士才打算到伦敦去。我知道，他的心脏已经受了影响，他经常处于焦虑之中，不管其缘由是如何的虚幻，显然已严重地影响了他的健康。我想，几个月的都市生活就能把他变成一个新人了。我们共同的朋友斯台普吞先生非常关心他的健康状况，他和我的意见相同。\n\n可是，这可怕的灾祸竟在临行前的最后一刻发生了。\n\n“在查尔兹爵士暴死的当晚，总管白瑞摩发现以后，立刻就派了马夫波金斯骑着马来找我，因为我就寝很晚，所以在出事后一小时之内我就来到了巴斯克维尔庄园。我验证了所有在验尸过程中提到过的事实。我顺着水松夹道往前观察了他的脚印，看过了对着沼地的那扇栅门的地方，看来他曾在那儿等过人，我注意到由那一点以下的足迹形状的变化。我还发现了，除了白瑞摩在软土地上留下的那些足迹之外没有其他足迹。最后我又细心地检查了尸体，在我到达以前还没有人动过它。查尔兹爵士趴在地上，两臂伸出，他的手指插在泥土里；他的面部肌肉因强烈的情感而紧缩起来，甚至使我无法辨认，确实没有任何伤痕。可是在验尸的时候白瑞摩曾提供了一个不真实的证明。他说在尸体周围的地上没有任何痕迹，他什么也没有看到。可是，我倒看到了——就在相距不远的地方，不仅清晰而且是痕迹犹新。”\n\n“足迹？”\n\n“足迹。”\n\n“是男人的还是女人的？”\n\n摩梯末奇怪地望了我们一会儿，在回答的时候，声音低得几乎象耳语一样：“福尔摩斯先生，是个极大的猎狗的爪印！”", "is_ending": false, "clues": ["法医结论：查尔斯爵士在水松夹道栅门前死于心脏衰竭", "改变的足印表明查尔斯爵士曾在门前久驻或惊慌奔逃", "法庭未公开的惊天隐秘：一头巨大的猎犬的足迹！"], "choices": [{"id": "ch2_p2_c1", "text": "跟随福尔摩斯在贝克街推演整个案情的脉络与焦点。", "target": "ch03_problem", "pov_switch": null, "pov_switch_name": null}, {"id": "ch2_p2_c2", "text": "严密追问摩梯末医生关于猎犬足迹距离与形态的细节。", "target": "ch03_problem", "pov_switch": null, "pov_switch_name": null}]}, "ch03_problem": {"id": "ch03_problem", "title": "第三章 疑案", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "branch", "anchor_name": null, "content": "坦白地说，一听到这些话，我浑身都发抖了，医生的声调也在发颤，这说明连他都被亲口说给我们听的那件事所深深地激动了。福尔摩斯惊异地向前探着身，两眼显出当他对一件事极感兴趣时所特有的炯炯发光的专注的眼神。\n\n“您真看到了吗？”\n\n“清楚得就象现在我看见您一样。”\n\n“您什么也没有说吗？”\n\n“说又有什么用呢！”\n\n“为什么别人就没有看到呢？”\n\n“爪印距尸体约有二十码，没有人注意到。我想如果我不知道这件传说的话，恐怕也不会发现它。”\n\n“沼地里有很多看羊的狗吗？”\n\n“当然有很多，但是这只并不是看羊狗。”\n\n“您说它很大吗？”\n\n“大极了。”\n\n“它没有接近尸体吗？”\n\n“没有。”\n\n“那是个什么样的夜晚？”\n\n“又潮又冷。”\n\n“并没有下雨吧？”\n\n“没有。”\n\n“夹道是什么样的？”\n\n“有两行水松老树篱，高十二英尺，种得很密，人不能通过，中间有一条八英尺宽的小路。”\n\n“在树篱和小路之间还有什么东西吗？”\n\n“有的，在小路两旁各有一条约六英尺宽的草地。”\n\n“我想那树篱有一处是被栅门切断了的吧？”\n\n“有的，就是对着沼地开的那个栅门。”\n\n“还有其他的开口吗？”\n\n“没有了。”\n\n“这样说来，要想到水松夹道里来，只能从宅邸或是由开向沼地的栅门进去罗？”\n\n“穿过另一头的凉亭还有一个出口。”\n\n“查尔兹爵士走到那里没有？”\n\n“没有，他躺下的地方距离那里约有五十码。”\n\n“现在，摩梯末医生，请告诉我——这是很重要的一点——你所看到的脚印是在小路上而不是在草地上吧？”\n\n“草地上看不到任何痕迹。”\n\n“是在小路上靠近开向沼地的栅门那一面吗？”\n\n“是的，是在栅门那一面的路边上。”\n\n“您的话引起了我极大的兴趣。还有一点，栅门是关着的吗？”\n\n“关着，而且还用锁锁着呢。”\n\n“门有多高？”\n\n“四英尺左右。”\n\n“那么说，任何人都能爬过来了？”\n\n“是的。”\n\n“您在栅门上看到了什么痕迹吗？”\n\n“没有什么特别的痕迹。”\n\n“怪了！没有人检查过吗？”\n\n“检查过，是我亲自检查的。”\n\n“什么也没有发现吗？”\n\n“简直把人搞得胡里湖涂；显然查尔兹爵士曾在那里站过五分钟到十分钟的样子。”\n\n“您怎么知道的呢？”\n\n“因为从他的雪茄上曾两次掉下烟灰来。”\n\n“太妙了，华生，简直是个同行，思路和咱们一样。可是脚印呢？”\n\n“在那一小片沙砾地面上到处都留下了他的脚印；我看不出来有别人的脚印。”\n\n歇洛克·福尔摩斯带着不耐烦的神情敲着膝盖。\n\n“要是我在那里该多好！”他喊道，“显然这是一个极有意思的案件，它为犯罪学专家提供了进行研究工作的广泛的好机会。我本可在那片沙砾地面上看出不少线索来的；但是，现在那些痕迹已被雨水和爱看热闹的农民的木鞋所消灭了。啊！\n\n摩梯末医生，摩梯末医生啊，当时您为什么不叫我去呢！说真的，您该对这件事负责。”\n\n“福尔摩斯先生，我无法既请了您去，而又不把这些真相暴露于世，而且我也已经说明不愿这样做的原因了。同时，同时——”\n\n“为什么您犹豫不说呢？”\n\n“有的问题，就连最精明老练的侦探也是毫无办法的。”\n\n“您是说，这是一件神怪的事情吗？”\n\n“我并没有肯定这样说。”\n\n“您是没有肯定这样说。但是，显然您是这样想的。”\n\n“福尔摩斯先生，自从这件悲剧发生之后，我曾听到过一些很难与自然法则相符合的事情。”\n\n“请举例说吧。”\n\n“我知道在这可怕的事情发生之前，就有些人曾在沼地里看到过跟所说的这个巴斯克维尔的怪物形状相同的动物，而且决不是科学界所已知道的兽类。他们异口同声地说是一只大家伙，发着光，狰狞得象魔鬼似的。我曾盘问过那些人；其中有一个是精明的乡下人，一个是马掌铁匠，还有一个是沼地里的农户；他们都说了关于这个可怕的幽灵的相同的故事，完全和传说之中的狰狞可怕的猎狗相符。您可以相信，全区都被恐惧所笼罩了，敢在夜晚走过沼地的真可以算是大胆的人了。”\n\n“难道您——一个有着科学素养的人，会相信这是神怪的事吗？”\n\n“我也不知道应该相信什么。”\n\n福尔摩斯耸了耸肩。\n\n“至今为止，我的调查工作的范围还仅限于人世，”他说，“我只与罪恶做了稍许的斗争。但是，要接触到万恶之神，也许就不是我之力所能及的了。但是无论如何，您总得承认，脚印是实实在在的吧。”\n\n“这只古怪的猎狗确是实在得足以撕碎人的喉咙了，可是它又确实象是妖魔。”\n\n“我看得出来，您已经非常倾向于超自然论者了。可是，摩梯末医生，现在请您告诉我，您既持有这种看法，为什么还来找我呢？您以同样的口气对我说，对查尔兹爵士的死进行调查是毫无用处的，而您却又希望我去调查。”\n\n“我并没有说过希望您去调查啊。”\n\n“那么，我怎样才能帮助您呢？”\n\n“希望您告诉我，对于即将抵达滑铁卢车站的亨利·巴斯克维尔爵士应该怎么办呢？”摩梯末医生看了看他的表，“他在一个钟头零一刻钟之内就要到了。”\n\n“他就是继承人吗？”\n\n“对了，查尔兹爵士死后，我们对这位年轻的绅士进行了调查，才发现他一直就在加拿大务农。根据我们的了解，由种种方面看来，他都是个很好的人。我现在不是作为一个医生，而是作为查尔兹爵士遗嘱的受托人和执行人说话的。”\n\n“我想没有其他申请继承的人了吧？”\n\n“没有了。在他的亲属之中，我们唯一能够追溯到的另一个人就是罗杰·巴斯克维尔了。他是兄弟三个之中最年轻的一个，查尔兹爵士是最年长的一个，年轻时就死了的二哥就是亨利这孩子的父亲。三弟罗杰是家中的坏种，他和那专横的老巴斯克维尔可真是一脉相传；据他们说，他长得和家中的老修果的画像维妙维肖。他闹得在英格兰站不住脚了，逃到了美洲中部，一八七六年生黄热病死在那里。亨利已是巴斯克维尔家最后仅存的子嗣。在一小时零五分钟之后，我就要在滑铁卢车站见到他了。我接到了一份电报，说他已于今晨抵达南安普敦。福尔摩斯先生，现在您打算让我对他怎么办呢？”*\n\n“为什么不让他到他祖祖辈辈居住的家里去呢？”\n\n“看来似乎很应该，不是吗？可是考虑到每个巴斯克维尔家的人，只要到那里去，就会遭到可怕的命运。我想，如果查尔兹爵士在死前还来得及能和我说话的话，他一定会警告我，不要把这古老家族的最后一人和巨富的继承者带到这个致命的地方来。可是，不可否认的，整个贫困、荒凉的乡区的繁荣幸福都系于他的来临了。如果庄园里没有个主人，查尔兹爵士做过的一切善行就会全部烟消云散。由于我个人显然对这事很关心，恐怕我个人的看法对此事影响过大，所以才将这案件向您提出来，并征求您的意见。”\n\n福尔摩斯考虑了一会儿。\n\n“简单说来，事情是这样的，”他说，“您的意见是说，有一种魔鬼般的力量，使达特沼地变成了巴斯克维尔家人居处不安之所——这就是您的意见吗？”\n\n“至少我可以说，有些迹象说明可能是这样的。”\n\n“是的。可是肯定地说，如果您那神怪的说法是正确的话，那么，这青年人在伦敦就会象在德文郡一样地倒霉。一个魔鬼，竟会象教区礼拜堂似的，只在本地施展权威，那简直太难以想象了。”\n\n“福尔摩斯先生，如果您亲身接触到这些事情，也许您就不会这样轻率地下断语了。根据我的理解，您的意见是：这位青年在德文郡会和在伦敦同样的安全。他在五十分钟内就要到了，您说该怎么办呢？”\n\n“先生，我建议您坐上一辆出租马车，叫走您那只正在抓挠我前门的长耳猎犬，到滑铁卢去接亨利·巴斯克维尔爵士。”\n\n“然后呢？”\n\n“然后，在我对此事作出决定之前，什么也不要告诉他。”\n\n“您要用多长时间才能作出决定呢？”\n\n“二十四小时。如果您能在明天十点钟到这里来找我的话，摩梯末医生，那我真是太感谢您了；而且如果您能偕亨利·巴斯克维尔爵士同来的话，那就会更有助于我作出未来的计划了。”\n\n“我一定这样作，福尔摩斯先生。”他把这约会用铅笔写在袖口上，然后就带着他那怪异的、凝目而视和心不在焉的样子匆忙地走了。当他走到楼梯口时，福尔摩斯又把他叫住了。\n\n“再问您一个问题，摩梯末医生，您说在查尔兹·巴斯克维尔爵士死前，曾有几个人在沼地里看见过这个鬼怪吗？”\n\n“有三个人看见过。”\n\n“后来又有人看见过吗？”\n\n“我还没有听说过。”\n\n“谢谢您，早安。”\n\n福尔摩斯带着安静的、内心满足的神情回到他的座位上去，这表示他已找到了合乎口味的工作了。\n\n“要出去吗，华生？”\n\n“是啊，不过如果能对你有帮助的话，我就不出去。”\n\n“不，我亲爱的伙伴，只有在采取行动的时候，我才会求助于你呢。真妙啊，从某些观点看来，这件事实在特别。在你路过布莱德雷商店的时候，请你叫他们送一磅浓烈的板烟来好吗？谢谢你。如果对你方便的话，请你在黄昏前不要回来，我很想在这段时间里把早上获得的有关这极为有趣的案件的种种印象比较一下。”\n\n我知道，在精神高度集中，权衡点滴证据，作出不同的假设，把它们对比一下，最后再确定哪几点是重要的，哪些是不真实的时候，闭门独处，苦思终日，对我朋友说来是极为必要的。因此我就把时间全部消磨在俱乐部里了，黄昏前一直也没有回到贝克街去。在将近九点钟的时候，我才又坐在休息室里了。\n\n我打开门，第一个感觉就是好象着了火似的，因为满屋都是烟，连台灯的灯光都看不清了。走进去以后，我总算放下了心，因为浓烈的粗板烟气呛得我的嗓子咳了起来。透过烟雾，我模模糊糊地看到福尔摩斯穿着睡衣的身影蜷卧在安乐椅中，口里衔着黑色的陶制烟斗，周围放着一卷一卷的纸。\n\n“着凉了吗，华生？”他说。\n\n“没有，都是这有毒的空气搞的。”\n\n“啊，你说得对，我想空气也确实是够浓的了。”\n\n“浓得简直无法忍受。”\n\n“那么，就打开窗子吧！我看得出来，你整天都呆在俱乐部里吧？”\n\n“我亲爱的福尔摩斯！”\n\n“我说得对吗？”\n\n“当然了，可是怎么——”\n\n他讥笑着我那莫名其妙的神情。\n\n“华生，因为你带着一身轻松愉快的神情，使我很想耍耍小把戏拿你开开心。一位绅士在泥泞的雨天出了门；晚上回来的时候，身上却干干净净，帽上、鞋上依然发着亮光，他一定是整天呆坐未动。他还是个没有亲近朋友的人，这么说来，他还会到哪里去过呢？这不是很明显的事吗？”\n\n“对，相当明显。”\n\n“世界上有的是没有人看得出来的明显的事。你以为我是呆在什么地方的？”\n\n“这不是呆在这里没有动吗？”\n\n“正相反，我到德文郡去过了。”\n\n“‘魂灵’去了吧？”\n\n“正是，我的肉体一直是坐在这只安乐椅里。可是遗憾的是，我竟在‘魂灵’已远远飞走的期间喝掉了两大壶咖啡，抽了多得难以相信的烟草。你走了以后，我派人去斯坦弗警局取来了绘有沼地这一地区的地图，我的‘魂灵’就在这张地图上转了一天。我自信对那个地区的道路已了如指掌了。”\n\n“我想该是一张很详细的地图吧？”\n\n“很详细。”他把地图打开了一部分放在膝头上。“这里就是与我们特别有关系的地区。中间的地方就是巴斯克维尔庄园。”\n\n“周围是被树林围绕着的吗？”\n\n“是的。我想那条水松夹道，虽然在这儿并没有注明，一定是沿着这条线伸展下去的；而沼地呢，你可以看得出来，是在它的右侧。这一小堆房子就是格林盆村，咱们的朋友摩梯末医生的住宅就在这里。在半径五里之内，你看得到，只有很少几座零星散布的房屋。这里就是事件里提到过的赖福特庄园。这里有一所注明了的房屋，可能就是那位生物学家的住宅；如果我没有记错的话，他姓斯台普吞。这里是两家沼地的农舍，高陶和弗麦尔。十四英里以外就是王子镇的大监狱。在这些分散的各点之间和周围伸延着荒漠凄凉的沼地。这里就是曾经演出悲剧的舞台，也许靠我们的帮助，在这舞台上还会演出些好戏呢。”\n\n“这一定是个荒野之地。”\n\n“啊，左近的环境可真太合适了，如果魔鬼真想插足于人世间的事情的话……”\n\n“这么说，你自己也倾向于神怪的说法了。”\n\n“魔鬼的代理人也许是血肉之躯呢，难道不会吗？咱们面临着两个问题：第一，究竟是不是发生过犯罪的事实；第二，究竟是什么性质的罪行和这罪行是怎样进行的？当然罗，如果摩梯末医生的疑虑是正确的话，我们就要和超乎一般自然法则的势力打交道了；那样，我们的调查工作也就算是到了头了。但是我们只有在各种假设都被推翻之后，才能再回到这条路上来探索。如果你不反对的话，我想咱们得关上那窗户了。很奇怪，我总觉得浓厚的空气能使人们的思想集中。虽然我还没有到非钻进箱子去才能思考的地步，可是我相信，如果再继续发展下去的话，势必会得到那样的结果呢。这件案子，你在脑子里思考过了吗？”\n\n“是的，白天的时候我想得很多。”\n\n“你的看法怎么样呢？”\n\n“太扑朔迷离了。”\n\n“这案件确有其独特之处。它有几个突出的地方。譬如说吧，那足迹的变化，对这一点你的看法是怎样的呢？”\n\n“摩梯末说过，那人在那一段夹道上是用足尖走路的。”\n\n“他不过是重复了一个傻瓜在验尸时说过的话。为什么一个人会沿着夹道用足尖走路呢？”\n\n“那么，该怎样解释呢？”\n\n“他是跑着呢，华生——拼命地跑着，他在逃命，一直跑到心脏破裂伏在地上死去为止。”\n\n“他是为了逃避什么才跑的呢？”\n\n“咱们的问题就在这里。种种迹象都说明，这人在开始跑以前已经吓得发疯了。”\n\n“你为什么这样说呢？”\n\n“据我想象他恐惧的原因是来自沼地的。如果是这样的话，看来最可能的是：只有一个被吓得神魂颠倒的人才会不向房子而向相反的方向跑。如果那吉卜赛人的证词可以被认为是真实的话，他就是边跑边呼救命，而他所跑的方向却正是最不可能得到救助的方向。还有就是，当晚他在等谁呢？为什么他要在水松夹道而不在自己的房子里等人呢？”\n\n“你认为他是在等人吗？”\n\n“那人年事较长并且身体虚弱，我们可以理解，他会在傍晚时分散散步的；可是地面潮湿而夜里又那样冷。摩梯末医生的智慧确是值得我大大赞赏的；他根据雪茄烟灰所得出的结论，说明他竟站了五分钟或十分钟的时间，难道这是很自然的事吗？”\n\n“可是他每天晚上都出去啊！”\n\n“我不以为他每天晚上都在通向沼地的门前伫立等待。相反的，有证据能说明他是躲避沼地的。那天晚上他是在那里等过的，而且是在他要出发到伦敦去的前一个晚上。事情已经略具端倪了，华生，变得前后相符了。请你把我的小提琴拿给我，这件事等咱们明晨和摩梯末医生与亨利·巴斯克维尔爵士见面时再进一步考虑吧。”", "is_ending": false, "clues": ["下一位合法继承人亨利·巴斯克维尔爵士明日自美洲抵达伦敦", "德文郡军用地图：巴斯克维尔庄园、大格林盆泥潭与史前石屋群", "福尔摩斯的两大疑难：究竟有无罪案发生，以及如何保全亨利爵士性命"], "choices": [{"id": "ch3_c1", "text": "准备明早与亨利·巴斯克维尔爵士及摩梯末医生的关键会面。", "target": "ch04_part1_warning", "pov_switch": null, "pov_switch_name": null}, {"id": "ch3_c2", "text": "再次审视达特沼地的险峻地形与亨利爵士奔赴庄园的潜在危险。", "target": "ch04_part1_warning", "pov_switch": null, "pov_switch_name": null}]}, "ch04_part1_warning": {"id": "ch04_part1_warning", "title": "第四章 亨利·巴斯克维尔爵士（上：警告信与丢失的皮靴）", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "anchor", "anchor_name": "anchor_london_mission", "content": "我们的早餐桌很早就收拾干净了，福尔摩斯穿着睡衣等候着约定的拜会。我们的委托人对他的约会很守时刻，钟刚打十点，摩梯末医生就来了，后面跟着年轻的准男爵。准男爵是个短小精悍、生着一双黑眼珠的人，约有三十岁模样，人很结实，眉毛浓重，还有一副显得坚强而好斗的面孔。他穿着带红色的苏格兰式服装，外表显出是个久经风霜、大部时间都在户外活动的人，可是他那沉着的眼神和宁静自信的态度，显现出了绅士的风度。\n\n“这就是亨利·巴斯克维尔爵士。”摩梯末医生说。\n\n“噢，是的，”亨利爵士说道，“奇怪的是，歇洛克·福尔摩斯先生，即使我的这位朋友没有建议今晨来找您，我自己也会来的。我知道您是善于研究小问题的。今天早晨，我就遇到了一件实在想不通的事。”\n\n“请坐吧，亨利爵士。您是说从您到了伦敦以后已经遇到了一些奇特的事吗？”\n\n“没有什么重要的事，福尔摩斯先生，多半是开玩笑。如果您能把它叫做信的话，这就是我今早收到的一封信。”\n\n他把信放在桌上，我们都探身去看。信纸的质地平常，呈灰色。收信地址是“诺桑勃兰旅馆”，字迹很潦草，邮戳是“查林十字街”，发信时间是头一天傍晚。\n\n“谁知道您要到诺桑勃兰旅馆去呢？”福尔摩斯用锐敏的目光望着我们的来客问道。\n\n“谁也不可能知道啊。还是在我和摩梯末医生相遇以后，我们才决定的。”\n\n“但是，摩梯末医生无疑已经到那里去过了吧？”\n\n“不，我以前是和一个朋友住在一起的，”医生说，“我们并没有表示过要到这家旅馆去。”\n\n“嗯，好象有谁对你们的行动极为关心呢。”他由信封里拿出了一页叠成四折的半张１３×１７英寸的信纸。他把这张信纸打开，平铺在桌上。中间有一行用铅印字贴成的句子，是这样写的：\n\n若你看重你的生命的价值或还有理性的话，远离沼地。\n\n只有“沼地”两字是用墨水写成的。\n\n“现在，”亨利·巴斯克维尔爵士说，“福尔摩斯先生，也许您能够告诉我，这究竟是什么意思，究竟是谁，对我的事这样感兴趣呢？”\n\n“您对这件事怎样看法呢，摩梯末医生？无论如何，您总得承认这封信里绝没有什么神怪的成分吧？”\n\n“当然，先生。但是寄信的人倒很可能是个相信这是件神怪的事的人。”\n\n“怎么回事啊？”亨利爵士急促地问道，“我觉得似乎你们二位对我的事比我自己知道得还要多得多。”\n\n“在您离开这间屋子之前，您就会知道我们所知道的情况了，亨利爵士，这点我保证。”歇洛克·福尔摩斯说道，“目前还是请您允许我们只谈关于这封一定是昨天傍晚凑成寄出的很有趣的信吧。有昨天的《泰晤士报》吗，华生？”\n\n“在那个墙角放着呢。”\n\n“麻烦你拿给我可以吗？翻开里面的一版，劳驾，专登主要评论的那一面。”他迅速地从上到下看了一遍，这篇重要的评论谈的是自由贸易，让我给你们读一读其中的一段吧。\n\n“可能你还会重被花言巧语哄得相信，保护税则会对你的本行买卖或是工业具有鼓励的作用，但若从理性出发，由长远来看的话，此种立法命定会使国家远离富足，减低进口总价值，并降低此岛国之一般生活水平。”\n\n“华生，你对这事的想法如何呢？”福尔摩斯欣喜莫名地叫了起来，很满意似地搓着手，“你不认为这是一种很可钦佩的情感吗？”\n\n摩梯末医生带着职业的兴趣的神气望着福尔摩斯，而亨利·巴斯克维尔爵士则将一对茫然的眼睛盯住了我。\n\n“我不大懂得税则这一类的事情，”亨利爵士说道，“可是据我看来，就这封短信来说，我们已经有点离题了。”\n\n“正相反，我认为我们恰恰是在正题上呢，亨利爵士。华生对于我所采用的方法比您知道得要多，但恐怕就连他也不见得十分了解这个长句子的重要性呢。”\n\n“是的，我承认我看不出来两者之间有什么联系。”\n\n“可是，我亲爱的华生啊，两者之间的联系是这样的紧密，短信中的各个单字都是由这个长句中抽出来的。例如：‘你’、‘你的’、‘生’、‘命’、‘理性’、‘价值’、‘远离’等，你现在还看不出来这些字是由那里弄来的吗？”\n\n“天那！您太对了！唉呀，您可真聪明！”亨利爵士喊了起来。\n\n“如果对此还有任何怀疑之处的话，‘远离’和‘价值’这几个字是由同一处剪下来的，这个事实就足以消除怀疑了。”\n\n“嗯，现在……确实！”\n\n“实在，福尔摩斯先生，这完全是我料想不到的事，”摩梯末医生惊异地盯着我的朋友说，“如果有任何人说这些字是由报纸上剪下来的，我也能够相信，可是您竟能指出是哪份报纸，还说是剪自一篇重要的社论，这可是我所听过的最了不起的事了。您是怎么知道的呢？”\n\n“我想，医生，您能区别黑人和爱斯基摩人的头骨吧？”\n\n“当——然了。”\n\n“但是，怎样区别呢？”\n\n“因为那是我的特殊嗜好，那些区别是很明显的。眉骨隆起，面部的斜度，颚骨的线条，还有……”\n\n“这也是我的癖好啊，那不同点也是同样的明显，正象黑人和爱斯基摩人在您眼中的区别一样。在我看来，《泰晤士报》里所用的小五号铅字和半个便士一份的晚报所用的字体拙劣的铅字之间，也同样具有着很大的区别。区别报纸所用的铅字，对犯罪学专家说来，是最基本的知识中的一部分。不过，坦白地说，在我还很年轻的时候，也曾有一次把《李兹水银报》和《西方晨报》搞混了。但是《泰晤士报》评论栏所采用的字型是非常特殊的，不可能被误认为是其他的报纸。\n\n因为这封信是昨天贴成的，所以很可能在昨天的报纸里就能找到这些文字。”\n\n“我明白了，那么说，福尔摩斯先生，”亨利·巴斯克维尔爵士说道，“剪成这封短信的那个人是用一把剪刀……”\n\n“是剪指甲的剪刀，”福尔摩斯说，“您可以看得出来，那把剪子的刃很短，因为用剪子的人在剪下‘远离’这个词的时候不得不剪两下。”\n\n“正是这样。那么就是说，有一个人用一把短刃剪刀剪下了这封短信所用的字，然后用浆糊贴了上去……”\n\n“用胶水。”福尔摩斯说。\n\n“是用胶水贴在纸上的。可是我想知道，为什么‘沼地’这个词竟是写的呢？”\n\n“因为他在报纸上找不到这个词。其他字都是在任何一份报纸里都能找得到的常用字，可是‘沼地’这个词就不怎么常用了。”\n\n“啊，当然了，这样就能解释清楚了。您从这封短信里还看出些什么别的东西吗，福尔摩斯先生？”\n\n“还有一二迹象是可供研究的。他为了消灭所有的线索，确曾费了极大的苦心呢。这住址，您看得出来，是写得很潦草的。可是《泰晤士报》这份报纸除了受过很高教育的人之外，是很少有人看它的。因此，我们可以假定，这封信是个受过相当教育的人写的，可是他装成一个没有受过教育的人。\n\n而从他尽力掩饰自己的笔迹这一点看来，似乎他这笔迹可能会被您认出或查出来。还有，您可以看得出来，那些字不是贴成一条直线的，有些贴得比其他字要高得多。例如说‘生命’这个词吧，贴得就很不是地方。这一点可能说明剪贴的人的粗心、激动或是慌张。总起来讲，我是比较倾向于后一种想法的，因为这件事显然是重要的，这样一封信的编纂者，看来也不象是个会粗心大意的人。如果他是慌张的话，这就引出了一个值得注意的新问题：为什么他要慌张呢？因为清早寄出的任何信件，在他离开旅馆以前都会送到亨利爵士的手里的。写信的人是怕被人撞见吗——可是怕谁呢？”\n\n“现在我们简直胡猜起来了。”摩梯末医生说道。\n\n“嗯，不如说是在比较各种可能性，并将其中最与实际相近的选择出来；这就是科学地运用想象力，可靠的物质根据永远是我们进行思考的出发点。现在，还有一点，您无疑地又会把它称为胡猜，可是我几乎可以肯定，这信上的地址是在一家旅馆里写成的。”\n\n“您根据什么这样说呢？”\n\n“如果您仔细地把它检查一下，您就可以看出来，笔尖和墨水都曾给写信的人添了不少麻烦。在写一个字的当儿，笔尖就两次挂住了纸面，溅出了墨水。在写这样短短的一个地址中间，墨水就干了三次，这说明瓶中的墨水已经很少了。您想吧，私人的钢笔和墨水瓶是很少会这样的，而这两种情况竟会同时出现，当然更是十分罕有的事了，您知道，旅馆的钢笔和墨水却很难不是这样的。真的，我可以毫不犹豫地说，如果咱们能到查林十字街附近的各旅馆去检查一下字纸篓，只要一找到评论被剪破的那份《泰晤士报》剩下的部分，我们马上就能找到发出这封怪信的人了。啊！唉呀！这是什么啊？”\n\n他把贴着字的那张１３×１７英寸的信纸拿到离眼睛只有一二英寸的地方仔细地检查着。\n\n“啊？”\n\n“没有什么，”他一面说着一面又扔下了信纸，“这是半张空白信纸，上边连个水印都没有。我想，咱们从这封奇异的信上能够得到的东西也就仅止于此了。啊，亨利爵士，从您来到伦敦以后，还发生过什么值得注意的事情吗？”\n\n“嗯，没有，福尔摩斯先生。我想还没有。”\n\n“您还没有看到过有人注意您的行动或是盯您的梢吗？”\n\n“我好象是走进了一本情节离奇惊人的小说里似的，”我们的客人说，“见鬼，盯我的梢干什么？”\n\n“我们就要谈这个问题了。在我们谈这问题之前，您再没有什么可告诉我们的了吗？”\n\n“噢，这要看什么事情是你们认为值得讲的了。”\n\n“我认为日常生活里的任何反常的事情都是值得提出来的。”\n\n亨利爵士微笑起来。\n\n“对于英国人的生活，我知道得还不多，因我的时间几乎全部都是在美国和加拿大度过的。可是我希望失落一只皮鞋并不是这里的日常生活的一部分吧？”\n\n“您丢了一只皮鞋吗？”\n\n“我亲爱的爵士，”摩梯末医生叫了起来，“这不过是放错了地方罢了。您回到旅馆以后就会找到的。拿这种小事来烦扰福尔摩斯先生有什么用呢？”\n\n“唉，是他问我除了日常生活之外还发生过什么事情啊。”\n\n“很对，”福尔摩斯说，“不管这件事看来是多么的荒谬。\n\n您是说您丢了一只皮鞋吗？”\n\n“唉，还不就是放错地方了嘛。昨晚我把两只鞋都放在房门外，而今早就剩一只了。我从擦这双皮鞋的那个家伙的嘴里也没问出所以然来。最糟糕的是，这双高筒皮鞋是我昨晚刚刚由河滨路买来的，还没有穿过呢。”\n\n“如果您还没有穿过，为什么您要把它放在外面去擦呢？”\n\n“那双浅棕色的高筒皮鞋，还没有上过油呢，因此我就把它放在外边了。”\n\n“那么说，昨天您一到伦敦马上就出去买了一双高筒皮鞋吗？”\n\n“我买了很多东西呢，摩梯末医生陪着我跑来跑去的。您知道，既然我们要到那里去做个乡绅，那么我就必须穿着当地式样的服装，也许我在美国西部所沾染的生活方式使我显得有些放荡不羁了呢。除了其他东西以外，我还买了这双棕色高筒皮鞋——付了六块钱——可是还没有穿上脚，就被偷去了一只。”\n\n“被偷去的似乎是一件不成对就没有用处的东西，”歇洛克·福尔摩斯说道，“我承认我和摩梯末医生的想法相同，那只丢了的皮鞋不久可能就会找到的。”\n\n“嗯，先生们，”准男爵带着坚决的口气说，“我觉得好象我已经把我所知道的点点滴滴全都说了。现在，你们应当实现你们的诺言了，把我们大家所共同关心的事详详细细地告诉我吧。”\n\n“你的要求是很合理的，”福尔摩斯回答道，“摩梯末医生，我想最好还是请您象昨天给我们讲过的那样，把您知道的全部事实再讲一遍吧。”\n\n受到这样的鼓励之后，我们这位从事科学事业的朋友便由口袋里拿出了他那份手稿，就象昨天早晨那样地把全部案情叙述了出来。亨利·巴斯克维尔爵士全神贯注地倾听着，并且不时地发出惊奇的声音。\n\n“嗯，看来我似乎是承继了一份附有宿怨的遗产，”在冗长的叙述结束之后他说，“当然了，我从很小的时候就听到过关于这只猎狗的事，这是我们家最喜欢讲的故事了，可是我以前从来就没有相信过它。说起来，我伯父的去世——啊，这件事似乎使我内心感到十分不安，而且至今我还没有能把它搞清楚呢。看来你们似乎也还没有十分确定这究竟是警察该管的案子呢，还是一件牧师该管的事。”\n\n“就是啊。”\n\n“现在又出现了给我寄到旅馆的这封信。我想它大概和这件事是有关系的。”\n\n“这件事似乎说明，关于在沼地上所发生的事，有人知道得比我们还多。”摩梯末医生说。\n\n“还有一点，”福尔摩斯说道，“那个人对您并无恶意，因为他只是向您提出了危险的警告。”\n\n“也许是为了他们个人的目的，他们想把我吓跑。”\n\n“啊，当然那也是可能的。我非常感激您，摩梯末医生，因为您向我介绍了一个具有几种有趣的可能性的问题。可是，亨利爵士，眼下的一个很现实的必须加以决定的问题，就是究竟您是到巴斯克维尔庄园去好呢？还是不去的好。”\n\n“我为什么要不去呢？”\n\n“那里似乎有危险。”\n\n“您所说的危险，是来自我家的那个恶魔呢，还是来自人的呢？”\n\n“啊，那正是我们要弄清楚的事啊。”\n\n“不管它是什么，我的答复是已经肯定了的。地狱里并没有魔鬼，福尔摩斯先生，而且世界上也没有人能阻挡我回到我的家乡去。您可以把这句话当作我的最后答复。”在他说话的时候，他那浓浓的眉毛皱在一起，面孔也变得暗红起来。显然，巴斯克维尔家人的暴躁脾气，在他们这位硕果仅存的后裔身上，还没有完全消失。“同时，”他接着说，“对于你们所告诉我的全部事实，我还没有时间加以思考。这是件大事，只聚谈一次，谁也不可能全部理解并作出决定来，我愿意经过独自静思以后再作决定。喂，福尔摩斯先生，现在已是十一点半钟了，我要马上回到我的旅馆去。如果您和您的朋友华生医生能够在两点钟的时候来和我们共进午餐的话，那时，我就能更清楚地告诉你们这件事是多么地使我震惊了。”\n\n“华生，这样对你方便吗？”\n\n“没有问题。”\n\n“那么您就等着我们吧。我给您叫一辆马车好吗？”\n\n“我倒想遛一遛，这件事确实使我相当激动。”\n\n“我很高兴陪您一起散步，”他的同伴说。\n\n“那么，咱们就在两点钟时再见吧。再见，早安！”\n\n我们听到了两位客人下楼的脚步声和砰地关上前门的声音。\n\n福尔摩斯突然由一个懒散半醒似的人变成了个说做就做的人了。\n\n“穿戴好你的鞋帽，华生，快！一点时间都不能浪费！”他穿着睡衣冲进屋内，几秒钟以后就已穿好上装出来了。我们一同慌忙走下楼梯来到街上。在我们前面，向着牛津街的那个方向约有二百码的地方，还看得到摩梯末医生和巴斯克维尔爵士。\n\n“要不要我跑去把他们叫住？”\n\n“天哪！可千万别这样，我亲爱的华生。你能陪伴我，我就极为满足了，只要你还愿意和我在一起的话。我们的朋友确实聪明，今天早晨实在是很适于散步的。”", "is_ending": false, "clues": ["剪自昨日《泰晤士报》的匿名警告信：‘你如果还在乎自己的理智或生命，就应当远离那片沼地’", "字迹由短刃指甲刀剪切，投寄自查令十字街邮局", "亨利爵士在诺森伯兰旅馆丢失了一只崭新的黄色新皮靴"], "choices": [{"id": "ch4_p1_c1", "text": "提议暗中跟踪亨利爵士与摩梯末医生，查明沿途是否有密探盯梢。", "target": "ch04_part2_cab_chase", "pov_switch": null, "pov_switch_name": null}, {"id": "ch4_p1_c2", "text": "进一步盘问亨利爵士新靴失窃的细节与旅馆环境。", "target": "ch04_part2_cab_chase", "pov_switch": null, "pov_switch_name": null}]}, "ch04_part2_cab_chase": {"id": "ch04_part2_cab_chase", "title": "第四章 亨利·巴斯克维尔爵士（下：摄政街马车追踪）", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "branch", "anchor_name": null, "content": "他加快了脚步，使我们和他俩之间的距离缩短了一半。然后就跟在他们后面，保持着一百码的距离，我们跟随着他们走上了牛津街，又转到了摄政街。有一次我们的两位朋友站住了，向商店的橱窗里探望着，当时福尔摩斯也同样地望着橱窗。过了一会儿，他高兴得轻轻地叫了一声，顺着他那急切的眼神，我看到了一辆本来停在街对面的、里面坐着一个男人的双轮马车现在又慢慢地前进了。\n\n“就是那个人，华生，来呀！即使是干不了什么的话，至少咱们应该把他看清楚。”\n\n一瞬间，我看到了生着一绺浓密的黑须和一双炯炯逼人的眼睛的面孔，在马车的侧窗中向我们转过头来。突然间，他把车顶的滑动窗打开了，向马车夫喊了些什么，然后马车就顺着摄政街疯狂地飞奔而去。福尔摩斯焦急地往四下里望着，想找一辆马车，可是看不到空车。跟着他就冲了出去，在车马的洪流里疯狂地追赶着，可是那马车跑得太快了，已经看不到了。\n\n“唉，”福尔摩斯喘着气，脸色发白，由车马的浪潮中钻了出来，恼怒地说道，“咱们可曾有过这样坏的运气和干得这么糟糕的事吗？华生，华生，如果你是个诚实的人，你就应该把这事也记下来，作为我无往而不利的反证吧。”\n\n“那人是谁呀？”\n\n“我还不知道。”\n\n“是盯梢的吗？”\n\n“哼，根据咱们所听到的情况判断，显然是自从巴斯克维尔来到城里以后，就被人紧紧地盯上了。否则怎么那么快就被人知道了他要住在诺桑勃兰旅馆呢？如果第一天他们就盯上了他的梢，我敢说，第二天还是要盯的。你可能已经看了出来，当摩梯末医生在谈那件传说的时候，我曾走到窗前去过两次。”\n\n“是的，我还记得。”\n\n“那时我是向街中寻找假装闲逛的人们，可是我一个也没有看到，跟咱们打交道的是个精明人啊，华生。这件事很微妙呢，虽然我还没有能肯定对方是善意的还是恶意的，但是我觉得他是个有能力、有智谋的人。在我们的朋友告别之后，我马上就尾随了他们，为的是想发现他们的暗中追随者。他可真狡猾，连走路都觉得不可靠，他为自己准备了一辆马车，这样他就能跟在后边逛来逛去，或是从他们的身旁猛冲过去，以免引起他们的注意。他这手法还有个特别的好处呢，果真他们坐上一辆马车的话，他马上就能尾随上他们了。但是，显然也有一个不利之处。”\n\n“这样他就要听凭马车夫的摆布了。”\n\n“完全正确。”\n\n“咱们没有记下车号来，多可惜。”\n\n“我亲爱的华生，虽然我竟显得那样笨拙，可是你一定不会真的把我想象得连号码都忘了记下来吧？Ｎｏ．２７０４就是咱们要找的车号。但是，它眼下对咱们还没有用处。”\n\n“我看不出在当时的那种情况下你还能干些什么。”\n\n“在看到那辆马车的当时，我本来应该马上转身往回走。\n\n那时我应当不慌不忙地雇上另一辆马车，保持相当距离跟在那辆马车的后面，或者还不如驱车到诺桑勃兰旅馆去等。当我们所不知道的那个人，跟着巴斯克维尔到家的时候，我们就能以其人之道还治其人之身，看着他到什么地方去。可是当时由于我的疏忽急躁，使得咱们的对手采取了极为狡猾的行动，咱们暴露了自己，失去了目标。”\n\n我们一边谈着一边顺着摄政街漫步前进，在我们前面的摩梯末医生和他的伙伴早就不见了。\n\n“现在再尾随他们也没有什么意义了，”福尔摩斯说道，“盯梢的人走了，就不会再回来了。咱们必须考虑一下，咱们手里还剩下哪几张牌，用就要用得果断。你能认出车中人的面貌吗？”\n\n“我只能认出他的胡须来。”\n\n“我也能——可是我估计那可能是一绺假胡须。对于一个干这样细致事的聪明人说来，一绺胡子除了能掩饰他的相貌外，是没有别的用处的。进来吧，华生！”\n\n他走进了一家本区的佣工介绍所，受到经理的热情欢迎。\n\n“啊，维尔森，我看您还没有忘记我曾有幸地帮过您忙的那桩小案子吧？”\n\n“没有，先生，我真的没有忘。您挽救了我的名誉，甚至也许还救了我的性命呢。”\n\n“我亲爱的伙伴，您夸大其词了。维尔森，我记得在您的人手里有一个名叫卡特莱的孩子，在那次调查期间，曾显示出一些才干。”\n\n“是的，先生，他还在我们这里呢。”\n\n“您可以把他叫出来吗？谢谢您！还希望您把这张五镑的钞票给我换成零钱。”\n\n一个十四岁的、容光焕发而相貌机灵的孩子，听从经理的召唤来了。他站在那里，以极大的尊敬注视着这位著名的侦探。\n\n“把那本首都旅馆指南给我，”福尔摩斯说道，“谢谢！啊，卡特莱，这里有二十三家旅馆的名称，全都在查林十字街附近。你看到了吗？”\n\n“看到了，先生。”\n\n“你要挨家地到这些旅馆去。”\n\n“是，先生。”\n\n“你每到一家就给看门人一个先令，这儿是二十三个先令。”\n\n“是的，先生。”\n\n“你告诉他们说，你要看看昨天的废纸。你就说你寻找一份被送错了的重要电报。明白了吗？”\n\n“明白了，先生。”\n\n“可是真正需要你找的是夹杂在里面的一张被剪子剪成一些小洞的《泰晤士报》。这里有一份《泰晤士报》，就是这一篇。你很容易认出它来，你认得出来吗？”\n\n“能，先生。”\n\n“每一次，大门的看门人都要把客厅看门人叫来问问，你也要给他一个先令。再给你二十三个先令。在二十三家里你可能发现大多数的废纸昨天都已烧掉或已运走了，其中三、四家可能将一堆废报纸指给你看，你就在那废纸堆里找这一张《泰晤士报》，但也很可能什么都找不到。再给你十个先令以备急需。在傍晚以前你向贝克街我的家里发一个电报，报告查找的结果。现在，华生，咱们唯一剩下要干的事就是打电报查清那个马车夫了，车号是Ｎｏ．２７０４，然后到证券街的一家美术馆去消磨掉在我们去旅馆之前的一段时间吧。”", "is_ending": false, "clues": ["生着浓密黑须与凌厉双目的密探乘坐2704号双轮马车沿途尾随", "密探发现被福尔摩斯识破后立即令马车夫疾驰逃脱", "雇用卡特赖特搜查查令十字区23家旅馆的废纸篓以搜寻剪剩的《泰晤士报》"], "choices": [{"id": "ch4_p2_c1", "text": "返回诺森伯兰旅馆汇合，梳理追查三条关键线索。", "target": "ch05_threads", "pov_switch": null, "pov_switch_name": null}, {"id": "ch4_p2_c2", "text": "通过马车调度行彻查2704号双轮马车车主与车夫底细。", "target": "ch05_threads", "pov_switch": null, "pov_switch_name": null}]}, "ch05_threads": {"id": "ch05_threads", "title": "第五章 三条断了的线索", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "anchor", "anchor_name": "anchor_threads", "content": "歇洛克·福尔摩斯有着高度的控制个人感情的意志力。\n\n把我们纠缠其中的怪事在这两小时内似乎已被遗忘了，他全神贯注地观看着近代比利时大师们所作的绘画。从我们离开美术馆直至走到诺桑勃兰旅馆为止，除了艺术之外他什么也不谈。其实，他对艺术的见解是非常粗浅的。东西\n\n“亨利·巴斯克维尔爵士正在楼上等着你们呢。”帐房说道，“他让我等你们一来马上就把你们领上去。”\n\n“我想看一看你们的旅客登记簿，您不反对吧？”福尔摩斯说。\n\n“一点也不。”\n\n从登记簿上可以看出，在巴斯克维尔之后又来了两起客人。一起是来自新堡的肖菲勒斯·约翰森一家；另一起是来自奥吞州亥洛基镇的欧摩太太及女佣人。\n\n“这一定是我认识的那个约翰森吧，”福尔摩斯向守门人说道，“是个律师，不是吗？头发花白，走起来有些跛。”\n\n“不是的，先生，这位是煤矿主约翰森先生，是个好动的绅士，年纪不比您大。”\n\n“您一定把他的职业搞错了吧？”\n\n“没有，先生！他在我们这旅馆已经住过很多年了，我们都很了解他。”\n\n“啊，行了。还有欧摩太太，我似乎记得这个名字，请原谅我的好奇心，可是在访一个朋友的时候往往会遇到另一个朋友，这也是常有的事啊。”\n\n“她是一位病魔缠身的太太，先生。她丈夫曾做过葛罗斯特市的市长。她进城时总是到我们这里来住的。”\n\n“谢谢您，恐怕不能说她是我的熟人了。”\n\n“刚才咱们所问的这些问题已经说明了一个很重要的事实，华生，”在我们一起上楼的时候，他继续低声说，“咱们现在知道了，那些对咱们的朋友极感兴趣的人们，并没有和他住在同一个旅馆里。这就是说，虽然他们象咱们所看到的那样，非常热衷于对他进行监视，可是，同样地，他们也非常担心会被他看到。啊，这是一件很能说明问题的事实呢。”\n\n“它能说明什么问题呢？”\n\n“它说明——天啊，亲爱的朋友，这是怎么的了？”\n\n当我们快走到楼梯顶端的时候，正遇上亨利·巴斯克维尔爵士迎面走来。他气得脸都红了，手里提着一只满是尘土的旧高筒皮鞋。他气得说不出话来，等到他说话的时候，若与早晨相比，就显得声音高亢，西部口音也重得多了。\n\n“他们这旅馆的人，好象看我好欺侮似的，”他喊道，“让他们小心点吧，不然他们就会知道，他们开玩笑找错了人了。\n\n真是岂有此理！如果他找不到我丢了的鞋的话，那就得找麻烦了。我是最不怕开玩笑的，福尔摩斯先生，可是这回他们未免有点太过份了。”\n\n“还在找您的皮鞋吗？”\n\n“是啊，先生，非找到不可。”\n\n“可是您说过，您丢的是一只棕色高筒的新皮鞋啊？”\n\n“是啊，先生。可是现在又丢了一只旧的黑皮鞋。”\n\n“什么，您恐怕不是说……”\n\n“我正是要说，我一共有三双鞋——新的棕色的，旧的黑色的和我现在穿着的这双漆皮皮鞋。昨晚他们拿跑了我的一只棕色皮鞋，而今天又偷了我一只黑的——喂，你找到了没有？说呀，喂，不要光是站着瞪眼！”\n\n来了一个惊慌不安的德国籍侍者。\n\n“没有，先生。在旅馆里我到处都问过了，可是什么也没有打听到。”\n\n“好吧，在日落前把鞋给我找回来，否则我就要找老板去，告诉他，我马上就离开这旅馆。”\n\n“一定能找到的，先生，只要您能稍微忍耐一下，我保证一定能够找到。”\n\n“但愿如此，在这个贼窝里我可不能再丢东西了——咳，福尔摩斯先生，请原谅我竟拿这样小事烦扰了您……”\n\n“我倒认为这是一件很值得引起注意的事呢。”\n\n“啊，您把它看得过于认真了吧。”\n\n“您对这件事怎样解释呢？”\n\n“我根本就不想解释它。看来在我所发生过的事情里，这要算是最气人和最奇怪的事情了。”\n\n“也许是最奇怪的事情……”福尔摩斯意味深长地说道。\n\n“您对这件事是怎样看法呢？”\n\n“啊，我不敢说我已经了解了。您的这件案子是很复杂的呢，亨利爵士。把这件事与您伯父的死一联系起来看之后，我真不敢说，在我经手办理过的五百件重要案件里，是否有一件能象这样的曲折离奇。可是我们手中已经掌握了几条线索，料想其中必然会有一条能使我们找到真相。我们也可能会在错误的路上糟蹋些时间，但是我们早晚总能找出正确的线索来的。”\n\n我们愉快地进了午餐，饭间很少谈到将我们拉在一起的那件事。饭后，福尔摩斯在起坐室里问巴斯克维尔的意向如何。\n\n“到巴斯克维尔庄园去。”\n\n“什么时候去？”\n\n“周末。”\n\n“总起来说，”福尔摩斯说道，“我觉得您的决定还是聪明的。我完全可以证明，您在伦敦已经被人盯上梢了，在这样大的城市里，在成千上万的人里，很难弄清这些人是谁，或是他们怀着什么目的。如果他们怀有恶意的话，他们就可能给您造成不幸，我们恐怕也无力阻止不幸的发生。摩梯末医生，您不知道你们今早从我家出来之后，就被人盯上了吗？”\n\n摩梯末医生大吃一惊。\n\n“被盯上了！被谁？”\n\n“不幸得很，这正是我无法奉告的事。在达特沼地，在您的邻居和熟人之中，有没有留着又黑又长的胡子的人？”\n\n“没有——嗯，让我想想看——啊，对了，查尔兹爵士的管事白瑞摩是留有连腮黑胡子的。”\n\n“啊！白瑞摩在什么地方？”\n\n“他总管那座庄园。”\n\n“我们最好证实一下，他是否确实呆在那里，说不定他正在伦敦呢。”\n\n“您怎么能证实这一点呢？”\n\n“给我一张电报纸。‘是否已为亨利爵士备好了一切？’这样就行了。发给巴斯克维尔庄园，交白瑞摩先生。离庄园最近的电报局在哪里？是格林盆吗？好极了，咱们再发一封电报给格林盆的邮政局长，就写‘发白瑞摩先生的电报务交本人。如不在，请回电通知诺桑勃兰旅馆亨利·巴斯克维尔爵士。’这样一来，到不了晚上咱们就能知道白瑞摩是否确在自己的工作岗位上了。”\n\n“这样很好，”巴斯克维尔说道，“可是，摩梯末医生，这个白瑞摩究竟是个怎么样的人呢？”\n\n“他是已故老管家的儿子，他们负责照看这所庄园至今已有四辈了，据我所知，他和他的妻子在乡间是很受人尊敬的一对夫妇呢。”\n\n“同时，”巴斯克维尔说道，“事情很清楚，只要没有我们家的人住在庄园里，这些人可就太舒服了，简直无事可作。”\n\n“这是实情。”\n\n“白瑞摩从查尔兹爵士的遗嘱里究竟得到些好处没有？”\n\n福尔摩斯问道。\n\n“他和他的妻子每人得到了五百镑。”\n\n“啊！他们以前是否知道将来要拿到这笔钱呢？”\n\n“知道，查尔兹爵士是很喜欢谈论他那遗嘱的内容的。”\n\n“这事很有意义。”\n\n“我希望，”摩梯末医生说道，“您不要对每一个从查尔兹爵士的遗嘱里得到好处的人都投以怀疑的眼光吧，他也留给了我一千镑呢。”\n\n“真的吗？还有谁得到了呢？”\n\n“还有很多分给一些人的小笔款项和大批捐给公共慈善事业的钱。余产完全归亨利爵士。”\n\n“余产有多少呢？”\n\n“七十四万镑。”\n\n福尔摩斯惊奇地扬起了眉毛说：“我真没有想到竟有这样大的数目。”\n\n“查尔兹爵士是以富有闻名的，可是在我们检查他的证券以前，我们并不知道他究竟有多么富。原来全部财产的总值竟约有一百万镑。”\n\n“天啊！一个人见了这样大的赌注，当然要拚命赌他一场了。可是还有一个问题，摩梯末医生，假若咱这些位年轻的朋友发生了什么不幸的话——请您原谅我这不愉快的假设吧——谁来继承这笔财产呢？”\n\n“因为查尔兹爵士的弟弟罗杰·巴斯克维尔没有结过婚就死了，所以财产就应当传给远房的表兄弟戴斯门家里的人了。杰姆士·戴斯门是威斯摩兰地方的一位年长的牧师。”\n\n“谢谢您，这些细节都是很值得注意的。您见过杰姆士·戴斯门先生吗？”\n\n“见过，他来拜访过查尔兹爵士一次。他是个态度庄重可敬的人，过着圣洁的生活。我还记得，他拒绝从查尔兹爵士那里接受任何产业，虽然查尔兹爵士曾强其接受。”\n\n“这个没有什么癖好的人竟要成为查尔兹爵士万贯家财的继承人吗？”\n\n“他将成为产业的继承人，因为这是法律所规定的。他还将继承钱财，除非现在的所有者另立遗嘱——当然他有权任意处置。”\n\n“亨利爵士，您立过遗嘱了吗？”\n\n“没有，福尔摩斯先生。我还没有时间呢，因为昨天我才知道事情的真相。可是，无论在什么情况下，我总觉得钱财不应该与爵位和产业分离。我那可怜的伯父的遗志就是这样的。如果主人没有足以维持产业的钱的话，他怎么能恢复巴斯克维尔家的威望呢？房地产与钱财绝不能分开。”\n\n“非常正确。啊，亨利爵士，对于您应该马上到德文郡去的这个意见，我和您的看法相同。但有一个条件，您决不能单独去。”\n\n“摩梯末医生和我一起回去。”\n\n“可是，摩梯末医生有医务在身啊，而且他家离您的家也有数英里之遥，尽管他对您怀有天大的好意，恐怕他对您也是爱莫能助。不行，亨利爵士，您必须另找一个可以信赖的人，能够永远和您形影不离的人一起去。”\n\n“您自己去可能吗，福尔摩斯先生？”\n\n“如果事情到了发生危机的程度的时候，我一定尽可能亲自出马，但是您可以了解到，我有着接受广泛咨询的业务和经常的来自各方面的请求，如果让我无限期地离开伦敦，那是不可能的。目前就有一位英格兰的极为可敬的人物，正在受人威胁和污蔑，而只有我才能制止这件后果严重的诽谤。您可以看得出来，现在叫我到达特沼地去是件多么不可能的事。”\n\n“那么，您打算让谁去呢？”\n\n福尔摩斯用手拍着我的手背说道：“如果我的朋友愿意担任这件事的话，那末在您正处于危急的情况之下，要想找一个人来陪伴和保护您，就再也没有比他更好的了，这一点也再没有人能说得比我更有信心了。”\n\n这个意外的建议，使我完全不知如何是好了。我还没来得及回答，巴斯克维尔就抓住了我的手，热情地摇了起来。\n\n“啊，华生医生，您的厚意我真是感谢之至，”他说，“您了解我所处的境地，对于这件事，您知道得和我一样多；如果您能到巴斯克维尔庄园去陪我，我将永远铭记在心。”\n\n即将投入的冒险，对我是永远具有吸引力的，何况我还受到了福尔摩斯的恭维和准男爵把我当作伙伴看待的真挚之情的感动呢。\n\n“一定，我很愿意去，”我说道，“这样使用我的时间是非常值得的。”\n\n“你得很细心地向我报告，”福尔摩斯说道，“当危机到来的时候——危机总是会来临的——我将指示你如何行动。我想星期六就可以准备好动身了吧？”\n\n“这样对华生医生方便吗？”\n\n“很方便。”\n\n“那么，除非我另有通知，否则星期六咱们就在车站会面，坐由帕丁顿开来的十点三十分的那趟车。”\n\n当我们正站起来告辞的时候，巴斯克维尔突然发出了胜利的欢呼，并且冲向屋角，由橱柜下面拖出一只棕色的长筒皮鞋。\n\n“正是我丢的鞋。”他喊了起来。\n\n“但愿咱们所有的困难都象这件事一样地消失！”歇洛克·福尔摩斯说道。\n\n“可是这真是件奇怪的事，”摩梯末医生说道，“午饭以前，我已在这屋里仔细搜寻过了。”\n\n“我也搜寻过啊！”巴斯克维尔说，“到处都找遍了。”\n\n“那时，屋里肯定没有长筒皮鞋。”\n\n“这样说来，一定是当我们在吃午饭的时候，侍者给放在那里的。”\n\n那德国籍侍者被叫了来，可是他说对这件事一点也不知道，无论怎样问也是弄不清楚。目的不明的神秘事件一个紧接一个地连续发生，现在又多了一件。除了查尔兹爵士暴死的整个可怕的故事之外，在两天之内就意外地发生了一连串的无法解释的奇事：其中包括收到用铅印字凑成的信，双轮马车里蓄着黑胡子的那个盯梢人，新购棕色皮鞋的遗失和旧黑皮鞋的失踪，还有现在被送还的新的棕色皮鞋。在我们坐车回贝克街的时候，福尔摩斯沉默不语地坐着，我由他那紧皱的双眉和严峻的面孔就能看出，他的心里正和我一样，在忙于努力拼凑一些能够解释这一切奇异而又显然是彼此毫无关联的插曲的推想。整个下午直到深夜，他都呆坐着，沉浸在烟草和深思之中。\n\n刚要吃晚饭就送来了两封电报，第一封是：\n\n顷悉，白瑞摩确在庄园。巴斯克维尔。\n\n第二封是：\n\n依指示曾去二十三家旅馆，未寻得被剪破之《泰晤士报》。歉甚。卡特莱。\n\n“我的两条线索算是都完了，华生。再没有比事事不顺的案子更恼人的了。咱们必须转换方向另找线索。”\n\n“咱们总还可以找到给那盯梢人赶车的马夫啊。”\n\n“确实。我已发了电报要求执照管理科查清他的姓名和地址——如果这来的就是对于我的问题的答案的话，我也不会感到惊奇的。”\n\n事实证明，门铃声带来的结果较我们希望的答案更加使人满意。因为门一开就进来了一个举止粗鲁的家伙，显然他正是我们所要找的那个人。\n\n“我接到总局的通知，说这里有一位绅士要找Ｎｏ．２７０４车的车夫！”他说道，“我赶马车已经赶了七年了，从来没有听过乘客说一句不满意的话；我直接从车场到这里来了，我要当面问清，您对我有什么不满意之处。”\n\n“老弟，我对你没有丝毫不满，”福尔摩斯说，“相反的，如果你能清清楚楚地回答我的问题，我就给你半个金镑。”\n\n车夫听了咧开嘴笑着说：“啊，我今天可真赶上好日子啦。先生，您要问我什么呢？”\n\n“首先，我要问你的姓名和地址，以后需要的时候我好再去找你。”\n\n“约翰·克雷屯，住在镇上特皮街３号；我的车是由滑铁卢车站附近的希波利车场租来的。”\n\n歇洛克·福尔摩斯将这些记了下来。东西\n\n“现在，克雷屯，请你把今晨来监视这所房子而后来又在摄政街尾随两位绅士的那个乘客的情况告诉我吧。”\n\n看样子那人吃了一惊，并且还有点不知所措了。\n\n“呃，这件事似乎用不着我再告诉您了，因为看来您知道的和我一样多，”他说，“事实是这样的，那位绅士曾经和我说，他是个侦探，并且说关于他的事不许对任何人讲。”\n\n“老弟，这是一件很严重的事呢，如果你想对我隐瞒任何东西，你就要倒霉了。你说你的乘客曾告诉你他是个侦探吗？”\n\n“是的，他是这样说的。”\n\n“他什么时候说的呢？”\n\n“在他离开我的时候。”\n\n“他还说过什么别的吗？”\n\n“他提到了他的姓名。”\n\n福尔摩斯以胜利的眼神迅速地瞟了我一眼。“噢，他提到了他的姓名，是吗？那可真够冒失的。他说他叫什么名字啊？”\n\n“他的姓名，”车夫说，“是歇洛克·福尔摩斯，先生。”\n\n我从来没有看到过我的朋友象听到马车夫的话时那样地大吃一惊。刹时间他惊愕得坐在那里一言不发。然后，他又纵声大笑起来。\n\n“妙啊，华生，真是妙极了，”他说，“我觉得他真是个和我一样迅速、机敏的人。上次他可把我搞得真够瞧的——他的姓名就是歇洛克·福尔摩斯，是吗？”\n\n“是的，先生，这就是那位绅士的姓名。”\n\n“太好了！告诉我他在什么地方搭上了你的车和那以后的事吧。”\n\n“九点半的时候，他在特莱弗嘎广场叫了我的车，他说他是个侦探，并说如果我能整天绝对地服从他的指示而不提出任何问题的话，他就给我两个金镑。我很高兴地同意了。我们首先赶到诺桑勃兰旅馆，在那里一直等到两位绅士出来并雇上了马车。我们尾随着他们的马车，直到停在这里附近为止。”\n\n“就是这个大门。”福尔摩斯说道。\n\n“啊，这一点我不能肯定。可是，我敢说我的乘客什么都知道。我们停在街上等了一小时半。后来有两位绅士由我们旁边步行过去，我们就顺着贝克街跟踪下去，并沿着……”\n\n福尔摩斯插言道：“这我知道了。”\n\n“当我们走过了摄政街约有四分之三的时候。忽然间，我车上的那位绅士打开了车顶滑窗，向我喊着说，让我尽快地将车赶向滑铁卢车站。我鞭挞着马，不足十分钟就到了。他真的给了我两个金镑就进车站去了。就是在他正要走开的时候，他转过身来说道：‘你如果知道了也许会感到兴趣的，你的乘客就是歇洛克·福尔摩斯。’这样我才知道了他的姓名。”\n\n“原来如此。你以后再没有看到过他吗？”\n\n“他进了车站以后，就再没有见到过了。”\n\n“现在你怎样来形容一下歇洛克·福尔摩斯先生呢？”\n\n马车夫搔了下头皮说道：“啊，他可真不那么容易形容。我看他有四十岁的样子，中等身材，比你矮二三英寸，先生。衣着象个绅士，蓄着黑胡须，须端剪齐，面色苍白。我想我能说的也就是这些了。”\n\n“眼珠的颜色呢？”\n\n“不，我说不出来。”\n\n“别的你再也记不得什么了吗？”\n\n“嗯，先生，记不得了。”\n\n“好吧，那么给你这半个金镑。如果往后你能带来更多的消息，还可以再拿半镑。晚安！”\n\n“晚安，先生，谢谢您。”\n\n约翰·克雷屯格格地笑着走了。福尔摩斯耸了耸肩带着失望的微笑向我转过头来。\n\n“咱们的第三条线索又算是断了，刚摸着点头就又吹了。”\n\n他说道，“这个狡猾的流氓！他摸了咱们的底，他知道亨利·巴斯克维尔爵士曾经找过我，在摄政街察觉了我是谁，考虑到我已记下马车的号数，一定会去找马车夫的，因此他就送来了这个戏谑的口信。我告诉你，华生，这一回咱们可真搞上了一个值得干一场的对手了。我在伦敦已经遭到了挫折。但愿你在德文郡运气能够比在这里好一点，可是我真不放心。”\n\n“对什么不放心呢？”\n\n“对派你去的这件事不放心。这事很棘手，华生，既棘手而又危险，这件事我愈看就愈不喜欢它。是啊，亲爱的伙伴，你可以笑我，可是我跟你讲，如果你能安安全全地再回到贝克街来，那我就太高兴了。”", "is_ending": false, "clues": ["亨利爵士的一只旧黑皮靴失窃，而此前丢失的黄皮靴又离奇现身", "卡特赖特搜查23家旅馆废纸篓一无所获", "达特沼地庄园电报核实白瑞摩确实留在庄园", "马车夫约翰·克莱顿供述：那蓄黑胡须的乘客狂妄自称‘歇洛克·福尔摩斯’", "福尔摩斯指令华生佩带左轮手枪随同亨利爵士奔赴德文郡贴身护卫"], "choices": [{"id": "ch5_c1", "text": "华生毅然接受重托，佩带手枪与亨利爵士同登前往德文郡的特快列车。", "target": "ch06_part1_arrival", "pov_switch": null, "pov_switch_name": null}, {"id": "ch5_c2", "text": "聆听福尔摩斯关于防范危险与排查嫌犯的临行绝密嘱托。", "target": "ch06_part1_arrival", "pov_switch": null, "pov_switch_name": null}]}, "ch06_part1_arrival": {"id": "ch06_part1_arrival", "title": "第六章 巴斯克维尔庄园（上：阴森的荒原与初抵庄园）", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "anchor", "anchor_name": "anchor_arrival", "content": "在约定的那一天，亨利·巴斯克维尔爵士和摩梯末医生都准备好了。我们就按照预先安排的那样出发到德文郡去。歇洛克·福尔摩斯和我一道坐车到车站去，并对我作了些临别的指示和建议。\n\n“我不愿提出各种说法和怀疑来影响你，华生，”他说，“我只希望你将各种事实尽可能详尽地报告给我，至于归纳整理的工作，就让我来干吧。”\n\n“哪些事实呢？”我问道。\n\n“看来与这案件有关的任何事实，无论是多么的间接，特别是年轻的巴斯克维尔和他的邻居们的关系，或是与查尔兹爵士的暴卒有关的任何新的问题。前些天，我曾亲自进行过一些调查，可是我恐怕这些调查结果都是无补于事的。只有一件看来是肯定的，就是下一继承人杰姆士·戴斯门先生是一位年事较长的绅士，性格非常善良，因此这样的迫害行为不会是他干出来的。我真觉得在咱们考虑问题的时候可以完全将他抛开，剩下的实际上也就只有在沼地里环绕在亨利·巴斯克维尔周围的人们了。”\n\n“首先辞掉白瑞摩这对夫妇不好吗？”\n\n“千万别这样做，否则你就要犯绝大的错误了。如果他们是无辜的话，这样就太不公正了；如果他们是有罪的话，这样一来，反而不能加他们以应得之罪了。不，不，不能这样，咱们得把他们列入嫌疑分子名单。如果我没有记错的话，还有一个马夫，还有两个沼地的农民。还有咱们的朋友摩梯末医生，我相信他是完全诚实的，但是，关于他的太太，咱们是一无所知的。生物学家斯台普吞，还有他的妹妹，据说她是位动人的年轻女郎呢。有赖福特庄园的弗兰克兰先生，他是个情况未明的人物。还有其他一两个邻居。这些都是你必须加以特别研究的人物。”\n\n“我将尽力而为。”\n\n“我想你带着武器吧？”\n\n“带了，我也想还是带去的好。”\n\n“当然，你那支左轮枪，日日夜夜都应带在身边，不能有一时一刻的粗心大意。”\n\n我们的朋友们已经订下了头等车厢的座位，正在月台上等着我们呢。\n\n“没有，我们什么消息都没有，”摩梯末在回答我朋友的问题时说，“可是有一件事，我敢担保，前两天我们没有被人盯梢。在我们出去的时候，没有一次不是留意观察的，谁也不可能逃出我们的眼去的。”\n\n“我想你们总是在一起的吧？”\n\n“除了昨天下午以外。我每次进城来，总是要有一整天的时间是完全花在消遣上面的，因此我将昨天整个下午的时间都消磨在外科医学院的陈列馆里了。”\n\n“我到公园去看热闹去了，”巴斯克维尔说，“可是我们并没有发生任何麻烦。”\n\n“不管怎么样，还是太疏忽大意了，”福尔摩斯说，一面样子很严肃地摇着头，“亨利爵士，我请求您不要单独走来走去，否则您就要大祸临头了。您找到了另一只高筒皮鞋了吗？”\n\n“没有，先生，再也找不着了。”\n\n“确实，真是很有趣味的事。好吧，再见，”当火车沿着月台徐徐开动起来的时候，他说，“亨利爵士，要记住摩梯末医生给我们读的那个怪异而古老的传说中的一句话——不要在黑夜降临、罪恶势力嚣张的时候走过沼地。”\n\n当我们已远离月台的时候，我回头望去，看到福尔摩斯高高的、严肃的身影依然站在那里一动不动地注视着我们。\n\n这真是一趟既迅速而又愉快的旅行，在这段时间里，我和我的两位同伴搞得较前更加亲密了，有时还和摩梯末医生的长耳獚犬嬉戏。车行几小时以后，棕色的大地慢慢变成了红色，砖房换成了石头建筑物，枣红色的牛群在用树篱围得好好的地里吃着草，青葱的草地和极其茂密的菜园说明，这里的气候湿润而易于获得丰收。年轻的巴斯克维尔热切地向窗外眺望着，他一认出了德文郡熟悉的风景，就高兴得叫了起来。\n\n“自从离开这里以后，我曾到过世界上很多地方，华生医生，”他说道，“可是，我从来没有见过一个地方能和这里相比。”\n\n“我还从没有见到过一个不赞美故乡的德文郡人呢。”我说道。\n\n“不光是本郡的地理条件，就是本地的人也是不凡呢。”摩梯末医生说道，“试看我们这位朋友，他那圆圆的头颅就是属于凯尔特型的，里面充满着凯尔特人的强烈的感情。可怜的查尔兹爵士的头颅则属于一种非常稀有的典型，他的特点是一半象盖尔人，一半象爱弗人。以前看到巴斯克维尔庄园的时候，您还很年轻呢，是不是？”\n\n“我父亲死的时候，我还是个十几岁的孩子，那时他住在南面海边的一所小房子里，所以我从来还没有看到过这所庄园。我父亲死后，我就直接到美洲的一个朋友那儿去了。我跟您说，对于这庄园，我和华生医生是同样地感到新鲜的，我是非常渴望要看一看沼地的。”\n\n“是吗？那样的话，您的愿望很容易就能实现了，因为您就要看到沼地了。”摩梯末医生一面说着一面向车窗外边指着。\n\n在那被切割成无数绿色方格的田野和顶端连成低矮的曲线的树林那面，远远地升起了一座灰暗苍郁的小山，山顶上有形状奇特、参差不齐的缺口，远远望去晦暗朦胧，宛如梦幻中的景色一般。巴斯克维尔静坐了好久，两眼盯住那里。我从他那热切的面部表情里看得出来，这地方对他关系多么重大啊，第一次看到那怪异的、被同族人掌管了那么久的、处处都能引起人们对他们深深回忆的地方。他穿着苏格兰呢的服装，说话时带着美洲口音，坐在一节普普通通的火车车厢的角落里，可是每当我看到他那黝黑而富于表情的面孔的时候，我就愈加感觉到他真真是那支高贵、热情的家族的后裔，而且具有一家之主的风度。在他那浓浓的眉毛、神经质的鼻孔和栗色的大眼睛里显示着自尊、豪迈和力量。如果在那恐怖的沼地里，果真出现了什么困难和危险的事，他至少是个确实可靠的、会勇敢地担当起责任来的同志。\n\n火车在路旁的一个小站上停了下来，我们都下了车。在矮矮的白色栏杆外面，有一辆两匹短腿小马拉着的四轮马车在那里等着。我们的到来显然是件大事，站长和脚夫都向我们围了上来，带着我们搬行李。这里本是一个恬静、可爱而又朴实的地方，但是，在出口的地方，有两个穿着黑制服的、象军人似的人站在那里，却不由得使我感到诧异。他们的身体倚在不长的来复枪上，两眼直勾勾地瞧着我们走过去。马车夫是个身材矮小的家伙，相貌冷酷而又粗野，他向亨利·巴斯克维尔行了个礼。几分钟之后，我们就沿着宽阔的灰白色的大道飞驰而去了。起伏不平的牧草地，在大道的两侧向上隆起，穿过浓密绿荫的隙缝，可以看到一些墙头和屋顶都被修成人字形的古老的房屋，宁静的、阳光普照的村子后面出现了绵延不断的被傍晚的天空衬托出来的阴暗的沼地，中间还罗列着几座参差不齐的、险恶的小山。\n\n四轮马车又转入了旁边的一条岔路，我们穿过了被车轮在几世纪的时间里轧成的、深深陷入地面的小巷似的沟道，曲折上行，道路两侧都是长满着湿漉漉的苔藓和一种枝叶肥厚的羊齿植物的石壁。古铜色的蕨类和色彩斑驳的黑莓在落日的余辉之中闪闪发光。我们一直在往上走着，过了一座花岗石的窄桥，就沿着一条奔腾叫嚣的急流向前走去了。水流汹涌奔腾，泡沫喷溅，在灰色的乱石之间怒吼而过。道路在密生着矮小的橡树和枞树的峡谷之中，沿着曲折迂回的小河蜿蜒溯流而上。在每一转折处，巴斯克维尔都要高兴得欢呼起来，他急切地向四周环顾着，一面向我们问着无数的问题。在他看来，什么都是美丽的，可是我总觉得这一带乡间有一些凄凉的味道和明显的深秋的景象。小路上铺满了枯黄的树叶，在我们经过的时候，又有些树叶翩翩飞舞地由头顶上飘落下来。当我们的马车从枯叶上走过时，辚辚的轮声静了下来——\n\n这些东西在我看来都是造物主撒在重返家园的巴斯克维尔家族后裔车前的不祥的礼物。\n\n“啊！”摩梯末医生叫了起来。“那是什么？”\n\n前面出现了满复着石南一类常青灌木的陡斜的坡地，这是突出在沼地边缘的一处地方。在那最高的地方，有一个骑在马上的士兵，清清楚楚的，就象是装在碑座上的骑士雕像似的，黝黑而严峻，马枪作预备放射的姿势搭在伸向前方的左臂上。他在监视着我们所走的这条道路。\n\n“那是干什么的啊，波金斯？”摩梯末医生问道。\n\n车夫在座位上扭转身来说道：“王子镇逃走了一个犯人，先生，到现在为止，他已经逃出来三天了，狱卒们正监视着每一条道路和每个车站，可是至今还没有找到他的踪迹呢。附近的农户们很感不安，老爷，这倒是真的。”\n\n“啊，我知道，如果谁能去通风报信的话，就能拿到五镑的赏金呢。”\n\n“是啊，老爷，可是如果和可能会被人割断喉管相比起来，这种可能拿到的五镑钱，就显得太可怜了。您要知道，这可不是个普普通通的罪犯啊。他是个肆无忌惮的人。”\n\n“那么，他究竟是谁呀？”\n\n“他叫塞尔丹，就是那个在瑙亭山杀人的凶手。”\n\n那件案子我记得很清楚，他的罪行极端残忍，全部暗杀的过程都贯串着绝顶的暴行，因而此案曾引起了福尔摩斯的兴趣。后来所以减免了他的死刑，是由于他的行为出奇地残暴，人们对他的精神状态是否健全发生了一些怀疑。我们的马车爬上了斜坡的顶巅，面前出现了广袤的沼地，上面点缀着很多圆锥形的石冢和凹凸不平的岩岗，色彩斑驳，光怪陆离。一股冷风从沼地上吹来，使我们都打起了寒战。在那荒无人迹的平原上，这个魔鬼似的人，不定在哪一条沟壑之中象个野兽似地潜藏了起来，他内心充满着对摈弃他的那些人们的憎恨。光秃秃的荒地，冷飕飕的寒风和阴暗的天空，再加上这个逃犯，就益发显得恐怖了。即使巴斯克维尔也沉默了，他把大衣裹得更紧了些。\n\n丰饶的乡区已落在我们的后下方，我们回头遥望了一下，夕阳斜照，把水流照得象金丝一般，照得初耕的红色土地和宽广的密林都在闪烁发光。前面赤褐色和橄榄色斜坡上的道路益发变得荒芜萧瑟了，到处罗列着巨石。我们时而路过一所沼地里的小房，墙和屋顶都是用石料砌成的，墙上也没有蔓藤掩饰它那粗糙的轮廓。我们俯望下面，忽然看到了一处象碗似的凹地，那里长着小片小片的因年久而被狂风吹弯了的发育很坏的橡树和枞林。在树林的顶上，伸出了两个又细又高的塔尖。车夫用鞭子指了指说道：“这就是巴斯克维尔庄园。”\n\n庄园的主人站了起来，双颊泛红，目光炯炯地望着，几分钟后，我们就到了寓所门口。大门是用稠密的、曲折交织成奇妙花样的铁条组成的，两侧各有一根久经风雨侵蚀的柱子，由于长了苔藓而显得肮脏了，柱顶装有石刻的巴斯克维尔家的野猪头。门房已经成了一堆坍塌的黑色花岗石，并露出了一根根光秃的椽木。可是它的对面却是一座新的建筑，刚建成了一半，是查尔兹爵士首次用由南非赚来的黄金兴建的。\n\n一进大门就走上了小道。这时，车轮因走在枯叶上而沉静了下来，老树的枝丫在我们的头顶上交织成一条阴暗的拱道。穿过长而阴暗的车道，看到了末端有一所房屋象幽灵似地在发着亮光，巴斯克维尔不由得战栗了一下。\n\n“就是在这里发生的吗？”他低声地问道。\n\n“不，不是，水松夹道在那一边。”\n\n这位年轻的继承人面色阴郁地向四周眺望着。\n\n“在这样的地方，难怪我伯父会总觉得要大难临头了，”他说道，“足以让任何人恐惧呢。我决定在六个月内在厅前装上一行一千支光的天鹅牌和爱迪生牌的灯泡，到那时您就要再也认不得这个地方了。\n\n道路通向一片宽阔的草地，房子就在我们的面前了。在暗淡的光线之下，我看得出中央是一幢坚实的楼房，前面突出着一条走廊。房子的前面爬满了常春藤，只有在窗户或装有盾徽的地方被剪去了，就象是在黑色面罩的破处打上的补钉似的。中央这座楼的顶上有一对古老的塔楼，开有枪眼和很多了望孔。在塔楼的左右两侧，各有一座式样更新的、用黑色花岗岩建成的翼楼。暗淡的光线，射进了窗棂坚实的窗口，装在陡峭而倾斜的屋顶上的高高的烟囱里喷出了一条黑色的烟柱。", "is_ending": false, "clues": ["荷枪实弹的骑兵在荒原路口盘查：诺丁山杀人凶犯塞尔登自达特穆尔监狱越狱脱逃", "巴斯克维尔庄园阴森肃穆的双塔与布满常春藤的高大花岗岩古建", "面带阴郁之气的管家白瑞摩及其苍白哀伤的妻子出迎"], "choices": [{"id": "ch6_p1_c1", "text": "持枪就寝，在庄园卧室中警惕倾听深夜的风吹草动。", "target": "ch06_part2_night_sob", "pov_switch": null, "pov_switch_name": null}, {"id": "ch6_p1_c2", "text": "就寝前环视阴暗的大厅与历代祖先画像，感受古宅气氛。", "target": "ch06_part2_night_sob", "pov_switch": null, "pov_switch_name": null}, {"id": "ch6_p1_c3", "text": "【视角切换：歇洛克·福尔摩斯】查看福尔摩斯在黑色岩岗史前石屋的隐蔽指挥所。", "target": "holmes_ch06_part2_hut_surveillance", "pov_switch": "holmes", "pov_switch_name": "歇洛克·福尔摩斯"}, {"id": "ch6_p1_c4", "text": "【视角切换：杰克·斯台普吞】自梅利琵宅邸与大格林盆泥潭监视庄园动静。", "target": "stapleton_ch06_part1_arrival_watch", "pov_switch": "stapleton", "pov_switch_name": "杰克·斯台普吞"}]}, "ch06_part2_night_sob": {"id": "ch06_part2_night_sob", "title": "第六章 巴斯克维尔庄园（下：午夜的哭声）", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "branch", "anchor_name": null, "content": "“亨利爵爷，欢迎！欢迎您到巴斯克维尔庄园来！”\n\n一个高个子的男人由走廊的阴影中走了出来，打开了四轮马车的车门。在厅房的淡黄色的灯光前面，又出现了一个女人的身影，她走出来帮助那人拿下了我们的行李袋。\n\n“亨利爵士，如果我要一直赶回家去您不会见怪吧？”摩梯末医生说道，“我太太在等着我呢。”\n\n“您还是等一下吃了晚饭再回去吧。”\n\n“不，我一定得走，也许家中已经有事在等着我干呢。我本该留下来领您看一看房子，但若拿白瑞摩和我比较起来，他却是个更好的向导呢。再见吧，不分昼夜，只要我能帮助的话，就马上去叫我好了。”\n\n亨利爵士和我一进厅堂，小路上的车轮声就听不到了，身后随着发出了沉重的关门声。我们所在的房间确是华美，又高又大，因年代久远而变成了黑色的椽木巨梁密密地排着。在高高的铁狗雕像后面，巨大的旧式壁炉里面，木柴在劈啪爆裂地燃烧着。亨利爵士和我伸手烤火取暖，因为长途乘车，弄得我们都浑身麻木了。后来我们又向四周环顾了一番，看到狭长的、装着古老的彩色玻璃的窗户，橡木做的嵌板细工，牡鹿头的标本，以及墙上所挂的盾徽，在中央大吊灯柔和的光线照耀下，都显得幽暗而阴郁。\n\n“正如我所想象的那样，”亨利爵士说道，“难道这不恰恰是一个古老的家庭应有的景象吗？这就是我家的人们住了五百年的大厅，一想到这些就使我感到沉重。”\n\n当他向四周环顾的时候，我看得出来，在他那黝黑的面孔上燃起了孩童般的热情。在他站立的地方虽有灯光照射，可是墙上长长的投影和黑黝黝的天花板就象在他的头顶上张开了一座天棚似的。白瑞摩把行李送进我们的居室以后又回来了。他以受过良好训练的仆役所特有的服从的态度，站在我们的面前。他是个仪表非凡的人，高高的身材，相貌漂亮，剪得方方正正的黑胡须，有一副白皙而出色的面貌。\n\n“爵爷，您愿意马上吃晚饭吗？”\n\n“已经准备好了吗？”\n\n“几分钟之内就能准备好，爵爷。你们的屋里已经预备了热水，亨利爵士，在您作出新的安排以前，我的妻子和我很愿意和您呆在一起，可是您得了解，在这种新的情况下，这所房子里就需要相当多的佣人。”\n\n“什么新的情况？”\n\n“爵爷，我不过是说，查尔兹爵爷过的是非常隐遁的生活，因此我们还可以照顾得了他的需要，而您呢，当然希望有更多的人和您同居一起，因此您必然会需要将家事情况加以改变。”\n\n“你是说，你和你的妻子想要辞职吗？”\n\n“爵爷，这当然要在对您很方便的时候才行。”\n\n“可是你们一家已经和我家的人同居了好几代了，不是吗？如果我一开始在这里生活便断绝了这条由来已久的家庭联系，那我真要感到遗憾了。”\n\n我好象在这管家的白皙的面孔上看出了一些感情激动的迹象。\n\n“我也这样觉得，爵爷，我的妻子也是一样。说实话，爵爷，我们两人都是很敬爱查尔兹爵士的，他的死使我们大为震惊，这里周围的环境，处处都使我们感到十分痛苦。我怕在巴斯克维尔庄园里我们的内心再也不会得到安宁了。”\n\n“可是你想怎么办呢？”\n\n“爵爷，我确信，如果我们做点儿生意，一定会成功的。\n\n查尔兹爵爷的慷慨大量，已使我们有可能这样去做了。可是现在，爵爷，我最好还是先领您看看您的房间去吧。”\n\n在这古老的厅堂的上部，有一周装有回栏的方形游廊，要通过一段双叠的楼梯才能上去。由中央厅堂伸出两条长长的甬道一直穿过整个建筑，所有的寝室都是开向这两条甬道的。\n\n我和巴斯克维尔的寝室是在同一侧的，并且几乎是紧紧相邻，这些房间看来要比大楼中部房间的样式新得多，颜色鲜明的糊墙纸和点着的无数蜡烛多少消除了在我们刚到时留在脑中的阴郁的印象。\n\n可是开向厅堂的饭厅则是个晦暗阴郁的处所，这是一间长形的屋子，有一段台阶把屋子由中间分成高低不同的两部分，较高部分为家中人进餐之所，较低部分则留给佣人们使用。在一端的高处建有演奏廊。乌黑的梁木横过我们的头顶，再上面就是被熏黑了的天花板了。如果用一排盛燃的火炬把屋子照亮，在一个丰富多采、狂欢不羁的古老的宴乐之中，这严峻的气氛也许能被缓和下来，可是现在呢？两位黑衣绅士坐在由灯罩下面照出来的不大的光环之内，说话的声音都变低了，而精神上也感受到压抑。一排隐隐现出的祖先的画像，穿着各式各样的服装，由伊丽莎白女皇时代的骑士起，直至乔治四世皇太子摄政时代的花花公子止，他们都张目注视着我们，沉默地陪伴着我们，威慑着我们。我们很少说话，我很高兴这顿饭总算是吃完了，我们可以到新式的弹子房去吸一支烟了。\n\n“说实话，我觉得这里真不是一个能使人很愉快的地方，”\n\n亨利爵士说道，“我本以为可以逐渐习惯于这样的环境呢，可是现在我总感觉有点不对劲。难怪我伯父单独住在这样一所房子里会变得心神不安呢。啊，如果您愿意的话，咱们今晚早些休息，也许在清晨时分事物会显得更使人愉快些呢。”\n\n我在上床以前拉开了窗帘，由窗内向外眺望了一番。这窗是向厅前草地开着的，再远一些又有两丛树，在愈刮愈大的风中呻吟摇摆。由竞相奔走的云朵的缝隙之中露出了半圆的月亮。在惨淡的月光之下，在树林的后面，我看到了残缺不齐的山岗边缘和绵长低洼、缓缓起伏的阴郁的沼地。我拉上了窗帘，觉得我当时的印象和以先所得的印象还是一致的。\n\n可是这还不算是最后的印象呢。我虽感疲倦，可是又不能入睡，辗转反侧，愈想睡愈睡不着。古老的房屋被死一般的沉寂笼罩了，远处传来了报时的钟声，一刻钟一刻钟地打着。可是后来，突然间，在死寂的深夜里，有一种声音传进了我的耳鼓，清晰而又响亮。决不会弄错，是个妇女啜泣的声音，象是一个被按捺不住的悲痛折磨着的人所发出的强忍着的和哽噎的喘息。我在床上坐了起来，聚精会神地听着。这声音不可能是来自远处的，而且可以肯定，就是在这所房子里。我就这样，每根神经都紧张地等了半小时，可是除了钟的敲打声和墙外常春藤的窸窣声之外，再也没有传来别的声音。", "is_ending": false, "clues": ["华生于凌晨两点被走廊深处传来的女人凄惨抽泣声惊醒", "白瑞摩坚称妻子安睡未哭，但华生在早饭时敏锐察觉白瑞摩太太双眼红肿", "电报调查发现电报实际由白瑞摩太太代收，白瑞摩当时在伦敦的不在场证明失效"], "choices": [{"id": "ch6_p2_c1", "text": "漫步走向荒原，探查梅利琵宅邸与格林盆泥潭周边动静。", "target": "ch07_part1_naturalist", "pov_switch": null, "pov_switch_name": null}, {"id": "ch6_p2_c2", "text": "前往格林盆邮局核实白瑞摩接发电报的具体细节。", "target": "ch07_part1_naturalist", "pov_switch": null, "pov_switch_name": null}]}, "ch07_part1_naturalist": {"id": "ch07_part1_naturalist", "title": "第七章 梅利琵宅邸的主人斯台普吞（上：博物学者与格林盆泥潭）", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "anchor", "anchor_name": "anchor_mire", "content": "第二天早晨的清新美景，多少消除了我们初见巴斯克维尔庄园时所产生的恐怖与阴郁的印象。当巴斯克维尔爵士和我坐下来吃早饭的时候，阳光已由高高的窗棂中散射进来，透过装在窗上的盾徽形窗玻璃投射出一片片淡弱无力的色光，深色的护墙板被金色的阳光照得发出象青铜色的光辉；要说这就是昨晚在我们的心灵上投以暗影的那个房间，实在难以令人相信。\n\n“我想这只能怪咱们自己，而不能怪房子！”准男爵说道，“那时，咱们由于旅途劳顿，乘车寒冷，以致对这地方产生了不快的印象。现在，咱们的身心已经焕然一新，所以又感到很愉快了。”\n\n“可是，这还不仅仅是想象的问题，”我回答道，“比如说吧，您听到了有人——我想是个妇女，——在夜里哭泣吗？”\n\n“真是奇怪，我在半醒半睡的时候确实听到过哭声。我等了很久，可是再也听不到了，因此我就肯定了那都是做梦。”\n\n“我听得清清楚楚，而且我敢肯定地说，是女人的哭声。”\n\n“咱们得马上将这事问清楚。”他摇铃叫来了白瑞摩，问他是否能对我们所听到的哭声给以解释。据我看来，总管听到主人所问的问题之后，苍白的面孔变得更加苍白了。\n\n“亨利爵爷，在这房子里只有两个女人，”他回答道，“一个是女仆，她睡在对面厢房里；另一个就是我的妻子，可是我敢保证，哭声决不是由她发出来的。”\n\n可是后来证明他竟是撒谎，因为在早饭之后，我碰巧在长廊上遇到了白瑞摩太太，阳光正照着她的脸，她是个体格高大、外表冷淡、身体胖胖的女人，嘴角上带着严肃的表情。\n\n可是她的两眼无可掩饰地都红着，还用红肿着的眼睛望了我一下。这么说，夜间哭的就是她了。如果她确是哭过，她丈夫就一定知其原委，可是他居然冒着显然会被人发现的危险否认事实。他为什么要这样做呢？还有，她为什么哭得那样伤心呢？在这面孔白皙、漂亮、蓄着黑胡须的人的周围，已经形成了神秘而凄惨的气氛。是他第一个发现了查尔兹爵士的尸体，而且我们也只由他那里才得到了关于将那老人引向死亡的有关情况的介绍。可能吗？难道我们在摄政街所看到的那辆马车里的那个人就是白瑞摩吗？胡须很可能是相同的。\n\n马车夫形容的是个身材相当矮小的人，可是这样的印象很可能是错误的。我怎样才能弄清这一点呢？显然，首先该做的就是去找格林盆的邮政局长，弄清那件试探性的电报是否真的当面交给了白瑞摩。无论答案如何，我至少应该有些能向歇洛克·福尔摩斯报告的事。\n\n早餐之后，亨利爵士有很多文件要看，因此这段时间恰好可以让我出门了。这是一次令人愉快的散步，我沿着沼地的边缘走了四英里路，最后走到了一个荒凉单调的小村，村中有两所较其余都高的大房子，事后知道一所是客栈，一所是摩梯末医生的房子，那位邮政局长——又是本村的食品杂货商，对那封电报记得很清楚。*\n\n“肯定的，先生，”他说道，“我是完全按照指示叫人将那封电报送交白瑞摩先生的。”\n\n“谁送去的？”\n\n“我的小孩送去的。杰姆士，上星期是你把那封电报送交住在庄园的白瑞摩先生的，是不是？”\n\n“是的，爸爸，是我送的。”\n\n“是他亲手收到的吗？”我问道。\n\n“啊，当时他正在楼上呢，所以我没有能亲自交到他手，可是，我把它交到了白瑞摩太太的手里了，她答应说马上就送上去。”\n\n“你看到白瑞摩先生了吗？”\n\n“没有，先生，我跟您说他是在楼上呢。”\n\n“如果你并没有看到他，你怎么能知道他是在楼上呢？”\n\n“噢，当然他自己的妻子应该知道他在什么地方啊！”邮政局长有些愠怒地说道，“究竟他收到了那份电报没有？如果发生了任何差错，也应该是白瑞摩先生自己来质问啊。”\n\n要想继续这件调查似已无望了，可是有一点是很清楚的，虽然福尔摩斯使用了巧计，我们仍未能证明白瑞摩一直也没有去过伦敦。假设事实就是如此——假设他就是最后看到查尔兹爵士还活着的人，就是首先跟踪刚刚回到英伦的新继承人的人，那又怎么样呢？他是受别人的指使呢，还是另有个人的阴谋呢？害巴斯克维尔家的人对他会有什么好处呢？我想起了用《泰晤士报》评论剪贴而成的警告信。这是否就是他干的呢，还是可能有谁因为决心要反对他的阴谋而干的呢？\n\n唯一能想象得出的就是亨利爵士所猜测过的那种动机，那就是说，如果庄园的主人能被吓跑的话，那么白瑞摩夫妇就能到手一个永久而舒适的家了。可是这样一种解释，对于如同环绕年轻的准男爵织成一面无形罗网的、深谋远虑的阴谋来说，确乎十分不当。福尔摩斯本人曾说过，在他那一长串惊人的侦探案里，再没有过比这更复杂的案子了。在我沿着颜色灰白而又孤寂的道路回来的途中，心里默默地祷告着，愿我的朋友能从他的事务中脱身到这里来，从我的双肩上卸下这份沉重的责任吧。\n\n忽然一阵跑步声和唤着我名字的声音打断了我的思路，我转过身去，心想一定是摩梯末医生，但是很使我惊奇，追我的竟是一个陌生人。他是个矮小瘦削、胡子刮得很干净和面貌端正的人，长着淡黄色的头发，下巴尖瘦，大约三四十岁的样子，穿着一身灰色衣服，戴着草帽，肩上挂着一只薄薄的植物标本匣，一只手里拿着一把绿色的捕蝶网。\n\n“我相信您一定会原谅我的冒昧无礼，华生医生，”当他喘着气跑到我跟前的时候说道，“在这片沼地里，人们都象是一家人似的，彼此相见，都不用等着正式的介绍。我想您从咱们的朋友摩梯末医生那里可能已经听说过我的姓名了，我就是住在梅利琵的斯台普吞。”\n\n“您的木匣和网就已经很清楚地告诉我了，”我说道，“因为我早就知道斯台普吞先生是一位生物学家。可是您怎么会认识我呢？”\n\n“在我拜访摩梯末医生的时候，您正从他的窗外走过，于是，他就把您指给我看了。因为咱们走的是一条路，所以我想赶上您来作个自我介绍。我相信亨利爵士的这趟旅行一切都好吧？”\n\n“谢谢您，他很好。”\n\n“在查尔兹爵士惨死之后，我们都担心这位新来的准男爵也许会不愿住在这里呢。要想使一位有钱的人屈尊埋没在这样一个地方，确实有点说不过去。可是，用不着我多说，这一点对乡鄙之地说来，确实是关系重大呢。我想，亨利爵士对这件事不会有什么迷信的恐惧心理吧？”\n\n“我想大概不会吧。”\n\n“您一定听说过关于缠着这一族人的魔鬼似的猎狗的那件传说吧？”\n\n“我听说过了。”\n\n“这里的农民们真是太容易轻信传闻了！他们每个人都能发誓说，在这片沼地里曾经见到过这样一只畜生。”他说话时带着微笑，可是我好象从他的眼里看得出来，他对这件事情的态度很认真呢。“这事在查尔兹爵士的心理上产生了很大的影响。我肯定地相信，就因为这件事才使得他落得这样悲惨的结局。”\n\n“怎么会呢？”\n\n“他的神经已紧张到一看见狗就会对他那有病的心脏发生致命影响的程度。我估计他临死的那天晚上，在水松夹道里，他真的看到了什么类似的东西。过去我常担心会发生什么灾难，因为我很喜欢那位老人，而且我也知道他的心脏很弱。”\n\n“您怎么会知道这一点呢？”\n\n“我的朋友摩梯末告诉我的。”\n\n“那么，您认为是有一只狗追着查尔兹爵士，结果他就被吓死了吗？”\n\n“除此以外您还有什么更好的解释吗？”\n\n“我还没有作出任何结论呢。”\n\n“歇洛克·福尔摩斯先生呢？”\n\n这句话使我刹时间屏住了呼吸，可是再一看我那同伴的温和平静的面孔和沉着的目光，才又觉得他并非故意要使我惊讶。\n\n“要想让我们假装不认识您，那是毫无用处的，华生医生，”他说道，“我们在这里早已看到了您那侦探案的记述了，而且您也无法做到既赞扬了您的朋友，而又不使您自己闻名。\n\n当摩梯末对我谈起您的时候，他也无法否认您的身份。现在您既然到了这里，那么显然是歇洛克·福尔摩斯先生本人也对这件事发生了兴趣，而我呢，自然也就很想知道一下他对这件事的看法究竟如何了。”\n\n“恐怕我回答不了这个问题。”\n\n“冒昧地请问一下，他是否要赏光亲自来这儿呢？”\n\n“目前他还不能离开城里。他在集中精力搞别的案子呢。”\n\n“多么可惜！他也许能把这件难解的事给我们搞出些端倪来呢。当您在进行调查的时候，如果我能效劳的话，尽管差遣好了。如果我能知道您的疑问或是您准备如何进行调查，我也许马上就能予以协助或提出建议来呢。”\n\n“请您相信，我在这里不过是来拜访我的朋友亨利爵士，而且我也不需要任何协助。”\n\n“好啊！”斯台普吞说道，“您这样的小心谨慎完全是正确的。我受到训斥完全是罪有应得，因为我的想法只是没有道理的多管闲事。我向您保证，以后再也不提这件事了。”\n\n我们走过了一条狭窄多草的由大道斜岔出去的小路，曲折迂回地穿过沼地。右侧是陡峭的乱石密布的小山，多年前已被开成了花岗岩采石场；向着我们的一面是暗色的崖壁，隙罅里长着羊齿植物和荆棘；在远处的山坡上，浮动着一抹灰色的烟雾。\n\n“顺着这条沼地小径慢慢走一会儿，就能到梅利琵了，”他说道，“也许您能匀出一小时的时间来吧，我很愿意把您介绍给我的妹妹。”\n\n我首先想到我应当陪伴着亨利爵士，可是随后又想起了那一堆满满地堆在他书桌上的文件和证券，当然在这些事情上我是无法帮他忙的，而且福尔摩斯还曾特意地说过，我应当对沼地上的邻人们加以考察，因此我就接受了斯台普吞的邀请，一起转上了小路。\n\n“这片沼地可真是个奇妙的地方，”他说道，一面向四周环顾。起伏不平的丘原，象是绵延的绿色浪潮；参差不齐的花岗岩山巅，好象是被浪涛激起的奇形怪状的水花。“您永远也不会对这沼地感到厌烦的，沼地里绝妙的隐秘之处您简直就无法想象，那样的广大，那样的荒凉，那样的神秘。”\n\n“那么说，您对沼地一定知道得很清楚啰？”\n\n“我在这里才只住了两年，当地居民还把我称作新来的呢，我们来的时候，查尔兹爵士也是刚在这里住下没有多久。\n\n我的兴趣促使我观察了这乡间的每一部分，所以我想很少有人能比我对这里知道得更清楚了。”\n\n“要想弄清楚是很难的事吗？”\n\n“很难。您要知道，比如说吧，北面的这个大平原，中间矗起了几座奇形怪状的小山。您可看得出来有什么特殊之处吗？”\n\n“这倒是个少有的纵马奔驰的好地方。”\n\n“您自然会这样想，可是到现在为止，这种想法已不知葬送了多少性命了。您看得见那些密布着嫩绿草地的地方吗？”\n\n“是啊，看来那地方要比其他地方更肥沃些呢。”\n\n斯台普吞大笑起来。\n\n“那就是大格林盆泥潭，”他说道，“在那里只要一步不小心，无论人畜都会丧命的。昨天我还看到一匹沼地的小马跑了进去，它再也没有出来。过了很长时间我还看到它由泥坑里探出头来，可是最后终于陷了进去。就是在干燥的月份，穿过那里也是危险的。下过这几场秋雨之后，那里就更加可怕了。可是我就能找到通往泥潭中心去的道路，并且还能活着回来。天哪！又是一匹倒霉的小马陷进去了。”\n\n这时，我看到那绿色的苔草丛中，有个棕色的东西正在上下翻滚，脖子扭来扭去地向上伸着，随后发出一阵痛苦的长鸣，可怕的吼声在沼地里起着回音。吓得我好象浑身都凉了，可是他的神经似乎比我要坚强些。\n\n“完了！”他说道，“泥潭已经把它吞没了。两天之内就葬送了两匹，今后，说不定还会陷进多少匹去呢；因为在干燥的天气里，它们已习惯于跑到那里去，可是它们在被泥潭缠住以前是不会知道那里天旱和雨后的不同的。格林盆大泥潭真是个糟糕的地方。”\n\n“但是您不是说您能穿得过去吗？”\n\n“是啊，这里有一条小路，只有动作很灵敏的人才能走得过去，我已经找到这条路了。”\n\n“可是，您为什么竟想走进这种可怕的地方去呢？”\n\n“啊，您看到那边的小山吗？那真象是周围被无法通过的、年代久远的泥潭隔绝了的小岛。如果您能有办法到那里去的话，那才是稀有植物和蝴蝶的生长之处呢。”\n\n“哪天我也去碰一碰运气。”\n\n他忽然脸上带着惊讶的表情望着我。\n\n“千万放弃这个念头吧，”他说道，“那样就等于是我杀了您。我敢说您难得会活着回来的，我是靠着记住某些错综复杂的地标才能到那里去的。”\n\n“天哪！”我喊了起来，“那是什么？”\n\n一声又长又低、凄惨得无法形容的呻吟声传遍了整个沼地，充满了整个空间，可是无法说出是从哪里发出来的。开始是模糊的哼声，然后变成了深沉的怒吼，再后来又变成了忧伤而有节奏的哼声。斯台普吞面带好奇的表情在望着我。\n\n“沼地真是个奇怪的地方！”他说道。\n\n“这究竟是什么呢？”\n\n“农民们说是巴斯克维尔的猎狗在寻找它的猎物。我以前曾听到过一两次，可是声音从没有象这样大过。”\n\n我心里害怕得直打冷战，一面向四周环顾点缀着一片片绿色树丛的起伏不平的原野。在广大的原野上，除了有一对大乌鸦在我们背后的岩岗上呱呱大叫之外，别无动静。\n\n“您是个受过教育的人，谅必不会相信这些无稽之谈吧？”\n\n我说道，“您认为这种奇怪的声音是从什么地方发出来的呢？”\n\n“泥潭有时也会发出奇怪的声音来的。污泥下沉或是地下水往上冒，或是什么别的原因。”\n\n“不，不，那是动物发出来的声音。”\n\n“啊，也许是。您听过鹭鸶叫吗？”\n\n“没有，从来没有听过。”\n\n“在英伦这是一种很稀有的鸟——几乎已经绝种了——\n\n可是在沼地里也许还有。是的，即使刚才我们听到的就是绝无仅有的鹭鸶的叫声，这也是不足为奇的。”\n\n“这真是我一生中所听到过的最可怕、最奇怪的声音了。”", "is_ending": false, "clues": ["梅利琵宅邸的博物学者杰克·斯台普吞，手持捕蝶网与标本盒巡游荒原", "亲眼目睹一匹小矮马陷入大格林盆泥潭的致命绿色泥淖中被活活吞没", "荒原深处回荡起沉闷、悠长而令人毛骨悚然的凄厉犬嚎"], "choices": [{"id": "ch7_p1_c1", "text": "走上前去迎候出现在荒原小径上的斯台普吞小姐。", "target": "ch07_part2_beryl_warning", "pov_switch": null, "pov_switch_name": null}, {"id": "ch7_p1_c2", "text": "注视斯台普吞狂热追逐罕见飞蛾扑向泥潭边缘的险恶身法。", "target": "ch07_part2_beryl_warning", "pov_switch": null, "pov_switch_name": null}]}, "ch07_part2_beryl_warning": {"id": "ch07_part2_beryl_warning", "title": "第七章 梅利琵宅邸的主人斯台普吞（下：绝望的警告）", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "branch", "anchor_name": null, "content": "“是啊，这里简直是个神秘可怕的地方。请看小山那边，您说那是些什么东西？”\n\n整个陡峭的山坡上都是灰色石头围成的圆圈，至少有二十堆。\n\n“是什么呢，是羊圈吗？”\n\n“不，那是咱们可敬的祖先的住处，在史前时期住在沼地里的人很多，因为从那时以后再没有人在那里住过，所以我们看到的那些安排的细微之处还和他们离开房子以前一模一样。那些是他们的缺了房顶的小屋。如果您竟因为好奇而到里面去走一趟的话，您还能看到他们的炉灶和床呢。”\n\n“真够个市镇的规模呢。在什么时候还有人住过呢？”\n\n“大约在新石器时代——没有确实的年代可考。”\n\n“他们那时干些什么呢？”\n\n“他们在这些山坡上牧放牛群，当青铜的刀开始代替石斧的时候，他们就学会了开掘锡矿。您看对面山上的壕沟，那就是挖掘的遗迹。是的，华生医生，您会发现沼地的一些很特别的地方的，噢，对不起，请等一会儿！一定是赛克罗派德大飞蛾。”\n\n一只不知是蝇还是蛾的东西横过了小路，翩翩地飞了过去，顷刻之间斯台普吞就以少有的力量和速度扑了过去。使我大吃一惊的是，那只小动物竟一直向大泥潭飞了过去，而我的朋友却挥舞着他那绿色的网兜，一步不停地在一丛丛小树中间跳跃前进着。他穿着灰色的衣服，加以猛然纵跳、曲折前进的动作，使他本身看来就宛如一只大飞蛾。我怀着既羡慕他那敏捷异常的动作又害怕他会在那莫测深浅的泥潭里失足的复杂心情，站在那里望着他往前追去。由于听到了脚步声，我转过身来，看到在离我不远的路边有一个女子，她是从浮游着一抹烟雾、说明是梅利琵所在之处的方向来的，因为一直被沼地的洼处遮着，所以直到她走得很近时才被我发现。\n\n我相信这位就是我曾听说过的斯台普吞小姐，因为在沼地里太太小姐很少，而且我还记得曾听人把她形容成是个美人。向我走过来的这个女人，的确是应归入最不平凡的类型的。兄妹相貌的不同，大概再也没有比这更显著的了。斯台普吞的肤色适中，长着淡色的头发和灰色的眼睛；而她的肤色呢，比我在英伦见过的任何深肤色型的女郎都更深，身材纤长，仪态万方。她生就一副高傲而美丽的面孔，五官那样端正，要不是配上善感的双唇和美丽的黑色而又热切的双眸的话就会显得冷淡了。她有着完美的身段，再加以高贵的衣着，简直就象是寂静的沼地小路上的一个怪异的幽灵。在我转过身来的时候，她正在看着她的哥哥，随后她就快步向我走了过来。我摘下了帽子正想说几句解释的话，她的话就把我的思潮引进了一条新路。\n\n“回去吧！”她说道，“马上回到伦敦去，马上就走。”\n\n我只能吃惊得发愣地盯着她。她的眼对我发着火焰似的光芒，一只脚不耐烦地在地上拍打着。\n\n“我为什么就应该回去呢？”我问道。\n\n“我不能解释。”她的声音低微而恳切，带有奇怪的大舌头似的声音，“可是看在上帝的面上，按照我所请求您的那样做吧，回去吧，再也不要到沼地里来。”\n\n“可是我刚才来啊！”\n\n“您这个人啊，您这个人哪！”她叫了起来，“难道您还看不出来这个警告是为您好吗？回伦敦去！今晚就动身！无论如何也要离开这个地方！嘘，我哥哥来了！关于我说过的话，一个字也不要提。劳驾您把杉叶藻那边的那枝兰花摘给我好吗？在我们这片沼地上兰花很多，您显然是来得太迟了，已经看不到这里的美丽之处了。”\n\n斯台普吞已经放弃了对那只小虫的追捕，回到了我们的身边，由于劳累而大喘着气，而且面孔通红。\n\n“啊哈，贝莉儿！”他说道。可是就我看来他那打招呼的语调并不热诚。\n\n“啊，杰克，你很热了吧？”\n\n“嗯，我刚才追一只赛克罗派德大飞蛾来着，是在晚秋时分很少见的一种。多可惜呀，我竟没有捉到！”他漫不经心地说着，可是他那明亮的小眼却不住地向我和那女子的脸上看来看去。\n\n“我看得出来，你们已经自我介绍过了。”\n\n“是啊，我正和亨利爵士说，他来得太晚了，已经看不到沼地的真正美丽之处了。”\n\n“啊，你以为这位是谁呀？”\n\n“我想象一定是亨利·巴斯克维尔爵士。”\n\n“不，不对，”我说道，“我不过是个卑微的普通人，是爵士的朋友，我是华生医生。”\n\n她那富于表情的面孔因懊恼而泛起了红晕。“我们竟然在误会之中谈起天来了。”她说道。\n\n“啊，没关系，你们谈话的时间并不长啊。”她哥哥说话时仍以怀疑的眼光看着我们。\n\n“我没有把华生医生当作客人，而是把他当作本地住户似地和他谈话，”她说道，“对他说来，兰花的早晚是没多大关系的。可是来吧，您不看一看我们在梅利琵的房子吗？”\n\n走了不多的路就到了，是一所沼地上的荒凉孤独的房子，在从前这里还繁荣的时候是个牧人的农舍，可是现在经过了修理以后，已经变成一幢新式的住宅了。四周被果园环绕着，可是那些树就象沼地里的一般的树似的，都是矮小的和发育很坏的，这地方整个都显出一种阴郁之色。一个怪异、干瘦、看来和这所房子很相配的、衣着陈旧褪色的老男仆把我们让了进去。面的屋子很大，室内布置得整洁而高雅，由此也能看出那位女士的爱好来。我从窗口向外望着，那绵延无际的、散布着花岗岩的沼地，毫无间断地向着远方地平线的方向起伏着。我不禁感到奇怪，什么原因使得这位受过高深教育的男子和这位美丽的女士到这样的地方来住呢？\n\n“选了个怪里怪气的地点，是不是？”他象回答我所想的问题似地说道，“可是我们竟能过得很快活，不是吗，贝莉儿？”\n\n“很快活。”她说道。可是她的语调却显得很勉强。\n\n“我曾经办过一所学校。”斯台普吞说道，“是在北方，那种工作对我这种性格的人来说，不免要感到枯燥乏味，但能够和青年们生活在一起，帮助和培养那些青年，并用个人的品行和理想去影响他们的心灵，这对我来说却是很可贵的。怎奈我们的运气不好，学校里发生了严重的传染病，死了三个男孩，经过这次打击，学校再也没有恢复起来，我的资金也大部分不可挽救地赔了进去。可是，如果不是因丧失了与那些可爱的孩子们同居共处之乐的话，我本可以不把这件不幸的事念念于怀的。因为我对动物学和植物学有着强烈的爱好，在这里我发现了无穷无尽的材料可供我进行研究，而且我妹妹也和我一样地深爱着对大自然的研究工作。所有这一切，华生医生，在观察着我们窗外的沼地的时候都已钻进了您的脑子，由您的表情里就看得出来。”\n\n“我确曾想到，这里的生活对您妹妹可能有些枯燥无味，也许对您还稍微好些。”\n\n“不，不，我从不感到枯燥。”她赶快说道。\n\n“我们有书，有我们的研究工作，而且我们还有着有趣的邻居。摩梯末医生在他那一界里是个最有学问的人了！可怜的查尔兹爵士也是可亲的同伴。我们对他知之甚深，并且对他还感到说不出的怀念。您认为我今天下午是否应该冒昧地去拜访一下亨利爵士呢？”*\n\n“我敢说，他一定会高兴见您的。”\n\n“那么，最好您顺便提一声，就说我打算这样作吧。也许在他习惯于这新的环境以前，我们能聊尽绵薄，以使他更方便些呢。华生医生，您愿意上楼看一看我所收集的鳞翅类昆虫吗？我想那已是在英伦西南部所能收集的最完整的一套了。\n\n等您看完的时候，午饭差不多也就预备好了。”\n\n可是我已急于要回去看我的委托人了。阴惨的沼地，不幸的小马的丧命和那与巴斯克维尔的猎狗的可怕的传说相关联的、令人毛骨悚然的声音，所有这些都给我的思想蒙上了一层忧伤的色彩。浮现在这些多少还是模糊的印象之上的，就是斯台普吞小姐的清楚、肯定的警告了。她当时谈话的态度又是那样的诚心诚意，使我无法再怀疑在这警告的后面必然有着深刻而严重的理由。我婉谢了一切使我留下来吃午饭的敦请，立刻就踏上了归途，顺着来时的那条长满野草的小路走了回去。\n\n好象是路熟的人一定能找到捷径似的，在我还没有走上大路的时候，我就大吃一惊地看到了斯台普吞小姐正坐在小路旁边的一块石头上。她由于经过剧烈运动，脸上泛出了美丽的红晕，两手叉着腰。\n\n“为了截住您，我一口气就跑来了，华生医生，”她说道，“我甚至连帽子都没有来得及戴。我不能在这里久停，否则我哥哥就要因我不在而感到寂寞了。对我所犯的愚蠢的错误，我想向您致以深深的歉意，我竟把您看成了亨利爵士。请把我所说过的话忘掉吧，这些话与您是毫无关系的。”\n\n“可是我是忘不掉的，斯台普吞小姐，”我说道，“我是亨利爵士的朋友，我非常关心他的幸福。告诉我吧，为什么您那么急切地认为亨利爵士应当回到伦敦去呢？”\n\n“不过是女人的一时之念罢了，华生医生。等您对我了解得更深一些的时候，您就会知道，我对我自己的一言一行并不是都能说出个道理来的。”\n\n“不对，不对。我还记得您那发抖的声调，我还记得您那时的眼神。喔，请您对我坦白地讲吧，斯台普吞小姐，从我一到这里起，我就感到周围都是疑团。生活已经变得象格林盆泥潭一样了，到处都是小片小片的绿丛，人们会在那里陷入地里，而没有向导能给他指出一条脱身的道路。告诉我吧，您究竟是什么意思，我答应您一定把您的警告转达给亨利爵士。”\n\n她的脸上刹时间闪现了一种犹豫不决的表情，可是在她回答我的时候，她的两眼马上又变得坚决起来了。\n\n“您想得太多了，华生医生，”她说道，“我哥哥和我听到了查尔兹爵士的噩耗以后，都非常震惊。我们和这位老人相知甚深，因为他最喜欢穿过沼地到我们的房子这边来散步。他深深地受着笼罩着他家的厄运的影响。在这悲剧发生之后，我自然而然地感觉到，他所表现的恐惧绝非出之无因。现在当这家又有人到这里来住的时候，我感到担心，因此我觉得，对于可能又降临在他身上的危险，应该提出警告来。这就是我想传达给他的全部的意思。”\n\n“可是，您所说的危险是什么呢？”\n\n“您知道那个猎狗的故事吧？”\n\n“我不相信这种无稽之谈。”\n\n“可是我相信。如果您还能影响亨利爵士的话，就请您把他从对他们一家说来永远是个致命的所在带走吧。四海之大，尽有安身之处，为什么他偏偏愿意住在这个危险的地方呢？”\n\n“正因为这是个危险的地方，他才到这里来住的，亨利爵士的性格就是这样。除非您能再供给我一些比这更加具体的材料，否则，若想让他离开这里恐怕是不太容易的。”\n\n“我再说不出任何具体的东西来了，因为我根本就不知道任何具体的东西。”\n\n“我要再问您一个问题，斯台普吞小姐。如果说，您当初和我说的时候寓意只不过如此的话，为什么您不愿让您哥哥听到您的话呢？这里面并没有值得他或是任何人反对的地方啊。”\n\n“我哥哥很希望这座庄园能有人住下来，因为他认为这样对沼地上的穷人们会有些好处。如果他知道我说了什么可能会使亨利爵士离开这里的话，他可能会大发雷霆呢。现在我已尽了我的责任了，我再不说什么了。我得回去了，否则他看不见我，就会怀疑我是来和你见面了。再见吧！”她转身走去，几分钟之内就消失在乱石之中了，而我就怀着莫名的恐惧赶回了巴斯克维尔庄园。", "is_ending": false, "clues": ["斯台普吞小姐误将华生当作亨利·巴斯克维尔爵士", "她语气焦急而热烈地严厉警告：‘回去吧！马上回到伦敦去，马上就走！’", "斯台普吞突然折返，迫使她匆忙掩饰，假称这只是无根据的女人忧虑"], "choices": [{"id": "ch7_p2_c1", "text": "起草华生医生的第一份详尽报告，寄往伦敦贝克街福尔摩斯处。", "target": "ch08_watson_report", "pov_switch": null, "pov_switch_name": null}, {"id": "ch7_p2_c2", "text": "反复思量斯台普吞小姐眼中的极度恐惧与冒死警告背后的真相。", "target": "ch08_watson_report", "pov_switch": null, "pov_switch_name": null}]}, "ch08_watson_report": {"id": "ch08_watson_report", "title": "第八章 华生医生的第一份报告", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "anchor", "anchor_name": "anchor_first_report", "content": "从此以后，我要按照事情发生的前后，把放在我面前的桌子上的、我写给歇洛克·福尔摩斯先生的信件抄录下来。虽然其中一篇已经遗失，但我相信我现在所写的内容与事实绝无出入。我对这些可悲的事件记忆得很清楚，可是这些信总还是能更准确地说明我当时的感觉和怀疑的。\n\n我亲爱的福尔摩斯：我以前发的信和电报，谅已使你及时地了解了在这个最荒凉的角落里所发生的一切。一个人在这里呆得愈久，沼地的神貌就会愈深地渗入你的心灵，它是那样的广大，具有那样可怕的魔力。只要你一到了沼地的中心，你就要看不到近代英国的丝毫的痕迹了：可是另一方面，你在这里到处都能看到史前人的房屋和劳动成果。在你散步的时候，四周都是这些被人遗忘的人们的房屋，还有他们的坟墓和粗大的石柱，这些石柱，可能就标明了他们的庙宇之所在。当你在斑驳的山坡上看到那些用灰色岩石建成的小屋的时候，你就会忘记你现在所处的年代了，如果你竟看到从低矮的门洞里爬出一个身披兽皮、毛发茸茸的人，将燧石箭头的箭搭在弓弦上，你会感到他的出现比你本人在这里还要自然得多呢。奇怪的倒是在这一直都是最贫瘠的土地上，他们竟会住得那样稠密。我并不是个考古学家，可是我能想象得出，他们都是些不喜争斗而受人蹂躏的种族，被迫接受了这块谁也不愿居住的地方。\n\n显然，这些都是和你将我派来这里执行的任务毫无关系的东西，而且对你这样最讲求实际的人来说，可能会感到很乏味。我还记得在谈到究竟是太阳围着地球转还是地球围太阳转这个问题的时候，你的那种漠不关心的态度。还是让我回到关于亨利·巴斯克维尔爵士的事情上来吧。\n\n如果说你前些天没有收到任何报告的话，那是因为一直还没有发生过什么值得报告的重要情况。可是，后来发生了一件很惊人的事情，我现在就一五一十地向你报告吧。首先，我得使你对于整个情况中的其他一些有关的因素有个了解。\n\n其中之一就是我很少谈到的沼地里的那个逃犯。现已完全可以相信，他已经跑了，这对在本区住得很分散的居民说来，是可以大大地松一口气了。从他逃跑以来已有两星期了，在这期间，没有人看见过他，也没有听到过关于他的消息。确实很难想象，他在这段时间内能始终坚持呆在沼地里。当然了，如果单就藏匿这个问题来看，他是毫无困难的，任何一所石头小房都可以作为他的藏身之所。可是除非他能捕杀沼地里的羊，否则他是什么吃的东西都没有的。因此我们就认为他已经逃走了，而那些住得边远的农民们也就可以睡得稍为安心些了。\n\n我们这里一起住着四个身强力壮的男人，因此我们还能很好地照顾自己。可是坦白地说，我一想起斯台普吞这一家来，心中就感到不安。他们住的地方是一处方圆几英里之内孤立无援的所在，家中只有一个女仆、一个老男仆和他们兄妹二人，而这个哥哥也不是个很强壮的人。如果这个来自瑙亭山的逃犯一旦闯进门去的话，落在这样一个不要命的家伙手里，他们真会被弄得束手无策呢。亨利爵士和我都很关心他们的情况，并且还曾建议让马夫波金斯到他们那边去睡，可是斯台普吞却不以为然。\n\n事实上，咱们的朋友——这位准男爵，对我们的女邻居已开始表现出相当大的兴趣来了。这本是不足为奇的事，对他这样一个好动的人来说，在这样一个孤寂的地方实在无聊得很，而她又是个很动人的美女。在她身上，有着一种热带的异国情调，这一特点和她哥哥的冷淡而不易动情形成了奇特的对比，但是，他也使人感觉到在他的内心潜藏着烈火似的情感。他肯定具有左右她的力量，因为我曾看到，她在谈话的时候不断地望着他，好象她所说的话都需要征求他的同意似的。我相信他待她很好。他的两眼炯炯有神，嘴唇薄而坚定，这些特点往往显示着一种独断和可能是粗暴的性格。我想你一定会感到他是个很有趣的研究对象吧。\n\n第一天他就来拜访了巴斯克维尔，第二天早晨，他又带领着我们两人去看据说是关于放荡的修果的那段传说的出事地点。在沼地里走了好几英里才到，那个地方十分荒凉凄惨，很可能使人触景生情，编出那个故事来。我们在两座乱石岗中间发现了一段短短的山沟，顺着这条山沟走过去，就到了一片开阔而多草的空地，到处都长着白棉草。空地中央矗着两块大石，顶端已被风化得成了尖形，很象是什么庞大的野兽的被磨损了的獠牙。这个景象确实和传说中的那旧时悲剧的情景相符。亨利爵士很感兴趣，并且不止一次地问过斯台普吞，是否真的相信妖魔鬼怪可能会干预人类的事。他说话的时候，表面似乎漫不经心，可是显而易见，他内心里是非常认真的。斯台普吞回答得非常小心，很容易看得出来他是要尽量少说，似乎是考虑到对准男爵情绪的影响，他不愿把自己的意见全部表白出来。他和我们说了一些类似的事情，说有些家庭也曾遭受过恶魔的骚扰，所以他使我们感觉到他对这件事的看法也和一般人一样。\n\n在归途中，我们在梅利琵吃了午饭，亨利爵士和斯台普吞小姐就是在那里结识的。他一见她似乎就被强烈地吸引住了，而且我敢说，这种爱慕之情还是出自双方的。在我们回家的路上，他还一再地提到她。从那天起，我们几乎每天都和他们兄妹见面。今晚他们在这里吃饭时就曾谈到我们下礼拜到他们那里去的问题。人们一定会认为，这样的一对如果结合起来，斯台普吞一定会欢迎的，可是我不止一次地看到过，每当亨利爵士对他妹妹稍加注视的时候，斯台普吞的脸上就露出极为强烈的反感。他无疑地是非常喜欢她的，没有了她，他的生活就会非常寂寞，可是如果他竟因此而阻碍她这样美好的婚姻，那未免也太过于自私了。我敢肯定地说，他并不希望他们的亲密感情发展成为爱情，而且我还多次发现过，他曾想尽方法避免使他俩有独处密谈的机会。嗯，你曾指示过我，永远不许亨利爵士单独出去，可是在我们的其他种种困难之外再加上爱情的问题，这可就难办得多了。如果我当真坚决彻底地执行你的命令的话，那我就可能会变成不受欢迎的人了。\n\n那一天——更准确地说是星期四——摩梯末和我们一起吃饭，他在长岗地方发掘了一座古坟，弄到了一具史前人的颅骨，他为之喜出望外。真没有见过象他这样一心一意的热心人！后来斯台普吞兄妹也来了，在亨利爵士的请求之下，这位好心肠的医生就领我们到水松夹道去了，给我们说明了在查尔兹爵士丧命的那天晚上，事情发生的全部经过。这次散步既漫长而又沉闷，那条水松夹道被夹在两行高高的剪齐的树篱中间，小路两旁各有一条狭长的草地，尽头处有一栋破烂的旧凉亭。那扇开向沼地的小门正在中间，老绅士曾在那儿留下了雪茄烟灰，是一扇装有门闩的白色木门，外面就是广阔的沼地。我还记得你对这件事的看法，我在心中试着想象出全部发生过的事情的实况。大概是当老人站在那里的时候，他看见有什么东西穿过沼地向他跑了过来，那东西把他吓得惊慌失措地奔跑起来，一直跑到因恐惧和力竭而死为止。\n\n他就是顺着那条长而阴森的夹道奔跑的。可是，他为什么要跑呢？只因为沼地上的一只看羊狗吗？还是看到了一只不出声的鬼怪似的黑色大猎狗呢？是有人在其中捣鬼吗？是不是那白皙而警觉的白瑞摩对他所知道的情况还有所隐瞒呢？这一切都显得扑朔迷离，可是我总觉得幕后有着罪恶的阴影。\n\n从上次给你写信以后，我又遇到了另一个邻人，就是赖福特庄园的弗兰克兰先生，他住在我们南面约四英里远的地方。他是一位长者，面色红润，头发银白，性情暴躁。他对英国的法律有着癖好，并为诉讼而花掉了大量的财产。他所以与人争讼，不过是为了获得争讼的快感，至于说站在问题的哪一面，则全都一样，无怪乎他要感到这真是个费钱的玩艺儿呢。有时他竟隔断一条路并公然反抗教区让他开放的命令；有时竟又亲手拆毁别人的大门，并声言很久很久以前这里早是一条通路，反驳原主对他提出的侵害诉讼。他精通旧采邑权法和公共权法，他有时利用他的知识维护弗恩沃西村居民的利益，但有时又用来反对他们。因此，根据他所做的事，他就时而被人胜利地抬起来走过村中的大街，时而被人做成草人烧掉。据说目前他手中还有七宗未了的讼案，说不定这些讼案就会吞光他仅余的财产呢。到那时候，他就会象一只被拔掉毒刺的黄蜂那样再也不能为害于人了。如果把法律问题放开不谈，他倒象是个和蔼可亲的人。我不过只是提一提他而已，因为你特意嘱咐过我，应该寄给你一些对周围人们情况的描述。他现在正在莫名其妙地忙着，他是个业余天文学家，有一架绝佳的望远镜，他就一天到晚地伏在自己的屋顶上，用它向沼地上了望，希望能发现那个逃犯。如果他能把精力都花费在这件事上，那么一切也就都能太平无事了，可是据谣传，他现在正想以未得死者近亲的同意而私掘坟墓的罪名控靠摩梯末医生。因为摩梯末从长岗地方的古墓里掘出了一具新石器时代人的颅骨。这位弗兰克兰先生确实有助于打破我们生活的单调，并在迫切需要的时候使我们得到一些娱人心怀的小趣味。\n\n现在，已给你及时地介绍了那逃犯、斯台普吞、摩梯末医生和赖福特庄园的弗兰克兰。下面再让我告诉你一些关于白瑞摩的最重要的事情作为结束吧，其中特别是昨晚的那种惊人发展更加值得注意。\n\n第一件就是关于你由伦敦发来的那封为了证实白瑞摩是否确实呆在这里的试探性的电报。我已向你解释过，邮政局长的话说明那次试探是毫无结果的，咱们什么也没能证明。我把事情的真相告诉了亨利爵士，可是他马上就直截了当地把白瑞摩叫了来，问他是否亲自收到了那封电报。白瑞摩说是的。\n\n“那孩子亲自交给你的吗？”亨利爵士问道。\n\n白瑞摩好象很惊讶，他稍稍地考虑了一会儿。\n\n“不是，”他说道，“当时我正在楼上小屋里面呢，是我妻子给我送上来的。”\n\n“是你亲自回的电报吗？”\n\n“不是，我告诉了我妻子应当怎样回答，她就下楼去写了。”\n\n当晚，白瑞摩又重新提起了这个问题。\n\n“我不大明白，今天早晨您提出那问题来的目的何在，亨利爵士，”他说道，“我想，您所以那样问我，不会是说我已作了什么事使您失去对我的信任了吧？”\n\n亨利爵士这时不得不向他保证说绝无此意，并且把自己大部的旧衣服都给了他，以使他安心。因为在伦敦新置办的东西现在已经全部运来了。\n\n白瑞摩太太引起了我的注意，她生得胖而结实，很拘谨，极为可敬，几乎是带着清教徒式的严峻，你很难想象出一个比她更难动情感的人来了。可是我曾告诉过你，在我到这里来的第一天晚上，曾听到她伤心地啜泣过，从那以后，我不止一次地看到她脸上带有泪痕，深重的悲哀在噬啮着她的心。\n\n有时我想，是否她心中存有什么内疚；有时我怀疑白瑞摩也许是个家庭的暴君。我总觉得在这个人的性格里有些特别可疑之处，可是昨晚的奇遇消除了我全部的怀疑。\n\n也许这事情本身是微不足道的。你知道，我是个睡觉不很沉的人，又因为我在这所房子里时刻警醒着的缘故，所以我的觉睡得比平常还要不踏实。昨天晚上，大约在午夜以后两点钟的时候，我被屋外偷偷走过的脚步声惊醒了。我爬了起来，打开我的房门，偷偷地往外瞧，有一条长长的黑影投射在走廊的地上。那是一个手里拿着蜡烛、轻轻地沿着过道走去的身影，他穿着衬衫和长裤，光着双脚。我只能看到他身体的轮廓，可是，由他的身材可以看得出来，这人就是白瑞摩。他走得很慢，很谨慎，由他的整个外表看来，有一种难以形容的鬼鬼祟祟不可告人的样子。\n\n我曾告诉过你，那环绕大厅的走廊是被一段阳台隔断了的，可是在阳台的另一侧又继续下去了。我一直等到他走得不见了以后才又跟踪上去，当我走近阳台的时候，他已走到远处走廊的尽头了，我看到了由一扇开着的门里射出来的灯光，就知道他已走进了一个房间。由于这些房间现在既无陈设又无人住，所以他的行止就愈发显得诡秘了。灯光很稳定，似乎他是在一动不动地站着，我蹑手蹑脚、尽量不出声地沿走廊走去，并从门边向屋里偷看。\n\n白瑞摩在窗前弯着腰，拿着蜡烛，凑近窗玻璃，头部侧面半向着我，当他向着漆黑的沼地注视的时候，面部因焦急而显得十分严肃。他站在那里专心一志地观察了几分钟，然后他深深地叹了一口气，以一种不耐烦的手势弄灭了蜡烛。我马上就回房去了，没有多久就传来了潜行回去的脚步声。过了很久以后，在我刚要矇胧入睡的时候，我听到什么地方有拧锁头的声音，可是我说不出声音来自何方。我猜不出这些都意味着什么，可是我想，在这阴森森的房子里正在进行着一件隐秘的事，我们早晚会把它弄个水落石出的。我不愿拿我的看法来打搅你，因为你曾要求我只须提供事实。今天早晨我曾和亨利爵士长谈了一次，根据我昨晚所作的观察，我们已作出了一个行动计划。我现在还不打算谈，可是它一定会使我的下一篇报告读起来饶有兴趣的。", "is_ending": false, "clues": ["亨利爵士与斯台普吞小姐情愫日深，但斯台普吞表现出不可理喻的狂怒阻挠", "莱夫特大庄园的古怪绅士弗兰克兰德整日用大型天文望远镜巡视荒原", "夜半两点，华生暗中跟踪白瑞摩，目睹他手持蜡烛走到西侧窗前向黑夜中的荒原发信号"], "choices": [{"id": "ch8_c1", "text": "与亨利爵士秘密商定午夜伏击计划，当场抓获白瑞摩的通敌行径。", "target": "ch09_part1_midnight_watch", "pov_switch": null, "pov_switch_name": null}, {"id": "ch8_c2", "text": "向亨利爵士披露烛光信号疑点，备好防身手枪准备彻夜蹲守。", "target": "ch09_part1_midnight_watch", "pov_switch": null, "pov_switch_name": null}]}, "ch09_part1_midnight_watch": {"id": "ch09_part1_midnight_watch", "title": "第九章 沼地上的烛光（上：抓获白瑞摩与身世大白）", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "anchor", "anchor_name": "anchor_convict", "content": "沼地里的灯光我亲爱的福尔摩斯：如果说在我担当起这个使命的初期，在无可奈何的情况下，我没有能供给你多少消息的话，你就该知道，我现在正设法弥补已经损失的时间，而且现在，在我们的周围，事件发生得愈见频繁复杂起来了。在我最后的那篇报告里，我把高潮结束在白瑞摩站在窗前那里，如果我没有估计错的话，现在我已掌握了会使你相当吃惊的材料。事情变化得出乎我意料之外。从几方面看来，在过去四十八小时里，事情已经变得清楚多了，可是从另一些方面来看，又似乎变得更为复杂了。我现在就把全部情况都告诉你，你自己去加以判断吧。\n\n在我发现那桩怪事以后的第二天早饭以前，我又穿过走廊，察看了一下昨晚白瑞摩去过的那间屋子。在他专心一志地向外看的西面窗户那里，我发现了和屋里其他窗户都不同的一个特点——这窗户是面向沼地开的，在这里可以俯瞰沼地，而且距离最近，在这里可以穿过两树之间的空隙一直望见沼地，而由其他窗口则只能远远地看到一点。因此可以推论出来，白瑞摩一定是在向沼地上找什么东西或是什么人，因为要达到这种目的只有这个窗户适用。那天夜里非常黑暗，因此我很难想象他能看到什么人。我曾突然想到，这可能是在搞什么恋爱的把戏，这样也许可以说明他这种偷偷摸摸的行动和他妻子的惴惴不安之间的关系。他是个相貌出众的家伙，足可以使一个乡村女子对他倾心，因此这一说法看来还是稍有根据的呢。我回到自己房间以后所听到的开门声，可能是他出去赶密约了。因此到了早晨我自己就细加推敲起来，尽管结果也许证明这种怀疑是毫无根据的，现在我还是把所怀疑的各点都告诉你吧。\n\n不管究竟应该怎样才能正确地解释白瑞摩的行为，我总是觉得，在我能解释清楚之前，要把这件事秘而不宣对我是个很重的负担。早饭后我到准男爵的书房去找他的时候，就把我所见到的事都告诉他了。可是他听了以后并不如我想象的那样感到吃惊。\n\n“我早知道白瑞摩在夜里经常走动，我曾想和他谈一谈这件事，”他说道，“我曾两三次听到他在过道里走来走去的脚步声，时间恰和您所说的差不多。”\n\n“那么，也许他每晚都要到那窗前去一趟呢，”我提醒道。\n\n“也许是。如果真是这样的话，咱们倒可以跟踪一下，看一看他究竟在干什么。我真不晓得如果您的朋友福尔摩斯在这里的话，他会怎么办。\n\n“我相信他一定会象您所建议的那样采取行动，”我说道，“他会跟踪白瑞摩，并看看他干些什么事。”\n\n“那么咱们就一块干吧。”\n\n“可是，他一定会听到咱们的。”\n\n“这个人有点聋，而且无论如何咱们也得抓住这个机会。\n\n咱们今晚就一起坐在我的屋里，等他走过去。”亨利爵士高兴得搓着双手，显然他是喜欢来这么一次冒险，以消解他在沼地生活的枯寂的。*\n\n准男爵已和曾为查尔兹爵士拟订修筑计划的建筑师与来自伦敦的营造商联系过了，还有来自普利摩斯的装饰匠和家俱商。因此，不久我们可能就会在这里看到巨大的变化了。显然，我们的朋友怀有规模巨大的理想，并决定不辞辛苦、不惜代价地来恢复这个大族的威望。在这所房子经过整修刷新并重新布置之后，所差的也就是一位夫人了。我们可以从一些迹象中很清楚地看到，只要这位女士愿意的话，这一点就不会“尚付阙如”了，因为我很少见到过一个男人会象他对我们的美丽的邻居斯台普吞小姐那样地着迷。可是，在这种情况之下，真正爱情的发展并不象人们所期望的那样顺利。譬如说吧，爱情之海的平静的水面今天就被一阵意想不到的波澜所扰乱了，给我们的朋友造成了很大的不安和烦恼。\n\n在结束了我曾提过的那段关于白瑞摩的谈话之后，亨利爵士就戴上帽子准备出去了，当然我也准备出去。\n\n“什么，您也去吗，华生？”他问道，一面怪模怪样地望着我。\n\n“那要看您是不是要到沼地去。”我说。\n\n“是的，我是到那里去。”\n\n“啊，您是知道我所接受的指示的。我很抱歉对您有所妨碍，可是您也听到过福尔摩斯是怎样郑重其事地坚持说我不应该离开您，尤其是您不能单独到沼地去。”\n\n亨利爵士带着愉快的微笑把手扶在我的肩膀上。\n\n“我亲爱的伙伴，”他说道，“虽然福尔摩斯聪明绝顶，可是他并没有预见到从我到了沼地以来所发生的一些事情。您明白我的话吗？我相信您决不愿意做一个妨碍别人的人。我一定得单独出去。”\n\n这事使我处在很为难的地位。我不知道该说什么，该怎么办才好。就在我还没有下定决心怎样办的当儿，他已拿起手杖走了。\n\n在我将此事重新加以考虑之后，我受到了良心的谴责，因为我竟托辞让他离开了我的身旁。我想象得出，一旦由于我不听你的指示而发生了一些不幸的事，使我不得不回到你的身旁向你忏悔，我的感情将是怎样的。说真的，我一想到这里脸就红了。也许现在去追他还不太晚呢，因此，我马上就朝着梅利琵宅邸那方向出发了。\n\n我以最快的速度沿着道路匆匆走去，一直到我走到沼地小路分岔处才望到了亨利爵士。在那里，我因为恐怕走错路就爬上了一座小山，从山上我可以居高临下地观望一切——\n\n就是那座插入阴暗的采石场的小山。从那里我马上就看到了他。他正在沼地的小路上走着，距我约四分之一英里远，身旁还有一位女士，除了斯台普吞小姐而外还能是谁呢。显然在他俩之间已有了默契，而且是约定相会的，他们一面并肩徐徐而行，一面喁喁而语。我看见她双手做着急促的手势，似乎对自己所说的话很认真的样子；他则聚精会神地听着，有一两次他还截然不能同意似地摇着头。我站在乱石中间望着他们，真不知道下一步应当怎么办。跟上他们并打断他们亲密的交谈，看来似乎是一个荒谬的举动，而我的责任显然是要求我一时一刻也不要让他们离开我的视线。跟踪窥察一个朋友，真是一件可憎的工作。尽管如此，可是除了从山上观察他，事后再向他坦白以求心安外，我还能有什么更好的办法呢。确实，如果当时有任何突然的危险威胁到他，我离他就显得太远了，来不及援助，可是我相信，你和我的意见一定相同。处在这样的地位是非常困难的，而且我再也没有什么别的好办法了。\n\n咱们的朋友亨利爵士和那位女士又停住了脚步，站在那里全神贯注地谈着话，我突然发现，看到他们会面的并不止我一个人，因为我一眼看到了一个绿色的东西在空中浮动着，再一看才知道那绿色的东西是装在一根杆子的顶端的，拿着那杆子的人正在坎坷不平的地方走着。原来那正是斯台普吞拿着他的捕蝶网。他距那对情侣要比我近得多，他好象是在向着他们的方向走去。正在那时，亨利爵士突然将斯台普台小姐拉近身旁，他的胳臂环抱着她，她似乎力图由他手中挣脱，她的脸躲向一边。他低头向她，可是她象是抗议似地举起一只手来。随后我看到他们一跳就分开了，并且慌忙地转过身来，原来是受到了斯台普吞的搅扰。他狂奔着向他俩跑去，那只捕蝶网可笑地在他身后摆动着。他在那对爱侣面前激怒得手舞足蹈起来，可是我想象不出他究竟是什么意思。看样子似乎是斯台普吞在责骂亨利爵士，爵士在进行解释，可是斯台普吞不但拒绝接受，而且变得更加暴怒了，那位女士高傲而沉默地在旁边站着。最后斯台普吞转过身去专横地向他妹妹招了招手，她犹豫不决地看了亨利爵士一眼之后，就和她哥哥并肩走了。那生物学家的手势说明，他对那位女士也同样的极感不快。准男爵望着他们的背影站了一会，然后就慢慢地沿着来路走回去了。他低着头，充分表现出一副失意的神态。\n\n我不知道这究竟都是怎么回事，我只是因为自己在咱们的朋友不知不觉的时候，偷看了他们这样亲密的情景而深感羞愧。我沿着山坡跑了下去，和准男爵在山脚下相遇。他的脸色气得通红，双眉紧皱，就象是个智穷才竭不知所措的人一样。*\n\n“天哪！华生，您是从哪里掉下来的，”他说道，“难道说您竟真的尾随我来了吗？”\n\n我把一切都解释给他听了：我怎样感到再不可能呆在家里，我怎样跟踪了他，以及我怎样看到了所发生的一切。他以怒火炽燃的眼睛向我看了一会，可是我的坦白冲淡了他的怒气，他终于发出了悔恨失望的笑声。\n\n“我原以为平原的中心是个不会被人发现的相当可靠的地方呢。”他说道，“可是天哪！就好象全乡的人都跑了出来看我求婚似的——而且还是这样糟糕透顶的求婚！你找到的座位在什么地方啊？”\n\n“就在那座小山上。”\n\n“原来是坐在很远的后排呀，啊！但是她哥哥可真的跑到最前排来了。您看到他向我们跑过去了吗？”\n\n“是的，我看到了。”\n\n“您曾经见过他象是疯了似的吗？——她那位好哥哥。”\n\n“我没有见过。”\n\n“我敢说，他一点也不疯。直到今天为止，我一直认为他是个头脑清醒的人，但是，请您相信我的话，不是他，就是我，总有一个得穿上捆疯子用的紧身衣的。可是，我是怎么的了呢？您和我相处也有几个星期了，华生。喂！坦白地跟我说吧！我有什么不对的地方，使我不能做我所热爱的女人的好丈夫呢？”\n\n“依我说，没有。”\n\n“他总不会反对我的社会地位吧，因此，他必然是因为我本身的缺点而憎恶我。他有什么可反对我的地方呢？在我一生所认识的人们里，无论是男是女，我都没有得罪过。可是他竟几乎连碰她的手指尖都不许。”\n\n“他说过这样的话吗？”\n\n“这样的话吗，比这还多呢。我告诉您吧，华生，我和她相识还只有几个礼拜，可是从一开始，我就觉得好象她是为我而造出来的；而她呢，也是这样想——她觉得和我在一起的时候很快活，对于这一点我敢发誓，因为女人的眼神是比说话更为有力的。可是他从不让我们呆在一起，仅仅是今天我才第一次找到了能单独和她谈几句话的机会。她很高兴见到我，可是和我见面以后，她又不愿谈关于爱情的事，如果她能制止我的话，她甚至不许我谈到爱情。她一再重复地说，这里是个危险的地方，除非我离开这里，她永远也不会快乐。\n\n我告诉她说，自从我见到她以后，我再不着急离开这里了，如果她真的想让我走的话，唯一的办法就是她设法和我一起走。\n\n我说了很多话，要求和她结婚，可是还没等她回答，她的那位哥哥就向我们跑了过来，脸上的神色就象个疯子。他暴怒得脸色都变白了，连他那浅色的眼里也燃起了怒火。我对那女士怎么了？我怎么敢做使她不高兴的事啊？难道是因为我自以为是个准男爵，就可以为所欲为吗？如果他不是她的哥哥的话，对付他本没有什么困难。当时我只对他说，我并不把和他妹妹产生的感情引以为耻，而且我还希望她能屈尊做我的妻子。这样的话似乎也未能使事态有丝毫的好转，因此，后来我也发了脾气。在我回答他的时候也许有些厉害过分，因为，她还站在旁边呢。结局你是看到了，他和她一起走了，而我呢，简直被弄得比谁都更莫名其妙和不知所措了。华生，只要您能告诉我这是怎么回事，那我对您真是要感激莫名了。”\n\n我当时虽然试着提出了一两种解释；可是，说实在的，连我自己也并没有真正弄清其所以然。就咱们朋友的身分、财产、年龄、人品和仪表来说，条件都是最优越的，除了萦绕他家的厄运之外，我简直找不到任何于他不利的地方。使人十分吃惊的倒是：丝毫不考虑女士本人的意愿，就对她的追求者给以这样粗暴的回绝；而那位女士在这种情况下，也竟能毫不表示任何抗议。当天下午，斯台普吞又亲自来访，这才算是把我们心里的种种猜测平息了下去。他是为了自己早晨的态度粗鲁而来道歉的，两人在亨利爵士的书房里经过长时间的会谈，结果裂痕消除了。由我们决定下星期到梅利琵去吃饭这件事就可以看得出来。\n\n“我并不是说他现在就不是个疯子了，”亨利爵士说道，“我忘不了今早他向我跑来时的那股眼神，可是我不得不承认，再没有人道歉能道得象他这样圆满自然了。”\n\n“他对他早晨那种行为做过任何解释吗？”\n\n“他说他妹妹是他生活中的一切。这是很自然的事，而且他能这样重视她，我也高兴。他们一直就生活在一起，而且正象他自己所说的那样，他是个非常孤独的人，只有她陪伴着，因此，当他一想到将要失去她的时候，那是多么可怕啊！\n\n他说他本来并没有认为我已爱上了她，可是当他亲眼看到了这确是事实，而且感觉到我可能从他手中把她夺去的时候，便使他大为震惊，以至他对自己当时的言行都无法负责了。他对发生过的事感到十分抱歉，并且也认识到，自己妄想为了个人而将象他妹妹那样美丽的女子的一生，束缚在自己的身旁是多么的愚蠢和自私。如果她非得离开他不可的话，他也情愿把她嫁给象我这样的邻居，而不愿嫁给其他的人。可是无论如何，对他说来这毕竟是一个严重的打击，因此他还需要一些时间，以便他对这件事的来临做好精神准备。如果我答应在今后三个月之内把这件事暂搁一下，在这期间只是培养与女士的友情而不要求她的爱情的话，他就决定不再反对了。这一点我答应了，于是事情也就平息下来了。”*\n\n在我们那些不大的谜里，就这样地弄清了一个。正好象当我们在泥沼之中挣扎的时候，在什么地方碰到了底似的。现在我们懂得了，为什么斯台普吞那样看不上他妹妹的追求者——即使那位追求者是象亨利爵士那样恰当的人。现在我再转到由一团乱线里抽出来的另一条线索上去吧，就是那夜半哭声和白瑞摩太太满面泪痕的秘密，还有管家到西面格子窗前去的秘密。祝贺我吧，亲爱的福尔摩斯，你得说我没有辜负你的嘱托了吧，你不会后悔在派我来的时候所寄予我的信任的。这些事经过一夜的努力就都彻底弄清了。\n\n我说“经过一夜的努力”，实际上是经过了两夜的努力，因为头一夜我们什么也没搞出来。我和亨利爵士在他房间里一直坐到早晨将近三点钟的时候，可是除了楼梯上端的大钟报时的声音以外，我们什么也没有听到。那真是一次最可怜的熬夜了，结果是我们俩都在椅子里睡着了。所幸的是我们并没有因此气馁，并且决定再试一试。第二天夜里，我们捻小了灯头坐在那里，无声无息地吸着烟。时间似乎过得令人难以相信地那么慢，可是我们靠着猎人在监视着自己设的陷阱，希望所要捉的动物会不意地闯进去时所必然会有的那种耐心和兴趣熬了过来。钟敲了一下，又敲了两下，在绝望之中，我们几乎都想再度放弃不干了，就在这时，突然我俩在椅子里猛地坐直起来，已经疲倦的全部感官又重新变得警醒而敏锐了。我们听到了过道里的咯吱咯吱的脚步声。\n\n我们听着那脚步声偷偷摸摸地走了过去，直到在远处消失为止。然后准男爵轻轻地推开了门，我们就开始了跟踪。那人已转入了回廊，走廊里是一片漆黑。我们轻轻地走到了另一侧的厢房，刚好能看到他那蓄着黑须的、高高的身影。他弯腰伛背，用脚尖轻轻地走过了过道，后来就走进了上次进去过的那个门口，门口的轮廓在黑暗中被烛光照得显露出来，一道黄光穿过了阴暗的走廊。我们小心地迈着小步走了过去，在以全身重量踩上每条地板以前，都要先试探一下。为了小心起见，我们没有穿鞋，虽然如此，陈旧的地板还是要在脚底下咯吱作响。有时似乎他不可能听不到我们走近的声音，所幸的是那人相当地聋，而且他正在全神贯注地干着自己的事。\n\n最后，我们走到了门口偷偷一望，看到他正弯腰站在窗前，手里拿着蜡烛，他那苍白而聚精会神的面孔紧紧地压在窗玻璃上，和我在前天夜里所看到的完全一样。\n\n我们预先并未安排好行动计划，可是准男爵这个人总是认为最直率的办法永远是最自然的办法。他走进屋去，白瑞摩随即一跳就离开了窗口，猛地吸了一口气就在我们面前站住了，面色灰白，浑身发抖。他看看亨利爵士又看看我，在他那苍白的脸上，闪闪发光的漆黑的眼睛里充满了惊恐的神色。\n\n“你在这里干什么呢，白瑞摩？”\n\n“没干什么，爵爷。”强烈的惊恐不安使他简直说不出话来了，由于他手中的蜡烛不断地抖动，使得人影也不停地跳动着。“爵爷，我是夜间四处走一走，看看窗户是否都上了插销。”\n\n“二楼上的吗？”\n\n“是的，爵爷。所有的窗户。”\n\n“告诉你，白瑞摩，”亨利爵士严厉地说道，“我们已决心要让你说出实话来，所以，你与其晚说还不如早说，免得我麻烦。现在，说吧！可不要谎话！你在那窗前干什么来着？”\n\n那家伙无可奈何地望着我们，就象是个陷于极端疑惧、痛苦的人似的，两手扭在一起。\n\n“我这样做也没有什么害处啊，爵爷，我不过是把蜡烛拿近了窗户啊！”\n\n“可是你为什么要把蜡烛拿近窗口呢？”\n\n“不要问我吧，亨利爵士——不要问我了！我跟您说吧，爵爷，这不是我个人的秘密，我也不能说出来，如果它与别人无关而且是我个人的事的话，我就不会对您隐瞒了。”\n\n我突然灵机一动，便从管家抖动着的手里把蜡烛拿了过来。\n\n“他一定是拿它作信号用的，”我说道，“咱们试试看是否有什么回答信号。”我也象他一样地拿着蜡烛，注视着漆黑的外面。我只能模糊地辨别出重叠的黑色的树影和颜色稍淡的广大的沼地，因为月亮被云遮住了。后来，我高声欢呼起来，在正对着暗黑的方形窗框中央的远方，忽然出现了一个极小的黄色光点刺穿了漆黑的夜幕。*\n\n“在那儿呢！”我喊道。\n\n“不，不，爵爷，那什么也不是——什么也不是！”管家插嘴道，“我向您保证，爵爷……”\n\n“把您的灯光移开窗口，华生！”准男爵喊了起来，“看哪，那个灯光也移开了！啊，你这老流氓，难道你还要说那不是信号吗？来吧，说出来吧！你的那个同伙是谁，正在进行着的是个什么阴谋？”\n\n那人的面孔竟公然摆出大胆无礼的样子来。\n\n“这是我个人的事，不是您的事，我一定不说。”\n\n“那么你马上就不要在这里干事了。”\n\n“好极了，爵爷。如果我必须走的话我就一定走。”\n\n“你是很不体面地离开的。天哪！你真该知些羞耻啊！你家的人和我家的人在这所房子里同居共处有一百年之久了，而现在我竟会发现你在处心积虑地搞什么阴谋来害我。”\n\n“不，不，爵爷，不是害您呀！”传来了一个女人的声音。\n\n白瑞摩太太正站在门口，脸色比她丈夫更加苍白，样子也更加惶恐。如果不是她脸上惊恐的表情的话，她那穿着裙子、披着披肩的庞大身躯也许会显得可笑了呢。\n\n“咱们一定得走。伊莉萨。事情算是到了头了。去把咱们的东西收拾一下吧。”管家说道。\n\n“喔，约翰哪！约翰！是我把你连累到这种地步的，这都是我干的，亨利爵士——全是我的事。完全是因为我的缘故，而且是因为我请求了他，他才那样做的。”\n\n“那么，就说出来吧，究竟是什么意思呢？”\n\n“我那不幸的弟弟正在沼地里挨饿呢，我们不能让他在我们的门口饿死。这灯光就是告诉他食物已准备好了的信号，而他那边的灯光则是表明送饭地点的。”\n\n“那么说，您的弟弟就是……”\n\n“就是那个逃犯，爵爷——那个罪犯塞尔丹。”\n\n“这是实情，爵爷。”白瑞摩说道，“我说过，那不是我个人的秘密，而且我也不能告诉您。可是，现在您已经听到了，您会明白的，即使有个阴谋，也不是害您的。”\n\n这就是对于深夜潜行和窗前灯光的解释。亨利爵士和我都惊异地盯着那个女人。难道这是可能的吗？这位顽强而可敬的女人竟会和那全国最最声名狼藉的罪犯同出一母？\n\n“是的，爵爷，我就姓塞尔丹，他就是我的弟弟。在他小的时候，我们把他纵容过度了，不管什么事情都是随着他的意思，弄得他认为世界就是为了使他快乐才存在的，因此他就应该在这个世界里为所欲为。他长大以后，又碰上了坏朋友，于是他就变坏了，一直搞到使我母亲为之心碎，并且玷污了我们家的名声。由于一再地犯罪，他就愈陷愈深，终于弄到了若不是上帝仁慈的话，他就会被送上断头台的地步。可是对我说来，爵爷，他永远是我这个做姐姐的曾经抚育过和共同嬉戏过的那个一头卷发的孩子。他之所以敢于逃出监狱来，爵爷，就是因为他知道我们在这里住，而且我们也不能不给他以帮助。有一天夜晚，他拖着疲倦而饥饿的身体到了这里，狱卒在后面穷追不舍，我们还能怎么办呢？我们就把他领了进来，给他饭吃，照顾着他。后来，爵爷，您就来了，我弟弟认为在风声过去以前，他到沼地里去比在哪里都更安全些，因此他就到那里去藏起来了。在每隔一天的晚上，我们就在窗前放一个灯火，看看他是不是还在那里，如果有回答信号的话，我丈夫就给他送去一些面包和肉。我们每天都希望着他快走，可是只要是他还在那里，我们就不能置而不顾。这就是全部的实情，我是个诚实的基督徒，您能看得出来，如果这样做有什么罪过的话，都不能怨我丈夫，而应该怪我，因为他是为我才干那些事的。”\n\n那女人的话听着十分诚恳，话的本身就能证明这都是实情。\n\n“这都是真的吗？白瑞摩？”\n\n“是的，亨利爵士。完全是真实的。”\n\n“好吧，我不能怪你帮了你太太的忙。把我刚才说过的话都忘掉吧。你们现在可以回到自己的屋子里去了，关于这件事，咱们明早再谈吧。”\n\n他们走了以后，我们又向窗外望去。\n\n亨利爵士把窗户打开，夜间的寒风吹着我们的脸。在漆黑的远处，那黄色的小小光点依旧在亮着。\n\n“我真奇怪他怎么敢这么干呢？”亨利爵士说道。\n\n“也许他放出光亮的地方只能由这里看到。”\n\n“很可能，您认为距这里有多远？”\n\n“我看是在裂口山那边。”\n\n“不过一二英里远。”\n\n“恐怕还没有那么远呢。”\n\n“嗯，白瑞摩送饭去的地方不可能很远，而那个坏蛋正在蜡烛旁边等着呢。天哪，华生，我真想去抓那个人去。”\n\n在我的脑子里也产生过同样的想法，看样子白瑞摩夫妇不见得信任我们，他们的秘密是被迫暴露出来的。那个人对社会说来是个危险，是个十足的恶棍，对他既不应该可怜，也不应该原谅。如果我们借这机会把他送回使他不能再为害于人的地方去的话，那我们也只不过是尽了我们应尽的责任罢了。就他这样残暴、凶狠的天性来说，如果我们袖手旁观的话，别人可能就要付出代价呢。譬如说吧，随便哪天夜晚，我们的邻居斯台普吞都可能受到他的袭击，也许正是因为想到了这一点才使得亨利爵士要去冒这样的险呢。\n\n“我也去。”我说道。", "is_ending": false, "clues": ["在黑暗走廊当场抓获正向荒原摇晃烛光发信号的管家白瑞摩", "白瑞摩太太失声痛哭招认：越狱逃犯塞尔登正是她亲弟弟", "亨利爵士出于宽大仁慈答应不予告发，并赠送旧衣物食物助其逃亡南美"], "choices": [{"id": "ch9_p1_c1", "text": "带上左轮手枪，在凄风苦雨的月夜中踏入漆黑荒原缉捕逃犯。", "target": "ch09_part2_moor_chase", "pov_switch": null, "pov_switch_name": null}, {"id": "ch9_p1_c2", "text": "体恤白瑞摩夫妇苦衷，追踪沼地深处那一点幽微的烛火。", "target": "ch09_part2_moor_chase", "pov_switch": null, "pov_switch_name": null}]}, "ch09_part2_moor_chase": {"id": "ch09_part2_moor_chase", "title": "第九章 沼地上的烛光（下：荒原追捕与岩岗上的神秘客）", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "branch", "anchor_name": null, "content": "“那么您就把左轮手枪带着，穿上高筒皮鞋。我们愈早出发愈好，那家伙可能会吹灭蜡烛跑掉的。”\n\n不到五分钟我们就出了门，开始远征了，我们在秋风低吟和落叶沙沙声中匆忙地穿过了黑暗的灌木丛。夜晚的空气里带着浓厚的潮湿和腐朽的气味。月亮不时地由云隙里探头下望，云朵在空中奔驰而过。我们刚刚走到沼地上的时候，就开始下起细雨来了。那烛光却仍旧在前面稳定地照耀着。\n\n“您带了武器吗？”我问道。\n\n“我有一条猎鞭。”\n\n“咱们必须很快地向他冲过去，因为据说他是个不要命的家伙。咱们得出其不意地抓住他，在他能够进行抵抗之前就得让他就范。”\n\n“我说，华生，”准男爵说道，“这样干法福尔摩斯会有什么意见呢？在这样的黑夜、罪恶嚣张的时候。”\n\n就象回答他的话似的，广大而阴惨的沼地里忽然发出了一阵奇怪的吼声，就是我在大格林盆泥潭边缘上曾经听见过的那样。声音乘风穿过了黑暗的夜空，先是一声长而深沉的低鸣，然后是一阵高声的怒吼，再又是一声凄惨的呻吟，然后就消失了。声音一阵阵地发了出来，刺耳、狂野而又吓人，整个空间都为之悸动起来。准男爵抓住了我的袖子，他的脸在黑暗中变得惨白。\n\n“我的上帝啊，那是什么呀，华生？”\n\n“我不知道。那是来自沼地的声音，我曾经听见过一次。”\n\n声音已经没有了，死一样的沉寂紧紧地包围了我们。我们站在那里侧耳倾听，可是什么也听不见了。\n\n“华生，”准男爵说道，“这是猎狗的叫声。”\n\n我感觉浑身的血都凉了，因为他的话里时有停顿，说明他已突然地产生了恐惧。\n\n“他们把这声音叫什么呢？”他问道。\n\n“谁呀？”\n\n“乡下人啊！”\n\n“啊，他们都是些没有知识的人，您何必管他们把那声音叫什么呢！”\n\n“告诉我，华生，他们怎么说的？”我犹豫了一下，可是没法逃避这问题。\n\n“他们说那就是巴斯克维尔猎狗的叫声。”\n\n他咕哝了一阵以后，又沉默了一会儿。\n\n“是一只猎狗，”他终于又说话了，”可是那声音好象是从几里地以外传来的，我想大概是那边。”\n\n“很难说是从哪边传来的。”\n\n“声音随着风势而变得忽高忽低。那边不就是大格林盆那个方向吗？”\n\n“嗯，正是。”\n\n“啊，是在那边。喂，华生，您不认为那是猎狗的叫声吗？\n\n我又不是小孩，您不用怕，尽管说实话好了。”\n\n“我上次听到的时候，正和斯台普吞在一起。他说那可能是一种怪鸟的叫声。”\n\n“不对，不对，那是猎狗。我的上帝呀，难道这些故事会有几分真实吗？您不会相信这些吧，您会吗，华生？”\n\n“不，我决不相信。”\n\n“这件事在伦敦可以当作笑料，但是在这里，站在漆黑的沼地里，听着象这样的叫声，就完全是另外一回事了。我的伯父死后，在他躺着的地方，旁边有猎狗的足迹，这些都凑在一起了。我不认为我是个胆小鬼，华生，可是那种声音简直把我浑身的血都要凝住了。您摸摸我的手！”\n\n他的手冰凉得象一块石头。\n\n“您明天就会好的。”\n\n“我想我已无法不使那种叫声深印在我的脑中了。您认为咱们现在应当怎么办呢？”\n\n“咱们回去好吗？”\n\n“不，决不，咱们是出来捉人的，一定得干下去。咱们是搜寻罪犯，可是说不定正有一只魔鬼似的猎狗在追踪着咱们呢。来吧！就是把所有洞穴里的妖魔都放到沼地里来，咱们也要坚持到底。”*\n\n我们在暗中跌跌撞撞地缓缓前进着，黑暗而参差不齐的山影环绕着我们，那黄色的光点依然在前面稳定地亮着。在漆黑的夜晚，再没有比一盏灯光的距离更能骗人了，有时那亮光好象是远在地平线上，而有时又似乎是离我们只有几码远。可是我们终于看出它是放在什么地方了，这时我们才知道确已距离很近了。一支流着蜡油的蜡烛被插在一条石头缝里，两面都被岩石挡住，这样既可避免风吹，又可使除了巴斯克维尔庄园以外的其他方向都看不到。一块突出的花岗石遮住了我们。于是我们就在它后面弯着腰，从石头上面望着那作为信号的灯光。看到一支蜡烛点在沼地的中央，而周围却毫无生命的迹象，确是奇事——只有一条向上直立的黄色火苗和它两侧被照得发亮的岩石。\n\n“咱们现在怎么办呢？”亨利爵士悄悄地说道。\n\n“就在这里等着，他一定在烛光的附近。看一看，咱们是否能够看得到他。”\n\n我的话刚说出口，我们两人就看到了他，在蜡烛附近的岩石后面探出来一张可怕的黄面孔——一张吓人的野兽般的面孔，满脸横肉，肮脏不堪，长着粗硬的长须，乱蓬蓬的头发，倒很象是古代住在山边洞穴之中的野人。在他下面的烛光照着他的小而狡猾的眼睛，可怕地向左右黑暗之中窥探，好象是一只听到了猎人脚步声的狡黠的猛兽。\n\n显然已有什么东西引起了他的怀疑。说不定是因为他还有什么和白瑞摩私订的暗号我们不知道，也许是那家伙根据其他理由感觉到了事情的不妙，因为我从他那凶恶的脸上看出了恐惧的神色。因为考虑到每一秒钟他都可能从亮处窜开、消失在黑暗之中，所以我就跳向前去，亨利爵士也跟了上来。\n\n正在这时，那罪犯尖声痛骂了我们一句，便打过来一块石头，那石头在遮住我们的大石上碰得粉碎。当他跳起来转身逃跑的时候，碰巧月光刚从云缝里照了下来，我一眼看到了他那矮胖而强壮的身形。我们冲过了小山头，那人从山坡那面疾驰而下，他一路上用山羊似的动作在乱石上跳来跳去。如果用我那左轮手枪远射，碰巧了就可能把他打瘸，可是我带它来只是为了在受人攻击的时候用以自卫，而不是用来打一个在逃的没有武器的人的。\n\n我们两个都是快腿，而且受过相当好的训练，可是，不久我们就知道已没希望追上他了。在月光之下，我们很久还看得见他，直到他在一座远处小山山侧的乱石中间变成了一个迅速移动着的小点。我们跑呀跑的，直跑到疲惫不堪，可是他和我们的距离反而愈来愈大了。最后，我们终于在两块大石上坐了下来，大喘着气，眼看着他在远处消失了。\n\n就在这时发生了一件最最奇怪和想象不到的事。当时我们已经从石头上站了起来，放弃了无望的追捕，就要转身回家了。月亮低悬在右侧空中，满月的下半部衬托出一座花岗石岩岗的嶙峋的尖顶。在明亮的背景前面，我看到一个男人的身影，他站在岩岗的绝顶上，恰似一座漆黑的铜像。你可别认为那是一种幻觉，福尔摩斯。我敢说，在我一生里还从没有看得这样清楚过呢。根据我的判断，那是一个又高又瘦的男人。他两腿稍稍分开地站着，两臂交叉，低着头，就象是面对着眼前满布泥炭和岩石的广大荒野正在考虑什么问题。他也许就是那可怕的地方的精灵呢。他不是那罪犯，他离那罪犯逃遁的地方很远，同时他的身材也高得多。我不禁惊叫了一声，并把他指给准男爵看，可是就在我转身抓他手臂的时候，那人就不见了。这时花岗岩的尖顶依然遮着月亮的下半部，可是在那顶上再也没有那静立不动的人的踪影了。\n\n我本想向那方向走去，把那岩岗搜索一下，可是距离相当远。从听到那使他回想起他家庭可怕的故事的叫声以后，准男爵的神经还一直在震颤，因此他已无心再作冒险了。他并没有看到岩顶上的那个孤独的人，因此他还不能体会那人的怪异的出现和他那威风凛凛的神气所给予我的毛骨悚然的感觉。\n\n“是个狱卒，没错。”他说道，“从这家伙逃脱之后，沼地里到处都是他们。”\n\n嗯，也许他的解释是正确的，可是没有更进一步的证明，我是不会相信的。今天，我们打算给王子镇的人们打个电报，告诉他们应当到那里去找他们那个逃犯。说起来也真倒霉，我们竟没有能当真胜利地把他作为我们的俘虏带回来。这就是我们昨晚所作的冒险。你得承认，我亲爱的福尔摩斯，就拿给你作报告这件事来说吧，我已经为你做得很不错了。在我所告诉你的东西里，有很多无疑是很离题了，可是我总觉得最好还是让我把一切事实都告诉你，让你自己去选择哪些是最能帮助你得出结论的东西吧。当然我们已经有了一些进展，就白瑞摩来说，我们已经找出了他的行为的动机，这就使整个的情况澄清了不少。可是神秘的沼地和那里的奇特的居民则依旧是使人莫测高深的，也许在下一次的报告里，我将能把这一点也稍加澄清。最好还是你到我们这里来。无论如何，几天之内你就会又接到我的信了。\n\n寄自巴斯克维尔庄园十月十五日", "is_ending": false, "clues": ["在乱石堆中包围塞尔登，逃犯投掷巨石后窜入昏黑岩壑逃遁", "当月光破云而出时，华生赫然望见黑色岩岗巅峰矗立着一个双臂抱胸的神秘高瘦身影", "荒原远方再度传来凄厉狂暴的犬嚎，黑影随即隐没在夜色之中"], "choices": [{"id": "ch9_p2_c1", "text": "在日记中详实记录岩岗神秘人的身影，拟定追查其巢穴的方略。", "target": "ch10_diary_and_laura", "pov_switch": null, "pov_switch_name": null}, {"id": "ch9_p2_c2", "text": "决定破晓时分搜查荒原岩岗石屋，查明神秘人究竟是友是敌。", "target": "ch10_diary_and_laura", "pov_switch": null, "pov_switch_name": null}]}, "ch10_diary_and_laura": {"id": "ch10_diary_and_laura", "title": "第十章 华生医生日记摘录", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "anchor", "anchor_name": "anchor_diary", "content": "我一直都在引用以前寄给歇洛克·福尔摩斯的报告。可是叙述到这里，我又不得不放弃这种方法，再度依靠我的回忆，借助于我当时的日记了。随便几段日记就能使我想起那些详尽无遗的、深印在我记忆之中的情景。好吧，我就从我们在沼地里徒劳无功地追捕了一阵逃犯和经历了那次奇遇的那个早晨谈起吧。\n\n十月十六日——今天是个阴晦多雾、细雨蒙蒙的日子。房子被滚滚而来的浓雾重重包围起来，可是浓雾也不时上升，露出荒漠起伏的沼地来，山坡上有纤细的如同缕缕银丝似的水流，远处突出的岩石的湿漉漉的表面，被天光照得闪闪烁烁，由表及里都沉浸在阴郁的气氛之中。昨夜的惊恐在准男爵的身上产生了恶劣的影响；我感到心情沉重，有一种危险迫在眉睫的感觉——而且是一种始终存在的危险，由于我形容不出来，所以也就显得特别可怕。东西\n\n难道我这种感觉是毫无来由的吗？只要考虑一下连续发生的这一长串意外的事件就会明白，这些都说明在我们的周围正进行着一件有计划的罪恶活动。这庄园的前一个主人的死，分毫不爽地应验了这家族中的传说的内容，还有农民们一再声称的在沼地里出现的怪兽。我曾两次亲耳听到了很象是一只猎狗在远处嗥叫的声音，这竟会是真正超乎自然的事？\n\n简直是既不可信也不可能。一只魔犬，可是又留下了爪印，又能嗥叫冲天，这实在是不可想象的事。斯台普吞可能会信这套鬼话，摩梯末也可能；可是如果我还能算是稍具常识的话，无论如何我也不能相信这样的事。如果我自己对此也信以为真的话，那就无异于甘心把自己降低到这些可怜的庄稼人的水平。他们把那狗说成妖魔鬼怪还不够，甚至还把它形容成口、眼都向外喷着地狱之火。福尔摩斯决不会听信这些异想天开的说法，而我则是他的代理人。我就两次在沼地里听到过这种叫声。可是事实终归是事实啊，假如真的有什么大猎狗跑到沼地上来的话，那就一切都好解释了。可是这样一只猎狗能藏到什么地方去呢？它到哪里去找吃的呢？它是从哪里来的呢？白天为什么没有人看到它呢？不可否认，不管是合乎自然法则的解释或是不合乎自然法则的解释，现在都同样地难于说得通。暂且先放下这只猎狗不提，那么在伦敦发现的那个“人”总是事实啊！马车里的那个人，还有警告亨利爵士不要到沼地来的那封信，这至少是真的吧。这可能是个要保护他的朋友干的事，但也同样可能是个敌人干的事。那个朋友或敌人现在究竟在哪里呢？他是仍旧在伦敦呢，还是已经跟踪我们到了这里呢？他会不会……会不会就是我所看到的在岩岗上站着的那个陌生人呢？\n\n确实是我只看到了他一眼，可是有几点我是可以肯定的。\n\n他绝不是我在这里所见到过的人，而我现在和所有的邻居都见过面了。那身形远比斯台普吞高得多，也远比弗兰克兰为瘦。说不定可能是白瑞摩，可是我们已把他留在家里了，而且我可以肯定，他是不会跟踪我们的。这样说，一定还有一个人在尾随着我们，正如同有一个陌生人在伦敦尾随我们一样，我们一直也未能把他甩掉。如果我们能抓住那个人的话，那么，我们的一切困难就都迎刃而解了。为了达到这一目的，我现在非得全力以赴不可。\n\n我的第一种想法是打算把我的整个计划都告诉亨利爵士；第二种想法，我认为也是最聪明的想法，那就是自己干自己的，尽量不和任何人谈起。他显得沉默而茫然，那沼地的声音已使他的神经受到了不可思议的震惊，我不愿再以任何事情来加深他的焦虑，为了达到自己的既定目的，我就必须采取单独的行动了。\n\n今天早饭之后，我们又出了一件小事。白瑞摩要求和亨利爵士单独谈话，他俩在爵士的书房里关起门来待了一会。我坐在弹子房里不止一次听到谈话的声音变得高了起来，我很明了所谈的是什么问题。过了一会儿，准男爵就打开房门叫我进去了。\n\n“白瑞摩认为他有一点不满之处，”他说道，“他认为在他自愿地把秘密告诉我们之后，我们就去追捕他内弟的这种做法是不公平的。”\n\n管事的站在我们的面前，面色很苍白，可是很镇定。\n\n“也许我说话太过火了一些，爵爷，”他说道，“如果是这样的话，我就求您宽恕。但是，在今晨我听见你们两位回来并得知你们是去追捕塞尔丹的时候，确实感到非常吃惊。这个可怜的家伙，不用我再给他添什么麻烦就已经够他苦斗一阵的了。”\n\n“如果你真是自愿地告诉了我们的话，也许事情就不会这样了，”准男爵说道，“但实际情况却是当你，或者还不如说是当你太太被迫不得不说的时候才告诉我们的。”\n\n“我真没有想到您竟会利用了这一点，亨利爵士……我真没想到。”\n\n“这个人对社会说来是个危险。在沼地里到处都是孤立无援的人家，而他又是个无法无天的人，只要看他一眼，你就能明白这一点了。比如说，你就看斯台普吞先生的家吧，就只有他一个人保护家。除非塞尔丹重新被关进监狱，否则谁也不会感到安全。”\n\n“他绝不会闯进任何人家的，爵爷，这一点我可以向您保证。反正他在这里再不会骚扰任何人了，我向您保证，亨利爵士，过不了几天就可做好必要的安排，他就要去南美了。看在上帝的面上，爵爷，我恳求您不要让警察知道他还在沼地里。在那里他们已经放弃了对他的追捕了，他可以一直安静地藏到准备好船只的时候为止。您若告发了他，就一定要使我和我的妻子遭到麻烦。我恳求您，爵爷，什么也不要和警察说。”\n\n“你看怎么样，华生？”\n\n我耸了耸肩。“如果他能安全地离开这个国家，那就能给纳税人减去一桩负担呢。”\n\n“可是他会不会在临走以前搞谁一家伙呢？”\n\n“他不会这样发疯的，爵爷，他所需要的一切东西我们都给他准备齐全了。他若再犯一次罪就会暴露他的藏身之所了。”\n\n“这倒是实话，”亨利爵士说道，“好吧，白瑞摩……”\n\n“上帝祝福您，爵爷，我从心眼里感激您！如果他再度被捕的话，我那可怜的妻子一定要活不成了。”\n\n“我想咱们这是在怂恿助成一件重大的罪行吧，华生？可是在听了他刚才说的那些话以后，我觉得好象已经不能再检举那人似的，算了吧！好吧，白瑞摩，你可以走了。”\n\n那人一边断断续续地说了些感谢的话，一边转过身去，可是他犹豫一下之后又回转身来。\n\n“您对我们太好了，爵爷，我愿尽我所能地来报答您。我知道一件事，亨利爵士，也许我早就该说出来了，可是这还是在验尸之后很久我才发现的。关于这件事我还没有向任何人提过，这是一件和查尔兹爵士的死有关的事。”\n\n准男爵和我两个人都站了起来。“你知道他是怎么死的吗？”\n\n“不，爵爷，这个我可不知道。”\n\n“那么，你知道什么呢？”\n\n“我知道当时他为什么站在那门旁，那是为了要和一个女人会面。”\n\n“去和一个女人会面！他？！”\n\n“是的，爵爷。”\n\n“那个女人叫什么？”\n\n“她的姓名我没法告诉您，爵爷，可是，我可以告诉您那姓名的字头。她那姓名的字头是Ｌ．Ｌ．”\n\n“这你是怎么知道的，白瑞摩？”\n\n“啊，亨利爵士，您伯父在那天早晨收到了一封信。他经常收到很多信件，因为他是个闻名的人物，而且还以心地善良著称，因此，无论是谁，在发生困难的时候，都喜欢求助于他。可是那天早晨，碰巧只有那一封信，所以引起了我特别的注意。那信是从库姆·特雷西地方寄来的，而且是女人的笔迹。”\n\n“嗯？”\n\n“啊，爵爷，要不是因为我太太的关系，我决不会想起这件事来的，也许我永远也想不起来了呢。刚刚几个礼拜以前，在她清理查尔兹爵士的书房的时候——从他死以后还一碰也没碰过呢——在炉格后面发现了一封烧过的信纸的灰烬。信已大部烧焦，碎成小片，只有信末的一小条还算完整，字迹在黑地上显得灰白，还可以看得出来。看来很象是信末的附笔，写的是：‘您是一位君子，请您千万将此信烧掉，并在十点钟的时候到栅门那里去。’下面就是用Ｌ．Ｌ．这两个字头签的名。”*\n\n“那张字条还在你那儿吗？”\n\n“没有了，爵爷，我们一动，它就粉碎了。”\n\n“查尔兹爵士还收到过同样笔迹的信件吗？”\n\n“噢，爵爷，我并没有特别注意他的信件。只是因为这封信是单独寄来的，所以我才注意到了它。”\n\n“你也弄不清Ｌ．Ｌ．是谁吗？”\n\n“弄不清，爵爷，我比您知道得并不多。可是我想，如果咱们能够找到那位女士的话，那么关于查尔兹爵士的死，咱们就会多知道些情况了。”\n\n“我真莫名其妙，白瑞摩，这样重要的情况你怎么竟会秘而不宣？”\n\n“噢，爵爷，那正是我们自己的烦恼刚刚到来之后。还有就是，爵爷，我们两人都很敬爱查尔兹爵士，我们不能不考虑到他对我们的厚意。我们认为把这件事兜出来对我们那位可怜的主人并没有什么好处，再加以这问题还牵连到一位女士，当然就更该小心从事了。即使是在我们当中最好的人……”\n\n“你以为这一点会有伤他的名誉吗？”\n\n“嗯，爵爷，我想这总不会有什么好结果的。可是您现在对我们这样好，使我觉得，如果我不把这件事的全部情况都告诉您，那我就太对不起您了。”\n\n“好极了，白瑞摩，你可以走了。”当管事的走了以后，亨利爵士转身向我说道，“喂，华生，您对这新发现怎么看法？”\n\n“好象又是一个难解的问题，弄得比以前更加使人莫名其妙了。”\n\n“我也是这样想呢，可是只要咱们能够查明Ｌ．Ｌ．这个人，可能就会把整个问题都搞清楚了。咱们能得到的线索就是这么多了，咱们已经知道，有人了解事情的真相，只要能找到她就好了。您认为咱们应当从何着手呢？”\n\n“马上将全部经过告诉福尔摩斯，这样就能把他一直在寻找的线索供给他了。如果这样还不能把他吸引到这里来，那才真是怪事呢。”\n\n我马上回到自己的屋里去，给福尔摩斯写了关于今早那次谈话的报告。我很清楚，他最近很忙，因为从贝克街寄来的信很少。写得也短，对于我所供给他的消息也没有提出什么意见，而且更难得提到关于我的任务。无疑的是他的精神已全部贯注在那封匿名恐吓信的案件上面了。可是，事情的这种新的进展，定会引起他的注意并能恢复他对这个案子的兴趣的。他现在若是在这里有多好啊。\n\n十月十七日——今天大雨终日，浇得常春藤唰唰作响，房檐水滴沥沥。我想起了那个身处荒凉、寒冷而又无遮无盖的沼地里的逃犯。可怜的人啊！不管他犯的是什么罪，他现在所吃的苦头，也总算赎了他的罪了。我又想起了另一个人——\n\n马车里的那个面孔，月亮前面的那个人影，那个隐蔽的监视者和不可解的人——难道他也暴身于倾盆大雨之中吗？傍晚时分，我穿上了雨衣雨鞋，在湿软的沼地里走出去很远，心里充满着可怕的想象，雨打在我的脸上，风在我的耳旁呼哨。\n\n但求上帝援助那些流落在大泥潭里的人吧，因为连坚硬的高地都变成了泥淖了。我终于找到了那黑色的岩岗，就是在这岩岗上，我看到过那个孤独的监视人，我从它那嵯峨的绝顶，一眼望到远近一无树木的阴惨的高地。暴风夹杂着大雨，刷过赤褐色的地面，浓重的青石板似的云层，低低地悬浮在大地之上，又有绺绺的灰色残云，拖在奇形怪状的山边。在左侧远处的山沟里，巴斯克维尔庄园的两座细长的塔楼，隔着雾气，半隐半现地矗立在树林高处。除了那些密布在山坡上的史前期的小房之外，这要算是我所能见到的唯一的人类生活的迹象了。哪里也看不到两晚之前我在同一地点所见到过的那个孤独的人的踪影。\n\n当我走回去的时候，摩梯末医生赶了上来，他驾着他那辆双轮马车，走在一条通向边远的弗欧麦尔农舍的坎坷不平的沼地小路上。他一向非常关心我们，几乎没有一天他不到庄园来看看我们过得好不好。他一定要我上他的马车，所以我就搭他的车回家了。我知道他近来由于那只小长耳獚犬的失踪而非常烦恼；那小狗自从有一次乱跑跑到沼地里去以后，一直没有回来。我尽可能地安慰了他，可是我一想起了格林盆泥潭里的小马，也就不再幻想他会再见到他的小狗了。\n\n“我说，摩梯末，”当我们在崎岖不平的路上颠簸摇晃着的时候我说，“我想在这里凡是乘马车能到达的住家，您很少有不认识的人吧。”\n\n“我想，简直没有。”\n\n“那么，您能不能告诉我，哪些女人的姓名的字头是Ｌ．Ｌ．呢？”\n\n他想了几分钟。\n\n“不能，”他说道，“有几个吉卜赛人和作苦工的我就不知道，而在农民或是乡绅之中没有一个人的姓名的字头是这样的。哦，等一等，”他停了一下之后又说，“有一个劳拉·莱昂丝——她那姓名的字头是Ｌ．Ｌ．——可是她住在库姆·特雷西。”\n\n“她是谁啊？”我问道。\n\n“她是弗兰克兰的女儿。”\n\n“什么！就是那个老神经弗兰克兰吗？”\n\n“正是，她和一个到沼地来画素描的姓莱昂丝的画家结了婚。可是，他竟是个下流的坏蛋，他遗弃了她。根据我所听到的情况判断，过错可能并不完全在于一方。任何有关她的事，她父亲决定一律不管，因为她没有得到父亲的同意就结了婚，也许还有其他原因。由于这放荡的老家伙和女儿之间的不和，弄得这女子陷入了窘迫的境地。”\n\n“那她怎么生活呢？”\n\n“我想老弗兰克兰会给她一些资助的，可是不可能多，因为他自己的那些乱事已经把他拖累得相当够受了。不管她是如何的罪有应得，总不能让她不可救药地趋于堕落啊。她的事传出去以后，此地有些人就设法帮助她，使她能过正当的生活。斯台普吞和查尔兹都帮了忙，我也给过一点钱，为的是让她作起打字的营业来。”\n\n他想知道我问这些问题的目的何在，可是我没法满足他的好奇心，并没有告诉他许多，因为我没有理由对随便任何人都给以信任。明早我要到库姆·特雷西去。如果我能见到那位名声暧昧的劳拉·莱昂丝太太的话，就会把为弄清这一连串神秘莫测的事情所做的调查工作大大地向前推进一步了。我一定发展到象蛇一样地聪明了，因为当摩梯末追问到很不便回答的时候，我就随便地问了问他弗兰克兰的颅骨属于哪一种类型。这样一来，一直到抵达目的地为止，除了头骨学之外就什么也听不到了。我总算没有白和歇洛克·福尔摩斯相处了这么多年。\n\n在这狂风暴雨的阴惨的天气里，只有一件值得记载的事。\n\n那就是我刚才和白瑞摩的谈话，他又给了我一张能在适当的时候亮出来用的有力的好牌。\n\n摩梯末留下来吃了晚饭，饭后他和准男爵两人玩起牌来。\n\n管事的到书房来给我送咖啡，我乘机问了他几个问题。\n\n“啊，”我说道，“你那好亲戚已经走了呢？还是仍然隐藏在那里？”\n\n“我不知道，先生。但愿他已经走了，因为他在这里只能给人添麻烦。从我最后一次给他送了食物之后，再没有听到过关于他的情况，那已是三天以前的事了。”\n\n“那一次你看到他了吗？”\n\n“没有，先生，可是当我再到那里去的时候，食物已经不见了。”\n\n“那么说，他一定还在那里呢？”\n\n“先生，除非是被另外那个人拿去，否则您一定会认为他还在那儿呢。”\n\n我坐在那里，咖啡还没有送到嘴边就又盯住他问道：“那么说，你是知道还有另外一个人罗？”\n\n“是的，先生，在沼地里还有另外一个人。”\n\n“你见到他了吗？”\n\n“没有，先生。”\n\n“那你怎么知道的呢？”\n\n“是塞尔丹告诉我的，先生，在一星期以前或是更早一些的时候。他也在藏着呢，可是据我估计他并不是逃犯。这些事我真伤脑筋，华生医生——我和您坦白地说吧，先生，这些事真让我伤脑筋。”他突然带着真挚热切的情感说道。\n\n“现在，你听我说，白瑞摩！我只是为了你的主人，否则对于这样的事我是毫无兴趣的。我到这里来除了帮助他之外，没有其他目的。坦白地告诉我吧，究竟是什么使你这样伤脑筋呢？”\n\n白瑞摩犹豫了一会儿，似乎是后悔不该冲口说出或是感觉难以用言语表达自己的感情。\n\n“就是这些不断发生的事，先生，”他终于对着被雨水冲刷着的向沼地而开的窗户挥舞着手喊了起来，“我敢肯定那里在进行着暗杀的勾当，正在酝酿着一个可怕的阴谋！先生，我真希望亨利爵士能回到伦敦去呢。”\n\n“可是，使你这样惊恐不安的有什么事实根据呢？”\n\n“您看查尔兹爵士的死！就拿验尸官所说的那些话来说，就已经够糟糕的了。您再看夜间沼地里的怪声，日落之后，就是您给多少钱也没有人肯从沼地里走过去。还有藏在那里的那个人，他在那里窥伺等待着！他等待什么呢？用意又是什么呢？所有这些，对巴斯克维尔家的任何人说来，都绝不是什么好兆。到亨利爵士的新仆人们来接管庄园的那一天，我是会很乐于离开这一切的。”\n\n“可是关于沼地里的这个陌生人，”我说道，“你能告诉我些什么吗？塞尔丹说过什么？他找到了他的藏身之所或是发现了他正在干什么吗？”\n\n“塞尔丹看到过他一两次，可是他是个很阴险的家伙，什么情况也不肯暴露。起初他想那人是个警察，可是不久他发现了那人自己另有计划。据他看来，那人象是个上流人物，可是他弄不清楚他究竟在干些什么。”\n\n“他说过那人住在什么地方吗？”\n\n“在山坡上古老的房子里——就是那古代人住过的小石头房子。”\n\n“可是他吃饭怎么办呢？”\n\n“塞尔丹发现有一个为他服务的小孩，给他送他所需要的东西。我敢说，那小孩是到库姆·特雷西去弄他需要的东西的。”\n\n“好极了，白瑞摩。这个问题咱们改日再深谈吧。”管事的走了以后，我透过模糊的窗玻璃，望着外面奔驰的云朵，和那被大风横扫的树顶联成的高低不一的轮廓线。这样的夜晚在室内就已够险恶的了，在沼地的一栋石屋里是什么味道就更不用说了。多么强烈的恨才能使一个人在这种时候潜藏在那样的地方！究竟是什么样的深远和急不可待的目的才使得他如此不辞辛劳！看来使我困扰万分的问题的中心就在沼地的那所房子里。我发誓要在明天尽一切可能探明那神秘的核心。", "is_ending": false, "clues": ["白瑞摩为报不告之恩，透露查尔斯爵士壁炉中烧焦的信件残片：‘……十点钟务请至大门前相见。L.L.’", "摩梯末医生证实L.L.即库姆·特雷西的劳拉·里昂斯夫人——弗兰克兰德婚姻不幸的女儿", "弗兰克兰德得意夸口其望远镜发现一个男孩每天提着食物篮送往岩岗的史前石屋"], "choices": [{"id": "ch10_c1", "text": "立即动身前往库姆·特雷西，当面问询劳拉·里昂斯夫人。", "target": "ch11_part1_lyons", "pov_switch": null, "pov_switch_name": null}, {"id": "ch10_c2", "text": "攀登黑色岩岗，直扑弗兰克兰德望远镜所见的神秘史前石屋据点。", "target": "ch11_part1_lyons", "pov_switch": null, "pov_switch_name": null}]}, "ch11_part1_lyons": {"id": "ch11_part1_lyons", "title": "第十一章 岩岗上的人（上：问讯劳拉·里昂斯）", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "branch", "anchor_name": null, "content": "用摘录我日记的方法写成的上一章，已经叙述到十月十八日了。那时正是这些怪事开始迅速发展，快要接近可怕的结局的时候。随后几天所发生的事情都已难忘地铭刻在我的记忆之中，不用参考当时所作的记录我就能说得出来。我就从明确了两个极为重要的事实的次日说起吧。所说的两个事实之一，就是库姆·特雷西的劳拉·莱昂丝太太曾经给查尔兹·巴斯克维尔爵士写过信，并约定在他死去的那个地点和时间相见；另一个就是潜藏在沼地里的那个人，可以在山边的石头房子里面找到。掌握了这两个情况之后，我觉得如果我还不能使疑案稍露端倪，那我一定不是低能就是缺乏勇气了。\n\n昨天傍晚，未能得到机会把我当时所了解到的关于莱昂丝太太的事告诉准男爵，因为摩梯末医生和他玩牌一直玩到很晚。今天早饭时，我才把我的发现告诉了他，并问他是否愿意陪我到库姆·特雷西去。起初他很急于要去，可是经过重新考虑之后，我们两人都觉得，如果我单独去，结果会更好一些。因为访问的形式愈是郑重其事，我们所能得知的情况就会愈少。于是我就把亨利爵士留在家里了，心中难免稍感不安地驾车出发去进行新的探索了。\n\n在到了库姆·特雷西以后，我叫波金斯把马匹安置好，然后就去探听我此来所要探访的那位女士了。我很容易地就找到了她的住所，位置适中，陈设也好。一个女仆很随便地把我领了进去，在我走进客厅的时候，一位坐在一架雷明吞牌打字机前的女士迅速地站了起来，笑容可掬地对我表示了欢迎；可是当她看出我是个陌生人的时候，她的面容又恢复了原状，重新坐了下来，并问我来访的目的。\n\n莱昂丝太太给人的第一个印象就是极端的美丽。她的两眼和头发都发深棕色，双颊上虽有不少雀斑，然而有着对棕色皮肤的人说来恰到好处的红润，如同在微黄的玫瑰花心里隐现着悦目的粉红色似的。我再重复一遍，首先产生的印象就是赞叹。可是随后就发现了缺点，那面孔上有些说不出来的不对头的地方，有些粗犷的表情，也许眼神有些生硬，嘴唇有些松弛，这些都破坏了那一无瑕疵的美貌。当然了，这些都是事后的想法，当时我只知道我是站在一个非常漂亮的女人的面前，听着她问我来访的目的。直到那时我才真的认识到我的任务是多么的棘手。\n\n“我有幸地，”我说道，“认识您的父亲。”\n\n这样的自我介绍作得很笨，我由那女人的反应上感觉得出来。\n\n“我父亲和我之间没有什么关系，”她说道，“我什么也不亏欠他，他的朋友也不是我的朋友。如果没有已故的查尔兹·巴斯克维尔爵士和一些别的好心肠的人的话，我也许早就饿死了，我父亲根本就没把我放在心上。”\n\n“我是因为有关已故的查尔兹·巴斯克维尔爵士的事才到这里来找您的。”\n\n惊吓之下，女士的面孔变得苍白起来，雀斑因而变得更加明显了。\n\n“关于他的事我能告诉您什么呢？”她问道。她的手指神经质地玩弄着她那打字机上的标点符号字键。\n\n“您认识他，是吗？”\n\n“我已经说过了，我非常感激他对于我的厚意。如果说我还能自立生活的话，那主要是由于他对我的可悲的处境的关心了。”\n\n“您和他通过信吗？”\n\n女士迅速地抬起头来，棕色的眼睛里闪着愤怒的光芒。\n\n“您问这些问题用意何在呢？”她厉声问道。\n\n“目的在于避免丑闻的传播。我在这里问总比让事情传出去弄得无法收拾要好一些吧。”\n\n她沉默不语，她的面孔依然很苍白。最后她带着不顾一切和挑战的神色抬起头来。\n\n“好吧，我回答吧，”她说道，“您的问题是什么？”\n\n“您和查尔兹爵士通过信吗？”\n\n“我确实给他写过一两次信，感谢他的体贴和慷慨。”\n\n“发信的日期您还记得吗？”\n\n“不记得了。”\n\n“您和他会过面吗？”\n\n“会过面，在他到库姆·特雷西来的时候会过一两次面。\n\n他是个很不爱出头露面的人，他宁愿暗地里做好事。”\n\n“可是，如果您很少看到他而又很少给他写信的话，关于您的事他怎么会知道得那样多，以致象您所说的那样来帮助您呢？”\n\n她毫不犹豫地回答了这个我认为是难于回答的问题。\n\n“有几个绅士知道我的可悲的经历，他们共同帮助了我。\n\n一个是斯台普吞先生，他是查尔兹爵士的近邻和密友，他心肠好极了，查尔兹爵士是通过他才知道我的事的。”\n\n我知道查尔兹·巴斯克维尔爵士曾有几次邀请斯台普吞负责为他分发救济金，因此女士的话听来倒似乎真实。\n\n“您曾经写过信给查尔兹爵士请他和您见面吗？”我继续问道。\n\n莱昂丝太太又气得脸红起来。\n\n“先生，这真是岂有此理的问题。”\n\n“我很抱歉，太太，可是我不得不重复它。”\n\n“那么我就回答吧，肯定没有过。”\n\n“就是在查尔兹爵士死的那天也没有过吗？”\n\n脸上的红色马上褪了下去，在我面前出现了一副死灰的面孔。她那焦枯的嘴唇已说不出那“没有”来了。与其说我听到了，不如说我是看出来了。\n\n“一定是您的记忆愚弄了您，”我说道，“我甚至能够背出您那封信中的一段来，是这样的：‘您是一位君子，请您千万将此信烧掉，并在十点钟的时候到栅门那里去。’”\n\n当时，我以为她已经晕过去了，可是她竟尽了最大的努力使自己恢复了镇静。\n\n“难道天下就没有一个真正的君子吗？！”她的呼吸变得急促起来。\n\n“您冤枉查尔兹爵士了。他确已把信烧掉了，可是有时虽是一封烧了的信还是可以认得出来的。您现在承认您曾写过这封信了吗！”\n\n“是的，我写过，”她喊道，同时把满腹的心事都滔滔不绝地说了出来，“是我写的。我干什么要否认这事呢？我没有理由要因此而感到可耻，我希望他能帮助我，我相信如果我能亲自和他见面的话，就可能得到他的协助，因此我才请求他和我见面的。”\n\n“可是为什么约在这样一个时间呢？”\n\n“因为那时我刚知道他第二天就要到伦敦去，而且一去也许就是几个月。由于其他原因我又不能早一点到那里去。”\n\n“可是为什么要在花园里会面而不到房子里面去拜访呢？”\n\n“您想，一个女人能在那个时候单独到一个单身汉的家里去吗？”\n\n“噢，您到那里去了以后，发生了什么事没有？”\n\n“我并没有去。”\n\n“莱昂丝太太！”\n\n“没有去，我拿一切我认为是最神圣的东西向您发誓。我没有去。有一件事使我不能去了。”\n\n“那是件什么事呢？”\n\n“那是一件私事，我不能说。”\n\n“那么，您承认您曾和查尔兹爵士约定在那正是他死去的时间和地点相会，可是您又否认您曾守约前往。”\n\n“这是实情。”\n\n我一再地盘问了她，可是往下再也问不出什么东西来了。\n\n“莱昂丝太太，”最后我结束了这次既长而又毫无结果的拜访，站起来说道，“由于您不肯全部彻底地说出您所知道的事，使您负起了严重的责任，并已把您自己置于非常危险的地位。如果我不得不叫来警察协助的话，您就会知道您受着多么大的嫌疑了。如果您是清白无罪的话，那为什么最初要否认在那一天您曾写信给查尔兹爵士呢？”\n\n“因为我恐怕从那问题上得出什么不正确的结论来，那样我就可能被牵连到一件丑闻中去了。”\n\n“那么您为什么那样迫切地要求查尔兹爵士把您的信毁掉呢？”\n\n“如果您已经读过那封信的话，您就应该知道了。”\n\n“我并没有说我读过信的全部啊。”\n\n“您却引用了其中的一部分。”\n\n“我只引用了附笔，我说过，那封信已被烧掉了，而且并非全信都能辨认。我还要问您，为什么您那样迫切地要求查尔兹爵士把他临死那天所收到的这封信毁掉呢？”\n\n“因为这是一件纯属私人之间的事。”\n\n“更重要的原因恐怕是您要避免公开的追究调查吧。”\n\n“那么我就告诉您吧，如果您曾听过任何关于我的悲惨的经历的话，您就会知道我曾经草率地结过婚，事后当然又因此而懊悔。”\n\n“我听到过很多了。”\n\n“我过着不断遭受我已厌恶透顶的丈夫迫害的生活。法律袒护着他，每天我都面临着被迫和他同居的可能。在我给查尔兹爵士写这封信的时候，我听说如果我能支付一笔钱的话，我就可能重获自由了。这就是我所想望的一切——心地宁静、幸福、自尊——这就是一切。我知道查尔兹爵士是慷慨的，而且我想，如果他听我亲口讲出这事的话，他就一定会帮助我。”\n\n“那么您为什么又没有去呢？”\n\n“因为就在那时候，我又从别处得到帮助了。”\n\n“那么，为什么您没有写信给查尔兹爵士解释这件事呢？”\n\n“如果第二天早晨我没有在报上看到他的噩耗的话，我一定会这样做的。”\n\n那女人的叙述前后相符，我提尽了所有的问题也找不出破绽来。我只能调查一下，是否恰在悲剧发生的时候或是接近悲剧发生的时候，她确曾通过法律程序向她丈夫提出过离婚诉讼。", "is_ending": false, "clues": ["劳拉·里昂斯夫人承认写信求助查尔斯爵士以筹资办理离婚", "她坚决否认案发当夜去过水松夹道栅门，声称因有人另予相助而爽约", "华生敏锐察觉她在极度恐惧中隐藏着致命的内情"], "choices": [{"id": "ch11_p1_c1", "text": "驱车返回达特沼地，直上黑色岩岗探查史前石屋据点。", "target": "ch11_part2_stone_hut", "pov_switch": null, "pov_switch_name": null}, {"id": "ch11_p1_c2", "text": "严厉追问劳拉·里昂斯夫人暗中资助她的是否正是斯台普吞。", "target": "ch11_part2_stone_hut", "pov_switch": null, "pov_switch_name": null}]}, "ch11_part2_stone_hut": {"id": "ch11_part2_stone_hut", "title": "第十一章 岩岗上的人（下：石屋隐士的真面目）", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "anchor", "anchor_name": "anchor_man_on_tor", "content": "看来，如果她真的去过巴斯克维尔庄园的话，恐怕她不见得敢说她没有去过。因为她总得坐马车才能到那里去，这样的话，要到第二天清晨她才能回到库姆·特雷西，这样一次远行是无法保守秘密的。因此，最大的可能就是，她说的是实话，或者说至少有一部分是实情。我垂头丧气地回来了，这是再度的碰壁，这堵墙好象是修在每一条我想通过它而抵达目的地的路上似的。可是我愈想象那女士的面孔和她的神情，我就愈觉得她还有些东西是瞒着我的。为什么她的脸要变得那样苍白呢？为什么她每次都要竭力否认而只有到了迫不得已的时候才承认呢？在悲剧发生的时候，为什么她那样保持沉默呢？当然罗，对这些问题的解释并非象她解释给我听的那样简单。目前，沿此方向我已无法再前进一步，只好转到沼地里的石屋去搜寻其他线索了。\n\n可是这也是个希望极为渺茫的方向，在我回去的路上我感到了这一点。我看到一座山接着一座山，上面都有古时人们生活的遗迹。白瑞摩只不过说那个人住在这些废弃不用的小房之中的一幢里，这种小房子成百成千地散布在整个的沼地里。幸而我曾看见过那人站在黑岩岗的绝顶上，我不妨就先以此作为线索，把我看到过他的那个地方作为进行搜寻的中心。我应当从那里开始查看沼地里的每一幢小房，直至找到我要找的那幢为止。如果那人呆在房内的话，我要让他亲口说明他是谁，为什么要这么长时期地跟踪我们，必要时甚至不惜用我的手枪逼着他说。在摄政街的人群里他也许能从我们的手中溜跑，可是在这样荒漠的沼地里，恐怕他就会感到不知如何是好了。但是如果我找到了那小房而那人不在房里的话，不管需要熬多久的夜，我也要在那里等着，直到他回来为止。在伦敦，福尔摩斯让他溜跑了，在我的师傅失败之后，如果我能将他查出的话，对我说来确是一个很大的胜利。\n\n我们在对这个案件进行调查的工作中，运气一再地不佳，可是现在我竟时来运转了，而送来好运道的使者不是别人，恰是弗兰克兰先生。他胡须花白，面色红润，正站在他那花园的门口，那园门端正地开向我要走过的大道。\n\n“好啊，华生医生，”他兴致勃勃地喊道，“您真得让您的马休息一下了，进来喝一杯酒祝贺我吧。”\n\n在听到他如何对待他的女儿以后，我对他实在说不上还有什么好感，可是我正急于想把波斯金和马车遣回家去，这确实是个好机会。我下了车，给亨利爵士写了个便条，说明我要在晚饭时分散步回去。然后我就跟着弗兰克兰先生走进了他的饭厅。*\n\n“对我说来可真是个了不起的一天啊，先生，是我一生里的一个大喜的日子，”他不停地格格地笑着，一面喊道，“我已了结两件案子了。我一定要教
