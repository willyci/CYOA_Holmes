heir in Canada. In any case he would very soon learn it from his friend Dr. Mortimer, and he was told by the latter all details about the arrival of Henry Baskerville. Stapleton’s first idea was that this young stranger from Canada might possibly be done to death in London without coming down to Devonshire at all. He distrusted his wife ever since she had refused to help him in laying a trap for the old man, and he dared not leave her long out of his sight for fear he should lose his influence over her. It was for this reason that he took her to London with him. They lodged, I find, at the Mexborough Private Hotel, in Craven Street, which was actually one of those called upon by my agent in search of evidence. Here he kept his wife imprisoned in her room while he, disguised in a beard, followed Dr. Mortimer to Baker Street and afterwards to the station and to the Northumberland Hotel. His wife had some inkling of his plans; but she had such a fear of her husband—a fear founded upon brutal ill-treatment—that she dare not write to warn the man whom she knew to be in danger. If the letter should fall into Stapleton’s hands her own life would not be safe. Eventually, as we know, she adopted the expedient of cutting out the words which would form the message, and addressing the letter in a disguised hand. It reached the baronet, and gave him the first warning of his danger.\n\n“It was very essential for Stapleton to get some article of Sir Henry’s attire so that, in case he was driven to use the dog, he might always have the means of setting him upon his track. With characteristic promptness and audacity he set about this at once, and we cannot doubt that the boots or chamber-maid of the hotel was well bribed to help him in his design. By chance, however, the first boot which was procured for him was a new one and, therefore, useless for his purpose. He then had it returned and obtained another—a most instructive incident, since it proved conclusively to my mind that we were dealing with a real hound, as no other supposition could explain this anxiety to obtain an old boot and this indifference to a new one. The more _outré_ and grotesque an incident is the more carefully it deserves to be examined, and the very point which appears to complicate a case is, when duly considered and scientifically handled, the one which is most likely to elucidate it.\n\n“Then we had the visit from our friends next morning, shadowed always by Stapleton in the cab. From his knowledge of our rooms and of my appearance, as well as from his general conduct, I am inclined to think that Stapleton’s career of crime has been by no means limited to this single Baskerville affair. It is suggestive that during the last three years there have been four considerable burglaries in the west country, for none of which was any criminal ever arrested. The last of these, at Folkestone Court, in May, was remarkable for the cold-blooded pistolling of the page, who surprised the masked and solitary burglar. I cannot doubt that Stapleton recruited his waning resources in this fashion, and that for years he has been a desperate and dangerous man.\n\n“We had an example of his readiness of resource that morning when he got away from us so successfully, and also of his audacity in sending back my own name to me through the cabman. From that moment he understood that I had taken over the case in London, and that therefore there was no chance for him there. He returned to Dartmoor and awaited the arrival of the baronet.”\n\n“One moment!” said I. “You have, no doubt, described the sequence of events correctly, but there is one point which you have left unexplained. What became of the hound when its master was in London?”\n\n“I have given some attention to this matter and it is undoubtedly of importance. There can be no question that Stapleton had a confidant, though it is unlikely that he ever placed himself in his power by sharing all his plans with him. There was an old manservant at Merripit House, whose name was Anthony. His connection with the Stapletons can be traced for several years, as far back as the school-mastering days, so that he must have been aware that his master and mistress were really husband and wife. This man has disappeared and has escaped from the country. It is suggestive that Anthony is not a common name in England, while Antonio is so in all Spanish or Spanish-American countries. The man, like Mrs. Stapleton herself, spoke good English, but with a curious lisping accent. I have myself seen this old man cross the Grimpen Mire by the path which Stapleton had marked out. It is very probable, therefore, that in the absence of his master it was he who cared for the hound, though he may never have known the purpose for which the beast was used.\n\n“The Stapletons then went down to Devonshire, whither they were soon followed by Sir Henry and you. One word now as to how I stood myself at that time. It may possibly recur to your memory that when I examined the paper upon which the printed words were fastened I made a close inspection for the water-mark. In doing so I held it within a few inches of my eyes, and was conscious of a faint smell of the scent known as white jessamine. There are seventy-five perfumes, which it is very necessary that a criminal expert should be able to distinguish from each other, and cases have more than once within my own experience depended upon their prompt recognition. The scent suggested the presence of a lady, and already my thoughts began to turn towards the Stapletons. Thus I had made certain of the hound, and had guessed at the criminal before ever we went to the west country.\n\n“It was my game to watch Stapleton. It was evident, however, that I could not do this if I were with you, since he would be keenly on his guard. I deceived everybody, therefore, yourself included, and I came down secretly when I was supposed to be in London. My hardships were not so great as you imagined, though such trifling details must never interfere with the investigation of a case. I stayed for the most part at Coombe Tracey, and only used the hut upon the moor when it was necessary to be near the scene of action. Cartwright had come down with me, and in his disguise as a country boy he was of great assistance to me. I was dependent upon him for food and clean linen. When I was watching Stapleton, Cartwright was frequently watching you, so that I was able to keep my hand upon all the strings.\n\n“I have already told you that your reports reached me rapidly, being forwarded instantly from Baker Street to Coombe Tracey. They were of great service to me, and especially that one incidentally truthful piece of biography of Stapleton’s. I was able to establish the identity of the man and the woman and knew at last exactly how I stood. The case had been considerably complicated through the incident of the escaped convict and the relations between him and the Barrymores. This also you cleared up in a very effective way, though I had already come to the same conclusions from my own observations.\n\n“By the time that you discovered me upon the moor I had a complete knowledge of the whole business, but I had not a case which could go to a jury. Even Stapleton’s attempt upon Sir Henry that night which ended in the death of the unfortunate convict did not help us much in proving murder against our man. There seemed to be no alternative but to catch him red-handed, and to do so we had to use Sir Henry, alone and apparently unprotected, as a bait. We did so, and at the cost of a severe shock to our client we succeeded in completing our case and driving Stapleton to his destruction. That Sir Henry should have been exposed to this is, I must confess, a reproach to my management of the case, but we had no means of foreseeing the terrible and paralyzing spectacle which the beast presented, nor could we predict the fog which enabled him to burst upon us at such short notice. We succeeded in our object at a cost which both the specialist and Dr. Mortimer assure me will be a temporary one. A long journey may enable our friend to recover not only from his shattered nerves but also from his wounded feelings. His love for the lady was deep and sincere, and to him the saddest part of all this black business was that he should have been deceived by her.\n\n“It only remains to indicate the part which she had played throughout. There can be no doubt that Stapleton exercised an influence over her which may have been love or may have been fear, or very possibly both, since they are by no means incompatible emotions. It was, at least, absolutely effective. At his command she consented to pass as his sister, though he found the limits of his power over her when he endeavoured to make her the direct accessory to murder. She was ready to warn Sir Henry so far as she could without implicating her husband, and again and again she tried to do so. Stapleton himself seems to have been capable of jealousy, and when he saw the baronet paying court to the lady, even though it was part of his own plan, still he could not help interrupting with a passionate outburst which revealed the fiery soul which his self-contained manner so cleverly concealed. By encouraging the intimacy he made it certain that Sir Henry would frequently come to Merripit House and that he would sooner or later get the opportunity which he desired. On the day of the crisis, however, his wife turned suddenly against him. She had learned something of the death of the convict, and she knew that the hound was being kept in the outhouse on the evening that Sir Henry was coming to dinner. She taxed her husband with his intended crime, and a furious scene followed in which he showed her for the first time that she had a rival in his love. Her fidelity turned in an instant to bitter hatred, and he saw that she would betray him. He tied her up, therefore, that she might have no chance of warning Sir Henry, and he hoped, no doubt, that when the whole countryside put down the baronet’s death to the curse of his family, as they certainly would do, he could win his wife back to accept an accomplished fact and to keep silent upon what she knew. In this I fancy that in any case he made a miscalculation, and that, if we had not been there, his doom would none the less have been sealed. A woman of Spanish blood does not condone such an injury so lightly. And now, my dear Watson, without referring to my notes, I cannot give you a more detailed account of this curious case. I do not know that anything essential has been left unexplained.”\n\n“He could not hope to frighten Sir Henry to death as he had done the old uncle with his bogie hound.”\n\n“The beast was savage and half-starved. If its appearance did not frighten its victim to death, at least it would paralyze the resistance which might be offered.”\n\n“No doubt. There only remains one difficulty. If Stapleton came into the succession, how could he explain the fact that he, the heir, had been living unannounced under another name so close to the property? How could he claim it without causing suspicion and inquiry?”\n\n“It is a formidable difficulty, and I fear that you ask too much when you expect me to solve it. The past and the present are within the field of my inquiry, but what a man may do in the future is a hard question to answer. Mrs. Stapleton has heard her husband discuss the problem on several occasions. There were three possible courses. He might claim the property from South America, establish his identity before the British authorities there and so obtain the fortune without ever coming to England at all, or he might adopt an elaborate disguise during the short time that he need be in London; or, again, he might furnish an accomplice with the proofs and papers, putting him in as heir, and retaining a claim upon some proportion of his income. We cannot doubt from what we know of him that he would have found some way out of the difficulty. And now, my dear Watson, we have had some weeks of severe work, and for one evening, I think, we may turn our thoughts into more pleasant channels. I have a box for _Les Huguenots_. Have you heard the De Reszkes? Might I trouble you then to be ready in half an hour, and we can stop at Marcini’s for a little dinner on the way?”\n\nTHE END\n\n*** END OF THE PROJECT GUTENBERG EBOOK 2852 ***", "is_ending": true, "clues": ["Jack Stapleton captured at dawn, convicted at the Old Bailey on Mrs. Stapleton's testimony, and sentenced to the gallows"], "choices": []}, "holmes_ch01_part1_observation": {"id": "holmes_ch01_part1_observation", "title": "Chapter 1: Mr. Sherlock Holmes (Part I: The Science of Deduction)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "anchor", "anchor_name": "anchor_chapter1_holmes", "content": "I sat at the breakfast-table in 221B Baker Street, my back turned toward the hearth-rug, watching the curved reflection of Dr. Watson in the well-polished silver coffee-pot. He had been turning Dr. Mortimer's forgotten walking stick in his fingers for the past ten minutes, his brow furrowed with earnest academic concentration.\n\n'Well, Watson,' said I, 'what do you make of it?'\n\n'How did you know what I was doing?' he gasped, glancing round with that ingenuous astonishment which never fails to delight me. 'I believe you have eyes in the back of your head!'\n\n'I have, at least, a very well-polished silver-plated coffee-pot in front of me,' I answered, smiling. 'Come, Watson, tell me what you deduce from the stick. Let me hear you reconstruct the man by an examination of it.'\n\nWith immense gravity, Watson delivered his diagnosis: an elderly, venerable country doctor, esteemed by the local hunt, who had received this sturdy Penang-lawyer from grateful rural patients. It was a charming hypothesis, conceived with all of Watson's generous enthusiasm, but utterly innocent of the severe laws of observation.\n\n'Really, Watson, you excel yourself,' I remarked, turning to face him. 'In noting your fallacies, one is guided toward the truth. You are not yourself luminous, but you are a conductor of light!'\n\nI took the stick from his hands and examined it under my pocket lens. The facts were written across the wood with the clarity of print. The thick iron ferrule was worn down to half its original length, indicating extensive walking across rough gravel roads. The initials 'C.C.H.' stood not for a hunt club, but for Charing Cross Hospital. The date, 1884, five years past, marked the moment when a promising young house-surgeon, rather than a venerable practitioner, had resigned his post to establish a modest practice in rural Devonshire. And finally, running across the middle of the stick, were unmistakable indented marks—the tooth-impressions of a dog. The spaniel's jaw was distinctly outlined: teeth too broad for a terrier, too narrow for a mastiff. A curly-haired spaniel, which was even now trotting behind its master up our front steps!\n\nThe hall bell rang below. Through the window, I caught sight of a gaunt gentleman and a small, panting dog waiting upon the pavement.", "is_ending": false, "clues": ["Mortimer walking stick worn iron ferrule indicates rural gravel walking", "C.C.H. 1884 inscription resolves to Charing Cross Hospital house-surgeon", "Tooth impressions identify a curly-haired spaniel retriever"], "choices": [{"id": "h_ch1_p1_c1", "text": "Greet Dr. James Mortimer and invite him to explain his extraordinary visit.", "target": "holmes_ch01_part2_consultation", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch1_p1_c2", "text": "[Switch POV to Dr. Watson] View Mortimer from Watson's sympathetic gaze.", "target": "ch01_part2_mortimer", "pov_switch": "watson", "pov_switch_name": "Dr. John H. Watson"}]}, "holmes_ch01_part2_consultation": {"id": "holmes_ch01_part2_consultation", "title": "Chapter 1: Mr. Sherlock Holmes (Part II: The 1742 Manuscript)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "The door opened, and Dr. James Mortimer stepped into the room. He was very tall, very thin, with a long nose like a beak, which jutted out between two keen, grey eyes, set closely together and sparkling brightly behind a pair of gold-rimmed glasses. He was clad in a professional but rather slovenly fashion, for his frock-coat was dingy and his trousers frayed. Though young, his long back was already bowed, and he walked with a forward thrust of his head and a general air of peering benevolence.\n\n'I had hardly hoped,' he said, bowing with awkward courtliness, 'to find you in. Mr. Sherlock Holmes, I presume? And Dr. Watson. Ah, Mr. Holmes, you interest me extremely. I had hardly expected so dolichocephalic a skull or such well-marked supra-orbital development! Would you have any objection to my running my finger along your parietal fissure? A cast of your skull, sir, until the original is available, would be an ornament to any anthropological museum.'\n\nI waved him to an armchair, mildly amused by his enthusiastic craniology. 'You are an enthusiast in your line of thought, sir, as I am in mine. But I observe from your forefinger that you make your own cigarettes. Pray do not hesitate to light up.'\n\nHe drew a paper from his breast-pocket with nervous fingers. 'The truth is, Mr. Holmes, I have come upon a matter of the most singular and grave importance. In your special line of research, you stand second only to Monsieur Bertillon of Paris.'\n\n'Indeed, sir! Then perhaps Monsieur Bertillon would be the proper person to consult.'\n\n'In pure precision of anthropometry, perhaps,' he corrected quickly. 'Yet as a practical man of affairs, as an unraveller of dark and tangled skeins, you are without a rival in Europe. The matter which brings me to you relates to the family of the Baskervilles. I hold in my pocket an ancient manuscript, dating from the year 1742, placed in my trust by the late Sir Charles Baskerville, whose sudden and tragic death three months ago cast a pall of horror across the whole of Dartmoor.'\n\nHe smoothed the yellowed parchment across his knee, his eyes dark with an emotion that transcended mere academic curiosity.", "is_ending": false, "clues": ["Mortimer identifies Holmes as second-highest expert in Europe behind Bertillon", "Ancient manuscript dated 1742 preserved from Baskerville Hall"], "choices": [{"id": "h_ch1_p2_c1", "text": "Invite Mortimer to read the manuscript of the Baskerville curse.", "target": "holmes_ch02_part1_legend", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch1_p2_c2", "text": "Question Mortimer directly regarding the sudden demise of Sir Charles Baskerville.", "target": "holmes_ch02_part2_footprints", "pov_switch": null, "pov_switch_name": null}]}, "holmes_ch02_part1_legend": {"id": "holmes_ch02_part1_legend", "title": "Chapter 2: The Curse of the Baskervilles (Part I: The Legend of Hugo)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "anchor", "anchor_name": "anchor_curse_holmes", "content": "Mortimer pushed his spectacles up onto his high forehead and began to read from the 1742 manuscript with a high, cracked voice. It was written in the quaint, legalistic English of the early eighteenth century, warning the heirs of Baskerville against the ancestral curse that had haunted the line since the Great Rebellion.\n\nThe tale was familiar enough in the annals of rural folklore: Hugo Baskerville, a wild, profane, God-forsaken roisterer, had conceived a ruthless passion for the maiden daughter of a yeoman near Widecombe. One Michaelmas night, with five of his dissolute companions, he carried the girl off to the Hall and locked her in an upper chamber. While the revellers bellowed obscene songs below, the terrified girl lowered herself by the ivy and fled across the moonlit moor toward her father's farm, nine miles distant.\n\nWhen Hugo discovered her escape, he swore a hideous oath, giving his body and soul to the powers of evil if he might overtake her, and unleashed his pack of hounds into the dark. His companions mounted their horses and galloped after him. In a deep granite gorge upon the moor, they came upon Hugo's black mare, riderless and lathered in white foam. Pushing their horses down into the ravine, they found the maiden lying dead upon the heather, slain by fear and fatigue. But beyond her, crouched over the prostrate body of Hugo Baskerville, was a foul thing—a great, black beast, shaped like a hound yet larger than any hound that ever mortal eye had rested upon, tearing at his throat. As they watched in frozen terror, the monster turned its blazing eyes and dripping jaws upon them, and the horsemen shrieked and fled for their lives.\n\nI leaned back in my chair, stifling a yawn, and pressed my fingertips together.\n\n'Well, Mr. Holmes?' asked Mortimer, looking up over his glasses. 'Does the narrative interest you?'\n\n'To a collector of fairy tales, perhaps,' said I coolly. 'It has the picturesque extravagance of an eighteenth-century melodrama. But surely, Dr. Mortimer, you have not brought me this Gothic nursery-rhyme to solve in the year of our Lord 1889?'", "is_ending": false, "clues": ["1742 manuscript recounts Hugo Baskerville's profane revels and death upon the moor", "Legend warns the sons of Baskerville never to cross the moor in the dark hours"], "choices": [{"id": "h_ch2_p1_c1", "text": "Listen to the modern facts of Sir Charles's death and the physical footprints.", "target": "holmes_ch02_part2_footprints", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch2_p1_c2", "text": "Dismiss the romantic fairy tale and demand tangible, modern evidence.", "target": "holmes_ch02_part2_footprints", "pov_switch": null, "pov_switch_name": null}]}, "holmes_ch02_part2_footprints": {"id": "holmes_ch02_part2_footprints", "title": "Chapter 2: The Curse of the Baskervilles (Part II: Footprints of a Gigantic Hound)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "'The legend is old, Mr. Holmes,' Mortimer replied, his voice dropping to a whisper, 'but what I have now to read to you is of today.'\n\nHe drew a folded copy of the Devon County Chronicle from his pocket and read the coroner's verdict on the sudden death of Sir Charles Baskerville. Sir Charles, having made a vast fortune in South African speculation, had returned to restore his ancestral seat. He was beloved for his benevolence, but suffered from chronic heart disease and nervous dread. On the night of May 4th, he took his customary evening stroll down the famous yew alley of Baskerville Hall. He never returned. At midnight, his butler, Barrymore, found the old baronet lying dead at the far end of the alley, near the wicker gate opening onto the moor. The autopsy revealed no trace of violence, and the verdict was death from cardiac exhaustion.\n\nMortimer refolded the paper. 'That is the official account, Mr. Holmes. It was the account given to the coroner's jury. But I have withheld the real facts, because as a doctor and a trustee of the estate, I feared to depopulate the district by exciting panic.'\n\nMy attention sharpened instantly. 'You investigated the ground yourself?'\n\n'I did. The yew alley is bounded on either side by impenetrable twelve-foot hedges. Down the center is a strip of turf eight feet broad, with gravel paths on either side. Sir Charles had walked down the path, stopped at the wicker gate that opens onto the moor, and stood there smoking for at least twenty minutes, as proved by the two cigar ashes dropped on the ground. When he turned to leave the gate, his footprints changed! He had not walked back—he had run, run desperately for his life, running on his tiptoes until his heart burst and he pitched forward upon his face.'\n\n'And what of the marks upon the earth?' I demanded.\n\nMortimer leaned forward until his pale face was within six inches of mine. His pupils were dilated with sheer horror.\n\n'Mr. Holmes, there were no marks upon his body. But twenty yards beyond where he lay, upon the soft, damp peat outside the wicker gate, where no sheep or cattle could have trodden—I saw them distinctly, freshly pressed into the mire!'\n\n'Footprints?'\n\n'Footprints.'\n\n'A man's or a woman's?'\n\nDr. Mortimer looked at us in a whisper that made the window-panes seem to rattle:\n\n'Mr. Holmes, they were the footprints of a gigantic hound!'", "is_ending": false, "clues": ["Sir Charles stood smoking for 20 minutes at the moor gate before his death", "Footprints changed to tiptoes, indicating flight from a terrifying pursuer", "Twenty yards from the body lay the fresh, distinct footprints of a gigantic hound"], "choices": [{"id": "h_ch2_p2_c1", "text": "Commit to investigating the modern problem and order a complete survey map of Dartmoor.", "target": "holmes_ch03_problem", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch2_p2_c2", "text": "Interrogate Mortimer closely concerning the precise physical ground and barriers around the gate.", "target": "holmes_ch03_problem", "pov_switch": null, "pov_switch_name": null}]}, "holmes_ch03_problem": {"id": "holmes_ch03_problem", "title": "Chapter 3: The Problem (Dartmoor Topography and the Lone Vigil)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "The moment Mortimer took his departure, I sent Watson out for the day, advising him to seek fresh air. For my own part, I had no desire for movement. I had a problem of the first magnitude to digest.\n\nI took down my mouse-coloured dressing-gown, filled a cherry-wood pipe with the strongest, foulest shag tobacco from the toe of my Persian slipper, and locked myself in the sitting-room. By noon, the air was dense with an impenetrable blue haze. Upon the table lay spread a six-inch Ordnance Survey map of Dartmoor.\n\nHere, within this five-mile perimeter of wild Devonshire bog and granite, lay the arena of our duel. I traced every contour line with a dry pen. Baskerville Hall stood encircled by dense plantations, facing south toward the vast, treeless wilderness. Four miles to the north-east lay the Great Grimpen Mire, marked with sinister marsh-crosses—a quagmire capable of swallowing an ox whole. Isolated within its fringes sat Merripit House, occupied, so Mortimer told me, by a naturalist named Stapleton and his sister. Further south lay Coombe Tracey and the estate of old Frankland.\n\nThe financial calculus was inescapable. Sir Charles had died intestate, and the entire estate—securities, land, timber, and liquid funds amounting to upwards of £740,000—passed by law to his nephew, Sir Henry Baskerville, a young farmer from Canada who was even now landing at Waterloo station.\n\nIf the superstition of the hound was an engine devised by human cunning, who stood to profit? If Sir Henry fell, who was the next heir? Mortimer had spoken of a distant cousin, James Desmond, an elderly clergyman in Westmorland. But behind the screen of wilderness, what other hands moved the pawns? The hound was physical—its footprints in the peat settled that beyond dispute. If it was flesh and blood, it required feeding, sheltering, and directing.\n\nI knocked the gray ashes from my third pipe as twilight fell over London. A worthy adversary had thrown down the gage of battle. Tomorrow morning, at ten o'clock, Sir Henry Baskerville would arrive at 221B Baker Street. We should see whether human intellect could unravel what provincial terror had consecrated to the devil.", "is_ending": false, "clues": ["Sir Henry Baskerville is arriving from Canada at Waterloo Station", "Ordnance Survey maps reveal Grimpen Mire, Merripit House, and isolated tors", "Total estate valued at £740,000 creates monumental financial motive"], "choices": [{"id": "h_ch3_c1", "text": "Prepare to receive Sir Henry Baskerville and Dr. Mortimer at Baker Street tomorrow.", "target": "holmes_ch04_part1_warning", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch3_c2", "text": "[Switch POV to Dr. Watson] See Watson returning to find 221B choked with shag tobacco.", "target": "ch03_problem", "pov_switch": "watson", "pov_switch_name": "Dr. John H. Watson"}]}, "holmes_ch04_part1_warning": {"id": "holmes_ch04_part1_warning", "title": "Chapter 4: Sir Henry Baskerville (Part I: The Cut Times and the Missing Boot)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "anchor", "anchor_name": "anchor_london_mission_holmes", "content": "At precisely ten o'clock, Sir Henry Baskerville was ushered into our sitting-room by Dr. Mortimer. He was a small, alert, dark-eyed man about thirty years of age, very sturdily built, with thick black eyebrows and a strong, pugnacious face. He wore a ruddy-tinted tweed suit and had the weather-beaten complexion of one who has spent most of his life in the open air.\n\nHe wasted no time in civilities. 'Mr. Holmes,' said he, tossing an envelope upon the table, 'I have received this extraordinary letter this morning at the Northumberland Hotel. Perhaps you can tell me what the devil it means!'\n\nThe envelope was of rough, cheap paper, addressed in crude, printed characters to 'Sir Henry Baskerville, Northumberland Hotel.' Inside lay a single sheet of folio paper, upon which was pasted a sentence composed of printed words cut out from a newspaper:\n\n'As you value your life or your reason keep away from the moor.'\n\nThe word 'moor' alone was written in ink.\n\nI took out my lens and examined the slip with intense interest. 'A charming specimen!' I murmured. 'Watson, observe the type. It is Bourgeois, leaded, exactly five points. These words were cut from yesterday's Times—specifically, the leading article on the tariff question. The scissors used were short-bladed nail-scissors, for the cuts are curved and ragged. And notice the faint, delicate odor that clings to the paper—white jessamine, the perfume of an educated woman.'\n\n'Good heavens!' cried Mortimer. 'An educated woman?'\n\n'And that is not all,' Sir Henry broke in, his temper flaring. 'Somebody has played a senseless prank upon me at my hotel! Last night I put out a brand-new pair of tan boots on the corridor mat to be varnished. This morning, one of the boots has vanished into thin air! The hall-porter and the boot-boy have searched every corner of the hotel in vain.'\n\n'A new tan boot?' I asked, my brows knitting. 'A boot that had never been worn?'\n\n'Never! I bought them only yesterday in the Strand, and had never yet had them on my feet.'\n\nI leaned back, my pulse quickening. An enemy was shadowing Sir Henry in London with terrifying audacity. But why steal an unworn boot?", "is_ending": false, "clues": ["Anonymous warning letter composed from words cut from yesterday's Times lead article", "Cut with short-bladed nail scissors, pasted with gum, faintly scented with white jessamine", "Sir Henry's brand new tan boot stolen from Northumberland Hotel"], "choices": [{"id": "h_ch4_p1_c1", "text": "Shadow Sir Henry and Mortimer down Regent Street to flush out any watcher.", "target": "holmes_ch04_part2_cab_chase", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch4_p1_c2", "text": "[Switch POV to Jack Stapleton] See the stalker tracking Sir Henry with a false beard.", "target": "stapleton_ch04_part1_hotel_shadow", "pov_switch": "stapleton", "pov_switch_name": "Jack Stapleton"}]}, "holmes_ch04_part2_cab_chase": {"id": "holmes_ch04_part2_cab_chase", "title": "Chapter 4: Sir Henry Baskerville (Part II: The Shadow in Regent Street)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "The moment Sir Henry and Mortimer left Baker Street to walk toward their hotel, I sprang to my feet.\n\n'Quick, Watson! Your hat and boots! Not a second to lose!'\n\nWe slipped down into the street and shadowed them at two hundred yards. They turned into Oxford Street and down Regent Street. Ahead of them, keeping pace on the opposite side of the road, crawled a hansom cab. Inside the cab, dimly visible through the glass, sat a passenger leaning forward with sharp, watchful eyes.\n\nI quickened my pace. Suddenly, the passenger's eyes met mine. He recognized me in a flash! A hand was thrust through the trap-door in the roof, the cabby whipped his horse, and in an instant the hansom went tearing down Regent Street toward Waterloo Place.\n\n'No. 2704!' I shouted, memorizing the white numerals upon the vehicle's rear. 'A bushy black beard and piercing black eyes! He was an adversary worthy of our steel, Watson.'\n\nWe walked straight to the District Messenger Office, where I engaged my sharp young aide, Cartwright. I sent him with five sovereigns to visit all twenty-three hotels in the Charing Cross district, with instructions to examine the waste-paper baskets for the mutilated copy of yesterday's Times.\n\nAt two o'clock, we called upon Sir Henry at the Northumberland Hotel. We found the baronet purple with fury.\n\n'Look here, Mr. Holmes!' he roared, pointing to the wardrobe. 'The madman has been at it again! That missing tan boot of mine has turned up under the wicker chair in the corner. But now—by all the devils in hell—one of my old black boots, a worn pair that I brought with me from Canada, has been stolen from outside my door!'\n\nMy heart gave a fierce leap. The pieces of the puzzle slammed together in my mind with blinding clarity.\n\n'An old black boot!' I exclaimed. 'A boot that you had actually walked in?'\n\n'Yes, covered with mud from yesterday's walk!'\n\n'Ah!' I whispered to Watson. 'An unworn boot carries no scent. But a worn boot carries the unmistakable scent of living flesh!'", "is_ending": false, "clues": ["Hansom cab No. 2704 was shadowing Sir Henry down Regent Street", "Spy inside cab had piercing black eyes and a full, bushy black beard", "The tan boot reappeared at the hotel, but an old, worn black boot was stolen in its place"], "choices": [{"id": "h_ch4_p2_c1", "text": "Dispatch Cartwright to 23 hotels and summon cabman No. 2704 to Baker Street.", "target": "holmes_ch05_threads", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch4_p2_c2", "text": "Confront the Northumberland Hotel manager regarding the boot substitutions.", "target": "holmes_ch05_threads", "pov_switch": null, "pov_switch_name": null}]}, "holmes_ch05_threads": {"id": "holmes_ch05_threads", "title": "Chapter 5: Three Broken Threads (The Insolent Cabman & The Secret Expedition)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "anchor", "anchor_name": "anchor_arrival_holmes", "content": "By evening, the three threads of our London inquiry had snapped like rotten twine.\n\nFirst, Cartwright returned, dust-stained and exhausted, to report that in all twenty-three hotels, not a scrap of cut newspaper could be found. The cunning author of the warning letter had burned the mutilated Times or cast it down a sewer grating.\n\nSecond, the test telegram I had wired to the butler, Barrymore, at Baskerville Hall had been delivered into his own hands by the postmaster's boy, proving that the man with the black beard in London was unlikely to be the butler away from his post.\n\nAnd third, cabman John Clayton, driver of hansom No. 2704, arrived at Baker Street in response to our police enquiry. He was a hearty, honest fellow who told his story without hesitation.\n\n'The gentleman hailed me in Trafalgar Square,' Clayton said. 'He was a gent with a thick black beard and dark glasses, dressed like a toff. He bade me follow that brown-clad Canadian gentleman all morning down Regent Street and Waterloo Place. And when you came running after us, sir, he told me to drive like the devil to Waterloo station.'\n\n'And what did he say his name was when he paid you?' I asked.\n\nClayton grinned. 'Well, sir, you'll hardly believe it, but when he gave me two sovereigns at the station, he looked me in the eye and said: 'My name is Sherlock Holmes, and don't you forget it!''\n\nI laughed aloud, though an icy thrill of combative fury surged through my veins. The rascal had brazenly flung my own name back into my face!\n\n'A master stroke, Watson!' said I, pacing the hearth-rug. 'He knows my methods, he anticipated my inquiry, and he has slipped through our fingers with Sir Henry's old boot in his pocket. Sir Henry departs for Devonshire tomorrow. You must accompany him, Watson. You must be his shield, his eyes, and his constant companion. Report every fact to me without speculation.'\n\nWatson accepted the perilous commission with characteristic fidelity. But as the door closed behind him, my plan was already formed. I could not remain in London while my friend walked into the wolf's mouth. I would follow him to Dartmoor in secret, establish a hidden command upon the open moor, and strike the monster from the darkness.", "is_ending": false, "clues": ["Cartwright finds no mutilated Times in 23 hotel wastebaskets", "Telegram confirms Barrymore is at Baskerville Hall", "Cabman John Clayton states passenger brazenly declared: 'My name is Sherlock Holmes'"], "choices": [{"id": "h_ch5_c1", "text": "Dispatch Watson to Devon with Sir Henry while secretly preparing your own covert moor deployment.", "target": "holmes_ch06_part1_secret_departure", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch5_c2", "text": "[Switch POV to Jack Stapleton] View the villain retreating to Dartmoor with the stolen black boot.", "target": "stapleton_ch05_black_boot", "pov_switch": "stapleton", "pov_switch_name": "Jack Stapleton"}]}, "holmes_ch06_part1_secret_departure": {"id": "holmes_ch06_part1_secret_departure", "title": "Chapter 6: Baskerville Hall (Part I: The Covert Deployment to Dartmoor)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "anchor", "anchor_name": "anchor_arrival_moor_holmes", "content": "The deception was complete. To Watson, to Sir Henry, and to the watchful eyes that shadowed 221B Baker Street, Sherlock Holmes was safely detained in London, immersed in the tangled blackmail cases of the Duke of Devonshire.\n\nUnder cover of darkness, disguised as an elderly, eccentric botanist with a worn knapsack and a tin specimen box, I boarded an unadvertised milk-train westward. I avoided Exeter and Newton Abbot, stepping down at a lonely wayside halt miles north of the moor.\n\nMy preparations had been executed with military precision. I had summoned young Cartwright down from London and billeted him in the quiet market town of Coombe Tracey, six miles east of the Hall. His duty was perilous but simple: he was to act as my secret quartermaster. Twice a week, he would purchase bread, cold meat, clean water, and my essential shag tobacco, slip into the moor along the sheep-tracks, and deposit the supplies within my chosen retreat. Most crucially, he was instructed to collect Watson's letters from the local post office and convey them to me without Watson's knowledge.\n\nMy lair was already chosen. High upon the jagged ridge of Black Tor, commanding an unhindered panorama of Baskerville Hall, the treacherous expanse of Grimpen Mire, and the stone track to Merripit House, lay a cluster of prehistoric circular stone huts, abandoned by the ancient Britons three thousand years ago.\n\nOne of these huts had preserved its conical slate roof and dry granite walls intact. I cleared the floor, lined it with dry, springy heather, laid out my waterproof ulster, and established the covert headquarters of the defense. Through the narrow door, the granite peaks rose like dark sentinels against the swirling gray mist.", "is_ending": false, "clues": ["Holmes travels secretly to Devon under cover of night avoiding rail terminals", "Cartwright stationed at Coombe Tracey as secret logistic courier", "Neolithic stone hut upon Black Tor secured as covert operations base"], "choices": [{"id": "h_ch6_p1_c1", "text": "Occupy the Black Tor stone hut and sweep the moor with your field glasses.", "target": "holmes_ch06_part2_hut_surveillance", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch6_p1_c2", "text": "[Switch POV to Dr. Watson] View Watson's arrival at the grim gates of Baskerville Hall.", "target": "ch06_part1_arrival", "pov_switch": "watson", "pov_switch_name": "Dr. John H. Watson"}]}, "holmes_ch06_part2_hut_surveillance": {"id": "holmes_ch06_part2_hut_surveillance", "title": "Chapter 6: Baskerville Hall (Part II: The Telescope on Black Tor)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "Late in the afternoon of October 15th, the deep silence of the moor was broken by the clatter of hoofs. I crouched behind a cleft in the granite rampart, bringing my powerful naval field-glass to bear upon the white ribbon of road that wound from Bovey Tracey.\n\nThe sight was dramatic. A wagonette drawn by two steaming bays rolled briskly across the heath. Upon the box sat Sir Henry Baskerville and Dr. Watson, wrapped in heavy ulsters, flanked by armed county constables. A few miles back, at the junction of the moor road, two mounted soldiers with carbines rested upon their thighs stood motionless against the sky.\n\nThe explanation had already reached me: Selden, the ferocious Notting Hill murderer, had broken from Dartmoor Prison at Princetown three days ago and was lurking somewhere in the vast granite labyrinth. A dangerous complication! A starving convict roaming the crags would inject an element of chaotic violence into a situation already poised upon a razor's edge.\n\nI swung my glass toward Baskerville Hall. The ancient mansion emerged from its dense cordon of dying trees like a sinister phantom. The twin crenellated towers, black against the dull autumn sky, looked grim and forbidding. As the carriage passed beneath the ruined arch of the gateway, the great iron gates clanged shut. Watson and Sir Henry had entered the web.\n\nA mile to the east, across the shimmering, deceptive green of Grimpen Mire, another chimney was smoking. Merripit House! There, within that lonely cottage, sat the brain that had devised the terror. I adjusted the focus, settling down for a long, cold, merciless vigil.", "is_ending": false, "clues": ["Mounted guards patrol moor searching for escaped Notting Hill murderer Selden", "Through field glasses, Holmes observes Watson and Sir Henry entering the gloomy Hall"], "choices": [{"id": "h_ch6_p2_c1", "text": "Turn your telescope toward the treacherous paths of Grimpen Mire and Merripit House.", "target": "holmes_ch07_part1_naturalist", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch6_p2_c2", "text": "[Switch POV to Jack Stapleton] View the villain watching the arrivals from Merripit House.", "target": "stapleton_ch06_part1_arrival_watch", "pov_switch": "stapleton", "pov_switch_name": "Jack Stapleton"}]}, "holmes_ch07_part1_naturalist": {"id": "holmes_ch07_part1_naturalist", "title": "Chapter 7: The Stapletons of Merripit House (Part I: The Man with the Net)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "anchor", "anchor_name": "anchor_naturalist_holmes", "content": "The morning sun of October 16th burned through the drifting mist, revealing the full treachery of the Great Grimpen Mire. Through my lens, the vast morass looked like an immense, undulating emerald carpet, broken here and there by dark pits of bubbling slime and jagged islets of granite.\n\nPresently, a small figure appeared upon the mire track, moving with extraordinary agility. It was a slender, dapper man of middle height, with straw-coloured hair and a sharp, clean-shaven face. He carried a green butterfly net in one hand and a botanist's tin box slung across his shoulder.\n\nJack Stapleton!\n\nI studied his movements with intense scientific admiration. Where any ordinary man would have plunged into the bottomless bog within three paces, this fellow sprang lightly from tussock to tussock, following an invisible zigzag trail known only to himself. Suddenly, he halted, raised his net, and sprinted with wild leaps across the quagmire in pursuit of an elusive cyclopides butterfly.\n\nA few hundred yards away, Dr. Watson was walking down the moor path from the Hall. Stapleton spotted him, turned, and hastened to meet him with open arms and the easy, bubbling geniality of a harmless savant.\n\nAs they stood conversing by the edge of the mire, a terrifying scream rent the air. A tragic spectacle unfolded: a wild moorland pony, venturing too close to the false green crust, had broken through into the mire! Through my glass, I watched the wretched creature's frantic thrashing. Its neck stretched in agony, its wild eyes rolled, and within two minutes, the sucking black mud closed over its nostrils. Not a ripple remained.\n\nStapleton pointed toward the spot, smiling pleasantly at Watson as though demonstrating a textbook specimen in a lecture hall. A cold, cruel demon, wearing the mask of an eccentric scholar!", "is_ending": false, "clues": ["Stapleton demonstrates unnatural familiarity traversing lethal Grimpen Mire", "A wild Dartmoor pony swallowed alive in the mire proves the bog's absolute lethality"], "choices": [{"id": "h_ch7_p1_c1", "text": "Track Watson's meeting with Beryl Stapleton through your high-powered lens.", "target": "holmes_ch07_part2_beryl_warning", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch7_p1_c2", "text": "[Switch POV to Jack Stapleton] View Stapleton playing the eccentric naturalist with his butterfly net.", "target": "stapleton_ch07_part1_naturalist_act", "pov_switch": "stapleton", "pov_switch_name": "Jack Stapleton"}]}, "holmes_ch07_part2_beryl_warning": {"id": "holmes_ch07_part2_beryl_warning", "title": "Chapter 7: The Stapletons of Merripit House (Part II: The Desperate Warning)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "Stapleton suddenly darted off across the heather in pursuit of another moth, leaving Watson alone upon the track. At that exact moment, a tall, striking woman stepped from the bushes into Watson's path.\n\nBeryl Stapleton!\n\nShe was of a beauty as rare as it was un-English: dark-eyed, olive-skinned, with a proud, exquisite profile and a figure of extraordinary grace. But her face was pale as marble, and her dark eyes were dilated with acute, desperate terror.\n\nThrough my field glass, I could read the pantomime of their encounter with utter clarity. She had evidently mistaken Watson for Sir Henry Baskerville! She seized Watson by the arm, speaking with frantic, breathless rapidity. Her hands gestured passionately toward the southern road, imploring him—commanding him—to pack his trunks and return instantly to London before night fell!\n\nWatson, taken aback by this sudden apparition, tried to calm her. When he revealed his true identity as Dr. Watson, the woman's reaction was singular: a look of mingled relief and doubled terror flashed across her features.\n\nAt that moment, Stapleton reappeared over the crest of the hill, his net swinging by his side. The transformation in the woman was instantaneous: she stiffened, her face froze into an emotionless mask, and she stepped back as though she had been struck across the mouth.\n\nStapleton greeted his sister with a smile that failed to reach his small, cold eyes. A master of dissimulation! Yet beneath that polished domestic exterior, I sensed the brutal tension of a tyrant and his prisoner. This woman was no willing accomplice—she was an unwilling captive held under the lash of fear!\n\nI lowered the glass, my mind racing. The pieces were shifting. In London, the warning letter had been composed by an educated hand and scented with white jessamine. Here on the moor, this exotic 'sister' risked her life to warn the baronet. The battle lines were drawn.", "is_ending": false, "clues": ["Beryl Stapleton frantically warns Watson mistaking him for Sir Henry", "Deep domestic terror and unnatural tension observed between the supposed siblings"], "choices": [{"id": "h_ch7_p2_c1", "text": "Prepare to receive and decode Watson's first written dispatch from the Hall.", "target": "holmes_ch08_watson_report", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch7_p2_c2", "text": "Direct your spy glass to intercept Cartwright's rendezvous point at the crags.", "target": "holmes_ch08_watson_report", "pov_switch": null, "pov_switch_name": null}]}, "holmes_ch08_watson_report": {"id": "holmes_ch08_watson_report", "title": "Chapter 8: First Report of Dr. Watson (Dispatches Deciphered in the Hut)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "On the evening of October 18th, Cartwright scrambled into the stone hut, his breath coming in hoarse gasps. From his greasy canvas satchel, he drew a packet of cold roast beef, two loaves of bread, a pouch of my beloved Latakia shag, and a thick, sealed envelope addressed to Baker Street in Watson's neat, upright handwriting.\n\nI struck a match, lit my tallow candle, and unfolded my friend's first report.\n\nWatson had done magnificent work. With the painstaking precision of an army surgeon, he had documented the life of the Hall. He described the oppressive gloom of the great oak-panelled corridors, the ancestral portraits, and the nervous agitation of the staff.\n\nThree crucial points leaped from his pages:\n\nFirst, Barrymore the butler had been caught creeping down the west corridor at two in the morning, holding a candle to a window that commanded the moor, waiting in rigid concentration as though signaling someone in the dark.\n\nSecond, Mrs. Barrymore had been observed in tears, her eyes swollen and red. What secret bond tied the respectable butler to the perils of the moor? My mind flew to Selden, the escaped convict. A woman's tears, a butler's midnight vigils—could the convict be a relative, shielded by family blood?\n\nAnd third, Sir Henry had met Beryl Stapleton and had fallen violently in love with her at first sight. Stapleton, far from encouraging a match that would elevate his sister to a ladyship, had intervened with furious, hysterical jealousy, forbidding Sir Henry from addressing her!\n\nI blew a long stream of smoke against the stone roof. Why should a penniless naturalist fly into a rage when a wealthy baronet courts his sister?\n\nThere was only one rational answer in the whole lexicon of crime: because she was not his sister at all! She was his wife! A wife employed as a decoy, yet protected by the jealous fury of a possessive tyrant! The master deduction fell into place. I rolled myself in my ulster, my revolver loaded beneath my head, ready for the midnight watch.", "is_ending": false, "clues": ["Watson reports Barrymore's midnight prowling with a candle in the west tower", "Mrs. Barrymore's weeping eyes confirm hidden domestic grief", "Sir Henry falling deeply in love with Beryl Stapleton"], "choices": [{"id": "h_ch8_c1", "text": "Focus your telescope on the west tower of Baskerville Hall for the midnight candle signal.", "target": "holmes_ch09_part1_midnight_watch", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch8_c2", "text": "[Switch POV to Dr. Watson] Read Watson's original diary dispatch sent from Baskerville Hall.", "target": "ch08_watson_report", "pov_switch": "watson", "pov_switch_name": "Dr. John H. Watson"}]}, "holmes_ch09_part1_midnight_watch": {"id": "holmes_ch09_part1_midnight_watch", "title": "Chapter 9: The Light upon the Moor (Part I: The Candle and the Signal)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "anchor", "anchor_name": "anchor_convict_holmes", "content": "At two in the morning of October 20th, the moor lay submerged beneath an ocean of silver moonlight. The air was crisp with frost. I stood upon the granite ledge outside my hut, the night-glass pressed to my eye.\n\nPrecisely as Watson had reported, a yellow pinprick of flame flared in the high, narrow window of the Hall's western tower. For five minutes it shone steadily. Then it waved twice to and fro.\n\nI swept my glass across the silent crags. A mile away, perched high upon an isolated pinnacle of rock, an answering spark appeared! A tiny, trembling spark of light, glowing like a glow-worm among the ancient boulders.\n\nThe secret was laid bare: the Barrymores were feeding the escaped convict Selden! Mrs. Barrymore was his sister; the family ties had proved stronger than the fear of the gallows.\n\nSuddenly, two dark figures broke from the shadows of the Hall and sprinted across the heather toward the beacon. Watson and Sir Henry! They had laid an ambush for the butler, forced his confession, and were now galloping across the moonlit granite to capture the murderer themselves!\n\nBravo, Watson! The loyal fellow was risking neck and limb upon the treacherous rocks. Through my glass, I watched the wild drama unfold: the convict, a shaggy, ape-like creature in prison rags, spotted them, hurled a boulder down the ravine, and went bounding across the moor like a mountain goat, Watson's revolver cracking behind him.\n\nThe pursuit drew near the base of my very ridge. It was time to show them that a guardian angel walked the moor.", "is_ending": false, "clues": ["A yellow candle flares in the west window of Baskerville Hall at 2 AM", "A tiny answering flame flickers upon the granite crags of Black Tor", "Selden is hiding among prehistoric huts, receiving food from the Barrymores"], "choices": [{"id": "h_ch9_p1_c1", "text": "Step onto the moonlit summit of Black Tor to observe Watson and Henry hunting the convict.", "target": "holmes_ch09_part2_figure_on_the_tor", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch9_p1_c2", "text": "[Switch POV to Dr. Watson] Experience the midnight chase across the granite crags.", "target": "ch09_part2_moor_chase", "pov_switch": "watson", "pov_switch_name": "Dr. John H. Watson"}]}, "holmes_ch09_part2_figure_on_the_tor": {"id": "holmes_ch09_part2_figure_on_the_tor", "title": "Chapter 9: The Light upon the Moor (Part II: The Figure upon the Tor)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "I climbed to the very apex of Black Tor, stepping out upon the highest granite boulder where the full silver moon threw my shadow across the plateau. I stood motionless, my arms folded across my chest, looking down into the valley.\n\nBelow, panting upon the heather, Watson and Sir Henry had halted their fruitless pursuit. Suddenly, Watson raised his eyes. Through the crystal night air, his gaze locked upon me!\n\nI saw him start violently and grip Sir Henry's shoulder, pointing his revolver up toward my silhouette. He saw a tall, thin man, motionless as a statue of bronze, standing high above the world upon the crest of the tor.\n\nAt that supreme moment of drama, an appalling sound shattered the silence of Dartmoor.\n\nA low, deep-toned moan rolled across the heath. It swelled into a wild, mournful bay, a hideous crescendo of savage fury that made the granite boulders seem to vibrate. It was the bay of a gigantic hound! The cry of blood, rising from the black depths of Grimpen Mire!\n\nI saw Watson and Sir Henry freeze in their tracks, their faces turned upward, drained of every drop of blood. Sir Henry stumbled against a rock, crossing himself in superstitious dread. Even Watson, seasoned soldier of Maiwand, lowered his pistol with a trembling hand.\n\nThe beast was alive. Stapleton was preparing for the kill!\n\nBefore Watson could rally his spirits and scramble up the rocks toward me, I slipped backward into the shadow of the cleft, melted into the darkness of the prehistoric huts, and vanished without a footprint.", "is_ending": false, "clues": ["Watson catches sight of the tall, thin silhouette on the summit of Black Tor", "A blood-chilling hound howl rolls across the moor, freezing Watson and Henry in terror"], "choices": [{"id": "h_ch9_p2_c1", "text": "Slip back into the stone hut and await Watson's diary dispatch regarding Laura Lyons.", "target": "holmes_ch10_diary_and_laura", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch9_p2_c2", "text": "[Switch POV to Jack Stapleton] View Stapleton stirring the hound in the mire at midnight.", "target": "stapleton_ch09_part1_feeding_the_hound", "pov_switch": "stapleton", "pov_switch_name": "Jack Stapleton"}]}, "holmes_ch10_diary_and_laura": {"id": "holmes_ch10_diary_and_laura", "title": "Chapter 10: Extract from the Diary of Dr. Watson (The Secret of L.L.)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "Watson's second dispatch arrived via Cartwright on the morning of October 23rd. It contained the missing link that connected the London conspiracies with the death of Sir Charles Baskerville.\n\nBarrymore, in gratitude to Sir Henry for not prosecuting his convict brother-in-law, had made a clean breast of a secret that had tortured his conscience for months.\n\nOn the morning of Sir Charles's death, the old baronet had received a letter from the postman, postmarked Coombe Tracey. Later that night, while cleaning the study fireplace, Mrs. Barrymore had found the charred ashes of this letter. All was consumed save the very postscript at the bottom of the page, written in a delicate feminine hand:\n\n'Please, please, as you are a gentleman, burn this letter, and be at the gate by ten o'clock.'\n\nThe initials below the plea were 'L.L.'!\n\nI leaped to my feet, my heart pounding against my ribs. 'L.L.'!\n\nWho in this isolated district bore those initials? My mental catalogue of Dartmoor residents revolved in a flash. Laura Lyons! The beautiful, unfortunate daughter of old Frankland of Cranmer Hall! She had made an imprudent marriage with a runaway artist named Lyons, who had abandoned her in penury. Disowned by her litigious father, she had established a modest typewriting business in Coombe Tracey, supported by the quiet charity of Sir Charles Baskerville—and of Jack Stapleton!\n\nThe fatal mechanism stood naked before my eyes. Sir Charles was a recluse who refused to leave his grounds after dark. How could he be lured to the lonely wicker gate at ten o'clock at night?\n\nOnly by an urgent appeal to his chivalry! A desperate woman pleading for a secret interview to save her honor or secure her freedom! And behind that appeal, whispering the words into her ear, dictating the very letter—stood Jack Stapleton!\n\nI strapped my revolver beneath my coat. It was time to pay a morning call upon Mrs. Laura Lyons.", "is_ending": false, "clues": ["Barrymore confesses Sir Charles went to the gate to meet a woman signing 'L.L.'", "L.L. identified as Laura Lyons, daughter of Frankland, residing in Coombe Tracey", "The burnt fragment pleaded: 'If you are a gentleman, burn this letter and be at the gate at ten'"], "choices": [{"id": "h_ch10_c1", "text": "Descend to Coombe Tracey in disguise to interrogate Mrs. Laura Lyons directly.", "target": "holmes_ch11_part1_lyons", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch10_c2", "text": "Instruct Cartwright to shadow Laura Lyons and obtain her financial records.", "target": "holmes_ch11_part1_lyons", "pov_switch": null, "pov_switch_name": null}]}, "holmes_ch11_part1_lyons": {"id": "holmes_ch11_part1_lyons", "title": "Chapter 11: The Man on the Tor (Part I: The Inquest of Laura Lyons)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "anchor", "anchor_name": "anchor_tor_holmes", "content": "I found Mrs. Laura Lyons at her modest apartment in Coombe Tracey. She was an extraordinarily handsome woman, with rich hazel hair and hazel eyes, but her mouth had that hardened, bitter downturn which comes from prolonged social humiliation and desperate poverty.\n\nAt first, she met my inquiries with haughty evasion, denying that she had ever corresponded with Sir Charles on the day of his death.\n\n'Mrs. Lyons,' said I, leaning forward and fixing her with my keenest gaze, 'the matter is far too grave for falsehood. We are investigating a murder. The letter you sent was burned, but the postscript in your hand was rescued from the grate: 'Please, please, as you are a gentleman, burn this letter, and be at the gate by ten o'clock.' If you refuse to speak, you stand in the shadow of the gallows as an accessory to murder!'\n\nThe blood fled from her cheeks, leaving her white as chalk. She covered her face with her hands, trembling violently.\n\n'I did not know!' she sobbed. 'As God is my judge, I swore it was for my salvation! Mr. Stapleton told me that if I could obtain two thousand pounds to secure my legal divorce, he would make me his lawful wife! He dictated the letter. He told me that Sir Charles was proud and sensitive, and that an interview in the garden was the only way to touch his heart!'\n\n'And why did you not keep the appointment?'\n\n'Because Mr. Stapleton came to me that very afternoon!' she cried. 'He told me that his own pride could not endure that another man should pay for my freedom. He swore that he would provide every guinea himself, and commanded me—on my love for him—never to go near Baskerville Hall that night! And next morning, I read that Sir Charles was dead!'\n\nThe devilish scheme was complete in every detail. Stapleton had used this unhappy woman to draw Sir Charles to the gate, kept her away, and brought his glowing hell-hound to the appointment!\n\nLeaving her weeping in remorse, I struck out across the heath at a rapid pace. The shadows were lengthening, and I knew that Watson was searching for the tenant of the hut.", "is_ending": false, "clues": ["Laura Lyons admits writing the appointment letter to Sir Charles at 10 PM", "Stapleton promised to marry her once her divorce was financed", "Stapleton forbade her to keep the appointment, leaving Sir Charles alone at the gate"], "choices": [{"id": "h_ch11_p1_c1", "text": "Hasten back to the prehistoric stone hut upon Black Tor before nightfall.", "target": "holmes_ch11_part2_stone_hut", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch11_p1_c2", "text": "[Switch POV to Dr. Watson] View Watson infiltrating the stone hut with revolver drawn.", "target": "ch11_part2_stone_hut", "pov_switch": "watson", "pov_switch_name": "Dr. John H. Watson"}]}, "holmes_ch11_part2_stone_hut": {"id": "holmes_ch11_part2_stone_hut", "title": "Chapter 11: The Man on the Tor (Part II: 'A Lovely Evening, Watson!')", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "I reached the prehistoric hut just as the last crimson gleams of sunset died upon the western horizon. As I approached the low stone portal, my acute senses detected an unmistakable intruder: the pungent aroma of an Egyptian cigarette, the very brand favoured by my friend Dr. Watson!\n\nI stepped quietly within the threshold. In the dim violet twilight, a figure sprang up from the heather, a cocked revolver gleaming in his fist.\n\n'A lovely evening, my dear Watson!' said I, stepping into the light. 'I really think you will be more comfortable outside than sitting upon that hard granite.'\n\n'Holmes!' he gasped, dropping his pistol upon the bed, his voice trembling with a mixture of immense relief and wounded bewilderment. 'Holmes! Good God, is it you? Can it be possible that you have been here all the time?'\n\n'Every hour of it, my dear fellow,' I replied, lighting my pipe. 'Forgive the necessary deception. Had Sir Henry or the Stapletons known of my presence, our cunning adversary would have retreated into impenetrable caution. By utilizing your honest, open observations, I have operated with total invisibility.'\n\nWatson grasped my hand with all his old soldierly warmth. We sat side by side upon the heather, pooling our discoveries.\n\n'And now, Watson,' said I, 'let me supply the master key to this labyrinth. You have met Miss Stapleton. Has it ever struck you as unnatural that a devoted brother should fly into a murderous frenzy when a wealthy, honourable baronet seeks to marry his penniless sister?'\n\n'It astonished me beyond measure,' Watson admitted.\n\n'It astonished you because you accepted a lie! That lady is not his sister, Watson. She is his lawful wife! A Costa Rican woman whom he married in South America! He brought her here under a false name, forced her to pass as his sister so that she might serve as a decoy to lure wealthy men to their destruction, while he watches her with the savage jealousy of a beast!'\n\nWatson's face darkened with righteous fury. 'Great God! Then Stapleton is—'\n\n'A murderer of the most cold-blooded and calculated type this world has ever seen!'", "is_ending": false, "clues": ["Watson enters hut with drawn revolver; Holmes greets him casually by the fire", "Holmes reveals Beryl is Stapleton's lawful wife, not his sister", "Stapleton is an imposter possessing sinister natural malice and hereditary claims"], "choices": [{"id": "h_ch11_p2_c1", "text": "Step outside upon the crags with Watson to evaluate the impending peril.", "target": "holmes_ch12_part1_revelations", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch11_p2_c2", "text": "Pool all intelligence regarding Laura Lyons and Stapleton's past movements.", "target": "holmes_ch12_part1_revelations", "pov_switch": null, "pov_switch_name": null}]}, "holmes_ch12_part1_revelations": {"id": "holmes_ch12_part1_revelations", "title": "Chapter 12: Death on the Moor (Part I: The Cry on the Crags)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "anchor", "anchor_name": "anchor_death_holmes", "content": "We stepped out upon the narrow granite ledge outside the hut. The moon had dipped behind a bank of ragged, wind-torn clouds, and the vast expanse of Dartmoor lay buried in deep, suffocating shadow.\n\n'Our case is almost complete, Watson,' I whispered, resting a hand upon his shoulder. 'Laura Lyons has confessed how Sir Charles was lured to the gate. We know of the stolen boots—an old boot used to train a bloodhound to Sir Henry's personal scent. But we lack the tangible physical proof to place before an English jury. We cannot arrest a man upon circumstantial deductions—'\n\nSuddenly, out of the black vastness of the moor, there broke a sound that curdled the blood in our veins.\n\nA hound! Deep, resonant, hollow, booming across the silence of the night!\n\nIt was no ordinary bark. It was the baying of a monster on a fresh, hot trail! And then, rising above the terrible baying, came a scream—a scream of utter, mortal agony!\n\n'Great God!' cried Watson, his hand flying to his revolver. 'Did you hear that?'\n\n'Sir Henry!' I gasped, a cold sweat breaking across my forehead. 'He has gone out upon the moor!'\n\nAgain the cry rose—closer now, accompanied by the frantic scrabbling of boots upon shale and the heavy, panting thud of galloping paws. A second shriek rent the air, ending in a sickening, splintering crash at the base of the crags, followed by silence—a silence more dreadful than the cries.\n\n'This way, Watson! For God's sake, run!'\n\nWe plunged down the jagged slope, leaping from boulder to boulder in the dark, our revolvers cocked, sprinting toward the foot of the sheer granite cliff!", "is_ending": false, "clues": ["A bloodcurdling hound baying echoes through the fog followed by screams of human agony", "Holmes and Watson sprint across the moonlit boulders toward the sound of death"], "choices": [{"id": "h_ch12_p1_c1", "text": "Sprint frantically toward the base of the sheer granite cliff to intercept the tragedy.", "target": "holmes_ch12_part2_selden_death", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch12_p1_c2", "text": "[Switch POV to Jack Stapleton] View Stapleton unleashing the hound upon Sir Henry's scent.", "target": "stapleton_ch12_part1_screams_on_crags", "pov_switch": "stapleton", "pov_switch_name": "Jack Stapleton"}]}, "holmes_ch12_part2_selden_death": {"id": "holmes_ch12_part2_selden_death", "title": "Chapter 12: Death on the Moor (Part II: The Fall of the Convict)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "At the foot of a perpendicular granite crag, forty feet high, lay a dark, crumpled heap.\n\nWatson fell upon his knees beside the body, crying out in bitter despair: 'Sir Henry! Oh, Holmes, the hound has had him!'\n\nThe body was clad in a thick, ruddy-tinted tweed suit—the identical suit worn by Sir Henry Baskerville on the morning we had met him in London! The skull was crushed against the stones, and the neck was broken.\n\nI knelt down, struck a match, and turned the blood-stained face to the light. I cried aloud in fierce, triumphant joy!\n\n'Watson! Look at the beard! Look at the forehead! It is not Sir Henry! It is Selden, the escaped convict!'\n\nWatson stared in dumbfounded amazement. 'The convict? But how in heaven's name does he come to be wearing Sir Henry's clothes?'\n\n'Barrymore's wardrobe charity!' I laughed, the terrible weight lifting from my heart. 'Sir Henry gave his cast-off London garments to the butler, and the butler passed them to his starving brother-in-law! The hound was laid on Sir Henry's scent with the stolen boot—it tracked the scent of Sir Henry's clothes across the moor, chased the wretched convict over the edge of the crag, and dashed his brains out upon the stones!'\n\nAt that moment, the yellow beam of a lantern bobbed through the darkness. A light, dapper figure stepped from behind the boulders.\n\nJack Stapleton!\n\nHe had come to gloat over Sir Henry's corpse! When his lantern fell upon me, he stopped dead, his face draining of all colour. For three seconds, the master villain stood frozen, caught between mortal terror and criminal cunning.\n\n'Mr. Holmes!' he stammered, recovering himself with an effort that strained every nerve. 'Is it possible? What an unexpected honour! And... who is this unfortunate man?'\n\n'An escaped convict, Mr. Stapleton,' I replied smoothly, puffing my pipe. 'He seems to have fallen from the crags and broken his neck. A tragic accident, nothing more. My friend Watson and I return to London tomorrow, our holiday at an end.'\n\nStapleton smiled, a smile of infinite relief. The fool believed his secret was safe! In forty-eight hours, the trap would spring.", "is_ending": false, "clues": ["Dead man is Selden the convict, dressed in Sir Henry's discarded old tweed suit", "The stolen boot scent caused the hound to track the scent of Sir Henry's clothes", "Stapleton emerges from the darkness with a lantern, feigning innocence"], "choices": [{"id": "h_ch12_p2_c1", "text": "Return to Baskerville Hall to examine the ancestral portraits and set the final snare.", "target": "holmes_ch13_portrait", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch12_p2_c2", "text": "Confront Stapleton directly upon the rocks before he retreats to Merripit House.", "target": "holmes_ch13_portrait", "pov_switch": null, "pov_switch_name": null}]}, "holmes_ch13_portrait": {"id": "holmes_ch13_portrait", "title": "Chapter 13: Fixing the Nets (The Face of Hugo & The Fatal Dinner Invitation)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "anchor", "anchor_name": "anchor_portrait_holmes", "content": "That night, in the great dining-hall of Baskerville Hall, over cold fowl and claret, I stared up at the gallery of family portraits. Watson and Sir Henry watched me in silence.\n\nSuddenly, my eyes fastened upon a canvas dated 1647. It portrayed a cavalier with a harsh, wicked countenance, clad in black velvet and lace.\n\n'Who is that gentleman?' I asked.\n\n'That is the wicked Hugo himself,' said Sir Henry, 'the father of the family legend.'\n\nI waited until Sir Henry left the room. Then, stepping upon a chair, I held a candle before the portrait and placed my flat hands across the cavalier's broad plumed hat and flowing curls, concealing the seventeenth-century costume.\n\nWatson sprang up from the table with a loud cry of astonishment!\n\n'Good heavens!' he shouted. 'It is the face of Jack Stapleton!'\n\n'Precisely!' said I, stepping down. 'A case of hereditary reversion, a physical throwback of two hundred years! Jack Stapleton is a Baskerville! He is the son of Rodger Baskerville, Sir Charles's black-sheep younger brother who fled to South America! He stands next in succession after Sir Henry to the entire £740,000 estate!'\n\nOur net was ready. The next morning, I announced our public departure for London to deceive Stapleton's spies. But at Coombe Tracey station, we slipped from the train and met Inspector Lestrade of Scotland Yard, who had arrived with a search warrant and an English bulldog's tenacity.\n\nMy final orders to Sir Henry were severe and absolute: he was to accept Stapleton's dinner invitation at Merripit House, announce that we had returned to London, and at ten o'clock, he must walk home alone across the moor along the track by the Great Grimpen Mire.\n\nThe baronet's courage did not falter. He accepted the role of bait in our trap. As darkness gathered over the bog, Watson, Lestrade, and I took up our vigil behind the granite rocks, two hundred yards from the glowing windows of Merripit House.", "is_ending": false, "clues": ["Concealing Hugo Baskerville's hat and curls reveals Jack Stapleton's identical face", "Stapleton is proven to be the son of Rodger Baskerville, seeking the £740,000 estate", "Sir Henry is instructed to dine alone at Merripit House and walk home by the mire path"], "choices": [{"id": "h_ch13_c1", "text": "Meet Inspector Lestrade at the station and take position in the rocks outside Merripit House.", "target": "holmes_ch14_part1_fog_ambush", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch13_c2", "text": "[Switch POV to Jack Stapleton] View the villain preparing the fatal dinner at Merripit House.", "target": "stapleton_ch13_fatal_dinner", "pov_switch": "stapleton", "pov_switch_name": "Jack Stapleton"}]}, "holmes_ch14_part1_fog_ambush": {"id": "holmes_ch14_part1_fog_ambush", "title": "Chapter 14: The Hound of the Baskervilles (Part I: The Fire-Breathing Beast)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "anchor", "anchor_name": "anchor_climax_holmes", "content": "The night was cold and damp, but our supreme peril came not from the adversary, but from the elements.\n\nFrom the Great Grimpen Mire, a dense, moonlit fog-bank was rolling inland. It advanced like a white wall, silent, swift, and relentless, creeping across the heather and blotting out the boulder field inch by inch.\n\n'If that fog covers the path before Sir Henry leaves the house,' I muttered through clenched teeth, 'we shall never see him alive!'\n\nAt five minutes to ten, the front door of Merripit House opened. Sir Henry stepped out into the night, wrapped in his overcoat. He paused, looked up at the clearing sky, and began to walk briskly along the stone path that skirted the morass.\n\nHe had passed our ambush by fifty yards when a sound broke from the fog.\n\nA patter of rapid, galloping feet—heavy, relentless, vibrating the damp earth!\n\n'Look out!' I roared, cocking my revolver. 'It's coming!'\n\nOut of the dense white wall of vapour leaped an apparition so hideous that the blood froze in our veins.\n\nA hound! But such a hound as never mortal eyes had beheld! A huge creature, coal-black, shaped like a cross between a bloodhound and a mastiff, but larger than either. Fire burst from its open mouth, its eyes glowed with smouldering embers, and its muzzle, hackles, and dewlap were outlined in flickering, bluish flame! Never in the delirious dream of a disordered brain could anything more savage, more appalling, more hellish be conceived!\n\nThe beast sprang across the heather with giant bounds, its smoking jaws parted, bounding straight for Sir Henry's throat! Sir Henry looked back, shrieked in horror, and fell to his knees upon the path.\n\nI sprang from the rocks, leveled my revolver, and emptied five cartridges into the monster's flank!\n\nThe bullets took effect! With a deafening howl of anguish, the beast rolled over upon its back, clawing wildly at the air. It leaped up once more, snapping furiously, but Watson and I fired together. A bullet pierced its brain. It gave a dying shiver, collapsed into the heather, and lay still.\n\nWe had broken the curse of the Baskervilles!", "is_ending": false, "clues": ["Thick white fog bank rolls from Grimpen Mire threatening to engulf the path", "The gigantic hound bursts through the fog, its jaws and eyes ablaze with phosphorus", "Holmes fires five cartridges into the leaping beast, slaying the demon inches from Sir Henry"], "choices": [{"id": "h_ch14_p1_c1", "text": "Storm Merripit House to rescue Beryl and pursue Stapleton into the Great Grimpen Mire.", "target": "holmes_ch14_part2_mire_pursuit", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch14_p1_c2", "text": "[Switch POV to Jack Stapleton] Experience the agony of defeat and the desperate flight into the mire.", "target": "stapleton_ch14_part2_panic_flight", "pov_switch": "stapleton", "pov_switch_name": "Jack Stapleton"}]}, "holmes_ch14_part2_mire_pursuit": {"id": "holmes_ch14_part2_mire_pursuit", "title": "Chapter 14: The Hound of the Baskervilles (Part II: Sucked into Grimpen Mire)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "We knelt beside the dead hound. I ran my fingers over its muzzle. The glowing light had ceased, but a slick, greasy paste coated its fur.\n\n'Phosphorus!' whispered Lestrade, touching the wet skin.\n\n'A cunning preparation,' I remarked, wiping my hands. 'Odourless, so as not to spoil the beast's scent, yet luminous in the dark. A mastiff-bloodhound cross, bred and starved for savagery.'\n\nLeaving Lestrade to attend to the trembling Sir Henry, Watson and I battered down the door of Merripit House.\n\nThe ground floor was deserted. On the upper floor, behind a locked door, we found a scene of horror. Beryl Stapleton was bound securely to an upright of the bed with heavy curtain cords, her mouth gagged with a scarf. Her delicate wrists and white neck were discoloured by brutal, recent bruises!\n\nWatson severed the cords. As the gag was removed, she gasped in agony:\n\n'Is he safe? Did Sir Henry escape?'\n\n'He is safe,' I answered gently. 'And the hound is dead.'\n\n'Thank God!' she wept, swaying upon her feet. 'He has fled into the Great Grimpen Mire! He has an old tin-mine on an island in the very heart of the bog where he kept the hound! But he can never navigate the path in this fog!'\n\nGuided by the desperate woman's directions, we pushed into the fringes of the morass next morning as the sun burned off the mist. We followed the tiny wands of lath that Stapleton had planted to mark the invisible trail. Halfway to the island, where the slime quivered like green jelly, a black object caught my eye, half-buried in the mud.\n\nI reached out with my crook and dragged it onto the heather.\n\nIt was an old black boot, stamped 'Meyers, Toronto' upon the lining! The stolen boot that had sealed Sir Henry's doom—cast aside by the flying murderer in his panic!\n\nBeyond that point, the guiding wands ceased. Upon the wide expanse of trembling mire, there was no trace of a returning footstep. A heel-mark was stamped deep into the green slime, where a man had desperately striven to regain his balance—and failed. The bubbling mud had closed over him.\n\nSomewhere down in the foul slime of the huge morass, that cold, cruel heart was sleeping forever. The Great Grimpen Mire had claimed its master!", "is_ending": false, "clues": ["Beryl rescued from upstairs bedroom bound and gagged with brass bedpost marks", "Phosphorus preparation and Sir Henry's stolen black boot found in mire island lair", "Stapleton lost
