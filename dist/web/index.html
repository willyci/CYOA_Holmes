, "pov_switch_name": null}, {"id": "w_lyons_confront_stapleton", "text": "直接赶往梅利琵宅邸，赶在斯台普吞再次行凶前当面撕下其伪善假面！", "target": "watson_direct_confrontation", "pov_switch": null, "pov_switch_name": null}]}, "watson_hut_reunion": {"id": "watson_hut_reunion", "title": "荒原石屋的重逢", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "branch", "anchor_name": null, "content": "门外传来一个平静、亲切而带着戏谑的声音：‘多么美好的傍晚啊，我亲爱的华生！你真的不该坐在离洞口这么近的地方，你的影子早在五十码外就出卖了你。’\n\n我目瞪口呆地垂下手枪。走进石屋的竟是歇洛克·福尔摩斯先生！他目光如炬，清瘦从容，嘴角挂着熟悉的微笑。‘华生，我潜伏在沼地，正是为了让斯台普吞误以为我远在伦敦！法网已经收紧，今晚亨利爵士将赴梅利琵宅邸赴宴，决战时刻到了！’", "is_ending": false, "clues": ["歇洛克·福尔摩斯早已亲临达特沼地实地指挥"], "choices": [{"id": "w_reunion_to_dinner", "text": "与苏格兰场警官雷斯垂德汇合，在梅利琵宅邸外设下包围圈。", "target": "holmes_merripit_dinner", "pov_switch": "holmes", "pov_switch_name": "歇洛克·福尔摩斯"}, {"id": "w_take_vantage", "text": "潜伏至梅利琵宅邸餐厅窗外的花岗岩石块后，严密监视室内动静。", "target": "watson_climax_vigil", "pov_switch": null, "pov_switch_name": null}]}, "watson_direct_confrontation": {"id": "watson_direct_confrontation", "title": "梅利琵宅邸的不期而遇", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "branch", "anchor_name": null, "content": "我孤身一人赶至梅利琵宅邸。斯台普吞迎入客厅，脸上的假笑紧绷而抽搐。院落后方一间废弃的外屋中，陡然传来一声低沉雄浑、令人骨髓发冷的闷雷般犬吠，连地板都微微震颤。斯台普吞的手指缓缓滑向了身旁那柄沉重的手杖。\n\n‘华生医生，您似乎心神不宁，’他柔声细语，‘不如随我去后院观赏一下新采集的飞蛾标本？’", "is_ending": false, "clues": [], "choices": [{"id": "w_force_outhouse", "text": "拔出手枪，强行勒令斯台普吞交出后院锁闭外屋的钥匙！", "target": "watson_hound_early_release", "pov_switch": null, "pov_switch_name": null}, {"id": "w_feign_retreat", "text": "托辞亨利爵士有紧急传话，假装告退，迅速向外围的福尔摩斯报信。", "target": "watson_climax_vigil", "pov_switch": null, "pov_switch_name": null}]}, "watson_climax_vigil": {"id": "watson_climax_vigil", "title": "沼地白雾中的警戒", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "anchor", "anchor_name": "anchor_climax", "content": "我屏息蹲伏在梅利琵宅邸餐厅窗外的石块后。透过微启的窗帘，我看到亨利爵士与斯台普吞正相对对饮，斯台普吞频频查看着金表。\n\n然而屋外正发生着一场致命的灾难：一堵浓重冰凉的惨白色雾墙，正自大格林盆泥潭方向汹涌滚滚翻腾而来！不出五分钟，整个回返庄园的小径就会被浓雾彻底吞没。倘若视线完全受阻，我们便根本无法拦截即将来袭的凶兽！", "is_ending": false, "clues": ["自大格林盆泥潭吞没道路的浓烈地表死雾"], "choices": [{"id": "w_signal_holmes", "text": "立即向岩岗后的福尔摩斯与雷斯垂德发出紧急射击预警信号！", "target": "climax_fog_advance", "pov_switch": null, "pov_switch_name": null}, {"id": "w_storm_house", "text": "踢破餐厅大门，赶在亨利爵士踏出房门之前将他当场救出！", "target": "ending_watson_heroic", "pov_switch": null, "pov_switch_name": null}]}, "watson_hound_early_release": {"id": "watson_hound_early_release", "title": "恶犬破笼而出", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "branch", "anchor_name": null, "content": "斯台普吞狞笑着扭转了铁锁！厚重的木门轰然弹开！一头宛如来自地狱最深处的恐怖造物狂跃而出——一头体型极其庞大的黑犬，全身上下烈焰蒸腾，嘴角淌着幽蓝的荧光，张开血盆大口直扑我的喉咙！", "is_ending": false, "clues": [], "choices": [{"id": "w_stand_and_fire", "text": "扎稳马步，瞄准那燃烧着荧光的胸膛连扣扳机！", "target": "ending_watson_heroic", "pov_switch": null, "pov_switch_name": null}, {"id": "w_dodge_for_cover", "text": "扑倒在花岗石矮墙背后，等待山梁上福尔摩斯精准致命的步枪支援！", "target": "ending_canon", "pov_switch": null, "pov_switch_name": null}]}, "holmes_start": {"id": "holmes_start", "title": "石屋中的侦探", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "anchor", "anchor_name": "anchor_arrival", "content": "冰冷粗粝的史前石屋已做为我的秘密指挥所整整三天。华生以为我仍在伦敦贝克街。若他得知我的行踪，以他忠厚热忱的天性必会频繁与我联络，那狡猾的对手势必闻风遁形。\n\n小车夫卡特莱特悄然从考姆·特雷西为我运来面包与衣物。在诺桑勃兰旅馆被窃的两只鞋子是全案的枢纽——第一只全新的黄皮鞋因毫无气味而被弃；第二只旧黑皮鞋饱含亨利爵士的个人体味被窃贼盗走。凶手饲养着一头活生生的嗜血猎犬，且正在用气味对它进行严苛训练。", "is_ending": false, "clues": ["利用被盗旧皮鞋进行猎犬气味追踪训练的严密阴谋"], "choices": [{"id": "h_analyze_boot", "text": "在显微镜下化验泥潭芦苇刮下的荧光化学涂料残渍。", "target": "holmes_chemical_analysis", "pov_switch": null, "pov_switch_name": null}, {"id": "h_telescope_moor", "text": "用袖珍蔡司望远镜监视巴斯克维尔庄园与梅利琵宅邸的动静。", "target": "holmes_moor_surveillance", "pov_switch": null, "pov_switch_name": null}, {"id": "h_intercept_cartwright", "text": "接见小报童卡特莱特，详阅华生医生每日送达的侦查手记。", "target": "holmes_read_reports", "pov_switch": null, "pov_switch_name": null}]}, "holmes_chemical_analysis": {"id": "holmes_chemical_analysis", "title": "荧光化学试剂的分析", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": null, "content": "在我的便携化学试验包中，从格林盆泥潭枯草上取下的涂料成分昭然若揭：这是一种经由特殊石蜡调和的无味磷光制剂！由于完全隔绝了异味，它既不会干扰猎犬敏锐的嗅觉，又能在漆黑的深夜中发出令人魂飞魄散的耀眼蓝白荧火！\n\n将古老诅咒赋予血肉实体的，是一位智力绝顶、精通动物学的非凡凶徒。在这片荒原之上，究竟何人既懂科学，又对巴斯克维尔庞大遗产虎视眈眈？", "is_ending": false, "clues": ["不伤及猎犬嗅觉的特殊调配无味磷光化合物"], "choices": [{"id": "h_research_ancestry", "text": "追查巴斯克维尔家族族谱中流亡美洲的分支血脉。", "target": "holmes_ancestral_clue", "pov_switch": null, "pov_switch_name": null}, {"id": "h_scout_mire_island", "text": "趁着暮色苍茫，沿着泥潭暗桩摸入泥沼中央孤岛侦察犬舍。", "target": "holmes_mire_recon", "pov_switch": null, "pov_switch_name": null}]}, "holmes_moor_surveillance": {"id": "holmes_moor_surveillance", "title": "望远镜下的沼地", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": null, "content": "高倍望远镜将原野上的纤毫毕现展现在我眼前。斯台普吞手持捕蝶网穿行在大格林盆泥潭边缘，其落足步伐异乎寻常地精准——常人陷足立毙的泥泞，他竟如履平地。\n\n华生正在接近他。那位所谓的胞妹贝瑟尔急促奔出，神情激愤，手势极其决绝。那不是寻常的兄妹口角——她在警告华生！这个女人是被胁迫的从犯，心怀良知与绝望。", "is_ending": false, "clues": ["隐匿于大格林盆泥潭中的柳木寻路暗桩"], "choices": [{"id": "h_surveillance_to_mire", "text": "勘测斯台普吞插在泥潭死地中的秘密柳木标记残桩。", "target": "holmes_mire_recon", "pov_switch": null, "pov_switch_name": null}, {"id": "h_surveillance_to_reports", "text": "返回石屋基地，批阅华生自庄园送达的第一手调查文报。", "target": "holmes_read_reports", "pov_switch": null, "pov_switch_name": null}]}, "holmes_read_reports": {"id": "holmes_read_reports", "title": "华生医生的情报信件", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": null, "content": "华生展现了出色的观察力。他记录了白瑞摩的烛火暗号并锁定了越狱犯塞尔登。更为关键的是，他查出查尔兹爵士临死当夜约见的女子缩写为‘L.L.’。\n\n经我调取教区档案，此人正是考姆·特雷西的劳拉·里昂斯夫人！而全额出资为她聘请律师办理离婚手续的幕后善人，正是这位看似甘于清贫的斯台普吞！", "is_ending": false, "clues": ["斯台普吞暗中掌控劳拉·里昂斯的资金流水"], "choices": [{"id": "h_investigate_ancestry", "text": "前往庄园长廊深研巴斯克维尔历代祖先画像的骨骼面相。", "target": "holmes_ancestral_clue", "pov_switch": null, "pov_switch_name": null}, {"id": "h_observe_night_chase", "text": "夜幕低垂时登临黑色岩岗，暗中俯瞰围捕塞尔登的战局。", "target": "holmes_figure_on_tor", "pov_switch": null, "pov_switch_name": null}]}, "holmes_ancestral_clue": {"id": "holmes_ancestral_clue", "title": "雨果·巴斯克维尔的画像", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": null, "content": "巴斯克维尔庄园餐厅墙上的古老画像解开了一切谜团！当我用手掌遮掩住凶暴的雨果爵士头上的卷发与宽檐帽，画中那副阴险、贪婪而冷酷的面孔，竟然与杰克·斯台普吞分毫不差！\n\n他正是查尔兹爵士亡故的三弟罗杰·巴斯克维尔在南美洲所生的私生子！他化名凡德勒潜回英国，只要查尔兹与亨利相继暴亡，他就是这百万镑豪门家产毫无争议的法定第一继承人！", "is_ending": false, "clues": ["斯台普吞正是罗杰·巴斯克维尔的亲子与合法继承人"], "choices": [{"id": "h_summon_lestrade", "text": "火速电召苏格兰场雷斯垂德警官携正式拘捕令赶赴德文郡！", "target": "holmes_merripit_dinner", "pov_switch": null, "pov_switch_name": null}, {"id": "h_reunion_with_watson", "text": "在荒原石屋等候华生归来，向他彻底揭开全盘阴谋。", "target": "watson_hut_reunion", "pov_switch": "watson", "pov_switch_name": "约翰·H·华生医生"}]}, "holmes_figure_on_tor": {"id": "holmes_figure_on_tor", "title": "黑色岩岗上的身影", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "anchor", "anchor_name": "anchor_convict", "content": "黑色岩岗之上，狂风如长号哀鸣。山谷深处，巴斯克维尔庄园的窗前闪过一豆烛火，随后传来两人围堵塞尔登的枪声。刹那间，那声令人血液冻结的恐怖咆哮骤然在死寂的沼地上空炸响！\n\n在我脚下的乱石岗中，亡命狂奔的塞尔登身上，竟然穿着白瑞摩赠予他的亨利爵士旧粗呢猎装！那头习惯以气味辨认目标的恶犬一旦捕获气味，定会将他当成亨利爵士生生撕碎！", "is_ending": false, "clues": [], "choices": [{"id": "h_race_to_selden", "text": "飞身跃下石崖，赶在巨犬撕咬前拦截凶案发生！", "target": "holmes_selden_crisis", "pov_switch": null, "pov_switch_name": null}, {"id": "h_slip_back_to_hut", "text": "悄然潜回石屋基地，在行踪彻底暴露前同华生汇合。", "target": "holmes_hut_interior", "pov_switch": null, "pov_switch_name": null}, {"id": "h_switch_to_stapleton", "text": "【转换视角：切换至杰克·斯台普吞操控恶犬的暗夜现场】", "target": "stapleton_moor_night", "pov_switch": "stapleton", "pov_switch_name": "杰克·斯台普吞"}]}, "holmes_selden_crisis": {"id": "holmes_selden_crisis", "title": "绝壁下的惨剧", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": null, "content": "一声惨绝人寰的尖叫撕裂了夜空，伴随着骨骼撞击坚硬岩石的沉闷钝响。我飞奔至峭壁下方，塞尔登横尸于乱石丛中，颅骨粉碎。石楠草丛间还弥漫着浓烈的硫磺与磷化物气味。\n\n一阵轻微脚步声自雾中传来，斯台普吞手提马灯急匆匆拨开草丛——他满怀期待，以为倒在血泊中的正是亨利爵士！", "is_ending": false, "clues": [], "choices": [{"id": "h_confront_stapleton_now", "text": "当场撕下伪装，当面对质指控其杀人罪行！", "target": "ending_holmes_master_deduction", "pov_switch": null, "pov_switch_name": null}, {"id": "h_play_the_fool", " 克·福尔摩斯", "node_type": "anchor", "anchor_name": "anchor_climax", "content": "苏格兰场的雷斯垂德警官已与华生和我并肩埋伏在距梅利琵宅邸五十码的花岗石低脊后。亨利爵士已与斯台普吞用罢晚膳，正孤身步入漆黑的荒原小径准备返程。\n\n然而自南面泥潭深处，一堵遮天蔽日的厚重白雾正如决堤般滚滚袭来，迅猛抹平了眼前的整条归途！再过五分钟，我们的射界将荡然无存！", "is_ending": false, "clues": [], "choices": [{"id": "h_hold_fire", "text": "原地隐蔽固守，屏息等待那头恶兽撞入近距有效火网！", "target": "climax_fog_advance", "pov_switch": null, "pov_switch_name": null}, {"id": "h_charge_forward", "text": "果断前插冲入浓雾，赶在恶犬扑咬前切入亨利爵士身前！", "target": "climax_fog_advance", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_start": {"id": "stapleton_start", "title": "梅利琵宅邸的毒网", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "anchor", "anchor_name": "anchor_arrival", "content": "查尔兹爵士已长眠地下，正如我精密设计的那样，被猎犬的狂吠活活吓死在水松夹道栅门前。如今新继承人亨利爵士来到了德文郡。他只带了一个平庸迟钝的退役军医华生，而大名鼎鼎的福尔摩斯却在伦敦作茧自缚。\n\n一百万镑巨额遗产与巴斯克维尔庄园的古老荣耀近在咫尺。只要解决掉亨利，我便能以南美洲侨民凡德勒的身份，合法认领这片富庶的祖产！", "is_ending": false, "clues": ["斯台普吞对巴斯克维尔百万遗产的法定继承主张"], "choices": [{"id": "s_scout_watson", "text": "手提捕蝶网，在格林盆泥潭边缘‘偶遇’初来乍到的华生医生。", "target": "stapleton_moor_stroll", "pov_switch": null, "pov_switch_name": null}, {"id": "s_check_hound", "text": "涉险潜入泥潭荒岛，检查恶犬的饥饿状态与气味记忆。", "target": "stapleton_check_hound", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_moor_stroll": {"id": "stapleton_moor_stroll", "title": "伪装温和的博物学家", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "我将谦逊和蔼的昆虫学者扮演得惟妙惟肖。为了让华生亲眼见识泥潭的恐怖，我冷漠地指着一匹泥足深陷的马驹在绝望嘶鸣中沉没。可就在此时，贝瑟尔竟如疯癫般从石楠中冲出！她误将华生当做亨利爵士，歇斯底里地发出预警！\n\n这愚蠢而叛逆的女人若敢毁掉我数年心血，我决不吝惜彻底剥夺她的自由。", "is_ending": false, "clues": [], "choices": [{"id": "s_chastise_beryl", "text": "闭门严惩贝瑟尔，彻底击垮她的反抗意图。", "target": "stapleton_beryl_control", "pov_switch": null, "pov_switch_name": null}, {"id": "s_charm_watson", "text": "对贝瑟尔的反常举动巧言掩饰，用沼泽植被学说引开华生注意力。", "target": "stapleton_deceive_watson", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_check_hound": {"id": "stapleton_check_hound", "title": "泥潭锡矿里的巨兽", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "我轻车熟路地踩着隐秘草甸来到废弃锡矿棚。铁链哗哗作响，嗜血巨兽喉中翻滚着嗜杀的闷雷。我将亨利爵士那只带有浓重足部汗渍的黑色旧皮鞋死死按在它的鼻孔前，直到涎水湿透它的獠牙。\n\n石蜡磷光糊已经熬制完毕——无色无味，在黑夜中能释放出令迷信懦夫神智崩塌的幽蓝烈焰。", "is_ending": false, "clues": ["已完成气味锁定与荧光涂饰的恶魔猎犬"], "choices": [{"id": "s_apply_phosphor", "text": "将发光磷糊浓墨重彩地涂抹在巨犬的吻部与眼窝四周。", "target": "stapleton_phosphor_prep", "pov_switch": null, "pov_switch_name": null}, {"id": "s_plan_dinner", "text": "返回梅利琵宅邸，亲赴庄园邀请亨利爵士参加最后的鸿门宴。", "target": "stapleton_invite_henry", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_beryl_control": {"id": "stapleton_beryl_control", "title": "囚禁叛逆的妻子", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "在锁死的寝室中，贝瑟尔泪流满面却目光坚定。她断然拒绝继续扮演胞妹替我诱惑亨利。‘杰克，你是一个地狱里爬出来的恶魔！’她尖叫道。\n\n那又何妨？一束结实的麻绳与一块毛巾足以买下整个夜晚的绝对安宁。在她吐露只字片语之前，一切都将尘埃落定。", "is_ending": false, "clues": [], "choices": [{"id": "s_bind_now", "text": "将贝瑟尔牢牢绑死在黄铜床柱上并堵住嘴唇，专心布置晚宴。", "target": "stapleton_bind_beryl", "pov_switch": null, "pov_switch_name": null}, {"id": "s_patrol_tors", "text": "在晚宴前巡视荒原花岗石岗，清除任何潜藏的不安定因素。", "target": "stapleton_search_tors", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_deceive_watson": {"id": "stapleton_deceive_watson", "title": "试探华生医生的虚实", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "在梅利琵宅邸的午茶桌上，我试探性地打听福尔摩斯的近况。华生坚称大侦探正忙于伦敦的一桩公款侵吞大案。但他游移不定的眼神却屡次瞟向黑色岩岗方向。\n\n难道那些史前石屋中潜伏着来自伦敦的不速之客？午后我确曾注意到石堆中升起了一缕淡淡的青烟。", "is_ending": false, "clues": [], "choices": [{"id": "s_investigate_hut", "text": "携带卡宾枪登上山岗，清查史前石屋深处的秘密。", "target": "stapleton_search_tors", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ignore_smoke", "text": "将其视作寻常放牧者或逃犯，毫不动摇地推进亨利爵士的晚宴刺杀计划。", "target": "stapleton_invite_henry", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_phosphor_prep": {"id": "stapleton_phosphor_prep", "title": "地狱般的发光巨犬", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "发光膏料在黑暗中散发出幽绿而冰冷的光辉。在这废弃的泥潭矿棚里，这头猛兽犹如直接脱胎于但丁神曲中的幽冥守卫！没有任何凡人的心脏能经受得住这等魔怪迎面扑咬而不当场骤停！\n\n大局已定。只待亨利爵士踏入这片夜黑风高的无情原野。", "is_ending": false, "clues": [], "choices": [{"id": "s_phosphor_to_bind", "text": "锁闭矿棚，折回宅邸将贝瑟尔五花大绑彻底封口。", "target": "stapleton_bind_beryl", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_search_tors": {"id": "stapleton_search_tors", "title": "岩岗上的一缕青烟", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "我举起野战双筒镜远眺黑色岩岗。在圆形石屋门前，一个小信使正在卸下新鲜面包与罐头。屋里住着一个极其冷酷、作息规律、纪律森严的人！\n\n倘若是伦敦来的暗探，就必须在今夜与华生合流之前彻底灭口！", "is_ending": false, "clues": [], "choices": [{"id": "s_hound_the_hut", "text": "夜间将恶犬引向石屋方向，率先拔除这颗致命钉子！", "target": "stapleton_attack_hut", "pov_switch": null, "pov_switch_name": null}, {"id": "s_proceed_with_henry", "text": "亨利爵士才是真正的遗产关键，不必节外生枝，按时赴宴！", "target": "stapleton_invite_henry", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_moor_night": {"id": "stapleton_moor_night", "title": "追捕逃犯的黑夜", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "anchor", "anchor_name": "anchor_convict", "content": "今夜原野上呼喊四起，华生与亨利正在山野围堵逃犯。我抓住这天赐良机，循着亨利皮鞋的气味放出了猎犬！\n\n巨兽在狰狞的花岗岩悬崖上将猎物逼上绝路，伴随着一声撕心裂肺的惊呼，一个人影坠落悬崖！我欣喜若狂地提着马灯上前验尸——然而横陈在泥泞中的，竟然是穿着亨利旧衣服的越狱犯塞尔登！", "is_ending": false, "clues": [], "choices": [{"id": "s_salvage_plan", "text": "痛斥失误，迅速遁入黑暗，赶在华生抵达前邀请亨利明晚赴宴弥补战机！", "target": "stapleton_invite_henry", "pov_switch": null, "pov_switch_name": null}, {"id": "s_panic_escape", "text": "恐惧暴露！带上金条潜入大格林盆泥潭密径仓皇出逃！", "target": "ending_stapleton_tragedy", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_attack_hut": {"id": "stapleton_attack_hut", "title": "突袭石屋的伏击", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "我驱使发光恶犬扑向史前石屋。然而就在巨犬腾空的刹那，乱石堆中轰然爆出一声枪响！子弹贯穿恶犬前肩，怪物痛嗥着窜入荒原。而在浓烟散去之处，歇洛克·福尔摩斯手持左轮冷峻走出！", "is_ending": false, "clues": [], "choices": [{"id": "s_run_for_mire", "text": "掉头拼死狂奔，逃向大格林盆泥潭深处的绝命泥炭孤岛！", "target": "ending_staple       root.innerHTML = `
        ${langBannerHtml}
        <h1 class="story-title">${escapeHtml(story.title)}</h1>
        <p class="story-subtitle">${escapeHtml(story.author)}</p>
        <p style="text-align: center; margin-bottom: 24px;">${escapeHtml(story.description)}</p>
        ${einkNoteHtml}
        ${povCardsHtml}
        ${downloadsHtml}
      `;
      window.scrollTo(0, 0);
    }

    function startStory(pov) {
      state.currentPOV = pov;
      state.history = [];
      state.cluesDiscovered.clear();
      const startNodeId = getStory().start_nodes[pov];
      goToNode(startNodeId);
    }

    function goToNode(nodeId, isBack = false) {
      const story = getStory();
      const node = story.nodes[nodeId];
      if (!node) {
        console.error("Node not found:", nodeId);
        return;
      }

      if (!isBack && state.currentNodeId) {
        state.history.push(state.currentNodeId);
      }

      state.currentNodeId = nodeId;
      state.currentPOV = node.pov;
      state.currentView = "scene";

      if (node.clues && node.clues.length > 0) {
        node.clues.forEach(c => state.cluesDiscovered.add(c));
      }

      renderScene(node);
      window.scrollTo(0, 0);
    }

    function goBack() {
      if (state.history.length > 0) {
        const prevId = state.history.pop();
        goToNode(prevId, true);
      } else {
        renderHome();
      }
    }

    function renderScene(node) {
      const isCn = state.lang === "cn";
      heading.textContent = isCn ? `当前视角：${node.pov_name}` : `POV: ${node.pov_name}`;

      const paragraphs = node.content.split("\n\n")
        .map(p => `<p>${escapeHtml(p.trim())}</p>`)
        .join("");

      let cluesHtml = "";
      if (state.cluesDiscovered.size > 0) {
        const cluesList = Array.from(state.cluesDiscovered)
          .map(c => `<li>${escapeHtml(c)}</li>`)
          .join("");
        const cluesTitle = isCn
          ? `案件侦查线索 (${state.cluesDiscovered.size}):`
          : `Case Notes &amp; Clues Discovered (${state.cluesDiscovered.size}):`;
        cluesHtml = `
          <div class="clues-panel">
            <strong>${cluesTitle}</strong>
            <ul>${cluesList}</ul>
          </div>
        `;
      }

      let choicesHtml = "";
      if (node.is_ending) {
        const endingTitle = isCn ? "~ 案情终局 ~" : "~ Chronicle Concluded ~";
        const endingDesc = isCn
          ? "你已在当前线索分支中达成了案情结局。"
          : "You have reached a resolution in this investigation.";
        const replayText = isCn ? "&larr; 换一个视角重新探索" : "&larr; Choose Another Perspective / Replay";
        choicesHtml = `
          <div class="ending-card">
            <h3>${endingTitle}</h3>
            <p style="margin-bottom: 18px;">${endingDesc}</p>
            <button class="choice-card" onclick="renderHome()" style="text-align: center; font-weight: bold;">
              ${replayText}
            </button>
          </div>
        `;
      } else {
        const choiceCards = node.choices.map((c, index) => {
          let switchTag = "";
          if (c.pov_switch_name) {
            switchTag = isCn
              ? `<div class="pov-switch-notice">&xrarr; 视角即将切换至：${escapeHtml(c.pov_switch_name)}</div>`
              : `<div class="pov-switch-notice">&xrarr; Perspective shifts to ${escapeHtml(c.pov_switch_name)}</div>`;
          }
          return `
            <button class="choice-card" onclick="goToNode('${c.target}')">
              <strong>${index + 1}.</strong> ${escapeHtml(c.text)}
              ${switchTag}
            </button>
          `;
        }).join("");

        const choiceHeader = isCn ? "决定你的下一步行动：" : "Decide Your Next Action:";
        choicesHtml = `
          <div class="choices-section">
            <div class="choices-header">${choiceHeader}</div>
            ${choiceCards}
          </div>
        `;
      }

      const anchorText = isCn ? "正典主线关键节点" : "Canon Milestone";
      const anchorBadge = node.anchor_name
        ? `<span class="anchor-tag">${anchorText}</span>`
        : "";

      const povLabel = isCn ? "视角" : "Perspective";
      const backText = isCn ? "&larr; 返回上一节" : "&larr; Previous Scene";
      const tocText = isCn ? "返回主目录" : "Table of Contents";

      root.innerHTML = `
        <div class="pov-indicator">
          <span><strong>${povLabel}:</strong> ${escapeHtml(node.pov_name)}</span>
          ${anchorBadge}
        </div>

        <h2 class="scene-title">${escapeHtml(node.title)}</h2>

        <div class="prose">
          ${paragraphs}
        </div>

        ${cluesHtml}
        ${choicesHtml}

        <div class="bottom-nav">
          <button onclick="goBack()">${backText}</button>
          <button onclick="renderHome()">${tocText}</button>
        </div>
      `;
    }

    function escapeHtml(str) {
      if (!str) return "";
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Initialize in English by default
    renderHome();
  </script>
</body>
</html>
