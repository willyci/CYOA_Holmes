act, he recorded every incident of his first week upon the moor:\n\nItem One: The escaped convict, Selden. The military cordon had failed to capture him. The guards had been withdrawn, and the county authorities had concluded that the wretch had either perished in the quagmires of Grimpen Mire or had succeeded in reaching the southern seaports. Yet Watson noted a strange, uneasy tension in the household: food had disappeared from the larder, and Mrs. Barrymore’s eyes were perpetually red and swollen with weeping.\n\nItem Two: The nightly movements of Mr. John Barrymore. Watson and Sir Henry had kept watch in the dark corridor outside the master suite. Twice, at two o’clock in the morning, the heavy, silent tread of the butler had passed their door. Holding a flickering candle in his hand, Barrymore had stolen to an empty guest chamber at the western end of the corridor. There, leaning against the window-pane, he had held the candle aloft for several minutes, staring out into the pitch-black void of the moor, as though waiting for an answering signal!\n\nItem Three: The romance between Sir Henry and Beryl Stapleton. Young Sir Henry had fallen violently, hopelessly in love with the dark-eyed beauty of Merripit House. He visited her daily; he walked with her across the heather. But then had occurred a scene of singular violence: Sir Henry had attempted to take Beryl’s hand and embrace her on the moor road. At that instant, Jack Stapleton had burst from behind a granite boulder like a madman, his face livid with fury, his eyes blazing, screaming insults and demanding that Sir Henry unhand his sister and never dare address her again! Yet only two hours later, Stapleton had called at Baskerville Hall, apologized profusely for his ungentlemanly conduct, and invited Sir Henry to dine with them at Merripit House at the earliest opportunity.\n\nI leaned back against the curved stone wall, a ring of blue pipe-smoke drifting up into the roof opening.\n\n“How beautifully the pieces interlock!” I said softly to myself. “Watson is baffled by Stapleton’s conduct. He attributes it to the eccentric jealousy of a brother who cannot bear to lose his companion. Blind, honest Watson! A brother would welcome a match with a baronet of ancient blood and a fortune of three-quarters of a million pounds! It is the dream of every ambitious social-climber in England! Why, then, did Stapleton foam at the mouth like a rabid dog when he saw another man’s arm around her waist?”\n\nThe answer was written in the blood of human nature.\n\n“Because Beryl is his wife!” I whispered into the silence of the hut. “The monster has forced his lawful wife to play the part of an unmarried sister, dangling her beauty as a lure before young Sir Henry to draw him onto the isolated moor roads! Yet when the trap begins to spring, the brute’s own animal jealousy overmasters his cunning, and he flies at the throat of his victim!”\n\nAnd as for Barrymore’s candle in the window?\n\nI glanced through the low doorway towards the black crags of the tor. “Barrymore is not the killer,” I concluded. “He is signaling to someone in the rocks. Someone who is starving; someone connected to Mrs. Barrymore’s tears. That is an underplot, Watson—a domestic melodrama played out against the backdrop of our great tragedy. Tonight, I shall take post upon the rocks and see who answers the butler’s candle!”", "is_ending": false, "clues": ["Watson dispatches reveal Barrymore creeping down corridors at 2 a.m. with a candle", "Sir Henry is pursuing an ardent courtship of Beryl Stapleton, provoking Jack Stapleton’s jealous fury", "Holmes identifies Stapleton’s irrational rage as that of a possessive husband, not a protective brother"], "choices": [{"id": "h_ch8_c1", "text": "Keep watch on the moor at midnight to trace the answering signal to Barrymore’s light.", "target": "holmes_ch09_part1_midnight_watch", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch8_c2", "text": "[Switch POV to Dr. Watson] Read Watson’s original journal dispatch from the Hall.", "target": "ch08_watson_report", "pov_switch": "watson", "pov_switch_name": "Dr. John H. Watson"}]}, "holmes_ch09_part1_midnight_watch": {"id": "holmes_ch09_part1_midnight_watch", "title": "Chapter 9: The Light upon the Moor (Part I: The Candle and the Signal)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": "anchor_convict", "content": "Midnight had struck from the distant church tower of Grimpen. The rain had ceased, but the gale continued to sweep across the high plateaus, tearing the scudding clouds into ragged black shreds.\n\nI lay prone upon the flat granite summit of Black Tor, my canvas groundsheet beneath me, my field glass pressed to my eye. Two miles away, the dark, sprawling mass of Baskerville Hall sat like an island of black timber amid the silver-grey sea of heather.\n\nSuddenly, a tiny point of yellow flame bloomed in the dark facade.\n\nIt was the window at the western gable. The flame flared once, twice, three times—a candle held close to the glass and shielded by a hand.\n\nI swung the barrel of the telescope half a mile across the moor to the west, sweeping the broken granite clatters. For several minutes, there was only darkness. And then, from the hollow of a ruined dry-stone sheep-pen, an answering spark flickered into life! A dull, reddish glow—a match touched to a dry candle-end, held aloft for ten seconds, and then extinguished.\n\n“Barrymore’s partner in crime,” I muttered. “Let us see who ventures out into the night.”\n\nDown at the Hall, the side door opened. Two figures slipped out onto the terrace. Through the glass, the athletic stride of Sir Henry and the square, resolute shoulders of Watson were unmistakable. Both men wore heavy coats and carried revolvers. They were advancing swiftly and silently across the heather, heading straight for the beacon in the rocks!\n\nThe game was becoming perilous. If they cornered the man, there would be blood.\n\nI followed their advance through the rocks. The candle in the sheep-pen flared again. The occupant was careless, driven by cold and starvation. As Sir Henry and Watson closed within thirty paces, the moonlight broke through a rift in the scudding clouds, casting a cold, silver glare over the amphitheatre of stones.\n\nA creature sprang up from behind a rock.\n\nThrough the powerful magnification of my lens, I saw him with startling clarity: a gaunt, savage, filthy apparition with a matted beard, sunken, burning eyes, and the branded look of a hunted wolf. He wore the coarse, yellow-and-brown striped uniform of the convict, torn to shreds by brambles and caked with the dried muck of the peat bog.\n\nIt was Selden! The Notting Hill murderer!\n\nSir Henry shouted and dashed forward. Selden hurled a heavy granite stone, which crashed against a boulder within an inch of Watson’s shoulder. With the speed of an ape, the convict leaped over a chasm, scrambled up the steep face of a granite clatter, and fled frantically out onto the open moor!\n\nWatson raised his revolver. Two flashes of orange fire punctured the night, followed by the whip-like crack of shots. The bullets whined off the rocks, but Selden was untouched; he bounded down the reverse slope and vanished into the labyrinth of boulders.\n\nAnd then, as Watson and Sir Henry lowered their weapons, breathing hard upon the hillside...\n\nIt came.\n\nFrom far away in the direction of the Great Grimpen Mire, a sound rose upon the wind—a deep, hollow, menacing howl that swelled into a prolonged, reverberating roar that made the granite stones beneath my chest vibrate with horror! It was not the bark of a sheep-dog; it was not the bay of a foxhound. It was a mournful, savage, thunderous cry of boundless ferocity, rising and falling like the voice of a demon howling in the abyss!\n\nI felt the hairs upon the back of my neck stand on end.\n\nAcross the valley, Watson and Sir Henry stopped dead in their tracks. Through the glass, I saw Sir Henry grasp Watson’s arm, his face blanching to the colour of ash. Even across two miles of open moor, the primal terror of that sound seemed to freeze the blood in their veins!\n\n“You hear it, don’t you, my friends?” I whispered into the howling gale, my hand closing over the cold steel of my own revolver. “The beast is awake. It smells the blood of the Baskervilles upon the wind!”", "is_ending": false, "clues": ["Watched the midnight candle signal from Baskerville Hall window answered by a flicker on the rocks", "Identified the signal receiver as Selden, the Notting Hill convict and brother of Mrs. Barrymore", "A blood-chilling hound roar reverberates through the crags, terrifying Watson and Sir Henry"], "choices": [{"id": "h_ch9_p1_c1", "text": "Hold your position upon Black Tor to avoid blowing your covert surveillance.", "target": "holmes_ch09_part2_figure_on_the_tor", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch9_p1_c2", "text": "[Switch POV to Dr. Watson] Join the armed midnight chase across the rocky moor.", "target": "ch09_part2_moor_chase", "pov_switch": "watson", "pov_switch_name": "Dr. John H. Watson"}]}, "holmes_ch09_part2_figure_on_the_tor": {"id": "holmes_ch09_part2_figure_on_the_tor", "title": "Chapter 9: The Light upon the Moor (Part II: The Figure upon the Tor)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": "anchor_man_on_tor", "content": "The terrible baying died away into the gale, leaving in its wake a silence more dreadful than the cry itself.\n\nTwo miles away on the moonlit ridge, Watson and Sir Henry had abandoned all thought of pursuing the convict. They turned back towards the post-road, walking shoulder to shoulder, their eyes darting nervously towards every shadow in the heather.\n\nI stood upright upon the highest pinnacle of Black Tor.\n\nThe moon had cleared the last bank of storm clouds, hanging like a burnished silver shield in the deep indigo vault of heaven. Its brilliant rays bathed the crags in an unearthly, crystalline light, etching every fissure of the rock in ink and bone. I wrapped my heavy pea-jacket tightly across my chest, folded my arms, and let the wind whip my hair, looking down from my aerial perch upon the retreating figures of my friends.\n\nIt was an imprudence, perhaps—a momentary indulgence of that theatrical dramatic instinct which Watson has so often diagnosed in my nature. Yet there was a sublime majesty in that desolate waste at two o’clock in the morning that stirred the blood like wine.\n\nSuddenly, Watson stopped upon the path below.\n\nHe turned on his heel and looked back towards the high ridges of the north. His eyes swept the crags, and in that instant, his gaze locked onto the pinnacle of Black Tor.\n\nEven without my glass, I saw the jerk of his arm as he gripped Sir Henry’s shoulder. There was no mistaking what they saw: against the silver disc of the full moon, silhouetted in razor-sharp relief upon the highest stone, stood the figure of a solitary man—tall, gaunt, motionless as an ebony statue, his arms folded across his breast, his cloaked shoulders outlined against the sky!\n\n“Look! Look yonder!” I could almost hear Watson’s shout carry across the gale.\n\nThe doctor raised his revolver, his arm steadying as he aimed towards the high rock.\n\n“Hold your fire, my dear fellow,” I whispered with a faint, wry smile. “You would scarcely hit a target at eight hundred yards with an Adams revolver, and you might seriously discommode your oldest friend.”\n\nI did not wait for the bullet. With a single fluid step, I dropped backward into the deep shadow of the rock-cleft. Sliding down the granite chimney with the silent agility of an otter, I ducked through the low doorway of my stone hut and seated myself once more upon my blanket.\n\nOutside, the sharp crack of Watson’s distant shot rolled across the waste, flat and puny against the vast silence of the night.\n\nCartwright stirred in his heather bed, muttering in his sleep, then settled back into slumber. I struck a match, shielded the flame with my palm, and lit my blackened clay pipe.\n\n“A near thing, Watson,” I reflected, watching the smoke curl towards the stone rafters. “You are an indefatigable sentinel. But you must not know yet. If you knew, your honest, open countenance would betray the secret within twenty-four hours to the sharp eyes of Jack Stapleton. You would speak differently; you would look differently; your very step upon the gravel would lose that anxious weight which now convinces our enemy that Sir Henry stands alone and unprotected!”\n\nNo. The game must be played out to the bitter end. The net was closing, but three vital threads still needed to be spliced together:\n\nFirst: The identity of the woman whose letter lured Sir Charles to the gate.\n\nSecond: The physical proof connecting Stapleton to the bloodline of the Baskervilles.\n\nThird: The lair in the Great Grimpen Mire where the fire-breathing monster was chained!\n\nI closed my eyes, leaned my head against the ancient granite, and listened to the wind howling across the roof of the world.", "is_ending": false, "clues": ["Holmes stood silhouetted atop Black Tor under the moonlight, arms folded, watching Watson", "Watson spotted the mysterious solitary watcher and fired a shot towards the summit", "Holmes deliberately vanished into the rocks to preserve the covert trap until all evidence was complete"], "choices": [{"id": "h_ch9_p2_c1", "text": "Analyze Watson’s diary extracts regarding the charred letter signed “L.L.”", "target": "holmes_ch10_diary_and_laura", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch9_p2_c2", "text": "[Switch POV to Jack Stapleton] See Stapleton traversing the mire to feed the hound.", "target": "stapleton_ch09_part1_feeding_the_hound", "pov_switch": "stapleton", "pov_switch_name": "Jack Stapleton"}]}, "holmes_ch10_diary_and_laura": {"id": "holmes_ch10_diary_and_laura", "title": "Chapter 10: Extract from the Diary of Dr. Watson (The Secret of L.L.)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": "anchor_diary", "content": "The morning brought a temporary lull in the storm. Pale shafts of autumn sunlight broke through the mist, turning the sodden heather into a carpet of russet and gold. Inside the stone hut, I sat upon my pack, devouring the second dispatch from Baker Street which Cartwright had brought up the mountain at daybreak.\n\nWatson had excelled himself. Driven by the mystery of the candle in the window, he and Sir Henry had confronted Barrymore in the library of Baskerville Hall.\n\nThe butler, broken by their accusations, had broken down and confessed the secret of the candle: the runaway convict Selden was indeed his wife’s youngest brother, the spoiled darling of her childhood, whom she could not bear to see starve upon the crags. That mystery was solved, exactly as my deductions had foretold.\n\nBut then, as Watson pressed the butler for any further facts concerning Sir Charles’s death, Barrymore had made a revelation of stupendous importance.\n\n“Sir Charles went to the gate that night to meet a woman,” Barrymore had blurted out.\n\n“A woman!” Watson had cried. “What woman?”\n\n“I do not know her name, sir,” Barrymore had replied. “But on the morning of the day he died, Sir Charles received a letter postmarked Coombe Tracey, addressed in a woman’s delicate hand. After the tragedy, when my wife went to clean the study grate, she found the charred remnant of that letter. The body of the paper was consumed, but the postscript at the bottom had remained legible:\n\n‘...Please, please, as you are a gentleman, burn this letter, and be at the gate by ten o’clock. — L.L.’”\n\nI dropped the paper onto my knee, my eyes blazing like live coals.\n\n“L.L.!” I whispered aloud. “L.L.! By heavens, the master-link has forged itself in the fire!”\n\nI sprang to my feet and paced the narrow confines of the circular hut, my mind racing through every name, every scrap of gossip recorded in Mortimer’s notebook and the county directories.\n\nWho in the district of Coombe Tracey bore the initials L.L.?\n\nWatson’s notes provided the answer on the following page. In his methodical, bulldog fashion, Watson had consulted Mortimer immediately upon leaving the Hall. The doctor had supplied the missing name without hesitation:\n\nMrs. Laura Lyons.\n\nShe was the daughter of old Frankland of Lafter Hall, that litigious eccentric who spent his fortune suing his neighbours over ancient rights of way. Her father had disowned her five years earlier when she eloped with a penniless, scoundrelly landscape painter named Lyons. The husband had soon abandoned her in London, leaving her destitute. She had returned to Devonshire, where Sir Charles Baskerville and other charitable gentlemen had provided her with funds to establish a modest typewriting office in the market town of Coombe Tracey.\n\n“A destitute, beautiful woman,” I reasoned, striking my open palm with my clenched fist. “A woman desperate to secure a legal divorce from a blackguard husband; a woman dependent upon the charity of Sir Charles Baskerville; and a woman residing in the very village where Jack Stapleton visits weekly under the guise of an entomological scholar!”\n\nThe entire sinister design burst upon my intellect with the blinding glare of an explosion.\n\nStapleton had courted Laura Lyons in secret! He had feigned an ardent passion; he had promised her marriage and respectability the moment her divorce was completed. But a divorce in England requires heavy legal fees. Stapleton had directed her to write an urgent, desperate plea for money to her wealthy patron, Sir Charles, begging for an appointment at the lonely gate of the Yew Alley at ten o’clock at night.\n\nAnd then—the masterstroke of the demon!\n\nHaving induced Laura Lyons to write the fatal letter, Stapleton had prevented her from keeping the appointment! He had promised to handle the matter himself. He had sent the terrified woman home, and then... he had taken his phosphorus-coated beast to the wicket gate where the superstitious old baronet stood waiting in the dark!\n\n“The net is complete!” I shouted into the stone dome above my head. “Cartwright! Pack the hamper! We ride to Coombe Tracey! Before this sun sets, Laura Lyons will tear the mask from the face of Jack Stapleton!”", "is_ending": false, "clues": ["Watson cross-examined Barrymore: Sir Charles went to the gate to meet a woman", "Burnt letter postscript recovered from fireplace grate: “...as you are a gentleman, burn this letter, and be at the gate by ten o’clock. — L.L.”", "Dr. Mortimer identifies L.L. as Mrs. Laura Lyons, estranged daughter of old Frankland of Coombe Tracey"], "choices": [{"id": "h_ch10_c1", "text": "Proceed to Coombe Tracey to interrogate Laura Lyons and shatter Stapleton’s deceit.", "target": "holmes_ch11_part1_lyons", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch10_c2", "text": "[Switch POV to Jack Stapleton] Discover how Stapleton controlled and silenced Laura Lyons.", "target": "stapleton_ch10_coombe_control", "pov_switch": "stapleton", "pov_switch_name": "Jack Stapleton"}]}, "holmes_ch11_part1_lyons": {"id": "holmes_ch11_part1_lyons", "title": "Chapter 11: The Man on the Tor (Part I: The Inquest of Laura Lyons)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "The market town of Coombe Tracey lay nestled in a sheltered coombe some five miles to the north-east of the moor. By two o’clock that afternoon, I had exchanged my rough frieze jacket for a clean suit of dark tweed and sat in the modest sitting-room of Mrs. Laura Lyons.\n\nShe was an extraordinarily handsome woman, with rich hazel eyes, dark curls piled upon a graceful neck, and a delicate, flushed complexion. Yet there was that in the set of her mouth and the nervous twitching of her fingers which betrayed a woman living under intolerable strain. When I introduced myself as an investigator looking into the death of Sir Charles Baskerville, a sudden spasm of terror flitted across her features.\n\n“I have already told Dr. Watson everything that I know,” said she, holding her head high with defensive pride. “Sir Charles was an extraordinarily noble benefactor. He assisted me in establishing this typewriting business. I had no other relations with him.”\n\n“Mrs. Lyons,” said I, leaning forward and fixing her with my cold, grey eyes, “you are playing with fire. The official inquest is one thing; a criminal investigation for murder is another. If you persist in falsehood, you may find yourself standing in the dock as an accessory before the fact to the murder of Sir Charles Baskerville!”\n\nShe blanched to the roots of her hair. “Murder? It was declared heart failure!”\n\n“It was murder, madam. Cold, calculating, brutal murder. And you were the instrument employed to draw the victim to his slaughter.”\n\n“No! No! As God is my witness, I swear I wished him no harm!”\n\n“Then why did you write to him on the day of his death, begging him to meet you at the gate of the Yew Alley at ten o’clock at night?”\n\nShe buried her face in her hands, her shoulders heaving with dry, silent sobs. For several minutes the clock on the mantelpiece ticked loudly in the silence.\n\n“I was desperate,” she whispered through her fingers. “My father had cast me off. My wretched husband in London threatened to return and claim my small earnings under the matrimonial law. I was told that if I could raise a certain sum of money, a legal divorce could be obtained. I appealed to Sir Charles’s chivalry.”\n\n“And who suggested that you should appeal to him?”\n\nShe hesitated, her eyes darting towards the door. “A... a friend.”\n\n“A friend named Jack Stapleton!” I thundered, striking the table with my palm.\n\nShe gasped and shrank back into her armchair as though I had struck her.\n\n“Listen to me, Mrs. Lyons,” I continued, my voice sinking into an earnest, commanding cadence. “You imagine that Jack Stapleton loves you. You imagine that when you are free, he will make you his wife and restore you to society. You are clinging to a spider’s web woven across an open grave!”\n\n“He loves me!” she cried passionately, her hazel eyes flashing through her tears. “He has sworn it a thousand times! He is unmarried; his sister Beryl lives with him—”\n\nI reached into my pocket and drew forth a folded legal document, laying it flat before her eyes.\n\n“This is an attested copy of the register of marriage from the Church of San Pedro in San Jose, Costa Rica, dated seven years ago. It records the union of Jack Vandeleur, formerly of York, with Senorita Beryl Garcia. And this second document is a prospectus of a private preparatory school in Yorkshire, featuring portraits of Mr. Vandeleur and his charming Latin wife.”\n\nLaura Lyons stared at the papers. Her eyes dilated; her jaw fell slack; every drop of blood drained from her lips until she looked like a corpse carved in marble.\n\n“His... his wife?” she choked. “Beryl is his wife?”\n\n“Beryl is his lawful wife,” I answered pitilessly. “He has passed her off as his sister because an unmarried beauty is a far more effective decoy in his bloody schemes. He had promised to marry you, madam, while his wife sat in the next room listening to your shame!”\n\nA terrible cry broke from the woman’s lips—a shriek of wounded pride, betrayed love, and murderous fury that would have chilled Stapleton’s soul had he heard it. She sprang to her feet, her hands clenched into fists, her eyes blazing like a fury’s.\n\n“The villain! The monstrous, cowardly villain!” she gasped, trembling in every limb. “He used me! He used my agony to murder that saintly old man!”\n\n“Tell me everything, Mrs. Lyons,” I said gently, drawing a chair towards her. “The law will protect you if you speak the truth.”\n\nShe sank back into her seat, weeping tears of bitter rage. “He dictated the letter, Mr. Holmes! Every word of it! He told me that Sir Charles would never grant an interview in daylight for fear of local gossip, but that if I pleaded for his help at the moor-gate, he would give me the funds for my divorce. And then—on that very afternoon—Stapleton came to this room. He told me that his pride would not permit another man to pay for my freedom; he swore that he would find the money himself; and he made me swear upon the Bible that I would not go near Baskerville Hall that night!”\n\n“And you stayed away?”\n\n“I stayed here in this room, thanking God for his noble generosity! And the next morning, when the news arrived that Sir Charles was dead... Stapleton came back. He stood where you are standing now, his face pale as paper, his eyes like two coals. He told me that if I ever breathed a syllable about that letter, the police would arrest me for murder, and that my silence was his only hope and mine!”\n\nI rose and took my hat. “You have done your duty, Mrs. Lyons. You have placed the noose around the neck of Sir Charles’s assassin. Remain in this house; speak to no one; and remember that the law will soon settle your accounts with Mr. Jack Stapleton.”\n\nI strode out into the market square, my heart bounding within my chest. The last missing link of the chain was welded! Now, across the darkening moor, my good Watson was waiting in my mountain lair!", "is_ending": false, "clues": ["Confronted Laura Lyons in Coombe Tracey regarding her midnight letter to Sir Charles", "Produced documentary proof that Jack Stapleton is legally married to Beryl Garcia of Costa Rica", "Laura confessed: Stapleton dictated the letter, promised marriage, then forbade her from attending"], "choices": [{"id": "h_ch11_p1_c1", "text": "Return across the moor to your stone hut to rendezvous with Watson.", "target": "holmes_ch11_part2_stone_hut", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch11_p1_c2", "text": "[Switch POV to Dr. Watson] See Watson investigating the prehistoric hut on Black Tor.", "target": "ch11_part2_stone_hut", "pov_switch": "watson", "pov_switch_name": "Dr. John H. Watson"}]}, "holmes_ch11_part2_stone_hut": {"id": "holmes_ch11_part2_stone_hut", "title": "Chapter 11: The Man on the Tor (Part II: “A Lovely Evening, Watson!”)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "anchor", "anchor_name": "anchor_man_on_tor", "content": "The sunset was dying behind the western ridges of Dartmoor in a glory of blood-red and molten gold. A bitter, stinging frost was settling over the heather as I climbed the steep rock-chimney of Black Tor. My long walk from Coombe Tracey had left my limbs tired, but my spirit was soaring on wings of fire. Every piece of the puzzle had fallen into its appointed slot.\n\nAs I approached the low entrance of my stone hut, my nostrils caught a familiar, pungent whiff upon the evening breeze.\n\nI stopped dead upon the rock shelf.\n\nIt was the delicate, fragrant aroma of a Turkish cigarette—imprinted with the brand of “Bradley, Oxford Street.”\n\nI smiled in the darkness. There was only one man in the West of England who smoked Bradley’s cigarettes with that particular blend of Latakia and Virginia leaf.\n\n“Watson has found me,” I thought with a throb of genuine affection. “The old bulldog has run me to earth at last!”\n\nI stepped silently across the granite threshold. Inside, the shadows were thick as velvet. Across the earthen floor, on a flat slab of granite which served as my desk, lay my tin pannikin, a crust of bread, and a slip of paper scrawled in Cartwright’s hand: “Dr. Watson has gone to Coombe Tracey.”\n\nAnd from the deepest recess of the stone wall came the sharp, unmistakable metallic click of a cocked Adams revolver!\n\n“A lovely evening, my dear Watson!” I said quietly, leaning against the door lintel and striking a wax match.\n\nA cry of pure, bewildered stupefaction broke from the shadows. The match flared yellow, illuminating my hooked nose, my tweed cap, and my laughing eyes.\n\nThere, crouching behind a boulder with his service revolver leveled straight at my heart, sat Dr. John H. Watson!\n\n“Holmes!” he shouted, springing to his feet, his jaw dropping so low that his cigarette tumbled into the fern-bedding. “Holmes! Good God in heaven! Is it possible?”\n\n“Never more possible, my dear fellow,” I answered, stepping inside and extending my hand. “And never more welcome!”\n\nWatson seized my hand with a grip that nearly crushed my knuckles. For a moment, his honest, bronzed face was a battleground of conflicting emotions: first incredulous joy, then sharp, soldierly reproach, and finally an indignant flush of injured dignity.\n\n“You have been here all the time?” he stammered, pointing a trembling finger at my blankets and my tin plates. “You were the Man on the Tor whom I shot at under the full moon? You let me believe you were in London? You let me write all those long, laborious reports—”\n\n“Every line of which was of the most vital, supreme importance to me!” I interrupted warmly, clapping him on the shoulder. “Listen to me, Watson! You have every right to be angry, but before God, I tell you that my deception was the only weapon that could save Sir Henry’s life! If you had known I was here, your loyalty to me would have betrayed you. A glance, an altered tone of voice, a hesitation in your step—and Jack Stapleton would have known that Sherlock Holmes was upon the moor! The spider would have retreated into the depths of the bog, and we should never have caught him red-handed!”\n\nWatson looked into my eyes, and the anger melted from his honest countenance like mist before the sun.\n\n“You caught him?” he asked, his voice hushed with awe.\n\n“I have him in the palm of my hand!” I declared, seating myself beside him on the heather bedding. “Listen, Watson: Beryl Stapleton is not his sister—she is his wife! Laura Lyons was the decoy who lured Sir Charles to his doom! And Jack Stapleton is none other than the son of Rodger Baskerville—the rightful heir to the title and the £740,000 fortune!”\n\nWatson gasped, staring at me in the gloom of the ancient hut. And then, before he could utter another syllable...\n\nA sound broke across the dark moor that froze the marrow in our bones!", "is_ending": false, "clues": ["Returned to Black Tor to find Watson lying in ambush inside the stone hut with cocked revolver", "Greeted Watson with the iconic: “A lovely evening, my dear Watson!”", "Synthesized dossiers: Beryl’s true identity as Stapleton’s wife and the Laura Lyons trap"], "choices": [{"id": "h_ch11_p2_c1", "text": "Compare dossiers and reveal the master plot to Watson before tragedy strikes.", "target": "holmes_ch12_part1_revelations", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch11_p2_c2", "text": "[Switch POV to Jack Stapleton] Discover Stapleton preparing the fatal scent on the moor.", "target": "stapleton_ch11_part2_setting_scent", "pov_switch": "stapleton", "pov_switch_name": "Jack Stapleton"}]}, "holmes_ch12_part1_revelations": {"id": "holmes_ch12_part1_revelations", "title": "Chapter 12: Death on the Moor (Part I: The Cry on the Crags)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": "anchor_revelation", "content": "The cry that shattered the stillness of the Dartmoor night was unlike any sound I had ever heard in all my years in London. It was not a shout; it was a shriek of mortal agony, a long, bubbling scream of horror that rose into a shrill, piercing wail and then choked off in a terrible, suffocating gasp.\n\nWatson and I leaped to our feet as though an electric current had passed through our bodies.\n\n“What was that?” Watson gasped, his face as white as paper.\n\n“The hound!” I shouted, catching up my heavy cudgel and drawing my loaded revolver from my belt. “Great God, Watson, run! Run for your life!”\n\nWe scrambled through the low doorway of the stone hut, plunging headlong into the pitch-black night. A dense mist was rising from the bog, and the moon was obscured by driving clouds. We could see scarcely ten yards ahead of us among the jagged boulders of the plateau.\n\nAnd then the sound rose again.\n\nIt came from the high granite ridge to our left—a deep, booming, savage roar that seemed to tear the very air to ribbons. And beneath that monstrous baying, running through the darkness like the squeal of a tortured rabbit, came the frantic, panting gasps of a human being in flight!\n\n“He has overtaken him!” I yelled, leaping over a deep fissure in the rock. “This way, Watson! For God’s sake, faster!”\n\nWe bounded across the rough heather like madmen. The stones were slippery with ice, and twice I fell heavily upon my knees, bruising myself against the granite, only to scramble up and dash forward again. My heart was pounding against my ribs like a sledgehammer.\n\n“If Sir Henry has fallen,” I thought in a paroxysm of bitter self-reproach, “his blood is upon my head! I delayed; I calculated; I waited for complete legal proof—and while I spun my web, the monster has struck!”\n\nAhead of us rose the sheer granite precipice of Black Tor—a vertical wall of rock forty feet high, dropping sheer into a wild, boulder-strewn amphitheatre below.\n\nAs we reached the crest of the ridge, a final, blood-curdling yell of despair echoed up from the black gulf beneath our feet!\n\nIt was followed by the dull, sickening thud of a heavy body crashing against the rocks below—a sound of splintering bone and crushed flesh that turned my stomach sick. Then a long, low groan... and then, absolute, terrifying silence.\n\nThe baying of the hound had ceased. The moor was as still as a graveyard.\n\n“He is dead,” whispered Watson, leaning against a crag, his chest heaving as though his lungs would burst. “We are too late, Holmes. Too late!”\n\n“We must know the worst,” I said through my teeth. “Come, Watson. There is a path down the eastern gully.”\n\nWith our revolvers cocked in our hands, our thumbs resting upon the hammers, we picked our way down the steep rock chimney into the dark amphitheatre below.", "is_ending": false, "clues": ["Synthesized the complete criminal architecture of Stapleton’s conspiracy", "A blood-curdling human scream of agony echoes across the rocky crags", "The deep, booming roar of the enormous hound shatters the midnight silence"], "choices": [{"id": "h_ch12_p1_c1", "text": "Sprint blindly through the darkness towards the cries of agony and hound roars.", "target": "holmes_ch12_part2_selden_death", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch12_p1_c2", "text": "[Switch POV to Jack Stapleton] See Stapleton releasing the phosphorescent beast.", "target": "stapleton_ch12_part1_screams_on_crags", "pov_switch": "stapleton", "pov_switch_name": "Jack Stapleton"}]}, "holmes_ch12_part2_selden_death": {"id": "holmes_ch12_part2_selden_death", "title": "Chapter 12: Death on the Moor (Part II: The Fall of the Convict)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": null, "content": "At the base of the sheer granite precipice, wedged between two jagged slabs of fallen rock, lay a crumpled heap of dark clothing.\n\nWatson reached it first. He struck a wax match, shielding the tiny flame with his cupped hand.\n\nThe light flickered across a pair of sturdy limbs twisted at an unnatural angle, a broken neck, and a coat of distinctive, ruddy-tinted Canadian tweed.\n\n“Sir Henry!” Watson wailed, falling upon his knees, tears streaming down his face. “Oh, Holmes, it is Sir Henry! The noble, generous lad!”\n\nA wave of black nausea swept through my mind. I sank down upon the wet stones, burying my face in my hands. In that terrible moment, all my intellectual vanity, all my cold pride in my own methods, seemed shattered beyond redemption. I had trifled with a living demon; I had played chess with a human life; and I had lost!\n\n“Turn him over, Watson,” I whispered, my voice cracked and dry. “Let me look upon his face.”\n\nWatson took the prostrate figure by the shoulders and turned the head towards the matchlight.\n\nI struck a second match.\n\nThe light flared over the dead features. And in that instant, a cry of thunderous, ecstatic relief tore from my throat!\n\nIt was not Sir Henry Baskerville!\n\nThe face was broad, coarse, and brutal. The forehead was low and animal; the teeth were bared in a snarl of beast-like rage; and the matted black beard was caked with blood and mud!\n\n“Selden!” I shouted, laughing like a madman, seizing Watson by the shoulders and shaking him until his teeth rattled. “It is Selden, the convict! It is the Notting Hill murderer!”\n\nWatson stared at the corpse, his eyes round as saucers. “Selden? But how in heaven’s name comes he to be dressed in Sir Henry’s tweed suit?”\n\n“The clothes, Watson! The clothes!” I cried, tapping the tweed fabric with my fingers. “Don’t you remember Barrymore’s confession? Sir Henry gave his cast-off wardrobe to his butler, and Barrymore passed it to his starving brother-in-law on the moor! The stolen black boot! The scent! Stapleton gave the hound the scent of Sir Henry’s boots, loosed the monster upon the moor, and the beast ran down the tweed clothes, chasing this miserable wretch over the edge of the precipice!”\n\nAt that instant, a tiny yellow point of light appeared among the boulders two hundred yards to the east. A man was approaching through the rocks, carrying a swinging lantern.\n\n“Hist!” I hissed, pulling Watson down into the deep shadow of the cliff. “The master of the hounds comes to view his kill! Keep your revolver ready, but let me do the talking!”\n\nThe footsteps crunching over the gravel drew nearer. The light of the lantern fell across the corpse. Behind it stepped Jack Stapleton.\n\nHe was breathing heavily, his pale, ferret-face flushed with triumphant excitement. He held the lantern aloft, leaning over the dead body.\n\n“Sir Henry?” he whispered, gloating over the tweed suit. “Sir Henry Baskerville?”\n\n“No, Mr. Stapleton,” I said, stepping calmly out from the shadow of the rock into the yellow circle of his lantern. “It is not Sir Henry. It is an unfortunate convict who has broken his neck upon the stones.”\n\nThe lantern dropped two inches in Stapleton’s grasp.\n\nFor five seconds, the man stood as though struck by lightning. His jaw dropped; his eyes started from his head; the blood drained from his cheeks until he looked more dead than the corpse at his feet! His gaze flicked from my face to Watson’s, and in that instant, I saw the sheer, unadulterated terror of a trapped beast flare in his eyes.\n\n“Mr.... Mr. Sherlock Holmes!” he gasped, his voice cracking like a dry reed.\n\n“At your service, sir,” I answered with a courteous bow. “I arrived from London this afternoon, just in time to witness this tragic accident.”\n\nStapleton recovered his nerve with a speed that did credit to his villainy. He forced a sickly, trembling smile onto his lips. “A... an accident, of course! A dreadful misstep in the dark! We heard screams from Merripit House, and I feared that young Sir Henry might have come to harm.”\n\n“Sir Henry is dining at the Hall, perfectly safe,” said I smoothly. “Watson and I shall escort the body to the village morgue. Tomorrow morning, we must return to London to attend to pressing matters in Baker Street.”\n\nStapleton’s eyes gleamed with sudden, desperate hope. “You return to London tomorrow?”\n\n“By the ten o’clock train,” I replied without blinking an eye. “Our mission here is concluded.”\n\nThe murderer bowed, his lantern shaking as he turned back towards Merripit House.\n\nWhen his light had vanished into the fog, Watson turned to me, his brow furrowed in utter bewilderment. “Holmes! You told him we are leaving tomorrow? You are letting him go?”\n\n“I have given him twelve hours of false security, Watson,” I whispered, my teeth bared in a feral grin. “He believes Sir Henry will be left entirely alone on the moor tomorrow night! Tomorrow, the trap closes. But first—to Baskerville Hall! We have an ancestral portrait to inspect!”", "is_ending": false, "clues": ["Discovered body at base of cliff was dressed in Sir Henry’s distinctive ruddy tweed suit", "Turned corpse over: it was Selden the convict, who wore Sir Henry’s cast-off clothes given by Barrymore", "Hound followed the boot-scent on the clothing and drove the fugitive over the forty-foot precipice", "Stapleton emerged with a lantern expecting Sir Henry; Holmes bluffed, claiming to return to London tomorrow"], "choices": [{"id": "h_ch12_p2_c1", "text": "Inspect the ancestral portraits at Baskerville Hall to uncover the physical link.", "target": "holmes_ch13_portrait", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch12_p2_c2", "text": "[Switch POV to Jack Stapleton] Experience Stapleton’s horror upon seeing Holmes beside the corpse.", "target": "stapleton_ch12_part2_confronting_holmes", "pov_switch": "stapleton", "pov_switch_name": "Jack Stapleton"}]}, "holmes_ch13_portrait": {"id": "holmes_ch13_portrait", "title": "Chapter 13: Fixing the Nets (The Face of Hugo & The Fatal Dinner Invitation)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": "anchor_portrait", "content": "The great dining hall of Baskerville Hall was an imposing chamber paneled in blackened oak, beneath a high-raftered roof that echoed with the memories of three centuries. Above the dark wainscoting hung a long gallery of ancestral portraits—cavaliers in ruffs, roundheads in steel corselets, Georgian ladies with powdered coiffures, and judges in flowing scarlet robes.\n\nAfter dinner, when Sir Henry had withdrawn to the library, I took a tall silver candelabrum and strolled down the length of the portrait gallery, holding the light close to the ancient canvases.\n\nWatson followed behind, watching me with that curious, questioning expression which I know so well.\n\n“A fine collection of ancestors,” he remarked.\n\n“A most singular collection,” I replied, pausing before an oil painting dated 1647. It depicted a broad-shouldered gentleman with long, curled locks falling over a lace cravat, dressed in a black velvet doublet slashed with white silk. The face was pale, thin-lipped, cold, and arrogant.\n\n“Who is that?” asked Watson.\n\n“That, my dear fellow, is the cause of all our troubles. That is Hugo Baskerville—the author of the Hound.”\n\nWatson stepped closer, peering at the cracked varnish. “A wicked-looking fellow, undoubtedly, but not unlike the others.”\n\n“Watson,” said I, stepping back and holding the candle at arm’s length, “do you see nothing there? Look at the face. Do not look at the wide-brimmed plumed hat, nor the flowing Cavalier curls, nor the lace band. Look purely at the bone structure: the narrow, ferret jaw; the high cheekbones; the pale, cold, calculating eyes!”\n\nI stepped forward, raised my two hands, and placed them over the canvas, covering the broad hat and the flowing ringlets.\n\nWatson cried aloud in utter, thunderstruck astonishment.\n\n“Great heavens!” he gasped, clutching my arm. “It is Stapleton! It is the face of Jack Stapleton!”\n\n“Yes,” said I quietly. “The fellow is a Baskerville. That is the physical proof for which I have been seeking! He is the son of that younger brother, Rodger Baskerville, who fled to Central America after committing a crime and was believed to have died unmarried in Costa Rica. But Rodger left a son—this man Jack, who married the local beauty Beryl Garcia, stole a fortune in public funds, fled to England under the name of Vandeleur, established that failed school in Yorkshire, and finally tracked down his ancestral heritage here on the borders of Dartmoor!”\n\n“And his motive?”\n\n“The estate, Watson! The title and £740,000! With Sir Charles dead and Sir Henry murdered, this fellow, claiming the property through a distant branch in America, would walk into possession of the entire Baskerville fortune!”\n\nI turned away from the portrait, my eyes flashing with the cold fury of the hunter.\n\nThe next morning, our counter-trap was sprung with surgical precision.\n\nAt breakfast, I announced to Sir Henry that pressing duties in London compelled Watson and me to depart immediately. Sir Henry was crestfallen, but I laid down my instructions with iron authority:\n\n“You have accepted Mr. Stapleton’s invitation to dine at Merripit House tonight. You will go, Sir Henry. But mark this: you will send your carriage back. You will inform your host that you intend to walk home alone across the moor path at ten o’clock!”\n\n“Walk alone in the dark?” cried the baronet. “After what happened to Selden?”\n\n“You have placed your life in my hands, Sir Henry. Follow my instructions to the letter, and not a hair of your head shall be harmed.”\n\nAt nine o’clock that morning, Watson and I boarded the London train at Coombe Tracey station in full view of the stationmaster and several local villagers. But at the very next stop—the tiny country halt of High Barrow—we slipped out of our carriage, doubled back through the wooded valleys on foot, and met the fast express from London.\n\nAs the carriage doors opened, a dapper, wiry little gentleman in a tweed traveling suit and gaiters stepped onto the gravel platform, carrying a stout carpet-bag.\n\nIt was Inspector Lestrade of Scotland Yard!\n\n“You have the warrant, Lestrade?” I asked, clasping his hand.\n\n“Signed and sealed, Mr. Holmes,” the little detective grinned, patting his breast pocket. “Armed assault, attempted fraud, and murder. Where is our man?”\n\n“He is at Merripit House, preparing a dinner for his guest,” I answered grimly. “And tonight, Lestrade, you shall assist at the most singular banquet ever served in the county of Devon!”", "is_ending": false, "clues": ["Concealed the wig and clothing of the 1647 Hugo Baskerville portrait to reveal Jack Stapleton’s face", "Confirmed Stapleton is the legitimate son of Rodger Baskerville, claiming the direct succession", "Instructed Sir Henry to accept Stapleton’s dinner invitation and walk home alone across the moor", "Secretly met Inspector Lestrade at Coombe Tracey station with an arrest warrant"], "choices": [{"id": "h_ch13_c1", "text": "Deploy the Scotland Yard ambush in the rocks near Merripit House.", "target": "holmes_ch14_part1_fog_ambush", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch13_c2", "text": "[Switch POV to Jack Stapleton] Discover how Stapleton prepared the final trap.", "target": "stapleton_ch13_fatal_dinner", "pov_switch": "stapleton", "pov_switch_name": "Jack Stapleton"}]}, "holmes_ch14_part1_fog_ambush": {"id": "holmes_ch14_part1_fog_ambush", "title": "Chapter 14: The Hound of the Baskervilles (Part I: The Fire-Breathing Beast)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": "anchor_climax", "content": "The night was cold, raw, and bitterly damp.\n\nWe lay crouched behind a low ridge of granite boulders fifty yards from the lighted windows of Merripit House. Lestrade was shivering beside me, his teeth chattering in the moorland chill, clutching his service revolver beneath his tweed coat. Watson lay upon my right, his eyes glued to the lighted dining-room window.\n\nThrough the uncurtained glass, the interior of the cottage was plainly visible. Sir Henry sat at the table, leaning back in his chair with a coffee-cup in his hand, chatting amiably. Across from him sat Jack Stapleton, smiling, gesturing, playing the genial host. But of Beryl Stapleton there was no sign.\n\n“Where is the lady?” whispered Watson.\n\n“She refused to be an accomplice to murder,” I muttered through my clenched teeth. “The brute has locked her away.”\n\nAt that moment, my eyes caught a white, creeping menace moving across the lower hollows of the moor.\n\nFrom the Great Grimpen Mire, a dense, dense bank of white fog was rolling westward. It did not rise high into the air, but clung to the ground like a thick, impenetrable blanket of wool. It was creeping across the heather with terrifying speed, extinguishing the boulders, swallowing the sheep-paths, and advancing relentlessly towards the narrow strip of gravel path which Sir Henry must traverse on his journey home!\n\n“Look!” I whispered, gripping Watson’s arm. “The fog! It is our only enemy!”\n\n“It is creeping towards the path,” Watson muttered.\n\n“In fifteen minutes it will have enveloped the house! We shall not be able to see our hands before our faces! If he comes out after the fog covers the path, we shall be blind!”\n\nAt that instant, the door of Merripit House opened. A bright rectangle of yellow light spilled out onto the dark gravel.\n\nSir Henry stepped out upon the threshold.\n\nHe paused for a second, looking up at the sky, pulling his overcoat closely around his chin. Then he strode out briskly along the path, his boots crunching upon the gravel. He passed within thirty yards of our hiding-place, his silhouette sharp and dark against the white wall of the advancing fog. He had scarcely vanished into the mist when a terrible sound froze the breath in our throats.\n\nFrom the very heart of the rolling white fog bank came a patter—a swift, heavy, rhythmic pattering of paws upon the heather!\n\n“Look out!” I yelled, springing to my feet. “It is coming!”\n\nLestrade gave a shriek of sheer, unadulterated horror and hurled himself face downward upon the turf. Watson gasped, raising his revolver.\n\nOut from the dense wall of rolling white fog leaped a shape—a creature so appalling, so nightmarish, that for a fraction of a second my own thumb seemed paralyzed upon the hammer of my gun!\n\nIt was a hound of gigantic proportions—a monster coal-black as a mastiff, gaunt as a hound, with a head like an iron anvil. But it was not merely an enormous beast: from its gaping jaws burst a fire of smoldering, flickering flame! Its eyes glowed with dull, bluish embers; its muzzle, its lips, its jowls, and its arched hackles were outlined in a flickering, spectral light of hellish luminescence! Never in the delirium of fever had a mortal mind conceived anything more savage, more appalling, more demoniac than that dark form bounding through the fog!\n\nWith long, springy bounds, the glowing monster raced down the path straight towards the retreating form of Sir Henry!\n\nI broke the paralysis that gripped my limbs. I raised my revolver, took deliberate aim at the glowing flank, and fired! Watson fired in the same split second!\n\nA blood-curdling howl of agony broke from the beast. It had been hit! But it did not falter; with a furious snarl, it bounded through the heather and leaped straight upon the shoulders of Sir Henry Baskerville!\n\nThe young baronet went down beneath the weight of the monster with a cry of mortal terror, rolling upon the turf as the snapping, fiery jaws lunged for his throat!\n\nI did not think; I did not feel. I ran like a cheetah across the forty paces of broken rocks, leaping boulders, my revolver leveled in my outstretched hand. The beast had pinned Sir Henry to the earth, its dripping, glowing fangs inches from his jugular vein.\n\nI thrust the muzzle of my revolver straight against the monster’s ear and pulled the trigger five times in rapid, deafening succession!\n\nA torrent of black blood and smoking tissue erupted into the air. The giant beast gave one final, convulsive shudder, rolled off Sir Henry’s body, thrashed its massive legs against the heather, and lay still upon the moor!\n\nSir Henry lay upon the turf, his eyes rolled back, white as chalk, having fainted from sheer horror. Watson rushed to his side, tearing open his collar, while Lestrade stood trembling like an aspen leaf, staring at the steaming carcass.\n\nI dropped to one knee and touched the glowing muzzle with my naked fingertips. When I held my fingers up to my nose, there was no smell of burning flesh—only the cold, chemical odour of inorganic science.\n\n“Phosphorus,” I said, wiping my hand upon my handkerchief. “A special, odorless preparation of phosphorus that does not destroy the scent. The brute was a master of his craft.”\n\nWatson looked up from Sir Henry. “He is alive, Holmes! His heart is beating!”\n\n“Thank God!” I breathed. “And now—for Jack Stapleton!”", "is_ending": false, "clues": ["Lurked with Watson and Lestrade in the rocks 50 yards from Merripit House", "A dense, blinding white fog rolled in from Grimpen Mire, threatening to blind the ambush", "Sir Henry stepped onto the moor path; an enormous, glowing phosphorescent hound burst from the mist", "Fired five rapid revolver rounds, killing the beast as it bore Sir Henry to the earth"], "choices": [{"id": "h_ch14_p1_c1", "text": "Rescue the bound Beryl Stapleton and plunge into Grimpen Mire to pursue the murderer.", "target": "holmes_ch14_part2_mire_pursuit", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch14_p1_c2", "text": "[Switch POV to Jack Stapleton] See Stapleton’s panic as five gunshots ring out in the fog.", "target": "stapleton_ch14_part2_panic_flight", "pov_switch": "stapleton", "pov_switch_name": "Jack Stapleton"}]}, "holmes_ch14_part2_mire_pursuit": {"id": "holmes_ch14_part2_mire_pursuit", "title": "Chapter 14: The Hound of the Baskervilles (Part II: Sucked into Grimpen Mire)", "pov": "holmes", "pov_name": "Sherlock Holmes", "node_type": "branch", "anchor_name": "anchor_mire", "content": "Leaving Watson to attend to Sir Henry, Lestrade and I dashed forward across the lawn towards Merripit House. The front door was wide open, flapping in the wind. We burst into the hallway, our revolvers ready, our boots thudding against the flagstones.\n\nThe house was dark, silent, and deserted. On the dining table, the coffee-cups were half-empty; in the parlour, the hearth was dying.\n\n“Upstairs!” I shouted. “Follow me!”\n\nWe took the narrow wooden stairs three at a time. On the upper landing were three doors. Two stood open, revealing empty bedrooms. The third—at the rear of the house overlooking the great swamp—was locked and bolted with a heavy brass key from the outside.\n\nI threw back the bolt, turned the key, and flung the door open, holding my revolver before me.\n\nThe sight that met our eyes made the blood boil in my veins.\n\nTied securely to an upright wooden post that supported the roof rafters was Beryl Stapleton. Sheets and towels had been wrapped around her body and bound with heavy cord, so tightly that the fibers were cutting into her flesh. A woolen scarf was gagged across her mouth, leaving only her dark, terrified eyes visible. Across her neck and bare arms were red, angry wheals—the unmistakable marks of a horsewhip where her brutal husband had lashed her before locking her away!\n\nLestrade sprang forward with his pocket-knife, slicing through the cords, while I drew the gag from her lips.\n\nThe woman collapsed into my arms, weeping hysterical tears of pain and gratitude.\n\n“Is he safe?” she gasped, her voice broken and raspy. “Sir Henry—is he safe?”\n\n“He is safe, madam,” said I, supporting her to a chair. “And the hound is dead.”\n\nA shudder of relief passed through her bruised frame. “Thank God! Oh, thank God! The monster... he tied me here when I refused to help him lure Sir Henry into the fog! He whipped me... he swore he would return and take me across the sea once the fortune was his!”\n\n“Where is he now?” I demanded, kneeling beside her. “Where has he fled?”\n\n“To the mire!” she cried, pointing towards the window. “In the heart of the Great Grimpen Mire, upon a small island of dry peat, there are the ruins of an abandoned tin-mine. It was there that he kept the hound chained! He has a path marked with submerged willow stakes that only he can tread. If he reaches the island, he can hide there for weeks!”\n\nI turned to Lestrade. “Guard the lady, Lestrade. Watson and I will finish this.”\n\nAt the first grey glimmer of dawn, the fog began to lift from the bog. Watson and I stood upon the edge of that quivering, emerald sea of mud. Beryl Stapleton, leaning upon Lestrade’s arm, pointed out the starting-point of the hidden trail: a small cluster of dry rushes marked by a rusted iron stake.\n\nHolding long alder poles to test the mud before each step, Watson and I set out into the Great Grimpen Mire.\n\nIt was a journey across the threshold of hell. On either side of the narrow submerged path, the mud quivered like a living thing—black, viscous, bottomless. Every yard was fraught with mortal peril. The green slime rose and fell with a sickening, undulating rhythm, and the stench of decay was heavy in the morning air.\n\nFifty yards along the track, something dark caught my eye, half-submerged in a patch of green moss.\n\nI reached out with the hook of my pole and fished it from the mud.\n\nIt was a heavy black leather boot, stamped inside with the maker’s mark: “Meyers, Toronto.”\n\n“Sir Henry’s stolen black boot!” Watson ejaculated.\n\n“The boot that gave the hound his scent,” I said, tossing it to the dry path. “He dropped it in his panic as he fled.”\n\nWe pushed forward another quarter of a mile into the dead heart of the mire. And then, at the base of a jagged ridge of black peat, the submerged willow stakes abruptly ended.\n\nI stopped dead upon the shaking tussock. Before us stretched an unbroken expanse of oily, bubbling green slime, thirty yards wide, stretching towards the barren knoll where the stone ruins of the tin-mine stood.\n\nUpon the very edge of the mud lay an object.\n\nI leaned forward. It was Jack Stapleton’s green butterfly net, floating lightly upon the surface of the green moss. And beside it, sinking slowly into the black muck, was a single, frantic hand-print—the deep, gouged furrow where five human fingers had clawed desperately at the peat before being dragged down into the bottomless abyss!\n\nWatson stared in horror at the bubbles bursting upon the slime. “He missed the path!” he whispered. “In the fog... he took a false step!”\n\nI stood upon the trembling bog, leaning upon my pole, my eyes fixed upon that green, unbroken crust beneath which the body of the last evil Baskerville lay entombed in ten fathoms of liquid mud.\n\n“Somewhere down in the dark heart of the Great Grimpen Mire,” said I solemnly, removing my hat, “down in the foul slime where the wild ponies die, lies the cleverest and most cold-blooded scoundrel that our modern age has produced. The swamp has claimed its own, Watson. Justice has been done!”", "is_ending": false, "clues": ["Rescued Beryl Stapleton bound and gagged to an upright post in the locked upstairs bedroom", "Beryl revealed Stapleton fled into the Great Grimpen Mire to his secret tin-mine island refuge", "Discovered Sir Henry’s stolen black boot dropped along the submerged stake pathway in the mire", "Stapleton missed the submerged path in the blinding fog and was swallowed alive by the bottomless quagmire"], "choices": [{"id": "h_ch14_p2_c1", "text": "Ending: Holmes’s Master Deduction (Conclude in Baker Street with the complete retrospection).", "target": "ch15_holmes", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch14_p2_c2", "text": "Ending: Watson’s Heroic Chronicle (Celebrate Dr. Watson’s steadfast loyalty and bravery).", "target": "ch15_watson", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch14_p2_c3", "text": "Ending: The Complete Canonical Victory (Sir Henry restored, justice triumphantly served).", "target": "ch15_victory", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch14_p2_c4", "text": "Ending: The Dark Moor Tragedy (Contemplate the heavy toll exacted by the family curse).", "target": "ch15_tragedy", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch14_p2_c5", "text": "Ending: Sucked into the Mire (The grim retribution of the Great Grimpen Mire).", "target": "ch15_mire", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch14_p2_c6", "text": "Ending: The Old Bailey Trial (Lestrade’s court victory and the Exeter gallows).", "target": "ch15_arrest", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_ch01_part1_heritage": {"id": "stapleton_ch01_part1_heritage", "title": "Chapter 1: The Genesis of the Plot (Part I: The Blood of Rodger Baskerville)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "anchor", "anchor_name": "anchor_chapter1_stapleton", "content": "I sat in the dim stillness of my study at Merripit House, the dissecting needle steady between my forefinger and thumb as I pinned a rare specimen of the marsh fritillary to the drying cork. Through the narrow casement window, the vast, treeless wilderness of Dartmoor rolled away towards the jagged horizon, broken only by the sullen, grey granite ramparts of Belliver and Vixen Tors. To the dull clods of Devonshire—to the country squires, the illiterate peat-cutters, and the pompous parish surgeons—I was merely Jack Stapleton: a harmless, bespectacled schoolmaster turned entomologist, an eccentric recluse who spent his blameless days pursuing Lepidoptera with a green gauze net and pressing marsh orchids between sheets of blotting paper.\n\nFools! Blind, provincial dolts, incapable of seeing beyond the modest spectacles on my nose!\n\nIn my veins ran the fierce, turbulent blood of the Baskervilles, untamed and predatory. My father was Rodger Baskerville, the youngest of the three sons of the old Hall—the dark, reckless rover who had disgraced the family name, fled England under a cloud of debt, and sought his fortune in the turbulent republics of Central America. I was born in the humid heat of Costa Rica, christened with his name and endowed with all his ruthless audacity, wedded to an intellectual cunning he never possessed. When I returned to England with my exquisite Spanish-American wife, Beryl Garcia, I took the name of Vandeleur and established a boys’ boarding academy in the north of Yorkshire. For three seasons fortune seemed within my reach; but an outbreak of typhus swept through the dormitories, three boys perished in agony, the school collapsed in public scandal and bankruptcy, and I found myself an outcast in London, penniless and pursued by relentless creditors.\n\nIt was in the bitter squalor of that flight that a chance perusal of the London society gazettes changed the course of my life. My uncle, Sir Charles Baskerville, had returned from the South African diamond diggings, fabulously enriched, and had repurchased the ancestral manor at Dartmoor. Seven hundred and forty thousand pounds! A colossal fortune invested in gilt-edged consols and South African gold, with vast revenues accruing every month! And between that golden mountain and myself stood only two fragile lives: Sir Charles, an aging widower with an aneurysm of the aorta who lived in terror of his own shadow, and a distant nephew, Henry Baskerville, who was grubbing out a living on a Canadian farm!\n\nI realized instantly that my destiny had arrived. I abandoned the ruined name of Vandeleur, assumed that of Stapleton, and removed to Devonshire. I rented this lonely, whitewashed cottage upon the very brink of the Great Grimpen Mire, using our last sovereigns to furnish it. I coerced Beryl, under threats that froze the blood in her veins, to pass as my unmarried sister. A beautiful unmarried woman is a magnet, a weapon of infinite utility in a secluded countryside; a wife is merely a domestic impediment. \n\nAnd then, in the candlelit library of Baskerville Hall, under the guise of an admiring neighbour studying the family history, I discovered the weapon that Providence had forged for my hand: the yellowed, water-stained manuscript of 1742 detailing the legendary curse of Hugo Baskerville and the fiery hound that had torn his throat upon the moor!\n\nAn ancestral demon! A spectral hound that lived in the superstitious marrow of every tenant on the estate! What chemist, what assassin in history could devise an instrument of murder more flawless, more completely untraceable than an ancestral legend made flesh? Sir Charles possessed a heart that fluttered like a trapped bird at every sudden creak in the night. He would not require poison; he would not require a dagger. One glimpse of the ancestral nightmare bursting from the darkness of the yew trees would be enough to rupture his fragile heart and send him headlong to his grave!", "is_ending": false, "clues": ["Stapleton is born the son of Rodger Baskerville, the South American black sheep", "Past bankruptcy of his Yorkshire school forced the adoption of the name Stapleton", "Inheritance of the £740,000 Baskerville estate requires eliminating Charles and Henry"], "choices": [{"id": "s_ch1_p1_c1", "text": "Inspect the secret lair on the mire island and examine the beast.", "target": "stapleton_ch01_part2_beast", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch1_p1_c2", "text": "[Switch POV to Sherlock Holmes] See Holmes examining Mortimer’s walking stick.", "target": "holmes_ch01_part1_observation", "pov_switch": "holmes", "pov_switch_name": "Sherlock Holmes"}]}, "stapleton_ch01_part2_beast": {"id": "stapleton_ch01_part2_beast", "title": "Chapter 1: The Genesis of the Plot (Part II: The Monster in Grimpen Mire)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "I pulled on my high waterproof boots, picked up my heavy walking staff, and slipped quietly from the back scullery of Merripit House into the gathering gloom of twilight. The path into the Great Grimpen Mire was a secret known to no living soul save myself. To an untrained eye, the bog appeared an unbroken sea of bright emerald green, dotted with deceptive tussocks of flowering cotton-grass. Yet underneath that carpet of deceptive velvet lay ten square miles of bottomless, quivering slime, ready to engulf horse and rider in three breathless seconds. Over six grueling months of patient exploration, I had mapped a labyrinthine chain of sunken stepping-stones—ancient granite slabs and submerged peat-ladders dating from prehistoric tin-miners—that led across the morass to an isolated, granite-strewn knoll rising from the quagmire like the spine of a sleeping leviathan.\n\nUpon that knoll stood the crumbling stone huts and rotting timber sheds of an Elizabethan tin-working abandoned three centuries ago. No shepherd dared approach within a mile of the place; local superstition held it to be the dancing ground of boggarts and marsh demons. It was my impenetrable fortress, my secret laboratory of death.\n\nI reached the heavy wooden door of the old smelting house and unlocked the padlock with a brass key. The moment the hinges groaned, a low, resonant rumble vibrated through the timber walls—a sound so deep, so full of primordial menace, that it set the fillings in my jaw aching. In the pitch darkness within, a heavy iron chain rattled across the stone flags with a harsh, metallic rasp.\n\nI lit my storm lantern and stepped over the threshold.\n\nLooming against the stone wall was the creature that would win me my empire. It was an immense beast, coal-black as a raven, with the towering shoulder-height of a mastiff and the savage, sinewy endurance of a bloodhound. I had purchased it in London under an assumed name from Ross and Mangles, the notorious dealers in Fulham Road, who had bred it from their fiercest fighting stock. I had transported it south by circuitous railway routes in a padded crate labeled as botanical machinery, and had walked it out here across the tors on a moonless midnight so that no rustic eye had ever glimpsed its silhouette. It stood nearly thirty inches at the shoulder, with jaws that could snap the thigh bone of a heifer, eyes that burned with unslaked hunger, and muscles that rippled like wound steel cords beneath its glossy black coat.\n\nSetting my lantern on a stone ledge, I took from my leather satchel the dark glass jar containing my masterpiece of chemical invention. White phosphorus, painstakingly dissolved in a refined preparation of non-volatile bone oil and odorless glycerin. It was a formula that had cost me weeks of delicate laboratory trial. Ordinary phosphorus would scorch the flesh and deaden the animal’s olfactory nerves with its acrid fumes; my mixture was cold, odorless, and utterly harmless to the skin, yet in darkness it radiated a ghostly, bluish-green luminosity of terrifying intensity.\n\nThe brute growled, its black lips curling back to expose two-inch fangs wet with saliva. I knew how to master it. I spoke in that low, harsh, guttural tone to which I had accustomed it, tossing it a half-pound knuckle of beef from my bag. While it tore the meat with ravenous crunches, I dipped my cloth brush into the jar and began my work.\n\nWith broad, deliberate strokes, I painted the luminous paste across its massive muzzle, around the hollows of its bloodshot eyes, and along the bristling dewlaps of its chest and jowls. \n\nI stepped backward to the threshold, drew down the tin shade of my storm lantern, and shut off the light.\n\nA gasp of involuntary, shuddering awe escaped my own lips! Even though I had engineered the deception myself, the spectacle that confronted me in the sudden darkness struck a chill of primeval horror through my marrow! The beast stood completely transformed into a demon spawned from the nethermost pit of hell! Its mouth appeared to vomit forth licking sheets of cold blue and emerald flame; its sockets glowed like burning coals dug from the embers of the damned; its massive head and neck flickered with shimmering, unearthly phosphorescence, casting long, wavering shadows across the roof-beams!\n\nIt was Hugo Baskerville’s hound incarnate. No mortal heart afflicted with disease could endure the apparition of that blazing monster bounding from the night. The weapon was perfected; all that remained was to fashion the lure that would deliver my aging uncle into its jaws!", "is_ending": false, "clues": ["Giant mastiff-bloodhound cross purchased from Ross and Mangles in Fulham Road", "Hidden in abandoned tin mine island in the heart of Great Grimpen Mire", "Luminous chemical preparation: phosphorus dissolved in bone oil glow without scorching"], "choices": [{"id": "s_ch1_p2_c1", "text": "Entangle Laura Lyons into writing the appointment letter to lure Sir Charles.", "target": "stapleton_ch02_part1_laura_trap", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch1_p2_c2", "text": "Test the hound’s ferocity upon the bog island with fresh red meat.", "target": "stapleton_ch02_part1_laura_trap", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_ch02_part1_laura_trap": {"id": "stapleton_ch02_part1_laura_trap", "title": "Chapter 2: The Fall of Sir Charles (Part I: The Pawn of Coombe Tracey)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "anchor", "anchor_name": "anchor_laura_trap_stapleton", "content": "The instrument to lure Sir Charles into my trap lay ready to my hand in the neighbouring hamlet of Coombe Tracey: Mrs. Laura Lyons, the daughter of that litigious old lunatic Frankland of Lafter Hall. \n\nShe was a creature of pathetic, fragile vanity, possessed of a fading Spanish-type beauty and trapped in a web of desperate poverty. Her scoundrel husband, an artist named Lyons, had deserted her in London years before; her tyrannical father had cast her out without a shilling for daring to marry against his tyrannical decree; and she was now attempting to maintain a miserable, debt-ridden livelihood by typing legal briefs on an old Remington machine. Over several months, I had spun a web of insidious sympathy around her battered ego. I played the role of the chivalrous, intellectual protector. I listened to her grievances with sorrowful brown eyes, purchased paper for her office, and gradually fed her romantic imagination with promises of an idyllic future.\n\n“If only you were legally emancipated from this scoundrel Lyons,” I would whisper, sitting beside her small hearth and stroking her trembling fingers, “if only you possessed the funds to institute divorce proceedings in the High Court in London, you would find a haven in my arms. Beryl and I would welcome you as the honoured mistress of Merripit House.”\n\nThe sum required to clear her pressing local debts and pay the retainers of London solicitors was substantial—two thousand pounds. Where upon Dartmoor was such wealth to be found, coupled with a chivalrous disposition towards distressed gentlewomen? Nowhere save in the open pocket of Sir Charles Baskerville!\n\nOn the morning of May 4th, I called upon Laura at her cottage in Coombe Tracey. She was in a state bordering on hysterical collapse. A London creditor had that morning threatened her with legal attachment and the debtor’s prison at Exeter.\n\n“Sir Charles leaves for London tomorrow morning,” I told her, my voice urgent, grave, and compelling. “His valet has already packed his trunks. He goes to consult heart specialists, and his friends whisper that he may never return to Devonshire! If you write him a formal appeal through the post, he will refer you to his London solicitors, Messrs. Gautier and Brown, and you know how cold lawyers treat appeals for cash. You must see him yourself, face to face! You must touch his chivalry and extract his promise before the London train bears him away!”\n\n“He will never receive me in his library at night!” she gasped, twisting her handkerchief. “The servants—the scandal—”\n\n“Then meet him at the private wicker gate that opens from the yew alley onto the moor!” I urged, drawing a sheet of her own notepaper towards her. “It is completely private. No servant ever enters the gardens after nine o’clock. Sit here, Laura. Write what I dictate, word for word.”\n\nWith a trembling hand, weeping tears of mingled hope and humiliation, she dipped her pen and wrote down the fatal lines:\n\n“Please, please, as you are a gentleman, burn this letter, and be at the gate by ten o’clock.”\n\n“Sign it with your initials,” I said softly, standing behind her chair. “L. L. It will pique his memory without compromising your name if the paper should miscarry.”\n\nI took the envelope, sealed it myself, and had it posted directly to Baskerville Hall by the local carrier.\n\nAt five o’clock that very afternoon, I returned to Laura’s cottage. My face was set in an expression of wounded masculine pride, stern and sorrowful.\n\n“Laura,” I said, seizing both her wrists and looking down at her with fiery indignation, “I have reflected upon this interview, and my soul revolts! My honour as a gentleman cannot suffer the woman I intend to make my bride to beg money at a dark garden gate from an elderly libertine! I have this afternoon arranged a mortgage upon my own securities. I have secured the two thousand pounds from my bankers in Plymouth! You shall not go to Baskerville Hall tonight!”\n\nShe collapsed against my chest, sobbing in an agony of overwhelming gratitude, kissing my hands and calling me her savior, her noble knight!\n\nThe silly, blind dupe! She believed she had been rescued from humiliation. In reality, she had signed Sir Charles Baskerville’s death warrant, while leaving herself bound in a conspiracy of silence that would prevent her from ever daring to breathe a word of our appointment to the constabulary!", "is_ending": false, "clues": ["Stapleton promises marriage to Laura Lyons if she secures divorce funds from Sir Charles", "Dictates the desperate letter demanding a meeting at 10 PM at the yew alley gate"], "choices": [{"id": "s_ch2_p1_c1", "text": "Command Laura Lyons to stay away while you bring the hound to the yew alley.", "target": "stapleton_ch02_part2_yew_alley", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch2_p1_c2", "text": "Prepare the hound with the phosphorus paste as twilight falls upon the moor.", "target": "stapleton_ch02_part2_yew_alley", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_ch02_part2_yew_alley": {"id": "stapleton_ch02_part2_yew_alley", "title": "Chapter 2: The Fall of Sir Charles (Part II: Terror at the Wicker Gate)", "pov": "stapleton", "pov_name": "Jack Stapleton", "node_type": "branch", "anchor_name": null, "content": "The night of May 4th was suffocatingly damp and pitch-black, with heavy banks of rain-clouds blotting out every star. At a quarter past nine, I slipped out from the rear of Merripit House, leading my beast upon a double-braided hemp leash. Over its head, muzzle, and shoulders I had cast a heavy army blanket to shroud the terrifying gleam of its phosphorus coating. We walked through the black peat like two shadows, skirting the edge of the mire where the turf was springy and muffled our footfalls.\n\nBy twenty minutes to ten, I had reached the northern boundary of the Baskerville estate. Outside the dense, twelve-foot wall of trimmed yew trees that enclosed the famous alley, the moor stretched away in unbroken solitude. I took up my position behind a dense clump of gorse bushes, barely twenty paces from the low, wooden wicket-gate that opened through the hedge onto the open heath.\n\nThrough the black, interlacing twigs of the yews, I saw a tiny red spark ignite.\n\nSir Charles had arrived! He had stepped from the manor house, walked down the long, gravel alley, and unlocked the wicket-gate. He stood leaning over the top rail, looking out into the misty darkness of the moor, expecting to see the timid figure of Laura Lyons hurrying from the track. The red glow of his cigar brightened and dimmed rhythmically. Even at that distance, I could hear the nervous tapping of his shoe upon the gravel and the raspy, wheezing sound of his labored breathing.\n\nTen o’clock struck from the square granite tower of the church down at Widecombe. The sound rolled through the damp air, deep and mournful.\n\nThe old baronet was growing anxious. He opened the gate, took two paces out onto the turf, and then turned back to the hedge. He tapped his first cigar against the rail, scattering ash upon the ground, struck a second sulfur match, and lit a fresh Havana. Ten more agonizing minutes ticked away. The night chill was settling into his ruined chest; he began to cough, a dry, rattling cough that shook his stooping shoulders.\n\nHis hour had come.\n\nI pulled off the heavy woolen blanket. I held the beast by its stout brass collar, leaned my face against its burning temple, and whispered into its flattened ear. I pointed its glowing muzzle through the gorse straight towards the gap in the hedge where the old man stood.\n\n“Take him, boy!” I snarled in a savage undertone. “Go!”\n\nThe hound sprang forward with a low, earth-shaking roar!\n\nSir Charles heard the thunder of galloping paws and whirled round. What met his superstitious, terror-haunted gaze was the very incarnation of his family’s two-hundred-year-old nightmare: an enormous, black demon bounding through the darkness, its eyes smouldering like fiery pits, its jaws dripping with blue and emerald flames!\n\nA scream of unimaginable agony tore from the old man’s throat—a shriek that choked into a dry rattle before it was half spent. He did not even attempt to pull the wooden wicket shut behind him. He spun on his heels and fled down the yew alley towards the distant sanctuary of the Hall. But terror had paralyzed his limbs; he ran in a grotesque, stumbling frenzy, his toes digging into the gravel, his hands clutching frantically at his breast as the aneurysm ruptured beneath his ribs!\n\nAfter fifty yards of blind, stumbling flight, his heart burst. He plunged headlong onto the turf beside the path, his fingers clawing at the earth, his face contorted in a mask of terminal horror!\n\nI blew my high-pitched ultrasonic Galton whistle. The hound, trained to instant mechanical obedience by months of reward and punishment, skidded to a halt twenty yards short of the fallen body. It turned, bounded back across the wicket, and crouc
