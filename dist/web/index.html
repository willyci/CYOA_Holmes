斯台普吞的时候，卡特莱经常在监视着你，因此我的手就能抓住了所有的线索。\n\n“我已经告诉过你了，你的报告都能很快地送到我的手里，因为它们一到贝克街马上就被送到库姆·特雷西来了。那些报告对我有极大的帮助，特别是有关斯台普吞身世的碰巧是真实的那篇。我已能证明就是那个男人和那个女人了，并且总算准确地知道了我应当怎样去了解。那个逃犯和他与白瑞摩之间的关系确曾使案情相当复杂化起来，这一点已被你用很有效的办法澄清了，虽然我也通过自己的观察得到了同样的结论。\n\n“当你在沼地里发现了我的时候，我已把全部事实都弄清了，可是我还没有足以拿到陪审官面前去的罪证，甚至那晚斯台普吞企图谋杀亨利爵士，但结果却杀死了不幸的逃犯的事实都难以证明他有杀人罪。看样子除了当场捉他之外是别无他法了，而要这样做，咱们就得利用亨利爵士作为诱饵，使他处于单身行路和显然受不到任何保护的状况之下。咱们就这样做了，虽然使咱们的委托人受到了严重的惊吓，可是咱们终于凑全了罪证，并把斯台普吞驱向了毁灭。使亨利爵士暴身于危险之中，我承认，这只能说是我在处理此案过程之中的一大缺点，可是咱们无法预知，那畜生竟会显出那样可怕和骇人欲绝的样子，咱们也无法预知那使它能那么突然地向我们窜来的大雾的出现。咱们的任务的完成是付出了代价的，可是专家摩梯末医生向我保证说，这一代价的影响只是暂时的。一次长途旅行，不仅能够恢复咱们朋友深受打击的神经，并能医治他那心灵上的创伤，他对那位女士的爱情是深挚的。对他说来，在这件倒霉的事情里，最使人伤心的就是，他竟也受了她的骗。\n\n“现在剩下需要说明的就是她在此中所扮演的角色了。无疑地，她是受着斯台普吞的左右的。其原因也许是爱情，也许是恐惧，更可能是两样都有，因为这决不是两种不可以同时存在的感情。这种控制的力量，至少是绝对有效的，在他的命令之下，她同意了装作是他的妹妹，虽然在他想要使她直接参加谋杀的时候，也发现了他对她的控制力还是有限的。\n\n只要不把她的丈夫牵连进去，她就准备去警告亨利爵士，而且她也曾一再地确想这样做。看来斯台普吞似乎还有着嫉妒心，当他看到准男爵向女士求婚的时候，虽然这一点也是在他自己的计划之内，他还是忍不住要大发雷霆地出面干涉，这样一来就把他聪明地靠着强自抑制而掩盖起来的火暴性格暴露出来了。他用笼络感情的办法使亨利爵士经常到梅利琵宅邸来，以便早晚能获得他所期望的好机会，可是在事情危急的那一天，他太太突然和他对立起来。她已稍知那逃犯死亡的事，而且她也知道，亨利爵士来吃晚饭的那一傍晚，那只猎狗就关在外边的小屋里。她谴责了她丈夫预谋要干的罪行；他狂怒了，他第一次向她透露他已另有所爱。她那往日的柔顺突然变成了深深的仇恨，他看得出来，她会将他出卖的，因此他就把她捆了起来，以免她一得机会就去警告亨利爵士，无疑地，他是希望当全乡的人都把准男爵的死归之于他家的厄运的时候——他们当然会这样想——他就能争取他太太接受既成事实，并要她保守秘密了。在这个问题上，我想，无论如何他是打错算盘了，即使咱们不到那里去，他的命运也同样是注定了的。一个有着西班牙血统的女人是不会那么轻易地宽恕这样的侮辱的。我亲爱的华生，不参考摘记，我是无法更详细地给你叙述这一奇异的案件了。我不知道是否还剩下了什么重要的东西没有解释到。”\n\n“他是不能指望用他那只可怕的猎狗，象弄死老伯父那样地吓死亨利爵士的。”\n\n“那畜生很凶猛，而且只喂得半饱。它的外表即使没有把它所追踪的人吓死，至少也能使他丧失抵抗力。”\n\n“当然了。还剩下一个难题。如果斯台普吞继承了财产，他怎样来解释这样的事实呢：他——继承人——为什么一直更名改姓地隐居在离财产这么近的地方呢？他怎么能要求继承权而不引起别人的怀疑和要求进行调查呢？”\n\n“这是一个绝大的困难，想要让我去解决这个问题，恐怕你是要求过高了。过去和现在的事我都调查过了。可是一个人将来会怎么样，这倒是个很难回答的问题。斯台普吞太太曾经几次听到她丈夫谈论这个问题，有三条路可走：他也许要从南美洲要求继承这份财产，让当地的英国当局证明他的身份，这样可以根本不来英格兰就把财产弄到手；或者住在伦敦的短时期内采取隐蔽身份的办法；或者，还许找一个同谋，带着证明文件的证物，证明他的继承人的身份，可是对他收入的一部保留所有权。根据咱们对他的了解，他总是能设法解决这些困难的。啊，我亲爱的华生，咱们已经干了几个星期严肃认真的工作了，我想，咱们还是换换口味，今晚想些愉快的事吧。我在虞格诺戏院订了一个包厢。你听过德·雷兹凯［让·德·雷兹凯：波兰歌剧演唱家，１８５３年生于华沙。——译者注］演的歌剧吗？请你在半小时之内穿戴好，途中咱们还可以到玛齐尼饭店吃晚饭呢。”", "is_ending": true, "clues": ["大格林盆泥潭永远吞噬了罪大恶极的凶犯，绿色的泥浆之上，只留下了亨利爵士那只旧皮靴"], "choices": []}, "ch15_arrest": {"id": "ch15_arrest", "title": "第十五章 回顾（终局：老贝利法庭的最终审判）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "ending", "anchor_name": null, "content": "早晨的报纸散落在我们的桌案上，头版通栏大字刊登着老贝利法庭轰动全国的审判。在格林盆泥潭边缘被雷斯垂德与郡警天罗地网生擒的斯台普吞，在法庭上遭到了其夫人的当堂指证。“这是正义毫无瑕疵的胜利，华生，”福尔摩斯轻敲着《泰晤士报》微笑道，“埃克塞特监狱的绞刑架正等待着他，法律用事实证明，再狡黠的诡计也绝不可能逃脱恢恢法网。”\n\n那已经是十一月底了，一个阴冷多雾的夜晚，在贝克街的寓所里，福尔摩斯和我在起居室中坐在熊熊的炉火两旁。在我们到德文郡去经历了那场结局悲惨的案件之后，他已又办了两件最为重要的案子。在第一件案子里，他揭发了阿波乌上校的丑行，因为他与出名的“无匹俱乐部”纸牌舞弊案有关；而在第二件案子里，他保护了不幸的蒙特邦歇太太，使她免于身负谋害其丈夫前妻之女卡莱小姐的罪名——这个大家都还记得的年轻小姐，在那件事发生了六个月之后依然活着，而且还在纽约结了婚。我的朋友因为在一连串困难而又重要的案件里获得了成功，故而精神奕奕，因此我才能诱使他谈起了神秘的巴斯克维尔案的详情。我一直在耐心地等待着这个好机会，因为据我所知，他是不允许各案互相搅扰的，以免他那清晰的头脑由于回想过去的事而分散对目前工作的注意力。亨利爵士和摩梯末医生都在伦敦，正准备出发作一次长途旅行，以便恢复爵士那深受刺激的神经。就在那天下午，他们来拜访了我们，因此，很自然地谈起了这个问题。\n\n“事情的全部过程，”福尔摩斯说，“从自称为斯台普吞的那人的观点来看是简单明了的。虽然对咱们说来，一开始的时候无法得知他那些行动的动机，就连事实也只能知道一部分，因此就使得全部经过显得极为错综复杂了。我和斯台普吞太太已经谈过两次话了，这个案件现在已经完全搞清楚了，我不知道还会有什么不解之谜。在我那带有索引的案件统计表的Ｂ字栏里，你能找到几条有关这件事的摘记。”东西\n\n“也许你愿意根据记忆把全案的梗概谈一谈吧。”\n\n“我当然愿意谈一谈罗，虽然我不能保证全部事实都能记住，思想的高度集中很能淹没对于过去的记忆。一个正在处理案件的律师能够就本案的问题和一个专家进行辩论，可是经过一两个星期的法庭诉讼之后就又忘得精光了。因此，在我的脑子里，后来的案子不断地代替了以前各案的地位，而卡莱小姐的事也就模糊了我对巴斯克维尔庄园案案情的回忆。明天也许又要来了什么小问题了，同样也会代替了美丽的法国姑娘和臭名远扬的阿波乌两案的地位。可是关于猎狗这个案件，我倒愿意尽可能正确地把它告诉你们，如果我遗忘了什么的话，你们再加以补充。\n\n“我的调查毫无疑问地证实了，那巴斯克维尔家的画像并没有骗人，那个家伙确是巴斯克维尔家的人，他就是那个查尔兹爵士的弟弟罗杰·巴斯克维尔的儿子。罗杰曾带着极坏的名誉逃到南美洲去，传说他在那里没有结婚就死了。实际上，他结了婚，并且生了一个小孩。这个小家伙和父亲同名，他和一位哥斯达黎加的美人贝莉儿·迦洛茜娅结了婚，在一次偷取了大批公款之后，他就改名凡戴勒逃到英格兰来了。在这里，他又在约克郡的东部开办了一所小学。他所以想搞一下这种事业是因为他在归途中偶尔结识了一个患有肺病的教师，他想利用这人的能力作一番成功的事业。可是这位福瑞泽教师死了，弄得这学校由名誉不佳直到变得臭名远扬了。凡戴勒夫妇感觉最好还是改姓斯台普吞，于是他就带着剩下的财产，带着未来的计划和对昆虫学的爱好迁到英格兰南部去了。我由大英博物馆得知，他在这一门学问里还是个公认的权威呢，而且有一种飞蛾是由于他在约克郡居住时期首先发现的，所以也就永久以凡戴勒为名了。*\n\n“咱们现在谈到他的那一段生活，确实会使咱们感到极大的兴趣。那家伙显然是在经过调查之后发现了，只有两个人有碍于他获得庞大的财产。我相信，在去德文郡的时候，他的计划还很模糊，可是从他带着自己的太太而又使她以妹妹的身分出现这一点来看，显然他从一开始就是居心不良的。虽然他可能还没有确定整个阴谋的细节，可是显然他已想到将她用作钓饵了。他下定决心要把财产弄到手，为了达到这一目的，他不惜采用任何手段或是冒任何危险。他的第一步行动就是，首先把自己的家安置在邻近祖宅的地方，愈近愈好。\n\n第二步就是培养起与查尔兹·巴斯克维尔爵士和邻人们的友情来。\n\n“准男爵亲口告诉了他关于家族的猎狗的传说，因此也就为自己铺了一条死亡的道路。斯台普吞——我就还这样称呼他吧——知道了老头的心脏很衰弱，稍一惊吓就能致死，这些都是他从摩梯末医生那里知道的——他还听说，查尔兹爵士很迷信，并且十分相信那个可怕的传说。他那灵敏的头脑马上就想出了一个办法，既可置准男爵于死地，而且又几乎没有可能追究真正的凶手。\n\n“心里有了这个念头之后，他就费了相当的心机设法使其实现。一个普通的阴谋计划者，利用一只凶恶的猎狗也就满足了。可是他还采用了人工的方法使这动物变得象魔鬼一样的可怕，这就要算是他的机智和天才了。那狗是他从伦敦福莱姆街的贩狗商人罗斯和曼格斯那里买来的，是他们所有的货色之中最强壮、最凶恶的一只了。他坐北德文郡铁路的车把它带回家来，为了怕引起别人的注意，他牵着狗穿过沼地走了很长的路。他已经在捕捉昆虫的时候学会了怎样走进格林盆泥潭去，因此能给那只猎狗找到一处安全的藏身之所。他就把它关在那里，待机使用。\n\n“可是好机会不是很快就能来到的，夜间没法把那老绅士从家中引出来，好几次，斯台普吞带着他那猎狗埋伏在外面，可是毫无结果。就在这些次一无结果的跟踪追寻当中，他，或者不如说是他的同伙，被农民看到了，因此，那段魔狗的传说就又得到了新的证实。他曾希望过，他太太也许能将查尔兹引向毁灭，可是在这问题上，她竟表现出意想不到的不听话。她不肯把老绅士拖进情网，因为这样一来就可能把他交给了他的死敌，恐吓、甚至我连提都不愿提起的殴打，都没能动摇她的决心，她丝毫也不愿参预这件事，有一段时期，斯台普吞甚至到了一筹莫展的地步。\n\n“可是他在困难之中终于抓到了一个机会。由于查尔兹爵士对他已经产生了友情，就在帮助那可怜的女人劳拉·莱昂丝太太的那件事里请他负责掌管那一笔慈善金。由于他以单身汉的身分出现，所以他才能对她产生决定性的影响。他向她表示，如果她和丈夫离婚能获成功，他就和她结婚。可是他那计划突然面临了一个紧要关头，在摩梯末医生建议之下，查尔兹爵士正准备离庄园他去，他本人也假装同意这个意见，但他必须马上采取行动，否则他所要加害的人一远离，他就会弄得鞭长莫及了。因此他就迫使莱昂丝太太写了那封信，恳求老头在去伦敦之前的晚上和她见一次面，随后又用听来似乎很有道理的一套理由使她未去赴约，这样一来，他就得到了一个久候未得的好机会。\n\n“在傍晚的时候，他从库姆·特雷西坐车回来，有足够的时间弄回他的猎狗来，抹好发光涂料，再带着那畜生到栅门附近去，他知道，他一定能看到老绅士在那里等着。那狗受到了主人的怂使，跃过了栅门就向不幸的准男爵追了过去，他被追得一边喊叫一边顺着水松夹道飞奔下去。在那样阴暗的夹道里看到那只又大又黑、嘴眼都冒火的家伙在身后跳跃前进，确实是万分可怕，因此他就由于心脏病和恐惧过度的缘故在夹道的尽头倒地身亡了。那猎狗顺着多草的路边跑，而准男爵则在小路上跑，因此除了人的脚印之外看不到任何其他痕迹。那狗看到他躺下一动不动之后，也许走近前来，闻了一闻，可是发现他已死去之后就又转头离开了，就是在那时，它留下了摩梯末医生所看到的爪印。猎狗被叫了回去，并急忙地被赶回设在格林盆泥沼的狗窝去。这件神秘的事件使官厅感到莫名其妙，使乡下人大为吃惊，最后我们就接手调查了这件案子。\n\n“关于查尔兹·巴斯克维尔爵士的死就说到这里为止吧。\n\n你们能看得出来，这里面的手段用得狡猾之至，确实，几乎无法向真正的凶手提出控诉。他那唯一的同谋永远也不会泄露他的秘密，那古怪而难以想象的手法使得他那阴谋进行得更加顺利。与此案有关的两个女人，斯台普吞太太和劳拉·莱昂丝太太都对斯台普吞极为怀疑。斯台普吞太太知道他在暗算着老头儿，也知道有那只猎狗；莱昂丝太太对这两件事都不知道，可是她记得，暴死发生的时间正是并没有取消的约会的时间，而这个约会只有他知道，因此她也不无怀疑。但是，她俩都是在他的控制之下，而他对她们则一无所惧。全部阴谋的前一半是成功地实现了，可是剩下的还有更困难的呢。\n\n“可能斯台普吞并不知道在加拿大还有一个继承人。可是不管怎样，他很快就能从他的朋友摩梯末医生那里知道了。摩梯末医生后来就详细地告诉了他关于亨利·巴斯克维尔到来的消息。斯台普吞的第一个念头就是：也许根本就不用等这个来自加拿大的陌生青年到德文郡来，在伦敦就可以把他弄死。自从他太太拒绝帮他设阱陷害老头儿以后，他已不再信任他的妻子了，他甚至不敢使她长时间离开自己，因为他怕这样会失去左右她的力量，正因为如此，他才带着她一起到伦敦去。我发现他们住在克瑞文街的梅克司波柔私人旅馆里，我曾派人到那旅馆去搜集证据。在那里，他就把太太关在房间里，而他就装上假胡须，跟踪着摩梯末医生，先到贝克街，后去车站，还到过诺桑勃兰旅馆。他太太对他的阴谋计划多少知道一些，可是她对丈夫怕得厉害——一种由于遭受过残暴的虐待而产生的恐惧——因此她不敢写信去警告那个她知道正处在危险之中的人，因为如果那封信落入斯台普吞之手的话，她的性命就会发生危险了。最后，我们都已知道了，她采取了权宜之计，她用从报纸上剪下来的字凑成了那封信，用伪装的笔迹在信封上写了收信人的地址。那封信到了准男爵的手里，对他发出了第一次危险警告。\n\n“弄一件亨利爵士的衣物对斯台普吞说来是非常重要的，因为他一旦到了不得不用狗的时候，他就能有使狗闻味追踪的东西了，他马上以特有的机敏和大胆动起手来，我们可以肯定，旅馆的男女仆人一定都接受过不少的贿赂才来帮助他达到目的。可是碰巧，第一只弄到的皮鞋竟是新的，对他毫无用处，后来他就把它送还，并窃取了另一只——这件事对我们最有帮助了，因为他在我心里肯定地证实了和我们打交道的是一只真正的猎狗，因为没有别的假设能够解释，为什么要急于弄到一只旧鞋，而对一只新鞋竟这样不感兴趣。越是稀奇古怪的事情就越值得仔细地加以检查，那看来似乎会使全案复杂化的一点，如果给以适当的考虑，并加以科学的处理，往往却正是最能说明问题之处。\n\n“后来，第二天早晨，咱们的朋友又来拜访了咱们，他们一直都受着坐在马车里的斯台普吞的跟踪。从他对咱们的房子和我的面貌知道得那样清楚和他一般的行为来看，我感觉，斯台普吞的罪恶历史决非仅仅限于巴斯克维尔庄园案这一件事。据说在过去三年里，西部曾发生过四次大盗窃案，可是没有一件捉到了罪犯。最后一件是五月间在弗克斯吞场发生的，其特殊之处是：一个僮仆因为想要袭擒那带着面具的单身盗贼而被残酷地枪击致死。我相信斯台普吞就是这样地补充了他那日渐减少的财产，而且这些年来他一直就是个危险的亡命之徒。\n\n“那天早晨，当他成功地从我们手中逃掉并通过马车夫将我的姓名传达给我的时候，咱们已经领略了他的机智和大胆了。从那时起，他就知道我在伦敦已经接手办这件案子了，因此，他知道在那里再也得不到下手的机会了，他才回到了达特沼地，等待着准男爵的来临。”\n\n“等一下！”我说道，“无疑的，你已经如实地描述了事情的经过，可是有一点你还没有解释到。当主人在伦敦的时候，那只猎狗怎么办呢？”\n\n“我曾注意到这件事，而且无疑是重要的。毫无问题，斯台普吞有一个亲信，虽然看来还不象是斯台普吞已经把自己的计划都告诉了他而受着他的左右。在梅利琵宅邸中有一个老男仆，名叫安东尼，他和斯台普吞家的关系可以追溯到数年以前斯台普吞做小学校长的时期，因此他一定知道他的主人和女主人确是夫妇，这人已经从乡间逃跑不见了。‘安东尼’这个姓似乎在英格兰很不普通，而‘安托尼奥’这个姓在所有说西班牙话的国家和美洲说西班牙话的国家里同样也不普通。这个人，象斯台普吞太太一样，英文说得很好，可是带着奇怪的大舌头的味道。我曾亲眼看到这个老头经过斯台普吞所标出来的小路走过格林盆泥沼。因此，很可能是当他的主人不在的时候就由他来照顾猎狗。虽然他或许从来也不知道养这只畜生是作什么用的。\n\n“随后，斯台普吞夫妇就回到了德文郡。不久，亨利爵士和你就在那里跟上了他们。还要说一下我个人在那时的看法，也许你还能想得起来，当我检查那张上面贴着报纸铅印字的信的时候，我仔细地检查了纸里面的水印。在检查的时候，我把它拿在离眼睛只有几英寸的地方，感觉出有一种象是白迎春花的香味。香水一共有七十五种，一个犯罪学专家应当每种都能分辨得出来。根据我个人的经验，在不只一件案子里，全靠能迅速辨别出香水的种类才破的案。那股香味说明，案子里面牵涉到一位女士，当时在我心里已经开始想到了斯台普吞夫妇。我就是这样地在到西部乡下去之前肯定了那猎狗，并且猜出了罪犯。*\n\n“我玩的把戏就是监视斯台普吞。可是，显然，如果我是和你在一起的话，我就会干不成这件事了，因为那样一来，他就会大加小心了。因此，我就把大家——连你在内——全都欺骗了，当人家以为我还在伦敦的时候，我已秘密地到乡下来了。我所吃的苦，并不象你所想象得那样多，决不能让这些细微末节扰乱案件的调查工作。我大部分时间都呆在库姆·特雷西，只有当必须去接近犯罪现场的时候，我才去住在沼地上的小屋里。卡特莱和我一同来了，他假扮成农村小孩，对我的帮助太大了。靠着他，我才能弄到食物和干净衣服，在我监视着斯台普吞的时候，卡特莱经常在监视着你，因此我的手就能抓住了所有的线索。\n\n“我已经告诉过你了，你的报告都能很快地送到我的手里，因为它们一到贝克街马上就被送到库姆·特雷西来了。那些报告对我有极大的帮助，特别是有关斯台普吞身世的碰巧是真实的那篇。我已能证明就是那个男人和那个女人了，并且总算准确地知道了我应当怎样去了解。那个逃犯和他与白瑞摩之间的关系确曾使案情相当复杂化起来，这一点已被你用很有效的办法澄清了，虽然我也通过自己的观察得到了同样的结论。\n\n“当你在沼地里发现了我的时候，我已把全部事实都弄清了，可是我还没有足以拿到陪审官面前去的罪证，甚至那晚斯台普吞企图谋杀亨利爵士，但结果却杀死了不幸的逃犯的事实都难以证明他有杀人罪。看样子除了当场捉他之外是别无他法了，而要这样做，咱们就得利用亨利爵士作为诱饵，使他处于单身行路和显然受不到任何保护的状况之下。咱们就这样做了，虽然使咱们的委托人受到了严重的惊吓，可是咱们终于凑全了罪证，并把斯台普吞驱向了毁灭。使亨利爵士暴身于危险之中，我承认，这只能说是我在处理此案过程之中的一大缺点，可是咱们无法预知，那畜生竟会显出那样可怕和骇人欲绝的样子，咱们也无法预知那使它能那么突然地向我们窜来的大雾的出现。咱们的任务的完成是付出了代价的，可是专家摩梯末医生向我保证说，这一代价的影响只是暂时的。一次长途旅行，不仅能够恢复咱们朋友深受打击的神经，并能医治他那心灵上的创伤，他对那位女士的爱情是深挚的。对他说来，在这件倒霉的事情里，最使人伤心的就是，他竟也受了她的骗。\n\n“现在剩下需要说明的就是她在此中所扮演的角色了。无疑地，她是受着斯台普吞的左右的。其原因也许是爱情，也许是恐惧，更可能是两样都有，因为这决不是两种不可以同时存在的感情。这种控制的力量，至少是绝对有效的，在他的命令之下，她同意了装作是他的妹妹，虽然在他想要使她直接参加谋杀的时候，也发现了他对她的控制力还是有限的。\n\n只要不把她的丈夫牵连进去，她就准备去警告亨利爵士，而且她也曾一再地确想这样做。看来斯台普吞似乎还有着嫉妒心，当他看到准男爵向女士求婚的时候，虽然这一点也是在他自己的计划之内，他还是忍不住要大发雷霆地出面干涉，这样一来就把他聪明地靠着强自抑制而掩盖起来的火暴性格暴露出来了。他用笼络感情的办法使亨利爵士经常到梅利琵宅邸来，以便早晚能获得他所期望的好机会，可是在事情危急的那一天，他太太突然和他对立起来。她已稍知那逃犯死亡的事，而且她也知道，亨利爵士来吃晚饭的那一傍晚，那只猎狗就关在外边的小屋里。她谴责了她丈夫预谋要干的罪行；他狂怒了，他第一次向她透露他已另有所爱。她那往日的柔顺突然变成了深深的仇恨，他看得出来，她会将他出卖的，因此他就把她捆了起来，以免她一得机会就去警告亨利爵士，无疑地，他是希望当全乡的人都把准男爵的死归之于他家的厄运的时候——他们当然会这样想——他就能争取他太太接受既成事实，并要她保守秘密了。在这个问题上，我想，无论如何他是打错算盘了，即使咱们不到那里去，他的命运也同样是注定了的。一个有着西班牙血统的女人是不会那么轻易地宽恕这样的侮辱的。我亲爱的华生，不参考摘记，我是无法更详细地给你叙述这一奇异的案件了。我不知道是否还剩下了什么重要的东西没有解释到。”\n\n“他是不能指望用他那只可怕的猎狗，象弄死老伯父那样地吓死亨利爵士的。”\n\n“那畜生很凶猛，而且只喂得半饱。它的外表即使没有把它所追踪的人吓死，至少也能使他丧失抵抗力。”\n\n“当然了。还剩下一个难题。如果斯台普吞继承了财产，他怎样来解释这样的事实呢：他——继承人——为什么一直更名改姓地隐居在离财产这么近的地方呢？他怎么能要求继承权而不引起别人的怀疑和要求进行调查呢？”\n\n“这是一个绝大的困难，想要让我去解决这个问题，恐怕你是要求过高了。过去和现在的事我都调查过了。可是一个人将来会怎么样，这倒是个很难回答的问题。斯台普吞太太曾经几次听到她丈夫谈论这个问题，有三条路可走：他也许要从南美洲要求继承这份财产，让当地的英国当局证明他的身份，这样可以根本不来英格兰就把财产弄到手；或者住在伦敦的短时期内采取隐蔽身份的办法；或者，还许找一个同谋，带着证明文件的证物，证明他的继承人的身份，可是对他收入的一部保留所有权。根据咱们对他的了解，他总是能设法解决这些困难的。啊，我亲爱的华生，咱们已经干了几个星期严肃认真的工作了，我想，咱们还是换换口味，今晚想些愉快的事吧。我在虞格诺戏院订了一个包厢。你听过德·雷兹凯［让·德·雷兹凯：波兰歌剧演唱家，１８５３年生于华沙。——译者注］演的歌剧吗？请你在半小时之内穿戴好，途中咱们还可以到玛齐尼饭店吃晚饭呢。”", "is_ending": true, "clues": ["杰克·斯台普吞在黎明合围中束手就擒，在老贝利法庭由夫人出庭指证罪状，终伏国法判处绞刑"], "choices": []}, "holmes_ch01_part1_observation": {"id": "holmes_ch01_part1_observation", "title": "第一章 歇洛克·福尔摩斯先生（上：演绎的科学与手杖）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "anchor", "anchor_name": "anchor_chapter1_holmes", "content": "秋日的晨曦冲破贝克街上空泛着硫磺味的昏黄雾气，将几道狭长而惨白的斜射光斑投洒在我们起居室的波斯地毯上。我坐在早餐桌旁，背对着壁炉，懒散地陷在扶手椅深处，任由面前浓黑咖啡散发的微苦热汽在晨光中袅袅升腾。在那只擦拭得纤尘不染、泛着冷冽银光的镀银咖啡壶的凸面上，整个房间被压缩成一幅微缩而扭曲的全景图：高耸的书架、煤斗、以及伫立在熊皮地毯上、神情肃穆庄重的约翰·H·华生医生。\n\n在过去的整整十分钟里，华生一直翻来覆去地摆弄着昨夜那位神秘访客遗落在此的粗大手杖。我透过银壶的反光，暗自欣赏着他的一举一动。他的眉头紧锁成几道深刻的纵纹，眼神专注而严苛，时不时用手指关节敲击着坚硬的木质，又将镶嵌在杖头下方的银箍凑到光亮处细细端详，其审慎的模样宛如学者在破译一份湮没千年的希腊古卷。\n\n‘那么，华生，’我无需回头，只是用平静而柔和的语调开口道，‘对于这件器物，你究竟得出了什么高见？’\n\n华生浑身猛地一震，手中的手杖险些脱手滑落。‘看在上帝的份上，福尔摩斯，你怎么知道我在做什么？’他转过身，瞪大双眼难以置信地盯着我的后背，‘我敢发誓你后脑勺上一定长着一双眼睛！’\n\n‘眼睛倒是没有，但我面前恰好有一把反光极佳的纯银咖啡壶，’我轻笑一声，转过椅子正对着他，‘你总是能给我带来无穷的智力乐趣，华生。既然昨晚我们十分不巧地错过了那位来客，对其来意一无所知，那么这根偶然留下的纪念物就具有了第一流的重要性。来吧，让我听听你如何运用严密的观察法，依据这根手杖重构其主人的全貌。’\n\n华生挺直了胸膛，清了清嗓子，脸上浮现出那种他在诊所面对疑难病症时特有的庄严神情。‘我认为，’他努力模仿着我平日展示的推导程序，字斟句酌地说道，‘这位摩梯末医生是一位功成名就、备受尊敬的老牌医生，因为唯有德高望重之人，才能从相识之人手中获赠这样一份表达敬意的精美纪念品。’\n\n‘很好！’我鼓励地点了点头，‘精彩极了！’\n\n‘我还认为，他极有可能是一位在乡间行医的乡村医生，而且大部分出诊全凭步行。’\n\n‘何以见得？’\n\n‘因为这根手杖虽然选料考究，乃是一根上好的槟榔屿杂木，但它受到的磕碰和磨损实在太严重了，城里的体面医生绝不可能随身携带这样一根满是伤痕的手杖。你看，杖底那枚厚重的铁箍已经被粗糙的碎石路磨去了一半，这无可辩驳地证明他曾拄着它跋涉过极其漫长而艰险的泥泞道路。’\n\n‘丝丝入扣！’我赞许道，‘能注意到铁箍的磨损程度，这很见功力。’\n\n‘不仅如此，’华生受到赞许，面颊泛起兴奋的红晕，声音也洪亮了几分，‘还有银箍上的刻字：“谨以此赠杰姆士·摩梯末医士（M.R.C.S.），C.C.H.诸友人赠，一八八四年。”我推测，这个所谓的C.C.H.，必然是当地的某种乡村狩猎俱乐部——比如查林顿狩猎会（Charlington Hunt）或者剑桥郡狩猎会。摩梯末医生必定是在某次狩猎事故中为落马的乡绅提供了高超的外科急救，那些心怀感激的猎手们便集资赠送了他这根结实的杂木防身手杖。’\n\n我推开餐椅站起身，划燃一根硫磺火柴，点燃了清晨那斗辛辣刺鼻的黑烟丝。‘坦白讲，华生，你真让我刮目相看。在我发表的那些关于我个人微末成就的纪实文字中，你总是过分贬低自己的才能。你自己或许并非璀璨的发光体，但你却无可否认是一根绝佳的“光之导体”！世间有些人虽然自身不具备天才，却拥有一种激发他人灵感的不凡魔力。我必须承认，我亲爱的朋友，我欠你一份极大的情谊。’\n\n华生脸上洋溢着一种近乎孩童般的纯真自豪。看着他如此由衷的欣慰，我几乎不忍心去戳破这层美丽的假说；然而科学的法则严苛无情，绝不容许向温情妥协。我伸出手，从他手中取过手杖，横置在膝盖上，旋即从西装口袋中取出高倍放大镜，在清晨的充足光线下逐寸审视。\n\n‘确实很有意思，尽管依然属于初级范畴，’我用指尖划过木材的纹理，‘木头上铭刻的几处客观事实，足以构成半打确定无疑的演绎基石。然而，我亲爱的华生，我不得不遗憾地指出，你的绝大部分结论都南辕北辙了。’\n\n华生嘴角的微笑顿时凝固了，神情显得颇受打击。‘谬误？难道我遗漏了什么决定性的线索？’\n\n‘几乎遗漏了所有关乎本质的核心，’我一边用放大镜旋转着手杖，一边从容不迫地说道，‘请审视事实：获赠这根手杖的人，会是一位年迈德高望重的资深医士吗？绝无可能。C.C.H.绝非狩猎俱乐部；乡间猎手绝不会赠送一根平实的杂木手杖，更不会在刻字时大费周折地附上皇家外科学会会员（M.R.C.S.）这种学术头衔。请你把目光投向身后书架上的那本《英国医学名录》。C.C.H.是伦敦著名的查令十字医院（Charing Cross Hospital）！而在什么样的情况下，一个人会在离开一家伦敦顶尖教学医院时获赠纪念品？唯有完成实习轮转、即将离职的年轻住院外科或住院内科医生！铭文的年份是一八八四年——距今整整五年。因此，我们的来客绝非迟暮长者，而是一位未满三十岁的年轻医生，性格温和、缺乏野心、心不在焉，并且拥有一只他形影不离的心爱爱犬。’\n\n‘一只狗！’华生失声惊呼，满脸茫然，‘看在老天的份上，你到底从哪儿看出了一只狗？’\n\n我将放大镜的聚焦点稳稳落在手杖中段的一处浅凹上。‘看这里。横贯木质纤维的中段，留有一串极其鲜明的齿痕。犬齿刺破清漆留下的压痕清晰可辨。显然，这只狗经常叼着手杖的正中心平衡点，欢快地跟在主人身后小跑。再仔细测量上下颚咬合齿距：齿宽远超普通的㹴犬，却又明显逊色于粗壮的马士提夫獒犬。此外，注意看下排牙齿凹陷处深深卡着的一小簇极细的白色卷毛——毫无疑问，这是一只卷毛西班牙猎犬。’\n\n话音未落，楼下潮湿的石阶上骤然传来了一阵急促欢快的爪子扑腾声，紧接着，门厅的大铜铃发出了清脆而坚决的铮铮鸣响。我走到窗前，撩开蕾丝窗帘的一角，俯瞰着清晨薄雾弥漫的街道。\n\n‘看吧，华生，’我微笑着示意他凑过来看，‘那位当事人已经登门了：一位身材瘦长、身披粗花呢大衣的年轻绅士，而在他的脚边，正跟着那只气喘吁吁、吐着舌头的卷毛西班牙猎犬！’", "is_ending": false, "clues": ["摩梯末手杖磨损过半的铁箍印证了德文郡荒原碎石路的长期跋涉", "C.C.H. 1884铭文证实其为查令十字医院五年前离职的青年外科医士", "手杖齿痕精准测定为一只卷毛西班牙猎犬所留"], "choices": [{"id": "h_ch1_p1_c1", "text": "迎接杰姆士·摩梯末医生入座，请他陈述此番非同寻常的来访缘由。", "target": "holmes_ch01_part2_consultation", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch1_p1_c2", "text": "【视角切换：约翰·H·华生】以华生医生的同理心视角端详这位来客。", "target": "ch01_part2_mortimer", "pov_switch": "watson", "pov_switch_name": "约翰·H·华生医生"}]}, "holmes_ch01_part2_consultation": {"id": "holmes_ch01_part2_consultation", "title": "第一章 歇洛克·福尔摩斯先生（下：颅骨研究与1742年手稿）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": null, "content": "房门随着一阵沉稳的脚步声被推开。杰姆士·摩梯末医生是一位身材异乎寻常瘦高、面庞清癯的绅士。他生着一只鹰钩长鼻，鼻梁两侧镶嵌着一双敏锐而温和的灰色眼睛，在金丝边眼镜的镜片后闪烁着学者的睿智光芒。他的双排扣常礼服显得有些陈旧褪色，裤脚边也略有磨损，然而其举手投足间的儒雅风度，却彰显出其深厚的学识涵养。令我倍感莞尔的是，那只卷毛西班牙猎犬一溜烟窜进了屋里，直奔壁炉前的毛皮地毯，舒舒服服地蜷缩成一团，喉咙里发出一声惬意的呼噜声。\n\n‘昨晚离去时我十分惶恐，’访客欠身行了一个无可挑剔的旧式绅士礼，‘唯恐将我的手杖遗失在了贵处。对我而言，哪怕倾尽家财，我也绝不愿失去那根手杖。’\n\n‘我注意到那是一件赠礼，’我微笑道。\n\n‘是的，先生，是我大婚之际，查令十字医院的同仁们所赠。’\n\n‘哈！结婚的赠礼！’我意味深长地瞥了华生一眼，华生则报以苦涩而心悦诚服的无奈苦笑。‘于是您便退隐乡野了？’\n\n‘正是如此，福尔摩斯先生。婚后我便定居在德文郡荒原边缘的格林盆村，唯有在远离伦敦喧嚣的静谧荒野，我关于比较病理学与颅骨测量学的科学研究才能得以潜心进行。’摩梯末医生的目光忽然牢牢钉在我的前额上，眼神中迸发出未加掩饰的解剖学狂热：‘老天啊，先生！您的颅骨结构真是太令人叹为观止了！我万万没有想到，在如此显著的长头型骨骼特征下，竟然发育出如此坚实深邃的眶上嵴！福尔摩斯先生，在您这具尊贵的颅骨尚无法制成标本之前，哪怕只是能得到一份翻模石膏像，也足以成为全欧洲任何一座人类学博物馆的镇馆之宝！’\n\n华生目瞪口呆地听着这位年轻医生当面公然剖析我死后的头骨归宿，脸上写满了骇然。我却不由得哑然失笑。‘摩梯末医生，您在您的专业领域里显然是一位不折不扣的热狂者，恰如我在我的行当里一样。不过我想，您清晨造访寒舍，总不会仅仅是为了测量我的顶骨弧度吧？’\n\n‘不，先生，绝非如此！尽管能亲眼瞻仰您的头骨确实令我不虚此行。’摩梯末医生的神情骤然阴沉下来，眼中的狂热被一种深深的阴霾与恐惧所取代，‘我之所以冒昧前来求助于您，福尔摩斯先生，是因为我正面临着一个极其诡谲、黑暗、且彻底超出了常规人类认知经验的惊天谜团——一个唯有全欧洲第二高的权威专家才有可能破解的谜团。’\n\n我眉峰微挑，身子在扶手椅里微微挺直。‘哦？欧洲第二？那么敢问先生，在您心目中，谁有幸高居首位呢？’\n\n‘对于真正崇尚严密科学分类的实证学者而言，巴黎的阿道夫·贝蒂荣（Bertillon）先生始终享有不可动摇的桂冠。’摩梯末以一种令人无法反驳的坦率回答道。\n\n‘那您为何不干脆去巴黎向他请教？’我用一种冰冷而克制的礼貌反问道。\n\n‘贝蒂荣先生是一位登峰造极的人体测量学大师，福尔摩斯先生。然而，若论及在错综复杂的犯罪迷雾中权衡微妙的心理动机、洞察蛛丝马迹背后的因果锁链、并以惊人的直觉重构不可思议的真相，全欧洲无人能望您项背！而我今天呈现在您面前的，正是我的挚友与赞助人——查尔斯·巴斯克维尔爵士骇人听闻的暴卒惨案！’\n\n起居室内的空气仿佛在刹那间凝结了。方才关于颅骨与手杖的学术轻松气氛彻底消散在晨光中。三个月前，查尔斯·巴斯克维尔爵士在德文郡荒原庄园猝死的消息，曾在《泰晤士报》的讣告栏上占过短短三行的篇幅：一位年迈仁慈的慈善家，在自家庄园的花园散步道上突发心脏衰竭逝世。然而，摩梯末医生此刻眼底翻滚的惊骇，却分明预示着一个全然不同的恐怖深渊。\n\n摩梯末颤抖着手伸入西装内侧口袋，取出一个沉甸甸、纸页发黄的长方形封套。封套被平整地折叠着，外层系着一根褪色的暗绿色丝带。\n\n‘这份手稿，’摩梯末小心翼翼地将它放在我们餐桌的中央，声音发颤，‘是查尔斯·巴斯克维尔爵士在他悲惨辞世前三个月亲手托付给我的。这是巴斯克维尔家族世代相传的绝密祖训，定稿于西元一七四二年。它用颤抖的笔迹，详尽记载了那个自大叛乱时期以来，便如梦魇般死死缠绕着这个古老门阀的恐怖诅咒！’\n\n我倾身上前，任凭手中的石楠木烟斗熄灭在指间。‘您口中所言，不过是一段尘封的历史传说，摩梯末医生。我的侦查实践仅局限于当下的现实世界，以及活在这个世界上的血肉之躯。难道您是要我花费宝贵的时间，去缉拿一个十八世纪的亡魂吗？’\n\n‘我要您做的，福尔摩斯先生，’摩梯末的呼吸变得短促而沉重，声音压低得如同来自幽冥，‘是先听完这段古老可怖的血腥编年史，然后再亲眼过目那两行将查尔斯爵士活活逼入绝境的、温热未消的巨大脚印！’", "is_ending": false, "clues": ["摩梯末医生痴迷于比较解剖学与颅骨测量学，随身携带人体骨骼研究文献", "1742年巴斯克维尔家族泛黄手稿详述邪恶领主雨果招致地狱猎犬世袭诅咒的原委", "摩梯末直言在精准科学分类上福尔摩斯仅次于巴黎法医贝蒂荣，令名侦探深感被挑衅"], "choices": [{"id": "h_ch1_p2_c1", "text": "保持专注，倾听摩梯末医生逐字宣读这份来自1742年的古老黑暗手稿。", "target": "holmes_ch02_part1_legend", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch1_p2_c2", "text": "打断神话传说，要求摩梯末医生直接呈报关乎当下的最新现场物理物证。", "target": "holmes_ch02_part2_footprints", "pov_switch": null, "pov_switch_name": null}]}, "holmes_ch02_part1_legend": {"id": "holmes_ch02_part1_legend", "title": "第二章 巴斯克维尔的诅咒（上：雨果·巴斯克维尔的手稿）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": "anchor_curse", "content": "我将背脊深陷在皮沙发的软垫里，十指交叉搭在膝头，透过半合的眼睑静静凝视着摩梯末医生。窗外，被深秋浓雾浸润的伦敦街市喧嚣显得沉闷而遥远；起居室内，唯有那张脆化发黄的羊皮纸在医生指间摩挲出的沙沙声在空气中回荡。摩梯末以一种因本能战栗而发颤的肃穆低音，开始逐字宣读这份来自一七四二年的家族手稿：\n\n‘关于巴斯克维尔魔犬之起源，世间传闻甚多。然余既系雨果·巴斯克维尔之直系后裔，复从先父口中得闻其详，因笔之于书，以垂后世……’\n\n整篇文字洋溢着乔治一世时代那种古雅而庄重的修辞风范。手稿详尽记载了那位在清教徒大叛乱时期横行乡里的残暴骑士——雨果·巴斯克维尔。此人荒淫无度、目无王法，对庄园近邻一位朴实自耕农的妙龄女儿产生了狂热的邪念。求欢遭拒之后，在当年米迦勒节前夕，雨果纠集了五六名亡命恶徒，趁着夜色策马突袭自耕农的农庄，将那名惊恐万状的少女强行掳至巴斯克维尔庄园，锁在南侧塔楼的顶层偏房内，而雨果本人则与同伙在楼下的大厅里彻夜狂饮作乐。\n\n楼下传来的污言秽语与狂暴酒歌，令那名不幸的姑娘陷入了濒临崩溃的绝望。在极度恐惧的驱使下，她做出了连最勇敢的壮士也未必敢尝试的惊人之举：她爬出狭窄的窗棂，攀附着覆盖在庄园外墙上粗壮如缆绳的老常春藤藤蔓，顺着石壁滑落至地面，旋即义无反顾地冲入德文郡荒原漆黑死寂的旷野，企图奔向九英里外父亲的农庄。\n\n当雨果在醉眼朦胧中发现人去房空时，他爆发出的狂怒令在场最凶悍的亡命徒也为之胆寒。他一跃跳上面前杯盘狼藉的长条橡木餐桌，当着天地与魔鬼的面发下了恶毒的誓言：只要今夜能让他追上并凌辱那个逃跑的贱人，他愿在此时此刻将自己的肉体与灵魂悉数出卖给地狱的撒旦！他狂呼着冲进庭院，放出豢养的恶犬，将少女遗落的方巾塞到猎犬鼻尖前，旋即翻身跃上他的黑鬃烈马，如狂风般疾驰冲入月色惨淡的荒原。\n\n残存的同伙被雨果近乎中邪的癫狂所震慑，酒意登时清醒了大半。他们纷纷跨上马鞍，循着蹄声策马疾追。在大片荒凉起伏的花岗岩与石楠丛中狂奔了数英里后，他们遇到了一位在风中瑟瑟发抖的守夜老牧羊人。老人面无人色、牙齿打战地指向荒原深处一道名为‘黑沟壑’的巨大花岗岩裂谷，颤抖着发誓说：他确实看见雨果骑着黑马呼啸而过，但在那匹马身后不远处，赫然紧跟着一只‘上帝绝未创造过的恐怖巨犬’，正悄无声息地贴地狂奔，紧咬着雨果的马蹄印不放！\n\n追兵们策马冲到了裂谷边缘。那匹黑马正浑身冒汗、瘫软在岩石旁剧烈抽搐，双眼翻白地盯着裂谷下方的黑暗。半数猎犬蜷缩在悬崖边缘呜咽哀鸣，其余的则夹着尾巴没命地逃窜进沼地的荒草丛中。\n\n三名胆量最大的骑士拔出佩剑，战战兢兢地策马下到裂谷底部的圆形空地上。眼前的一幕令他们肝胆俱裂：在那片惨白月光照耀的泥沼旁，倒卧着那位可怜少女的尸身，她已被过度惊吓与长途奔命活活夺去了呼吸。而在她身旁……\n\n摩梯末医生的喉咙里发出了一阵干涩而尖利的破音：\n\n‘……只见一只通体漆黑、体形硕大如小牛犊般的恶兽，正赫然骑跨在倒地的雨果·巴斯克维尔身上，疯狂撕咬着他的咽喉！那绝非凡间任何猎犬所能比拟的怪物，它的双目喷吐着幽绿的火焰，滴血的下颚在月光下闪烁着惨白的光芒！就在那三名骑士魂飞魄散的注视下，那恶兽猛地扯碎了雨果的喉管，转过那张淌着血水的可怖面孔，将两道地狱般的目光直刺向他们！那三人发出绝望的凄厉尖叫，发疯般勒马狂奔逃命。其中一人在当夜便因惊骇过度暴毙而亡，另外两人则彻底沦为神志不清、终日胡话连篇的疯子，直至残生终了。’\n\n摩梯末医生停止了宣读。他用冰冷颤抖的手将羊皮纸重新折叠，摘下金丝眼镜，隔着镜片望向我，面颊惨白如纸。\n\n‘这就是那个古老的传说，福尔摩斯先生，’他的嗓音沙哑微弱，‘手稿在末尾严厉告诫巴斯克维尔家族的历代子孙：无论何时，切不可在黑夜猖獗、邪灵得势的时辰孤身踏入德文郡荒原。’\n\n我端起微凉的咖啡轻轻抿了一口，掩饰住一个微不可察的呵欠。‘一段极其生动且充斥着十七世纪通俗剧色彩的传奇故事，’我语气淡漠地评述道，‘拿来在冬夜壁炉旁吓唬不听话的孩童倒是不错的素材。然而，摩梯末医生，您总不会天真地认为，这样一份充斥着哥特式迷信色彩的陈年旧稿，会对十九世纪现代严谨的刑事法医学侦查具有任何实际指导价值吧？’\n\n‘福尔摩斯先生！’摩梯末枯瘦的手掌死死扣住扶手椅的硬木边缘，指节因用力而泛白，‘我之所以必须先读这份手稿，是因为它正是查尔斯·巴斯克维尔爵士生前最大的恐惧源头！他用整个灵魂坚信着这份诅咒的每一个字！而就在三个月前那个漆黑如墨的夏夜，查尔斯爵士在水松夹道尽头轰然倒毙——他死前面容扭曲所呈现出的极致惊恐，凡是亲眼目睹过的人，这一生都绝不可能将其从梦魇中抹去！’", "is_ending": false, "clues": ["1742年手稿详述雨果·巴斯克维尔在清教徒战争期间背弃神明、纵犬追猎农家少女的罪孽", "在荒原深处的花岗岩沟壑中，一只喷吐磷光的地狱巨犬在月夜撕裂了雨果的颈动脉", "手稿立下严厉祖训：后世子嗣万不可在黑夜与邪恶猖獗之时孤身涉足德文郡荒原"], "choices": [{"id": "h_ch2_p1_c1", "text": "严厉质询摩梯末医生，探明查尔斯爵士近期暴卒现场的客观物理真相。", "target": "holmes_ch02_part2_footprints", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch2_p1_c2", "text": "【视角切换：杰克·斯台普吞】窥探这位幕后主凶如何将古老传说铸为杀人利器。", "target": "stapleton_ch02_part1_laura_trap", "pov_switch": "stapleton", "pov_switch_name": "杰克·斯台普吞"}]}, "holmes_ch02_part2_footprints": {"id": "holmes_ch02_part2_footprints", "title": "第二章 巴斯克维尔的诅咒（下：巨大猎犬的足迹）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": null, "content": "我将微凉的咖啡杯轻轻放回托盘，自摩梯末跨入寒舍以来，我的大脑第一次全神贯注地锁定了这个案子。古老的鬼怪传说不过是浪漫主义的浮云泡沫，然而，一位现代绅士在自家庄园的花园散步道上被活活吓死——这才是坚实确凿、值得严密推敲的刑侦实证！\n\n‘请把全部客观事实原原本本地讲给我听，摩梯末医生，’我身子前倾，目光如两道利刃般直刺他的面庞，‘切勿遗漏任何细节。据我所知，当地验尸法庭给出的官方裁决是自然死亡，不是吗？’\n\n‘正是如此，福尔摩斯先生。’摩梯末深吸了一口气，语调紧绷，‘郡验尸官认定，查尔斯爵士生前长期罹患严重的神经衰弱与器质性心脏功能退化。他在当晚如往常一样，在庄园那条著名的水松夹道散步时，突发急性心脏衰竭倒毙。法医的尸检报告明确排除了任何外力暴力的痕迹。’\n\n‘那么您亲自勘验现场的结论呢？’\n\n‘在尸体被仆人发现后不到一个小时，我便赶到了现场，’摩梯末的声音压得极低，甚至因极度克制而微微颤抖，‘当地的警察与法医只看到了那些浮于表面的平庸现象。他们注意到通往荒原的外侧小木门虚掩着；他们看到查尔斯爵士趴倒在距离木门五十码开外的碎石路上，面部朝下紧贴着泥土。然而，他们全都没有看到我所看到的东西，福尔摩斯先生，因为他们根本不懂得该如何观察！’\n\n‘告诉我，你看到了什么？’\n\n‘巴斯克维尔庄园的水松夹道，’摩梯末伸出修长如枯骨般的手指在空中比划着，‘是由两排高逾十二英尺、树龄数百年的古老水松树构成的双列绿色林荫隧道，密不透风地横亘在庄园东侧边缘。在树篱之外，便是无边无际的荒原。在夹道的中段，有一扇简陋的栅门，推开便可直接步入石楠丛生的荒野。请注意：查尔斯爵士是从主宅沿着夹道一直信步走到这扇木门前的。他在那里驻足停留了相当长的时间——据我精确测算，至少有五到十分钟，因为他手中的高档雪茄烟灰在碎石地面上完整脱落了两次！’\n\n‘精彩绝伦！’我忍不住脱口赞叹，‘华生，这位医生简直是与你志同道合的楷模！他居然注意到了烟灰！’\n\n摩梯末微微欠身致意，继续说道：‘查尔斯爵士当时双臂搭在木门上，面朝漆黑的荒原驻足远眺。然而就在那一瞬间——某种恐怖绝伦的事态骤然爆发了！某种足以摧毁人类理智的恐怖存在骤然降临，迫使他猛然转身，发疯般沿着夹道朝主宅方向亡命飞奔！然而，他的奔跑姿态却与常人完全不同！’\n\n‘足迹呈现出怎样的形态？’\n\n‘他是踮着脚尖狂奔的！’摩梯末以气声嘶哑地耳语道，‘他的脚印完全变了形状！原本深陷的脚后跟压痕彻底消失了！他就这样像中邪的幽灵一般，仅凭前脚掌和脚趾在狭长的阴森甬道中拼命蹬地狂奔，步幅因极度的惊恐而拉得大得惊人，直到那颗早已不堪重负的病弱心脏在狂暴的跳动中彻底爆裂，他整个人重重地栽倒在草皮边缘，手指深深抠入了泥泞的草根之中！’\n\n我霍然从扶手椅上站起，在起居室的地毯上迅疾地来回踱步。一股真正属于高智商犯罪的气味在空气中弥漫开来，令我体内的每一个神经元都战栗起来。‘你说他是背对着那扇栅门狂奔？也就是朝向宅邸的方向逃命？’\n\n‘正是朝向主宅的方向。’\n\n‘而在木门之外，究竟有什么？’\n\n‘是达特荒原，福尔摩斯先生。无边无际、吞噬一切的石楠泥沼与花岗岩死寂旷野。’\n\n‘那么现在，摩梯末医生——请道出最核心的事实。你为何断定验尸官隐瞒了真相？’\n\n这位年轻的医生不安地瞥了华生一眼，随后将目光重新死死锁定在我身上。他艰难地咽了一口唾沫，声音低沉得宛如来自坟墓：\n\n‘福尔摩斯先生，验尸官在法庭上曾当面质问我，尸体周围的碎石路上是否有任何搏斗或外力留下的痕迹。我如实回答没有。然而，他却根本没有询问我，在远离步道两旁那片湿软的泥炭藓沼泽里，究竟留下了什么！’\n\n‘那里留下了什么？’\n\n‘我沿着查尔斯爵士倒毙的地点朝外走出了二十码，在靠近一片潮湿低洼的黑泥苔藓边缘，清晰、深刻、毫无瑕疵地印着一串痕迹！’\n\n‘是脚印？’\n\n‘是的，脚印。’\n\n‘是男人的皮鞋，还是女人的便鞋？’\n\n摩梯末医生死死盯着我们二人，从齿缝中挤出了一句令整座房间瞬间坠入冰窟的话语：\n\n‘福尔摩斯先生……那是一只体形巨硕无朋的凶兽爪印！’\n\n我的脚步在瞬间骤停。‘你亲眼所见？’\n\n‘正如我此刻亲眼看见您一样千真万确。’\n\n‘足迹是新鲜的？’\n\n‘当夜一直飘着细密的冷雨；爪印边缘的泥土锐利湿润，绝对是当夜所留。那毫无疑问是一只骨架庞大如小牛犊般的恶犬留下的抓痕——德文郡荒原上的任何猎场看守，都绝不可能培育出如此硕大的怪物！’\n\n‘那只恶犬靠近过尸体吗？’\n\n‘没有。爪印只是在距离木门二十码外的湿地处徘徊打转，随后便调转方向，径直奔回了大格林盆泥潭深处！’\n\n我用拇指重重摩挲着下颚，体内沉寂多日的血液开始狂野地奔流。‘这水很深啊，华生，’我低声自语，‘这是一池深不可测且杀机四伏的险水！那么，摩梯末医生，你今天不远千里赶来伦敦向我求助，究竟有何诉求？’\n\n‘明天上午，福尔摩斯先生，’摩梯末颤抖着说道，‘查尔斯爵士唯一的直系血亲、他二弟的儿子亨利·巴斯克维尔爵士，便将从加拿大乘船抵达滑铁卢车站，正式继承这一爵位以及高达七十四万英镑的巨额遗产！他是巴斯克维尔家族最后的骨血。看在上帝的份上，我究竟该拿他怎么办？我能放任他踏入那片被诅咒的荒原吗？！’", "is_ending": false, "clues": ["查尔斯爵士曾在水松夹道栅门前驻足停留5至10分钟，雪茄烟灰在地面散落两次", "足迹在栅门处发生突变：由原本从容的平脚着地变为极度惊恐下的踮脚狂奔", "在距离尸体二十码开外的湿软泥土中，赫然印有一串巨硕无朋的凶兽爪印"], "choices": [{"id": "h_ch2_p2_c1", "text": "构建初步案件假说，闭门推演荒原地理，准备迎接入境的亨利爵士。", "target": "holmes_ch03_problem", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch2_p2_c2", "text": "【视角切换：杰克·斯台普吞】检视这位致命元凶如何精心布局那场午夜绝命会面。", "target": "stapleton_ch02_part2_yew_alley", "pov_switch": "stapleton", "pov_switch_name": "杰克·斯台普吞"}]}, "holmes_ch03_problem": {"id": "holmes_ch03_problem", "title": "第三章 疑案（烟雾缭绕中的沉思与荒原地图）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": "anchor_london_mission", "content": "当摩梯末医生带着那只气喘吁吁的西班牙猎犬离开后，楼梯间回荡的沉重脚步声逐渐隐没在街头的车马声中。起居室内的静谧显得愈发幽深，仿佛空气中凭空增添了那桩诡谲凶案带来的沉重压迫感。\n\n‘那么，华生，’我转过身来，‘对此你作何感想？’\n\n‘在我看来，’华生神情极其严肃地回答道，‘如果摩梯末医生的直觉并非空穴来风，如果这背后真有某种超自然的力量在作祟……’\n\n‘哈！超自然！’我挥手打断了他，严厉地摇了摇头，‘迄今为止，我们的刑侦业务始终立足于这颗坚实的人类行星之上，华生！诉诸超自然，是对人类理智破产的怯懦自白！如果真有一只现实中的恶犬能在德文郡潮湿的泥炭地上留下深达数寸的清晰爪印，那么这只恶犬就必然长着利齿与爪牙，有着沉甸甸的肉体骨骼，每天必须吞食数磅屠户供应的碎肉，而且——它也绝不可能抵挡得住一发从阿达姆斯转轮手枪里射出的正义铅弹！’\n\n我在地毯上霍然转身，径直走到书桌前。‘出去走走吧，华生。今天外面的天气还不算太糟。去你的俱乐部坐坐，或者去摄政公园散散步。但在黄昏降临之前，请把这间屋子和我脑中的思绪彻底留给我一个人。摆在我们面前的这桩谜案，若不将地基彻底夯实清理，绝无可能窥破其全貌。’\n\n当华生带着一丝关切而无奈的神情轻轻带上房门后，我迅速脱下紧绷的常礼服外套，换上了那件磨损严重的鼠灰色旧晨袍。我从壁炉架上取下那只被焦油熏得漆黑的陶土短烟斗，又从挂在墙角的波斯拖鞋鞋尖里掏出一大把辛辣浓烈、足以呛死常人的黑板烟丝。紧接着，我从书架最底层的角落里抽出了一张巨大的、背衬粗麻布的军械调查局高精度达特荒原军事地形图——其测绘比例尺达到了惊人的每英里六英寸——并用图钉将它牢牢固定在我们宽大的橡木餐桌中央。\n\n在接下来的整整八个小时里，我未曾离开过那把硬木高背椅半步。一团泛着蓝黑色的辛辣烟云在天花板下逐渐积聚、翻滚、凝结成一道道沉重的烟瘴，直到黄昏时分街灯亮起时，起居室内的煤气壁灯宛如深海迷雾中两盏昏黄摇曳的渔火。\n\n我的指尖与目光，不知疲倦地划过那张地图上的每一条等高线、每一处遍布嶙峋乱石的花岗岩荒坡、以及那片被德文郡人视作死亡禁区的蛮荒死沼。那里赫然标注着巴斯克维尔庄园——那座被高大水松夹道严密环绕的都铎时代坚固城堡；往南三英里处，则是伫立在黑色岩岗顶峰、由史前凯尔特蛮族留下的古老环形石屋遗迹；而在庄园东侧，宛如大地上一道溃烂脓疮般蔓延数英里的，正是那片恶名昭彰的大格林盆泥潭——无数看似娇艳翠绿的水生苔藓下方，隐藏着能在一瞬间将健壮公牛与误入野马活活吞噬的万丈泥渊！而在那座死亡泥潭西侧边缘的孤绝孤岛上，孤零零地坐落着梅立坪宅邸——据摩梯末笔记记载，那里住着一位名叫斯台普吞的博物学者及其胞妹。\n\n我划燃一根又一根火柴，借着微弱跳动的火光注视着地图上的这几个坐标。两条截然不同却又在暗中交汇的逻辑脉络，在我脑海中逐渐淬炼成型。\n\n第一：作案凶器。如果那只恶犬确实是血肉之躯，那么在凶案发生之前与之后，凶手究竟将它藏匿在何处？如此庞大的恶兽，绝不可能圈养在寻常村落的犬舍中而不引起乡邻的惊觉；它需要巨量的鲜肉维持生机；它需要绝对与世隔绝的隐秘据点；最关键的是，它的主人必须同时兼备广博的生物生理学知识，以及冷酷如铁的坚韧神经。\n\n第二：谋杀动机。查尔斯爵士死于极度惊恐诱发的急性心脏骤停。那么，他的猝死究竟能让谁坐收渔翁之利？巴斯克维尔的庄园与信托基金总额高达七十四万英镑！如果远道而来的继承人亨利爵士也在荒原上死于非命，这笔庞大的财产将顺位继承给谁？摩梯末曾提及一位远在威斯特摩兰郡行医传教的远亲戴斯蒙德老牧师——一位视金钱如粪土的圣徒。然而，在族谱的阴影里，是否还潜藏着未被公开承认的私生子嗣或旁系血脉？\n\n我深深地吸了一口刺鼻的浓烟，倚在椅背上，在渐浓的夜色中凝视着烟斗中明灭的火星。一个冷酷、缜密、受过极高教育且深谙人性的非凡大脑，正在暗中操纵着这场死局！凶手深知查尔斯爵士脆弱的心脏病灶；深知他对家族古老诅咒那深入骨髓的迷信恐惧；他竟然极其阴险地将一段十八世纪的哥特鬼怪故事，锻造为现代谋杀最锋利无形的凶刃！\n\n明晨十点，巴斯克维尔家族最后的继承人就将踏入这间屋子。而在他的身后，一道无形而致命的巨兽阴影，已然在泥潭的迷雾中露出了森森利齿！", "is_ending": false, "clues": ["已叮嘱摩梯末医生在滑铁卢车站迎候亨利爵士，并于明晨十点准时引荐至贝克街221号B", "六英寸一英里的军械调查局高精度地图清晰展示了格林盆泥潭、达特穆尔监狱与黑色岩岗的险恶地貌", "福尔摩斯断定：绝非幽冥恶鬼作祟，而是一个极其阴险缜密的高智商活人正在利用传说猎杀巨额遗产继承人"], "choices": [{"id": "h_ch3_c1", "text": "次日清晨会见亨利·巴斯克维尔爵士，剖析那封以《泰晤士报》剪贴而成的恐吓信。", "target": "holmes_ch04_part1_warning", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch3_c2", "text": "【视角切换：约翰·H·华生】从华生的视角体察名侦探整夜沉浸烟草浓雾中的冥想。", "target": "ch03_problem", "pov_switch": "watson", "pov_switch_name": "约翰·H·华生医生"}]}, "holmes_ch04_part1_warning": {"id": "holmes_ch04_part1_warning", "title": "第四章 亨利·巴斯克维尔爵士（上：剪贴信件与失窃新靴）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": null, "content": "次日上午十点整，楼梯口准时传来了沉稳而有力的脚步声。摩梯末医生推开房门，引介着那位性命与庞大遗产皆悬于一线的年轻爵士步入了我们的起居室。亨利·巴斯克维尔爵士约莫三十岁上下，身材不高却极其结实精悍。他生着一双机警敏锐、黑白分明的深邃眼睛，浓密粗黑的眉毛下方，是一张轮廓硬朗、隐隐透出一股顽强好斗气质的英挺面庞。他身着一套剪裁得体的红褐色粗花呢猎装，皮肤呈现出常年在加拿大西部无垠草原风吹日晒所特有的古铜色光泽；然而其举手投足间展现出的沉稳自若与得体教养，却无时无刻不在彰显着一位正统英国乡绅的名门底蕴。\n\n‘能在此与您会面，真是深感荣幸，福尔摩斯先生，’年轻的爵士微笑着迎上前，与我握了握手。他的掌心宽厚有力，指节坚实如铁。‘即便摩梯末医生昨晚没有极力劝我前来拜访，我今天一早也必定会亲自登门向您求教。我听说您是一位专门破解世间难解之谜的大师，而我今天清晨在饭店恰好遭遇了一桩让我百思不得其解的怪事。’\n\n‘请坐，亨利爵士，’我指了指壁炉旁的硬木扶手椅，‘这么说，您才刚踏上伦敦的土地不到二十四小时，便已经遭遇到某种非同寻常的意外波折了？’\n\n‘严格说来，或许算不上什么天塌下来的灾祸，但其古怪程度足以让任何一个理智正常的人抓破头皮。’他将手伸进猎装的内侧口袋，掏出一枚发皱的信封，随手抛在我们面前的早餐桌上，‘二位请过目吧。’\n\n信封用的是极其廉价普通的奶油色条纹信纸，正面的收信人地址用歪歪扭扭、粗劣笨拙的墨水大写印刷体写着：‘诺森伯兰饭店，亨利·巴斯克维尔爵士收’。邮戳显示是查令十字街邮局昨夜寄出的平信。\n\n我用裁纸刀挑开封口，抽出了里面折叠平整的一张单页横格便签纸。便签纸的中央，赫然粘贴着由铅印字粒拼接而成的一整句短语：\n\n“只要你还在乎自己的性命或理智，就请千万远离那片荒原。”\n\n整句话中，唯有最后一个单词“荒原”（moor），是用普通的黑墨水手写补全的。\n\n‘那么，福尔摩斯先生，’亨利爵士双臂抱胸，审视着我问道，‘这究竟意味着什么？到底是谁在如此煞费苦心地暗中刺探我的行程？’\n\n‘一份极其非同寻常的物证，’我将便签纸平铺在膝头，取出高倍放大镜，在清晨透入窗户的明亮光线下逐字微观审视，‘对于经过严谨刑侦训练的眼睛而言，这薄薄的一张纸片所吐露的实情，简直比一场当面口供还要详实丰富得多。’\n\n‘您能推断出寄信人是谁吗？’\n\n‘我至少能为您彻底重构出这份信件在拼贴制作时的物理全貌，’我一边转动放大镜，一边徐徐剖析道，‘首先请看这些印刷字粒的字形。这行字是从昨天出版的《泰晤士报》头版社论中剪裁下来的。凡是对现代报业印刷术略有研究的人，一眼便能辨认出这种专属于《泰晤士报》严肃政治社评的“资产阶级体”（Bourgeois type）铅字。再请注意看“理智”（reason）这个词边缘那参差不齐的毛糙切口：它绝非裁纸大剪刀所裁，而是用一把刀刃极其短小的弯头指甲剪仓促剪下的！刀刃在转折处滑脱了两次，剪裁者当时的心情极其慌乱急迫！’\n\n‘仓促慌乱？’华生忍不住插话道。\n\n‘处于极度惊恐与十万火急的仓皇状态之下，’我指着字粒边缘溢出的暗黄色胶水痕迹，‘看这里的胶水：这是普通办公桌上常用的阿拉伯树胶浆糊，是用一支颤抖不稳的毛刷胡乱涂抹上去的。然而，华生，请将这封信拿起来，凑到你的鼻尖半寸以内。你能捕捉到什么？’\n\n华生依言将信纸凑近鼻端，耸了耸鼻子：‘一种极其清淡微妙的幽香……似乎是某种花卉的香水？’\n\n‘白素馨花（White Jessamine），’我笃定地断言，‘这是上流社会极具教养品位的名门闺秀才习惯使用的冷门名贵香氛！昨夜坐在某间幽暗的会客室里、手持指甲剪颤抖着剪碎报纸的，赫然是一位年轻女性的手！她受到了某种极其冷酷残暴势力的严密监控或强力威胁，却在良知的煎熬下，不惜冒着生命危险，拼死向一位素昧平生的陌生人发出最后的泣血警告！’\n\n年轻的亨利爵士目瞪口呆地注视着我手中的信纸，眼神中流露出毫不掩饰的由衷敬佩：‘天呐，福尔摩斯先生，您竟然能从一张废纸里看出这么多门道！然而，昨夜发生的荒唐事还远不止这一桩！’\n\n‘哦？饭店里还发生了什么离奇变故？’\n\n‘我的皮靴被人偷了！’亨利爵士懊恼地一拍大腿，忿忿不平地嚷道，‘昨天下午我刚在斯特兰德大街的一家高档鞋店里，花重金买了一双崭新的黄褐色小牛皮短靴。昨晚临睡前，我随手将那双新靴子放在客房门外准备让侍从打油擦亮。结果今天早晨一开门——其中一只靴子竟然不翼而飞了！饭店经理带着仆役上上下下搜遍了整栋大楼，甚至连地下室的煤斗都翻了个底朝天，那只靴子就像融化在空气里一样彻底蒸发了！’\n\n‘一双崭新的黄褐色小牛皮靴？’我的双眸瞬间亮起如同寒夜中的鹰隼，‘一次也没有穿过？’\n\n‘一次也没有！崭新得连鞋底的涂层都没掉！’\n\n我缓缓仰靠在椅背上，用指甲轻轻敲击着烟斗的硬柄。整个错综复杂的杀人迷局，在这一瞬间化作了晶莹剔透的因果罗网！如果是普通的宵小盗贼潜入饭店行窃，他必然会成双成对地将整双皮靴盗走变卖；世间绝无只盗走单只靴子的窃贼，除非——这只靴子不是为了穿戴，而是为了供某种具备极其敏锐嗅觉的掠食凶兽提取猎物的气味追踪媒介！然而，一双刚从工厂陈列架上取下的崭新皮靴，除了刺鼻的生皮鞣制油与鞋油味之外，根本没有任何属于人类躯体的活体皮脂气味！\n\n‘凶手犯下了一个极其致命的盲动错误，’我在心中如电石火花般急速推导，‘他偷走了那只新靴，拿回隐秘巢穴后才懊恼地发现上面根本没有亨利爵士的体味媒介！他必定会再次潜回饭店，盗取一双饱含主人汗液的旧鞋！’\n\n我霍然从椅子上站起身，目光如炬地注视着年轻的巴斯克维尔公爵：‘打起十二分的精神来，亨利爵士！我们此刻面对的，是一个智慧、胆魄与残忍程度皆登峰造极的可怕死敌！您现在是打算直接返回诺森伯兰饭店吗？’\n\n‘摩梯末医生陪我去摄政街的裁缝铺定做几件体面的常服，顺便采购些乡间行囊，’亨利爵士答道。\n\n‘绝妙之极！’我转头看向华生，‘带上你的遮阳软呢帽，华生，再把你的军用阿达姆斯左轮手枪压满子弹！真正的猎杀游戏，现在正式开场了！’", "is_ending": false, "clues": ["恐吓信系用指甲剪从昨日《泰晤士报》关于自由贸易的社论中剪下资产阶级字体拼接而成", "信纸边缘残留一丝微弱的白素馨花香水气味，揭示出有女性在极度不情愿中参与起草", "亨利爵士入住诺森伯兰饭店第一夜，一双崭新未穿过的黄褐色皮靴在走廊离奇失窃"], "choices": [{"id": "h_ch4_p1_c1", "text": "尾随亨利爵士与摩梯末步入摄政街，逼出暗中盯梢追踪的幕后眼线。", "target": "holmes_ch04_part2_cab_chase", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch4_p1_c2", "text": "【视角切换：杰克·斯台普吞】窥视潜伏在2704号马车里的反派如何紧盯猎物。", "target": "stapleton_ch04_part1_hotel_shadow", "pov_switch": "stapleton", "pov_switch_name": "杰克·斯台普吞"}]}, "holmes_ch04_part2_cab_chase": {"id": "holmes_ch04_part2_cab_chase", "title": "第四章 亨利·巴斯克维尔爵士（下：摄政街的幽灵马车）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": null, "content": "我们耐心地在起居室里等了足足两分钟，直到亨利爵士与摩梯末医生的脚步声彻底消失在贝克街的街口，我和华生才悄无声息地闪身出了大门。清晨弥漫的黄褐色浓雾已经渐渐被冷冽的秋风吹散，呈现出一片阴沉而明净的天光。在我们前方两百码外喧嚣的人行道上，摩梯末医生瘦长微驼的背影，以及亨利爵士结实利落的红褐色粗花呢猎装，在熙熙攘攘的人流中清晰可辨。\n\n‘走到街道对面的骑楼阴影里去，华生，’我压低帽檐，低声叮嘱道，‘步幅保持均匀自然。我们既不能惊动前面的委托人，更绝不能惊动那条可能咬在他们身后的恶犬眼线！’\n\n我们穿过牛津街，拐入开阔繁华的摄政街。清晨购物的人潮与马车车流逐渐变得稠密起来；四轮大马车、双层公共马车与轻便双轮马车在坚硬的木块路面上碾压出震耳欲聋的隆隆轰鸣。亨利爵士与摩梯末在一间陈列着精致猎枪的橱窗前停下了脚步，指指点点地交谈着。\n\n就在这一刹那，车流中出现的一处极其反常的微小异动，猛然刺痛了我的双眼！\n\n一辆墨绿色的双轮轻便马车（Hansom Cab），正不紧不慢地贴着人行道边缘的街沿徐徐滑行，恰好停在距离我们那两位朋友身后约五十码开外的马路上。车夫既没有拉门招揽乘客，车内也没有任何乘客起身下车的迹象。相反，马车的前轮宛如蜗牛般缓缓碾动，始终将它与亨利爵士那身粗花呢背影之间的距离，极其精准地锁定在五十码以内！\n\n我的右手宛如铁钳般瞬间死死扣住了华生的大臂。‘看，华生！看那辆轻便马车！’\n\n‘我看到了。一辆普普通通的双轮马车。’\n\n‘看马车车厢侧面的长方形观景玻璃！透过玻璃看车厢里面！’\n\n车夫高高地坐在车厢后上方的御手座上，身上裹着厚重的防雨油布披风。然而，透过车厢侧面那扇狭窄的茶色玻璃窗，我清晰地捕捉到了车厢深处端坐着的一个人形剪影！那名乘客将身躯深陷在幽暗的阴影里，仅仅探出小半张面孔，两道冰冷如毒蛇般的视线，正死死穿透窗户，牢牢钉在亨利爵士的后颈上！那人蓄着一部极其浓密扎眼、一直垂落到大衣领口的方型黑大胡子，而在他高挺的鼻梁上，一副金丝边眼镜的镜片，正反射出摄政街清晨惨白的冷光！\n\n一个职业级的跟踪盯梢者！一个用浓密假胡子与假眼镜精心伪装的冷酷刺客！\n\n正当此时，亨利爵士似乎看完了橱窗，转身穿过马路朝对面的商铺走去。那辆马车几乎在同一秒钟迅速调转马头，悄然跟了上去！\n\n‘该死，华生，他紧咬住他们不放！’我低吼一声，‘我们必须拿到他的牌照号码！跑起来！’\n\n我们二人如离弦之箭般冲出骑楼，在呼啸而过的双层马车与重型运货马车之间急速穿插穿梭，径直朝着那辆双轮马车狂奔而去！然而，我迅疾如风的突进动作，终究还是落入了那名潜伏者极其警觉的双眼！就在我冲刺到距离马车仅剩不到三十码的瞬间，车厢内那张黑胡子面孔猛然扭转向我！\n\n在百分之一秒的电光石火之间，我和他的目光在晨光中轰然相撞——我的双眸燃烧着猎犬咬住猎物时的狂暴怒火，而他的瞳孔则在一瞬间因剧烈的惊骇与骤然的辨认而骤然收缩！\n\n他认出了我！\n\n车厢内部猛然伸出一只戴着皮手套的手，车顶上方的小木活门发出‘砰’的一声清脆爆响！车夫手中的长鞭在半空中呼啸抽落，伴随着一声宛如火枪击发般的清脆炸裂，重重抽打在拉车烈马的臀肉上！\n\n那匹高大的骏马宛如受惊的狂兽般人立而起，两只黄色车轮猛地弹上街沿，险些撞翻人行道上几名尖叫退避的体面淑女，旋即如疯狂的战车般横冲直撞，一头扎入了汇聚在牛津圆环那片汹涌如潮的庞大车流漩涡之中！\n\n‘拦住他！拦住那辆马车！’我一边在人行道上全力冲刺，一边声嘶力竭地厉声长啸！\n\n然而一切都太迟了。一辆满载着厚重啤酒桶的重型八轮运货马车恰在此时缓缓横穿十字路口，庞大的车身如同一堵移动的木墙，彻底封死了我们的追击路线。等到我和华生好不容易绕过那几匹喷着粗气的夏尔挽马时，那辆轻便马车早已化作一道绿色的残影，彻底湮灭在卡文迪许广场错综复杂的小巷迷宫深处！\n\n我在路边的一根铸铁煤气灯柱下骤然刹住脚步，单手扶着冰冷的灯柱，胸膛剧烈起伏，呼吸急促而粗重。然而，即便咽下了这口转瞬即逝的挫败苦果，一团炽热狂暴的战斗快感，却在我的胸腔深处熊熊燃烧起来！\n\n‘精彩，华生，’我抹去额角渗出的一层冷汗，对着气喘吁吁的同伴露出了猎手特有的冷酷狞笑，‘我们终于遭遇了一位智勇双全、足以与我匹敌的强劲劲敌！这家伙绝非泛泛之辈，在距离缩短到致命范围的前一秒，他竟然精准地捕捉到了我的意图！’\n\n‘你……你看清他的车牌号了吗？’华生扶着膝盖，上气不接下气地喘息着问道。\n\n‘二七零四号，’我用铅笔在怀中的便签本上重重写下这四个数字，‘一辆在伦敦市交通管理局正式登记造册的营运马车！这为我们反撕开这场迷局提供了一根坚实的原点杠杆！现在，华生，立刻返回贝克街，我们预先准备的三路围剿铁网，现在必须以最快速度全线收拢了！’", "is_ending": false, "clues": ["牌照为2704号的双轮轻便马车沿着摄政街人行道边缘鬼祟尾随亨利爵士一行", "车厢侧窗后暗藏一名蓄着浓密方型黑大胡子、佩戴金丝眼镜的冷酷监视者", "监视者与福尔摩斯目光骤然相撞后，猛扣车顶活门催促车夫向牛津圆环狂飙突围"], "choices": [{"id": "h_ch4_p2_c1", "text": "逐一收网三条追踪线索：卡特赖特排查废纸篓、电报试探管家、传讯2704号车夫。", "target": "holmes_ch05_threads", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch4_p2_c2", "text": "【视角切换：杰克·斯台普吞】体验2704号马车内直面福尔摩斯逼视时的惊魂瞬间。", "target": "stapleton_ch04_part2_cab_chase", "pov_switch": "stapleton", "pov_switch_name": "杰克·斯台普吞"}]}, "holmes_ch05_threads": {"id": "holmes_ch05_threads", "title": "第五章 三条断落的线索（傲慢的车夫与绝密潜伏计划）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": "anchor_threads", "content": "到了当夜八点，我原以为十拿九稳能够擒获伦敦幕后黑手的三条追踪线索，竟然如同脆弱的蛛丝一般，在我指间被一一无情地绷断了。\n\n第一条线索是年轻的卡特赖特——那个来自地区电报局、机灵能干的差役小子。我曾派他去逐一排查查令十字街附近的二十三家大饭店，在所有的废纸篓与壁炉炉灰里搜寻那张被残忍剪碎的昨日《泰晤士报》。下午五点整，他满头煤灰、垂头丧气地返回了贝克街。在整整二十三家饭店里，没有留下一星半点报纸的残片；那些手脚麻利的客房女仆早在清晨便将所有的壁炉炉灰与废纸通通倒进了大楼底层的焚化炉里！\n\n第二条线索是我发给巴斯克维尔庄园管家巴里摩尔的那封暗藏杀机的试探电报。如果巴里摩尔此刻确实潜伏在伦敦暗中盯梢亨利爵士，那么我那封特别注明‘必须由收信人亲启当面签收’的电报，要么会被转寄至伦敦，要么会因无人签收而滞留在当地邮局。然而，格林盆村邮局在傍晚六点发回的回电却令我大失所望：‘电报已按地址送达。巴里摩尔先生当时正在阁楼清点杂物，收条由其夫人代为签署。’这是一个充满致命歧义与不确定性的狡猾结果！巴里摩尔可能当时确实身在德文郡，也可能是在收到风声后搭乘清晨的头班早车仓皇赶回，甚至可能是他的妻子在替他撒谎隐瞒行踪！\n\n如今，唯有第三条线索尚存一线生机：那就是二七零四号轻便马车的当事车夫。\n\n晚上七点整，伴随着楼梯上一阵沉重厚实的皮靴踏步声，一位面色红润、身材魁梧粗壮的马车夫推门走了进来。他身披一件厚重的草黄色粗呢大衣，手中拘谨地揉捏着那顶破旧的圆顶硬礼帽，神情紧张地打量着我们满屋的书架与实验桌上的化学蒸馏瓶。\n\n‘小人名叫约翰·克雷顿，先生，’他结结巴巴地说道，‘车行调度所传信给我，说有位贵人急着要找今天上午在摄政街拉车的那位二七零四号车夫。’\n\n‘正是如此，克雷顿先生，’我随手在桌上抛下一枚金光闪闪的半索弗林金币，‘把今天上午雇你的那位乘客的所有细节，原原本本地讲给我听。他当时是如何指使你尾随前面那两位绅士的？’\n\n克雷顿的下巴惊得险些合不拢。‘老天爷保佑您，先生！您怎么会知道他在暗中盯梢？今天上午十点，那人在特拉法尔加广场的马车停靠点拦下了我的车。他自称是一名私家侦探，对我说只要我死死咬住前面那两位一位穿粗花呢猎装、一位戴金丝眼镜的绅士而不被发觉，他就赏我两枚金坚尼！我们一路从特拉法尔加广场跟着他们到了贝克街，又一路跟进了摄政街，直到您像一头被激怒的雄牛一样横穿马路朝我们猛扑过来！他一看见您，立刻拉开车顶的活门，发疯般朝我嘶吼：“别管红灯！快马加鞭冲到滑铁卢车站！到了我再赏你一坚尼！”’\n\n‘然后你真把他送到了滑铁卢车站？’\n\n‘一路狂奔直奔车站，先生！马车还没完全刹稳，他就跟泥鳅一样敏捷地窜了出去，把两枚沉甸甸的金坚尼随手扔在我的皮围裙上，一眨眼便湮没在站台汹涌的人潮里了！’\n\n‘在离开马车之前，他难道没有留下任何话？’\n\n克雷顿抓了抓后脑勺，脸上的表情显得极其古怪而尴尬：‘哎，先生，说来真邪门。就在他跳下踏板的那一瞬间，他突然转过身，隔着那丛浓密刺眼的黑胡子对我狞笑了一声。他说：“车夫，如果待会儿有人向你打听刚才坐车的人是谁，你就大大方方地告诉他——我的名字就叫歇洛克·福尔摩斯！”’\n\n华生听到这里，忍不住从扶手椅上一跃而起，愤怒地爆出了一句罕见的军人粗口。而我却在短暂的惊愕之后，忍不住爆发出一阵震耳欲聋的狂笑！\n\n‘漂亮，华生！’我狠狠抚掌大笑道，‘击中了！毫无疑问，这一剑结结实实地刺中了我们的要害！我们的这位对手不仅拥有钢铁铸就的坚韧神经，竟然还兼备一种近乎挑衅的黑色幽默感！他看穿了我记下了他的车牌号，料定我一定会顺藤摸瓜找到车夫，于是他竟然大模大样地借车夫之口，奉还给我两枚金坚尼的傲慢嘲弄！这不是寻常的下三滥窃贼，华生，这是一位深谙犯罪艺术的顶尖大师！’\n\n正当此时，楼下的门铃再度急促地震响起来。紧接着，年轻的亨利·巴斯克维尔爵士在一脸惊慌失措的摩梯末陪同下，怒气冲冲地推门闯入了我们的起居室。\n\n‘看在上帝的份上，福尔摩斯先生！’年轻的爵士一把将猎装软帽狠狠砸在皮沙发上，气得满脸通红，‘我住的那家诺森伯兰饭店简直是一个无法无天的贼窝！这种恶作剧到底还有完没完？！昨天刚偷了我一只崭新的黄褐色小牛皮靴；今天下午趁我回房洗手的功夫，居然又有人偷偷溜进我的寝室，把我的一只旧黑皮靴偷走了！那是我几年前在多伦多买的老靴子，穿着它横渡了整个大西洋，鞋底都快磨穿了！’\n\n起居室内的欢笑声在刹那间荡然无存。我脸上的笑容如退潮般瞬间冻结，取而代之的是一种冷酷如冰霜般的极度严峻。\n\n‘一双旧的黑皮靴？’我的语调骤然降低到接近绝对零度的冰冷极值，‘一双被你穿了数月、浸透了你双足体温与汗液气味的旧皮靴？！’\n\n‘是的，先生！一双又脏又旧、散发着汗味的破皮靴！’\n\n我猛然转头望向华生，在他剧烈收缩的惊骇眼眸中，我看到了自己内心深处那抹未曾言明的极度战栗。昨日失窃的那只新靴，仅仅是凶手在混乱中的盲动失误；而现在，这头潜伏在暗处的食人恶魔终于纠正了偏差，在诺森伯兰饭店成功猎取到了最完美的生物追踪媒介！此时此刻，在数百英里外荒凉凄厉的德文郡荒原深处，那只蛰伏在泥潭黑夜里的食人恶兽，正在凶手的驱使下，将它滴淌着涎水的巨大鼻孔，贪婪而兴奋地贴在亨利爵士这只浸透体味的旧靴子上！\n\n‘亨利爵士，’我语气沉重如铅，‘刻不容缓。您必须在明天上午立即启程前往德文郡荒原。但您绝不能孤身一人前往。’\n\n‘摩梯末医生会与我同行，’爵士说道。\n\n‘摩梯末医生有他自己的诊所和病人，他的住宅距离巴斯克维尔庄园足足有数英里之遥。不，亨利爵士，您身边必须有一位忠诚如铁、胆魄过人、在白天形影不离、在黑夜能手握上膛左轮手枪贴身守卫在您卧房门外的高尚勇士！’\n\n‘那会是谁呢，福尔摩斯先生？难道您愿意亲自同我前往？’\n\n‘我伦敦的庞大刑侦业务严酷地剥夺了我离开首都的自由，’我语气平静自然，目光却刻意避开了华生投来的探询视线，‘伦敦有几桩牵涉内阁的重大机密案件正将我死死捆绑在此。但是，如果他愿意屈尊首肯的话，全英格兰唯有一人，我愿将您的身家性命毫不保留地托付于他——那就是我的挚友与战友，约翰·H·华生医生！’\n\n华生的双眼瞬间因这突如其来的崇高使命感而闪烁出决然的光芒。他没有哪怕半秒钟的迟疑，大步上前紧紧握住了年轻爵士的手：‘我万分愿意同您前往，亨利爵士！’\n\n深夜，当亨利爵士与摩梯末告辞返回饭店收拾行装之后，华生隔着熊熊燃烧的壁炉余烬注视着我：‘福尔摩斯，你真的抽不出身吗？难道就没有任何微小的可能，能让你与我们一同踏上开往德文郡的列车？’\n\n‘绝无可能，华生，’我凝视着壁炉中噼啪作响的木柴火星，‘我必须留在伦敦。但我需要你每隔一天便向我发回一份详尽到极致的调查报告——荒原上的每一张陌生面孔、每一阵可疑的风声、甚至每一句私语，你都必须巨细靡遗地呈报给我。’\n\n华生带着军人特有的绝对服从庄重地点了点头，熄灭烟斗返回了二楼寝室。\n\n当他的房门发出一声轻微的合栓声后，我迅速走到书桌旁，按动机关弹开了藏在桌板夹层里的暗格。我从里面取出了我的另一本备用化名护照、一顶粗呢海员帽、一件沾满煤灰的厚重水手短大衣，以及一份伪造得天衣无缝的军械勘测员工作证件，上面的名字赫然写着：威廉·埃文斯。\n\n‘原谅我的隐瞒，我最亲爱的华生，’我对着窗外漆黑深邃的贝克街夜空低声耳语，‘若让凶手得知歇洛克·福尔摩斯已经亲临德文郡，那只毒蛛便绝不会轻易爬出它的巢穴！你将是吸引那只恶犬全部注意力的坚固明盾；而我——将是在达特荒原黑暗迷雾中，给它以致命一击的无形利剑！’", "is_ending": false, "clues": ["第一条线索断裂：差役卡特赖特搜遍查令十字街23家旅馆废纸篓，未找到被剪残的《泰晤士报》", "第二条线索断裂：发往巴斯克维尔庄园探查管家行踪的电报由其妻子代签，无法证实其当时身在何处", "第三条线索带来震撼挑衅：2704号车夫约翰·克雷顿招认，黑胡子雇主付了两坚尼并嚣张宣称‘我就是歇洛克·福尔摩斯！’", "亨利爵士一双沾满体味气味的旧黑皮靴在饭店离奇失窃，证实凶手已成功猎取用于恶犬追凶的气味媒介"], "choices": [{"id": "h_ch5_c1", "text": "派遣华生公开护送亨利爵士前往德文郡，自己则化装潜行、秘密潜伏达特荒原。", "target": "holmes_ch06_part1_secret_departure", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch5_c2", "text": "【视角切换：杰克·斯台普吞】窥探斯台普吞如何利用内应神不知鬼不觉窃走旧黑靴。", "target": "stapleton_ch05_black_boot", "pov_switch": "stapleton", "pov_switch_name": "杰克·斯台普吞"}]}, "holmes_ch06_part1_secret_departure": {"id": "holmes_ch06_part1_secret_departure", "title": "第六章 巴斯克维尔庄园（上：暗度陈仓与化装潜行）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": "anchor_arrival", "content": "十月三日，星期六的清晨。我斜倚在帕丁顿车站那被机车煤烟熏得乌黑的铸铁柱旁，嘴里叼着一截未点燃的粗陶烟斗。我此时身上套着一件沾满机油与泥渍的草黄色粗呢短大衣，下身是一条沾满硬泥的宽腿灯芯绒长裤，头顶扣着一顶破旧的宽檐鸭舌帽，帽檐压得极低，遮住了我大半张面庞。在站台上摩肩接踵的旅客、水手与搬运工洪流中，没有一个人会多看这个平庸邋遢的乡下勘测工第二眼。\n\n在我前方五十码外的中央站台上，开往英格兰西部的十点三十分早班特快列车正喷吐着白色的蒸汽等待启程。我静静注视着我那忠诚的华生医生，正极其沉稳地将亨利爵士的皮面旅行手提箱递给列车员。华生的面孔宛如一尊经过战火洗礼的坚毅军人雕像：他的下颌紧绷成两道坚毅的冷线，而在他厚重的旅行大衣右侧口袋下方，赫然隆起一块沉甸甸的硬块——那是他擦拭得一尘不染、压满实弹的军用阿达姆斯左轮手枪！亨利爵士正精神抖擞地与摩梯末谈笑着，他那双机敏的黑眼睛最后环视了一圈伦敦繁华的车站，旋即大步踏上了通往险境的车厢。\n\n‘好样的，华生，’在机车发出一声凄厉悠长的汽笛长鸣、喷吐着漫天滚滚白烟缓缓起步时，我对着那面渐行渐远的车窗玻璃，在心底低声耳语，‘你将是一座坚不可摧的明面堡垒，负责把潜伏恶敌的所有视线与杀机死死吸引在自己身上；而潜行在暗夜里的致命反击，就彻底交由我来执行吧！’\n\n沉重的列车车轮在铁轨上发出沉闷刺耳的摩擦声，旋即加快速度，平稳地滑出了站台，消失在十月阴郁的晨光之中。\n\n尾节车厢刚驶过调度道岔，我便如同幽灵般迅速拐出车站侧门的狭窄便道，转瞬湮没在帕丁顿后街的小巷迷宫里。两个小时后，我手持‘军械调查局地形测绘员威廉·埃文斯’的合法证件，已经端坐在了一列由伦敦发往埃克塞特方向的慢速牲畜混编列车的硬木三等车厢角落里。\n\n待到夜幕降临时，萨默塞特郡柔美碧绿的起伏丘陵与德文郡丰茂的苹果园早已被列车抛在身后，取而代之的，是拔地而起、阴森险峻的花岗岩达特荒原高地。车窗外的空气骤然变得稀薄而冰寒彻骨，风中夹杂着陈年腐烂泥炭与湿冷植被特有的刺鼻土腥气。在荒原边缘的每一处铁路道口与石桥旁，赫然伫立着两名全副武装的郡警与步兵哨兵，他们裹着油布斗篷在凄风冷雨中瑟瑟发抖，手中的马枪在列车车灯的反射下闪烁着森冷的寒芒。\n\n列车员在查票时，用战战兢兢的耳语向我道出了实情：就在三天前，关押在普林斯敦花岗岩巨石监狱里的诺丁山凶杀狂魔塞尔登，在暴风雨中成功越狱了！那个手段残暴如禽兽、其血腥恶行曾让全伦敦为之震悚的恶魔，如今正如困兽般潜伏在这片浩瀚无垠的花岗岩沼泽荒野之中，引得德文郡步兵团的两个整编连正端着刺刀在山岩间四处搜山捕猎。\n\n‘这对年轻的亨利爵士而言，可真是一场别开生面的德文郡欢迎礼，’在牛顿阿伯特荒凉偏僻的岔道小站上，我将沉甸甸的帆布帆布背包甩在肩头，嘴角勾勒出一抹冰冷而残酷的微笑，‘荒岩间游荡着越狱的人形食尸鬼，死沼里蛰伏着古老相传的地狱恶兽，而在这一切的幕后，却端坐着一位手握提线、冷静自若的现代提线木偶大师！’\n\n我压低帽檐，逆着迎面如刀割般刺骨的深秋荒原狂风，徒步踏入了茫茫无际的黑暗荒野。夜色下，广袤雄浑的达特荒原宛如一片凝固在史前时代的黑色狂涛巨浪，苍凉、死寂、无边无际。数英里连绵不绝的黑石楠苔原在翻滚的夜雾中无限蔓延，唯有一座座突兀孤绝、宛如巨兽利齿般直刺阴沉苍穹的花岗岩岩岗（Tor），在暴风雨的前奏中投下狰狞可怖的庞大剪影。\n\n在这片亘古未变的蛮荒决斗场上，一场关乎生死与智谋的终极猎杀，终于拉开了血腥的帷幕！", "is_ending": false, "clues": ["在帕丁顿车站暗中注视华生、亨利爵士与摩梯末登上十点三十分的特快列车远赴德文郡", "福尔摩斯化名军械测绘员威廉·埃文斯，搭乘慢速运牛列车迂回潜入德文郡南端荒原", "因诺丁山杀人狂魔塞尔登从达特穆尔监狱越狱，整座荒原已被荷枪实弹的骑兵严密封锁"], "choices": [{"id": "h_ch6_p1_c1", "text": "攀登黑色岩岗，在史前圆形石屋据点内设立绝密前沿侦查哨所。", "target": "holmes_ch06_part2_hut_surveillance", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch6_p1_c2", "text": "【视角切换：约翰·H·华生】目睹亨利爵士与华生一行抵达阴森苍凉的巴斯克维尔庄园。", "target": "ch06_part1_arrival", "pov_switch": "watson", "pov_switch_name": "约翰·H·华生医生"}]}, "holmes_ch06_part2_hut_surveillance": {"id": "holmes_ch06_part2_hut_surveillance", "title": "第六章 巴斯克维尔庄园（下：黑色岩岗上的鹰隼视线）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": null, "content": "黑色岩岗（Black Tor）峰顶的花岗岩峭壁上，呼啸的狂风如同一道冰冷刺骨的无形巨墙。暴风雨穿过山岩间狭窄的裂隙，发出阵阵令人毛骨悚然的凄厉尖啸，如同一整群饥肠辘辘的恶狼正贴着石楠丛疯狂奔嚎。然而，在我选作秘密前沿指挥所的这座史前古老圆形石屋深处，空气却显得极其干燥、死寂而隐蔽。\n\n这些由数千年前的古代伊比利亚土著居民留下的蜂巢状石构建筑，堪称原始工程学的奇迹。未经任何石灰砂浆粘合的花岗岩巨石相互咬合借力，竟在三千年的大西洋海风侵蚀下岿然不动。不到四英尺高的低矮门洞朝向东南，完美避开了肆虐的西北主风向。在坚硬泥土地面的正中心、石质圆锥形屋顶的排烟口正下方，我清理出了一圈平整的花岗岩石块作为临时炉灶；而在干燥的石壁内侧，我铺垫了厚达一英尺的干燥羊齿草与紫石楠枝桠，上覆军用防水帆布与深蓝色厚羊毛毯，构筑成一张温暖结实的行军卧榻。\n\n在这片寸草不生、鸟兽绝迹的蛮荒死地腹心，我稳稳立下了我的指挥中枢。\n\n拂晓时分，石屋下方险峻的花岗岩倒石堆深处，忽然传来了一声惟妙惟肖的麻鹬清脆鸟鸣——那是我们约定的联络暗号。我猫着腰钻出低矮的门洞，警惕地穿透晨雾向下俯瞰。只见一个瘦小敏捷的身影正宛如岩羊般在乱石嶙峋的山脊上飞攀而上，臂弯下紧紧夹着一只沉甸甸的柳条野餐篮。那正是年轻的卡特赖特——伦敦地区差役局里最机警可靠的机灵鬼，此刻正被我秘密安排潜伏在数英里外库姆·特雷西村的一家偏僻乡间小客栈里。\n\n‘一切正常吗，埃文斯先生？’少年气喘吁吁地钻进低矮的石门，摘下鸭舌帽，满头大汗地将柳条篮递了过来。\n\n‘寂静如坟，卡特赖特，’我接过篮子，熟练地翻检着补给，‘今天带了什么来？’\n\n‘一大条刚烤出炉的乡村粗麦面包，先生；两罐咸牛肉罐头；一磅烘焙咖啡豆；半打牛油蜡烛；还有今天一早通过伦敦早班快信转寄到乡下邮局的几封贝克街信函。’\n\n‘做得好。村里有人起疑吗？’\n\n‘连半个怀疑的影子都没有，先生！我对客栈掌柜说我是伦敦一家植物标本商店老板雇来的学徒画工，专门在荒原上临摹罕见的石楠花标本。他们都把我当成一个成天漫山遍野乱跑的傻小子！’\n\n‘很好。务必咬死这个身份，卡特赖特。回去时沿着河谷两岸的羊肠小道绕行。如果有任何华生医生发往贝克街被转寄过来的加密信件或电报，务必在天黑之后借着夜色送上岩岗。’\n\n待少年的身影彻底隐没在下方的山谷浓雾中后，我手脚并用地攀上了石屋背风面一处天然的花岗岩平顶观察哨。我将整个身躯紧紧贴伏在两块布满斑驳地衣的古老巨石掩体后，从皮套中取出那具长达三英尺的大倍率黄铜折射式野战望远镜，将其稳固地架设在三脚架上，指尖沉稳地旋转着调节焦距的滚花螺母。\n\n整座达特荒原的壮阔全景，在镜头中骤然被拉伸出令人屏息的微观纤毫！\n\n向东南方向望去，相距两英里外的一片苍老古橡树浓密凹地中，巴斯克维尔庄园那对耸立的都铎风格雉堞双塔与幽暗的石板坡屋顶，清晰得宛如近在咫尺。随着望远镜微调螺栓的缓缓旋动，那条臭名昭著的水松夹道尽收眼底：那是一道由两排阴森浓密的水松巨树围拢而成的黑暗狭长隧道，其尽头便是查尔斯爵士暴毙的那扇简陋木质栅门。在庄园主楼前的碎石台阶上，华生正与年轻的亨利爵士并肩而行。他们小巧的身影在镜头中宛如棋盘上的棋子，然而华生指向远方石楠荒原时手势的每一个动作细节，都毫无遗漏地映照在我的晶状体上。\n\n紧接着，我将黄铜镜筒向东缓缓平移了整整三英里，镜头横切过广袤翻滚、散发着死亡恶臭的大格林盆泥潭。即便隔着数层厚重的水晶镜片，那片巨大的食人沼泽依旧散发着一种令人毛骨悚然的妖异魅力：成片泛着翡翠般诱人光泽的剧毒水藓、一处处在日光下泛着死光的幽黑死水潭、以及起伏如黑色伤疤般的古老泥炭岩脊。而在那片吞噬一切的泥沼西侧边缘，在几棵被狂风扭曲成怪异姿态的枯萎矮松环抱之下，孤零零地耸立着梅立坪宅邸——那座通体涂着惨白石灰、在荒原烈风中瑟瑟发抖的阴森石砌小楼。\n\n就在此时，梅立坪宅邸那扇紧闭的漆黑大门，悄无声息地推开了。一个身材精瘦修长的男子迈步走入了秋日的惨白阳光下。他的右手中握着一根长达数英尺的坚硬竹杖，左肩上则轻巧地斜挎着一只醒目的绿色长柄捕蝶网。\n\n我迅速拧紧望远镜的三脚架锁扣，单眼深深陷入了橡胶目镜之中。‘杰克·斯台普吞，’我屏住呼吸，声音冷酷得如同结霜的坚冰，‘就让我好好瞧瞧，你在这片万劫不复的死亡死沼深处，究竟在搜集何种惊世骇俗的“生物标本”吧！’", "is_ending": false, "clues": ["黑色岩岗顶峰的史前凯尔特双环花岗岩石屋，被改造为绝密隐蔽的战术观察据点", "忠诚机警的差役卡特赖特借黑夜掩护，隔日从库姆·特雷西村秘密送来面包、罐头与净水", "大倍率黄铜折射式望远镜清晰俯瞰巴斯克维尔庄园全景、水松夹道及格林盆泥潭边缘的梅立坪宅邸"], "choices": [{"id": "h_ch6_p2_c1", "text": "将高倍望远镜对准大格林盆泥潭，锁定博物学者斯台普吞的异常巡游轨迹。", "target": "holmes_ch07_part1_naturalist", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch6_p2_c2", "text": "【视角切换：杰克·斯台普吞】窥视反派如何站在沼地高处冷眼注视车队入驻庄园。", "target": "stapleton_ch06_part1_arrival_watch", "pov_switch": "stapleton", "pov_switch_name": "杰克·斯台普吞"}]}, "holmes_ch07_part1_naturalist": {"id": "holmes_ch07_part1_naturalist", "title": "第七章 梅立坪的斯台普吞兄妹（上：手持捕蝶网的伪装者）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": null, "content": "透过高倍折射望远镜的水晶透镜，杰克·斯台普吞的一举一动都处于最无情、最严密的法医学解剖之下。\n\n这是一个身材矮小精干、面部刮得干干净净的男子，年岁约莫三十五六上下。他生着一头泛黄干枯的浅金发，下巴狭窄尖削，宛如一只嗅觉灵敏的雪貂。他身着一套剪裁得体的浅灰色法兰绒常服，头戴一顶有些滑稽的硬顶草帽，整个人透着一种被学究气过度浸染的私塾教员气质。然而，当我通过镜头死死凝视着他在大格林盆泥潭那片危机四伏的致命边缘起伏跳跃的身影时，所有浮于表面的滑稽感在一瞬间荡然无存，取而代之的，是一种深入脊髓的冰冷战栗！\n\n这个男人的步伐轻盈敏捷得近乎不可思议，宛如一头在沼泽深处悄然潜行的美洲黑豹！寻常成年男子若是踏入那片鲜艳翠绿的水生苔藓，瞬间便会被深不见底的烂泥彻底吸入没顶；然而斯台普吞却踩着极其精妙的碎步，在几丛枯黄的干芦苇苔藓墩之间从容跃进，其精准程度宛如脚下踩着一条深埋在水底的无形石阶！他手中握着一根十英尺长的带倒钩铁头探路竹竿，每迈出两步便探向泥面深处探查虚实——他深知那条穿越万劫不复泥渊的绝密死径！\n\n突然间，一阵凄厉绝伦、撕心裂肺的狂暴惨叫声，穿透了整座荒原的死寂！\n\n在距离斯台普吞所处位置以东约半英里处，一匹在石楠丛中觅食误入低地的德文郡野生栗毛矮种小马，踏上了一片看似娇嫩肥沃的亮绿色青苔地。刹那间，泥浆表层脆弱的浮皮轰然塌陷！那匹可怜的生灵四蹄深陷进黑色的泥炭浆液中，在濒死的癫狂恐惧中拼命扬起脖颈，从胸腔里爆发出一种近乎人类受难时那般凄惨绝望的狂暴悲鸣！它的双眼翻白，鼻孔中喷涌出血色的粗气；紧接着，一股令人作呕、无穷无尽的恐怖黏滞吸力从深不见底的泥渊深处狂暴涌出，无情地拉扯着它的前胸、鬃毛、以及扬起的马头，在短短不到六十秒的时间里，整匹骏马便被彻底拖入了淤泥地底，水面上唯余几个泛着幽绿油光的沼气水泡在咕嘟咕嘟地破裂！\n\n我闭上单眼，从目镜前挪开身子，后槽牙咬得咯咯作响。旋即，我再次将镜头精准地压回了斯台普吞的脸上。\n\n他甚至连眼皮都没有眨一下！他甚至连前行的步伐都未曾出现半秒的停顿！他就那样闲适地伫立在一道坚硬干燥的泥炭岩脊上，左手轻搭着那只绿色的捕蝶网，面带微笑、冷酷而抽离地注视着那匹高贵动物在死亡泥淖中受尽折磨的绝命挣扎，其神情宛如一个残忍顽劣的幼童在百无聊赖地端详着一只被钢针钉在软木上的金龟子！\n\n‘就是他，’我对着身下冰冷死寂的花岗岩峭壁发出了低沉的宣判，‘这就是我们的死敌。一个能够微笑着欣赏生命痛苦消亡的恶魔；一个被彻底剥离了人类同理心与道德底线的怪物；一个货真价实、登峰造极的高智商天生罪犯！’\n\n就在这时，镜头边缘忽然扫到了第二道沿着巴斯克维尔庄园驿道大步走来的身影。那是华生！他身披那件深褐色的粗花呢大衣，手中那根沉重的白蜡木手杖在身侧有力地挥动着。他显然是安顿好了亨利爵士，独自一人外出勘察庄园周边的地形环境。\n\n斯台普吞几乎在同一秒钟敏锐地捕捉到了华生的脚步声。镜头中凶手的面部表情发生了一场令人惊骇的剧变：方才那副冷血嗜杀的残暴面孔如潮水般退去，转瞬被换上了一副洋溢着少年般热情天真、纯良无害的学者笑容！他脱下头上的草帽热情地在半空中挥舞着，迈着欢快的步伐穿过石楠丛，在通往格林盆村的岔路口主动截住了我们那位忠厚老实的医生！\n\n我听不见他们交谈的字句，然而两人肢体语言的交锋却如展开的书页般一览无余。斯台普吞极具戏剧性地夸张欠身行礼，自我介绍，手中的竹竿夸张地指向远方的食人泥潭，又时不时指向巴斯克维尔庄园的高塔。他的脑袋如警觉的画眉般微微倾斜，每一个看似热情的发问，都在极其阴险地探查华生所掌握的实情底线！而华生——愿上帝保佑他的忠直灵魂！——正双手反剪在背后，下巴微扬，用那种他自以为极度老练圆融、实则一览无余的军人庄重辞令应付着对方的盘剥。\n\n然而，正当他们二人伫立交谈之际，远方泥潭驿道上一闪而过的白色裙裾，骤然扯动了我紧绷的神经！\n\n一名身披黑色披肩、长裙雪白的年轻女子，正如发疯的羚羊般推开梅立坪宅邸的大门，不顾一切地穿过石楠荒草，直奔华生所伫立的土坡狂奔而来！", "is_ending": false, "clues": ["斯台普吞踩着深埋在泥炭下方的秘密枯柳木桩，在吞噬一切的大格林盆泥潭中如履平地", "一匹误入沼泽的荒原矮种野马在挣扎中被烂泥活活吞噬，斯台普吞冷眼旁观，神情冷酷漠然", "斯台普吞主动在荒原岔路口拦截华生，极力刺探其与伦敦神探歇洛克·福尔摩斯的秘密关联"], "choices": [{"id": "h_ch7_p1_c1", "text": "调转镜头，紧盯贝丽尔·斯台普吞冒死拦截华生、发出绝望警告的惊险一幕。", "target": "holmes_ch07_part2_beryl_warning", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch7_p1_c2", "text": "【视角切换：杰克·斯台普吞】窥视凶手如何游刃有余地向华生假扮纯良无害的昆虫学家。", "target": "stapleton_ch07_part1_naturalist_act", "pov_switch": "stapleton", "pov_switch_name": "杰克·斯台普吞"}]}, "holmes_ch07_part2_beryl_warning": {"id": "holmes_ch07_part2_beryl_warning", "title": "第七章 梅立坪的斯台普吞兄妹（下：荒原惊魂与绝命告诫）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": null, "content": "我迅速拧动望远镜的焦距旋钮，将那名自荒原小径飞奔而来的年轻女子，稳稳锁定在高倍放大镜的最中心。\n\n那是一位美得令人窒息、甚至在整座纯朴粗粝的德文郡乡间显得格格不入的绝色丽人。与当地金发碧眼的萨克逊农家女子截然不同，她身材修长曼妙，生着一张古典高贵、带有迷人橄榄色光泽的异域鹅蛋脸。她那一头漆黑如瀑的卷曲长发在风中肆意飞舞，深邃如夜海的大眼睛里，正燃烧着一种濒临崩溃的疯狂焦灼。然而，在她那令人赞叹的惊艳面容之下，每一道肌肉线条里，都深深烙印着一种纯粹、原始、深入骨髓的极度恐惧！\n\n恰在此刻，斯台普吞似乎为了追逐一只罕见的灰斑蛾，佯装兴奋地快步跃下了一道背风的深芦苇凹地。就在他背对着大路的这一瞬间，那名女子如旋风般扑到了华生的身侧！\n\n她几乎不是在走，而是在扑向华生。她那白色的裙摆因剧烈的奔跑而沾满了泥浆，胸口在束胸衣下剧烈起伏，两只戴着黑蕾丝手套的纤细手掌，在极度的惶恐中死死抓住了华生粗花呢大衣的衣袖！透过高倍望远镜，我能清晰地读出她那张惨白双唇间以惊人语速吐露的每一串唇形：\n\n‘快逃！’她的唇形清晰得如在耳畔呐喊，‘今夜立刻乘车逃回伦敦去！只要你还珍惜自己的性命，就万万不要再在这座被诅咒的荒原上停留半步！’\n\n华生显然被这位从天而降的惊惶绝色女子彻底震懵了。他下意识地脱帽致意，正准备开口自报家门，但那名女子却以近乎绝望的急迫手势狠狠打断了他！她一边浑身战栗地回头瞟向斯台普吞消失的凹地，一边以近乎泣血的哀绝姿态死死抓着华生的手腕：\n\n‘你必须走！亨利爵士，我跪下来求你了——嘘！他回来了！求求你，看在上帝的份上，什么都别对他说！什么都别说！’\n\n就在那一刹那，斯台普吞手持绿色的长柄捕蝶网，脸上挂着纯良无害的学者笑容，从芦苇从后轻巧地一跃而上，重新出现在土坡之上。\n\n紧接着发生的一幕，成为了整桩阴谋中最具决定性、彻底为我打开案件核心暗锁的启示性瞬间！\n\n如果她当真只是他的亲生妹妹，那么在被兄长撞见自己与陌生男子秘密私语时，她的第一反应应当是面红过耳、尴尬退避、或是发出一声掩饰性的娇嗔失笑。然而，我透过镜片亲眼目睹的，却是一个备受严刑拷打的无助囚徒，在撞见冷血狱卒那一瞬间所爆发出的原始本能反应！\n\n她的双瞳在刹那间因极度的恐惧而放大到极致！她的螓首猛地垂下，原本死死抓住华生衣袖的双手如同触电般僵死地垂落身侧，整个人仿佛在一瞬间矮了半截，全身的每一根神经都在止不住地疯狂打颤——而此时的斯台普吞，正迈着轻快的步伐，嘴角噙着一抹戏谑而残忍的冷笑，徐徐朝他们踱步而来！\n\n‘哈！’我对着身前冰凉刺骨的黄铜镜筒，从喉咙深处吐出了一句沉重的断语，‘面具被撕碎了，杰克·斯台普吞！那绝不是一个胞妹面对怪癖兄长时的敬畏；那是一个长期遭受残酷家庭暴力与精神控制的可怜妻子，在残暴丈夫淫威下彻底被摧毁人格的绝望屈从！’\n\n镜头紧紧追随着接下来的哑剧表演：斯台普吞极其自然熟稔地同华生寒暄搭话，微笑着引介他这位‘性情孤僻的胞妹贝丽尔’；他的语调显然温和如春风，而站在他身旁的贝丽尔却整个人僵直如石雕，惨白的嘴唇紧紧抿成一条没有血色的死线，两只美丽而惊恐的黑眸死死钉在脚下的泥土里。华生一如既往地保持着无可挑剔的英国绅士风度，向女士脱帽鞠躬，礼貌地应允了前往梅立坪宅邸做客的邀请，旋即提着手杖，大步踏上了返回巴斯克维尔庄园的驿道。\n\n我没有将目光从目镜前移开哪怕一寸，直到那对所谓的‘兄妹’并肩步入梅立坪宅邸的大门。就在那扇厚重的黑橡木大门‘砰’的一声在身后合拢的同一瞬间，透过一楼起居室未拉窗帘的狭窄窗户，我捕捉到了极其令人发指的残暴一幕：斯台普吞的一只大手如铁箍般猛然探出，狠狠扭住那名可怜女子的纤细手腕，将她近乎粗暴地向二楼的楼梯死死拖拽而去！\n\n‘撑住，可怜的夫人，’我徐徐将望远镜收回鹿皮镜筒，在峰顶冰冷的烈风中低声自语，‘你的苦难即将走到尽头了。你那位自作聪明的残暴丈夫，如今已经彻底撞上了歇洛克·福尔摩斯的枪口——清算罪恶的那一天，很快就要降临在这片荒原之上了！’", "is_ending": false, "clues": ["贝丽尔·斯台普吞展现出极具异域风情的拉丁绝色容颜，但眼神中充斥着濒临崩溃的极度惊恐", "她误将身材端正的华生当成了新袭爵的亨利爵士，泣血哀求其立刻搭乘列车逃回伦敦保命", "福尔摩斯凭其面对斯台普吞时那种深植骨髓的恐惧断定：她绝非其胞妹，而是受其残酷胁迫的结发妻子"], "choices": [{"id": "h_ch7_p2_c1", "text": "静候卡特赖特送抵华生从庄园发出的亲笔密报，全盘推演巴斯克维尔宅邸动向。", "target": "holmes_ch08_watson_report", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch7_p2_c2", "text": "【视角切换：杰克·斯台普吞】窥视反派如何以甜言蜜语掩盖破绽，并对妻子施以恐怖惩戒。", "target": "stapleton_ch07_part2_beryl_blunder", "pov_switch": "stapleton", "pov_switch_name": "杰克·斯台普吞"}]}, "holmes_ch08_watson_report": {"id": "holmes_ch08_watson_report", "title": "第八章 华生医生的第一份报告（石屋幽光下的绝密信函）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": "anchor_first_report", "content": "进入十月之后，荒原的凄风苦雨在入夜后变得愈发狂暴，冰冷的狂风卷着成片的暴雨，狠狠抽打在史前石屋坚硬如铁的圆形花岗岩外壁上，发出阵阵沉闷的撞击声。然而在石屋内侧，在一排厚厚的泥炭板屏风遮挡下，一根白牛油蜡烛正散发着稳定而温暖的黄色火光。我身披水手粗呢厚大衣，双腿盘坐在羊毛毯上，嘴里紧紧咬着我那只漆黑的短柄陶土烟斗。\n\n平铺在我膝头上的，是整整四张写得密密麻麻的薄便签纸，上面的字迹工整、有力、刚劲挺拔，正出自约翰·H·华生医生之手。\n\n卡特赖特在日落两个小时后，宛如水獭破浪般涉水穿过泥泞的石楠丛，将这份密封的情报稳稳送达了我手中。这会儿，那个机灵的苦力小子正蜷缩在石屋角落厚厚的干羊齿草堆里，宛如一条疲惫的猎犬般发出了香甜轻微的鼾声。\n\n我轻轻抚平信纸的第一页，眼眸深处闪烁着由衷的欣慰与赞许。\n\n‘干得太漂亮了，华生！’我忍不住对着摇曳的烛火低声赞叹，‘真是个值得托付后背的得力臂膀！他的眼睛没有放过任何蛛丝马迹，他的笔尖也毫不吝啬墨水。’\n\n华生发来的这份第一阶段战地侦查报告，堪称一份登峰造极的绝妙情报摘要。以其一贯崇尚客观事实的军医本色，他极其详尽地记录了入驻巴斯克维尔庄园第一周以来发生的所有离奇变故：\n\n第一项：越狱的杀人魔塞尔登。军警封锁线搜寻无果后，正规军步兵连已经撤回了普林斯敦兵营，郡当局初步推断那个恶魔要么早已溺毙在格林盆泥潭深处的无底死沼里，要么已经侥幸逃窜到了南部沿海港口。然而华生敏锐地注意到，庄园宅邸内部却弥漫着一种诡异的极度紧张感：食品储藏室里的熏肉和干面包频频离奇失窃，而管家巴里摩尔太太的一双红肿泪眼，却暴露出她终日处于极度悲伤与恐惧之中。\n\n第二项：管家约翰·巴里摩尔的深夜诡祟异动。华生与亨利爵士连续两夜潜伏在二楼走廊漆黑的阴影中。接连两晚，在凌晨两点整，伴随着一阵沉重而刻意压抑的赤脚轻步声，那个蓄着黑胡子的高大管家手持一盏幽暗的铜烛台，悄无声息地溜过了他们的房门，潜入了走廊西端一间朝向荒原的空置客房。在那里，巴里摩尔将蜡烛高高举向窗前，面孔死死贴在冰冷的玻璃上，目光狂热地凝视着荒原漆黑一片的死寂夜幕，仿佛在苦苦等候着某种来自幽冥的回应信号！\n\n第三项：年轻爵士与贝丽尔·斯台普吞之间炽热危险的罗曼史。亨利爵士几乎不可救药地坠入了对梅立坪那位异域美人的疯狂爱河。他每日策马前往拜访，甚至同她在荒原的石楠小径上漫步私语。然而，就在昨天下午，荒原上却爆发了一场不可思议的暴烈冲突：亨利爵士情难自禁，试图在岩石旁握住贝丽尔的手并亲吻她。就在那一瞬间，原本潜伏在乱石后的杰克·斯台普吞如同发了疯的恶犬般猛然窜了出来，面色因暴怒而扭曲成铁青色，双眼喷火，用极其恶毒粗暴的污言秽语尖叫着勒令亨利爵士立刻放手，并发誓永远不许他再踏近他妹妹半步！然而仅仅过了两个小时，斯台普吞却又亲自登门造访巴斯克维尔庄园，为自己的‘冲动失态’向爵士进行了极其卑微下贱的谢罪道歉，并极其热情地力邀亨利爵士在近日内务必赏光光临梅立坪宅邸共进晚餐！\n\n我深深地倚靠在冰凉的弧形石壁上，一圈青蓝色的烟圈缓缓升腾，没入了屋顶的排烟石隙中。\n\n‘这些散落的拼图碎片，咬合得多么丝丝入扣啊！’我自言自语地冷笑道，‘华生对斯台普吞自相矛盾的乖戾举止百思不得其解。他竟然将其天真地归咎于一个自私兄长对即将失去相依为命的胞妹时爆发的病态占有欲！善良而单纯的华生啊！世间哪有一位寒酸落魄的乡村私塾教师，会拒绝自己的亲妹妹嫁给一位拥有世袭准男爵头衔、坐拥七十四万英镑庞大家产的名门望族？！这本该是全英格兰每一个钻营钻营之徒梦寐以求的通天捷径！那么，斯台普吞为何在看到另一个男人搂住她的腰肢时，会像狂犬病发作一样口吐白沫、彻底失控？’\n\n答案早已用人类最原始丑恶的本能写就。\n\n‘因为贝丽尔是他的合法妻子！’我对着石屋死寂的黑暗发出了冰冷的断语，‘那个畜生强迫自己的结发妻子隐匿身份，假扮成未婚的深闺碧玉，将她的绝世美貌当成最致命的淬毒诱饵，诱使年轻的亨利爵士一步步踏入荒原与泥潭绝境！然而，当猎物真正咬向诱饵的那一刻，那个恶棍体内恶毒的雄性占有欲却彻底压倒了他的伪装理智，迫使他如疯狗般狂噬受害者！’\n\n至于巴里摩尔在深夜窗前点燃的那盏诡异蜡烛？\n\n我转过头，望向门外风雨交加中巍峨伫立的花岗岩峰顶。‘巴里摩尔绝非凶手，’我心中了然，‘他是在向藏匿在岩岗深处的某个人传递信号。一个饥寒交迫、生命垂危、且深深牵动着巴里摩尔太太眼泪的落难者。华生，那不过是一出在庄严宏大的复仇悲剧幕布前同时上演的庸俗家庭小闹剧。今夜，我便要亲自登上黑色岩岗的绝壁之巅，亲眼看看——究竟是谁，在石楠丛深处回应着管家的烛火！’", "is_ending": false, "clues": ["华生书信详报：管家巴里摩尔每逢凌晨两点便手持蜡烛潜行至西侧偏廊窗前，向荒原深处打出神秘光信号", "亨利爵士对贝丽尔·斯台普吞一见钟情并热烈求爱，引发斯台普吞近乎疯魔的狂暴干涉", "福尔摩斯彻底坐实推论：斯台普吞的病态占有欲绝非源自兄妹亲情，而是丈夫对私有妻子的极端控制狂乱"], "choices": [{"id": "h_ch8_c1", "text": "午夜埋伏岩岗顶峰，追踪与巴里摩尔烛火相互呼应的荒原回应光号。", "target": "holmes_ch09_part1_midnight_watch", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch8_c2", "text": "【视角切换：约翰·H·华生】阅读华生在巴斯克维尔庄园壁炉旁写下的原汁原味的长篇第一纪实报告。", "target": "ch08_watson_report", "pov_switch": "watson", "pov_switch_name": "约翰·H·华生医生"}]}, "holmes_ch09_part1_midnight_watch": {"id": "holmes_ch09_part1_midnight_watch", "title": "第九章 荒原上的烛光（上：暗夜荧惑与亡命奔逃）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": "anchor_convict", "content": "格林盆村远方那座古老教堂的高耸钟楼，在夜空中沉闷地敲响了午夜十二点的沉重钟声。连绵的暴雨终于停歇，然而凛冽刺骨的狂风却依旧在高原上肆虐呼啸，将漫天低垂的阴云撕扯成一道道狰狞飞掠的黑色碎片。\n\n我整个人平趴在黑色岩岗最顶端平整的花岗岩石台上，身下垫着军用防水帆布，大倍率望远镜冰冷的黄铜目镜死死贴在我的眼眶上。两英里开外，巴斯克维尔庄园那片庞大深邃的阴暗建筑群，宛如一片在银灰色石楠浪涛中沉浮的黑色巨木方舟。\n\n骤然间，漆黑一片的庄园西侧山墙上，绽放出了一点微弱如豆的黄色火光！\n\n那是西翼顶层那间客房的窗户！火光在玻璃后微微晃动，一次、两次、三次——那是有人将蜡烛紧贴在窗棂上，用手掌遮挡着向外发出有节奏的呼应闪烁！\n\n我迅速转动望远镜的三脚架云台，将镜头向西横切过半英里外的荒原乱石堆，在那些布满黑苔藓的破碎花岗岩裂谷中急速搜寻。在长达数分钟的时间里，镜头中唯有一片令人窒息的死寂漆黑。然而，就在我扫过一座半塌陷的史前环形石头羊圈废墟时，一簇回应的微弱火星，骤然撕裂了黑暗！一根被火柴点燃的残破蜡烛头在石缝间微弱地亮起了十秒钟，旋即被一只粗糙的大手迅速捏灭！\n\n‘巴里摩尔的同谋终于现身了，’我低声冷语，‘就让我瞧瞧究竟是何方神圣在深夜领赏。’\n\n视线拉回庄园主楼，东侧的厚重边门无声地推开了一条缝隙。两道矫健敏捷的身影宛如出穴的猎犬般闪身跨上了石阶。透过高倍透镜，亨利爵士充满爆发力的挺拔步伐，以及华生医生那宽阔刚毅的军人肩膀，在惨白的微弱天光下一览无余。两人皆身披厚重的长款风衣，右手死死插在大衣口袋深处——那里显然握着上膛的左轮手枪！他们二人动作迅疾而警觉，借着岩石的阴影掩护，径直朝着半英里外那处亮起烛光的羊圈废墟突击包抄而去！\n\n局势瞬间滑向了极度危险的边缘！一旦这两个人与那名亡命徒狭路相逢，一场见血的生死火拼将不可避免！\n\n我的视线紧咬着他们前行的轨迹。羊圈废墟里的蜡烛再次被点燃了——那名潜伏者显然被数日的酷寒与饥饿折磨得丧失了最基本的警惕。就在亨利爵士与华生悄然摸索推进到距离羊圈不足三十步的关键时刻，狂风猛然撕裂了天际密布的阴云，一轮冷酷如银盘的深秋明月，将惨白清冽的月光暴烈地泼洒在整片花岗岩乱石堆上！\n\n一道人形如受惊的猿猴般猛然从石堆后一跃而起！\n\n在镜头惊人的高倍率放大下，那张面孔在月光下呈现出令人毛骨悚然的清晰全貌：一个身材枯瘦如柴、面目狰狞可怖的凶蛮恶汉！他生着一头乱如鸟窝的肮脏头发与浓密板结的大胡子，深陷的眼窝里燃烧着困兽垂死般的血红凶光，浑身上下散发着一种唯有被全人类追杀的孤狼才特有的残暴野性！他身上裹着一套破烂成条状、被荆棘撕扯得体无完肤的粗呢黄褐相间囚服，裤腿上厚厚包裹着风干硬化的黑泥炭浆！\n\n是塞尔登！那个让全伦敦市民闻风丧胆的诺丁山杀人狂魔！\n\n‘站住！’亨利爵士爆发出一声怒吼，猛然向前飞扑！塞尔登在狂怒中抓起一块海碗大小的坚硬花岗岩巨石，狠狠砸向追兵，巨石擦着华生的肩头在岩壁上砸得火星四溅！那个恶徒展现出了令人惊骇的猿猴般身手，单手一撑翻越过两米宽的深沟，连滚带爬地踩着嶙峋的峭壁，发疯般朝着荒原深处狂奔突围！\n\n华生毫不犹豫地拔出了阿达姆斯左轮手枪！两团耀眼的橘红色枪火骤然撕裂了黑夜，紧随其后的是两声宛如炸雷般的刺耳枪鸣！子弹尖啸着擦过花岗岩岩壁弹飞，但那个狡黠的亡命徒却毫发无损；他一个侧滚翻滑下了背风坡，转瞬间便彻底湮没在茫茫无际的花岗岩乱石迷宫之中！\n\n正当华生与亨利爵士懊恼地垂下手枪、在山脊上剧烈喘息之际……\n\n某种恐怖绝伦的事物，降临了。\n\n顺着自大格林盆泥潭方向刮来的凄厉阴风，一道低沉、幽远、充满无尽怨毒与暴戾的咆哮声，在夜空中幽幽升起——那声音起初如地底传来的空洞闷雷，继而节节攀升、撕裂云层，化作一声震撼天地、足以令每一块花岗岩石板都为之战栗的恐怖巨兽狂吼！那绝非寻常看门土狗的狂吠；也绝非纯种猎狐犬的悲鸣！那是一声混杂着远古嗜血野性与地狱复仇怒焰的凄厉哀嗥，在荒原苍穹下久久回荡、经久不息！\n\n我感到自己脖颈后方的每一根汗毛，在一瞬间根根倒竖而起！\n\n在两英里开外的山脊上，华生与年轻的亨利爵士如遭雷击般瞬间僵死在原地。透过镜头，我清晰地看见年轻的巴斯克维尔爵士一把死死抓住了华生的大臂，他那张英挺的面庞在月光下一瞬间褪尽了全部血色，惨白得宛如一具死尸！即便相隔数英里之遥，那种直击人类灵魂深处最原始梦魇的凄厉凶嚎，依然在刹那间将他们体内流淌的血液冻结成了冰渣！\n\n‘你们听到了吧，我亲爱的朋友们？’我趴在冰冷死寂的花岗岩绝壁上，右手缓缓扣紧了怀中军用转轮手枪冰冷的硬木握把，在迎面呼啸的阴风中低声宣誓，‘恶兽已经苏醒了！它已经顺着夜风，嗅到了巴斯克维尔家族血脉温热的气息！’", "is_ending": false, "clues": ["从岩岗顶峰俯瞰巴斯克维尔庄园窗前的微弱烛光，荒原乱石堆中立刻闪烁出一簇回应的火星", "证实接头者正是诺丁山杀人狂魔塞尔登——他实为管家夫人溺爱放纵的亲胞弟", "在华生与亨利爵士冒死搜山之际，一声震撼荒原的凄厉恶犬咆哮自大格林盆泥潭深处轰然炸裂"], "choices": [{"id": "h_ch9_p1_c1", "text": "在黑色岩岗巨石掩体后按兵不动，恪守绝密监视纪律，静观事态演变。", "target": "holmes_ch09_part2_figure_on_the_tor", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch9_p1_c2", "text": "【视角切换：约翰·H·华生】亲历持枪涉险、在伸手不见五指的荒原乱石中突击搜捕逃犯的惊魂时刻。", "target": "ch09_part2_moor_chase", "
