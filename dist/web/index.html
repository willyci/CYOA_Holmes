岩岗绝顶，双臂抱胸，居高临下俯瞰华生与亨利爵士", "华生在惊恐中骤然发现了这位遗世独立的神秘监视者，并朝着岩岗顶峰厉声喝问鸣枪", "福尔摩斯借岩石阴影如幽灵般潜入地底石屋，恪守铁律：在铁证如山之前绝不提前现身"], "choices": [{"id": "h_ch9_p2_c1", "text": "破译华生发来的绝密日记摘录，锁定带有‘L.L.’落款的神秘焚烧残信。", "target": "holmes_ch10_diary_and_laura", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch9_p2_c2", "text": "【视角切换：杰克·斯台普吞】窥视凶手如何摸黑涉过泥潭密道，向饥饿凶兽投喂鲜肉。", "target": "stapleton_ch09_part1_feeding_the_hound", "pov_switch": "stapleton", "pov_switch_name": "杰克·斯台普吞"}]}, "holmes_ch10_diary_and_laura": {"id": "holmes_ch10_diary_and_laura", "title": "第十章 华生医生的日记摘录（神秘女人L.L.的破译）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": "anchor_diary", "content": "次日清晨，呼啸了一整夜的荒原暴风雨终于迎来了短暂的宁静。几道惨白而温和的深秋阳光穿透了弥漫在山谷间的浓雾，将漫山遍野湿漉漉的石楠苔原，镀上了一层由赭红与碎金交织而成的绚丽绒毯。在史前石屋干燥的角落里，我盘坐在帆布行囊上，双眼如饥似渴地研读着卡特赖特拂晓时分摸索送上山巅的第二份华生亲笔密信。\n\n华生这一次的表现，简直超越了他以往所有的刑侦水准！在深夜窗前诡异烛火的强烈驱动下，他与年轻的亨利爵士在昨日清晨于巴斯克维尔庄园那间阴森的橡木图书室里，对管家巴里摩尔发起了一场教科书级别的严厉盘问。\n\n在两人出其不意的铁证逼视下，管家终于心理崩溃，痛哭流涕地招供出了蜡烛背后的全部实情：越狱的杀人魔塞尔登，正是巴里摩尔太太一母同胞的亲生幼弟，是她童年时代最宠溺心疼的骨肉亲人。那个可怜的妇人实在不忍心看着自己的亲生弟弟在寒风刺骨的花岗岩荒石堆中活活冻馁而死，这才由管家每夜暗中送粮接济。正如我最初那严密的病理心理学推断一模一样——这桩看似杀机四伏的凶案分支，不过是一出令人唏嘘的人间悲剧插曲。\n\n然而，正当华生穷追猛打、逼问巴里摩尔关于查尔斯爵士暴卒前夕的蛛丝马迹时，这位惊魂未定的管家，却道出了一条具有惊天动地威力的决定性线索！\n\n‘查尔斯爵士在遇害当晚走到栅门前，是为了去秘密会见一个女人！’巴里摩尔脱口而出。\n\n‘一个女人！’华生失声惊呼，‘哪个女人？！’\n\n‘小人不知道她的真实姓名，先生，’巴里摩尔颤抖着回答道，‘然而在爵士遇害那天的早晨，他收到了一封从库姆·特雷西村寄来的平信，上面的笔迹秀气娟秀，显然出自一位年轻体面的女士之手。在惨剧发生之后，我妻子在替爵士清理书房壁炉里的残灰时，从炉底的死灰中捡出了那封信的一块未被彻底焚化的残片！信身的主要内容早已被烈火化为灰烬，然而最底部那行用颤抖笔迹写下的附笔，却清晰可辨：\n\n“……求求您，看在您是一位真正绅士的份上，务必立刻将此信付之一炬，并在今夜十点整准时守候在水松夹道的栅门前。——L.L.”’\n\n信纸从我手中滑落至膝头，我的双眼在一瞬间迸发出宛如烧透焦炭般的骇人精光！\n\n‘L.L.！’我对着石壁从胸腔深处爆发出一声雷鸣般的低啸，‘L.L.！老天爷啊！这条贯穿了整桩阴谋的决定性黄金链条，终于在烈火与灰烬中浴火重铸了！’\n\n我猛然从行囊上一跃而起，在石屋狭窄的方寸之地内迅疾如风地来回疾走，我的大脑如同一台高速运转的精密差分机，以每秒数千次的速度疯狂检索着摩梯末手记与德文郡郡志名录中的每一个姓名、每一段流言蜚语！\n\n在整个库姆·特雷西教区乃至方圆数十英里内，究竟有谁的姓名缩写是L.L.？！\n\n华生在报告后半段写下的文字，以一种无可挑剔的严密逻辑为我奉上了答案。以其特有的军人执拗作风，华生在离开庄园后第一时间便密会了摩梯末医生。而这位对当地风土人情洞若观火的乡村医生，毫不犹豫地吐出了那个被尘封的名字：\n\n劳拉·里昂斯夫人（Mrs. Laura Lyons）。\n\n她是老弗兰克兰德唯一的掌上明珠——就是住在拉夫特庄园、那个整天痴迷于用天文望远镜窥探荒原、为了几条古代公共路权把全郡邻居告上法庭的诉讼狂老绅士。五年前，这位年轻貌美的姑娘因执意与一个身无分文、品行不端的蹩脚伦敦风景画家里昂斯私奔，被顽固的父亲当场断绝了父女关系扫地出门。婚后不久，那个恶棍画家便将她在伦敦始乱终弃，卷款逃逸，令她一度沦落到了濒临冻饿自尽的绝境。万般无奈之下，她唯有辗转返回德文郡，在仁慈的查尔斯·巴斯克维尔爵士及几位乡绅的慷慨资助下，在库姆·特雷西集镇上开办了一家维持基本温饱的打字事务行。\n\n‘一个身世凄楚、走投无路、却又生得倾国倾城的绝色尤物，’我在石屋狭窄的地面上重重挥动铁拳，掌风呼啸，‘一个迫切渴望摆脱无赖丈夫纠缠、急需一笔巨款办理合法离婚手续的可怜女人；一个在经济上完全依赖查尔斯爵士慈善施舍的弱女子；而最致命的是——一个恰好居住在杰克·斯台普吞每周必定借标本采购之名频繁光顾的集镇上的女人！’\n\n整场阴险毒辣到了极点的魔鬼杀人布局，宛如一道刺破黑夜的万丈狂雷，在我脑海中彻底轰然引爆！\n\n斯台普吞在暗中疯狂追求着劳拉·里昂斯！他用虚伪的甜言蜜语编织了一场海枯石烂的爱情骗局；他信誓旦旦地向她许诺：只要她能筹得巨资与那个恶棍丈夫办妥离婚手续，他便会立刻迎娶她为明媒正娶的夫人！然而，在严苛的大英帝国婚姻法下，一场贵族级的离婚诉讼需要数以百计的昂贵法庭诉讼费！于是，斯台普吞极其阴险地暗中指使并起草了那封信，诱骗这个深陷情网的可怜女人向她最仁慈的庇护人查尔斯爵士写信求援，并利用老人对她名节的爱护，诱骗老人在午夜十点孤身一人守候在幽暗无人的水松夹道栅门前！\n\n紧接着——便是这个恶魔最残暴冷酷的致命杀招！\n\n在诱使劳拉·里昂斯寄出那封绝命信之后，斯台普吞却在当天傍晚突然以某种冠冕堂皇的借口，严厉制止了她赴约！他向她虚伪地保证自己已经筹措到了款项，亲自去替她向爵士致谢周旋。在稳住了那个被蒙在鼓里的可怜女人之后……这个冷血的凶手，便牵着他那只涂满剧毒磷光溶剂的嗜血魔兽，悄然潜伏到了水松夹道的木门外，将死亡的咽喉，狠狠扼向了在黑暗中苦苦守候的老绅士！\n\n‘全案告破！’我对着石屋高耸的锥形穹顶爆发出了一声痛快淋漓的怒吼，‘卡特赖特！立刻收拾行囊！备好马车！我们直扑库姆·特雷西村！在今天的夕阳坠入地平线之前，我要让劳拉·里昂斯亲手撕碎杰克·斯台普吞脸上那副伪善的人皮面具！’", "is_ending": false, "clues": ["华生严厉审讯管家巴里摩尔：证实查尔斯爵士在遇害当夜系收到一封女性来信秘密赴约", "壁炉灰烬残片中拼凑出绝密字条：‘……看在您是位绅士的份上，务必烧毁此信，十点整守候栅门前。——L.L.’", "摩梯末医生协助破译：‘L.L.’正是库姆·特雷西村老弗兰克兰德那离家出走、惨遭弃市的独生女劳拉·里昂斯夫人"], "choices": [{"id": "h_ch10_c1", "text": "驱车直奔库姆·特雷西村，当面质询劳拉·里昂斯夫人，粉碎斯台普吞的谎言锁链。", "target": "holmes_ch11_part1_lyons", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch10_c2", "text": "【视角切换：杰克·斯台普吞】窥视凶手如何凭借伪造的婚约与虚伪甜言死死封锁劳拉之口。", "target": "stapleton_ch10_coombe_control", "pov_switch": "stapleton", "pov_switch_name": "杰克·斯台普吞"}]}, "holmes_ch11_part1_lyons": {"id": "holmes_ch11_part1_lyons", "title": "第十一章 岩岗上的人（上：击碎谎言与劳拉的泣诉）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": null, "content": "库姆·特雷西集镇静静坐落在一处距离荒原东北方向约五英里、背风幽静的狭长峡谷深处。当天下午两点整，我换下了那身粗糙油腻的水手粗呢工装，换上了一套干净整洁的深色粗花呢常礼服，端坐在劳拉·里昂斯夫人那间陈设简朴的打字行起居室里。\n\n这位年轻的妇人生得极其美艳动人，一双明艳动人的榛色大眼睛在纤巧秀美的鼻梁两侧顾盼生姿，浓密的深黑色卷发高高挽在优美白皙的天鹅颈上，白里透红的娇嫩面庞透着名门闺秀特有的高贵气质。然而，从她那微微紧抿的薄唇线条，以及十指在膝头神经质般不受控制的痉挛性抽动中，无一不暴露出这名可怜女子长期生活在何等令人窒息的精神重压之下。当我表明自己的侦探身份、并直截了当提及查尔斯·巴斯克维尔爵士的猝死惨案时，一道剧烈的绝望惊骇如电光般猛然从她的面庞上掠过！\n\n‘我所知晓的一切，早已一五一十向华生医生全盘托出了，’她下巴高高昂起，极力维持着被逼入绝境时的最后自尊，‘查尔斯爵士是一位对我恩重如山的高尚长者。正是他仁慈出资帮助我开办了这家维持温饱的打字行。除此以外，我与他老人家绝无任何私下瓜葛！’\n\n‘里昂斯夫人，’我身子微微前倾，那双冰冷彻骨的灰色鹰隼眼眸死死锁定了她的视线，‘你此刻正在玩火自焚！郡验尸法庭那场走过场的平庸听证会是一回事；而苏格兰场即将发起的蓄意谋杀刑事指控则是另一回事！如果你继续在虚假的谎言迷宫中顽抗，不出四十八小时，你就会作为谋害查尔斯·巴斯克维尔爵士的事前从谋重犯，被戴上手铐押上老贝利法庭的被告席！’\n\n她脸上的血色在一瞬间褪得干干净净，惨白如纸：‘谋杀？！法医早已断定是心脏衰竭自然死亡！’\n\n‘那是谋杀，夫人！一场精心策划、冷血残暴到了极点的蓄意谋杀！而你——正是凶手用来将那位善良老人诱入死地的一把淬毒凶刃！’\n\n‘不！不！当着全能上帝的面，我敢对着自己的灵魂发誓，我绝无半点谋害爵士的歹念！’\n\n‘既然如此，你为何在查尔斯爵士遇害当天的清晨，用急迫的语气给他写信，乞求他在午夜十点整私自守候在水松夹道的偏僻木门前赴约？！’\n\n她发出一声窒息般的悲咽，双手掩面，两肩在剧烈无声的抽泣中颤抖如风中落叶。整座房间里，唯有壁炉架上发条座钟那单调沉闷的滴答声在死寂中回响。\n\n‘我当时快要被逼疯了，’她透过指缝，声音沙哑微弱，‘我那顽固的父亲断绝了与我的一切骨肉亲情；而我在伦敦那个禽兽不如的恶棍丈夫，却公然写信威胁要回到德文郡，依据婚姻财产法强行剥夺我这家小店的所有微薄血汗收入！有人向我进言：只要我能筹得一笔高昂的法庭诉讼费，便能彻底斩断这段地狱般的婚姻，重获清白自由之身！在万般走投无路之下，我唯有向查尔斯爵士骑士般的仁慈孤注一掷！’\n\n‘是谁暗中指使你向查尔斯爵士写信借钱的？’\n\n她的呼吸一滞，眼神惊惶失措地飘向紧闭的房门：‘一……一位热心帮助我的至交挚友。’\n\n‘一位名叫杰克·斯台普吞的“挚友”！’我猛地一掌拍在面前的橡木小茶几上，爆发出雷霆般的断喝！\n\n她整个人剧烈战栗，发出一声短促的尖叫，身子如被重锤击中般重重撞在椅背上。\n\n‘看着我，里昂斯夫人！’我的声音压得极低，却带着一种不容置疑的审判威权，‘你天真地坚信那个恶魔深爱着你！你痴心妄想着只要你办妥了离婚手续，他便会明媒正娶迎娶你过门，让你重回体面上流社会的怀抱！你此刻死死抓着的，是一根悬在万丈坟墓上方的剧毒蛛丝！’\n\n‘他爱我！’她突然失控地尖叫起来，泪水如断线珍珠般从那双绝美的榛色眼眸中汹涌而出，‘他当着上帝的面对我发过一万次誓言！他是单身贵族；与他同住的只有他的亲妹妹贝丽尔——’\n\n我冷笑一声，伸手探入大衣内侧口袋，取出一张折叠平整的加盖公章法律文书，狠狠拍在了她面前的茶几上！\n\n‘这是七年前哥斯达黎加圣何塞圣佩德罗天主教堂正式登记造册的结婚公证书影印件！上面清清楚楚、白纸黑字地铭刻着原籍约克郡的杰克·范德勒先生，与当地名媛贝丽尔·加西亚小姐结为神圣夫妇的永恒契约！而这第二份文件，则是约克郡那所破产私塾的原始招生简章——上面印着范德勒先生及其“迷人的拉丁裔贤内助贝丽尔夫人”的半身肖像版画！’\n\n劳拉·里昂斯的双眼死死黏在那些盖有朱红火漆印鉴的铁证文书上。她的瞳孔在刹那间放大到了非人的极限，下巴颓然脱落，整张脸上甚至连最后一丝生命的血色都彻底被抽空，整个人宛如一具由大理石雕琢而成的冰冷僵尸！\n\n‘他的……妻子？！’她的喉咙里挤出了一阵近乎撕裂的破音，‘贝丽尔竟然是他的合法结发妻子？！’\n\n‘正是他的结发妻子！’我毫不留情地用真理的利刃剖开脓疮，‘他之所以逼迫自己的妻子对外伪装成未婚胞妹，是因为一个待字闺中的异域绝色尤物，在他贪婪的血腥掠夺棋局中，是一张百试百灵的夺命王牌！当他用虚伪的海誓山盟哄骗你在信纸上写下绝命附笔之时，他的正牌夫人就在隔壁的房间里，冷眼旁观着你跳入他精心编织的死亡陷阱！’\n\n一声令人脊背生寒、毛骨悚然的凄厉狂嚎，骤然从这位绝望美人的胸腔中爆发开来！那是一声混杂着至高自尊被践踏的剧痛、真挚爱情被背叛的绝望、以及滔天杀意复仇怒焰的尖啸！她霍然从椅子上一跃而起，两只粉拳捏得指节发白，眼底燃烧着宛如复仇女神般的熊熊烈火！\n\n‘那个恶魔！那个灭绝人性的卑鄙懦夫！’她全身剧烈颤抖，牙齿咬得咯咯作响，‘他利用了我！他竟然利用我对自由的绝望渴望，亲手谋害了那位像圣徒一样仁慈无辜的老爵士！’\n\n‘把全部实情交代出来，里昂斯夫人，’我温和地将木椅推到她身前，‘只要你向法庭吐露真相，大英帝国的法律必将成为你坚不可摧的庇护所。’\n\n她无力地瘫软回椅背上，滚烫的泪水洗刷着她惨白的面庞。‘那封信全是他亲口逐字指使的，福尔摩斯先生！每一个字都是他逼我写的！他说查尔斯爵士为了避嫌，绝不肯在大白天登门给年轻女子送钱；唯有在深夜的偏僻栅门前私会，老爵士才会毫无顾忌地奉上那笔昂贵的离婚律师费！然而——就在当天下午四点！斯台普吞突然神色匆匆地闯进了我这间屋子！他向我信誓旦言地说他的绅士尊严绝不容许别的男人替我赎身！他发誓他已经亲自筹措到了这笔巨款，并逼着我手按《圣经》发下毒誓：当晚十点整绝不许踏进巴斯克维尔庄园半步！’\n\n‘于是你便留在家里了？’\n\n‘我当晚一直待在这间屋里，甚至在祷告中向上帝感激他那“高尚无私的慷慨”！直到第二天清晨，噩耗传来，查尔斯爵士倒毙在水松夹道……斯台普吞面无人色、双眼如血炭般再次闯了进来！他就站在你此刻伫立的位置，恶狠狠地威胁我说：一旦我敢向任何人吐露那封信的半个字，郡警察局就会立刻以谋杀罪将我逮捕绞死！他说我的绝对沉默，是他也是我唯一能活命的护身符！’\n\n我站起身，优雅地戴上了软呢帽：‘你已经履行了作为守法公民的最高天职，里昂斯夫人。你刚刚亲手将绞刑架上的夺命绞索，套在了那个杀人恶魔的脖颈上！安心留在这间屋里，不要向任何乡邻透露半句风声；相信我——用不了多久，法律与正义就会彻底替你向杰克·斯台普吞清算所有的血债！’\n\n我大步流星迈出打字事务所，推开厚重的橡木大门，秋日清澈凛冽的狂风迎面扑来，吹拂着我滚烫的胸膛。这条横跨数月的血腥杀人证据链，如今已被我彻底锻造合龙！而在那片暮色降临的苍茫荒原绝壁之上，我那忠诚勇敢的华生，此刻正严阵以待，守候在我们那座高耸的史前石峰鹰巢之中！", "is_ending": false, "clues": ["在库姆·特雷西打字事务所当面质询劳拉·里昂斯夫人，逼其招供致查尔斯爵士绝命信真相", "当场出示约克郡私塾档案与哥斯达黎加天主教婚书，证实斯台普吞与贝丽尔系合法夫妻", "劳拉痛哭招供：斯台普吞以许诺婚约为诱饵逼其写信，却在最后时刻严厉禁止其赴约，暗中纵犬行凶"], "choices": [{"id": "h_ch11_p1_c1", "text": "策马穿过暮色苍茫的荒原，返回黑色岩岗石屋与摸索而来的华生正面对决。", "target": "holmes_ch11_part2_stone_hut", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch11_p1_c2", "text": "【视角切换：约翰·H·华生】以华生医生的第一人称视角搜查神秘石屋并拔枪设伏。", "target": "ch11_part2_stone_hut", "pov_switch": "watson", "pov_switch_name": "约翰·H·华生医生"}]}, "holmes_ch11_part2_stone_hut": {"id": "holmes_ch11_part2_stone_hut", "title": "第十一章 岩岗上的人（下：石屋对峙与故友重逢）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "anchor", "anchor_name": "anchor_man_on_tor", "content": "夕阳在达特荒原西侧那起伏如巨浪的花岗岩山脊后缓缓沉没，将整片苍茫的天穹泼洒成一片由猩红与熔金交织而成的壮烈血海。刺骨的凛冽严霜随着夜风悄然降临在石楠荒原之上，而我正踏着轻快的步伐攀登黑色岩岗陡峭的石缝天梯。从库姆·特雷西村跋涉数英里而来的双腿虽感疲惫，然而我的灵魂却在胜利的狂喜烈焰中振翅高翔！\n\n整座宏大阴谋的每一块散落拼图，如今都已被我严丝合缝地嵌入了它命定的凹槽！\n\n然而，正当我猫着腰悄然接近史前石屋那道低矮的门洞时，清冽刺骨的晚风中飘来的一丝极其微弱的气味，猛然刺动了我的嗅觉神经！\n\n我的脚步在一瞬间钉死在门外的花岗岩石台上。\n\n那是一种极其清雅芬芳的特制土耳其卷烟香气——那是唯有在伦敦牛津街‘布拉德利’烟草行才能买到的高档拉塔基亚与弗吉尼亚混合烟丝！\n\n在深邃的夜色中，我的嘴角缓缓绽放出一抹由衷的温暖笑意。在整个英格兰西部的广袤原野上，唯有一位正直高尚的英国绅士，才会随身携带着这种印有特定防伪标记的雅致卷烟！\n\n‘华生终于循着蛛丝马迹找到我的巢穴了，’我在心底涌起一股深沉的战友挚情，‘这只忠诚执拗的老猎犬，到底还是把我给刨出来了！’\n\n我悄无声息地迈过冰冷的花岗岩门槛。石屋内侧，浓稠如黑丝绒般的夜色笼罩了一切。在泥土地面中央那块充当书桌的平整花岗岩石板上，摆放着我的马口铁水壶、半块粗麦面包、以及卡特赖特用铅笔写下的一张字条：‘华生医生已前往库姆·特雷西’。\n\n紧接着，在石壁最深邃的漆黑阴影深处，猛然爆发出了一声极其刺耳、清脆而决然的金属咬合声——那是一支军用阿达姆斯左轮手枪撞针被狠狠扳开、压上待发击铁的致命动静！\n\n‘真是个可爱的黄昏，我亲爱的华生！’我倚着低矮的门框，神情自若地划燃了一根黄磷火柴。\n\n一声混杂着极度惊骇与不可思议的失声狂呼，骤然从黑暗中炸裂开来！火柴的亮黄色火苗在黑暗中跳跃闪烁，清晰地照亮了我那标志性的鹰钩鼻、粗花呢鸭舌帽、以及嘴角噙着的那抹爽朗笑意。\n\n只见在那块平整巨石后方的阴影里，一个黑洞洞的左轮手枪枪口原本死死指着我的心脏，而握着手枪蹲伏在地的，赫然正是约翰·H·华生医生！\n\n‘福尔摩斯！’他失声大叫，整个人猛地从地上一跃而起，下巴惊得几乎掉在地毯上，原本叼在嘴角的半截卷烟‘啪嗒’一声滑落进了羊齿草堆里，‘福尔摩斯！天哪！我的上帝啊！这……这怎么可能？！’\n\n‘绝无第二种可能，我最亲爱的朋友，’我微笑着大步迈入石屋，向他伸出了右手，‘而且，你的到访从来没有像今夜这般令人欢欣鼓舞！’\n\n华生一把狠狠抓住了我的右手，其握力之大险些将我的指骨捏碎。在摇曳的火光下，他那张饱经风霜的古铜色硬汉面庞，在一瞬间化作了无数激烈情感交织的战场：起初是由衷的狂喜与宽慰，继而化作军人被蒙在鼓里的严厉责问，最终凝固成一种遭到挚友戏弄后的愤懑与委屈！\n\n‘你一直都在这里？！’他用颤抖的手指指着我的行军毯、陶土烟斗和罐头盒，结结巴巴地质问道，‘你就是那个在满月下伫立在山巅、我开枪射击的岩岗幽灵？！你竟然让我一直以为你安然留在伦敦？！你竟然让我每天绞尽脑汁给你写那些长篇累牍的侦查密报——’\n\n‘而你的每一封密报中的每一个字，都对我起到了无可估量、扭转乾坤的至高价值！’我一把按住他的肩膀，用力晃了晃，语气无比真挚而严肃，‘听我说，华生！你有权对我发火，但对着全能的上帝起誓，我的隐瞒是唯一能够保住亨利爵士性命的战略王牌！如果你知晓我就潜伏在侧，你对我的忠诚与敬意会在瞬间出卖你！你眼神的每一个微小变化、你语气的每一次细微波动、甚至你在碎石路上迈出的每一步步伐，都会在二十四小时内被狡诈如狐的斯台普吞洞若观火！那只剧毒的蜘蛛会立刻缩回泥潭的最深处，而我们将永远丧失在案发现场人赃俱获将他送上绞刑架的绝佳战机！’\n\n华生深深地注视着我如烈火般灼灼的双眼，眼底的委屈与怒火如晨雾遇骄阳般彻底冰释融化。\n\n‘你……你抓住那个幕后真凶了？’他以近乎敬畏的耳语急切问道。\n\n‘他此刻已经稳稳落在我的手掌心之中了！’我拉着他在羊齿草毯上并肩坐下，压低声音道，‘听着，华生：贝丽尔·斯台普吞绝非他的亲妹妹——她是他的合法结发妻子！劳拉·里昂斯夫人正是那个被蒙在鼓里、将查尔斯爵士引诱至死亡栅门的无辜诱饵！而那个所谓的博物学者杰克·斯台普吞，他的真实身份——正是老查尔斯的亲弟弟罗杰·巴斯克维尔遗留在南美的亲生儿子！他是巴斯克维尔家族货真价实的合法继承人！’\n\n华生倒吸了一口凉气，在石屋幽暗昏惑的阴影中难以置信地瞪大了双眼。\n\n然而，还没等他来得及吐出下一个字……\n\n一道撕裂夜空的恐怖凄厉惨叫，骤然在漆黑如墨的荒原绝壁上炸裂开来！", "is_ending": false, "clues": ["黄昏返回黑色岩岗，敏锐察觉史前石屋内残留布拉德利卷烟气息与华生伏击痕迹", "在夕阳熔金的花岗岩门洞前从容道出经典问候：‘真是个可爱的黄昏，我亲爱的华生！’", "两名老战友在石屋内会师：将劳拉绝命信口供与斯台普吞假兄妹真夫妻的铁证彻底合龙"], "choices": [{"id": "h_ch11_p2_c1", "text": "在石屋昏黄烛光下向华生彻底复盘全案因果，迎接荒原惨剧爆发前的致命倒计时。", "target": "holmes_ch12_part1_revelations", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch11_p2_c2", "text": "【视角切换：杰克·斯台普吞】窥视凶手在沼泽小径上用旧靴铺设气味追踪线的恶毒步骤。", "target": "stapleton_ch11_part2_setting_scent", "pov_switch": "stapleton", "pov_switch_name": "杰克·斯台普吞"}]}, "holmes_ch12_part1_revelations": {"id": "holmes_ch12_part1_revelations", "title": "第十二章 沼地的惨剧（上：峭壁惊魂与绝望悲鸣）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": "anchor_revelation", "content": "那声撕裂了达特荒原死寂夜空的惨叫，完全不同于我在伦敦历经的所有谋杀现场所听闻过的任何声音。那绝非人类愤怒或求救的呼喊；那是一声由纯粹绝望与极致肉体痛楚撕扯出的濒死哀嗥——凄厉尖锐的惨嚎在山谷间疯狂爬升，旋即在一种窒息般咳血的咯咯声中戛然而止！\n\n我和华生宛如遭受了高压电击般从羊齿草毯上霍然弹起！\n\n‘那……那是什么声音？！’华生满脸煞白，声音剧烈颤抖。\n\n‘是恶犬！’我厉声大吼，一把抄起手边的粗橡木手杖，另一手以雷霆万钧之势拔出了腰间的阿达姆斯左轮手枪，‘天哪，华生，跑起来！快跑！’\n\n我们连滚带爬地钻出低矮的史前石屋门洞，一头扎入了伸手不见五指的漆黑荒野！浓密的夜雾正从泥潭边缘急剧升腾，暴风撕扯的浓云彻底遮蔽了月光。在周围那些如犬牙交错的花岗岩乱石堆中，我们的视野甚至不足十码！\n\n紧接着，那道可怖的声响再度炸裂开来！\n\n声音来自我们左侧高耸的花岗岩山脊——一声浑厚、狂暴、宛如远古巨兽般的地狱咆哮，几乎要将整片夜空撕成碎片！而在那恐怖长嗥的正下方，顺着夜风传来的，赫然是一个人类在黑夜乱石中亡命狂奔时那如同拉风箱般急促绝望的喘息声与碎石崩裂声！\n\n‘它追上他了！’我一边飞跃过一道深达数英尺的岩石裂隙，一边声嘶力竭地狂吼，‘这边，华生！看在上帝的份上，再快点！’\n\n我们二人宛如发了狂的野兽般在崎岖坎坷的石楠丛中拼命冲刺。冰冷的冻霜让每一块花岗岩都湿滑如油，我两次重重地单膝砸在坚硬的乱石上，膝盖被撞得鲜血淋漓，却根本顾不上疼痛，连滚带爬地再次向前狂奔！我的心脏宛如一柄疯狂擂动的铁锤，重重砸击着我的肋骨。\n\n‘如果倒下的人是亨利爵士，’一股前所未有的剧烈自责与悔恨如毒药般噬咬着我的理智，‘那么他的鲜血就将彻底溅在我的手上！我算计得太深了！我权衡得太细了！我一心想要拿到无可辩驳的法庭铁证——然而就在我自鸣得意地编织罗网之时，恶魔却已然抢先下了杀手！’\n\n在我们正前方，黑色岩岗那座高达四十英尺、直插云霄的花岗岩垂直绝壁骤然拔地而起，绝壁下方是一片布满锋利崩塌巨石的巨大深谷！\n\n就在我们狂奔冲上山脊绝顶的同一瞬间，最后一声撕裂肺腑、令人肝胆俱裂的凄厉绝望尖叫，自我们脚下的万丈深渊中轰然回荡而起！\n\n紧接着，是一记沉闷、令人毛骨悚然的重物坠地撞击声——那是沉重的血肉之躯以惊人速度砸在锋利花岗岩巨石上发出的可怕闷响，伴随着骨骼寸寸碎裂的渗人破裂声！一声微弱悠长的垂死呻吟在风中滑落……旋即，整座荒原陷入了一片宛如停尸房般的死寂！\n\n恶犬的咆哮停息了。整座荒原安静得如同千年的坟冢。\n\n‘他死了，’华生瘫软在悬崖边缘的一块怪石旁，胸膛剧烈起伏，大口大口地喘着粗气，‘我们来晚了，福尔摩斯……我们彻底来晚了！’\n\n‘就算是死，我也必须亲眼看到最坏的真相！’我咬牙切齿地从牙缝中挤出这几个字，‘走，华生！东侧裂隙有一条通往谷底的泄洪石道！’\n\n我们二人双手紧紧平举着大口径转轮手枪，拇指死死扣住击铁，借着微弱的天光，沿着险峻湿滑的乱石峭壁，一步步向那片弥漫着死亡气息的黑色谷底摸索潜行！", "is_ending": false, "clues": ["在石屋内向华生彻底复盘斯台普吞利用恶犬谋害亲族、夺取巨额遗产的完整作案逻辑", "一声充斥着濒死绝望与极度痛苦的人类凄厉惨叫，骤然从近在咫尺的花岗岩绝壁上传来", "凶兽狂暴嗜血的浑厚咆哮声如闷雷般在黑夜中隆隆回荡，宣告惨剧已然爆发"], "choices": [{"id": "h_ch12_p1_c1", "text": "拔出手枪在乱石嶙峋的漆黑荒原上狂奔冲刺，直扑惨叫与恶犬狂吠处！", "target": "holmes_ch12_part2_selden_death", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch12_p1_c2", "text": "【视角切换：杰克·斯台普吞】窥视凶手在沼泽深处为恶犬涂抹发光磷药并纵犬扑杀的狂乱瞬间。", "target": "stapleton_ch12_part1_screams_on_crags", "pov_switch": "stapleton", "pov_switch_name": "杰克·斯台普吞"}]}, "holmes_ch12_part2_selden_death": {"id": "holmes_ch12_part2_selden_death", "title": "第十二章 沼地的惨剧（下：囚徒之死与正面对决）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": null, "content": "在那道笔直陡峭如刀削般的花岗岩垂直绝壁正下方，在两块巨大的坠石夹缝深处，扭曲地倒卧着一堆深色的人形衣物。\n\n华生率先冲到了那堆衣物前。他迅速划燃了一根黄磷火柴，用颤抖的手掌死死护住微弱的火苗。\n\n昏黄跳动的火光，照亮了一双呈现出极其可怖、完全违反人体生理结构的畸形扭曲双腿，一截彻底折断的颈椎，以及一件剪裁考究、质地精良、泛着极具辨识度红褐色光泽的加拿大粗花呢猎装！\n\n‘亨利爵士！’华生发出一声凄厉至极的悲号，重重双膝跪倒在冰冷的碎石地上，热泪瞬间夺眶而出，‘哦，福尔摩斯！是亨利爵士啊！那个高尚、勇敢、慷慨的年轻人！’\n\n一股排山倒海般的冰冷眩晕与剧烈干呕，瞬间席卷了我的整个大脑。我整个人无力地瘫坐在湿冷的乱石堆上，双手死死捂住了面孔。在那一刹那，我所有的智力虚荣、所有对我严密科学推理法则的自负与骄傲，仿佛在一瞬间被现实击得粉碎！我竟然在与一个活生生的地狱恶魔玩弄自鸣得意的智力游戏；我竟然拿一条年轻无辜的生命作为下注的棋子；而我——彻底输了！\n\n‘把他的尸体翻过来，华生，’我的声音沙哑、干涩得宛如砂纸摩擦，‘让我最后看一眼他的面容。’\n\n华生颤抖着伸出双手，抓住倒卧死者的宽厚肩膀，将那颗歪斜折断的头颅缓缓翻向火柴的微光。\n\n我划燃了第二根火柴。\n\n耀眼的火光在一瞬间照亮了死者那张沾满血污的面孔。而在看清那张脸的百分之一秒内，一声惊天动地、混杂着无尽狂喜与解脱的狂暴长啸，骤然从我的胸腔深处轰然炸响！\n\n不是亨利·巴斯克维尔爵士！\n\n那张面孔宽阔、粗鄙、凶蛮到了极点！前额极低，生着一双暴虐如野兽般的下吊眼，参差不齐的黄牙在临死前的狂怒咆哮中森森外露，而那满脸杂乱如草窝的大胡子上，厚厚包裹着风干硬化的黑泥炭与暗红色的脑浆！\n\n‘塞尔登！’我大笑着从地上一跃而起，状若癫狂地狠狠抓住华生的双肩用力摇晃，‘是塞尔登！那个从普林斯敦监狱逃出来的诺丁山杀人狂魔！’\n\n华生目瞪口呆地死死盯着地上的尸体，一双眼珠险些从眼眶里瞪出来：‘塞尔登？！看在上帝的份上，他怎么可能身穿亨利爵士这套独一无二的红褐色粗花呢猎装？！’\n\n‘是衣服，华生！是衣服救了亨利爵士的命！’我激动得热血沸腾，指尖狠狠戳向死者身上的粗呢面料，‘难道你忘了巴里摩尔的招供吗？！亨利爵士入驻庄园后，将自己换下的旧衣服赏赐给了管家，而巴里摩尔转手就把这套昂贵御寒的猎装偷偷送给了在荒原上挨饿受冻的小舅子！那只在诺森伯兰饭店失窃的旧黑皮靴！那只浸透了亨利爵士汗液与体味的旧皮靴！斯台普吞让恶犬嗅了旧靴子的气味，在今夜纵犬搜山猎杀！恶犬在乱石中精准锁定了这套沾满爵士体味的红呢大衣，一路狂吠追杀，把这个可怜的替死鬼生生逼下了四十英尺高的万丈绝壁！’\n\n就在这一瞬间，东侧两百码开外的怪石阴影深处，忽然亮起了一点摇曳晃动的昏黄灯光。一个人正手提防风马灯，脚踩碎石，鬼鬼祟祟地向深谷摸索而来。\n\n‘嘘！’我发出一声毒蛇吐信般的极速低嘶，一把将华生扯入了绝壁下方浓重的石阴之中，‘恶犬的主人亲自赶来验尸了！握紧你的转轮手枪，但切记——一句话也别说，一切交由我来应对！’\n\n碎石被踩碎的沉闷脚步声越来越近。马灯昏黄的光晕终于扫过了地上那具扭曲惨死的尸体。在灯光背后，赫然露出了杰克·斯台普吞那张泛着惨白冷光的尖削面孔。\n\n他的呼吸沉重急促，眼神中翻滚着大仇得报、巨额遗产唾手可得时的狂乱狂喜！他将马灯高高举过头顶，贪婪而兴奋地俯身端详着那具红呢大衣尸体：\n\n‘亨利爵士？’他的声音因极度的激动而发颤，贪婪地盯着那套衣服，‘亨利·巴斯克维尔爵士？’\n\n‘不，斯台普吞先生，’我双手插在大衣口袋里，从容不迫地自巨石阴影中迈步而出，稳稳踏入了马灯的光圈正中心，‘很遗憾，这不是亨利爵士。这只是一位在黑夜中不慎失足坠崖、摔断了颈椎的可怜逃犯。’\n\n斯台普吞手中的马灯猛地向下一坠，险些砸在地上！\n\n在整整五秒钟的时间里，这个男人宛如被五雷轰顶般僵死在原地！他的下巴彻底脱臼般大张着，眼珠几乎要从眼眶里崩裂而出，脸上的每一丝血色在转瞬之间退得干干净净，惨白得甚至远比脚下那具死尸更加骇人！他的视线在我和华生身上来回疯狂扫射，在那一刹那，我清晰地目睹了捕兽夹猛然合拢时野兽眼中爆发出的纯粹绝望恐惧！\n\n‘福……歇洛克·福尔摩斯先生！’他从喉咙深处挤出一声干涩如碎苇般的尖叫。\n\n‘随时为您效劳，先生，’我极其优雅地欠身脱帽致意，‘我今天下午刚乘车从伦敦赶来，恰好有幸亲眼目睹了这场令人扼腕的意外惨剧。’\n\n斯台普吞展现出了一名顶级罪犯所特有的惊人心理素质。在短短数秒内，他竟然强行将那抹滔天骇浪压回心底，脸上挤出了一抹比哭还要难看、剧烈抽搐的扭曲微笑：‘意外……当然，这真是一场可怕的意外！我们在梅立坪宅邸隐约听到了惨叫声，我还唯恐是年轻的亨利爵士在荒原上遭遇了不测。’\n\n‘亨利爵士此刻正在庄园安然享用晚宴，毫发无损，’我语气波澜不惊，语调轻松得如同在谈论天气，‘我和华生医生待会儿便会将这具尸体移交村里的停尸房。明天上午，我和华生就必须搭乘头班早车返回伦敦，贝克街还有几桩要案急需我亲自坐镇。’\n\n斯台普吞那双狭窄的死鱼眼里，瞬间迸发出一丝绝处逢生、几乎难以自持的狂喜毒焰！‘您……您明天上午就要返回伦敦？！’\n\n‘乘十点整的早车，’我面不改色，连眼皮都未眨一下，‘我们在德文郡的调查已然彻底画上了句号。’\n\n这个阴险的恶魔深深鞠了一躬，提着颤抖的马灯，步履仓皇地转身没入了漆黑的荒原夜色之中。\n\n当那点微弱的灯光彻底消失在大雾深处之后，华生猛然转过身，满脸茫然与焦灼地质问我：‘福尔摩斯！你疯了吗？！你竟然告诉他我们明天一早就要离开？！难道你要眼睁睁放任这个杀人凶手逍遥法外？！’\n\n‘我给了他整整十二个小时的致命安全错觉，华生，’在凛冽的高原寒风中，我嘴角咧开了一抹冷酷如恶狼般的森森狞笑，‘他坚信明天深夜，亨利爵士将孤身一人暴露在这座毫无戒备的荒原之上！明晚，终极陷阱就将彻底闭合！但现在——先跟我回巴斯克维尔庄园！那里有一幅至关重要的古代家族肖像油画，正等待着我们亲自过目！’", "is_ending": false, "clues": ["绝壁谷底的尸身赫然身披亨利爵士那套极其扎眼的红褐色粗花呢猎装", "翻开面容震惊发现：死者实为杀人犯塞尔登！他因身穿管家私赠的爵士旧衣而惨遭凶犬错认扑杀", "恶犬循着旧衣物上的体味气味狂追，迫使惊恐万状的逃犯在黑暗中失足坠落四十英尺绝壁粉身碎骨", "斯台普吞手持马灯如幽灵般现身现场，满心以为亨利暴卒；福尔摩斯从容示弱，谎称明晨即刻返回伦敦"], "choices": [{"id": "h_ch12_p2_c1", "text": "前往巴斯克维尔庄园检视古代家族肖像油画，寻找敲定血缘的铁证原画。", "target": "holmes_ch13_portrait", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch12_p2_c2", "text": "【视角切换：杰克·斯台普吞】窥视凶手提灯走向尸体、猛然撞见福尔摩斯如天神般伫立时的万丈恐慌。", "target": "stapleton_ch12_part2_confronting_holmes", "pov_switch": "stapleton", "pov_switch_name": "杰克·斯台普吞"}]}, "holmes_ch13_portrait": {"id": "holmes_ch13_portrait", "title": "第十三章 织网布阱（雨果画像的真容与绝命晚宴）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": "anchor_portrait", "content": "巴斯克维尔庄园那座宏伟的大宴会厅，是一处由通体乌黑的古老橡木护墙板包裹的森严殿堂。在高达数丈的古老原木人字梁穹顶下方，回荡着沉淀了整整三个世纪的名门回响。在深色的护墙板上方，悬挂着一整排长长的历代先祖油画肖像长廊——身披硬翻领的保皇党骑士、胸披精钢胸甲的圆颅党军官、高耸假发涂满香粉的乔治时代贵妇、以及身披猩红法袍的威严大法官。\n\n晚宴过后，趁着亨利爵士告退返回图书室小憩的间隙，我手托一具沉甸甸的纯银高足五头大烛台，缓步穿行在这条幽暗深邃的油画长廊之中，将微弱的烛火贴近那些布满细密裂纹的古老画布。\n\n华生紧随在我身后，用他那双写满了好奇与探寻的诚挚双眼注视着我的一举一动。\n\n‘极其显赫的一门列祖列宗，’他随口感叹道。\n\n‘一处蕴藏着惊天密码的非凡宝库，’我平静地回答，脚步最终在一幅落款为西元一六四七年的大幅油画前蓦然伫立。画布上绘制着一位身材魁梧、长发如黑色波浪般垂落在精美蕾丝领巾上的贵族绅士。他身披一件缀有白色丝绸暗纹的黑天鹅绒双排扣猎装，整张面孔苍白削瘦、嘴唇薄如刀刃，眉宇间流露出一股冷酷、傲慢且残忍至极的暴虐神采。\n\n‘这位先人是谁？’华生凑上前问道。\n\n‘这位，我亲爱的朋友，正是我们眼下经历的所有恐怖苦难的总源头。这位——就是那位著名的雨果·巴斯克维尔！那个招致魔犬诅咒的恶贯满盈之徒！’\n\n华生又向前迈近了半步，隔着镜片端详着龟裂的松节清漆：‘确实生着一副十足的恶相，然而平心而论，与画廊里的其他几位先祖相比，倒也并没有显得格外异样。’\n\n‘华生，’我向后退开两步，将银烛台平举至半空中，‘难道你当真没有看出任何端倪？看着那张脸！不要去看那顶饰有野鸡羽毛的宽檐阔帽，不要去看那些披散如瀑布般的保皇党大波浪卷发，更不要去理会那繁复华丽的蕾丝褶边！把你全部的注意力，纯粹聚焦在那张脸的骨骼解剖结构上：看那狭窄如雪貂般的尖下巴；看那耸立的高颧骨；看那双冰冷、死寂、宛如淬毒寒冰般的灰色眼眸！’\n\n我大步上前，缓缓抬起双手，用两只展开的手掌严严实实地遮挡住了画布上方宽大的阔边软帽，以及垂落两侧的浓密假发。\n\n华生在刹那间倒吸了一口凉气，从喉咙深处爆发出了一声近乎被五雷轰顶般的骇然尖叫！\n\n‘天哪！全能的上帝啊！’他一把死死掐住我的小臂，失声狂呼，‘是斯台普吞！那是杰克·斯台普吞的面孔！’\n\n‘是的，’我收回手掌，眼神冷冽如刀，‘那个恶魔体内流淌着纯正的巴斯克维尔家族之血！这就是我苦苦寻觅的最后一道血缘物理铁证！他正是老查尔斯那个在早年犯下重罪潜逃南美、相传在哥斯达黎加未婚早逝的三弟罗杰·巴斯克维尔留下的亲生儿子！罗杰在美洲留下了一脉骨肉——正是这位精通生物生理学的杰克。他迎娶了当地名媛贝丽尔·加西亚，侵吞了巨额公款潜逃回英国，改名范德勒开办了约克郡那所倒闭的私塾，并最终循着血脉的指引，将贪婪的目光死死锁定在了德文郡这片祖业荒原之上！’\n\n‘他的终极目的？’\n\n‘整座庄园，华生！世袭准男爵的无上荣耀，以及七十四万英镑的惊天巨资！只要老查尔斯突发心脏病暴毙，而唯一的侄儿亨利爵士也在这片被诅咒的荒原上死于非命，这个恶魔只需在遥远的南美伪造一套身份证明，便能以唯一的合法血脉旁系顺位继承人身份，光明正大地入主巴斯克维尔庄园！’\n\n我猛然转身离开油画，眼眸中燃烧着猎手即将收网时的冷酷杀机。\n\n次日清晨，一场精密宛如外科手术般的反猎杀大戏，在德文郡按部就班地轰然拉开了帷幕。\n\n在庄园丰盛的早餐桌上，我当众向年轻的亨利爵士宣布：因伦敦有十万火急的机密要案催促，我和华生必须立即搭乘早班特快列车返回贝克街。年轻的爵士失望沮丧到了极点，然而我却以一种不容置疑的钢铁威权，向他下达了严苛的行动指南：\n\n‘您今晚已然应允了斯台普吞前往梅立坪宅邸共进晚餐的邀请。您必须如期赴约，亨利爵士。但请您务必字字句句牢记我的叮嘱：抵达梅立坪后，您必须立刻打发您的马车独自返回庄园！您要当着斯台普吞的面明确告知他——您今夜打算在夜深十点之后，孤身一人徒步沿着荒原小径走回庄园！’\n\n‘在漆黑一片的荒原上孤身徒步夜行？！’年轻的爵士失声惊呼，‘在昨夜那个越狱犯惨死之后？！’\n\n‘您已经将您的性命完全托付到了我的手中，亨利爵士。只要您不折不扣地遵从我的每一条指令，我敢以歇洛克·福尔摩斯的名誉向您担保——您头顶的一根汗毛也绝不会受到任何伤害！’\n\n当天上午九点整，我和华生在库姆·特雷西火车站当着站长与诸多乡民的面，大模大样地登上了开往伦敦的特快列车。然而，仅仅在列车驶出下一站——偏僻狭小的海巴罗乡村小站时，我和华生便迅速闪身跳下车厢，借着幽深的林间河谷徒步折返回秘密集结地。\n\n就在正午时分，从伦敦疾驰而来的第二列快车在小站缓缓刹停。车厢门猛然弹开，一位身穿粗呢猎装、腿裹结实行军绑腿、手提厚重地毯布旅行手提包、身材精瘦敏捷的矮个子绅士，精神抖擞地踏上了站台的碎石地面。\n\n正是苏格兰场的王牌刑警——雷斯垂德侦探！\n\n‘拘捕令带来了吗，雷斯垂德？’我迎上前，有力地握住了他的手。\n\n‘加盖了大理石法庭红火漆印鉴，福尔摩斯先生！’这位矮个子神探咧开嘴露出了一抹狡黠的快意笑容，拍了拍胸口沉甸甸的内袋，‘蓄意谋杀、诈骗、纵火以及非法持有杀伤性生物凶器！我们的目标在哪儿？’\n\n‘他正在梅立坪宅邸，为他的贵客精心烹调一场绝命的断头晚餐，’我眼神阴鸷，声音冰冷如霜，‘而今夜，雷斯垂德——你将有幸亲眼见证一场全德文郡有史以来最惊心动魄的终极盛宴！’", "is_ending": false, "clues": ["用双手遮挡1647年雨果·巴斯克维尔画像上的卷曲假发与服饰，赫然露出斯台普吞分毫不差的面容", "彻底坐实血缘铁证：斯台普吞实为查尔斯二弟罗杰的亲生儿子，系巴斯克维尔家族第三顺位直系血脉", "严令亨利爵士如期赴约前往梅立坪宅邸享用晚宴，并在夜深后务必孤身一人徒步穿越荒原小径返回", "与华生假意乘车离去，实则潜伏库姆·特雷西车站秘密迎接手持法庭逮捕令的苏格兰场雷斯垂德侦探"], "choices": [{"id": "h_ch13_c1", "text": "率领雷斯垂德与华生在梅立坪宅邸外围的花岗岩乱石堆中设立终极伏击线。", "target": "holmes_ch14_part1_fog_ambush", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch13_c2", "text": "【视角切换：杰克·斯台普吞】窥视凶手在宅邸内捆绑妻子并点燃壁炉准备终极绝杀的疯狂举动。", "target": "stapleton_ch13_fatal_dinner", "pov_switch": "stapleton", "pov_switch_name": "杰克·斯台普吞"}]}, "holmes_ch14_part1_fog_ambush": {"id": "holmes_ch14_part1_fog_ambush", "title": "第十四章 巴斯克维尔的猎犬（上：幽冥恶犬与迷雾伏击）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": "anchor_climax", "content": "夜色冰冷、阴湿、透骨生寒。\n\n我们三人屏息潜伏在距离梅立坪宅邸透光窗户不足五十码开外的一道花岗岩低矮乱石阵背后。雷斯垂德紧挨在我身侧，牙齿在荒原的阴风中不受控制地剧烈打战，双手在粗花呢大衣下死死攥着他的转轮手枪。华生伏在我的右侧，目光如利刃般穿透夜幕，紧盯着那扇亮着昏黄煤油灯光的一楼大窗户。\n\n透过未拉窗帘的玻璃，宅邸起居室内的景象一览无余。亨利爵士端坐在餐桌前，身子惬意地向后倚靠在椅背上，手中端着一杯冒着热气的咖啡，正神态自若地同主人谈笑着。坐在他对面的杰克·斯台普吞满面堆笑，双手在空中夸张地比划着，极力扮演着一位热情好客的乡村绅士。然而，整间屋子里却丝毫不见贝丽尔夫人的踪影。\n\n‘那位夫人去了哪儿？’华生压低声音问道。\n\n‘她拒绝成为这场血腥谋杀的共犯，’我从紧咬的齿缝中挤出这句断语，‘那个畜生已经将她秘密拘禁起来了。’\n\n就在这千钧一发的紧要关头，我眼角的余光忽然捕捉到了荒原低洼处正悄然蔓延的一道致命白色阴影！\n\n顺着大格林盆泥潭的方向，一片浓稠、厚重、宛如凝固羊毛般的惨白大雾，正贴着地面以惊人的速度向西翻滚蔓延！它并不向高空升腾，而是像一条巨大的白色巨蟒，贴着石楠荒原低矮的凹地极速滑行！它吞噬着一座座花岗岩巨石，抹平了沿途所有狭窄的羊肠小径，并且正以不可阻挡的势头，朝着亨利爵士今夜返回庄园必须途径的那条碎石小径疯狂逼近！\n\n‘看！’我一把死死掐住华生的大臂，语气变得极其急迫严峻，‘浓雾！这才是我们今晚唯一的死敌！’\n\n‘它正在吞没道路，’华生低呼。\n\n‘不出十五分钟，整片荒原小径就将被这片白雾彻底吞噬！到时候我们连自己伸出的手指都休想看清！如果亨利爵士在大雾封路之后才走出大门，我们将彻底变成瞎子！’\n\n仿佛是在回应我的焦虑，梅立坪宅邸的大门在这一瞬间‘吱呀’一声骤然推开了！一道耀眼的长方形黄色光柱瞬间撕破了门外的漆黑夜色。\n\n亨利爵士大步迈上了门前的石阶。\n\n他在门廊前停顿了片刻，抬头望了一眼漆黑的天空，将身上厚重大衣的风领紧紧立起、裹住下巴。紧接着，他迈着坚实的步伐踏上了碎石小径，脚下的皮靴在碎石上踩出富有节奏的喀嚓声响。他在距离我们伏击掩体不足三十码的距离从容走过，挺拔的身影在逼近的浓雾背景下呈现出清晰坚挺的黑色剪影。\n\n然而，就在他刚走入那片翻滚白雾边缘的短短数秒之内——一声令人全身血液彻底冻结的声响，骤然从浓雾深处狂暴轰鸣而起！\n\n自那堵翻滚狂涌的惨白雾墙正中心，传来了一阵急促、沉重、富有毁灭性节奏的巨爪蹬地声！\n\n‘小心！’我猛地从巨石掩体后一跃而起，声嘶力竭地怒吼，‘它冲过来了！’\n\n雷斯垂德从喉咙深处爆发出了一声近乎魂飞魄散的绝望尖叫，整个人吓得一头栽倒在草皮上！华生猛吸一口凉气，双手颤抖着平举起了左轮手枪！\n\n从那堵翻滚狂暴的白色浓雾正中央，猛然破空扑出了一道令凡人理智彻底崩溃的恐怖凶兽！在看到它的百分之一秒内，我扣在手枪击铁上的大拇指，竟然因视觉遭受的极限震撼而陷入了短暂的神经麻痹！\n\n那是一只体形庞大如小牛犊般的恶犬——通体漆黑如墨，有着马士提夫獒犬般坚硬如铁砧的宽阔头颅，以及猎犬般修长精悍的嗜血躯干。然而，最令人毛骨悚然的，是这只狂奔巨兽的全身！从它血盆大张的巨口与喉管深处，正疯狂喷吐着一团团明灭闪烁的幽蓝火焰！它的双眼宛如两枚深陷在白骨眼眶中的惨绿燃烧火炭；它的鼻吻、唇瓣、下颚垂肉、乃至背脊上根根倒竖的狂暴鬃毛，全都被包裹在一层跳跃闪烁、散发着地狱幽冥恶臭的惨绿荧光烈焰之中！凡间任何发高烧的疯汉在最荒诞的谵妄梦魇里，也绝不可能构想出比眼前这只在迷雾中踏火飞奔的狂暴恶魔更加狰狞可怖的怪物！\n\n恶犬迈着巨大而富有弹性的狂暴步伐，如同一团燃烧的幽蓝彗星，沿着小径直扑正茫然回头的年轻亨利爵士！\n\n我体内的神经麻痹在瞬间被狂暴的肾上腺素冲得粉碎！我双手稳稳托住枪柄，枪口死死套住那团疾驰的幽蓝火光，狠狠扣动了扳机！华生几乎在同一毫秒内同时鸣枪！\n\n一声撕心裂肺的凶暴惨嚎骤然从恶犬口中爆裂开来！它中弹了！然而子弹并未能瞬间阻止这头狂兽的冲势；伴随着一声嗜血的狂怒咆哮，它借助惯性腾空跃起，庞大的身躯狠狠砸在了亨利爵士的后背上！\n\n年轻的巴斯克维尔爵士在这股雷霆万钧的重压下发出一声绝望的惨叫，重重跌翻在泥泞的草皮上，而那张滴淌着绿色磷火与血腥涎水的森森利齿，已然狂暴地撕咬向他的咽喉！\n\n我没有任何思考，没有任何权衡。我的身体如同一头在非洲草原上全速冲刺的猎豹，跨越了脚下嶙峋的花岗岩乱石，整个人凌空扑向了战团！恶犬已然将年轻的爵士死死按在爪下，尖锐的犬齿距离他的颈动脉仅剩最后一寸之遥！\n\n我将阿达姆斯转轮手枪滚烫的枪口，狠狠顶进了这头巨兽的耳孔深处，食指如狂风骤雨般连续扣动了整整五次扳机！\n\n伴随着五声震耳欲聋的剧烈轰鸣，一团混杂着黑血与脑浆的焦黑碎肉在火光中狂暴喷溅而出！那只庞大如怪兽般的恶犬爆发出一阵剧烈至极的濒死抽搐，庞大的身躯从爵士身上滚落，巨大的四肢在石楠丛中疯狂蹬动了几下，旋即轰然瘫软在地，彻底毙命！\n\n亨利爵士面如白纸，双眼翻白，已然在极度的惊骇中彻底昏厥了过去。华生飞扑上前，迅速扯开他的衬衣领扣施救；而雷斯垂德则如秋风中的落叶般剧烈颤抖着，惊魂未定地死死盯着地上那具依旧冒着青烟的庞大残骸。\n\n我单膝跪倒在巨犬的尸身旁，伸出右手食指，轻轻触摸着巨犬鼻吻处依旧散发着幽蓝微光的荧光涂层。我将指尖凑近鼻端嗅了嗅——没有皮肉烧焦的恶臭，唯有一股冰冷纯粹的现代无机化学制剂气味。\n\n‘白磷化合物，’我掏出手帕仔细擦拭着指尖，冷冷地宣布，‘一种经过特殊除臭脱脂工艺调配的特制高粘性无味发光磷胶。它既能在夜色中散发骇人的幽冥冷火，又丝毫不影响恶犬灵敏的嗅觉追踪。我们的这位凶手，真不愧是一位卓越的生物化学大师。’\n\n华生从亨利爵士身旁抬起头，满头大汗：‘他还活着，福尔摩斯！脉搏虽然微弱，但心脏还在有力跳动！’\n\n‘谢天谢地！’我深深呼出了一口浊气，猛然站起身，目光如利剑般直刺梅立坪宅邸的大门，‘现在——该去彻底了结我们与杰克·斯台普吞的总账了！’", "is_ending": false, "clues": ["率领华生与雷斯垂德潜伏在梅立坪宅邸外五十码的花岗岩低洼乱石阵中设伏", "大格林盆泥潭深处翻滚起厚达数丈的白色浓雾，逐渐封锁了亨利爵士归途的荒原小径", "亨利爵士刚步入迷雾，一只通体喷吐幽蓝磷火、硕大如牛的黑色凶兽破雾咆哮扑杀而出", "在恶犬将爵士扑倒在地的千钧一发之际连开五枪，以五发实弹当场击毙魔犬救下爵士"], "choices": [{"id": "h_ch14_p1_c1", "text": "破门营救被捆绑拷打的贝丽尔夫人，顺着秘密泥潭标桩直扑泥潭深处追捕元凶！", "target": "holmes_ch14_part2_mire_pursuit", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch14_p1_c2", "text": "【视角切换：杰克·斯台普吞】目睹恶犬中弹毙命、枪声大作、反派在极度恐惧中仓皇奔逃泥潭。", "target": "stapleton_ch14_part2_panic_flight", "pov_switch": "stapleton", "pov_switch_name": "杰克·斯台普吞"}]}, "holmes_ch14_part2_mire_pursuit": {"id": "holmes_ch14_part2_mire_pursuit", "title": "第十四章 巴斯克维尔的猎犬（下：泥潭追凶与深渊吞噬）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "branch", "anchor_name": "anchor_mire", "content": "留下华生在草皮上悉心抢救昏厥的亨利爵士，我和雷斯垂德拔出武器，如离弦之箭般径直冲向了梅立坪宅邸的大门。房门在狂风中大敞着，门轴发出嘎吱的刺耳呻吟。我们二人双手平举手枪，皮靴在门厅冰冷的石板地面上踏出急促震耳的回响。\n\n整栋小楼阴暗、死寂、空无一人。餐桌上，两只粗瓷咖啡杯里的残浆尚存余温；壁炉里的炭火正化为灰白的死灰。\n\n‘上楼！’我厉声大喝，‘跟紧我！’\n\n我们三步并作两步飞跨上狭窄的木质楼梯。二楼的回廊深处共有三扇房门，前两扇半敞着，露出空荡荡的简陋客房。而位于回廊最深处、正对着大格林盆泥潭方向的第三扇厚重木门，却从外侧被一根粗重的纯铜插销死死反锁着！\n\n我大步上前，猛然拉开插销，一脚将沉重的木门狠狠踹开，枪口如闪电般率先探入屋内！\n\n眼前浮现出的可怖一幕，在一瞬间让我全身的血液彻底沸腾！\n\n在二楼这间低矮逼仄的杂物间正中心，整个人被粗麻绳死死捆绑在一根支撑屋顶的粗大承重木柱上的，赫然正是贝丽尔·斯台普吞夫人！厚重的床单与毛巾死死缠绕着她的身躯，粗糙的麻绳深陷进她的皮肉之中，几乎勒断了她的呼吸。一根粗羊毛围巾勒在她口中充当口塞，唯有一双布满血丝与泪水的绝望黑眸在乱发下剧烈战栗。而在她裸露的白皙颈项与手臂上，赫然纵横交错着数道皮开肉绽、鲜血淋漓的猩红鞭痕——那是那个禽兽不如的恶魔丈夫在逃跑前，用马鞭对她实施疯狂抽打拷问留下的残暴铁证！\n\n雷斯垂德掏出折叠锋利的随身小刀，飞扑上前割断了紧绷的绳索，而我则轻柔地摘下了勒在她口中的粗毛巾。\n\n在束缚解开的一刹那，这名遭受了无尽折磨的可怜女子整个人虚脱般滑倒在我的臂弯中，从喉咙深处爆发出了一阵夹杂着剧痛与解脱的嚎啕痛哭！\n\n‘他……他平安吗？！’她顾不上喘息，用干涩沙哑到了极点的嗓音拼死抓住我的衣领，‘亨利爵士……他逃过那一劫了吗？！’\n\n‘他安然无恙，夫人，’我小心翼翼地将她搀扶到一旁的木椅上，‘而那只地狱恶犬，此刻已经身中数弹、彻底毙命了。’\n\n一股长长的战栗席卷了她遍体鳞伤的身躯。‘谢天谢地！全能的上帝啊！那个恶魔……当我坚决拒绝帮他把亨利爵士引向迷雾小径时，他发了疯般抽打我，把我死死绑在这里！他扬言只要那笔七十四万英镑的遗产到手，他就会带着这笔巨款强行把我掳去大洋彼岸的蛮荒异国！’\n\n‘他现在逃向了何处？’我单膝跪在她身旁，语气如刀锋般迅疾严厉，‘快告诉我，他的逃亡路线究竟在哪儿！’\n\n‘泥潭！’她用颤抖的手指死死指向窗外漆黑一片的死亡死沼，‘在大格林盆泥潭的最核心腹地，在一片被沼泽隔绝的干燥泥炭孤岛上，耸立着一座废弃数百年的古老锡矿石屋废墟！正是他在那里圈养驯化了那只恶犬！他在那片万劫不复的死沼泥浆下方，用深埋的秘密枯柳木桩铺设了一条唯有他一人知晓的暗道！只要让他逃上那座孤岛，他便能在那里凭借储备的罐头坚守数周之久！’\n\n我霍然站起身，转头看向雷斯垂德：‘守在夫人身边寸步不离，雷斯垂德。最后的抓捕行动，由我和华生来彻底终结！’\n\n拂晓时分，天际终于泛起了一抹惨白凄冷的鱼肚白，盘踞在泥潭上空的厚重迷雾开始逐渐稀薄飘散。我和华生手持长达十英尺的结实赤杨木探路长竿，伫立在了那片翻滚着幽绿毒光、令人望而生畏的无垠食人泥海边缘。在雷斯垂德的搀扶下，贝丽尔夫人为我们指明了那条绝密死径的唯一起始坐标：一丛插着生锈铁标的干枯芦苇丛。\n\n每迈出一步，都必须用木竿狠狠探刺泥浆深处的硬底暗桩；我和华生就这样踏上了这条通往地狱深渊的狭窄独木桥。\n\n这是一场在死神鼻息之下的惊险涉渡。在脚下不足一尺宽的湿滑暗桩两侧，深不见底的黑泥浆宛如活物般微微起伏蠕动，散发着令人作呕的强烈沼气与腐烂恶臭。稍有半寸的失足滑跌，便是万劫不复的灭顶之灾！\n\n顺着暗桩前行了约五十码后，在一丛鲜艳翠绿的剧毒水藓边缘，一件半陷在烂泥中的深色物件猛然扯动了我的双眼。\n\n我伸出探路木竿的铁钩，小心翼翼地将那个物体从黑泥中挑了出来。\n\n那是一只沉甸甸的纯黑小牛皮短靴，鞋舌内侧用烫金字样清晰地印着加拿大制鞋商的名号：‘梅耶斯，多伦多’。\n\n‘亨利爵士在伦敦失窃的那只旧黑靴！’华生失声惊呼。\n\n‘正是凶手用来给恶犬记忆气味的真正死神引信，’我将靴子随手扔在脚下坚硬的岩脊上，‘他在极度仓皇的奔逃中，不慎将这件作案凶器遗落在了泥水里。’\n\n我们二人强忍着泥浆的恶臭，顺着曲折蜿蜒的暗桩再度向泥潭腹心艰难推进了四分之一英里。然而，就在靠近一座突兀高耸的花岗岩黑色泥炭岩丘边缘时，脚下那些深埋在泥水中的枯柳暗桩——竟然突兀地彻底中断了！\n\n我的脚步在剧烈颤抖的泥草墩上骤然刹停。在我们眼前，横亘着一片宽达三十码、表面泛着一层恶臭油光的平整翡翠色泥沼，而在那片死泥的对岸，隐约耸立着那座废弃锡矿的古老石墙残骸。\n\n就在我们脚下这片烂泥的最边缘浮皮上，静静漂浮着一件微小的物件。\n\n我倾身望去。那是杰克·斯台普吞随身不离的那只长柄绿色捕蝶网，正轻飘飘地浮在绿藓之上。而在那只捕蝶网身旁不足两尺处，一处正在被黑泥浆缓缓灌满的凹陷痕迹里，赫然印着一个深达数寸、手指极度张开拼命抓挠挣扎的绝望人类手印！\n\n华生目瞪口呆地注视着泥浆表面不断冒出破裂的黑色沼气气泡，声音颤抖得宛如梦呓：‘他……他迷失了暗桩的方位！在大雾中……他踩空了！’\n\n我拄着手中的赤杨木竿，静静伫立在这座颤抖起伏的食人死沼边缘，摘下头顶的软呢帽，目光深邃冷酷地注视着这片平整如镜、深达十丈的恐怖泥潭深渊。在这片幽冷沉寂的死水下方，那个自诩智力超绝的最后恶魔，已然被德文郡大地那冰冷无情的地底黑渊彻底吸入没顶，化作了千万年泥炭层深处的一缕尘埃。\n\n‘在这座浩瀚广袤的大格林盆泥潭最冰冷、最漆黑的死泥深处，’在漫天初升的荒原晨光中，我对着苍穹发出了沉痛而庄严的终极裁决，‘在那些吞噬无辜生灵的万丈泥渊底下，长眠着我们这个现代社会所能孕育出的最聪明、也最残暴冷血的无耻恶棍。大自然已经收回了他欠下的血债，华生。正义——终于在这片被诅咒的荒原上，得到了最庄严的昭雪！’", "is_ending": false, "clues": ["撞开梅立坪宅邸二楼暗门，解救被麻绳死死捆绑在承重木柱上、浑身遍布鞭痕的贝丽尔夫人", "贝丽尔泣血指认：斯台普吞在枪响后已发疯般逃向大格林盆泥潭深处的废弃锡矿孤岛据点", "在泥潭暗道边缘寻获亨利爵士此前在伦敦失窃、被用作恶犬追踪气味源的旧黑皮靴", "斯台普吞在浓密大雾中迷失了脚下暗桩的方位，失足坠入万劫不复的食人死沼，被彻底吞噬没顶"], "choices": [{"id": "h_ch14_p2_c1", "text": "结局：神探巅峰演绎（重返贝克街221号B壁炉旁，开启全盘案情深度回溯复盘）。", "target": "ch15_holmes", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch14_p2_c2", "text": "结局：华生英雄史诗（致敬华生医生的铁血忠诚与英勇无畏，载入探案纪实永恒正典）。", "target": "ch15_watson", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch14_p2_c3", "text": "结局：正义圆满昭彰（亨利爵士重获新生继承祖业，正义破晓降临达特荒原）。", "target": "ch15_victory", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch14_p2_c4", "text": "结局：荒原宿命悲歌（哀悼在阴谋诅咒中无辜陨落的生灵，叹息人性深渊的幽暗）。", "target": "ch15_tragedy", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch14_p2_c5", "text": "结局：沉沦万丈泥渊（泥潭吞噬恶魔的冷酷宿命，大自然对罪恶实施终极天谴裁决）。", "target": "ch15_mire", "pov_switch": null, "pov_switch_name": null}, {"id": "h_ch14_p2_c6", "text": "结局：老贝利正义审判（雷斯垂德携手警署铁证如山，埃克塞特绞刑架终结连环罪恶）。", "target": "ch15_arrest", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_ch01_part1_heritage": {"id": "stapleton_ch01_part1_heritage", "title": "第一章 阴谋的序曲（上：罗杰·巴斯克维尔的血脉与野心）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "anchor", "anchor_name": "anchor_chapter1_stapleton", "content": "我静坐在梅利琵宅邸那间幽暗的书房里，食指与拇指沉稳地捏着解剖钢针，将一只珍稀的沼泽网蛱蝶标本精准刺入干燥软木板的中央。透过狭窄的铅条窗格，达特穆尔荒原浩瀚苍凉、寸草不生的荒野向着低垂的灰色天际线无垠蔓延，唯有贝利弗岩岗与泼妇岩岗那犬牙交错的花岗岩残壁在风中沉重伫立。在德文郡那些愚昧庸俗的乡巴佬眼中——在那些肥头大耳的乡村乡绅、目不识丁的泥炭雇工，以及自命不凡的教区外科医生眼里——我仅仅是杰克·斯台普吞：一个戴着金丝眼镜、温文尔雅的落魄乡村教师兼昆虫学者，一个在山间整日挥舞着一面绿纱网追逐飞蛾、用吸水纸压制沼泽兰花的古怪隐士。\n\n蠢材！一帮瞎了眼的乡巴佬，一帮连我鼻梁上的眼镜伪装都看不透的凡夫俗子！\n\n在我的骨髓与血管深处，奔淌着的乃是巴斯克维尔家族最原始、最桀骜不驯的狂暴贵族之血！我的亲生父亲罗杰·巴斯克维尔，是查尔斯爵士那一辈三兄弟中最年幼的幼弟——那个在挥霍败家后背负巨债潜逃海外、被家族族谱彻底除名的浪子。我出生在哥斯达黎加湿热难耐的种植园里，继承了父亲的名字，更继承了他毫无怜悯之心的冷酷野心，以及他毕生未曾拥有的绝顶狡黠智慧。当我携带着美艳绝伦的异国娇妻贝丽尔·加西亚重返英格兰时，我曾化名凡德勒（Vandeleur），在约克郡北部开办了一所贵族男子寄宿学校。整整三年，荣华富贵看似唾手可得；然而一场突如其来的恶性斑疹伤寒席卷了整座学生宿舍，三名贵族幼童在惨叫中痛苦夭折，学校在铺天盖地的公众丑闻与债权人围剿中彻底破产清算。我一夜之间沦为了负债累累、东躲西藏的丧家之犬。\n\n正是在那场仓皇屈辱的伦敦暗巷逃亡之中，伦敦社交报刊上的一则不起眼的新闻，彻底改写了我毕生的轨迹。我的亲伯父查尔斯·巴斯克维尔爵士携带着南非金矿与钻石田挖掘出的滔天横财载誉归国，豪掷重金重新买下了达特穆尔祖传的宏伟庄园。七十四万英镑！整整七十四万英镑的金边国债与南非金矿股票，每个月都在产生令人发狂的滚滚红利！而在那座令人目眩神迷的黄金王座与我之间，仅仅阻隔着两条脆弱不堪的人命：一个膝下无子、患有严重主动脉瘤且整日被自己的影子吓得胆战心惊的垂死老头，以及一个远在加拿大冰原拓荒务农的远亲侄子亨利·巴斯克维尔！\n\n我瞬间清醒地意识到，我登临绝顶的命运时刻已然轰然降临。我果断埋葬了凡德勒这个破产污名，化名为斯台普吞，变卖了最后的随身金饰移居德文郡。我在这片紧邻大格林盆泥潭边缘的死绝之地租下了这座白垩粉刷的荒原独栋农舍。我用令她骨髓结冰的严厉死亡威胁，逼迫贝丽尔在世人面前隐瞒夫妻真相，假扮成我尚未出阁的亲妹妹。一个容貌绝美、楚楚动人的未婚异国尤物，在这偏僻闭塞的乡野是一面无往不利的社交磁石与致命武器；而一个合法的妻子，却只会成为束缚我宏图伟业的累赘。\n\n紧接着，在巴斯克维尔庄园那座烛影摇曳的古老藏书室里，我以一位仰慕邻人、潜心考据地方志学者的温雅姿态，从积满灰尘的橡木柜深处掘出了上苍赐予我的终极杀器：那份泛黄水渍斑斑的一七四二年羊皮纸手稿——详细记载着恶魔雨果·巴斯克维尔在午夜荒原遭到幽灵猎犬撕碎咽喉的血腥家族魔咒！\n\n一个家族传承两百年的恶魔鬼话！一个深植在庄园每一名佃农骨髓深处的迷信梦魇！古往今来，还有哪位绝顶刺客能够构想出比将古老传说化为肉身更完美、更毫无物理破绽的绝命杀器？！查尔斯老爵士那颗脆弱不堪的心脏，每逢夜半听见窗棂震动便会如惊弓之鸟般疯狂悸动。他根本不需要咽下剧毒砒霜，更不需要承受锋利的匕首刺入胸膛——只要让那头来自九幽地狱的祖传恶魔咆哮着破雾而出，他那根行将破裂的主动脉便会在胸膛中瞬间炸裂，将他干脆利落地送入万劫不复的坟墓！", "is_ending": false, "clues": ["斯台普吞真实血统乃是流亡南美的幼弟罗杰·巴斯克维尔之亲生骨肉", "在约克郡开办贵族学校破产倒闭后，携娇妻贝丽尔隐姓埋名伪装兄妹潜入达特穆尔", "吞并高达七十四万英镑庞大信托遗产的宏图，必须彻底扫除堂兄查尔斯与堂侄亨利两大路障"], "choices": [{"id": "s_ch1_p1_c1", "text": "踏上大格林盆泥潭暗径深入绝密孤岛，检视囚禁在废弃锡矿工棚中的嗜血巨兽。", "target": "stapleton_ch01_part2_beast", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch1_p1_c2", "text": "【视角切换：歇洛克·福尔摩斯】切换至伦敦贝克街，目睹名侦探以手杖展开神准演绎。", "target": "holmes_ch01_part1_observation", "pov_switch": "holmes", "pov_switch_name": "歇洛克·福尔摩斯"}]}, "stapleton_ch01_part2_beast": {"id": "stapleton_ch01_part2_beast", "title": "第一章 阴谋的序曲（下：泥潭孤岛的巨兽与磷光配方）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "我套上长及大腿的高筒防湿靴，握紧沉重的橡木手杖，趁着暮色苍茫悄然溜出了梅利琵宅邸后院的杂物间。通往大格林盆泥潭深处的绝密暗径，放眼全天下唯有我一人了然于胸。在生人的眼中，这片浩瀚的沼泽是一片毫无破绽的翠绿草地，点缀着具有欺骗性的白头棉草与苔藓；然而在那层如丝绒般绚丽的浮皮之下，却是方圆十英里深不见底、翻滚涌动的剧毒死沼，只需短短三秒便能将一匹狂奔的烈马连人带鞍生吞活剥。在过去的六个月里，我忍受着刺骨的风霜，一点一滴勘探出了一条由沉水巨石与古代矿工步道组成的曲折链条——顺着那些隐没在泥浆下的花岗岩暗石，可以横渡死渊，直抵沼泽最核心那座宛如史前海怪脊梁般凸起的花岗岩孤岛。\n\n在那座孤岛之上，坐落着三座由伊丽莎白时代锡矿工棚遗留下的坍塌石屋与腐烂木棚。方圆数英里内的羊倌与泥炭工从不敢靠近此处半步，乡野传闻这里是荒原水鬼与山妖跳舞的极阴之地。这里是我固若金汤的复仇堡垒，是我制造死亡的绝密实验室。\n\n我来到最深处那座旧炼铁工棚的厚重木门前，用黄铜钥匙旋开了巨大的挂铁锁。就在门轴发出刺耳呻吟的一刹那，整面木板墙壁内部轰然爆发出一阵低沉浑厚的剧烈闷吼——那吼声低沉而充满着毁灭一切的原始杀戮气息，震得我牙床骨深处隐隐作痛。在棚内的无底黑暗之中，一条精钢打制的粗重铁链在石板地面上哗啦啦猛烈拖拽，激荡出刺耳的金属摩擦声。\n\n我擦亮马灯，稳步跨过了门槛。\n\n在昏黄的光柱边缘，巍然矗立着那头即将为我夺取整个黄金帝国的嗜血活物。那是一头堪称庞然巨物的猛兽，通体如渡鸦般漆黑，兼具马士提夫獒犬的高大骨架与纯种寻血猎犬那惊人的凶残撕咬力。这是我隐姓埋名专程奔赴伦敦富勒姆路臭名昭著的‘罗斯与曼格尔斯’名犬行重金购得的极品斗犬杂交种。我通过北部的迂回货运列车将其装入贴有‘植物标本压制机械’的密封木箱运抵德文郡，又在一个没有月色的狂风午夜牵着它徒步翻越荒原，从未让任何世人的目光瞥见过它的半点影子。它肩高足足接近三十英寸，宽阔如重锤的下颚骨足以一口咬碎牛犊的腿骨，一对猩红的巨眼中燃烧着永不熄灭的嗜血凶焰，周身肌肉宛如紧绷的钢缆在油亮的黑毛下剧烈起伏。\n\n我将马灯置于石阶上，从皮囊中取出了装有我毕生化学杰作的深色广口玻璃瓶。这是将高纯度白磷经由复杂工艺完全溶解在精炼骨油与无味甘油中的特制冷光油膏。这是我耗费数周时间在微型烧杯前反复试验的终极结晶。普通的白磷会烧灼皮肉并散发出刺鼻的气味，从而破坏猎犬极其敏感的嗅觉；而我这套独特的配方不仅毫无异味，质地冰凉温润完全不伤毛皮，却能在伸手不见五指的黑暗中爆发出极其耀眼、泛着惨绿与幽蓝交织的恐怖冷光！\n\n恶犬喉咙深处发出阵阵威胁的低吼，黑色的嘴唇翻起，露出两排长达两英寸、滴淌着唾液的惨白尖牙。我知道该如何驯服这头野兽。我口中发出它早已习惯的低沉喉音，顺手从布袋中甩出一大块带骨鲜牛肉。当恶兽在饥不择食的狂暴咀嚼中咔嚓撕碎骨骼之际，我用软布刷饱蘸油膏，从容展开了涂抹。\n\n我以沉稳精准的笔触，将磷光油膏均匀涂刷在它的粗壮口吻、两只充血眼眶的边缘，以及它颈项下那一圈层层下垂的狰狞鬃毛垂肉之上。\n\n我向后退开五步退至门槛，啪的一声将马灯的铁皮遮光罩狠狠拉到底，掐灭了最后一缕凡间的光亮。\n\n一声抑制不住的惊骇倒吸冷气声从我自己的喉咙里脱口而出！即便是我这位亲手缔造这具怪物的造物主，在黑暗轰然降临的刹那，眼前的景象依然令我的骨髓深处泛起阵阵彻骨的战栗！那头恶兽已然彻底蜕变成了一具从九幽地狱火海中爬出的活体恶魔！它的血盆大口仿佛在向外疯狂喷吐着惨绿幽蓝的熊熊烈焰；两只巨眼宛如从炼狱深处抠出的烧红火炭；滴淌涎水的下颚与獠牙周围环绕着刺骨的阴冷鬼火，将跳跃闪烁的阴森幽芒映照在工棚的穹顶横梁之上！\n\n这正是雨果·巴斯克维尔魔咒手稿里的复仇猎犬！放眼全天下，绝没有任何一个患有严重心脏病的老人，能够承受这头通体喷吐烈焰的巨兽在黑夜中咆哮扑击的恐怖视觉暴击！死神的镰刀已然彻底磨砺完毕；现在，我只需为查尔斯伯父布下一记令他无法拒绝的致命诱饵，将他从庄园的深宅大院引诱至午夜的荒原侧门！", "is_ending": false, "clues": ["从伦敦富勒姆路著名的‘罗斯与曼格尔斯’犬商处暗中购得血统最暴虐的獒犬杂交种", "囚禁在大格林盆泥潭最幽深绝密的核心孤岛废弃锡矿工棚之中", "研制出独门秘方：将白磷溶入骨油与甘油制成无嗅冷光涂料，使恶兽在暗夜中通体喷火而不伤毛皮"], "choices": [{"id": "s_ch1_p2_c1", "text": "利用爱情陷阱彻底套牢劳拉·里昂斯，指使她写下深夜约见查尔斯爵士的致命诱饵信。", "target": "stapleton_ch02_part1_laura_trap", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch1_p2_c2", "text": "在泥潭孤岛上以新鲜生牛肉逗弄恶犬，测试其在极度饥饿状态下的凶暴撕咬力。", "target": "stapleton_ch02_part1_laura_trap", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_ch02_part1_laura_trap": {"id": "stapleton_ch02_part1_laura_trap", "title": "第二章 查尔斯爵士之死（上：被诱骗的棋子劳拉·里昂斯）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "anchor", "anchor_name": "anchor_laura_trap_stapleton", "content": "将查尔斯老爵士诱入死局的最完美人选，早已现成地摆在库姆马西集镇：劳拉·里昂斯夫人——拉夫特庄园那个整日沉迷打官司的诉讼狂老弗兰克兰的亲生骨肉。\n\n这是一个性格脆弱、虚荣心极强，容貌带着几分凋零异国风韵，却在残酷现实中被贫困彻底逼入死角的绝望女人。她的无赖丈夫是一个在伦敦寻欢作乐的三流画家，多年前便卷走积蓄将其狠心抛弃；她那个脾气暴躁如雷的法盲父亲因她当年私奔抗婚，与她彻底恩断义绝断绝了父女关系；如今她只能窝在狭小的寓所里，靠一台旧雷明顿打字机替律师抄写公文艰难度日，整日生活在债台高筑的屈辱恐慌之中。在过去的数月里，我以极具欺骗性的绅士温情精心编织了一张无形的情网。我扮演着高尚、博学的同情者与守护神，用充满怜惜的忧郁目光倾听她的抽泣，自掏腰包为她采买打字纸，并用一纸虚幻的婚姻诺言彻底麻痹了她的心智。\n\n‘倘若你能摆脱那个流氓里昂斯在法律上的枷锁，’我常常坐在她那狭窄的壁炉旁，轻抚着她冰凉发颤的手指低语道，‘只要有一笔钱能支付伦敦高等法院那昂贵繁琐的离婚诉讼费，你便能在我的怀抱中找到永恒的避风港。我和贝丽尔会张开双臂，迎接你成为梅利琵宅邸尊贵的女主人。’\n\n结清她积欠的本地债务并支付伦敦大律师的定金，需要整整两千英镑。放眼整片达特穆尔荒原，究竟何人拥有如此惊天巨富，又对落难名媛怀有骑士般的救济热忱？唯有查尔斯·巴斯克维尔爵士那大敞四开的钱袋！\n\n五月四日清晨，我踏入了劳拉在库姆马西集镇的打字行。她正处于精神濒临崩溃的绝望边缘。伦敦的一名债权人今早派人送来了传票，威胁将在埃克塞特法庭申请强制执行将她投进债务人监狱。\n\n‘查尔斯爵士明天清晨就要动身前往伦敦，’我神色严峻，嗓音低沉而充满了不容置疑的紧迫感，‘男仆已经在为他收拾皮箱。他是去伦敦延请心脏病权威会诊，庄园里甚至私下传闻他此番离去可能再也不会重返德文郡！倘若你仅仅寄去一封公事公办的求援信，他只会将你推给伦敦高瑟父子律师行那帮冷血无情的讼棍！你必须当面见他！你必须当面哭诉，在他登上火车之前彻底唤醒他骨子里的骑士怜悯之心！’\n\n‘可他绝不会允许我在深夜踏入庄园的藏书室！’她双手死死绞着手帕，语无伦次地颤声道，‘那些仆人……流言蜚语……’\n\n‘那就约在从庄园红豆杉林荫道通向荒原的木栅侧门相见！’我催促着，顺手将一张信纸推到她的眼前，‘那里绝对隐蔽！晚上九点之后绝无任何仆人踏足后花园半步！坐下，劳拉，按我念的写，一字不差地写下来。’\n\n在极度的惶恐与重获新生的盲目狂喜中，她颤抖着握紧钢笔，就着泪水写下了那行绝命的密约：\n\n‘求求您，求求您，倘若您当真是一位体面的绅士，读罢请将此信烧毁，并于今晚十点整在侧门相候！’\n\n‘署上你的缩写字母，’我站在她椅后温柔低语，‘L. L. 这样既能唤醒他的记忆，即便信件意外遗失也绝不会玷污你的名节。’\n\n我亲手接过信封封好火漆，当场交由本地的乡村信使火速投递往巴斯克维尔庄园。\n\n下午五点，我再次跨入了劳拉的寓所。我脸上换上了一副严厉、自尊受辱却又充满痛苦深情的凝重表情。\n\n‘劳拉，’我一把扣住她的双手手腕，以炽热的目光注视着她，‘我反复思量了这场会面，我的灵魂在承受无法忍受的煎熬！作为一个男人的尊严，我绝不能容忍我未来的妻子在漆黑的荒原侧门向一个老头子摇尾乞怜！今天下午，我已经通过普利茅斯的银行质押了我自己的海外投资证券，成功筹措到了这笔两千英镑的现款！今晚，你绝对不许踏足巴斯克维尔庄园半步！’\n\n她感动得扑入我的怀中放声大哭，吻着我的手背，把我当成了救她于水火的高贵骑士。\n\n这个愚不可及的蠢女人！她做梦也想不到，她亲手写下的不仅是查尔斯爵士的死刑判决书，更将她自己牢牢焊死在了一场无法向任何警方吐露真相的自绝退路之中！", "is_ending": false, "clues": ["斯台普吞以虚假结婚诺言为饵，诱骗走投无路的劳拉·里昂斯向查尔斯爵士索要两千镑赎身费", "亲自口述并逼迫劳拉写下绝命密约信，要求老爵士在深夜十点务必孤身在侧门相会"], "choices": [{"id": "s_ch2_p1_c1", "text": "当面严令劳拉·里昂斯今晚绝不许赴约，自己则暗中牵出涂满磷光的恶犬奔赴红豆杉侧门。", "target": "stapleton_ch02_part2_yew_alley", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch2_p1_c2", "text": "在夕阳沉入地平线之际完成恶犬的磷光涂抹，将杀戮倒计时推向最后一刻。", "target": "stapleton_ch02_part2_yew_alley", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_ch02_part2_yew_alley": {"id": "stapleton_ch02_part2_yew_alley", "title": "第二章 查尔斯爵士之死（下：小树道侧门的致命恐惧）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "五月四日深夜，天气闷热潮湿，夜色浓黑如墨，低垂的乌云将漫天的星光吞噬殆尽。九点一刻，我牵着被厚毛毯严密包裹头部的恶兽，从梅利琵宅邸后门悄然遁入了夜色。恶犬口吻与双眼处散发出的森冷磷火被沉重的军用羊毛毯死死遮挡。我们宛如两只无声的幽灵，贴着泥潭边缘吸水松软的苔原无声前行，甚至连半点脚步声都未曾惊动荒原。\n\n差二十分十点，我们抵临了巴斯克维尔庄园的北侧边界。在庄园那道高达十二英尺、由修剪整齐的红豆杉树篱构筑的林荫道外，茫茫荒原沉浸在一片死寂之中。我在一丛高大茂密的金雀花灌木后伏下身躯，距离那扇通向荒原的低矮木栅侧门仅仅只有二十步之遥。\n\n穿透红豆杉树篱那纵横交错的漆黑缝隙，一点微弱暗红的火光骤然亮起。\n\n查尔斯老爵士如期而至！他独自走出了庄园主楼，信步穿过长长的碎石林荫道，伸手旋开了木栅侧门的铜栓。他倚靠在门栅边沿，神色焦灼地向着荒原雾霭笼罩的远方极目远眺，苦苦等待着劳拉·里昂斯那柔弱的身影从羊肠小径上匆匆赶来。他指间雪茄烟头的暗红微光有节奏地忽明忽暗。即便隔着二十步的距离，我也能清晰听见他的皮鞋在碎石上不安踱步的声响，以及他那破损不堪的气管在寒夜中发出的急促喘息。\n\n威德库姆村教堂花岗岩方塔的大钟沉闷地敲响了十点的钟声。钟声穿透潮湿的夜雾，低沉而宛如丧钟。\n\n这位年迈的男爵越发显得坐立不安。他推开木门，向荒原草地上迈出了两步，随即又退回了树篱边。他弹落了第一撮雪茄烟灰，擦亮第二根硫磺火柴，点燃了另一支新鲜的哈瓦那雪茄。又是令人窒息的漫长十分钟过去了。夜半的寒气开始钻透他那早已溃烂的心肺；他剧烈地咳嗽起来，干咳的声音震得他佝偻的肩膀不住战栗。\n\n死神降临的时辰彻底成熟了。\n\n我猛地一把扯掉了蒙在恶犬头上的厚羊毛毯！我死死攥住它坚硬如铁的黄铜项圈，脸颊贴在它发烫的太阳穴旁，对着它贴服的耳朵吐出恶魔般的命令，将它那张喷吐着惨绿幽火的巨口死死对准了树篱缝隙中老人的身影。\n\n‘上，咬死他！’我牙缝中挤出嗜血的厉喝，‘去！’\n\n恶兽发出一声惊天动地的闷吼，轰然自灌木丛中暴起扑出！\n\n查尔斯爵士听到了巨爪踏碎草皮的雷霆狂飙声，骇然回首！然而映入这位长期深陷家族诅咒梦魇的老人眼帘的，是彻底撕裂其理智的活体梦魇：一头体型如牛、周身燃着森森绿火的巨大黑魔，正张牙舞爪自虚空中狂暴扑杀而来！\n\n老爵士发出一声被扼死在喉咙里的凄厉绝叫！他甚至根本来不及关上侧门，猛然转身沿着红豆杉小径用脚尖亡命狂奔，双手绝望地死死撕扯着胸口的衣襟！仅仅狂奔了五十码远，他那颗脆弱的心脏便彻底破裂碎裂，整个人面孔朝下，轰然仆倒在草坪之中！\n\n我立刻吹响了高频无声犬笛（Galton whistle）。受过严苛训练的恶犬在距离尸体二十码远的地方硬生生刹住了脚步，欢快地折返奔回我的身旁。我将厚毛毯重新罩上它的头颅，拍了拍它的背脊，牵着它如幽灵般悄然隐没在大格林盆泥潭那片深不可测的黑色庇护所中。\n\n死者身上没有留下任何物理创口。一桩完美绝伦、毫无破绽的绝世谋杀！第一块绊脚石已然彻底扫清！", "is_ending": false, "clues": ["查尔斯爵士在侧门足足抽烟等待了二十分钟，期盼着劳拉·里昂斯前来赴约", "当喷吐烈焰的地狱恶兽在夜色中破草扑出时，老爵士在极致的恐怖中心脏彻底爆裂", "斯台普吞吹响无声犬笛引回猎犬遁入泥潭，在现场二十码外的湿泥上留下了不可磨灭的鬼印"], "choices": [{"id": "s_ch2_p2_c1", "text": "筹划远赴伦敦的秘密暗杀行动，抢在年轻的加拿大继承人踏足荒原前将其就地格杀。", "target": "stapleton_ch03_new_heir", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch2_p2_c2", "text": "【视角切换：歇洛克·福尔摩斯】切换至贝克街，看名侦探如何从摩梯末口中审讯现场足印。", "target": "holmes_ch01_part2_consultation", "pov_switch": "holmes", "pov_switch_name": "歇洛克·福尔摩斯"}]}, "stapleton_ch03_new_heir": {"id": "stapleton_ch03_new_heir", "title": "第三章 疑案（来自加拿大的威胁与伦敦暗杀计划）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "在威德库姆村召开的验尸法庭，完全按照我预先设计好的剧本滑稽上演。那帮脑满肠肥的乡村陪审员听完了摩梯末医生的医学陈述，木然端详着小树道的现场草图，郑重其事地晃动着假发，最终给出了一致裁决：死于因长期心脏器质性病变引发的自然猝死。摩梯末那个整日沉迷于颅骨测量的书呆子，生怕引发全教区的迷信恐慌，对距离尸体二十码外的巨大兽印三缄其口。地方报纸极尽溢美之词追忆逝者生前的善举，不出两周，世人便彻底将查尔斯爵士埋入了尘土。\n\n我原本以为那座金山已然尽入囊中。我只需耐心等待一段体面的哀悼期，随后拿出我在哥斯达黎加的出生证明，确凿证实我乃是罗杰·巴斯克维尔的亲生血脉，便能顺理成章地以唯一近亲的身份接管全部信托遗产。\n\n然而十月八日清晨，晴空霹雳轰然炸响！\n\n《西部晨报》头版刊登的一则官方通告，险些将我的胆汁彻底气裂。伦敦高瑟父子律师行通过加拿大高级专员公署，正式联络到了庄园的法定第一顺位继承人：亨利·巴斯克维尔爵士！他是二伯父的遗孤——那个三十年前客死美洲的二哥留下的亲骨肉！这位年轻男爵年方三十，身板健壮得宛如苏必利尔湖畔的参天松柏，自幼在加拿大冰原开荒伐木、经营牧场。他已然搭乘皇家邮轮‘伊特鲁里亚号’横渡大西洋，一周之内便将在南安普顿靠岸，并誓言将火速亲临达特穆尔全权入主庄园！\n\n在我那间逼仄的书房里，我的狂怒险些撕碎理智，我当场将整架昂贵的黄铜显微镜狠狠砸碎在花岗岩壁炉上！\n\n难道我千辛万苦抵达的天堂之门，竟要眼睁睁被一个粗鄙野蛮的殖民地庄稼汉夺走？！难道我冒着同赴绞刑架的万丈深渊、在恶臭的沼泽边缘潜伏数月，双手染满亲伯父的热血，最终只是为他人做嫁衣？！\n\n绝不可能！只要我胸膛中尚存一丝呼吸，这笔财富便绝不可能易手！\n\n必须立刻施以第二记雷霆绝杀！然而若在亨利抵庄后立刻如法炮制，即便是德文郡最愚钝的巡警也必将嗅出人为谋杀的血腥味。最理想的行刑场，唯有帝国的心脏——庞大臃肿、人情冷漠的伦敦！在这座吞吐着四百万孤魂野鬼的迷雾之都，一场马车倾覆、一次泰晤士河溺水或是一场暗巷斗殴，不出一天便会被翻篇的新闻彻底淹没！\n\n我以闪电般的速度展开行动。我运送了五十磅马肉踏入泥潭孤岛，为恶兽加固了铁链并备足了半个月的清水。我收拾好两只提箱，从埃克塞特的一家戏院道具行采买了一副黏贴假黑胡须与深色墨镜，强行将贝丽尔拖上了前往伦敦的列车。\n\n她猜到了我的杀机。在飞驰的头等舱包厢里，她跪倒在地板上痛哭流涕，死死抱住我的双膝，苦苦哀求我放弃继承权同她远走高飞逃回南美。\n\n我伸出左手死死卡住她的咽喉，硬生生将她的头颅按在天鹅绒坐垫上，直到她娇嫩的嘴唇泛出缺氧的青紫。\n\n‘给我听清楚了，贝丽尔，’我微笑着凝视着她那双充满绝望恐惧的黑眼睛低语道，‘倘若你敢向任何活人吐露半个字——倘若你敢泄露半句我不是斯台普吞，或者你是我的合法妻子——我不仅会把你的加拿大堂弟送进坟墓，更会亲手把你拖回大格林盆泥潭，扒光你的衣服，用铁链将你锁在工棚里，与那头饥饿的恶兽同处一室！’\n\n她在我的铁掌下当场吓得昏死过去。抵达滑铁卢车站后，我以凡德勒之名在圣约翰伍德一条僻静的小街租下了简朴的寓所。短短二十四小时之内，我的眼线便查明了亨利爵士与摩梯末入驻了河岸街的诺森伯兰旅馆。猎物已然入瓮，猎手的大网已然彻底合围！", "is_ending": false, "clues": ["获悉远在加拿大的年轻农夫亨利·巴斯克维尔正作为唯一法定继承人受召返英", "斯台普吞决意化名潜入伦敦，务必在亨利爵士抵达达特穆尔前将其彻底清除", "强逼妻子贝丽尔同行，日夜严密监控，严防其走漏半点风声"], "choices": [{"id": "s_ch3_c1", "text": "尾随亨利爵士入驻诺森伯兰旅馆，以重金买通大堂侍者搜集暗杀情报。", "target": "stapleton_ch04_part1_hotel_shadow", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch3_c2", "text": "【视角切换：约翰·H·华生】切换至贝克街，见证华生与福尔摩斯在浓密烟雾中推敲疑案。", "target": "ch03_problem", "pov_switch": "watson", "pov_switch_name": "约翰·H·华生医生"}]}, "stapleton_ch04_part1_hotel_shadow": {"id": "stapleton_ch04_part1_hotel_shadow", "title": "第四章 亨利·巴斯克维尔爵士（上：诺森伯兰旅馆的眼线与剪报）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "anchor", "anchor_name": "anchor_london_shadow_stapleton", "content": "十月十二日傍晚，当我勘察完河岸街的诺森伯兰旅馆返回圣约翰伍德的寓所时，一推开起居室的房门，赫然撞见贝丽尔正以一种做贼心虚的恐慌姿态蜷缩在壁炉前的地毯上。在她身旁，扔着一份被修甲小剪刀剪得千疮百孔的昨日《泰晤士报》，头版社论上布满了犬牙差互的方形窟窿，而那把小巧弯曲的剪刀还被她死死攥在颤抖的指缝中。\n\n我的目光瞬间扫过了红木桌面上摆放的浆糊瓶，以及散落的零星铅字碎纸屑。\n\n一声野兽般的暴怒咒骂从我牙缝中喷涌而出！我两步跨越房间，一把揪住她乌黑的长发，硬生生将她整个人从地毯上扯跪起来。\n\n‘你干了什么，你这个吃里扒外的贱人？！’我厉声咆哮，晃得她牙齿咯咯作响。\n\n‘我警告了他！’她在滂沱的泪水中绝望地哭喊道，‘我把剪下来的字贴在信封上，投进了查令十字街的邮筒！我警告他永远别踏足达特穆尔荒原半步！杰克，我们的灵魂承受不起再背负一条人命的万丈诅咒了！你想打就打，想杀就杀吧，但信件已然落入了邮政系统，你休想追回来了！’\n\n一股毁天灭地的狂暴杀机险些令我当场掐断她的脖颈。我狠狠一掌将她抽翻在沙发上，撞得她肩膀一片青紫。这个成事不足败事有余的蠢妇！倘若亨利爵士被这封荒诞的匿名拼贴信吓破了胆，连夜卷铺盖逃回加拿大荒野，那七十四万英镑的滔天富贵便将永远同我擦肩而过！\n\n形势已然万分火急，绝无半秒钟可以虚耗。我的退路已被彻底切断。为了防止这个年轻男爵脱钩逃窜，我必须立刻拿到将他碎尸万段的最关键道具：一件吸饱了他活人体味、足以引导恶兽追杀万里的贴身物件！\n\n次日清晨六点整，我换上一袭深色因弗内斯斗篷，戴上深色墨镜，趁着清晨旅客结账离店的纷乱人潮大摇大摆迈入了诺森伯兰旅馆的大堂。我踩着后楼梯轻手轻脚摸上了二楼长廊——亨利爵士入驻的34号套房门外。一名睡眼惺忪的爱尔兰女仆正拿着长柄笤帚清扫地毯。\n\n我悄然闪身立在她身侧，嗓音压得极低，展现出管家特有的体面谦恭，同时顺手将半枚金光闪闪的金镑滑入了她的围裙口袋。\n\n‘好姑娘，’我微笑着温言道，‘34号房间的那位加拿大贵客吩咐我，替他将门外的一只皮靴送往河岸街的鞋匠铺调整鞋跟钢片。他还在熟睡，靴子就放在门外地垫上。把其中一只交给我，这枚金币便是你的辛苦费。’\n\n女仆的眼珠子在见到金币的一刹那瞬间放光。她敏捷地溜到34号门前，抄起地垫上的一只皮靴便塞入了我的斗篷底下。\n\n我顺着后门安全通道疾步溜出旅馆，踏入了清晨喧嚣的伦敦街头，一头扎入了河岸街转角的一条僻静小巷。在狂乱的心跳中，我迫不及待地将皮靴掏出斗篷。\n\n然而，一声因极度暴怒而走调的嘶哑咆哮瞬间从我喉管中炸裂！\n\n那竟然是一只崭新锃亮、散发着生牛皮气息的黄褐色新皮靴！坚硬挺括的牛皮一尘不染，鞋底甚至连一粒凡间的尘埃都未曾沾染！那个愚蠢的加拿大土包子昨天刚在伦敦的商铺里买下它，昨夜是第一次将它摆出门外打油！\n\n一双毫无体味的新靴子！这对于我那头依赖嗅觉追踪的恶犬而言，简直形同无用的一块木头！寻血猎犬绝不可能凭借毫无生命的鞣制皮革去追踪活人——它需要的是长期步行踩踏压入鞋底内衬的酸性汗液，是活人毛孔深处分泌出的浓烈体脂与热血气息！\n\n我的牙齿咬得咯咯作响。那个蠢笨女仆的盲目彻底打乱了我的计划。但我绝不能放弃追踪。亨利爵士很快便会下楼用餐，我必须守在旅馆门外暗中盯梢，查清究竟何人在为他出谋划策，查清他下一步的动向！", "is_ending": false, "clues": ["贝丽尔背叛丈夫，用修甲剪刀从昨日《泰晤士报》社论裁剪词句拼贴匿名警告信", "斯台普吞当场截获通敌行径并将贝丽尔毒打威慑，然而警告信却已被其暗中投入邮筒", "斯台普吞重金贿赂旅馆女侍盗取亨利爵士置于门外的皮靴，企图为恶犬锁定致命气味"], "choices": [{"id": "s_ch4_p1_c1", "text": "惊见女仆竟偷来一只毫无气味的新黄皮靴；戴上假黑胡子雇佣马车在摄政街紧咬爵士不放。", "target": "stapleton_ch04_part2_cab_chase", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch4_p1_c2", "text": "【视角切换：歇洛克·福尔摩斯】切换至贝克街，看名侦探用显微镜拆解素馨花香气与五号铅字。", "target": "holmes_ch04_part1_warning", "pov_switch": "holmes", "pov_switch_name": "歇洛克·福尔摩斯"}]}, "stapleton_ch04_part2_cab_chase": {"id": "stapleton_ch04_part2_cab_chase", "title": "第四章 亨利·巴斯克维尔爵士（下：摄政街的对决与马车2704）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "我将一圈浓密黑亮的黏贴假连鬓胡须死死粘在下颚与上唇，把一顶深色软呢帽压低到鼻梁骨，在特拉法尔加广场转角处的柱廊阴影下守株待兔。\n\n十点一刻，亨利·巴斯克维尔爵士与摩梯末医生终于并肩走出了诺森伯兰旅馆的大理石门廊。他们大步流星走上科克斯珀街，拐入苍凉壮丽的蓓尔美尔街。亨利爵士展现出加拿大年轻人特有的充沛活力，一边走一边激烈地比划着手势；摩梯末则紧紧抱着他那根失而复得的手杖。我顺手拦下了一辆正从街角慢跑而过的双轮轻便马车——车牌号2704，车夫是一个生着红胡子、名叫约翰·克莱顿的魁梧汉子。\n\n‘远远咬住前面那两位先生，保持两百码距离，’我顺手将半枚金镑从车顶的传话天窗掷进车夫怀里，‘绝不要超车，无论他们拐进哪条街，死死跟住。’\n\n马车缓缓驶入摄政街清晨拥挤的车流之中。在整整二十分钟的时间里，这场盯梢进行得如精密机械般严丝合缝。我的猎物走在东侧的人行道上，偶尔停下脚步端详着高档橱窗里的陈设。我将整个身躯深陷在马车阴暗的软垫角落里，脉搏平稳，暗自得意于我那毫无破绽的潜伏。摩梯末显然正在护送这位年轻男爵前往某处拜会一位至关重要的大人物。然而究竟是谁？\n\n突然之间，一股寒彻骨髓的绝命恐惧如冰水浇头般瞬间冻结了我肺腑里的呼吸！\n\n就在马路对面的另一侧人行道上，距离亨利爵士身后仅仅二十步之遥的地方，并肩阔步走着两位令我瞳孔骤然收紧的身影。其中一人步履沉稳如军人，留着棕色短髭——约翰·H·华生医生；而在他身侧，那个身形异常挺拔瘦削、身披长款奥斯特大氅，生着一张在全欧洲无人不晓的鹰喙般锐利侧颜的绅士，赫然正是歇洛克·福尔摩斯！\n\n摩梯末竟然把全天下最顶尖的名侦探请上了猎杀的战场！\n\n就在我认出他的千分之一秒内，仿佛受到了危险第六感的牵引，福尔摩斯猛然转过了头颅！他那对如出鞘冰刃般的灰色寒眸，竟穿透车流与马车玻璃窗直直刺入了我的瞳孔！在嘈杂喧嚣的人潮之中，我们的目光在半空中发生了一记惊心动魄的凌空撞击！他看见了我的假胡须；他识破了前面两位先生正处于被人暗中盯梢的死局！\n\n‘快赶车！’我发疯般用手杖顶开天窗，手杖铁箍死死戳在车夫的后背上厉声咆哮，‘拼死赶往滑铁卢车站！甩掉他们，我多赏你一整枚金镑！’\n\n克莱顿的长鞭在骏马背上抽出凄厉如火枪般的脆响！双轮马车伴随着剧烈的颠簸猛地窜出，将我重重甩在靠垫上！我们如同疯牛般在摄政街密集的双层公共马车与货车车流中亡命穿梭飞驰，沿街将打扫马路的清洁工逼得四散奔逃，而福尔摩斯的大氅却在后方的人行道上如猎豹般狂奔追赶！我们轰鸣着杀过滑铁卢广场，在滚滚江雾中风驰电掣般冲过威斯敏斯特大桥，刺耳地急刹在喧嚣混乱的滑铁卢车站进站口！\n\n还没等车轮完全停稳，我便飞身跳下了车厢。我掏出两枚金光闪闪的金镑重重拍进车夫惊愕的手心里。\n\n‘赶得漂亮，车夫，’我凑上前去，嘴角咧开一抹狂妄至极的恶毒冷笑，‘待会儿要是有个高个子、目光如电的瘦削绅士向你打听刚才坐车的是哪位大人物，你便如实回他：“老子的名字叫歇洛克·福尔摩斯，可千万给老子记牢了！”’\n\n我一个闪身潜入了滑铁卢车站那充满煤灰与蒸汽的站台迷宫之中，顺着货运地下通道神不知鬼不觉地溜出了南门，宛如一缕青烟彻底消散在伦敦的迷雾之中。\n\n我当面挑衅了全英国最顶尖的神探！我把他的名字当众甩在了他自己的脸上！然而当我走在阴冷的暗巷中时，我的双手却在狂涌的肾上腺素中抑制不住地微微发颤。乡野落魄学者的面具已被彻底撕破。歇洛克·福尔摩斯已然正式参战！这场角逐，已然演变成了一场全天下最顶尖的正义智脑与最冷血犯罪智囊之间的不死不休决斗！", "is_ending": false, "clues": ["斯台普吞贴上假黑胡子、戴上墨镜雇佣2704号双轮马车在摄政街尾随爵士", "在与歇洛克·福尔摩斯目光凌空撞击的瞬间果断策马飞驰逃逸，并傲慢挑衅地假借名侦探之名脱身"], "choices": [{"id": "s_ch4_p2_c1", "text": "潜回旅馆趁乱调换盗取亨利爵士踩满泥巴的旧黑皮靴，带上致命气味火速潜回达特穆尔。", "target": "stapleton_ch05_black_boot", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch4_p2_c2", "text": "【视角切换：歇洛克·福尔摩斯】切换至贝克街，见证名侦探在马车夫口中得知自己姓名被盗用的震怒。", "target": "holmes_ch05_threads", "pov_switch": "holmes", "pov_switch_name": "歇洛克·福尔摩斯"}]}, "stapleton_ch05_black_boot": {"id": "stapleton_ch05_black_boot", "title": "第五章 三条断了的线索（盗取旧黑靴与遁回达特穆尔）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "anchor", "anchor_name": "anchor_arrival_stapleton", "content": "摄政街上与福尔摩斯那电光石火的生死遭遇，换作任何平庸的阴谋家，此刻早已吓得魂飞魄散、搭乘第一班客轮逃往欧洲大陆。然而我的头脑在极度的高压之下，却展现出如精密数理仪器般令人心悸的绝对冷静。我深知福尔摩斯在接下来的整个下午，必将被车夫克莱顿的口供与全城搜寻各区信差的徒劳线索缠得焦头烂额。已被他搜查排查过的诺森伯兰旅馆，恰恰是他做梦也想不到我会杀个回马枪的安全盲区！\n\n下午两点整，我刮掉了黏贴假黑胡子，收起了深色墨镜，以一位体面斯文的乡村游客形象，泰然自若地从侧门再次跨入了诺森伯兰旅馆的大堂。\n\n我轻车熟路地摸上了二楼长廊。亨利爵士与摩梯末此刻正紧闭在贝克街221号B的起居室里向福尔摩斯闭门求教。我将那只毫无体味、毫无用处的崭新黄褐色皮靴顺手塞入了长廊转角的藤椅底下以扰乱视线。随后，当我低头扫向34号门外的地垫时，命运之神向我露出了最狰狞快意的微笑！\n\n在那里，整整齐齐摆放着一双准备交给杂役刷洗的旧黑皮靴！柔软的牛皮上满布着数月跋涉留下的深深褶皱；鞋跟外侧磨损倾斜；而鞋帮与鞋底的缝隙里，厚厚凝结着一层加拿大牧场特有的干涸深红泥浆！\n\n我闪电般抄起其中一只旧黑皮靴，塞入沉重风衣的内袋，神色从容如常地迈着优雅的步伐走下宽阔的大理石主楼梯，穿过旋转门施施然踏上了河岸街的人潮。\n\n我拿到了！通往亨利·巴斯克维尔咽喉的最致命钥匙！一只彻底被他肉体毛孔深处分泌出的酸性汗液浸透的旧鞋，承载着他血液循环独一无二的生化气味样本！有了这件死神信物，我那头饥肠辘辘的恶魔巨兽即便在狂风肆虐的二十英里荒原上，也能在茫茫黑夜中死死咬住目标，不差分毫！\n\n当天傍晚，我在贝克街暗中布下的眼线更是为我送来了一道价值千金的绝密战报：帕丁顿车站一位被我五金镑电报买通的行李领班确凿证实，亨利爵士与华生医生预订了本周六上午十点半开往德文郡的头等舱车票；然而在登记名单上，绝无歇洛克·福尔摩斯的半点踪影！这位名满天下的大神探，竟然声称因伦敦公务缠身留守首都，分身乏术！\n\n在阴暗潮湿的站台角落里，我忍不住发出了快意至极的低声狂笑，甚至引来了巡警怀疑的侧目。\n\n福尔摩斯竟然不亲自来！他竟然自以为是地将他的温顺羔羊独自送入了屠宰场，仅仅委派了一位头脑迟钝的退伍军医充当保镖！若正面与福尔摩斯那等妖孽过招，鹿死谁手尚未可知；然而若对手仅仅是约翰·H·华生那个头脑简单、四肢发达的迈旺德退伍老兵，这场狩猎简直宛如杀鸡宰鹅般轻而易举！\n\n我返回圣约翰伍德，收拾好行囊，粗暴地扯起面如死灰的贝丽尔直奔帕丁顿车站。我们搭乘午夜的邮政快车秘密西行。十月十四日晨曦初露之际，我们已然重返达特穆尔荒原深处冷酷幽绝的梅利琵宅邸。\n\n我甚至连身上的旅行大氅都未曾脱下，怀揣着那只沾满干泥的旧黑皮靴，踩着暗石直奔泥潭核心孤岛。我旋开工棚的重铁锁。恶犬狂暴地朝我扑来，粗重的铁链剧烈震荡。我将旧皮靴硬生生怼到了它那剧烈耸动的黑色湿润鼻孔前！\n\n这头巨兽贪婪地深吸了一大口，两只猩红凶残的黄瞳骤然收缩为针芒状的狂暴杀机。一阵滴淌口水、狂暴难耐的嗜血呜咽在它的喉咙深处轰然炸响。它记住了这个活人的气味；它将这个猎物的血肉深烙在了兽性的核心！\n\n地狱的天罗地网已然全面张开。亨利·巴斯克维尔，正一步步踏入我为你量身定做的万劫不复深渊！", "is_ending": false, "clues": ["斯台普吞悄然潜回旅馆物归原主退回新黄靴，成功盗取亨利爵士穿过、沾满烂泥的旧黑皮靴", "暗探获悉歇洛克·福尔摩斯借故公务缠身留守伦敦，仅派军医华生随行护送男爵", "怀揣浸透目标体味的绝密旧靴狂喜返回梅利琵宅邸，着手以血腥气味饲喂训练恶兽"], "choices": [{"id": "s_ch5_c1", "text": "登上梅利琵宅邸高坡山脊隐蔽处，架起单筒望远镜等候亨利爵士与华生自伦敦入瓮。", "target": "stapleton_ch06_part1_arrival_watch", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch5_c2", "text": "【视角切换：约翰·H·华生】切换至西行快车车厢，体验华生护送男爵奔赴古老庄园的凝重思绪。", "target": "ch06_part1_arrival", "pov_switch": "watson", "pov_switch_name": "约翰·H·华生医生"}]}, "stapleton_ch06_part1_arrival_watch": {"id": "stapleton_ch06_part1_arrival_watch", "title": "第六章 巴斯克维尔庄园（上：猎物入瓮与荷枪护送）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "anchor", "anchor_name": "anchor_arrival_moor_stapleton", "content": "十月十五日的午后，我登上了贝利弗岩岗（Belliver Tor）高耸的花岗岩顶峰，将单筒黄铜望远镜死死抵在一块生满地衣的粗糙巨石上以稳住双手。深秋的天空是一幅阴霾低沉的铅灰色穹顶，一股裹挟着大西洋刺骨湿气的冰冷朔风呼啸着掠过荒原，将枯黄的石楠草吹得紧贴地面，在花岗岩裂隙间激荡出阵阵尖厉的呜咽。\n\n在波维谷地的远方，当那条白色的马车干道蜿蜒穿越沼泽时，一缕滚滚升腾的漫天尘烟宣告了从库姆马西火车站疾驰而来的双排敞篷马车。\n\n我缓缓旋转调节着镜筒，马车上的每一张面孔瞬间在镜片中央纤毫毕现。\n\n端坐在后排高位上的，正是那位年轻的继承人亨利·巴斯克维尔爵士。他换下了伦敦的硬顶礼帽，戴着一顶旅行鸭舌帽，身上裹着一件加皮毛领的厚实加拿大式大氅。他那对漆黑而警惕的眼眸满怀惊奇与震撼地打量着四周蛮荒苍凉的苔原，显然正沉醉在入主祖传王国的浪漫与豪情之中。坐在他身侧的正是约翰·H·华生医生，身躯挺拔笔直如雕像，警惕地挺着方下巴，右手沉甸甸地按在大衣翻领口袋的凸起处——毫无疑问，他那把大口径韦伯利军用左轮手枪早已压满子弹、处于随时待发的状态。而在马车两侧，两名身着深蓝制服的德文郡骑警正骑着健壮的荒原马全副戒备地护卫随行，手中的李-梅特福德卡宾枪横架在马鞍桥上，紧张的目光不断扫视着沿途的每一处泥炭沟与金雀花丛！\n\n滑稽可笑的武装护卫！何等幼稚浅薄的虚荣挣扎！这帮蠢货竟然天真地以为，几枚凡间的铅弹或是两个乡村小警察，当真能够挡得住一头诞生于九幽地狱火海与古老魔咒之中的复仇恶兽？！\n\n然而这批荷枪实弹的武装骑警之所以大动干戈，其背后那道令全教区人心惶惶的突发变故，早已在今晨由乡村邮差送到了我的耳中：三天前，残杀多名无辜者的诺丁山屠夫逃犯塞尔登，竟从普林斯敦花岗岩筑就的高墙重牢中凿壁越狱，此刻正潜伏在荒原的乱石滩中茹毛饮血！地方当局在交通要道上布满了武装巡逻队，荒原上的每一个农户在太阳落山前便死死插上了门栓。\n\n这真是一个绝妙至极的混乱棋子！放眼全天下，还有什么比一个游荡在黑夜中、身负数条人命的越狱凶徒更适合充当我的烟幕弹？！倘若世人皆知荒原上游荡着一个穷凶极恶的持刀屠夫，那么在这片土地上发生的任何猝死、任何深夜撕心裂肺的惨叫，乃至任何横尸悬崖的碎骨惨案，都将在第一时间被愚蠢的世人与宪警顺理成章地扣在逃犯头上！全郡的警察会在石楠丛中掘地三尺搜捕一个野兽般的人类，而我的地狱幽灵则能在黑夜中从容收割生命！\n\n敞篷马车辚辚转过了巴斯克维尔庄园那两座生满青苔的古老花岗岩石柱。两扇沉重锈蚀的熟铁雕花大门在他们身后发出刺耳的呻吟，轰然闭合。\n\n羊羔终于正式赶入了屠宰圈！如今亨利爵士已被整整二十英里险象环生的原始死绝之地与文明世界彻底切断，在他那脆弱的咽喉前，仅仅横隔着一个自以为是、极易受骗的糊涂军医！\n\n一股冰冷而令人狂醉的捕食快感瞬间传遍了我的四肢百骸。查尔斯老爵士那七十四万镑的黄金巨矿，已然在我指尖下绽放出触手可及的夺目光彩！我收起望远镜插回口袋，沿着岩石嶙峋的陡坡大步流星奔向梅利琵宅邸，务必在狩猎正式拉开序幕之前，将我的家宅牢笼彻底封死！", "is_ending": false, "clues": ["亨利爵士与华生医生在持枪骑警全副戒备的武装护卫下踏入巴斯克维尔庄园大门", "惊悉诺丁山残暴屠夫逃犯塞尔登越狱潜伏荒原，将其锁定为随时可资利用的嗜血乱局棋子"], "choices": [{"id": "s_ch6_p1_c1", "text": "折返梅利琵宅邸，以最残忍的暴力手段将企图反抗的贝丽尔彻底威慑囚禁在掌中。", "target": "stapleton_ch06_part2_beryl_chains", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch6_p1_c2", "text": "【视角切换：歇洛克·福尔摩斯】切换至黑色岩岗史前石屋，看名侦探如何用军用远望镜俯瞰马车抵庄。", "target": "holmes_ch06_part2_hut_surveillance", "pov_switch": "holmes", "pov_switch_name": "歇洛克·福尔摩斯"}]}, "stapleton_ch06_part2_beryl_chains": {"id": "stapleton_ch06_part2_beryl_chains", "title": "第六章 巴斯克维尔庄园（下：梅利琵宅邸的暴虐枷锁）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "我穿过铺着冰冷石板的后厨杂物间跨入了梅利琵宅邸。整栋农舍阴冷刺骨，弥漫着潮湿白灰的霉味，以及从标本架上一排排毒瓶中散发出的苦杏仁与氰化钾刺鼻甜香。\n\n在昏暗狭窄的起居室里，贝丽尔正一动不动地伫立在直棂窗前，额头死死抵在冰冷的玻璃上，目光穿透荒原的雾霭，凝视着远方巴斯克维尔庄园那两座隐现的孪生古堡塔楼。当听到我那熟悉的皮靴在门槛上踩踏出的摩擦声时，她整个人如中箭的惊鸟般猛地一颤，仓皇转身，那张美艳绝伦的异国面庞上的血色在一秒钟之内褪得干干净净。\n\n‘他进庄园了，’我神色从容如常地跨进室内，随手掩上厚重的橡木房门，伴随着一声清脆冰冷的金属咔嗒声将门锁徐徐反拧到底。我将沉甸甸的铁钥匙顺手滑入了西装背心的贴身口袋。\n\n她背脊不住后退，直到肩膀死死抵住了粉刷的石膏墙壁，那对乌黑深邃的眼眸因极致的恐惧而剧烈放大。‘杰克……看在上帝的份上，看在十字架的面子上，我求求你了！收手吧！放过那个年轻人吧！他才三十岁，他从未做过任何伤害你的事啊！带上我们所有的积蓄，带我离开这片令人发疯的死绝沼泽吧！带我回哥斯达黎加吧，哪怕粗茶淡饭，只要我们能在阳光下堂堂正正生活，双手不再沾染鲜血！’\n\n我两步跨越房间。还没等她来得及抬手护住面孔，我的右手如精钢铸就的老虎钳般瞬间卡死了她那纤细雪白的咽喉，以万钧之力将她整个人狠狠按死在高背马鬃扶手椅中，直到她的气管在压迫下发出急促绝望的窒息喘息！\n\n‘给我听清楚了，我天真圣洁的小蠢货，’我俯下身庞，脸颊凑得极近，眼镜框甚至碰到了她剧烈颤抖的太阳穴，‘在伦敦，你敢瞒着我用修甲剪刀裁切报纸，给亨利爵士寄去匿名信。我当时没有掐死你，仅仅是因为你这张美艳动人的脸孔，乃是将那个年轻蠢货引诱过荒原迈向死地的唯一诱饵！但给我听好了，贝丽尔，把每一个音节都深深刻进你的脑髓里：这里绝非伦敦！方圆五英里内没有一个警察，方圆两英里内没有半户邻居，而大格林盆泥潭距离我们的后门只有短短三十码！’\n\n肉体的剧痛与精神的彻底绝望化作泪水，顺着她死死紧闭的眼角无声滑落。\n\n‘倘若那个年轻男爵踏入这栋房子时，你敢向他吐露半个字——倘若你敢通过眼神、手势或任何暗示走漏半句你是我的合法妻子而非胞妹的真相——我不仅会当场送你的堂弟下地狱，更会在夜半三更将你拖过暗石孤岛，用精钢铁链死死锁在炼铁工棚的石环上，将你一个人扔在无底的黑暗中，与那头饥肠辘辘的恶兽同处一室！你听明白了吗，贝丽尔？！’\n\n我缓缓松开了铁铸般的右手。她浑身剧烈抽搐着从马鬃椅垫上瘫软滑落，像一条濒死的宠物犬般匍匐在地板上，脸颊死死贴着我的西裤裤脚，在极度的屈辱与动物般的恐惧中放声痛哭。\n\n‘我闭嘴……我发誓我什么都不会说！’她在被泪水打湿的裤脚旁抽泣道，‘求求上帝宽恕我，我一个字都不会说的……我什么都不会透露！’\n\n‘最好把你的誓言刻在骨头上，’我面无表情地跨过她瘫软的身躯，‘明天一早，那位自命不凡的华生医生必将只身踏勘荒原的地形地貌。我将带上我的绿纱网，在泥潭小道旁主动迎候他。一个滔滔不绝、沉溺学术的热心乡村博物学家——天下还有什么比这更完美的人畜无害伪装？！不出十分钟，那个脑袋少根筋的退伍老军医便会将我引为莫逆之交。而只要将华生玩弄于股掌之间，亨利爵士便会顺理成章地踏入我们的客厅！’\n\n我旋开书房门锁，坐在长桌前，从容地摆弄起明天用来固定战利品的钢针与软木板。死亡的巨网已然彻底织就；深渊的剧毒蜘蛛，正耐心静候着猎物步入罗网！", "is_ending": false, "clues": ["斯台普吞以恶犬撕碎咽喉为要挟，严令贝丽尔绝不许向新爵士吐露半字实情", "在孤立无援的荒原农舍中将美貌异国娇妻彻底囚禁，充当引诱富豪的致命玩偶"], "choices": [{"id": "s_ch6_p2_c1", "text": "手提捕蝶网漫步荒原泥潭小径，主动结识华生医生并当面测试其观察力与警惕心。", "target": "stapleton_ch07_part1_naturalist_act", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch6_p2_c2", "text": "踏着暗径潜入大格林盆泥潭孤岛，为今晚恶兽的血食配给制定精准时刻表。", "target": "stapleton_ch07_part1_naturalist_act", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_ch07_part1_naturalist_act": {"id": "stapleton_ch07_part1_naturalist_act", "title": "第七章 梅利琵宅邸的主人斯台普吞（上：温雅博物学者的伪装）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "anchor", "anchor_name": "anchor_naturalist_stapleton", "content": "十月十六日清晨，惨淡而湿润的深秋日光洒落荒原，将漫山遍野被露水打湿的石楠苔原映照出一片朦胧的光晕。我手提绿纱长柄捕蝶网，肩头斜挎着锌制标本采集盒，身上套着一件洗得发白的粗花呢诺福克夹克，整个人散发出一种令人生不起半点戒心的落魄学者气质，神态自若地漫步在从梅利琵宅邸通往庄园的大道碎石路旁。\n\n仅仅过了半个小时，我的守株待兔便获得了丰厚的回报。约翰·H·华生医生那敦实魁梧的身形很快出现在了山脊的转角处。他迈着标准的军人步伐，嘴里叼着石楠烟斗，将一缕青蓝色的烟雾吐向清冽的空气，警惕而好奇的目光不断扫视着这片起伏不平的荒原。\n\n我加快脚步迎上前去，抄近路穿过一处越橘灌木丛，热情地挥动着宽边帽子，脸上洋溢着常年幽居偏远乡野的学者在偶遇文明同道时特有的爽朗与急切。\n\n‘想必阁下定是华生医生了！’我用高亢轻快的声音高声致意，‘万望恕我乡村野夫的唐突失礼，但当一个人住在荒无人烟的大格林盆泥潭边缘时，圣詹姆斯宫廷那套繁文缛节便早已被抛之脑后！在下杰克·斯台普吞，梅利琵宅邸的主人。’\n\n这位诚朴的军官停下脚步，摘下烟斗，脸上流露出那种英国绅士特有的坦荡与温和——正是这种毫无心机的正直，使得他们成为世上最容易被玩弄于股掌之间的猎物。短短五分钟之内，我已然彻底卸下了他的全副心理防线。我像个热衷学问的少年般滔滔不绝地向他炫耀着隐藏在泥炭裂隙中的珍稀兰花，信手指向远古峰峦上那些依附在岩壁上的新石器时代圆形石屋遗址，并以极其肃穆深沉的语调，表达了对我们共同的故友、可怜查尔斯爵士猝然长逝的无限哀思。\n\n突然之间，当我们并肩伫立在一处俯瞰大格林盆泥潭翠绿沼面的花岗岩低岗上时，一声撕心裂肺的绝望惨嘶骤然撕碎了荒原的晨曦——那是一声伴随着咕嘟水泡冒出声的垂死挣扎！\n\n在相距我们仅仅二十码的沼泽边缘，一匹达特穆尔矮种小马因贪恋嫩绿的棉草，一脚踩穿了伪装成草坪的致命泥壳！黑亮油腻的剧毒死浆已然漫过了它的马肩隆！小马绝望地仰起毛茸茸的头颅，双眼圆睁充血，前蹄在泥浆中狂暴扑腾踢蹬；然而它的每一次剧烈抽搐挣扎，都仅仅在将它以更快的速度拖入深不见底的地心深渊！\n\n我一把死死抓住华生的衣袖，手中的捕蝶网竹柄如剑般直指眼前的惨剧。\n\n‘瞧啊，华生医生！’我惊呼出声，嗓音骤然降调为充满戏剧张力的紧绷低语，‘这便是大格林盆泥潭！一片深不见底的绝命流沙！只要脚下一步踏错坚实的暗径，无论是凡人还是走兽，都会在顷刻间被卷入万丈深渊！不出两分钟，那匹马便会彻底沉入地心！’\n\n华生目瞪口呆、浑身僵直地伫立在原地，面色因极度的惊骇而惨白如纸。他亲眼目睹着那匹矮马的口吻与悲鸣的眼睛彻底没入了翻滚着五彩油光的水泡之下。泥潭深处恶臭的沼气咕嘟破裂，翠绿的苔藓随即便平滑如初地合拢覆盖，在水面上连半圈涟漪都未曾留下。\n\n这场即兴教科书般的死亡演示堪称绝妙至极！大荒原那吞人嚼骨的恐怖梦魇已然深深烙印在了这位退伍军医的灵魂深处。从今往后，他绝不敢孤身涉足沼泽半步，更绝不敢放任亨利爵士离开正道而毫无恐惧之感！\n\n紧接着，趁着他的心智被这震撼一幕彻底缴械的空当，我从容不迫地抛出了那枚致命的试探之针——语气轻松温和，仿佛只是出于纯粹的乡野好奇：\n\n‘未能在这片土地上亲眼瞻仰大名鼎鼎的歇洛克·福尔摩斯先生的风采，真是令全教区上下遗憾万分。不知传闻是否确凿，那位大神探果真因公繁忙，整个季节都无暇亲临德文郡视察吗？’\n\n华生脸上流露出一丝军人特有的含蓄自豪：‘伦敦有一桩极其重大的公海勒索要案死死缠住了他的身躯。在目前这段时期内，亨利爵士的一切安全防务全权交由我一人全权照料。’\n\n全权交由你一人照料！\n\n我必须立刻低下头去佯装端详石楠草，借着一声喷嚏的掩护，才勉强死死压抑住了嘴角那抹险些撕裂我温雅伪装的狰狞狂笑！那位名满天下的大神探被死死锁在了伦敦！整盘大棋已任由我肆意驰骋，七十四万镑的黄金王座已然近在咫尺！", "is_ending": false, "clues": ["手持捕蝶网在荒原小径截获华生，以博学温和的学者谈吐博取对方信任", "当场向华生展示达特穆尔矮种野马失足陷顶惨死全过程，借泥潭神威震慑其胆魄", "旁敲侧击试探歇洛克·福尔摩斯的真实行踪，确凿核实神探确未随行亲临德文郡"], "choices": [{"id": "s_ch7_p1_c1", "text": "假意扑打珍稀环纹蝶脱身深入草丛，暗中窥视华生与从后方冲出的贝丽尔之接触。", "target": "stapleton_ch07_part2_beryl_blunder", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch7_p1_c2", "text": "【视角切换：约翰·H·华生】切换至华生视角，见证他如何对这位古怪学者产生最初好感。", "target": "ch07_part1_naturalist", "pov_switch": "watson", "pov_switch_name": "约翰·H·华生医生"}]}, "stapleton_ch07_part2_beryl_blunder": {"id": "stapleton_ch07_part2_beryl_blunder", "title": "第七章 梅利琵宅邸的主人斯台普吞（下：泥潭小径上的惊险破绽）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "我故作狂喜失态，指着石楠花丛中一只翩跹翻飞的灰色飞蛾，整个人展现出一副走火入魔的狂热学者姿态。\n\n‘是一只弄蝶！’我像个疯子般手舞足蹈地大喊，‘一只在整个英格兰西南部早已被认定灭绝的珍稀环纹弄蝶！千万恕我失陪，华生医生——绝不能让它逃出我的视线！’\n\n我拔腿狂奔深入厚密的越橘灌木丛，大步跃过一道道泥炭裂谷，夸张地在空中挥舞着捕蝶网，直到两座花岗岩矮岗彻底将华生的身影隔绝在我的视线之后。\n\n这场追逐纯粹是一场经过精密计算的障眼法。我本意是借着巨石的天然掩护暗中迂回包抄，通过袖珍望远镜逆向端详这位军医在独处时的警惕神态。然而，当我攀上一处花岗岩山脊回首眺望的一刹那，眼前的景象如同一柄淬毒的冰刃，瞬间狠狠扎入了我的心脏！\n\n贝丽尔！\n\n那个该死、执迷不悟的贱人竟然趁我不备偷偷溜出了宅邸，正气喘吁吁地在石楠丛中亡命狂奔，她那袭黑色的西班牙蕾丝头巾在朔风中如丧幡般猎猎作响！\n\n透过金雀花灌木的枝权缝隙，我惊骇地目睹她一路飞奔扑到了华生医生面前！她满脸通红，神色激动得近乎神经错乱，黑亮深邃的眼眸中喷涌着极致的恐惧与绝望的哀求！即便隔着整整三百码的距离，我也能轻易读懂她那疯狂的肢体语言：她死死拽着华生的大衣衣袖，手臂激烈地指向南方，声嘶力竭地命令对方立刻撤退、滚出达特穆尔、在今天天黑之前搭乘火车亡命逃回伦敦！\n\n这个瞎了眼的蠢女人，竟然把华生那身着粗花呢大衣的敦实方正身材，误当成了远道而来的年轻男爵亨利·巴斯克维尔！\n\n我的十指死死捏紧了手里的竹柄捕蝶网，指节泛出惨白，坚硬的竹竿甚至在掌心发出一声刺耳的脆裂呻吟！只要她嘴里吐出半句关于恶犬的真相——哪怕透露半字我们乃是合法夫妻而非兄妹的实情——粗糙的绞刑索便将在本周日套死在我的脖颈之上！\n\n我没有半分犹豫。我猛地从巨石后飞身跃下，高高举起手中的绿纱网，嘴里欢快地吹奏着歌剧《卡门》的轻快选段，迈着大步从容走下斜坡，俨然一副刚刚大获全胜归来的无邪模样。\n\n‘哈喽，贝丽尔！’我爽朗地高声呼喊道，‘究竟是什么兴致，竟把你这位娇小姐也引到了这寒风刺骨的荒原上？’\n\n奇迹般的震慑效果在一瞬间显现无遗。她整个人宛如被数万伏特的高压电流穿透了脊椎，浑身剧烈一僵，触电般飞速从华生身侧退开两步，面孔在半秒钟之内被冻结成了一张毫无生气的惨白大理石面具——正是每当皮鞭高高举起在她头顶时，她所展现出的绝望麻木。\n\n‘我只是出来散散步，杰克，’她结结巴巴地强咽下一口唾沫，嗓音在强行压抑的恐慌中不住发颤，‘而我……我刚才正陪这位先生一同欣赏荒原的风景。’\n\n我仰天大笑起来，笑声温厚、慈爱而充满了长兄对幼妹那种宠溺的宽容包容。\n\n‘啊，我亲爱的华生医生，您可千万别见怪！’我一步跨到他们二人中间，亲切地拍了拍华生的肩膀，展现出令人如沐春风的熟稔与体面，‘我这妹妹生性胆怯脆弱，对这片阴冷的达特穆尔荒原畏之如虎，查尔斯老爵士的不幸惨死更是彻底摧毁了她的神经。走吧，华生医生！既然到了家门口，若不尝尝我们的乡野款待，我可绝不放您回庄园！随我们一同踏入梅利琵宅邸品上一杯正宗的哥斯达黎加现磨咖啡，我还要带您参观我私藏的达特穆尔珍稀鳞翅目昆虫标本柜呢！’\n\n华生完全被我这副热情爽朗的绅士派头彻底俘获缴械。贝丽尔刚才那番神经质的绝命警告，在我灿烂如春风的温雅谈吐面前，如晨雾般消散得无影无踪。\n\n然而当我们三人并肩穿过狭窄的羊肠碎石小道时，我的指甲已然深深刺入了紧握的拳头掌心，鲜血顺着指甲缝悄然溢出。\n\n贝丽尔那不可救药的反叛已然演变成了最致命的定时炸弹。她骨子里那多愁善感的情感良知，是一道随时可能决堤淹没我的致命破口。等到决战收网的那个良夜降临之时，口头警告与皮鞭恐吓已然远远不够了。我必须用粗麻绳将她彻底五花大绑在床柱上、用布条死死封住嘴唇，将她关在暗无天日的密室中，让她连半声绝叫都休想传出宅邸！", "is_ending": false, "clues": ["贝丽尔背地里狂奔出农舍拦路阻截，误将华生当作亨利爵士发出绝命撤退警告", "斯台普吞假意扑蝶折返撞破密谈，以高超冷酷的‘兄长’伪装掩饰滔天杀机", "清醒认识到妻子内心的反叛烈火仍在燃烧，决意在决战前夜施加更残酷的高压管制"], "choices": [{"id": "s_ch7_p2_c1", "text": "正式向华生与亨利爵士发出梅利琵宅邸午后茶会之约，将猎物引入社交死角。", "target": "stapleton_ch08_probing_watson", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch7_p2_c2", "text": "踏着暗径返回泥潭孤岛，复查恶兽项圈铁链的坚固度与绝密防御设施。", "target": "stapleton_ch08_probing_watson", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_ch08_probing_watson": {"id": "stapleton_ch08_probing_watson", "title": "第八章 华生医生的第一份报告（品茶试探与虚假的安心）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "在接下来的整整两周时间里，我上演了一场堪称心理操控与社交伪装教科书的绝妙大戏。\n\n我以邻家书卷气学者的体面身份正式登门造访巴斯克维尔庄园，向新主人致以最崇高的敬意。在这座空旷阴冷、犹如古墓般死寂的花岗岩古堡里，百无聊赖、渴望交际的年轻亨利爵士如获至宝般抓住了我的友谊。短短四十八小时之内，从庄园通往梅利琵宅邸的那条荒原小道，便已被他的马靴踏出了一条清晰的光溜溜黄泥小径。\n\n正是在我的屋檐之下，我庞大谋杀杀局的第二重致命引擎开始以令人狂醉的威力轰然运转：亨利爵士不可救药、彻底盲目地疯狂迷恋上了贝丽尔！\n\n他的那双眼睛一刻也舍不得从她那张绝美动人的异国面庞上挪开。每当贝丽尔为他斟倒红茶时，他的手指甚至在抑制不住地微微发颤；每当她抱着吉他轻声吟唱西班牙浪漫曲时，这位年轻男爵那张轮廓分明的面孔上便喷涌出无限的崇拜与爱慕！这是一张价值连城的超级王牌，然而却需要最为精确的走钢丝操作。倘若我放任他们公开热恋，亨利爵士必定会在一周内当面求婚并将其带往伦敦大教堂完婚，从而在我的致命杀机动手前戳破我们乃是合法夫妻的铁幕真相！\n\n于是，我当众上演了一出堪称戏剧化天才的癫狂大戏：一记蓄谋已久的病态吃醋狂怒！\n\n当亨利爵士在采石场附近的荒原小径旁背地里拦住贝丽尔吐露炽热衷肠时，我如疯狗般猛地从巨石后杀出。我当着华生的面厉声痛骂男爵居心叵测、竟敢恩将仇报企图玷污侮辱一个无依无靠的乡野纯洁孤女，并用尽刻薄至极的恶毒辞令当场将他粗暴地轰出了我的领地！\n\n亨利爵士被骂得无地自容、羞愧万分，然而美洲开荒者骨子里的倔强却将他的占有欲与征服欲瞬间点燃了上百倍！得不到的阻隔，反而让他发疯般下定决心务必明媒正娶迎娶贝丽尔。他次日便登门谢罪，苦苦哀求我的宽恕，并立下庄严的骑士誓言：在未获得我这位‘大舅哥’的首肯之前绝不再越雷池半步！\n\n我将他彻底锁死在了我的蛛网中央。他被他自己的骑士道德所捆绑，而贝丽尔则处于我时刻不停的严密贴身监视之下。\n\n与此同时，那位勇敢忠诚的华生医生又在做些什么呢？\n\n这位善良憨厚的退伍军医每天夜晚都窝在庄园那熊熊燃烧的壁炉旁，左轮手枪搁在壁炉架上，整夜整夜在厚厚的日记纸上奋笔疾书，详尽记录着他收集到的每一丝鸡毛蒜皮。透过格林盆村邮局局长的女儿——她同我后厨的洗碗女仆情同姐妹——我确凿获悉，华生每周都会雷打不动地向伦敦贝克街221号B的歇洛克·福尔摩斯寄出厚厚两大包信件战报。\n\n任由这个蠢材去写吧！让他去极尽能事地描摹荒原凄凉的落叶、石楠丛中夜莺的啼哭、管家白利墨可疑的眼泪，以及杰克·斯台普吞那些看似人畜无害的珍稀昆虫标本！当华生在写着他的侦探纪实小说、而歇洛克·福尔摩斯正安坐于五百英里外的伦敦壁炉旁无聊吐着烟圈之际，死亡的钟摆正在一分一秒地逼近最后的末日审判！", "is_ending": false, "clues": ["亨利爵士亲临梅利琵宅邸登门拜访，在茶会上一眼不可自拔地迷恋上了贝丽尔", "斯台普吞假意暴跳如雷上演‘护妹心切’的病态吃醋狂怒，严防二人私相授受", "确信华生正日夜不停向伦敦贝克街寄出毫无威胁的书信战报，对全局毫无警觉"], "choices": [{"id": "s_ch8_c1", "text": "趁着午夜万籁俱寂，手提生鲜血食潜入大格林盆泥潭深处，犒劳饥渴暴虐的恶兽。", "target": "stapleton_ch09_part1_feeding_the_hound", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch8_c2", "text": "【视角切换：歇洛克·福尔摩斯】切换至黑色岩岗石屋，看名侦探就着烛光逐字剖析华生密报。", "target": "holmes_ch08_watson_report", "pov_switch": "holmes", "pov_switch_name": "歇洛克·福尔摩斯"}]}, "stapleton_ch09_part1_feeding_the_hound": {"id": "stapleton_ch09_part1_feeding_the_hound", "title": "第九章 沼地上的烛光（上：夜入泥潭饲喂恶兽）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "anchor", "anchor_name": "anchor_convict_stapleton", "content": "十月二十日凌晨一点整，当死一般的死寂彻底笼罩了梅利琵宅邸、贝丽尔已被我稳稳反锁在二楼卧室之后，我悄然穿过后厨侧门，一头扎入了浓黑如墨的夜雾之中。\n\n在沉重的粗帆布背包里，装着我趁着夜色从波维附近一家偏僻屠宰场秘密采买来的十五磅血淋淋的碎肉与牛肝。在深更半夜只身横渡大格林盆泥潭，是对人类神经极限的最残酷考验。两侧的无底黑浆咕嘟翻滚着致命的毒气与气泡；冰冷刺骨的脏水拍打着我的高筒防水皮裤；只要脚下踏错四英寸，便会瞬间被拖入永无天日的地下万丈深渊，绝无任何人力能将我拖出！然而我的双脚对于每一块沉在水下的花岗岩暗石、每一丛结实的芦苇草墩的熟悉程度，宛如一头出巡的野狼熟知自己的领地。\n\n我登上了孤岛花岗岩高岗，旋开了废弃炼铁工棚上的沉重铜锁。\n\n就在插销发出刺耳金属声的一刹那，工棚内部轰然爆发出一阵低沉浑厚的共鸣——一阵令我骨髓深处都为之剧烈颤栗的雷霆闷吼，那是原始野兽饥肠辘辘、毁灭一切的暴虐咆哮。\n\n恶犬嗅到了我的脚步声。\n\n我擦亮风雨马灯，挂在墙壁的铁支架上。在昏黄摇曳的光柱中，那头庞然巨兽宛如从《启示录》预言深处爬出的活体恶魔。它的黑毛纠结杂乱，两侧肋骨因极度饥饿而深陷下瘪，两只泛着凶残黄光的兽瞳死死锁定了我的帆布背包，庞大的身躯狠狠扯动着精钢铁链，震得嵌在石壁里的巨大铁环咯咯作响。\n\n我割断麻绳，将背包里大块大块鲜血淋漓的碎肉与内脏轰然倒在石板地面上。\n\n恶犬发出一声狂暴的低吼，猛扑向这堆血肉！在幽暗的工棚里，獠牙嚼碎筋腱与大口撕咬骨骼的脆响令人毛骨悚然，那声音是如此凶残原始，即便是我这般冷酷如铁的神经也不禁隐隐发憷。在它狼吞虎咽之际，我用海绵蘸着洁净的雨水，仔细擦拭着它口角结痂的干涸血迹，仔细复查着铁链每一个坚硬的环扣。\n\n当最后一块骨髓被嚼碎咽下肚时，这头巨兽猛地扬起庞大沉重的头颅，黑色粗壮的口吻直指残破的屋顶椽木，从肺腑最深处爆发出一声凄厉、悠长、在天地间悲怆回荡的恐怖长嗥！\n\n那长嗥声从地底深处的闷雷声开端，逐渐拔高为撕裂苍穹的古老恶毒尖啸，最终在一种令人毛骨悚然的凄绝余音中渐渐平息，在皎洁月色笼罩下的浩瀚荒原上空久久回荡！\n\n我伫立在工棚的阴影之中，面露微笑，丝毫没有伸手制止它的狂吠。\n\n让这片荒原在它恶魔的咆哮声中战栗吧！让亨利·巴斯克维尔爵士从庄园厚重的被褥深处惊坐而起，死死抓紧床单在迷信的恐惧中瑟瑟发抖吧！让那些愚昧的乡民蜷缩在壁炉前拼命在胸口画十字吧！恶犬长嗥的每一丝回音，都在为日后的验尸官、治安法官以及陪审团心甘情愿地将新男爵之死归咎于超自然的天谴魔咒，打下最坚不可摧的心理铁证！", "is_ending": false, "clues": ["斯台普吞在凌晨一点踏着暗径潜入孤岛，以鲜血淋漓的碎肉喂养饥肠辘辘的恶魔巨兽", "任由恶兽饱食后压抑沉闷的嗜血长嚎在荒原黑夜中滚滚回荡，在全教区播撒深入骨髓的恐怖"], "choices": [{"id": "s_ch9_p1_c1", "text": "听闻花岗岩绝壁方向骤然爆发出清脆枪响，隐蔽在巨石后窥视华生夜巡围捕逃犯。", "target": "stapleton_ch09_part2_night_alarm", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch9_p1_c2", "text": "【视角切换：约翰·H·华生】切换至荒原乱石堆，体验华生与爵士端枪疾驰围捕狂暴越狱犯。", "target": "ch09_part2_moor_chase", "pov_switch": "watson", "pov_switch_name": "约翰·H·华生医生"}]}, "stapleton_ch09_part2_night_alarm": {"id": "stapleton_ch09_part2_night_alarm", "title": "第九章 沼地上的烛光（下：追捕逃犯与荒原暗机）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "我锁好工棚厚重的橡木大门，踩着沉水暗石折返陆地。然而就在我的皮靴刚刚踏上北侧山脊结实松软的石楠苔原时，一声清脆震耳的巨响骤然撕碎了冰冷的寒夜，宛如干枯的松枝被硬生生折断！\n\n是枪声！\n\n一声清脆如鞭笞般的手枪枪响，紧接着是第二声枪响，在黑色岩岗那犬牙交错的花岗岩绝壁间激荡起久久不绝的脆烈回音！\n\n我瞬间伏倒在一处干燥泥炭沟的浓黑阴影中，右手啪的一声解开了大衣下左轮手枪的枪套扣带。难道是普林斯敦的警队摸到了我隐匿恶兽的孤岛？！\n\n我缓缓从石楠丛后探出头颅，目光扫过整片在皎洁月色笼罩下的浩瀚荒原。在北部高耸的荒原高原上，在满月那惨白银辉的映照下，三条狂奔的人影正在乱石滩上飞速掠过！领头狂奔的，是一个身穿黄条纹囚服、蓬头垢面如野兽般在巨石间上蹿下跳的亡命徒——正是越狱犯塞尔登！而在他身后五十码远的地方，亨利·巴斯克维尔爵士与华生医生正端着左轮手枪狂暴穷追不舍，手中的枪口不断在黑夜中喷吐出刺目的火舌！\n\n他们在追捕逃犯！这帮自作聪明的蠢材，显然撞破了管家白利墨与逃犯的深夜联络，竟然把宝贵的火药与体力浪费在一个饥寒交迫的丧家之犬身上！\n\n我正暗自冷笑鄙夷，然而当我的视线顺着黑色岩岗那陡峭高耸的花岗岩脊线、投向圆月悬挂的夜空背景时，我的心脏猛地爆发出了一记剧烈沉重的狂跳，呼吸瞬间在喉咙里彻底冻结！\n\n在黑色岩岗最险峻孤绝的巨岩之巅，在万丈月光那惨白的照耀之下，赫然傲立着一个如同玄武岩雕像般一动不动的瘦高人影！\n\n他双臂冷冷环抱于胸前，头颈微微前倾，以一种近乎全知全能的深邃与警惕，居高临下死死俯瞰着谷底亨利爵士的一举一动！那具挺拔瘦削的身躯在月色背景下轮廓分明；一顶鸭舌旅行帽深深压在眉际。他宛如一头栖息在绝壁之巅的冷血猛禽，冷冷注视着谷底的一切骚乱。\n\n他究竟是人是鬼？！\n\n那绝非笨拙愚钝的乡野巡警，更不可能是本地的羊倌。在这片蛮荒贫瘠的土地上，绝无任何凡夫俗子能够展现出如此冷峻孤高、傲视一切的统帅威仪！难道是逃犯暗中联络的接头同伙？抑或是……某个比逃犯凶险千百倍的索命克星？！\n\n在瞬间涌出的冷汗之中，伦敦摄政街上那惊心动魄的对决记忆如烙铁般再次烫痛了我的脑髓——2704号马车车窗外，那对穿透玻璃的鹰隼般灰色寒眸！\n\n难道歇洛克·福尔摩斯在全世界面前演了一场弥天大谎？！难道全欧洲最顶尖的神探早已隐姓埋名潜入了德文郡，如同一头野蛮的印第安人般在达特穆尔荒原上露营扎寨，在暗中全盘操盘着华生的一举一动？！\n\n一阵刺骨的寒意顺着我的脊椎骨疯狂向下蔓延。倘若福尔摩斯当真亲临达特穆尔，这场博弈便已彻底演变成了你死我活的悬崖决斗！我必须彻查黑色岩岗上究竟盘踞着何方神圣！然而在探查岩岗之前，我必须首先彻底封死后方的侧翼：库姆马西的劳拉·里昂斯，绝不能让她漏出半点威胁我的口风！", "is_ending": false, "clues": ["华生与亨利爵士开枪追击诺丁山逃犯塞尔登，枪声打破荒原午夜死寂", "斯台普吞在返程途中惊见黑色岩岗绝壁顶端巍然伫立着一个神秘的瘦高黑影"], "choices": [{"id": "s_ch9_p2_c1", "text": "火速亲赴库姆马西集镇密会劳拉·里昂斯，加固对其精神控制，彻底封死信件口风。", "target": "stapleton_ch10_coombe_control", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch9_p2_c2", "text": "带上猎枪暗中摸向黑色岩岗史前石屋群，彻查那个在月下傲视荒原的神秘暗哨。", "target": "stapleton_ch11_part1_spy_on_tor", "pov_switch": null, "pov_switch_name": null}]}, "stapleton_ch10_coombe_control": {"id": "stapleton_ch10_coombe_control", "title": "第十章 华生医生日记摘录（封锁劳拉·里昂斯之口）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "十月二十二日清晨，我骑着快马赶往库姆马西集镇。村里铁匠铺的闲言碎语已然传到了我的耳中：那位自命不凡的华生医生，近来正在四处打听查尔斯老爵士生前暗中资助的慈善对象！\n\n倘若华生或是他背后那位隐匿的幕后主使当真找上了劳拉·里昂斯，我那盘耗尽心血的大棋将面临万劫不复的灭顶之灾！\n\n我不宣而入径直推开了打字行后方的起居室房门。劳拉正神色惶恐地坐在雷明顿打字机前，脸色惨白，头发凌乱。当房门推开、看清我的身影时，她发出了一声交织着惊恐与解脱的哭喊，猛地扑上前死死搂住我的胸膛，展现出那种令我心底作呕的黏腻依附。\n\n‘杰克！’她泪如雨下地攥紧我的大衣翻领，‘谢天谢地你终于来了！庄园来的那个军医正在到处盘问我父亲的佃农！倘若让他们知道在爵士暴毙当晚是我写信约他在侧门相见——倘若他们查出木栅侧门的密约——’\n\n我扣住她的双手手腕，从容而坚决地分开了她死死搂抱的手臂，将她按回扶手椅中。我拉过一张圆凳坐在她正对面，居高临下凝视着她那双充满泪水的栗色眼眸，换上了一副充满深情却又痛心疾首的忧郁神情。\n\n‘劳拉，我唯一的挚爱，’我抚摩着她冰凉额头上散乱的黑发低语道，‘难道你对我这个为你押上全部身家性命的男人，就如此缺乏信任吗？难道你当真不明白，我对外界保持绝对缄默，以及你自己的守口如瓶，才是在这场风暴中保全你性命的唯一坚盾？！’\n\n她战战兢兢地望着我，浑身发抖：‘保全我，杰克？’\n\n‘动动你的脑子，看清你当下面对的法律深渊！’我的嗓音骤然降温，变得如冰冷的手术刀般森寒刺骨，‘你是一个穷困潦倒、被丈夫抛弃的落魄女人。你在案发当天亲笔写下一封十万火急的密信，哀求一位家财万贯的贵族老人在深夜十点独自在偏僻荒凉的花岗岩侧门与你私会！你还以绅士名誉逼迫他读罢立即烧毁信件！而就在当晚，就在约定的时间，老爵士便横死侧门！倘若这封信的内容公之于众，英国法庭的法官与陪审团会怎么想？！他们会指控你伙同奸夫敲诈勒索！他们会认定是你充当诱饵将一个体面的老绅士送入了死地！全伦敦的讼棍会把你撕得体无完肤，最终把你作为谋杀共犯推上埃克塞特的绞刑架！’\n\n一声撕心裂肺的凄厉尖叫从她唇间喷涌而出。她双手死死捂住面孔，在极致的恐慌中如触电般剧烈抽搐。\n\n‘我发誓我一个字都不会说的！’她在泪流满面中近乎发狂般起誓道，‘看在全能上帝的份上，杰克！我宁死也绝不吐露半个音节！就算那个军医找上门来，我也绝不承认自己曾给他写过半个字！我发誓我对查尔斯爵士之死一无所知！’\n\n‘这才是我的乖女孩，’我伏身在她前额印上一记冰冷的吻，‘再死死咬牙坚持七天。为你赎买自由身的巨额离婚费已然尽在我的掌控之中。七天之后，劳拉，我们将永远离开英格兰，在南方的暖阳下开启我们辉煌的新生。’\n\n我将这个惊弓之鸟彻底锁死在被恐慌与虚幻美梦编织的心理牢笼之中。然而当我翻身上马驰骋在荒原的高坡上时，我深知死神留给我的时间已然所剩无几。华生的猎犬鼻子已然嗅到了我的脚后跟，终极决战的屠刀必须在四十八小时内悍然挥下！", "is_ending": false, "clues": ["亲赴库姆马西重申婚姻虚妄诺言，用甜言蜜语与金钱资助进一步麻痹劳拉·里昂斯", "声色俱厉恐吓劳拉一旦向任何人透露半句侧门烧毁信件之事，必将名誉扫地同赴刑场"], "choices": [{"id": "s_ch10_c1", "text": "手持望远镜严密盘查黑色岩岗，暗中跟踪给史前石屋神秘怪客送饭的小厮行踪。", "target": "stapleton_ch11_part1_spy_on_tor", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch10_c2", "text": "【视角切换：歇洛克·福尔摩斯】切换至石屋，见证名侦探根据华生日记锁定L.L.真容。", "target": "holmes_ch10_diary_and_laura", "pov_switch": "holmes", "pov_switch_name": "歇洛克·福尔摩斯"}]}, "stapleton_ch11_part1_spy_on_tor": {"id": "stapleton_ch11_part1_spy_on_tor", "title": "第十一章 岩岗上的人（上：黑色岩岗石屋的神秘暗哨）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "anchor", "anchor_name": "anchor_spy_stapleton", "content": "十月二十三日下午，我手提强力双筒海军望远镜，如猎豹般潜上了海岩岗（High Tor）那犬牙交错的花岗岩绝壁。我的侦察目标直指西侧一英里外：黑色岩岗顶峰那些宛如蜂窝般聚集的不列颠史前圆形石屋遗址。\n\n连续整整三个夜晚，那个在月夜顶峰傲视荒原的瘦高黑影，如同一座开敞的阴森坟墓般死死纠缠着我的梦魇。倘若那个暗哨当真是苏格兰场的便衣密探——甚至更糟，倘若正是伦敦摄政街2704号马车外那位灰眸如刀的神探——我的咽喉距离绞刑架便仅仅只剩下一根游丝的距离！\n\n我将整个身躯楔入两块巨大花岗岩之间的避风裂隙，任凭刺骨的北风从头顶呼啸而过，两支黄铜镜头牢牢锁定了那些古老的石屋残壁。\n\n在漫长而煎熬的两个小时里，除了掠过荒原的秋云阴影与几只在石楠丛中啃食的野羊外，整片死绝之地没有半点生命迹象。然而就在差一刻四点之际，我的苦心侦查终于迎来了突破！\n\n顺着从库姆马西集镇方向蜿蜒而上的羊肠小道，一个精明敏捷的瘦小身影悄然出现在了山脊的拐角处。透过高倍率的凸透镜组，入侵者的面貌瞬间在焦距中心纤毫毕现：那是一个年约十四五岁的少年，穿着一身打满补丁的粗呢夹克，头戴歪斜的报童帽，俨然一副伦敦流浪街童的打扮。在他肩头，斜挎着一只蒙着洁白餐巾的野餐竹篮。\n\n我屏住呼吸，死死追踪着这个少年的一举一动。他像只岩羊般在乱石堆上灵活纵跃，每跨出三步便警惕地向左右四下张望，伦敦街童那深入骨髓的生存嗅觉展露无遗。登上黑色岩岗顶峰后，他毫不迟疑地径直走向了那座最大、也是唯一一座史前石板穹顶保存相对完好的圆形石窟。他猫腰钻入了低矮的石门楣之下。\n\n整整五分钟过去了。少年再次钻出了石门。他手臂上的竹篮已然空空如也，而他的右手里却紧紧攥着一封白色的信封！他将信函迅速塞入贴身口袋，随后飞身跃下峭壁，如离弦之箭般沿着山谷向库姆马西方向飞奔而去！\n\n铁证如山，证据链的最后一环被彻底焊死！\n\n那座三千年前的史前石屋里，确确实实住着一个活人！一个每天由集镇供应面包、肉类与烟草的活人！一个向外界拍发密令的统帅！一个昼伏夜出、忍受着达特穆尔刺骨寒夜，却对亨利爵士与华生医生彻底隐瞒自身行踪的最高谍报核心！\n\n放眼整个大英帝国，究竟何人拥有这等钢铁铸造的非凡耐力、惊天动地的胆识，以及近乎走火入魔的戏剧化狂热，竟敢在达特穆尔刺骨的冰霜荒原上餐风露宿在野兽石窟之中指导破案？！\n\n歇洛克·福尔摩斯！\n\n太阳穴两侧的青筋狂暴突跳，血液如锻铁重锤般轰击着我的耳膜。这位名满天下的神探将了我一军！当我自鸣得意他在伦敦虚耗光阴时，他竟然早已如雄鹰般盘旋在我头顶的黑色绝壁之上，将我的每一步潜行、每一次入沼尽收眼底！\n\n没有时间再玩弄文绉绉的借刀杀人了！更没有时间再去推敲繁复的海外继承诉讼！一旦让福尔摩斯彻底合拢证据链，不出四十八小时，他便会把劳拉·里昂斯、伦敦失窃的旧靴以及恶犬彻底套在我的脖子上！绞刑架的阴影已然笼罩在了我的头顶！\n\n必须在今晚将亨利爵士格杀勿论！只要这位唯一的拦路虎横尸荒野，巴斯克维尔的直系血脉便彻底断绝！我将通过南美的代理律师火速接收全部七十四万镑巨款，在福尔摩斯拼凑出完整的法庭证据之前横渡大西洋，逍遥法外！\n\n我啪的一声合上望远镜，飞身跃下峭壁，踩着沼泽暗径直扑恶兽盘踞的魔窟孤岛！", "is_ending": false, "clues": ["斯台普吞暗中抓到小厮卡特赖特定期向黑色岩岗史前石屋运送面包与烟草的规律", "确凿证实有一位隐秘统帅正深藏荒原石屋严密监控全局，决意先下手为强除掉亨利"], "choices": [{"id": "s_ch11_p1_c1", "text": "火速奔赴泥潭孤岛，将从伦敦偷来的旧黑皮靴浸透气味喂给饥渴暴怒的恶犬。", "target": "stapleton_ch11_part2_setting_scent", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch11_p1_c2", "text": "【视角切换：约翰·H·华生】见证华生在库姆马西打字行以正义辞令攻破劳拉防线。", "target": "ch11_part1_lyons", "pov_switch": "watson", "pov_switch_name": "约翰·H·华生医生"}]}, "stapleton_ch11_part2_setting_scent": {"id": "stapleton_ch11_part2_setting_scent", "title": "第十一章 岩岗上的人（下：给猎犬闻取旧靴气味）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "我一步跨入了泥潭孤岛那座腐烂的木质工棚，面孔冷硬得宛如一块饱经风霜的花岗岩墓碑。\n\n为了将这头恶兽逼入极致的杀戮疯狂，整整四十八个小时里，我未曾给它喂食过哪怕半星肉末或一滴清水。恶兽已被极度的饥饿彻底逼入了发狂的绝境。当听到钥匙在铁锁孔中转动的脆响时，它庞大如牛的身躯如炮弹般猛烈撞击着精钢铁链，暴虐的蛮力险些将深嵌在石墙底座里的铁环生生拔出！焦黄恶臭的唾液泡沫挂满它黑色的嘴角；猩红充血的双眼中喷涌着嗜血的癫狂；粗重急促的喘息顺着裸露的獠牙发出干瘪窒息的尖鸣。\n\n我从油布皮包里掏出了那件死神的信物：那只从伦敦河岸街诺森伯兰旅馆盗取的、亨利·巴斯克维尔爵士穿过的旧黑皮靴。\n\n我缓缓逼近暴躁低吼的恶犬，口中发出那种从它幼年起便用来指引血腥杀戮的尖锐嘶鸣。我将那只沾满干泥的旧鞋帮死死塞到它剧烈耸动的黑色湿润鼻孔前！我甚至粗暴地将磨损的鞋跟直接卡入它的血盆大口之中，逼迫它狠狠咀嚼着坚硬的牛皮，将内衬深处吸附的加拿大男爵人体汗液、体脂油脂与鲜血气味，深深吸入五脏六腑，直到它的兽脑被这种独特的气味彻底烧沸！\n\n狂暴的效果在半秒钟之内显现无遗！\n\n恶兽喉咙深处猛地爆发出一声深沉窒息的狂喜呜咽！它的尾巴犹如铁棍般狂暴地抽打着石板地面；颈项上的肌肉因极度亢奋而高高坟起；四爪在泥地上疯狂抓挠出深沟！它记住了这个气味！它狂暴的心智清晰地意识到，只要撕碎这个散发着汗臭的活人，它腹中的烈火便能得到无尽的甘霖！\n\n我将旧皮靴置于石架上，抓起了盛满特制白磷冷光油膏的广口瓶。我握着野猪鬃硬毛刷，以娴熟冷酷的手法，迅速为它披上死神的战甲。\n\n我将那层冰冷而散发着幽光的剧毒油膏均匀涂刷在它凹陷的眼眶周围，直到它的两只眼睛在黑暗中宛如燃烧着地狱硫磺的深坑；我将毛刷狠狠扫过它獠牙的齿缝边缘、黑亮滴涎的嘴唇，以及胸膛与颈下层层下垂的狰狞鬃毛。\n\n在工棚外，暮色已然被漫天滚滚翻涌、湿冷粘稠的雪白大雾所彻底吞噬。刺骨的寒风在残破石板屋顶的裂隙间发出凄厉如鬼哭的尖啸。\n\n我大步跨到恶犬颈项前，右手死死攥住黄铜项圈上的弹簧插销，啪的一声按下了扳手！\n\n‘杀！’我指着工棚大敞四开的大门厉声咆哮，‘循着气味，撕碎他的喉咙！’\n\n那头恶魔巨兽如同一道从九幽深渊中撕裂而出的霹雳雷霆，轰然暴起扑入了浓雾！\n\n一团燃烧着惨绿与幽蓝交织烈焰的夺命鬼火，在漆黑翻滚的泥浆表面凌空飞跃，巨大的脚爪踏过致命的沼泽，咆哮着瞬间撕开漫天雪白的死雾，狂暴扑向黑色岩岗的方向！\n\n我迈步踏上工棚门槛，在凛冽的夜风中因极致的捕食快感而剧烈战栗，耳朵警惕地竖起偏向悬崖方向，耐心静候着即将响彻天际的绝 死者乃逃犯替身。", "target": "holmes_ch12_part2_selden_death", "pov_switch": "holmes", "pov_switch_name": "歇洛克·福尔摩斯"}]}, "stapleton_ch12_part2_confronting_holmes": {"id": "stapleton_ch12_part2_confronting_holmes", "title": "第十二章 沼地的惨剧（下：错杀逃犯与遭遇福尔摩斯）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "我提着马灯转过悬崖底部的巨石转角，迫不及待地大步迈向横卧在碎石中的那滩扭曲血肉。\n\n然而在尸骸旁，竟然早已跪伏着两条矫健的人影。\n\n我高高举起马灯。昏黄的光柱在照亮那位身材瘦高绅士面庞的一刹那，我肺腑里的呼吸在一秒钟内彻底停滞！\n\n歇洛克·福尔摩斯！\n\n他静静直立起身躯，那对鹰隼般的灰色寒眸在黑暗中宛如两柄剥皮抽骨的手术刀，正冷冷地凝视着我！身旁端立着面带杀气的华生，手中的左轮手枪黑洞洞的枪口直指前方！\n\n极致的眩晕与恐慌瞬间撕裂了我的神智！然而更可怕、比噩梦还要恐怖万倍的景象，却横亘在冰冷的花岗岩地面之上！\n\n死者身上的确紧紧包裹着亨利爵士那套红褐色的粗花呢猎装。然而在马灯光芒的照耀下，那张沾满鲜血脑浆的死人脸，绝非年轻男爵那张轮廓分明的面孔！那是一张狰狞丑陋如野猿、满脸虬结杂乱黑须的凶徒面孔——臭名昭著的诺丁山越狱杀人犯塞尔登！\n\n塞尔登！我的恶犬循着旧靴的气味，追踪的仅仅是这套衣服！是管家白利墨将爵士淘汰的行头施舍给了逃亡的内弟，而饥渴嗜血的恶兽，竟然把这个倒霉的替死鬼硬生生逼下了悬崖！\n\n我内心的每一个细胞都在狂怒与挫败中泣血悲鸣！然而此时此刻，面对近在咫尺的歇洛克·福尔摩斯，我必须强行从脸上挤出最无辜、最优雅的笑容！\n\n‘福……福尔摩斯先生！’我的喉咙干渴得如同荒原的沙砾，结结巴巴地强颜欢笑道，‘真没想到竟能在此地得见真颜！只是……这位不幸罹难的先生究竟是哪位？’\n\n福尔摩斯面无表情地吐出一口烟圈，眼神中带着一种高深莫测的冷酷淡漠：‘一个在荒原上逃亡的重犯，斯台普吞先生。似乎是他失足坠崖跌断了脖子。纯属意外。我和华生明天一早便要搭乘早班火车返回伦敦，我们的假期到此结束了。’\n\n他要回伦敦！福尔摩斯竟然要撤退回京！\n\n他根本不知道内情！他以为这仅仅是一桩普通的逃犯失足意外！这位大神探到底还是漏算了最核心的玄机！\n\n我恭敬地欠身行礼，假惺惺地挤出几句叹惋的辞令，随即转身踩着虚浮的步子遁回迷雾深处的梅利琵宅邸。我的双膝在恐惧中剧烈颤抖，然而我的大脑却在绝境逢生中被疯狂的嗜血杀念重新引燃！\n\n老天爷还留给了我最后一次逆天改命的绝杀契机！明晚，亨利爵士已然应允孤身前来梅利琵宅邸赴宴！只要福尔摩斯一上火车，年轻男爵在深夜十点便必须孤身一人步行横穿达特穆尔！而这一次，我绝不会再犯任何错误！", "is_ending": false, "clues": ["惨死悬崖脚下的竟非爵士，而是身穿亨利淘汰旧西装的诺丁山越狱逃犯塞尔登", "歇洛克·福尔摩斯大侦探本尊竟全副武装携华生屹立在尸体身旁，目光森冷如刀", "斯台普吞在濒死的极度恐慌中强撑笑颜扮演纯良邻居，深知已陷入绝境，唯有最后一击方能翻盘"], "choices": [{"id": "s_ch12_p2_c1", "text": "强压内心的万丈惊恐遁回梅利琵宅邸，下定决心布下最后的夺命鸿门宴做殊死一搏。", "target": "stapleton_ch13_fatal_dinner", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch12_p2_c2", "text": "【视角切换：歇洛克·福尔摩斯】切换至庄园画廊，看神探遮挡雨果画像揭开两百年魔鬼血脉。", "target": "holmes_ch13_portrait", "pov_switch": "holmes", "pov_switch_name": "歇洛克·福尔摩斯"}]}, "stapleton_ch13_fatal_dinner": {"id": "stapleton_ch13_fatal_dinner", "title": "第十三章 设网（梅利琵宅邸的最后鸿门宴）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "anchor", "anchor_name": "anchor_dinner_stapleton", "content": "十月二十四日的这个良夜，是我整整六个月呕心沥血布下这盘惊世棋局的最高潮！\n\n午后三点，贝丽尔再次如疯妇般跪倒在餐厅的地板上死死抓紧我的下摆，歇斯底里地哭喊发誓若我敢在今晚谋害亨利爵士，她便一头撞入泥潭万劫不复。\n\n我再也没有跟她多费半句唇舌。我一记重拳狠狠抽在她的太阳穴上。趁着她头晕目眩瘫软在地毯上之际，我用厚重的窗帘粗绳死死绑紧了她的手腕与脚踝，用一条厚丝巾塞入口腔打结封嘴，将她粗暴地拖上二楼后侧次卧，牢牢绑在冰冷的黄铜床柱之上。我反锁了房门，将沉甸甸的钥匙揣入贴身口袋。\n\n晚间七点整，亨利·巴斯克维尔爵士单刀赴会、如约而至。\n\n他显得兴致极高，红光满面，充满着年轻人的勃勃生机。他亲自向我证实，福尔摩斯与华生确实已搭乘清晨的西行列车返回了伦敦。\n\n‘福尔摩斯先生未能赏光亲临寒舍共进晚餐，当真是万分遗憾，’我脸上挂着体面而得体的惋惜微笑，为他斟满了一大杯醇厚芬芳的陈年波尔多红酒，‘那真是一位头脑非凡的大人物，只是行事风格未免过于戏剧化了些。’\n\n宴席在极具欺骗性的欢声笑语中顺利推展。我扮演着一位博学风趣的庄园主人，从农耕畜牧一直高谈阔论到加拿大的原始森林采伐。亨利爵士一杯接一杯地畅饮着美酒，然而他的目光却总是不自觉地飘向空荡荡的侧门，显然为贝丽尔因‘突发严重偏头痛’无法作陪而深感怅惘。\n\n九点四十分，我借故离席跨入后厨，推开后窗凝视黑夜。\n\n大自然母亲在这一刻竟然全心全意地站在了我的阵营！\n\n从大格林盆泥潭深处，一堵厚重粘稠、遮天蔽日的雪白大雾正犹如汹涌的海啸般顺着石楠苔原向内陆狂暴席卷！不出十五分钟，整片荒原的小径、岔路与指示石块将被彻底吞没！任何凡人在如此浓密如浆的绝命大雾中涉足荒原，都将脆弱盲目得犹如一个刚出生的婴儿！\n\n我飞步穿过后院隐蔽的储藏石棚。我解开恶兽的铁链，将冰冷黏稠的特制白磷油膏飞速涂满了它的双眼、獠牙与背脊，直到整头恶兽在黑暗中通体燃烧起地狱幽火！\n\n客厅里的老式自鸣钟当啷当啷敲响了十点的丧钟。在走廊尽头，亨利爵士已然穿好了厚大衣准备推门告辞！\n\n巴斯克维尔家族的灭顶之刻，终于轰然降临！", "is_ending": false, "clues": ["亨利爵士单刀赴会孤身抵梅利琵宅邸赴宴，深信福尔摩斯与华生已然乘车返回伦敦", "斯台普吞在二楼反锁的卧房中将企图示警的贝丽尔彻底五花大绑在床柱上封嘴囚禁", "借口查看天色溜出后院，调配剧毒冷光白磷，静候大雾将唯一的泥潭小道彻底切断"], "choices": [{"id": "s_ch13_c1", "text": "在深夜十点亨利爵士踏入夜色时，解开暗室铁链放出通体燃烧地狱磷火的嗜血巨兽。", "target": "stapleton_ch14_part1_release_hound", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch13_c2", "text": "【视角切换：歇洛克·福尔摩斯】切换至巨石埋伏圈，见证神探三人组在滚滚白雾中拔枪以待。", "target": "holmes_ch14_part1_fog_ambush", "pov_switch": "holmes", "pov_switch_name": "歇洛克·福尔摩斯"}]}, "stapleton_ch14_part1_release_hound": {"id": "stapleton_ch14_part1_release_hound", "title": "第十四章 巴斯克维尔的猎犬（上：迷雾施放猎犬与枪声骤响）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "anchor", "anchor_name": "anchor_climax_stapleton", "content": "我蜷缩在后厨大门的深黑阴影之中，屏息凝视着亨利爵士迈开步子踏上碎石小道。他在院门前停顿了片刻，系紧了大衣的纽扣抵御刺骨寒气，随后大步流星踏上了紧挨大格林盆泥潭边缘的返程小道。\n\n仅仅走出了二十码远，滚滚翻涌的雪白大雾便如怪兽巨口般将他的身形彻底吞噬。\n\n就是现在！\n\n我如离弦之箭般冲入储藏石棚。那头恶犬在极度饥饿的狂怒驱使下早已癫狂嗜血，两排巨齿咬得空气噼啪作响，口吻与眼眶喷涌着骇人的幽绿地狱鬼火！\n\n我一把扯掉了项圈上的保险栓！\n\n‘去！’我指着小道的方向咬牙厉哮，‘把他撕成碎片！’\n\n巨兽发出一声惊天动地的狂暴咆哮，轰然破雾扑出！一道在石楠苔原上凌空飞跃的幽绿闪电，以惊人的狂飙时速瞬间没入了茫茫白雾之墙！\n\n我傲立在庭院碎石上，两手死死按住狂跳的心脏，贪婪地侧耳倾听着即将响彻天际的骨碎肉烂绝命惨叫！\n\n一秒……两秒……五秒……\n\n然而，从大雾深处猛然炸响的一声厉声暴喝，却如九天玄雷般将我的三魂七魄当场震碎！\n\n‘注意隐蔽！它来了！’\n\n歇洛克·福尔摩斯！\n\n还没等我僵死的大脑理清这场灭顶之灾，整片迷雾荒原瞬间化作了一片火海！\n\n砰！砰！砰！砰！砰！\n\n密集如爆豆般的重型军用左轮手枪齐射火光刺破浓雾！一声撕裂苍穹的凄厉嚎叫——绝非人类的惨呼，而是恶兽中弹濒死的绝命长嗥！紧接着是一阵巨体砸落草丛的疯狂翻滚抓挠声，随后是最后一记清脆补枪的枪响，伴随着一声微弱的抽搐悲鸣，彻底绝了生息。\n\n死寂。\n\n我的恶犬被打死了！\n\n福尔摩斯根本未曾离境！他在巨石圈外布下了天罗地网！苏格兰场的神探与荷枪实弹的宪警距离我的家门仅仅只有五十码远！\n\n恐慌——一种原始、盲目、彻底扼死理智的绝灭恐惧瞬间摧毁了我钢铁般的意志！一旦被捕，埃克塞特监狱那冰冷的绞刑架便将套死在我的脖颈之上！\n\n我猛然转身撞入后门，一把抓起防湿长筒靴，一头扎入了翻滚如海的大雾之中，亡命奔向大格林盆泥潭的无底深渊！", "is_ending": false, "clues": ["借着滚滚白雾掩护解开项圈，指使燃烧着幽蓝烈焰的食人恶兽扑向亨利爵士后背", "浓雾深处突然爆发出密集如爆豆般的左轮手枪齐射火光，伴随着恶犬临死前震碎云霄的凄厉悲鸣"], "choices": [{"id": "s_ch14_p1_c1", "text": "深知大势已去，抛下一切仓皇逃入漆黑大雾笼罩的大格林盆泥潭深处。", "target": "stapleton_ch14_part2_panic_flight", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch14_p1_c2", "text": "【视角切换：歇洛克·福尔摩斯】切换至决战前线，看神探连射五枪粉碎两百年魔咒。", "target": "holmes_ch14_part1_fog_ambush", "pov_switch": "holmes", "pov_switch_name": "歇洛克·福尔摩斯"}]}, "stapleton_ch14_part2_panic_flight": {"id": "stapleton_ch14_part2_panic_flight", "title": "第十四章 巴斯克维尔的猎犬（下：恶犬毙命与绝命逃遁）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "branch", "anchor_name": null, "content": "我跌跌撞撞地一头撞入了大格林盆泥潭那片翻滚涌动的雪白大雾之中，胸膛中的心脏狂暴撞击得犹如一台濒临爆炸的引擎。\n\n在我身后梅利琵宅邸的方向，男人们愤怒的呐喊声穿透浓雾滚滚袭来。我清晰地听到了雷斯垂德那威严刺耳的搜查命令，以及大头皮鞋践踏地板的沉重撞击声！他们找到贝丽尔了！那个饱受皮鞭折磨的女人必将招供出一切——她会带着军警径直抄了我隐匿在孤岛上的魔窟！\n\n我必须登上孤岛！我必须取回藏在石缝里的假护照、巨额金镑现钞以及那只定罪的加拿大旧皮靴，借着大雾一路向北潜逃至布里斯托尔海峡登船出境！\n\n然而四周的迷雾浓稠得宛如一堵移动的大理石墙壁，伸手不见五指，我甚至连自己的膝盖都看不清。我全凭记忆踏上暗径，胸口剧烈起伏抽搐。\n\n左三步……右两步……横跨三英尺泥炭……随后斜向猛跃踏上那块沉在水下的花岗岩暗石！\n\n我的皮靴重重踏上了石头。我再次飞身一跃。\n\n可是插在泥潭里的柳树标记枝条在哪儿？！我伸出颤抖的双手在白茫茫的死雾中发狂般摸索。标记不见了！是被受惊的野马踩断了？还是上涨的泥浆吞没了标记？！\n\n一声惊骇欲绝的尖叫从我干涸的喉咙深处喷涌而出。在极致的恐慌中，我仓皇向前迈出了一大步！\n\n然而就在我的右脚踏落的一刹那，脚下结实的泥土瞬间崩溃了！\n\n那不是开裂——而是融化！一股令人作呕、犹如巨大冰冷果冻般的万钧吸力死死咬住了我的脚踝，以无可抗拒的蛮力将我向下疯狂拖拽！\n\n‘不——！’我撕心裂肺地尖叫，十指如鹰爪般发疯抓挠着表面伪装成草坪的绿色浮苔！\n\n浮苔在我的血肉模糊的指甲缝中碎裂剥离。我的整条右腿膝盖瞬间陷入了翻滚恶臭的黑色烂泥之中。我拼尽一头濒死恶狼的全部野性疯狂扑腾、蹬踹，拼命将整个后背向后拉扯倾斜！\n\n然而每一次挣扎，都只是在成倍加速那万丈深渊的吞噬速度！冰冷刺骨、腥臭难闻的远古污泥迅速漫过了我的大腿——漫过了我的腰际——漫过了我的胸膛！那股混合着剧毒硫磺与腐殖质的地狱恶臭死死堵塞了我的鼻腔！\n\n穿透重重迷雾，在遥远的天地尽头，我隐约听到了普利茅斯开往伦敦的夜班特快列车那雄浑清脆的汽笛长鸣。那是现代文明！那是泼天的富贵！那是活生生的生命！然而这一切，都在不可逆转地向着万丈黑渊急速坠落！\n\n‘贝丽尔——！’我绝望地对着虚无的雾海仰天凄厉哀嚎，‘救救我啊——！’\n\n回应我的，唯有泥沼深处那咕嘟翻滚的一串串冰冷恶臭的毒气水泡。粘稠冰冷的黑色泥浆无情漫过了我的下巴，漫过了我绝望抽搐的嘴唇，最终彻底吞噬了我那双圆睁暴突的眼球。\n\n大格林盆泥潭，用它那永恒无底的冰冷怀抱，将恶魔永远封锁在了大地的最核心。", "is_ending": false, "clues": ["斯台普吞在伸手不见五指的大雾中惊慌失措仓皇踏入大格林盆泥潭", "在狂乱狂奔中迷失了沉水暗石的方向，失足踏破浮草坠入万丈泥浆死渊", "被大格林盆泥潭那万劫不复的冰冷污泥彻底漫过头顶活活吞噬，化作永恒坟墓"], "choices": [{"id": "s_ch14_p2_c1", "text": "在绝望挣扎中彻底沉入大格林盆泥潭无底深渊，魂归死沼（正统宿命终局）。", "target": "ch15_mire", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch14_p2_c2", "text": "在泥潭边缘遭雷斯垂德生擒活捉，解往老贝利法庭领受绞刑架的正义裁决。", "target": "ch15_arrest", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch14_p2_c3", "text": "见证福尔摩斯在贝克街暖融融的壁炉旁，彻底解剖斯台普吞全部罪恶解构。", "target": "ch15_holmes", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch14_p2_c4", "text": "见证忠诚果决的华生医生神勇发枪击毙恶犬，破除百年恶咒的英雄篇章。", "target": "ch15_watson", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch14_p2_c5", "text": "正义终得昭雪，巴斯克维尔庄园重沐理性晨曦，百年阴霾一扫而空的圆满凯旋。", "target": "ch15_victory", "pov_switch": null, "pov_switch_name": null}, {"id": "s_ch14_p2_c6", "text": "反思亨利爵士罹患重度神经衰弱远渡重洋的惨痛创伤，罪恶虽诛伤痛难泯。", "target": "ch15_tragedy", "pov_switch": null, "pov_switch_name": null}]}}}};
