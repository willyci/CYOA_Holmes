n“没有了，爵爷，我们一动，它就粉碎了。”\n\n“查尔兹爵士还收到过同样笔迹的信件吗？”\n\n“噢，爵爷，我并没有特别注意他的信件。只是因为这封信是单独寄来的，所以我才注意到了它。”\n\n“你也弄不清Ｌ．Ｌ．是谁吗？”\n\n“弄不清，爵爷，我比您知道得并不多。可是我想，如果咱们能够找到那位女士的话，那么关于查尔兹爵士的死，咱们就会多知道些情况了。”\n\n“我真莫名其妙，白瑞摩，这样重要的情况你怎么竟会秘而不宣？”\n\n“噢，爵爷，那正是我们自己的烦恼刚刚到来之后。还有就是，爵爷，我们两人都很敬爱查尔兹爵士，我们不能不考虑到他对我们的厚意。我们认为把这件事兜出来对我们那位可怜的主人并没有什么好处，再加以这问题还牵连到一位女士，当然就更该小心从事了。即使是在我们当中最好的人……”\n\n“你以为这一点会有伤他的名誉吗？”\n\n“嗯，爵爷，我想这总不会有什么好结果的。可是您现在对我们这样好，使我觉得，如果我不把这件事的全部情况都告诉您，那我就太对不起您了。”\n\n“好极了，白瑞摩，你可以走了。”当管事的走了以后，亨利爵士转身向我说道，“喂，华生，您对这新发现怎么看法？”\n\n“好象又是一个难解的问题，弄得比以前更加使人莫名其妙了。”\n\n“我也是这样想呢，可是只要咱们能够查明Ｌ．Ｌ．这个人，可能就会把整个问题都搞清楚了。咱们能得到的线索就是这么多了，咱们已经知道，有人了解事情的真相，只要能找到她就好了。您认为咱们应当从何着手呢？”\n\n“马上将全部经过告诉福尔摩斯，这样就能把他一直在寻找的线索供给他了。如果这样还不能把他吸引到这里来，那才真是怪事呢。”\n\n我马上回到自己的屋里去，给福尔摩斯写了关于今早那次谈话的报告。我很清楚，他最近很忙，因为从贝克街寄来的信很少。写得也短，对于我所供给他的消息也没有提出什么意见，而且更难得提到关于我的任务。无疑的是他的精神已全部贯注在那封匿名恐吓信的案件上面了。可是，事情的这种新的进展，定会引起他的注意并能恢复他对这个案子的兴趣的。他现在若是在这里有多好啊。\n\n十月十七日——今天大雨终日，浇得常春藤唰唰作响，房檐水滴沥沥。我想起了那个身处荒凉、寒冷而又无遮无盖的沼地里的逃犯。可怜的人啊！不管他犯的是什么罪，他现在所吃的苦头，也总算赎了他的罪了。我又想起了另一个人——\n\n马车里的那个面孔，月亮前面的那个人影，那个隐蔽的监视者和不可解的人——难道他也暴身于倾盆大雨之中吗？傍晚时分，我穿上了雨衣雨鞋，在湿软的沼地里走出去很远，心里充满着可怕的想象，雨打在我的脸上，风在我的耳旁呼哨。\n\n但求上帝援助那些流落在大泥潭里的人吧，因为连坚硬的高地都变成了泥淖了。我终于找到了那黑色的岩岗，就是在这岩岗上，我看到过那个孤独的监视人，我从它那嵯峨的绝顶，一眼望到远近一无树木的阴惨的高地。暴风夹杂着大雨，刷过赤褐色的地面，浓重的青石板似的云层，低低地悬浮在大地之上，又有绺绺的灰色残云，拖在奇形怪状的山边。在左侧远处的山沟里，巴斯克维尔庄园的两座细长的塔楼，隔着雾气，半隐半现地矗立在树林高处。除了那些密布在山坡上的史前期的小房之外，这要算是我所能见到的唯一的人类生活的迹象了。哪里也看不到两晚之前我在同一地点所见到过的那个孤独的人的踪影。\n\n当我走回去的时候，摩梯末医生赶了上来，他驾着他那辆双轮马车，走在一条通向边远的弗欧麦尔农舍的坎坷不平的沼地小路上。他一向非常关心我们，几乎没有一天他不到庄园来看看我们过得好不好。他一定要我上他的马车，所以我就搭他的车回家了。我知道他近来由于那只小长耳獚犬的失踪而非常烦恼；那小狗自从有一次乱跑跑到沼地里去以后，一直没有回来。我尽可能地安慰了他，可是我一想起了格林盆泥潭里的小马，也就不再幻想他会再见到他的小狗了。\n\n“我说，摩梯末，”当我们在崎岖不平的路上颠簸摇晃着的时候我说，“我想在这里凡是乘马车能到达的住家，您很少有不认识的人吧。”\n\n“我想，简直没有。”\n\n“那么，您能不能告诉我，哪些女人的姓名的字头是Ｌ．Ｌ．呢？”\n\n他想了几分钟。\n\n“不能，”他说道，“有几个吉卜赛人和作苦工的我就不知道，而在农民或是乡绅之中没有一个人的姓名的字头是这样的。哦，等一等，”他停了一下之后又说，“有一个劳拉·莱昂丝——她那姓名的字头是Ｌ．Ｌ．——可是她住在库姆·特雷西。”\n\n“她是谁啊？”我问道。\n\n“她是弗兰克兰的女儿。”\n\n“什么！就是那个老神经弗兰克兰吗？”\n\n“正是，她和一个到沼地来画素描的姓莱昂丝的画家结了婚。可是，他竟是个下流的坏蛋，他遗弃了她。根据我所听到的情况判断，过错可能并不完全在于一方。任何有关她的事，她父亲决定一律不管，因为她没有得到父亲的同意就结了婚，也许还有其他原因。由于这放荡的老家伙和女儿之间的不和，弄得这女子陷入了窘迫的境地。”\n\n“那她怎么生活呢？”\n\n“我想老弗兰克兰会给她一些资助的，可是不可能多，因为他自己的那些乱事已经把他拖累得相当够受了。不管她是如何的罪有应得，总不能让她不可救药地趋于堕落啊。她的事传出去以后，此地有些人就设法帮助她，使她能过正当的生活。斯台普吞和查尔兹都帮了忙，我也给过一点钱，为的是让她作起打字的营业来。”\n\n他想知道我问这些问题的目的何在，可是我没法满足他的好奇心，并没有告诉他许多，因为我没有理由对随便任何人都给以信任。明早我要到库姆·特雷西去。如果我能见到那位名声暧昧的劳拉·莱昂丝太太的话，就会把为弄清这一连串神秘莫测的事情所做的调查工作大大地向前推进一步了。我一定发展到象蛇一样地聪明了，因为当摩梯末追问到很不便回答的时候，我就随便地问了问他弗兰克兰的颅骨属于哪一种类型。这样一来，一直到抵达目的地为止，除了头骨学之外就什么也听不到了。我总算没有白和歇洛克·福尔摩斯相处了这么多年。\n\n在这狂风暴雨的阴惨的天气里，只有一件值得记载的事。\n\n那就是我刚才和白瑞摩的谈话，他又给了我一张能在适当的时候亮出来用的有力的好牌。\n\n摩梯末留下来吃了晚饭，饭后他和准男爵两人玩起牌来。\n\n管事的到书房来给我送咖啡，我乘机问了他几个问题。\n\n“啊，”我说道，“你那好亲戚已经走了呢？还是仍然隐藏在那里？”\n\n“我不知道，先生。但愿他已经走了，因为他在这里只能给人添麻烦。从我最后一次给他送了食物之后，再没有听到过关于他的情况，那已是三天以前的事了。”\n\n“那一次你看到他了吗？”\n\n“没有，先生，可是当我再到那里去的时候，食物已经不见了。”\n\n“那么说，他一定还在那里呢？”\n\n“先生，除非是被另外那个人拿去，否则您一定会认为他还在那儿呢。”\n\n我坐在那里，咖啡还没有送到嘴边就又盯住他问道：“那么说，你是知道还有另外一个人罗？”\n\n“是的，先生，在沼地里还有另外一个人。”\n\n“你见到他了吗？”\n\n“没有，先生。”\n\n“那你怎么知道的呢？”\n\n“是塞尔丹告诉我的，先生，在一星期以前或是更早一些的时候。他也在藏着呢，可是据我估计他并不是逃犯。这些事我真伤脑筋，华生医生——我和您坦白地说吧，先生，这些事真让我伤脑筋。”他突然带着真挚热切的情感说道。\n\n“现在，你听我说，白瑞摩！我只是为了你的主人，否则对于这样的事我是毫无兴趣的。我到这里来除了帮助他之外，没有其他目的。坦白地告诉我吧，究竟是什么使你这样伤脑筋呢？”\n\n白瑞摩犹豫了一会儿，似乎是后悔不该冲口说出或是感觉难以用言语表达自己的感情。\n\n“就是这些不断发生的事，先生，”他终于对着被雨水冲刷着的向沼地而开的窗户挥舞着手喊了起来，“我敢肯定那里在进行着暗杀的勾当，正在酝酿着一个可怕的阴谋！先生，我真希望亨利爵士能回到伦敦去呢。”\n\n“可是，使你这样惊恐不安的有什么事实根据呢？”\n\n“您看查尔兹爵士的死！就拿验尸官所说的那些话来说，就已经够糟糕的了。您再看夜间沼地里的怪声，日落之后，就是您给多少钱也没有人肯从沼地里走过去。还有藏在那里的那个人，他在那里窥伺等待着！他等待什么呢？用意又是什么呢？所有这些，对巴斯克维尔家的任何人说来，都绝不是什么好兆。到亨利爵士的新仆人们来接管庄园的那一天，我是会很乐于离开这一切的。”\n\n“可是关于沼地里的这个陌生人，”我说道，“你能告诉我些什么吗？塞尔丹说过什么？他找到了他的藏身之所或是发现了他正在干什么吗？”\n\n“塞尔丹看到过他一两次，可是他是个很阴险的家伙，什么情况也不肯暴露。起初他想那人是个警察，可是不久他发现了那人自己另有计划。据他看来，那人象是个上流人物，可是他弄不清楚他究竟在干些什么。”\n\n“他说过那人住在什么地方吗？”\n\n“在山坡上古老的房子里——就是那古代人住过的小石头房子。”\n\n“可是他吃饭怎么办呢？”\n\n“塞尔丹发现有一个为他服务的小孩，给他送他所需要的东西。我敢说，那小孩是到库姆·特雷西去弄他需要的东西的。”\n\n“好极了，白瑞摩。这个问题咱们改日再深谈吧。”管事的走了以后，我透过模糊的窗玻璃，望着外面奔驰的云朵，和那被大风横扫的树顶联成的高低不一的轮廓线。这样的夜晚在室内就已够险恶的了，在沼地的一栋石屋里是什么味道就更不用说了。多么强烈的恨才能使一个人在这种时候潜藏在那样的地方！究竟是什么样的深远和急不可待的目的才使得他如此不辞辛劳！看来使我困扰万分的问题的中心就在沼地的那所房子里。我发誓要在明天尽一切可能探明那神秘的核心。", "is_ending": false, "clues": ["白瑞摩为报不告之恩，透露查尔斯爵士壁炉中烧焦的信件残片：‘……十点钟务请至大门前相见。L.L.’", "摩梯末医生证实L.L.即库姆·特雷西的劳拉·里昂斯夫人——弗兰克兰德婚姻不幸的女儿", "弗兰克兰德得意夸口其望远镜发现一个男孩每天提着食物篮送往岩岗的史前石屋"], "choices": [{"id": "ch10_c1", "text": "立即动身前往库姆·特雷西，当面问询劳拉·里昂斯夫人。", "target": "ch11_part1_lyons", "pov_switch": null, "pov_switch_name": null}, {"id": "ch10_c2", "text": "攀登黑色岩岗，直扑弗兰克兰德望远镜所见的神秘史前石屋据点。", "target": "ch11_part1_lyons", "pov_switch": null, "pov_switch_name": null}]}, "ch11_part1_lyons": {"id": "ch11_part1_lyons", "title": "第十一章 岩岗上的人（上：问讯劳拉·里昂斯）", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "branch", "anchor_name": null, "content": "用摘录我日记的方法写成的上一章，已经叙述到十月十八日了。那时正是这些怪事开始迅速发展，快要接近可怕的结局的时候。随后几天所发生的事情都已难忘地铭刻在我的记忆之中，不用参考当时所作的记录我就能说得出来。我就从明确了两个极为重要的事实的次日说起吧。所说的两个事实之一，就是库姆·特雷西的劳拉·莱昂丝太太曾经给查尔兹·巴斯克维尔爵士写过信，并约定在他死去的那个地点和时间相见；另一个就是潜藏在沼地里的那个人，可以在山边的石头房子里面找到。掌握了这两个情况之后，我觉得如果我还不能使疑案稍露端倪，那我一定不是低能就是缺乏勇气了。\n\n昨天傍晚，未能得到机会把我当时所了解到的关于莱昂丝太太的事告诉准男爵，因为摩梯末医生和他玩牌一直玩到很晚。今天早饭时，我才把我的发现告诉了他，并问他是否愿意陪我到库姆·特雷西去。起初他很急于要去，可是经过重新考虑之后，我们两人都觉得，如果我单独去，结果会更好一些。因为访问的形式愈是郑重其事，我们所能得知的情况就会愈少。于是我就把亨利爵士留在家里了，心中难免稍感不安地驾车出发去进行新的探索了。\n\n在到了库姆·特雷西以后，我叫波金斯把马匹安置好，然后就去探听我此来所要探访的那位女士了。我很容易地就找到了她的住所，位置适中，陈设也好。一个女仆很随便地把我领了进去，在我走进客厅的时候，一位坐在一架雷明吞牌打字机前的女士迅速地站了起来，笑容可掬地对我表示了欢迎；可是当她看出我是个陌生人的时候，她的面容又恢复了原状，重新坐了下来，并问我来访的目的。\n\n莱昂丝太太给人的第一个印象就是极端的美丽。她的两眼和头发都发深棕色，双颊上虽有不少雀斑，然而有着对棕色皮肤的人说来恰到好处的红润，如同在微黄的玫瑰花心里隐现着悦目的粉红色似的。我再重复一遍，首先产生的印象就是赞叹。可是随后就发现了缺点，那面孔上有些说不出来的不对头的地方，有些粗犷的表情，也许眼神有些生硬，嘴唇有些松弛，这些都破坏了那一无瑕疵的美貌。当然了，这些都是事后的想法，当时我只知道我是站在一个非常漂亮的女人的面前，听着她问我来访的目的。直到那时我才真的认识到我的任务是多么的棘手。\n\n“我有幸地，”我说道，“认识您的父亲。”\n\n这样的自我介绍作得很笨，我由那女人的反应上感觉得出来。\n\n“我父亲和我之间没有什么关系，”她说道，“我什么也不亏欠他，他的朋友也不是我的朋友。如果没有已故的查尔兹·巴斯克维尔爵士和一些别的好心肠的人的话，我也许早就饿死了，我父亲根本就没把我放在心上。”\n\n“我是因为有关已故的查尔兹·巴斯克维尔爵士的事才到这里来找您的。”\n\n惊吓之下，女士的面孔变得苍白起来，雀斑因而变得更加明显了。\n\n“关于他的事我能告诉您什么呢？”她问道。她的手指神经质地玩弄着她那打字机上的标点符号字键。\n\n“您认识他，是吗？”\n\n“我已经说过了，我非常感激他对于我的厚意。如果说我还能自立生活的话，那主要是由于他对我的可悲的处境的关心了。”\n\n“您和他通过信吗？”\n\n女士迅速地抬起头来，棕色的眼睛里闪着愤怒的光芒。\n\n“您问这些问题用意何在呢？”她厉声问道。\n\n“目的在于避免丑闻的传播。我在这里问总比让事情传出去弄得无法收拾要好一些吧。”\n\n她沉默不语，她的面孔依然很苍白。最后她带着不顾一切和挑战的神色抬起头来。\n\n“好吧，我回答吧，”她说道，“您的问题是什么？”\n\n“您和查尔兹爵士通过信吗？”\n\n“我确实给他写过一两次信，感谢他的体贴和慷慨。”\n\n“发信的日期您还记得吗？”\n\n“不记得了。”\n\n“您和他会过面吗？”\n\n“会过面，在他到库姆·特雷西来的时候会过一两次面。\n\n他是个很不爱出头露面的人，他宁愿暗地里做好事。”\n\n“可是，如果您很少看到他而又很少给他写信的话，关于您的事他怎么会知道得那样多，以致象您所说的那样来帮助您呢？”\n\n她毫不犹豫地回答了这个我认为是难于回答的问题。\n\n“有几个绅士知道我的可悲的经历，他们共同帮助了我。\n\n一个是斯台普吞先生，他是查尔兹爵士的近邻和密友，他心肠好极了，查尔兹爵士是通过他才知道我的事的。”\n\n我知道查尔兹·巴斯克维尔爵士曾有几次邀请斯台普吞负责为他分发救济金，因此女士的话听来倒似乎真实。\n\n“您曾经写过信给查尔兹爵士请他和您见面吗？”我继续问道。\n\n莱昂丝太太又气得脸红起来。\n\n“先生，这真是岂有此理的问题。”\n\n“我很抱歉，太太，可是我不得不重复它。”\n\n“那么我就回答吧，肯定没有过。”\n\n“就是在查尔兹爵士死的那天也没有过吗？”\n\n脸上的红色马上褪了下去，在我面前出现了一副死灰的面孔。她那焦枯的嘴唇已说不出那“没有”来了。与其说我听到了，不如说我是看出来了。\n\n“一定是您的记忆愚弄了您，”我说道，“我甚至能够背出您那封信中的一段来，是这样的：‘您是一位君子，请您千万将此信烧掉，并在十点钟的时候到栅门那里去。’”\n\n当时，我以为她已经晕过去了，可是她竟尽了最大的努力使自己恢复了镇静。\n\n“难道天下就没有一个真正的君子吗？！”她的呼吸变得急促起来。\n\n“您冤枉查尔兹爵士了。他确已把信烧掉了，可是有时虽是一封烧了的信还是可以认得出来的。您现在承认您曾写过这封信了吗！”\n\n“是的，我写过，”她喊道，同时把满腹的心事都滔滔不绝地说了出来，“是我写的。我干什么要否认这事呢？我没有理由要因此而感到可耻，我希望他能帮助我，我相信如果我能亲自和他见面的话，就可能得到他的协助，因此我才请求他和我见面的。”\n\n“可是为什么约在这样一个时间呢？”\n\n“因为那时我刚知道他第二天就要到伦敦去，而且一去也许就是几个月。由于其他原因我又不能早一点到那里去。”\n\n“可是为什么要在花园里会面而不到房子里面去拜访呢？”\n\n“您想，一个女人能在那个时候单独到一个单身汉的家里去吗？”\n\n“噢，您到那里去了以后，发生了什么事没有？”\n\n“我并没有去。”\n\n“莱昂丝太太！”\n\n“没有去，我拿一切我认为是最神圣的东西向您发誓。我没有去。有一件事使我不能去了。”\n\n“那是件什么事呢？”\n\n“那是一件私事，我不能说。”\n\n“那么，您承认您曾和查尔兹爵士约定在那正是他死去的时间和地点相会，可是您又否认您曾守约前往。”\n\n“这是实情。”\n\n我一再地盘问了她，可是往下再也问不出什么东西来了。\n\n“莱昂丝太太，”最后我结束了这次既长而又毫无结果的拜访，站起来说道，“由于您不肯全部彻底地说出您所知道的事，使您负起了严重的责任，并已把您自己置于非常危险的地位。如果我不得不叫来警察协助的话，您就会知道您受着多么大的嫌疑了。如果您是清白无罪的话，那为什么最初要否认在那一天您曾写信给查尔兹爵士呢？”\n\n“因为我恐怕从那问题上得出什么不正确的结论来，那样我就可能被牵连到一件丑闻中去了。”\n\n“那么您为什么那样迫切地要求查尔兹爵士把您的信毁掉呢？”\n\n“如果您已经读过那封信的话，您就应该知道了。”\n\n“我并没有说我读过信的全部啊。”\n\n“您却引用了其中的一部分。”\n\n“我只引用了附笔，我说过，那封信已被烧掉了，而且并非全信都能辨认。我还要问您，为什么您那样迫切地要求查尔兹爵士把他临死那天所收到的这封信毁掉呢？”\n\n“因为这是一件纯属私人之间的事。”\n\n“更重要的原因恐怕是您要避免公开的追究调查吧。”\n\n“那么我就告诉您吧，如果您曾听过任何关于我的悲惨的经历的话，您就会知道我曾经草率地结过婚，事后当然又因此而懊悔。”\n\n“我听到过很多了。”\n\n“我过着不断遭受我已厌恶透顶的丈夫迫害的生活。法律袒护着他，每天我都面临着被迫和他同居的可能。在我给查尔兹爵士写这封信的时候，我听说如果我能支付一笔钱的话，我就可能重获自由了。这就是我所想望的一切——心地宁静、幸福、自尊——这就是一切。我知道查尔兹爵士是慷慨的，而且我想，如果他听我亲口讲出这事的话，他就一定会帮助我。”\n\n“那么您为什么又没有去呢？”\n\n“因为就在那时候，我又从别处得到帮助了。”\n\n“那么，为什么您没有写信给查尔兹爵士解释这件事呢？”\n\n“如果第二天早晨我没有在报上看到他的噩耗的话，我一定会这样做的。”\n\n那女人的叙述前后相符，我提尽了所有的问题也找不出破绽来。我只能调查一下，是否恰在悲剧发生的时候或是接近悲剧发生的时候，她确曾通过法律程序向她丈夫提出过离婚诉讼。", "is_ending": false, "clues": ["劳拉·里昂斯夫人承认写信求助查尔斯爵士以筹资办理离婚", "她坚决否认案发当夜去过水松夹道栅门，声称因有人另予相助而爽约", "华生敏锐察觉她在极度恐惧中隐藏着致命的内情"], "choices": [{"id": "ch11_p1_c1", "text": "驱车返回达特沼地，直上黑色岩岗探查史前石屋据点。", "target": "ch11_part2_stone_hut", "pov_switch": null, "pov_switch_name": null}, {"id": "ch11_p1_c2", "text": "严厉追问劳拉·里昂斯夫人暗中资助她的是否正是斯台普吞。", "target": "ch11_part2_stone_hut", "pov_switch": null, "pov_switch_name": null}]}, "ch11_part2_stone_hut": {"id": "ch11_part2_stone_hut", "title": "第十一章 岩岗上的人（下：石屋隐士的真面目）", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "anchor", "anchor_name": "anchor_man_on_tor", "content": "看来，如果她真的去过巴斯克维尔庄园的话，恐怕她不见得敢说她没有去过。因为她总得坐马车才能到那里去，这样的话，要到第二天清晨她才能回到库姆·特雷西，这样一次远行是无法保守秘密的。因此，最大的可能就是，她说的是实话，或者说至少有一部分是实情。我垂头丧气地回来了，这是再度的碰壁，这堵墙好象是修在每一条我想通过它而抵达目的地的路上似的。可是我愈想象那女士的面孔和她的神情，我就愈觉得她还有些东西是瞒着我的。为什么她的脸要变得那样苍白呢？为什么她每次都要竭力否认而只有到了迫不得已的时候才承认呢？在悲剧发生的时候，为什么她那样保持沉默呢？当然罗，对这些问题的解释并非象她解释给我听的那样简单。目前，沿此方向我已无法再前进一步，只好转到沼地里的石屋去搜寻其他线索了。\n\n可是这也是个希望极为渺茫的方向，在我回去的路上我感到了这一点。我看到一座山接着一座山，上面都有古时人们生活的遗迹。白瑞摩只不过说那个人住在这些废弃不用的小房之中的一幢里，这种小房子成百成千地散布在整个的沼地里。幸而我曾看见过那人站在黑岩岗的绝顶上，我不妨就先以此作为线索，把我看到过他的那个地方作为进行搜寻的中心。我应当从那里开始查看沼地里的每一幢小房，直至找到我要找的那幢为止。如果那人呆在房内的话，我要让他亲口说明他是谁，为什么要这么长时期地跟踪我们，必要时甚至不惜用我的手枪逼着他说。在摄政街的人群里他也许能从我们的手中溜跑，可是在这样荒漠的沼地里，恐怕他就会感到不知如何是好了。但是如果我找到了那小房而那人不在房里的话，不管需要熬多久的夜，我也要在那里等着，直到他回来为止。在伦敦，福尔摩斯让他溜跑了，在我的师傅失败之后，如果我能将他查出的话，对我说来确是一个很大的胜利。\n\n我们在对这个案件进行调查的工作中，运气一再地不佳，可是现在我竟时来运转了，而送来好运道的使者不是别人，恰是弗兰克兰先生。他胡须花白，面色红润，正站在他那花园的门口，那园门端正地开向我要走过的大道。\n\n“好啊，华生医生，”他兴致勃勃地喊道，“您真得让您的马休息一下了，进来喝一杯酒祝贺我吧。”\n\n在听到他如何对待他的女儿以后，我对他实在说不上还有什么好感，可是我正急于想把波斯金和马车遣回家去，这确实是个好机会。我下了车，给亨利爵士写了个便条，说明我要在晚饭时分散步回去。然后我就跟着弗兰克兰先生走进了他的饭厅。*\n\n“对我说来可真是个了不起的一天啊，先生，是我一生里的一个大喜的日子，”他不停地格格地笑着，一面喊道，“我已了结两件案子了。我一定要教训一下这里的人们，让他们知道，法律就是法律。这儿竟还有个不怕打官司的人呢。我已证实了有一条公路整整穿过老米多吞的花园的中心，先生，离他的前门不到一百码。您对这点觉得如何？咱们真得教训教训这帮大人物了，让他们知道知道，不能任意蹂躏平民的权利，这些个混蛋！我还封闭了一片弗恩沃西家的人常去野餐的树林。这些无法无天的人们似乎认为产权根本不存在，他们可以到处乱钻，随处乱丢烂纸空瓶。华生医生，这两件案子我都胜诉了。从约翰·摩兰爵士因为在自己的鸟兽畜养场里放枪而被我告发以来，我还没有过象这样得意的一天呢。”\n\n“您究竟是怎样控告他的呢？”\n\n“看看记录吧，先生。值得看一看的——弗兰克兰对摩兰。\n\n高等法院。这场官司破费了我二百镑，可是我胜诉了。”\n\n“您得到什么好处了呢？”\n\n“什么也没有，先生，什么好处也没有得到。我感到骄傲的就是在我做这些事的时候，丝毫也没有考虑到个人的利益。\n\n我的行为完全是由对社会的责任感所推动的。我确信，譬如说吧，弗恩沃西家的人今晚就可能把我扎成草人烧掉，上回他们那样做的时候，我就报告了警察，告诉他们应该制止这些可耻的行为。县里的警察局真丢人，先生，他们并没有给我应有的保护。弗兰克兰对女王政府的诉讼案，不久就会引起社会上的注意了。我告诉过他们，他们那样对待我总有一天要后悔的，我的话现在果然应验了。”\n\n“怎么就能这样呢？”我问道。\n\n老头摆出了一副很自鸣得意的表情来。\n\n“因为我本来能告诉他们一件他们所迫切想要知道的事情，可是，无论如何，我是不肯帮那些坏蛋的忙的。”\n\n我本来一直在想找个脱身的借口，不再听他那些闲扯，可是，现在我又希望多听一些了。我很清楚这个老荒唐鬼的异乎常情的怪脾气，只要你一表现出强烈的兴趣来，就一定会引起他的怀疑而停止不说了。\n\n“肯定是件偷猎的案子吧？”我带着漠不关心的神气说道。\n\n“啊哈，老兄，是一件比这重要得多的事啊！在沼地里的那个犯人怎么样了？”\n\n我听了大吃一惊。“难道说您知道他在哪里吗？”我说道。\n\n“虽然我并不知道他确实是在哪里，可是我肯定地知道，我能帮助警察把他抓住。难道您从没有想到过抓这个人的办法就是先找出他从哪里弄到食物，然后再根据这条线索去找到他吗？”\n\n他的话确已愈加使人不安地接近了事实。“当然罗，”我说道，“可是您怎么知道他确实是在沼地里呢？”\n\n“我知道，因为我亲眼看到过那个给他送饭的人。”\n\n我为白瑞摩担起心来。被这样一个专好惹是生非、爱管闲事的老头抓住了小辫，确是一件很可怕的事。可是他底下那句话又使我感到如释重负了。\n\n“当您听到他的食物是一个小孩给他送去的时候，您一定会感吃惊吧。我每天都从屋顶上的那架望远镜里看到他，他每天都在同一时间走过同一条道路；除了到那罪犯那里去之外，他还会到谁那里去呢？”\n\n这可真是运气！我抑制住自己对这件事感觉兴趣的一切表现。一个小孩！白瑞摩曾经说过，我们弄不清楚的那个人是由一个小孩给他送东西的。弗兰克兰所发现的是他的线索，而不是那逃犯的线索。如果我能从那里了解到他所知道的事，就可以省得我作长久而疲惫的追踪了。可是，显然我还必须对此表示怀疑和淡漠。\n\n“我想很可能是个沼地牧人的儿子在给他父亲送饭吧。”\n\n稍有不同意的表示，就能把这老专刺激得冒起火来。他两眼恶意地望着我，灰白胡子象发怒的猫似地竖了起来。\n\n“真的，先生！”他说道，同时向外面广袤的沼地指着，“您看到了那边的那个黑色的岩岗了吗？啊，您看到了远处那长满荆棘的矮山吗？那是整个沼地里岩石最多的部分了。难道那里会是牧人驻脚的地方吗？先生！您的想法真是荒谬透顶了。”\n\n我顺从着他回答说，我是因为不了解全部事实才这样说的。我的服输使他大为高兴，也就使他更愿意多说一些了。\n\n“您可以相信，先生，在我提出一个肯定的意见的时候，我是有了很充分的根据的。我一再地看到过那孩子拿着他那卷东西，每天一次，有时每天两次，我都能……等一等，华生医生。是我的眼花呢，还是在那山坡上现在有什么东西在动着？”\n\n约有几里远的样子，可是在暗绿的和灰色的背景衬托之下，我能清楚地看到一个小黑点。\n\n“来呀，先生，来呀！”弗兰克兰边喊边向楼上冲去，“您可以先亲眼看看，然后再自己去判断吧。”\n\n那望远镜是一个装在一只三角架上的庞大的仪器，就放在平坦的铅板屋顶上。弗兰克兰把眼凑了上去，发出了满意的呼声。\n\n“快呀，华生医生，快来，不要等他过了山呀！”\n\n真的，他就在那里呢，一个肩上扛着一小卷东西的孩子，正在费力地慢慢向山上走着。当他走到最高点的时候，在暗蓝色的天空的衬托下，一瞬间我看到了那衣衫不整的陌生人。\n\n他鬼鬼祟祟地向四周望着，好象是怕被人跟踪似的。后来就在山那边不见了。\n\n“哈，我说得对不对？”\n\n“当然了，那个小孩好象负有什么秘密使命似的。”\n\n“至于是什么样的使命，就连一个县里的警察都能猜得出来，可是我一个字也不会告诉他们，我要求您也保守秘密，华生医生。一个字也不要泄露，您明白吗！”\n\n“遵命就是了。”\n\n“他们对待我太不象话——太不象话了。等弗兰克兰对女王政府的讼案的内情公布之后，我敢说，全国都会因而大为愤怒的。无论如何，我也不肯帮警察的忙的。他们要管的是我本人，而不是象征我的、被这群流氓捆在柱子上烧掉的草人。您不要走哇！您得帮助我喝干这瓶来庆祝这个伟大的胜利！”\n\n我谢绝了他的一切恳求，而且成功地打消了他的要陪我散步回家的想法。在他望得见我的时候，我一直是顺着大路走，然后我突然离开了大道，穿过沼地，向那孩子消失不见的那座山上走去。对我说来事事都很顺利，我敢发誓，我绝不会因为缺乏精神和毅力而错过命运之神给我送到眼前来的机会。\n\n在我抵达山顶的时候，太阳已经就要落下去了，脚下的山坡向阳的一面变成了金绿色，而另一面则完全被灰暗的阴影笼罩了。在极远的天际线上，呈现出一抹苍茫的暮色，在暮色中突出来的就是奇形怪状的贝利弗和维克森岩岗。在无边无际的大地上，一无动静。一只灰雁，也许是一只海鸥或麻鹬翱翔在高高的蓝色天空之中。在广大无边的苍穹和下面荒芜的大地之间，它和我好象就是这里仅有的生物了。荒漠的景色，孤独的感觉和我的神秘而急迫的使命使我不禁打起寒战来。哪里也看不到那个孩子，可是在我下面的一个山沟里有一些环绕成圈的古老石屋，中间有一栋还有着能够使人免于日晒雨淋的屋顶。我一看到它，心房就不禁为之一跳，这一定就是那个人藏匿的地方了。我的脚终于踏上了他那藏身之所的门槛了——他的秘密可被我抓住了。\n\n当我慢慢接近小屋的时候，我走得小心而又谨慎，就象是斯台普吞高举着捕蝶网慢慢走近落稳了的蝴蝶似的。我深为满意的是这地方确曾被用作居住之所。乱石之间有一条隐约可见的小路，通向破烂得要塌的当作门用的开口。那个不知来由的人可能正藏在那里，或者正在沼地里荡来荡去。冒险的感觉使我的神经大为兴奋，我把烟头抛在一旁，手摸着我那支左轮的枪柄，迅速地走到门口，我向屋里望了一望，里面空空的。\n\n可是有很多迹象可以说明，我并没有找错地方。这里一定是那个人住的地方。一块防雨布包着几条毛毯，放在新石器时代的人曾经睡过觉的那块石板上，在一个粗陋的石框里还有一堆烧过的灰烬，旁边放着一些厨房用具还有半桶水。一堆乱七八糟的空罐头盒说明，那人在这屋里已经住了些时候了。当我的眼睛习惯了这种透过树叶照下来的纷乱的点点阳光之后，我又在屋角里看到了一只金属小杯和半瓶酒。在小屋的中央有一块平平的石头被当桌子用了，上面有个小布包——无疑的就是我从望远镜里看到的小孩肩上的那卷。里面有一块面包、一听牛舌和两听桃罐头。当我察看完毕重新放下的时候，心里一跳，因为我看到下面还有一张写着字的纸。\n\n我拿了起来，上面有用铅笔潦潦草草写成的：“华生医生曾到库姆·特雷西去过。”\n\n我手里拿着那张纸，在那里站了足有一分钟之久，思考这张短信的寓意何在。那么说这个秘密的人所跟踪的并不是亨利爵士而是我了。他并没有亲自对我跟踪，而是派了一个人——也许就是那个孩子——跟着我，这就是他所写的报告。\n\n可能从我到了沼地以来，没有一步行动是未被他看到并报告了上去的。我总感觉到有一股看不见的力量，象一张密密的网似的，无比巧妙地围住了我们，把我们拢得这样松，是为了到极端紧要的关头时，才让我们知道自己真的已被纠缠在网眼里了。\n\n既然有了一份报告，就可能还有，于是我就在屋里到处搜寻起来。可是毫无踪影，也没有发现任何足以说明住在这个奇怪地方的人的特点和意图的迹象。只有一点可以确定，就是他一定有着斯巴达人式的习惯，对生活中的舒适不大介意。\n\n我看了看这开着大口的屋顶，再想一想那天的倾盆大雨，就更深切地了解到他那要想达到目的的意志是多么地坚定不移，正因为有了这样的意志，他才能住在这种不舒适的地方。\n\n他真是我们的狠毒的敌人呢，还是正巧是保护我们的天使呢？\n\n我下了决心，不弄清一切，决不离开这小屋。\n\n外面，太阳已经落得很低了，西面放射着火红和金色的余辉，天光照着散布在远处格林盆大泥潭中的水洼，反射出片片的红光。在那边可以看到巴斯克维尔庄园的两座塔楼，远处有一带朦胧的烟气，说明那里就是格林盆村，在这两处的中间，那小山背后就是斯台普吞家的房子。在傍晚金黄色的余光照耀下，一切都显得那样美好、醉人而又恬静。可是在我看到这景色的时候，内心里不仅丝毫不能感受大自然的宁静，反而还因愈益迫近的会面所引起的茫然和恐惧的心理而发抖。我的神经在悸动，但是决心坚定，我在小屋里坐在黑暗的深处，耐心地等待屋主人的来临。\n\n后来，我终于听到他走来了，远处传来了皮鞋走在石头上所发出来的得得声，一步又一步地愈走愈近了。我退回到最黑的屋角去，手在口袋里把左轮的枪机扳好，我决定在能看清这人以前不使自己露面。那声音停住了很久，说明他站住了；后来脚步声又向前走来，一条黑影由石屋的开口处投射进来。\n\n“真是个可爱的黄昏，亲爱的华生，”一个很熟悉的声音说，“我真觉得你到外边来要比呆在里面舒服得多呢。”", "is_ending": false, "clues": ["史前石屋中藏有粗呢毯、吃剩的舌头罐头、小水桶，以及一张纸条：‘华生医生已前往库姆·特雷西’", "华生退入昏暗屋角，手扣左轮机头屏息设伏", "熟悉的从容语调在夕阳余晖中响起：‘真是个可爱的黄昏，亲爱的华生！’——岩岗上的人正是福尔摩斯！"], "choices": [{"id": "ch11_p2_c1", "text": "要求福尔摩斯彻底阐明其秘密潜伏荒原的意图并交换侦查情报。", "target": "ch12_part1_revelations", "pov_switch": null, "pov_switch_name": null}, {"id": "ch11_p2_c2", "text": "将刚刚在库姆·特雷西问询劳拉·里昂斯夫人所获全盘告知福尔摩斯。", "target": "ch12_part1_revelations", "pov_switch": null, "pov_switch_name": null}, {"id": "ch11_p2_c3", "text": "【视角切换：歇洛克·福尔摩斯】以福尔摩斯第一人称检视雨果画像与绝密线索。", "target": "holmes_ch13_portrait", "pov_switch": "holmes", "pov_switch_name": "歇洛克·福尔摩斯"}, {"id": "ch11_p2_c4", "text": "【视角切换：歇洛克·福尔摩斯】潜出石屋，从巨石盲区反向包抄设伏神秘来客。", "target": "holmes_ch11_part2_stone_hut", "pov_switch": "holmes", "pov_switch_name": "歇洛克·福尔摩斯"}]}, "ch12_part1_revelations": {"id": "ch12_part1_revelations", "title": "第十二章 沼地的惨剧（上：福尔摩斯的惊人揭秘）", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "anchor", "anchor_name": "anchor_revelation", "content": "我屏息在那里坐了一两分钟，简直不能相信我的耳朵。后来，我的神志清醒了，也能够说话了，同时那极为沉重的责任好象马上从我心上卸了下来。因为那种冰冷、尖锐和嘲讽的声音只可能属于那个人。\n\n“福尔摩斯！”我喊了起来，“福尔摩斯！”\n\n“出来吧！”他说道，“请当心你那支左轮手枪。”\n\n我在粗糙的门框下面弓着身，看到他在外面的一块石头上坐着。当他看到我那吃惊的表情的时候，他那灰色的眼睛高兴得转动起来。他显得又瘦又黑，可是清醒而机警，他那机灵的面孔被太阳晒成了棕色，被风砂吹得粗糙了。他身穿苏格兰呢的衣服，头戴布帽，看起来和任何在沼地上旅行的人完全一样，他竟还能象猫那样地爱护着个人的清洁，这是他的一个特点，他的下巴还是刮得光光的，衣服也还象是住在贝克街时一样的清洁。\n\n“在我的一生里，还从没有因为看见任何人比这更快活过。”我一边摇撼着他的手一边说着。\n\n“或者说比这更吃惊吧，啊？”\n\n“噢，我只得承认吧。”\n\n“其实并不只是单方面感到吃惊呢。我跟你说，我真没有想到你已经找到我的临时藏身之所了，更想不到你已经藏在屋里了，直到我离这门口不到二十步的时候方才发现。”\n\n“我想是由于我的脚印吧？”\n\n“不，华生，我恐怕还不能担保能从全世界人的脚印里辨认出你的脚印来呢。如果你真的想把我蒙混过去的话，你就非得把你的纸烟换换牌子不可，因为我一看到烟头上印着‘布莱德雷，牛津街’，我就知道了，我的朋友华生一定就在附近。在小路的边上你还能找到它呢。毫无疑问，就是在你冲进空屋的那个紧要关头，你把它扔掉的。”\n\n“正是。”\n\n“我想到了这点，而又素知你那值得佩服的、坚韧不拔的性格，我就准知道你在暗中坐着，手中握着你那支手枪，等待着屋主人回来。你真的以为我就是那逃犯吧？”\n\n“我并不知道你是谁，可是我下定决心要弄清这一点。”\n\n“好极了，华生！你是怎样知道我的地点的呢？也许是在捉逃犯的那晚上，我不小心站在初升的月亮前面被你看到了吧？”\n\n“对了，那次我看到你了。”\n\n“你在找到这间石屋以前，一定找遍了所有的小屋吧？”\n\n“没有，我看到了你雇用的那小孩了，是他指给了我搜寻的方向。”\n\n“准是在有一架望远镜的那位老绅士那里看到的吧。最初我看到那镜头上的闪闪反光我还弄不清是什么呢。”他站起来朝小屋里望了一眼，“哈，卡特莱又给我送上来什么吃用的东西了，这张纸是什么？原来你已经到库姆·特雷西去过了，是吗？”\n\n“对了。”\n\n“去找劳拉·莱昂丝太太吗？”\n\n“就是啊。”\n\n“干得好！显然咱俩的钻研方向是一致的，但愿咱俩的钻研结果凑到一起的时候，咱们对这件案子就能有比较充分的了解了。”\n\n“嘿，你能在这里，我从心眼里感到高兴，这样的重责和案情的神秘，我的神经实在受不住了。可是你究竟是怎么到这里来的呢？你都干什么来着？我以为你是在贝克街搞那件匿名恐吓信的案子呢。”\n\n“我正希望你这样想呢。”\n\n“原来你是使用我，可是并不信任我呀！”我又气又恼地喊道，“我觉得我在你眼里还不应该一至于此吧，福尔摩斯。”\n\n“我亲爱的伙伴，在这件案子里就和在很多别的案子里一样，你对我的帮助是无可估量的，如果看来好象我对你耍了什么花招的话，那就请你原谅吧。实际上呢，我所以要这样做，一部分也是为了你的原故，正因为我体会到了你所冒的危险，我才亲自到这里来探察这件事的。如果我和你们——\n\n亨利爵士和你——都在一起的话，我相信你的看法一定和我的看法一样，只要我一出面，就等于向我们的对手发出警告，叫他们多加小心了。事实上，我一直是能自由行动的，而如果我是住在庄园里的话，那就根本没有可能了。我使自己在这件事里做一个不为人知的角色，随时准备在紧要关头全力以赴。”\n\n“可是为什么要把我蒙在鼓里呢？”\n\n“因为叫你知道了，对咱们毫无帮助，也许还可能因而使我被人发现。你势必要想来告诉我点什么，或者是好心好意地给我送些什么应用什物来，这样咱们就要冒不必要的风险了。我把卡特莱带来了——你一定还记得佣工介绍所的那个小家伙吧——我的一些简单的需要，都由他来照顾：一块面包和一副干净的硬领。一个人还需要什么呢？他等于给我添了一双勤快的脚和一对额外的眼睛，而这两样东西对我说来，都是无价之宝。”\n\n“那么说，我写的报告恐怕都白费了！”我回想起在我写那些报告时的辛苦和当时的骄傲的心情，我的声调都颤起来了。\n\n福尔摩斯从衣袋里拿出一卷纸来。\n\n“这就是你的报告，我亲爱的伙伴，而且都反复地读过了，我向你保证。我安排得好极了，因此它在途中只耽搁一天。我必须对你在处理这件极端困难的案子时所表现的热情和智慧致以最高的敬意。”\n\n我因为受了愚弄，心里还是很不舒服，可是福尔摩斯这些赞扬话的温暖，驱走了我内心的愤怒。我心里也觉得他说得很对，要想达到我们的目的，这样做实在是最好不过的了，我本不应该知道他已来到了沼地。\n\n“这样就好了，”他看到阴影已从我的脸上消失之后说道，“现在把你访问劳拉·莱昂丝太太的结果告诉我吧。我本不难想象出你到那里去为的是找她的，因为我已经知道，在库姆·特雷西地方，她是在这件事里唯一能对我们有所帮助的人了。说真的，如果你今天没有去的话，很可能明天我就要去了。”\n\n太阳已经落下去，暮色笼罩着整个沼地。空气已经变得凉了起来，于是我们就退进小屋去取暖。我们在暮色之中坐在一起，我把和那女士谈话的内容告诉了福尔摩斯。他非常感兴趣，某些部分我还得重复两遍，他才表示满意。\n\n“这事是极为重要的，”当我谈完后他说道，“它把在这件最复杂的事情里我所联结不起来的那个缺口给填上了。也许你已知道了，在这位女士和斯台普吞先生中间还有着极为亲密的关系吧？”\n\n“我并不知道这种亲密的关系啊！”\n\n“这件事是毫无疑问的。他们常见面，常通信，彼此十分了解。现在，这一点已使咱们手里多了一件有力的武器。只要咱们用这一点对他妻子进行分化……”\n\n“他的妻子？！”\n\n“我现在供给你一些情况，来酬答你所供给我的一切吧。\n\n那个在此地被人称作斯台普吞小姐的女士，实际上就是他的妻子。”\n\n“天哪，福尔摩斯！你说的是什么话呀？！那他怎么又会让亨利爵士爱上她呢？”\n\n“亨利爵士的堕入情网，除了对亨利爵士本人之外对谁都不会有什么害处。他曾经特别留意避免亨利爵士向她求爱，这是你亲眼看到的。我再说一遍，那位女士就是他的妻子，而不是他的妹妹。”\n\n“可是他为什么要搞这一场煞费苦心的骗局呢？”\n\n“因为他早就看了出来，让她扮成一个未婚的女子对他要有用得多。”\n\n我的全部猜测，我那模糊的怀疑突然变得具体起来，并且全都集中到生物学家身上了。在这戴着草帽拿着捕蝶网的、缺乏热情和特色的人身上，我好象看出了什么可怕的东西——无限的耐性和狡黠，一副佯装的笑脸和狠毒的心肠。\n\n“那么说咱们的敌人就是他罗，在伦敦尾随咱们的也就是他罗？”\n\n“我就是这样看破了这个谜的。”\n\n“那个警告一定是她发的罗？”\n\n“正是。”\n\n在我心头萦绕已久的，似有似无、半是猜想的一桩极为可怕的罪行已在黑暗之中隐隐约约地现出来了。\n\n“可是这一点你敢肯定吗，福尔摩斯？你怎么知道那女人就是他的妻子呢？”\n\n“因为在他第一次和你见面的时候，曾经不由自主地把他身世之中真实的一段告诉了你。我敢说，从那时以后，他曾不止一次因此而感到后悔。他从前曾在英格兰北部一度作过小学校长，现在说来，再没有比一个小学校长更容易被人调查清楚的了，通过教育机关就能弄清任何在教育界里工作过的人。我稍微调查了一下，就弄清了曾有一所小学，在极为恶劣的情况下垮了台，而学校的主人——姓名可不相同——\n\n和他的妻子就不知去向了。他们的相貌特征与咱们在这里所看到的都符合。当我知道了那失踪的人也同样热衷于昆虫学之后，鉴别人物的工作就算是完满地结束了。”\n\n黑幕已逐渐被揭了起来，但大部真相则仍在隐秘之中。\n\n“如果这个女人真是他的妻子的话，那么怎么会又插进来一个劳拉·莱昂丝太太呢？”我问道。\n\n“这正是全部问题之中的一个，而这个问题已被你的探察工作揭示出来了。你对那位女士的访问已使情况明朗了许多。\n\n我没有听说过她和她的丈夫想要离婚。如果她确曾计划离婚，而又把斯台普吞当作未婚男子，那她无疑会要想到做他的妻子了。”\n\n“可是，如果她弄清了这骗局呢？”\n\n“啊，那样的话，这位女士就可能对我们有用了。当然，我们首先就应该去找她——咱们两人明天就去。华生，你不认为你离开自己的职责已经太久了吗？你本应该是呆在巴斯克维尔庄园的啊。”\n\n最后的一抹晚霞也在西方消失了，夜降临了沼地。在紫色的天空中，闪烁着几颗半明半暗的星星。\n\n“还有最后一个问题，福尔摩斯，”我一边站起来一边说道，“当然了，在你我之间是无需保守什么秘密的。他这样做是什么意思啊？其目的何在呢？”\n\n福尔摩斯在回答的时候，声调都放低了：“这是谋杀，华生，是件深谋远虑、残忍已极的蓄意谋杀。\n\n别再问我细节了。正如同他的那面网围着亨利爵士一样，我的网正紧紧地罩住了他，再加上你的协助，他几乎已经是我的囊中物了。我们所担心的危险只剩了一个，就是说不定他可能在我们采取行动之前先行下手。再过一天——最多两天——我就会把破案的准备工作完成了；在那以前，你得象一个感情深厚的妈妈看守她的病孩子那样紧紧地看好你所保护的人。事实证明，你今天所做的事是正确的，但我还是希望你以不离开他的身边为更好一些。听！”\n\n一阵可怕的尖叫声——一阵连绵不断的恐惧与暴怒的喊叫声冲破了沼地上的寂静。那恐怖的喊声使我血管里的血液几乎都为之凝固了。\n\n“唉呀，我的上帝！”我喘了起来，“这是什么？这是什么意思？”\n\n福尔摩斯猛然站了起来，我看到他那黑色的象是运动员似的身体站在小房的门口，双肩下垂，头向前方探出，朝黑暗之中望去。\n\n“嘘！”他轻声说道，“不要出声。”\n\n由于情况的急切，喊声很大，起初那喊声是由黑暗的平原上一个很远的地方传过来的。现在冲进我们耳鼓的声音，已显得愈来愈近，愈来愈大，比以前更急迫了。\n\n“是哪一边？”福尔摩斯低声问道。由他那样坚强的人的激动的声音里，我知道他也是深受震惊了，“是哪一边，华生？”\n\n“我想是那边吧。”我向黑暗之中指去。\n\n“不，是那边。”\n\n痛苦的喊声，响彻了寂静的夜，愈来愈大，也比以前更近得多了。混在一起的还有一种新的声音，是一种深沉的咕咕哝哝，既悦耳而又可怕的声音，一起一落的，正象是大海所发出的永无休止的低吟。\n\n“是猎狗！”福尔摩斯喊了起来，“来呀，华生！来呀。天哪！说不定咱们已经来不及了！”", "is_ending": false, "clues": ["福尔摩斯揭示惊人真相：所谓的斯台普吞小姐并非其妹妹，而是其结发妻子", "斯台普吞诱使劳拉·里昂斯写信将查尔斯爵士引至午夜栅门前作为猎杀诱饵", "一声撕心裂肺、充满绝望哀嚎的凄厉惨叫与浑厚的猎犬咆哮震撼了整座荒原！"], "choices": [{"id": "ch12_p1_c1", "text": "在漆黑的荒原乱石堆中不顾一切狂奔，直扑惨叫与恶犬吠声处。", "target": "ch12_part2_selden_death", "pov_switch": null, "pov_switch_name": null}, {"id": "ch12_p1_c2", "text": "双手紧握左轮手枪、隐蔽提灯，在乱石阴影中协同警戒跃进。", "target": "ch12_part2_selden_death", "pov_switch": null, "pov_switch_name": null}]}, "ch12_part2_selden_death": {"id": "ch12_part2_selden_death", "title": "第十二章 沼地的惨剧（下：塞尔登之死与狭路相逢）", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "branch", "anchor_name": null, "content": "他立即迅速地在沼地上跑了起来，我紧跟在他的后面。可是，突然间，就在我们的前面，由那片碎石参差、凹凸不平的地方发出了一声最后的绝望的惨叫，然后就是模糊而沉重的咕咚一声。我们站住倾听着，再没有别的声音打破无风之夜的死寂了。\n\n我看到福尔摩斯象是个神经错乱的人似地把手按在额上，一面跺着脚。\n\n“他已经打败了咱们了，华生。咱们来得太晚了。”\n\n“不，不会，一定不会。”\n\n“我真是个笨蛋，竟不采取行动，而你呢，华生，现在该明白放开你应保护的人不管的后果是什么了吧！天哪！如果不幸的事终于发生了的话，那我们就非得向他报复不可了。”\n\n我们在黑暗之中向前乱跑，不时地撞在乱石上，勉强地挤过金雀花丛，上气不接下气地跑上了小山，再顺着另一个斜坡冲了下去，一直朝着那可怕的声音传来的方向前进。每到高处，福尔摩斯都焦急地向四周望一望，可是沼地里黑暗异常，在荒凉的地面上，没有一件东西在动。\n\n“你看到什么东西没有？”\n\n“什么也没有看到。”\n\n“可是你听听那是什么声音？”\n\n一阵低低的呻吟传进了我们的耳鼓，又是在我们的左面！\n\n在那面有一条岩脊，尽头处是直上直下的崖壁，由那里向下，可以看到一片多石的山坡。在那高低不平的地面上，平摊着一堆黑咕隆咚的、形状不规则的物体。当我们跑近了它的时候，模糊的轮廓就变得清楚起来了。原来是个趴在地上的人，头可怕地在身体下面窝着，身体向里蜷曲成一团，好象是要翻跟斗的样子。他的样子那样特别，使我当时都不能相信，刚才听到的声音是他灵魂脱壳时发出来的。我们弯身望着的那个人一言不发，动也不动。福尔摩斯把他抓住提了起来，一面惊恐地大叫了一声。他划燃了一根火柴，亮光照出了那死人紧攥在一起的手指，也照出了由他被打破的头颅骨里流出来的，慢慢扩大着的一滩可怕的血。火光还照清楚了另一件使我们痛心得几乎昏过去的事——正是亨利·巴斯克维尔爵士的尸体！\n\n我们俩谁也不可能忘记那身特别的、发红色的、用苏格兰呢制成的衣服——就是第一天早晨在贝克街看到他穿的那一套。我们只清清楚楚地看了一眼，那根火柴闪了闪就灭了，就象是希望离开了我们的灵魂一样。福尔摩斯呻吟着，在黑暗中也能看得出他的脸色发白。\n\n“这个畜生！畜生！”我紧握着双拳，喊着，“福尔摩斯，我永远也不能原谅自己，我竟离开了他的身旁，以致使他遭到了厄运。”\n\n“我比你的罪过还要重，华生。为了从各方面作好破案前的准备工作，我竟然把我们的嘱托人的性命弃而不顾了。在我一生的事业之中，这是我所受到的最大的打击了。可是我怎么会知道——我怎么会知道——他竟不顾我的一切警告，单身冒着性命的危险，跑到沼地里来呢？”\n\n“咱们听到了他的呼声——我的上帝啊，那阵叫唤呀！——可是竟救不了他！把他置之死地的那只猎狗在哪里呢？现在它可能正在乱石之间转来转去呢。还有斯台普吞呢，他在哪里呢？他一定得对这件事负责。”\n\n“他当然要负责了。我保证要让他负责的。伯侄两人都已被杀死了——一个是看到了那只他认为是妖魔的畜生就被吓死了；另一个虽曾飞奔逃避也未能免于死亡。现在咱们得设法证明这人畜之间的关系了。如果不是咱们听到了那声音的话，甚至咱们都不会相信那畜生的存在，因为亨利爵士显然是摔跤跌死的。可是，老天在上，不管他多么狡猾，过不了明天，我就要抓住这家伙！”\n\n我们痛心地站在这具血肉模糊的尸体两侧，我们长期的奔波劳碌，竟落得这样一个可怜的结果，这个突然而不可挽回的灾难，使我们心里感到异常沉重。后来，月亮升起之后，我们爬上了我们可怜的朋友摔倒的那块山岩的最高处，并由绝顶处向黑暗的沼地里逼视。黑暗中闪烁着银白色的光辉，几里开外的远处，在朝着格林盆的那个方向，有一点单独的黄色火光在闪亮着，只可能是来自斯台普吞家的那所孤独的房子。我一面向前看着，一面对着它狂怒地挥舞着拳头，并狠狠地咒骂了一句。\n\n“咱们为什么不马上抓住他呢？”\n\n“咱们破案的条件还没有成熟，那家伙细心狡猾到了极点；问题不在于我们已经掌握了多少情况，而在于我们能证明些什么。只要我们走错一步，那恶棍说不定就要从咱们的手里溜走了。”\n\n“那么，咱们怎么办呢？”\n\n“明天咱们有的是该做的事，今天晚上也就只能给可怜的朋友办办后事了。”\n\n我们俩一同下了陡坡，向尸体走去，在反射着银光的石头上，那黑色的身体能看得很清楚；四肢扭曲的那种痛苦的样子使我感到心酸，泪水模糊了我的眼睛。\n\n“咱们非得找人来帮忙不可了，福尔摩斯！咱们无法把他一直抬到庄园去……”我的话还没有说完就听见他大叫了一声，在尸体旁边弯下了身。我见状不禁喊道，“天哪，你疯了吗！”福尔摩斯跳起舞来了，大笑着抓住我的手乱摇。难道这就是我那严肃而善于自持的朋友吗？这可真是闷住的火烧出来了啊！\n\n“胡子！胡子！这人有胡子！”\n\n“有胡子？”\n\n“这不是准男爵——这是——啊，这是我的邻居，那个逃犯！”\n\n我赶快把死尸翻了过来，那撮滴嗒着血的胡须向着冰冷而清澈的月亮翘着。一看他那突出的前额和野兽般地深陷的眼睛就不会弄错，确实就是那天在烛光照耀之中从石头后面闪露在我眼前的那张面孔——逃犯塞尔丹的面孔。\n\n我马上就都明白了，我记起了准男爵曾经告诉过我，他曾把他的旧衣服送给了白瑞摩。白瑞摩把这些衣服转送了出去，好帮助塞尔丹逃跑，靴子、衬衣、帽子——全都是亨利爵士的。这出悲剧演得是够惨的，可是根据国家的法律，这个人至少是死得不冤的。我把事情的来由告诉了福尔摩斯，我对上帝的感激和我内心的快乐使我的满腔热血都为之沸腾起来了。\n\n“那么说，这身衣服就是那恶棍致死的原因了，”他说道，“问题很清楚，那只猎狗是先闻了亨利爵士穿用的东西之后，才被放出来进行追踪的——最可能的就是那只在旅馆里被偷去的高筒皮鞋——因此这个人才被穷追不舍，直到摔死为止。\n\n可是有一点非常奇怪：塞尔丹在黑暗之中怎么会知道那狗跟在他身后的呢？”\n\n“他听到的吧。”\n\n“只是在沼地里听到一只猎狗的声音，决不会使象这个逃犯那样残酷的人恐怖到这样的地步，甚至冒着再度被捕的危险狂呼求救。根据他的喊声判断，在他知道了那狗在追他以后，他一定拚命地跑了很长的一段路。他是怎么知道的呢？”\n\n“还有一件我尤其感到神秘的事，假设咱们的推断完全正确的话，那么这只狗为什么……”\n\n“我什么也不想推测。”\n\n“啊，那么为什么这只狗单单今晚被放出来呢？我想那只狗并不是永远放在沼地里随便跑的。除非有根据认为亨利爵士会到那里去，否则斯台普吞是不会把它放出去的。”\n\n“在两种难题当中，我的困难是更加麻烦的一个，我认为，你那个疑问很快就可以得到解答了，可是我那问题则可能永远是个谜。眼前的问题是：这个可怜的坏蛋的尸体，咱们怎么办呢？咱们总不能把他放在这里喂狐狸和乌鸦啊！”\n\n“我建议在咱们与警察取得联系之前，先把他放进一间小屋去。”\n\n“对，我相信你和我可以抬得动他。啊，华生，这是怎么回事？正是他，真是大胆得出奇！你可不要说出一句显出怀疑的话来，一句也不要说，不然的话，我的全部计划就都要完蛋了。”\n\n在沼地上，有一个人正向着我们走来，我看见有一点隐约的雪茄烟火。月光照在他的身上，我能看得出来那位生物学家的短小精悍的身材和那轻快得意的脚步。他一看见我们便停住了，然后又向前走了过来。\n\n“啊，华生医生，不会是您吧，是吗？我再也想不到在这样的夜深时分会在沼地里看到您。噢，我的天，这是怎么回事？有人受伤了吗？不——不要告诉我说这就是咱们的朋友亨利爵士！”他慌忙地由我们的身旁走过去，在那死人的身旁弯下身去。我听到他猛然地倒吸了一口气，手指夹着的雪茄也掉了下来。\n\n“谁，这是谁呀？”他口吃地说。\n\n“是塞尔丹，由王子镇逃跑的那个人。”\n\n斯台普吞转向我们，面色苍白，可是他以极大的努力克制住了惊慌和失望的表情。他两眼死盯着福尔摩斯和我。\n\n“天哪！这是多么惊人的事啊！他是怎么死的？”\n\n“看样子他好象是在这些岩石上摔断了脖子。当我们听到喊声的时候，我和我的朋友正在沼地里散步。”\n\n“我也听到了喊声，因此我才跑了出来，我很替亨利爵士担心。”\n\n“为什么单单替亨利爵士担心呢？”我忍不住地问了一句。\n\n“因为我已经约他来了，可是他并没有来，我吃了一惊，因此当我听到沼地里的喊声的时候，我当然要为他的安全而大感惊慌了。”他的眼光再度从我的脸上忽地转向福尔摩斯，“除了那喊声之外，您还听到了什么声音没有？”\n\n“没有。”福尔摩斯说，“您呢？”\n\n“也没有。”\n\n“那么，您这样问是什么意思呢？”\n\n“啊，您总知道农民们所说的关于那只鬼怪似的狗和其他等等的故事吧，据说夜间在沼地里能够听得见。当时我正在想，今晚是否可能听得到这样的声音呢。”\n\n“我们没有听到这一类的声音。”我说道。\n\n“可是你们以为这个可怜的家伙是怎么死的呢？”\n\n“我可以肯定，焦虑的心情和长期露宿在外的生活已经把他逼得发疯了。他一定曾经疯狂地在沼地里奔跑，而最终则在这里跌了一跤，把脖子摔断了。”\n\n“看来这倒是个最合理的说法，”斯台普吞说道，他还叹了一口气。依我看，这是表示他已放了心了，“您认为怎么样，歇洛克·福尔摩斯先生？”\n\n我的朋友欠身还了礼。\n\n“您认人认得真快。”他说道。\n\n“自从华生医生到来之后，这里的人就知道您也会来的。\n\n您倒赶上了看这一出悲剧。”\n\n“是的，确是如此，我确信我的朋友的解释是能够概括全部事实的。我明天就要带着一桩不快的回忆回到伦敦去了。”\n\n“喔，您明天就回去吗？”\n\n“我是这样打算的。”\n\n“我希望您的这次来访，多少能把这些我们所大惑不解的事情搞出一些眉目来。”\n\n福尔摩斯耸了耸肩。\n\n“人并非总能根据自己的主观愿望得到成功的。负责调查工作的人需要的是事实而不是传说和谣言。这件案子办得并不使人满意。”\n\n我的朋友以他那最坦白和最漫不经心的神态讲着。斯台普吞还是死盯着看他，然后他又向我转了过来。\n\n“我本想建议把这可怜的家伙弄到我家里去，可是他一定会使我妹妹大感惊恐，因此我觉得还是不要这样做的好。我想若用什么东西把他的头部遮住是可以安全无事的，明天早晨再想办法吧。”\n\n事情就这样安排好了。福尔摩斯和我谢绝了斯台普吞好意的约请，就向巴斯克维尔庄园走去了，剩下了生物学家独自走了回去。我们回头望望，看到那背影还在广阔的沼地上缓慢地向远方移动；在他的身后，白花花的山坡上有一个黑点，标明着得到如此可怕的结局的那个人躺着的地方。", "is_ending": false, "clues": ["在犬牙交错的危岩峭壁下发现摔碎头颈的尸体，身着亨利爵士标志性的红褐色粗花呢套装", "福尔摩斯翻转尸身：死者是逃犯塞尔登！恶犬正是循着亨利爵士旧衣上的气味追咬至其坠崖", "杰克·斯台普吞自浓雾中现身，见福尔摩斯在场大惊失色；福尔摩斯故意示弱隐瞒真相"], "choices": [{"id": "ch12_p2_c1", "text": "回到巴斯克维尔庄园，布设彻底收紧法网的致命圈套。", "target": "ch13_portrait", "pov_switch": null, "pov_switch_name": null}, {"id": "ch12_p2_c2", "text": "在斯台普吞面前假装受挫退却，声称明日一早返回伦敦。", "target": "ch13_portrait", "pov_switch": null, "pov_switch_name": null}]}, "ch13_portrait": {"id": "ch13_portrait", "title": "第十三章 设网", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "anchor", "anchor_name": "anchor_portrait", "content": "“咱们终于就要抓住他了，”当我们一起走过沼地的时候，福尔摩斯这样说，“这家伙的神经可真够坚强的！当他发现他那阴谋已经错杀了人，面临着本应使人万分惊愕的情况的时候，他是多么地镇定啊。我曾在伦敦和你讲过，华生，现在我还要和你讲，咱们从来没遇见过比他更值得一斗的对手呢。”\n\n“我感到很遗憾，他竟看到了你。”\n\n“我起初也这样感觉，可是这是毫无办法的事。”\n\n“现在他已知道了你在这里，你认为对于他的计划会发生什么影响呢？”\n\n“可能会使他变得更加谨慎，或许会使他马上采取不顾一切的手段。和大多数有点鬼聪明的罪犯一样，他可能会过分地相信了自己的小聪明，并且想象他已经完全把咱们骗过去了。”\n\n“咱们为什么不马上逮捕他呢？”\n\n“我亲爱的华生，你天生就是个急于采取行动的人，你的本能总是促使你想痛快淋漓地干点什么。咱们可以谈谈，假设咱们今晚把他逮捕了，可是这样做对咱们究竟有什么好处呢？对他不利的事，咱们什么也证明不了。这里边有魔鬼一样的狡猾手段，如果他是通过一个人来进行活动，咱们还可以找到些证据，可是如果咱们在光天化日之下拉出这条大狗来，对于咱们想把绳子套在它主人脖子上的计划是毫无帮助的。”\n\n“咱们当然有证据啊。”\n\n“连个影子也没有啊——咱们的证据只不过是些推测和猜想罢了。如果咱们所有的只是这样一段故事和这样的‘证据’，那咱们会被人家从法庭里给笑出来呢。”\n\n“查尔兹爵士的死不就是证据吗？”\n\n“他死得身上毫无伤痕，虽然你和我都知道，他完全是被吓死的，而且咱们也知道是什么把他吓死的。可是咱们怎能使十二个陪审员也相信这一点呢。哪里有猎狗的踪迹，哪里有它那狗牙的痕迹呀？咱们当然知道，猎狗是不会咬死尸的，而查尔兹爵士又是在那畜生赶上他之前死的。关于这些东西咱们都得加以证明才行，可是现在却办不到。”\n\n“那么，今晚的事难道也不能证明吗？”\n\n“今天晚上，咱们的情况也没有好了多少。又是上次那样，猎狗和那人的死亡之间并没有什么直接的联系。咱们没有见到那只猎狗，虽听到过它的声音，可是并不能证明它就跟在那人的后面，简直就是毫无来由。不，亲爱的伙伴，咱们必须承认一个事实：咱们目前对全案还没有得出完整合理的结论，任何能获得合理结论的冒险行动都是值得咱们去干一下的。”\n\n“你认为应该怎样干法呢？”\n\n“我对劳拉·莱昂丝太太所能给予咱们的帮助抱有很大希望，只要把实情向她讲清就行了。此外我还有自己的计划。\n\n今天就单管今天好了，何必多虑明天呢？可是我希望明天就能占了上风。”\n\n我从他口中再也问不出什么东西来了，在到达巴斯克维尔庄园的大门以前，他一面走着，一面沉醉在冥想之中。\n\n“你也进去吗？”\n\n“嗯，我看没有什么理由再躲起来了。可是，最后还有一句话，华生。可别对亨利爵士谈起那猎狗的事来，就让他把塞尔丹的死因想成斯台普吞所希望我们相信的那样子吧。这样他就能以较坚强的神经来迎接明天必须经受的苦难了。如果我没有记错你的报告的话，他们已经约好明天要到斯台普吞家去吃晚饭的。”\n\n“他们也和我约好了。”\n\n“那么，你一定得借口谢绝，他必须单身前去，那样就容易安排了。现在，如果说咱们已经过了吃晚饭的时间的话，我想咱们两人可以吃夜宵了。”\n\n亨利爵士见到了歇洛克·福尔摩斯，与其说是惊奇，不如说是高兴，因为几天来他都在盼着，希望最近发生的事会促使他从伦敦到这里来。可是，当他发现我的朋友既没有带任何行李，也没有对不带行李的原因加以解释的时候，倒确曾表示了惊疑。不久，我们就给他匀出来了他所需要的东西，在很晚才吃的夜宵中间，我们把在我们的遭遇之中看来准男爵应该知道的部分都尽量讲给他听了。此外我还负起了将这一消息透露给白瑞摩夫妇的不愉快的责任。对白瑞摩说来，这倒可能是件大大舒心的事，可是她听了之后竟抓起围裙痛哭起来。对全世界的人说来，他都是个凶暴的、半是野兽半是魔鬼的人；可是在她的心目中，他却永远是幼时和她同处的那个任性的、紧抓着她的手不放的孩子。这个人可真是罪大恶极了，临死时连一个哭他的女人都没有。\n\n“自从早晨华生出去之后，我在家里整天都感到闷闷不乐，”准男爵说道，“我想我还是值得受到表扬的，因为我恪守了我的诺言。如果我没有发过誓说决不单独外出的话，也许我就能去过一个愉快的夜晚了，因为我曾接到斯台普吞一封信，请我到他那里去。”\n\n“我相信您如果真的去了，确实是会过一个比较愉快的夜晚的，”福尔摩斯冷淡地说道，“可是，我们却曾以为您已摔断了脖子而大为伤心呢，我想您总不会因为知道了这一点而感到高兴吧？”\n\n亨利爵士睁大了眼睛吃惊地问：“怎么回事啊？”\n\n“那个可怜的坏蛋穿的是您的衣服，恐怕是您的仆人送给他的吧。说不定警察还会来找他的麻烦呢。”\n\n“恐怕不会，据我所知，在那些衣服上，哪一件也没有记号。”\n\n“那他真是运气——事实上你们都很运气，因为在这件事情里，就法律而言，你们都已犯了罪。作为一个公正的侦探来说，我几乎可以肯定，我的责任首先就是要将你们全家逮捕。华生的报告就是定你们罪的最有力的证明。”\n\n“可是咱们的案子怎么样了呢？”准男爵问道，“在这乱糟糟的一堆里，您摸到什么头绪了没有？我觉得，华生和我两人自从到了这里以来是并不怎样聪明的。”\n\n“我想，不久我就可以把有关的情况弄得更清楚些了。这真是一件极为困难和最最复杂的案件，现在还有几点我们弄不明白——可是不久就会弄明白了。”\n\n“我们曾经遇到过一次，华生一定早已告诉过您了。我们在沼地里听到了那猎狗的叫声，因此我敢发誓说，那决不全是无稽的迷信。在美洲西部的时候，我曾摆弄过一阵子狗，我一听就能知道。如果您能给这只狗戴上笼头、套上铁链的话，我就发誓承认您是前所未有的大侦探了。”\n\n“我想只要您肯帮助，我就一定能给它戴上笼头，套上铁链。”\n\n“无论您让我干什么我都干。”\n\n“很好，我还得要求您盲目地去做，而不要老是问为什么，为什么。”\n\n“就听您的吧。”\n\n“如果您这样做，我想咱们的小问题不久就能解决了。我确信——”\n\n他突然住口不说了，凝神注视着我头顶以上的地方。灯光照在他的脸上，那样的专心，那样的安静，几乎象是一座古代典型的轮廓鲜明的雕像——机警和企望的化身。\n\n“什么啊？”我们两人都站了起来。\n\n当他两眼下望的时候，我看得出来，他是在抑制着内心的激动。他那表情虽还依然镇静自若，可是他的眼睛里却闪烁出狂喜的光芒。\n\n“请原谅鉴赏家的赞赏吧。”他一边说着一边挥手指着挂满对面墙上的一排肖像，“华生是不会承认我懂得什么艺术的，可是，那不过是嫉妒罢了，因为我们对一件作品的看法总是不同的。啊，这些人像画得可真是好。”\n\n“噢，您这样说，我听了很高兴，”亨利爵士说道，一面以惊异的眼光望了望我的朋友，“对于这些东西，我不敢假充内行。我对马或是阉牛要比对一张画会品评得多了。我真不知道您竟能有时间搞这些玩艺儿。”\n\n“好在哪里，我一眼就能看出来，我现在就看出来了。我敢发誓，那是一张奈勒［奈勒：旅居伦敦的德国著名人像画家（１６４６—１７２３）。——译者注］画的画像，就是那边那个穿着蓝绸衣服的女人像；而那个胖胖的戴着假发的绅士像则一定出自瑞诺茨［瑞诺茨：英国著名人像画家（１７２３—１７９２）。——译者注］的手笔。我想这些都是您家里人的画像吧？”\n\n“所有的都是。”\n\n“人名您都知道吗？”\n\n“白瑞摩曾经详细地告诉过我，我想我还能背得不错呢。”\n\n“拿着望远镜的那位绅士是谁呀？”\n\n“那是巴斯克维尔海军少将，他是在西印度群岛在罗德尼麾下任职的。那穿着蓝色外衣、拿着一卷纸的是威廉·巴斯克维尔爵士，在庇特任首相时期，他任下议院委员会的主席。”\n\n“还有我对面的这个骑士——穿着黑天鹅绒斗篷、挂着绶带的这位呢？”\n\n“啊，您可得知道他——品质恶劣的修果，他就是一切不幸的根源，巴斯克维尔的猎狗的传说就是从他开始的。我们不会忘掉他的。”\n\n我也很感兴趣并有些惊奇地望着那张肖像。\n\n“天哪！”福尔摩斯说，“看样子他确象一位态度安详而又柔顺的人，可是我敢说，在他的眼里暗藏着乖戾的神气。我曾把他想象成一个比这要更粗暴、凶残得多的人呢。”\n\n“这张画像的真实性是不容怀疑的，因为画布的背面还写着姓名和年代‘１６４７’呢。”\n\n福尔摩斯没有再多说什么话，可是那老酗酒鬼的画像似乎对他发生着魔力，在吃夜宵的时候，他的眼还不断地盯着那张画像。直到后来，当亨利爵士回到他自己的房间去以后，我才能摸清了他的思路。他又把我领回宴会厅去，手里拿着寝室的蜡烛，高举起来，照着挂在墙上的由于年代久远而显得颜色暗淡的肖像。\n\n“你在画像上能看出什么东西来吗？”\n\n我望着那装有羽饰的宽檐帽，额旁的卷曲发穗，镶着白花边的领圈和这些陪衬中间的那副一本正经的严肃面孔。虽说不上暴戾，却也显得粗鲁，冰冷和严峻，有着薄薄的双唇，紧闭着嘴，还有一对显得冷漠和顽固的眼睛。\n\n“是不是象一个你认识的人？”\n\n“下巴有些象亨利爵士。”\n\n“也许隐约有一点。等会儿！”他站在一只椅子上，左手举起蜡烛，把右臂弯曲着掩住宽檐帽和下垂的长条发卷。\n\n“天哪！”我惊奇地叫了起来。\n\n好象是斯台普吞的面孔由画布里跳了出来。\n\n“哈哈，你看出来了吧。我的眼睛是久经训练的，专能检查容貌而不致被附属的装饰物所蒙蔽。这是罪犯侦察人员的首要特点，应该能看破任何伪装。”\n\n“简直太妙了，说不定这就是他的画像呢。”\n\n“是啊，这确是一个返祖遗传的有趣的实例，而且是同时表现在肉体和精神两方面的。研究家族肖像足以使人相信来世投胎轮回的说法。显而易见，这家伙是巴斯克维尔家的后代。”\n\n“还怀着篡夺财产继承权的阴谋呢。”\n\n“确是如此，这张画像还碰巧供给了我们一个显然是最迫切需要的线索。咱们算是抓住他了，华生，咱们算是抓住他了。我敢发誓说，明晚之前他就要在咱们的网子里象他自己所捉的蝴蝶一样地绝望地乱拍翅膀了。只要一根针、一块软木和一张卡片，咱们就可以把他放进贝克街的标本陈列室里去了！”\n\n当他离开那画像的时候，他突然发出了少有的大笑。我不常听到他笑，只要他一笑，总是说明有人就要倒霉了。\n\n第二天早晨我很早就起来了，可是福尔摩斯比我还要早些，因为我在穿衣服的时候，看到他正沿着车道从外边走回来。\n\n“啊，今天咱们得好好地干他一天！”他说着，一面由于行动之前的喜悦搓着双手，“网是全部下好了，眼看就要往回拉了。今天咱们就能见个分晓，究竟是咱们把那条尖嘴大梭鱼捉住呢，还是它由咱们的网眼里溜掉。”\n\n“你已经到沼地里去过了吗？”\n\n“我已经由格林盆发了一份关于塞尔丹死亡的报告到王子镇去了。我想我能许下诺言，你们之中谁也不会再因为这件事而发生麻烦了。我还和我那忠实的卡特莱联系了一下，如果我不使他知道我是安全无恙的话，他一定会象一只守在它主人坟墓旁边的狗一样地在我那小屋门口憔悴死的。”\n\n“下一步怎么办呢？”\n\n“那得去找亨利爵士商量一下。啊，他来了！”\n\n“早安，福尔摩斯，”准男爵说道，“您真象是一个正在和参谋长计划一次战役的将军。”\n\n“正是这样。华生正在向我请求命令呢。”\n\n“我也是来听候差遣的。”\n\n“很好，据我了解，您今晚被约去咱们的朋友斯台普吞家吃饭吧？”\n\n“我希望您也去。他们很好客，而且我敢说，他们见到您一定会很高兴的。”\n\n“恐怕华生和我一定要去伦敦呢。”\n\n“到伦敦去？”\n\n“是的，我想在这个时候我们去伦敦要比在这里更有用得多了。”\n\n可以看得出来，准男爵的脸上显出了不高兴的样子。\n\n“我希望您能看着我度过这一关。一个人单独住在这个庄园和这片沼地里可不是一件很愉快的事啊。”\n\n“我亲爱的伙伴，您一定得完全信任我，彻底按照我吩咐您的那样去做。您可以告诉咱们的朋友说，我们本来是很愿意跟您一起去的，可是有件急事要求我们一定得回到城里去。\n\n我们希望不久就能再回到德文郡来。您能把这口信带给他们吗？”\n\n“如果您坚持那样的话。”\n\n“也只能如此了，我肯定地和您说吧。”\n\n我从准男爵紧锁的眉头上可以看出，他认为我们是弃他而去，因而深感不快。\n\n“你们想什么时候走呢？”他语调冷淡地问道。\n\n“早餐之后马上便走。我们要坐车先到库姆·特雷西去，可是华生把行李杂物都留下来，作为他仍将回到您这里来的保证。华生，你应当写封信给斯台普吞，说明你不能赴约并向他表示歉意才是啊。”\n\n“我真想和你们一同到伦敦去。”准男爵说，“我干什么要一个人留在这里呢？”\n\n“因为这就是您的职责所在。您曾经答应过我，让您干什么您就干什么，所以我就让您留在这里。”\n\n“那么，好吧，我就留下吧。”\n\n“再向您提出一个要求，我希望您坐马车去梅利琵宅邸，然后把您的马车打发回来，让他们知道，您是打算走着回家的。”\n\n“走过沼地吗？”\n\n“对了。”\n\n“可是，这正是您常常嘱咐我不要作的事啊！”\n\n“这一次您这样做，保证安全。如果我对您的神经和勇气没有完全的信任的话，我也不会提出这样的建议来。您千万得这样做啊。”\n\n“那么，我就这样做吧。”\n\n“如果您珍视您的性命的话，穿过沼地的时候，除了从梅利琵宅邸直通格林盆大路的直路之外，不要走别的方向，那是您回家的必经之路。”\n\n“我一定根据您所说的去做。”\n\n“很好。我倒愿意在早饭之后愈快动身愈好，这样下午就能到伦敦了。”\n\n虽然我还记得福尔摩斯昨天晚上曾和斯台普吞说过，他的拜访是到第二天为止的，可是这个行程的计划还是使我为之大吃一惊，我怎么也没有想到他会希望我和他一起走。我也弄不明白，在他亲口说是最危险的时刻，我们两人怎能全都离开呢？可是毫无办法，只有盲目地服从。这样，我们就向愠怒的朋友告了别，两小时之后我们就到了库姆·特雷西车站，随即把马车打发回去。月台上有个小男孩在等着我们。\n\n“有什么吩咐吗，先生？”\n\n“卡特莱，你就坐这趟车进城吧。你一到地方，马上用我的名字给亨利·巴斯克维尔爵士打一封电报，就说如果他找到了我遗落在那里的记事本的话，请他用挂号给我寄到贝克街去。”\n\n“好的，先生。”\n\n“现在你先到车站邮局去问问有没有给我的信。”\n\n那孩子一会儿便带着一封电报回来了，福尔摩斯看了看便递给了我。上面写着：\n\n电报收到。即携空白拘票前去。五点四十分抵达。\n\n雷斯垂德“这是我早晨那封电报的回电。我认为他是公家侦探里最能干的了，咱们可能还需要他的协助呢。噢，华生，我想咱们最好是利用这段时间去拜访你的相识劳拉·莱昂丝太太去吧。”\n\n他的作战计划开始露了头，他是想利用准男爵使斯台普吞夫妇确信我们真的已经离去，而实际上我们却随时都可能出现在任何可能需要我们的地方。如果亨利爵士向斯台普吞夫妇提起由伦敦发来的电报的话，就能完全消除他们心里的怀疑了。我好象已经看到，我们围绕那条尖嘴梭鱼布下的网正在愈拉愈紧。\n\n劳拉·莱昂丝太太正在她的办公室里。歇洛克·福尔摩斯以坦白直爽的态度开始了他的访问谈话，这一点倒使她很吃惊。\n\n“我正在调查与已故的查尔兹·巴斯克维尔爵士的暴死有关的情况，”他说道，“我的这位朋友华生医生已经向我报告了您所谈过的话，同时还说，您对此事还有若干隐瞒之处。”\n\n“我隐瞒过什么？”她以挑战的口气问道。\n\n“您已经承认了，您曾要求查尔兹爵士在十点钟的时候到那门口去。我们知道，那正是他死去的时间和地点。您隐瞒了这些事件之间的关联。”\n\n“这些事件之间并没有什么关联啊！”\n\n“如果是那样的话，这倒确实是件极为奇特的巧合了。可是，我觉得我们总会找出其中的联系来的。我愿意对您坦白到底，莱昂丝太太，我们认为这是一件谋杀案。根据已有的证据来看，不仅是您的朋友斯台普吞，就连他的太太也可能要被牵连进去的。”\n\n那女士猛然由椅子里跳了起来。\n\n“他的太太！？”她惊呼道。\n\n“这件事实已不再是秘密了。被当作是他妹妹的那个人实际上就是他的妻子。”\n\n莱昂丝太太又坐了下去，两手紧抓着扶手，我看到由于她紧握双手的压力，使得那粉红色的指甲都已变成白色了。\n\n“他的太太！？”她又说了一遍，“他的太太，他还没有结过婚啊！”\n\n歇洛克·福尔摩斯耸了耸肩。\n\n“给我拿出证明来啊！给我证明啊！如果您能这样的话……”她那可怕的闪烁的眼神，比什么话都更能说明问题。\n\n“我到这里来就是准备给您证明的，”福尔摩斯一边说着，一边从口袋里抽出几张纸来，“这是四年前他们夫妇在约克郡拍的一张像片。背面写的是‘凡戴勒先生和夫人’，可是您不难认出他来，如果您和他太太见过面的话，她也是不难认出来的。这是几个可靠的证人寄来的三份关于凡戴勒先生和太太的材料，他那时开着一所私立圣·奥利弗小学。读一读吧，看您是否还会怀疑是不是这两个人。”\n\n她看了看他俩的合影，然后又抬起头来望着我们，冷冰冰地板着面孔，现出一种完全绝望的神情。\n\n“福尔摩斯先生，”她说道，“这个人曾向我提议，只要我能和我丈夫离婚，他就和我结婚。这个坏蛋，他为了骗我。什么花招都想出来了，他没有和我说过一句实话。可是为什么……为什么呢？我一直认为一切都是为了我的原故。现在我才算明白了，我一直就是他手里的工具。他对我从没有丝毫真情，我为什么要对他保持忠诚呢，我为什么要掩护他，使他免食自己所犯罪行的恶果呢？您愿意问什么就问我吧！我是什么也不会隐瞒的了。不过有一点，我可以对您发誓，就是当我写那封信的时候，我从没有想到会有害于那位老绅士，他是待我最好的朋友了。”\n\n“我完全相信您，太太，”歇洛克·福尔摩斯说，“重述这些事情，对您说来一定会是很痛苦的。不妨让我先把事情的原委说一遍，然后您再来检查一下，看其中是否有什么重大的错误，这样您或许可以好受一些。那封信是斯台普吞建议您写的吧？”\n\n“是他口授，我写的。”\n\n“我想，他提出让您写信的理由是：您可以由此得到查尔兹爵士在经济上的帮助，作为您在离婚诉讼中的费用吧？”\n\n“正是这样。”\n\n“等您把信发出去之后，他又劝阻您不要前往赴约？”\n\n“他对我说，为这样的目的而让别人出钱非常有伤他的自尊心，还说，他虽然是个穷人，也要花尽自己最后的一个铜板，来消除使我俩分离的障碍。”\n\n“看来他倒很象是个言行一致的人呢。以后您除了由报纸上看到那件有关死亡案的报道之外，就再没有听到过什么了吧？”\n\n“对了。”\n\n“他还曾叫您发誓，决不要说出您和查尔兹爵士的约会吧？”\n\n“是的，他说那是一件很神秘的暴死，如果被人知道了我们的约会的话，我一定会遭受嫌疑的。这样一来，他就把我吓得不敢说话了。”\n\n“正是这样，可是您对他也有自己的怀疑吧？”\n\n她犹豫了一下就低下头去了。\n\n“我知道他的为人，”她说道，“可是如果他保持对我真诚的话，我也就会永远保持对他的忠诚。”\n\n“总起来说，我认为您还是脱身得很幸运呢，”歇洛克·福尔摩斯说道，“他已经落在您的掌握之中了，这一点他是知道的，可是您竟依然还活着而没有被他害死。几个月来，您都在紧靠着悬崖绝壁的边缘上徘徊。现在我们非得向您告别不可了，莱昂丝太太，也许不久您就能又听到我们的消息了。”\n\n“咱们破案前的准备工作算是完成了，困难一个跟着一个地都已在我们的面前消逝了，”当我们站在那里等着由城里开来的快车的时候，福尔摩斯说，“我不久就能写出一本完整的近代最奇异惊人的犯罪小说了。研究犯罪学的学生们会记得一八六六年在小俄罗斯的果德诺地方发生过的类似案件，当然还有在北凯热兰诺州发生的安德森谋杀案。可是这个案件却具有一些与其他案件全然不同的特点。虽然咱们现在还没有掌握确切的证据，足以制服这个诡计多端的人，可是今晚，在咱们入睡之前，如果还弄不清楚的话，那才叫奇怪呢。”\n\n从伦敦来的快车怒吼着开进了车站，一个矮小结实得象个叭喇狗似的人，由一节头等车厢里跳了出来。我们三人握了手，我马上就从雷斯垂德望着我的伙伴的那种恭谨的样子里看了出来，自从他们开始在一起工作以后，他已学到了很多东西。我还很记得这位喜欢用推理方法的人怎样用那套理论来嘲讽刺激这位讲求实际的人。\n\n“有什么好事吗？”他问道。\n\n“简直是这些年来最重要的事了，”福尔摩斯说，“在考虑动手之前，咱们还有两个小时的时间。我想咱们可以利用这段时间来吃晚饭，然后，雷斯垂德，就让你呼吸一下达特沼地上夜晚的清凉空气，好把你喉咙里的伦敦雾气赶出来，从来没有到那里去过吗？啊，好啊！我想你是不会忘掉这次初游的。”", "is_ending": false, "clues": ["遮盖画中雨果·巴斯克维尔的帽发后，画像面容与杰克·斯台普吞惊人吻合！", "查明斯台普吞乃罗杰·巴斯克维尔之子，其谋杀全系为继承爵位与七十四万镑巨额遗产", "苏格兰场刑警雷斯垂德携搜捕令乘特快列车抵达德文郡集结", "福尔摩斯严命亨利爵士单身赴梅利琵宅邸赴宴，并务必夜半步行穿过荒原小径返家"], "choices": [{"id": "ch13_c1", "text": "在梅利琵宅邸外的小径乱石堆后设伏，静候终局较量。", "target": "ch14_part1_fog_ambush", "pov_switch": null, "pov_switch_name": null}, {"id": "ch13_c2", "text": "检视雷斯垂德的苏格兰场拘捕令，在格林盆泥潭边缘卡死伏击据点。", "target": "ch14_part1_fog_ambush", "pov_switch": null, "pov_switch_name": null}, {"id": "ch13_c3", "text": "【视角切换：杰克·斯台普吞】窥探斯台普吞在梅利琵宅邸筹备致命晚餐的险恶心机。", "target": "stapleton_ch13_fatal_dinner", "pov_switch": "stapleton", "pov_switch_name": "杰克·斯台普吞"}]}, "ch14_part1_fog_ambush": {"id": "ch14_part1_fog_ambush", "title": "第十四章 巴斯克维尔的猎犬（上：迷雾中的伏击）", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "climax", "anchor_name": "anchor_climax", "content": "福尔摩斯的缺点之一——真的，如果你能把它叫做缺点的话——就是：在计划实现之前，他极不愿将他的全部计划告诉任何人。无疑的，一部分是因为他本人高傲的天性，喜欢支配一切并使他周围的人们感到惊讶，一部分也是由于他本行工作上所需的谨慎，他从来不愿随便冒险。这样常常使那些做他的委托人和助手的人感到非常难堪，我就有过不止一次这样的不快的经历，可是再没有比这次长时间地在黑暗中驾车前进更使人感到难受了。严重的考验就在我们的眼前，我们的全部行动已经进入了最后的阶段，可是福尔摩斯什么也没有说，而我则只能主观地推测他行动的方向是如何如何。\n\n后来我们的面孔感到了冷风的吹拂，狭窄的车道两旁黑洞洞的，都是一无所有的空间，我这才知道我们又回到沼地里来了。期待着将要发生的一切的那种心情，使我周身的神经都激动起来，马每走一步，车轮每转一周，都使我们更加接近了冒险的极峰。由于有雇来的马车夫在场，我们不能畅所欲言，只好谈一些无聊的琐碎小事，而实际上我们的神经都已因情感的激动和焦虑被弄得非常紧张了。当我们经过了弗兰克兰的家，离庄园，也就是那出事地点已愈来愈近了的时候，才总算度过了那段不自然的紧张状态，我的心情也才舒畅了下来。我们没有把车赶到楼房门前，在靠近车道的大门口的地方就下了车。付了车钱，并让车夫马上回到库姆·特雷西去，然后，我们就向梅利琵宅邸走去了。\n\n“你带着武器吗，雷斯垂德？”\n\n那矮个儿侦探微笑了一下。\n\n“只要我穿着裤子，屁股后面就有个口袋，既然有这个口袋，我就要在里面搁点什么。”\n\n“好啊！我的朋友和我也都作好应急的准备了。”\n\n“你对这件事瞒得可真够严密呀，福尔摩斯先生。现在咱们干什么呢？”\n\n“就等着吧。”\n\n“我说，这里可真不是个使人高兴的地方，”那侦探说着就打了个冷战，向四周望望那阴暗的山坡和在格林盆泥潭上面积成的雾海。“我看到了咱们前面一所房子里的灯光了。”\n\n“那是梅利琵宅邸，也就是我们这次旅程的终点了。现在我要求你们一定得用足尖走路，说话也只能低声耳语。”\n\n我们继续沿着小径前进，看样子我们是要到那房子那里去，可是到了离房子约两百码的地方，福尔摩斯就把我们叫住了。\n\n“就在这里好了。”他说道，“右侧的这些山石是绝妙的屏障。”\n\n“咱们就在这里等吗？”\n\n“对了，咱们就要在这里作一次小规模的伏击。雷斯垂德，到这条沟里来吧。华生，你曾经到那所房子里面去过吧，是不是？你能说出各个房间的位置吗？这一头的几个格子窗是什么屋的窗户？”\n\n“我想是厨房的窗子。”\n\n“再往那边那个很亮的呢？”\n\n“那一定是饭厅。”\n\n“百叶窗是拉起来的。你最熟悉这里的地形。悄悄地走过去，看看他们正在做什么，可是千万不要让他们知道有人在监视着他们！”\n\n我轻轻地顺着小径走去，弯身藏在一堵矮墙的后面，矮墙周围是长得很糟的果木林。借着阴影我到了一个地方，从那里可以直接望进没有挂窗帘的窗口。\n\n屋里只有亨利爵士和斯台普吞两个人。他们面对面坐在一张圆桌的两边，侧面向着我。两人都在吸着雪茄，面前还放着咖啡和葡萄酒。斯台普吞正在兴致勃勃地谈论着，而准男爵却是面色苍白，心不在焉，也许是因为他想到要独自一人穿过那不祥的沼地，心头感到沉重。\n\n正当我望着他们的时候，斯台普吞忽然站了起来，离开了房间，同时亨利爵士又斟满了酒杯，向后靠在椅背上，喷吐着雪茄烟。我听到一声门的吱咯声和皮鞋踏在石子路上发出的清脆的声音，脚步声走过了我所蹲着的那堵墙另一面的小路。由墙头一望，我看到那位生物学家在果木林角上的一所小房的门口站住了，钥匙在锁眼里拧了一下，他一进去，里面就发出了一阵奇怪的扭打的声音。他在里面只呆了一分钟左右，后来我又听到拧了一下钥匙，他又顺原路回到屋里去了。我看到他和他的客人又在一起了，于是我又悄悄地回到我的伙伴们等我的地方，告诉了他们我所看到的情形。\n\n“华生，你是说那位女士不在吗？”在我报告完了之后，福尔摩斯问道。\n\n“是的。”\n\n“那么，她会在哪里呢？除了厨房之外哪一间屋子都没有灯光啊！”\n\n“我想不出她在哪里。”\n\n我曾说过的那种大格林盆泥潭上的浓厚的白雾，这时正向我们这个方向慢慢飘了过来，积聚起来，就好象在我们的旁边竖起一堵墙似的，虽低但是很厚，而且界线也很分明。再被月光一照，看上去就象一片闪闪发光的冰原，还有远方的一个个突起的岩岗，就象是在冰原上生出来的岩石一样。福尔摩斯的脸转向那边，一面望着缓缓飘行的浓雾，一面口中不耐烦地嘟囔着：“雾正在向咱们这边前进呢，华生！”\n\n“情况严重吗？”\n\n“确实很严重，说不定会打乱我的计划呢。现在，他呆不了很久了，已经十点钟了。咱们能否成功和他的性命安危可能都要决定于他是否在浓雾遮住小路之前出来了。”\n\n我们的头顶上，夜空皎洁而美好，星星闪耀着明澈的冷光，半个月亮高悬在空中，使整个沼地都浸沉在柔和而朦胧的光线之中。我们面前就是房屋的黑影，它那锯齿形的屋顶和矗立的烟囱的轮廓，被星光灿烂的天空清晰地衬托了出来。\n\n下面那些窗户里射出了几道宽宽的金黄色的灯光，向着果木林和沼地的方向照去。其中的一道忽然灭了，说明仆人们已经离开了厨房；只剩下了饭厅里的灯光，里面的两个人还在抽着雪茄闲谈。一个是蓄意谋杀的主人，一个是毫无所知的客人。\n\n遮住了沼地一半的大雾，白花花的象羊毛似的一片，每一分钟都在愈来愈近地向房屋飘了过来，先到的一些淡薄的雾气已经在发着金黄色光芒的方形窗前滚动了。果木林后面的墙已经看不到了，可是树木的上半部依然屹立在一股白色水气涡流的上面。在我们守望着的时候，滚滚的浓雾已经爬到了房子的两角，并且慢慢地堆积成了一堵厚墙，二楼象是一条奇怪的、浮游在可怕的海上的船。福尔摩斯用手急切地拍着面前的岩石，不耐烦地跺着脚。\n\n“如果他在一刻钟之内再不出来，这条小路就要被遮住了，再过半小时，咱们把手伸到面前都要看不到了。”\n\n“咱们要不要向后退到一处较高的地方去呢？”\n\n“对了，我想这样也好。”\n\n因此，当浓雾向我们流过来的时候，我们就向后退一退，这样一直退到了离房子有半里远的地方。可是那片上面闪耀着月光的浓白色的海洋，还在继续慢慢地、坚决地向着我们这个方向推进着。\n\n“咱们走得太远了，”福尔摩斯说道，“他会在走近咱们之前就被人追上的。咱们可不能冒这个危险，一定得不惜任何代价坚守在这里。”他跪了下去，把耳朵贴在地面上。“感谢上帝，我想我已听到他走来了。”\n\n一阵急速的脚步声打破了沼地的寂静。我们蹲在乱石之间，专心致志地盯着面前那段上缘呈银白色的雾墙。脚步声愈来愈响了，我们所期待的人穿过浓雾，就好象穿过一层帘幕似地在那里走着。当他走出了浓雾，站在被星光照耀着的清朗的夜色中的时候，他惊慌地向四周望了望，然后又迅速地顺着小路走来，经过了离我们隐藏之处很近的地方以后，就向着我们背后那漫长的山坡走去了。他一边走，一边心神不宁地左转右转地向后望着。\n\n“嘘！”福尔摩斯嘘了一声，我听到了尖细而清脆的扳开手枪机头的声音，“注意，它来了！”\n\n由徐徐前进的雾墙里传来了不断的轻轻的叭嗒叭嗒的声音。那云状的浓雾距我们藏匿的地方不到五十码远，我们三个人都死死地朝那里瞪大着眼睛，不知道那里将出现什么可怕的东西。我当时正在福尔摩斯的肘旁，我朝他的脸上望了一眼。他面色苍白，但显出狂喜的神情，双眼在月光照耀之下闪闪发光。忽然间，他两眼猛地向前死死盯住了一点，双唇因惊异而大张着。就在那时，雷斯垂德恐怖得叫了一声就伏在地上了。我跳了起来，我那已经变得不灵活的手紧抓着手枪。在雾影中向我们窜来的那形状可怕的东西吓得我魂飞天外。确是一只猎狗，一只黑得象煤炭似的大猎狗，但并不是一只人们平常看到过的那种狗。它那张着的嘴里向外喷着火，眼睛也亮得象冒火一样，嘴头、颈毛和脖子下部都在闪烁发光。象那个突然由雾障里向我们窜过来的黑色的躯体和狰狞的狗脸，就是疯子在最怪诞的梦里也不会看到比这家伙更凶恶、更可怕和更象魔鬼的东西了。\n\n那只巨大的黑家伙，跨着大步，顺着小路窜了下去，紧紧地追赶着我们的朋友。我们被这个幽灵惊得竟发呆到了这样的程度，在我们的神志恢复之前，它已从我们的面前跑过去了。后来，福尔摩斯和我两人一起开了枪，那家伙难听地吼了一声，说明至少是有一枪已经打中了。可是它并没有停住脚步，还是继续向前窜去。在小路上远远的地方，我们看到亨利爵士正回头望着，在月光照耀之下，他面如白纸，恐怖得扬起手来，绝望地瞪眼望着那只对他穷追不舍的可怕的家伙。\n\n那猎狗的痛苦的嗥叫已完全消除了我们的恐惧。只要它怕打，它就不是什么鬼怪，我们既能打伤它，也就能杀死它。\n\n我从没见过谁能象福尔摩斯在那天夜里跑得那样快。我是一向被人称作飞毛腿的，可是他竟象我赶过那矮个的公家侦探一样地把我给落在后面了。在我们沿着小路飞奔前进的时候，我们听到前面亨利爵士发出来的一声接连一声的喊叫和那猎狗发出的深沉的吼声。当我赶到的时候，正好看到那野兽窜起来，把准男爵扑倒在地上要咬他的咽喉。在这万分危急的当儿，福尔摩斯一连气就把左轮手枪里的五颗子弹都打进了那家伙的侧腹。那狗发出了最后一声痛苦的呼叫并向空中凶狠地咬了一口，随后就四脚朝天地躺了下去，疯狂地乱蹬了一阵，便侧身瘫下去不动了。我喘着气弯身下去，把手枪顶着那可怕的淡淡发光的狗头，可是再抠扳机也没有什么用了，大猎狗已经死了。", "is_ending": false, "clues": ["大格林盆泥潭涌出的苍白浓雾以惊人速度吞噬地面，严重阻隔伏击视线", "亨利爵士孑然一身走出宅邸步入漆黑的荒原小径", "浓雾中赫然跃出一头庞大无匹的黑色怪兽：鼻吻、巨目与巨齿间喷涌着熊熊磷火！"], "choices": [{"id": "ch14_p1_c1", "text": "三人齐射！在怪兽腾空飞扑的瞬间予以致命排枪齐射。", "target": "ch15_victory", "pov_switch": null, "pov_switch_name": null}, {"id": "ch14_p1_c2", "text": "华生奋不顾身持枪疾进，以血肉之躯在恶犬扑倒亨利爵士前将其击毙。", "target": "ch15_watson", "pov_switch": null, "pov_switch_name": null}, {"id": "ch14_p1_c3", "text": "福尔摩斯精准算准雾障风向，一枪洞穿发光巨兽的心脏。", "target": "ch15_holmes", "pov_switch": null, "pov_switch_name": null}, {"id": "ch14_p1_c4", "text": "因眼前突现的地狱火兽而惊骇失神，错失最佳射击战机。", "target": "ch15_tragedy", "pov_switch": null, "pov_switch_name": null}, {"id": "ch14_p1_c5", "text": "恶犬毙命！三人即刻冲入梅利琵宅邸解救受困夫人，并追击凶犯直插泥潭。", "target": "ch14_part2_mire_pursuit", "pov_switch": null, "pov_switch_name": null}]}, "ch14_part2_mire_pursuit": {"id": "ch14_part2_mire_pursuit", "title": "第十四章 巴斯克维尔的猎犬（下：泥潭追凶与营救夫人）", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "branch", "anchor_name": null, "content": "亨利爵士躺在他摔倒的地方，失去了知觉。我们把他的衣领解开，当福尔摩斯看到了爵士身上并无伤痕，说明拯救还是及时的时候，他便感激地祷告起来。我们朋友的眼皮已经抖动起来了，他还有气无力地想要挪动一下。雷斯垂德把他那白兰地酒瓶塞进准男爵的上下牙齿中间，他那两只惊恐的眼睛向上瞧着我们。\n\n“我的上帝啊！”他轻声说道，“那是什么？究竟是什么东西啊？”\n\n“不管它是什么，反正它已经死了，”福尔摩斯说道，“我们已经把您家的妖魔永远地消灭了。”\n\n躺在我们面前的四肢伸开的尸体，单就那身体的大小和它的力量来说，就已经很可怕了。它不是纯种血狸，也不是纯种的獒犬，倒象是这两类的混合种，外貌可怕而又凶暴，并且大得象个牝狮。即使是现在，在它死了不动的时候，那张大嘴好象还在向外滴嗒着蓝色的火焰，那小小的、深陷而残忍的眼睛周围现出了一圈火环。我摸了摸它那发光的嘴头，一抬起手来，我的手指也在黑暗中发出光来。\n\n“是磷。”我说。\n\n“这种布置多么狡猾啊，”福尔摩斯一边说着，一边闻着那只死狗，“并没有能影响它嗅觉的气味。我们太抱歉了，亨利爵士，竟使你受到这样的惊吓。我本想捉的是一只平常的猎狗，万没有想到会是这样的一只。雾也使我们未能截住它。”\n\n“您总算是救了我的性命了。”\n\n“可是却让您冒了这样一次大险。您还能站起来吗？”\n\n“再给我喝一口白兰地，我就什么都不怕了。啊，请您扶我起来吧。根据您的意见，咱们该怎么办呢？”\n\n“把您留在这里好了。今晚您已经不适于再作进一步的冒险了。如果您愿意等一等的话，我们之中总有一个会陪着您回到庄园去的。”\n\n他想挣扎着站起来，可是他还苍白得厉害，四肢也都在哆嗦。我们扶着他走到一块石头旁边，他坐下用颤抖着的双手蒙着脸。\n\n“我们现在非得离开您不可了，”福尔摩斯说道，“剩下的事还非得去干不可，每一分钟都很重要。证据已经齐全了，现在只需要抓那个人了。”\n\n“要想在房子里头找到他只有千分之一的可能，”当我们又顺着小路迅速地走回去的时候，他接着说道，“那些枪声已经告诉了他——鬼把戏完蛋了。”\n\n“那时，咱们离他还有一段路，这场雾可能会把枪声挡住呢。”\n\n“他一定是追随着那只猎狗，好指挥它——这点你们完全可以相信。不，不，现在他已经走了！可是咱们还是搜查一下房子，肯定一下的好。”\n\n前门开着，我们一冲而入，匆忙地由这间屋走进那间屋，在过道里遇到了一个惊恐万分的、衰老的男仆。除了饭厅之外，哪里也没有灯光。福尔摩斯急忙地把灯弄亮，房子里面没有一个角落未被找遍，但是丝毫没有看到我们所追寻的那人的踪影，最后在二楼上发现有一间寝室的门被锁了起来。\n\n“里面有人！”雷斯垂德喊了起来，“我听到里面有东西在动。把这门打开！”\n\n从里面传出了低弱的呻吟和沙沙的声音。福尔摩斯用脚底板往门锁上面一蹬，一下子就把门踢开了。我们三人端着手枪冲进屋去。\n\n可是屋里并没有我们想要找的那个不顾一切、胆大妄为的坏蛋。面前却是一件非常奇怪而又想象不到的东西，我们惊愕得呆立在那里望着。\n\n这间屋子被布置成小博物馆的样子，墙上装着一排安着玻璃盖的小匣，里边装的全是蝴蝶和飞蛾，那个诡计多端和危险的人把采集这些东西当作了娱乐消遣。在屋子中间有一根直立的木桩，是什么时候为了支持横贯屋顶、被虫蛀了的旧梁木才竖起来的。这根柱子上面捆着一个人，那人被布单捆绑得不能出声，你无法马上看出来是男是女。一条手巾绕着脖子系在背后的柱子上，另一条手巾蒙住了面孔的下半部，上面露出了两只黑眼睛——眼中充满了痛苦与羞耻的表情，还带着可怕的怀疑——死盯着我们。一会儿的功夫，我们就把那人嘴上和身上捆着的东西都解了下来，斯台普吞太太就在我们的面前倒了下去。当她那美丽的头下垂在胸前的时候，我在她的脖子上看到了清晰的红色鞭痕。\n\n“这畜生！”福尔摩斯喊道，“喂，雷斯垂德，你的白兰地呢？把她安置在椅子上！她已因受虐待和疲竭而昏过去了。”\n\n她又睁开了眼睛。\n\n“他安全了吗？”她问道，“他跑掉了吗？”\n\n“他从我们手里是逃不掉的，太太。”\n\n“不是，不是，我不是指我丈夫。亨利爵士呢？他安全吗？”\n\n“他很安全。”\n\n“那只猎狗呢？”\n\n“已经死了。”\n\n她发出了一声长长的满意的叹息。\n\n“感谢上帝！感谢上帝！噢，这个坏蛋！看他是怎样待我的呀！”她猛地拉起袖子露出胳臂来，我们惊恐地看到臂上伤痕累累。“可是这算不了什么——算不了什么！他折磨了、污损了我的心灵。只要我还存在着希望，他依然爱我的话，无论是虐待、寂寞、受骗的生活或是其他，我都能忍受，可是现在我明白了，就这一点说来，我也是他的欺骗对象和作恶的工具。”她说着说着就突然痛心地哭了起来。\n\n“您对他已一无好感了，太太，”福尔摩斯说道，“那末，请告诉我们，在哪里可以找到他吧。如果您曾帮着他做过坏事的话，现在就来帮助我们以赎前愆吧。”\n\n“他只能逃到一个地方去，”她回答道，“在泥潭中心的一个小岛上，有一座旧时的锡矿，他就是把猎狗藏在那里的，他还在那里做了准备，以供躲避之用。他一定会向那里跑的。”\n\n雾墙象雪白的羊毛似的紧围在窗口外面。福尔摩斯端着灯走向窗前。\n\n“看，”他说道，“今晚谁也找不出走进格林盆泥潭的道路的。”\n\n她拍着手大笑起来。她的眼里和牙齿上都闪烁着可怕的狂喜的光芒。\n\n“他也许能找到走进去的路，可是永远也别打算再出来了，”她喊了起来，“他今晚怎么能看得见那些木棍路标呢？是他和我两个人一起插的，用来标明穿过泥潭的小路，啊，如果我今天能够都给他拔掉有多好啊，那样您就真的能任意处置他了！”\n\n显然，在雾气消散之前，任何追逐都是枉费心机的。当时我们留下了雷斯垂德，让他照看房子，而福尔摩斯和我就和准男爵一起回到巴斯克维尔庄园去了。关于斯台普吞家人的实情再也不能瞒着他了，当他听到了他所热爱的女人的真情的时候，竟能勇敢地承受了这个打击。可是夜间那场冒险的震惊已经使他的神经受了创伤，天亮之前他发起高烧来，神志昏迷地躺在床上，摩梯末医生被请了来照顾他。他们俩已经决定了，在亨利爵士恢复饱满的精神之前就要一起去作一次环球旅行，要知道他在变成这份不祥的财产的主人以前，他是个多么精神饱满的人啊。\n\n现在我要很快地结束这段奇特的故事了，在故事里我想使读者也体会一下那些极端的恐怖和模糊的臆测，这些东西长时期地使我们的心上蒙了一层阴影，而结局竟是如此的悲惨。在那猎狗死后第二天的早晨，雾散了，我们由斯台普吞太太引导着到了他们找到过一条贯穿泥沼的小路的地方。看着她带领我们追踪她丈夫时所表现出来的急切心情和喜悦，使我们体会到这个女人过去的生活是多么地可怕。我们让她留在一个窄长的半岛似的、坚实的泥煤质的地面上站着。愈往泥沼里面走，这块地面就变得愈窄。从这块地面的尽头处起就这里一根那里一根地插着小木棍，沿着这些小木棍就是那条陌生人无法走过的，曲曲折折的，由一堆乱树丛到另一堆乱树丛的，蜿蜒在漂着绿沫的水洼和污浊的泥坑之间的小路，繁茂的芦苇和青葱多汁而又粘滑的水草散发着腐朽的臭味，浓重的浊气迎面袭来，我们不只一次地失足，陷入没膝的、黑色的、颤动着的泥坑里，走了数码之远，泥还是粘粘地沾在脚上甩不下去。在我们走着的时候，那些泥一直死死地拖住我们的脚跟。当我们陷入泥里的时候，就象是有一只恶毒的手把我们拖向污泥的深处，而且抓得那样紧那样坚决。\n\n只有一次，我们看到了一点痕迹，说明曾有人在我们之先穿过了那条危险的路。在粘土地上的一堆棉草中间露着一件黑色的东西。福尔摩斯由小路上向旁边只迈了一步，想要抓住那件东西，就陷入了泥潭，直陷到了腰那样深。如果不是我们在那里把他拉了出来的话，他就再也不会站到坚硬的陆地上来了。他举起一只黑色的高筒皮鞋，里面印着“麦尔斯·多伦多”。\n\n“这个泥浴还是值得一洗的，”他说道，“这就是咱们的朋友亨利爵士失去的那只皮鞋。”\n\n“一定是斯台普吞逃跑时丢在那里的。”\n\n“正是。他让猎狗闻了鞋味去追踪之后还把鞋留在手边，当他知道把戏已经被拆穿了而逃跑的时候，仍把它紧抓在手里，在逃跑的途中就丢在这里了。我们知道，至少一直到这里为止他还是安全的。”\n\n我们虽然可以作很多推测，可是永远也不能知道比这更多的情况了，在沼地里根本无法找出脚印来。因为冒上来的泥浆很快就把它盖上了。一过了最后的一段泥淖小路，走到坚实的土地上的时候，我们就都急切地寻找起脚印来了，可是一点影子也没有看到。如果大地并没有说谎的话，那么斯台普吞就是昨天在挣扎着穿过浓雾走向他那隐蔽之所的小岛时并没有能达到目的地。在格林盆大泥潭中心的某个地方，大泥淖的污浊的黄泥浆已经把他吞了进去。这个残忍的、心肠冰冷的人就这样地永远被埋葬了。\n\n在他隐藏他那凶猛的伙伴的、四周被泥潭所环绕的小岛上，我们找到了很多他所遗留下的痕迹。一只大的驾驶盘和一个一半装满了垃圾的竖坑，说明这是一个被废弃不用的矿坑的遗址。旁边还有支离破碎的矿工小屋的遗迹，开矿的人们无疑地是被周围泥潭的恶臭给熏跑了。在一个小房里，有一只马蹄铁、一条锁链和一些啃过的骨头，说明那里就是隐藏过那只畜生的地方。一具骨架，躺在断垣残壁之间，上面还粘着一团棕色的毛。\n\n“一只狗！”福尔摩斯说道，“天哪，是一只卷毛长耳獚犬。\n\n可怜的摩梯末再也看不到他所宠爱的那只狗了。嗯，我不相信这里还有什么我们还没有弄清楚的秘密。他可以把他的猎狗藏起来，可是他不能使它不出声，因此才出来了那些叫声，甚至在白天听来也不很好听。在急需的时候，他可以把那猎狗关在梅利琵房外的小屋里去，可是这样做总是很冒险的，而且只有在他认为一切均已准备就绪的时候，他才敢这样做。这只铁罐里的糊状的东西，无疑地就是抹在那畜生身上的发光的混合物。当然，他所以采取这种方法，是因为受到了世代相传的关于魔狗的故事的启发，并居心要吓死查尔兹老爵士的原故。难怪那可怜的恶鬼似的逃犯，一看到这样一只畜生在沼地的黑暗之中一窜一窜地由后面追了上来，就会象我们的朋友一样，一面跑一面狂呼，就连我们自己说不定也会那样呢。这确实是个狡猾的阴谋，因为这样不仅可以把要谋害的人置于死地，而且能使农民不敢深入调查这样一只畜生。在沼地里很多人都见过这只猎狗，哪个见过它的农民还敢于过问呢？我在伦敦曾经说过，华生，现在我再说一遍，咱们从来还没有协助追捕过比躺在那边的他更为危险的人物呢。”——他向着广袤而色彩斑驳的、散布着绿色斑点的泥潭挥舞着他那长长的臂膀，泥潭向远处伸延着，直到和赤褐色的沼地的山坡连成一片。", "is_ending": false, "clues": ["验看死犬尸身：纯种血狸与獒犬杂交巨兽，通体涂满无嗅无害的发光磷质", "在宅邸阁楼发现被五花大绑、惨遭鞭笞封口的斯台普吞夫人", "夫人绝望指认斯台普吞潜逃至大格林盆泥潭深处废弃锡矿孤岛的秘密路线"], "choices": [{"id": "ch14_p2_c1", "text": "循着泥潭中微弱的小木桩路标，冒险突入深不见底的格林盆绝境。", "target": "ch15_mire", "pov_switch": null, "pov_switch_name": null}, {"id": "ch14_p2_c2", "text": "封锁泥潭周边出口，调集郡警于黎明破晓时分发动天罗地网合围。", "target": "ch15_arrest", "pov_switch": null, "pov_switch_name": null}]}, "ch15_victory": {"id": "ch15_victory", "title": "第十五章 回顾（终局：正义凯旋与案情回顾）", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "ending", "anchor_name": "anchor_retrospection", "content": "那已经是十一月底了，一个阴冷多雾的夜晚，在贝克街的寓所里，福尔摩斯和我在起居室中坐在熊熊的炉火两旁。在我们到德文郡去经历了那场结局悲惨的案件之后，他已又办了两件最为重要的案子。在第一件案子里，他揭发了阿波乌上校的丑行，因为他与出名的“无匹俱乐部”纸牌舞弊案有关；而在第二件案子里，他保护了不幸的蒙特邦歇太太，使她免于身负谋害其丈夫前妻之女卡莱小姐的罪名——这个大家都还记得的年轻小姐，在那件事发生了六个月之后依然活着，而且还在纽约结了婚。我的朋友因为在一连串困难而又重要的案件里获得了成功，故而精神奕奕，因此我才能诱使他谈起了神秘的巴斯克维尔案的详情。我一直在耐心地等待着这个好机会，因为据我所知，他是不允许各案互相搅扰的，以免他那清晰的头脑由于回想过去的事而分散对目前工作的注意力。亨利爵士和摩梯末医生都在伦敦，正准备出发作一次长途旅行，以便恢复爵士那深受刺激的神经。就在那天下午，他们来拜访了我们，因此，很自然地谈起了这个问题。\n\n“事情的全部过程，”福尔摩斯说，“从自称为斯台普吞的那人的观点来看是简单明了的。虽然对咱们说来，一开始的时候无法得知他那些行动的动机，就连事实也只能知道一部分，因此就使得全部经过显得极为错综复杂了。我和斯台普吞太太已经谈过两次话了，这个案件现在已经完全搞清楚了，我不知道还会有什么不解之谜。在我那带有索引的案件统计表的Ｂ字栏里，你能找到几条有关这件事的摘记。”东西\n\n“也许你愿意根据记忆把全案的梗概谈一谈吧。”\n\n“我当然愿意谈一谈罗，虽然我不能保证全部事实都能记住，思想的高度集中很能淹没对于过去的记忆。一个正在处理案件的律师能够就本案的问题和一个专家进行辩论，可是经过一两个星期的法庭诉讼之后就又忘得精光了。因此，在我的脑子里，后来的案子不断地代替了以前各案的地位，而卡莱小姐的事也就模糊了我对巴斯克维尔庄园案案情的回忆。明天也许又要来了什么小问题了，同样也会代替了美丽的法国姑娘和臭名远扬的阿波乌两案的地位。可是关于猎狗这个案件，我倒愿意尽可能正确地把它告诉你们，如果我遗忘了什么的话，你们再加以补充。\n\n“我的调查毫无疑问地证实了，那巴斯克维尔家的画像并没有骗人，那个家伙确是巴斯克维尔家的人，他就是那个查尔兹爵士的弟弟罗杰·巴斯克维尔的儿子。罗杰曾带着极坏的名誉逃到南美洲去，传说他在那里没有结婚就死了。实际上，他结了婚，并且生了一个小孩。这个小家伙和父亲同名，他和一位哥斯达黎加的美人贝莉儿·迦洛茜娅结了婚，在一次偷取了大批公款之后，他就改名凡戴勒逃到英格兰来了。在这里，他又在约克郡的东部开办了一所小学。他所以想搞一下这种事业是因为他在归途中偶尔结识了一个患有肺病的教师，他想利用这人的能力作一番成功的事业。可是这位福瑞泽教师死了，弄得这学校由名誉不佳直到变得臭名远扬了。凡戴勒夫妇感觉最好还是改姓斯台普吞，于是他就带着剩下的财产，带着未来的计划和对昆虫学的爱好迁到英格兰南部去了。我由大英博物馆得知，他在这一门学问里还是个公认的权威呢，而且有一种飞蛾是由于他在约克郡居住时期首先发现的，所以也就永久以凡戴勒为名了。*\n\n“咱们现在谈到他的那一段生活，确实会使咱们感到极大的兴趣。那家伙显然是在经过调查之后发现了，只有两个人有碍于他获得庞大的财产。我相信，在去德文郡的时候，他的计划还很模糊，可是从他带着自己的太太而又使她以妹妹的身分出现这一点来看，显然他从一开始就是居心不良的。虽然他可能还没有确定整个阴谋的细节，可是显然他已想到将她用作钓饵了。他下定决心要把财产弄到手，为了达到这一目的，他不惜采用任何手段或是冒任何危险。他的第一步行动就是，首先把自己的家安置在邻近祖宅的地方，愈近愈好。\n\n第二步就是培养起与查尔兹·巴斯克维尔爵士和邻人们的友情来。\n\n“准男爵亲口告诉了他关于家族的猎狗的传说，因此也就为自己铺了一条死亡的道路。斯台普吞——我就还这样称呼他吧——知道了老头的心脏很衰弱，稍一惊吓就能致死，这些都是他从摩梯末医生那里知道的——他还听说，查尔兹爵士很迷信，并且十分相信那个可怕的传说。他那灵敏的头脑马上就想出了一个办法，既可置准男爵于死地，而且又几乎没有可能追究真正的凶手。\n\n“心里有了这个念头之后，他就费了相当的心机设法使其实现。一个普通的阴谋计划者，利用一只凶恶的猎狗也就满足了。可是他还采用了人工的方法使这动物变得象魔鬼一样的可怕，这就要算是他的机智和天才了。那狗是他从伦敦福莱姆街的贩狗商人罗斯和曼格斯那里买来的，是他们所有的货色之中最强壮、最凶恶的一只了。他坐北德文郡铁路的车把它带回家来，为了怕引起别人的注意，他牵着狗穿过沼地走了很长的路。他已经在捕捉昆虫的时候学会了怎样走进格林盆泥潭去，因此能给那只猎狗找到一处安全的藏身之所。他就把它关在那里，待机使用。\n\n“可是好机会不是很快就能来到的，夜间没法把那老绅士从家中引出来，好几次，斯台普吞带着他那猎狗埋伏在外面，可是毫无结果。就在这些次一无结果的跟踪追寻当中，他，或者不如说是他的同伙，被农民看到了，因此，那段魔狗的传说就又得到了新的证实。他曾希望过，他太太也许能将查尔兹引向毁灭，可是在这问题上，她竟表现出意想不到的不听话。她不肯把老绅士拖进情网，因为这样一来就可能把他交给了他的死敌，恐吓、甚至我连提都不愿提起的殴打，都没能动摇她的决心，她丝毫也不愿参预这件事，有一段时期，斯台普吞甚至到了一筹莫展的地步。\n\n“可是他在困难之中终于抓到了一个机会。由于查尔兹爵士对他已经产生了友情，就在帮助那可怜的女人劳拉·莱昂丝太太的那件事里请他负责掌管那一笔慈善金。由于他以单身汉的身分出现，所以他才能对她产生决定性的影响。他向她表示，如果她和丈夫离婚能获成功，他就和她结婚。可是他那计划突然面临了一个紧要关头，在摩梯末医生建议之下，查尔兹爵士正准备离庄园他去，他本人也假装同意这个意见，但他必须马上采取行动，否则他所要加害的人一远离，他就会弄得鞭长莫及了。因此他就迫使莱昂丝太太写了那封信，恳求老头在去伦敦之前的晚上和她见一次面，随后又用听来似乎很有道理的一套理由使她未去赴约，这样一来，他就得到了一个久候未得的好机会。\n\n“在傍晚的时候，他从库姆·特雷西坐车回来，有足够的时间弄回他的猎狗来，抹好发光涂料，再带着那畜生到栅门附近去，他知道，他一定能看到老绅士在那里等着。那狗受到了主人的怂使，跃过了栅门就向不幸的准男爵追了过去，他被追得一边喊叫一边顺着水松夹道飞奔下去。在那样阴暗的夹道里看到那只又大又黑、嘴眼都冒火的家伙在身后跳跃前进，确实是万分可怕，因此他就由于心脏病和恐惧过度的缘故在夹道的尽头倒地身亡了。那猎狗顺着多草的路边跑，而准男爵则在小路上跑，因此除了人的脚印之外看不到任何其他痕迹。那狗看到他躺下一动不动之后，也许走近前来，闻了一闻，可是发现他已死去之后就又转头离开了，就是在那时，它留下了摩梯末医生所看到的爪印。猎狗被叫了回去，并急忙地被赶回设在格林盆泥沼的狗窝去。这件神秘的事件使官厅感到莫名其妙，使乡下人大为吃惊，最后我们就接手调查了这件案子。\n\n“关于查尔兹·巴斯克维尔爵士的死就说到这里为止吧。\n\n你们能看得出来，这里面的手段用得狡猾之至，确实，几乎无法向真正的凶手提出控诉。他那唯一的同谋永远也不会泄露他的秘密，那古怪而难以想象的手法使得他那阴谋进行得更加顺利。与此案有关的两个女人，斯台普吞太太和劳拉·莱昂丝太太都对斯台普吞极为怀疑。斯台普吞太太知道他在暗算着老头儿，也知道有那只猎狗；莱昂丝太太对这两件事都不知道，可是她记得，暴死发生的时间正是并没有取消的约会的时间，而这个约会只有他知道，因此她也不无怀疑。但是，她俩都是在他的控制之下，而他对她们则一无所惧。全部阴谋的前一半是成功地实现了，可是剩下的还有更困难的呢。\n\n“可能斯台普吞并不知道在加拿大还有一个继承人。可是不管怎样，他很快就能从他的朋友摩梯末医生那里知道了。摩梯末医生后来就详细地告诉了他关于亨利·巴斯克维尔到来的消息。斯台普吞的第一个念头就是：也许根本就不用等这个来自加拿大的陌生青年到德文郡来，在伦敦就可以把他弄死。自从他太太拒绝帮他设阱陷害老头儿以后，他已不再信任他的妻子了，他甚至不敢使她长时间离开自己，因为他怕这样会失去左右她的力量，正因为如此，他才带着她一起到伦敦去。我发现他们住在克瑞文街的梅克司波柔私人旅馆里，我曾派人到那旅馆去搜集证据。在那里，他就把太太关在房间里，而他就装上假胡须，跟踪着摩梯末医生，先到贝克街，后去车站，还到过诺桑勃兰旅馆。他太太对他的阴谋计划多少知道一些，可是她对丈夫怕得厉害——一种由于遭受过残暴的虐待而产生的恐惧——因此她不敢写信去警告那个她知道正处在危险之中的人，因为如果那封信落入斯台普吞之手的话，她的性命就会发生危险了。最后，我们都已知道了，她采取了权宜之计，她用从报纸上剪下来的字凑成了那封信，用伪装的笔迹在信封上写了收信人的地址。那封信到了准男爵的手里，对他发出了第一次危险警告。\n\n“弄一件亨利爵士的衣物对斯台普吞说来是非常重要的，因为他一旦到了不得不用狗的时候，他就能有使狗闻味追踪的东西了，他马上以特有的机敏和大胆动起手来，我们可以肯定，旅馆的男女仆人一定都接受过不少的贿赂才来帮助他达到目的。可是碰巧，第一只弄到的皮鞋竟是新的，对他毫无用处，后来他就把它送还，并窃取了另一只——这件事对我们最有帮助了，因为他在我心里肯定地证实了和我们打交道的是一只真正的猎狗，因为没有别的假设能够解释，为什么要急于弄到一只旧鞋，而对一只新鞋竟这样不感兴趣。越是稀奇古怪的事情就越值得仔细地加以检查，那看来似乎会使全案复杂化的一点，如果给以适当的考虑，并加以科学的处理，往往却正是最能说明问题之处。\n\n“后来，第二天早晨，咱们的朋友又来拜访了咱们，他们一直都受着坐在马车里的斯台普吞的跟踪。从他对咱们的房子和我的面貌知道得那样清楚和他一般的行为来看，我感觉，斯台普吞的罪恶历史决非仅仅限于巴斯克维尔庄园案这一件事。据说在过去三年里，西部曾发生过四次大盗窃案，可是没有一件捉到了罪犯。最后一件是五月间在弗克斯吞场发生的，其特殊之处是：一个僮仆因为想要袭擒那带着面具的单身盗贼而被残酷地枪击致死。我相信斯台普吞就是这样地补充了他那日渐减少的财产，而且这些年来他一直就是个危险的亡命之徒。\n\n“那天早晨，当他成功地从我们手中逃掉并通过马车夫将我的姓名传达给我的时候，咱们已经领略了他的机智和大胆了。从那时起，他就知道我在伦敦已经接手办这件案子了，因此，他知道在那里再也得不到下手的机会了，他才回到了达特沼地，等待着准男爵的来临。”\n\n“等一下！”我说道，“无疑的，你已经如实地描述了事情的经过，可是有一点你还没有解释到。当主人在伦敦的时候，那只猎狗怎么办呢？”\n\n“我曾注意到这件事，而且无疑是重要的。毫无问题，斯台普吞有一个亲信，虽然看来还不象是斯台普吞已经把自己的计划都告诉了他而受着他的左右。在梅利琵宅邸中有一个老男仆，名叫安东尼，他和斯台普吞家的关系可以追溯到数年以前斯台普吞做小学校长的时期，因此他一定知道他的主人和女主人确是夫妇，这人已经从乡间逃跑不见了。‘安东尼’这个姓似乎在英格兰很不普通，而‘安托尼奥’这个姓在所有说西班牙话的国家和美洲说西班牙话的国家里同样也不普通。这个人，象斯台普吞太太一样，英文说得很好，可是带着奇怪的大舌头的味道。我曾亲眼看到这个老头经过斯台普吞所标出来的小路走过格林盆泥沼。因此，很可能是当他的主人不在的时候就由他来照顾猎狗。虽然他或许从来也不知道养这只畜生是作什么用的。\n\n“随后，斯台普吞夫妇就回到了德文郡。不久，亨利爵士和你就在那里跟上了他们。还要说一下我个人在那时的看法，也许你还能想得起来，当我检查那张上面贴着报纸铅印字的信的时候，我仔细地检查了纸里面的水印。在检查的时候，我把它拿在离眼睛只有几英寸的地方，感觉出有一种象是白迎春花的香味。香水一共有七十五种，一个犯罪学专家应当每种都能分辨得出来。根据我个人的经验，在不只一件案子里，全靠能迅速辨别出香水的种类才破的案。那股香味说明，案子里面牵涉到一位女士，当时在我心里已经开始想到了斯台普吞夫妇。我就是这样地在到西部乡下去之前肯定了那猎狗，并且猜出了罪犯。*\n\n“我玩的把戏就是监视斯台普吞。可是，显然，如果我是和你在一起的话，我就会干不成这件事了，因为那样一来，他就会大加小心了。因此，我就把大家——连你在内——全都欺骗了，当人家以为我还在伦敦的时候，我已秘密地到乡下来了。我所吃的苦，并不象你所想象得那样多，决不能让这些细微末节扰乱案件的调查工作。我大部分时间都呆在库姆·特雷西，只有当必须去接近犯罪现场的时候，我才去住在沼地上的小屋里。卡特莱和我一同来了，他假扮成农村小孩，对我的帮助太大了。靠着他，我才能弄到食物和干净衣服，在我监视着斯台普吞的时候，卡特莱经常在监视着你，因此我的手就能抓住了所有的线索。\n\n“我已经告诉过你了，你的报告都能很快地送到我的手里，因为它们一到贝克街马上就被送到库姆·特雷西来了。那些报告对我有极大的帮助，特别是有关斯台普吞身世的碰巧是真实的那篇。我已能证明就是那个男人和那个女人了，并且总算准确地知道了我应当怎样去了解。那个逃犯和他与白瑞摩之间的关系确曾使案情相当复杂化起来，这一点已被你用很有效的办法澄清了，虽然我也通过自己的观察得到了同样的结论。\n\n“当你在沼地里发现了我的时候，我已把全部事实都弄清了，可是我还没有足以拿到陪审官面前去的罪证，甚至那晚斯台普吞企图谋杀亨利爵士，但结果却杀死了不幸的逃犯的事实都难以证明他有杀人罪。看样子除了当场捉他之外是别无他法了，而要这样做，咱们就得利用亨利爵士作为诱饵，使他处于单身行路和显然受不到任何保护的状况之下。咱们就这样做了，虽然使咱们的委托人受到了严重的惊吓，可是咱们终于凑全了罪证，并把斯台普吞驱向了毁灭。使亨利爵士暴身于危险之中，我承认，这只能说是我在处理此案过程之中的一大缺点，可是咱们无法预知，那畜生竟会显出那样可怕和骇人欲绝的样子，咱们也无法预知那使它能那么突然地向我们窜来的大雾的出现。咱们的任务的完成是付出了代价的，可是专家摩梯末医生向我保证说，这一代价的影响只是暂时的。一次长途旅行，不仅能够恢复咱们朋友深受打击的神经，并能医治他那心灵上的创伤，他对那位女士的爱情是深挚的。对他说来，在这件倒霉的事情里，最使人伤心的就是，他竟也受了她的骗。\n\n“现在剩下需要说明的就是她在此中所扮演的角色了。无疑地，她是受着斯台普吞的左右的。其原因也许是爱情，也许是恐惧，更可能是两样都有，因为这决不是两种不可以同时存在的感情。这种控制的力量，至少是绝对有效的，在他的命令之下，她同意了装作是他的妹妹，虽然在他想要使她直接参加谋杀的时候，也发现了他对她的控制力还是有限的。\n\n只要不把她的丈夫牵连进去，她就准备去警告亨利爵士，而且她也曾一再地确想这样做。看来斯台普吞似乎还有着嫉妒心，当他看到准男爵向女士求婚的时候，虽然这一点也是在他自己的计划之内，他还是忍不住要大发雷霆地出面干涉，这样一来就把他聪明地靠着强自抑制而掩盖起来的火暴性格暴露出来了。他用笼络感情的办法使亨利爵士经常到梅利琵宅邸来，以便早晚能获得他所期望的好机会，可是在事情危急的那一天，他太太突然和他对立起来。她已稍知那逃犯死亡的事，而且她也知道，亨利爵士来吃晚饭的那一傍晚，那只猎狗就关在外边的小屋里。她谴责了她丈夫预谋要干的罪行；他狂怒了，他第一次向她透露他已另有所爱。她那往日的柔顺突然变成了深深的仇恨，他看得出来，她会将他出卖的，因此他就把她捆了起来，以免她一得机会就去警告亨利爵士，无疑地，他是希望当全乡的人都把准男爵的死归之于他家的厄运的时候——他们当然会这样想——他就能争取他太太接受既成事实，并要她保守秘密了。在这个问题上，我想，无论如何他是打错算盘了，即使咱们不到那里去，他的命运也同样是注定了的。一个有着西班牙血统的女人是不会那么轻易地宽恕这样的侮辱的。我亲爱的华生，不参考摘记，我是无法更详细地给你叙述这一奇异的案件了。我不知道是否还剩下了什么重要的东西没有解释到。”\n\n“他是不能指望用他那只可怕的猎狗，象弄死老伯父那样地吓死亨利爵士的。”\n\n“那畜生很凶猛，而且只喂得半饱。它的外表即使没有把它所追踪的人吓死，至少也能使他丧失抵抗力。”\n\n“当然了。还剩下一个难题。如果斯台普吞继承了财产，他怎样来解释这样的事实呢：他——继承人——为什么一直更名改姓地隐居在离财产这么近的地方呢？他怎么能要求继承权而不引起别人的怀疑和要求进行调查呢？”\n\n“这是一个绝大的困难，想要让我去解决这个问题，恐怕你是要求过高了。过去和现在的事我都调查过了。可是一个人将来会怎么样，这倒是个很难回答的问题。斯台普吞太太曾经几次听到她丈夫谈论这个问题，有三条路可走：他也许要从南美洲要求继承这份财产，让当地的英国当局证明他的身份，这样可以根本不来英格兰就把财产弄到手；或者住在伦敦的短时期内采取隐蔽身份的办法；或者，还许找一个同谋，带着证明文件的证物，证明他的继承人的身份，可是对他收入的一部保留所有权。根据咱们对他的了解，他总是能设法解决这些困难的。啊，我亲爱的华生，咱们已经干了几个星期严肃认真的工作了，我想，咱们还是换换口味，今晚想些愉快的事吧。我在虞格诺戏院订了一个包厢。你听过德·雷兹凯［让·德·雷兹凯：波兰歌剧演唱家，１８５３年生于华沙。——译者注］演的歌剧吗？请你在半小时之内穿戴好，途中咱们还可以到玛齐尼饭店吃晚饭呢。”", "is_ending": true, "clues": ["贝克街炉火旁的完整回顾：罗杰·巴斯克维尔孽子身世大白，盗靴引犬疑案水落石出，发光磷液完全剖析"], "choices": []}, "ch15_watson": {"id": "ch15_watson", "title": "第十五章 回顾（终局：华生之英勇功绩）", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "ending", "anchor_name": null, "content": "在贝克街熊熊燃烧的壁炉旁，福尔摩斯向我高高举起了酒杯。“华生，”他微笑着说道，“在我们长久的合作之中，我从未见过如此果决勇敢的身手。你在最后危急关头的疾进开火，直接在恶犬腾空一跃时挽救了亨利·巴斯克维尔爵士的性命。巴斯克维尔家族的历史必将铭记：约翰·H·华生医生才是彻底粉碎诅咒的坚固盾牌。”\n\n那已经是十一月底了，一个阴冷多雾的夜晚，在贝克街的寓所里，福尔摩斯和我在起居室中坐在熊熊的炉火两旁。在我们到德文郡去经历了那场结局悲惨的案件之后，他已又办了两件最为重要的案子。在第一件案子里，他揭发了阿波乌上校的丑行，因为他与出名的“无匹俱乐部”纸牌舞弊案有关；而在第二件案子里，他保护了不幸的蒙特邦歇太太，使她免于身负谋害其丈夫前妻之女卡莱小姐的罪名——这个大家都还记得的年轻小姐，在那件事发生了六个月之后依然活着，而且还在纽约结了婚。我的朋友因为在一连串困难而又重要的案件里获得了成功，故而精神奕奕，因此我才能诱使他谈起了神秘的巴斯克维尔案的详情。我一直在耐心地等待着这个好机会，因为据我所知，他是不允许各案互相搅扰的，以免他那清晰的头脑由于回想过去的事而分散对目前工作的注意力。亨利爵士和摩梯末医生都在伦敦，正准备出发作一次长途旅行，以便恢复爵士那深受刺激的神经。就在那天下午，他们来拜访了我们，因此，很自然地谈起了这个问题。\n\n“事情的全部过程，”福尔摩斯说，“从自称为斯台普吞的那人的观点来看是简单明了的。虽然对咱们说来，一开始的时候无法得知他那些行动的动机，就连事实也只能知道一部分，因此就使得全部经过显得极为错综复杂了。我和斯台普吞太太已经谈过两次话了，这个案件现在已经完全搞清楚了，我不知道还会有什么不解之谜。在我那带有索引的案件统计表的Ｂ字栏里，你能找到几条有关这件事的摘记。”东西\n\n“也许你愿意根据记忆把全案的梗概谈一谈吧。”\n\n“我当然愿意谈一谈罗，虽然我不能保证全部事实都能记住，思想的高度集中很能淹没对于过去的记忆。一个正在处理案件的律师能够就本案的问题和一个专家进行辩论，可是经过一两个星期的法庭诉讼之后就又忘得精光了。因此，在我的脑子里，后来的案子不断地代替了以前各案的地位，而卡莱小姐的事也就模糊了我对巴斯克维尔庄园案案情的回忆。明天也许又要来了什么小问题了，同样也会代替了美丽的法国姑娘和臭名远扬的阿波乌两案的地位。可是关于猎狗这个案件，我倒愿意尽可能正确地把它告诉你们，如果我遗忘了什么的话，你们再加以补充。\n\n“我的调查毫无疑问地证实了，那巴斯克维尔家的画像并没有骗人，那个家伙确是巴斯克维尔家的人，他就是那个查尔兹爵士的弟弟罗杰·巴斯克维尔的儿子。罗杰曾带着极坏的名誉逃到南美洲去，传说他在那里没有结婚就死了。实际上，他结了婚，并且生了一个小孩。这个小家伙和父亲同名，他和一位哥斯达黎加的美人贝莉儿·迦洛茜娅结了婚，在一次偷取了大批公款之后，他就改名凡戴勒逃到英格兰来了。在这里，他又在约克郡的东部开办了一所小学。他所以想搞一下这种事业是因为他在归途中偶尔结识了一个患有肺病的教师，他想利用这人的能力作一番成功的事业。可是这位福瑞泽教师死了，弄得这学校由名誉不佳直到变得臭名远扬了。凡戴勒夫妇感觉最好还是改姓斯台普吞，于是他就带着剩下的财产，带着未来的计划和对昆虫学的爱好迁到英格兰南部去了。我由大英博物馆得知，他在这一门学问里还是个公认的权威呢，而且有一种飞蛾是由于他在约克郡居住时期首先发现的，所以也就永久以凡戴勒为名了。*\n\n“咱们现在谈到他的那一段生活，确实会使咱们感到极大的兴趣。那家伙显然是在经过调查之后发现了，只有两个人有碍于他获得庞大的财产。我相信，在去德文郡的时候，他的计划还很模糊，可是从他带着自己的太太而又使她以妹妹的身分出现这一点来看，显然他从一开始就是居心不良的。虽然他可能还没有确定整个阴谋的细节，可是显然他已想到将她用作钓饵了。他下定决心要把财产弄到手，为了达到这一目的，他不惜采用任何手段或是冒任何危险。他的第一步行动就是，首先把自己的家安置在邻近祖宅的地方，愈近愈好。\n\n第二步就是培养起与查尔兹·巴斯克维尔爵士和邻人们的友情来。\n\n“准男爵亲口告诉了他关于家族的猎狗的传说，因此也就为自己铺了一条死亡的道路。斯台普吞——我就还这样称呼他吧——知道了老头的心脏很衰弱，稍一惊吓就能致死，这些都是他从摩梯末医生那里知道的——他还听说，查尔兹爵士很迷信，并且十分相信那个可怕的传说。他那灵敏的头脑马上就想出了一个办法，既可置准男爵于死地，而且又几乎没有可能追究真正的凶手。\n\n“心里有了这个念头之后，他就费了相当的心机设法使其实现。一个普通的阴谋计划者，利用一只凶恶的猎狗也就满足了。可是他还采用了人工的方法使这动物变得象魔鬼一样的可怕，这就要算是他的机智和天才了。那狗是他从伦敦福莱姆街的贩狗商人罗斯和曼格斯那里买来的，是他们所有的货色之中最强壮、最凶恶的一只了。他坐北德文郡铁路的车把它带回家来，为了怕引起别人的注意，他牵着狗穿过沼地走了很长的路。他已经在捕捉昆虫的时候学会了怎样走进格林盆泥潭去，因此能给那只猎狗找到一处安全的藏身之所。他就把它关在那里，待机使用。\n\n“可是好机会不是很快就能来到的，夜间没法把那老绅士从家中引出来，好几次，斯台普吞带着他那猎狗埋伏在外面，可是毫无结果。就在这些次一无结果的跟踪追寻当中，他，或者不如说是他的同伙，被农民看到了，因此，那段魔狗的传说就又得到了新的证实。他曾希望过，他太太也许能将查尔兹引向毁灭，可是在这问题上，她竟表现出意想不到的不听话。她不肯把老绅士拖进情网，因为这样一来就可能把他交给了他的死敌，恐吓、甚至我连提都不愿提起的殴打，都没能动摇她的决心，她丝毫也不愿参预这件事，有一段时期，斯台普吞甚至到了一筹莫展的地步。\n\n“可是他在困难之中终于抓到了一个机会。由于查尔兹爵士对他已经产生了友情，就在帮助那可怜的女人劳拉·莱昂丝太太的那件事里请他负责掌管那一笔慈善金。由于他以单身汉的身分出现，所以他才能对她产生决定性的影响。他向她表示，如果她和丈夫离婚能获成功，他就和她结婚。可是他那计划突然面临了一个紧要关头，在摩梯末医生建议之下，查尔兹爵士正准备离庄园他去，他本人也假装同意这个意见，但他必须马上采取行动，否则他所要加害的人一远离，他就会弄得鞭长莫及了。因此他就迫使莱昂丝太太写了那封信，恳求老头在去伦敦之前的晚上和她见一次面，随后又用听来似乎很有道理的一套理由使她未去赴约，这样一来，他就得到了一个久候未得的好机会。\n\n“在傍晚的时候，他从库姆·特雷西坐车回来，有足够的时间弄回他的猎狗来，抹好发光涂料，再带着那畜生到栅门附近去，他知道，他一定能看到老绅士在那里等着。那狗受到了主人的怂使，跃过了栅门就向不幸的准男爵追了过去，他被追得一边喊叫一边顺着水松夹道飞奔下去。在那样阴暗的夹道里看到那只又大又黑、嘴眼都冒火的家伙在身后跳跃前进，确实是万分可怕，因此他就由于心脏病和恐惧过度的缘故在夹道的尽头倒地身亡了。那猎狗顺着多草的路边跑，而准男爵则在小路上跑，因此除了人的脚印之外看不到任何其他痕迹。那狗看到他躺下一动不动之后，也许走近前来，闻了一闻，可是发现他已死去之后就又转头离开了，就是在那时，它留下了摩梯末医生所看到的爪印。猎狗被叫了回去，并急忙地被赶回设在格林盆泥沼的狗窝去。这件神秘的事件使官厅感到莫名其妙，使乡下人大为吃惊，最后我们就接手调查了这件案子。\n\n“关于查尔兹·巴斯克维尔爵士的死就说到这里为止吧。\n\n你们能看得出来，这里面的手段用得狡猾之至，确实，几乎无法向真正的凶手提出控诉。他那唯一的同谋永远也不会泄露他的秘密，那古怪而难以想象的手法使得他那阴谋进行得更加顺利。与此案有关的两个女人，斯台普吞太太和劳拉·莱昂丝太太都对斯台普吞极为怀疑。斯台普吞太太知道他在暗算着老头儿，也知道有那只猎狗；莱昂丝太太对这两件事都不知道，可是她记得，暴死发生的时间正是并没有取消的约会的时间，而这个约会只有他知道，因此她也不无怀疑。但是，她俩都是在他的控制之下，而他对她们则一无所惧。全部阴谋的前一半是成功地实现了，可是剩下的还有更困难的呢。\n\n“可能斯台普吞并不知道在加拿大还有一个继承人。可是不管怎样，他很快就能从他的朋友摩梯末医生那里知道了。摩梯末医生后来就详细地告诉了他关于亨利·巴斯克维尔到来的消息。斯台普吞的第一个念头就是：也许根本就不用等这个来自加拿大的陌生青年到德文郡来，在伦敦就可以把他弄死。自从他太太拒绝帮他设阱陷害老头儿以后，他已不再信任他的妻子了，他甚至不敢使她长时间离开自己，因为他怕这样会失去左右她的力量，正因为如此，他才带着她一起到伦敦去。我发现他们住在克瑞文街的梅克司波柔私人旅馆里，我曾派人到那旅馆去搜集证据。在那里，他就把太太关在房间里，而他就装上假胡须，跟踪着摩梯末医生，先到贝克街，后去车站，还到过诺桑勃兰旅馆。他太太对他的阴谋计划多少知道一些，可是她对丈夫怕得厉害——一种由于遭受过残暴的虐待而产生的恐惧——因此她不敢写信去警告那个她知道正处在危险之中的人，因为如果那封信落入斯台普吞之手的话，她的性命就会发生危险了。最后，我们都已知道了，她采取了权宜之计，她用从报纸上剪下来的字凑成了那封信，用伪装的笔迹在信封上写了收信人的地址。那封信到了准男爵的手里，对他发出了第一次危险警告。\n\n“弄一件亨利爵士的衣物对斯台普吞说来是非常重要的，因为他一旦到了不得不用狗的时候，他就能有使狗闻味追踪的东西了，他马上以特有的机敏和大胆动起手来，我们可以肯定，旅馆的男女仆人一定都接受过不少的贿赂才来帮助他达到目的。可是碰巧，第一只弄到的皮鞋竟是新的，对他毫无用处，后来他就把它送还，并窃取了另一只——这件事对我们最有帮助了，因为他在我心里肯定地证实了和我们打交道的是一只真正的猎狗，因为没有别的假设能够解释，为什么要急于弄到一只旧鞋，而对一只新鞋竟这样不感兴趣。越是稀奇古怪的事情就越值得仔细地加以检查，那看来似乎会使全案复杂化的一点，如果给以适当的考虑，并加以科学的处理，往往却正是最能说明问题之处。\n\n“后来，第二天早晨，咱们的朋友又来拜访了咱们，他们一直都受着坐在马车里的斯台普吞的跟踪。从他对咱们的房子和我的面貌知道得那样清楚和他一般的行为来看，我感觉，斯台普吞的罪恶历史决非仅仅限于巴斯克维尔庄园案这一件事。据说在过去三年里，西部曾发生过四次大盗窃案，可是没有一件捉到了罪犯。最后一件是五月间在弗克斯吞场发生的，其特殊之处是：一个僮仆因为想要袭擒那带着面具的单身盗贼而被残酷地枪击致死。我相信斯台普吞就是这样地补充了他那日渐减少的财产，而且这些年来他一直就是个危险的亡命之徒。\n\n“那天早晨，当他成功地从我们手中逃掉并通过马车夫将我的姓名传达给我的时候，咱们已经领略了他的机智和大胆了。从那时起，他就知道我在伦敦已经接手办这件案子了，因此，他知道在那里再也得不到下手的机会了，他才回到了达特沼地，等待着准男爵的来临。”\n\n“等一下！”我说道，“无疑的，你已经如实地描述了事情的经过，可是有一点你还没有解释到。当主人在伦敦的时候，那只猎狗怎么办呢？”\n\n“我曾注意到这件事，而且无疑是重要的。毫无问题，斯台普吞有一个亲信，虽然看来还不象是斯台普吞已经把自己的计划都告诉了他而受着他的左右。在梅利琵宅邸中有一个老男仆，名叫安东尼，他和斯台普吞家的关系可以追溯到数年以前斯台普吞做小学校长的时期，因此他一定知道他的主人和女主人确是夫妇，这人已经从乡间逃跑不见了。‘安东尼’这个姓似乎在英格兰很不普通，而‘安托尼奥’这个姓在所有说西班牙话的国家和美洲说西班牙话的国家里同样也不普通。这个人，象斯台普吞太太一样，英文说得很好，可是带着奇怪的大舌头的味道。我曾亲眼看到这个老头经过斯台普吞所标出来的小路走过格林盆泥沼。因此，很可能是当他的主人不在的时候就由他来照顾猎狗。虽然他或许从来也不知道养这只畜生是作什么用的。\n\n“随后，斯台普吞夫妇就回到了德文郡。不久，亨利爵士和你就在那里跟上了他们。还要说一下我个人在那时的看法，也许你还能想得起来，当我检查那张上面贴着报纸铅印字的信的时候，我仔细地检查了纸里面的水印。在检查的时候，我把它拿在离眼睛只有几英寸的地方，感觉出有一种象是白迎春花的香味。香水一共有七十五种，一个犯罪学专家应当每种都能分辨得出来。根据我个人的经验，在不只一件案子里，全靠能迅速辨别出香水的种类才破的案。那股香味说明，案子里面牵涉到一位女士，当时在我心里已经开始想到了斯台普吞夫妇。我就是这样地在到西部乡下去之前肯定了那猎狗，并且猜出了罪犯。*\n\n“我玩的把戏就是监视斯台普吞。可是，显然，如果我是和你在一起的话，我就会干不成这件事了，因为那样一来，他就会大加小心了。因此，我就把大家——连你在内——全都欺骗了，当人家以为我还在伦敦的时候，我已秘密地到乡下来了。我所吃的苦，并不象你所想象得那样多，决不能让这些细微末节扰乱案件的调查工作。我大部分时间都呆在库姆·特雷西，只有当必须去接近犯罪现场的时候，我才去住在沼地上的小屋里。卡特莱和我一同来了，他假扮成农村小孩，对我的帮助太大了。靠着他，我才能弄到食物和干净衣服，在我监视着斯台普吞的时候，卡特莱经常在监视着你，因此我的手就能抓住了所有的线索。\n\n“我已经告诉过你了，你的报告都能很快地送到我的手里，因为它们一到贝克街马上就被送到库姆·特雷西来了。那些报告对我有极大的帮助，特别是有关斯台普吞身世的碰巧是真实的那篇。我已能证明就是那个男人和那个女人了，并且总算准确地知道了我应当怎样去了解。那个逃犯和他与白瑞摩之间的关系确曾使案情相当复杂化起来，这一点已被你用很有效的办法澄清了，虽然我也通过自己的观察得到了同样的结论。\n\n“当你在沼地里发现了我的时候，我已把全部事实都弄清了，可是我还没有足以拿到陪审官面前去的罪证，甚至那晚斯台普吞企图谋杀亨利爵士，但结果却杀死了不幸的逃犯的事实都难以证明他有杀人罪。看样子除了当场捉他之外是别无他法了，而要这样做，咱们就得利用亨利爵士作为诱饵，使他处于单身行路和显然受不到任何保护的状况之下。咱们就这样做了，虽然使咱们的委托人受到了严重的惊吓，可是咱们终于凑全了罪证，并把斯台普吞驱向了毁灭。使亨利爵士暴身于危险之中，我承认，这只能说是我在处理此案过程之中的一大缺点，可是咱们无法预知，那畜生竟会显出那样可怕和骇人欲绝的样子，咱们也无法预知那使它能那么突然地向我们窜来的大雾的出现。咱们的任务的完成是付出了代价的，可是专家摩梯末医生向我保证说，这一代价的影响只是暂时的。一次长途旅行，不仅能够恢复咱们朋友深受打击的神经，并能医治他那心灵上的创伤，他对那位女士的爱情是深挚的。对他说来，在这件倒霉的事情里，最使人伤心的就是，他竟也受了她的骗。\n\n“现在剩下需要说明的就是她在此中所扮演的角色了。无疑地，她是受着斯台普吞的左右的。其原因也许是爱情，也许是恐惧，更可能是两样都有，因为这决不是两种不可以同时存在的感情。这种控制的力量，至少是绝对有效的，在他的命令之下，她同意了装作是他的妹妹，虽然在他想要使她直接参加谋杀的时候，也发现了他对她的控制力还是有限的。\n\n只要不把她的丈夫牵连进去，她就准备去警告亨利爵士，而且她也曾一再地确想这样做。看来斯台普吞似乎还有着嫉妒心，当他看到准男爵向女士求婚的时候，虽然这一点也是在他自己的计划之内，他还是忍不住要大发雷霆地出面干涉，这样一来就把他聪明地靠着强自抑制而掩盖起来的火暴性格暴露出来了。他用笼络感情的办法使亨利爵士经常到梅利琵宅邸来，以便早晚能获得他所期望的好机会，可是在事情危急的那一天，他太太突然和他对立起来。她已稍知那逃犯死亡的事，而且她也知道，亨利爵士来吃晚饭的那一傍晚，那只猎狗就关在外边的小屋里。她谴责了她丈夫预谋要干的罪行；他狂怒了，他第一次向她透露他已另有所爱。她那往日的柔顺突然变成了深深的仇恨，他看得出来，她会将他出卖的，因此他就把她捆了起来，以免她一得机会就去警告亨利爵士，无疑地，他是希望当全乡的人都把准男爵的死归之于他家的厄运的时候——他们当然会这样想——他就能争取他太太接受既成事实，并要她保守秘密了。在这个问题上，我想，无论如何他是打错算盘了，即使咱们不到那里去，他的命运也同样是注定了的。一个有着西班牙血统的女人是不会那么轻易地宽恕这样的侮辱的。我亲爱的华生，不参考摘记，我是无法更详细地给你叙述这一奇异的案件了。我不知道是否还剩下了什么重要的东西没有解释到。”\n\n“他是不能指望用他那只可怕的猎狗，象弄死老伯父那样地吓死亨利爵士的。”\n\n“那畜生很凶猛，而且只喂得半饱。它的外表即使没有把它所追踪的人吓死，至少也能使他丧失抵抗力。”\n\n“当然了。还剩下一个难题。如果斯台普吞继承了财产，他怎样来解释这样的事实呢：他——继承人——为什么一直更名改姓地隐居在离财产这么近的地方呢？他怎么能要求继承权而不引起别人的怀疑和要求进行调查呢？”\n\n“这是一个绝大的困难，想要让我去解决这个问题，恐怕你是要求过高了。过去和现在的事我都调查过了。可是一个人将来会怎么样，这倒是个很难回答的问题。斯台普吞太太曾经几次听到她丈夫谈论这个问题，有三条路可走：他也许要从南美洲要求继承这份财产，让当地的英国当局证明他的身份，这样可以根本不来英格兰就把财产弄到手；或者住在伦敦的短时期内采取隐蔽身份的办法；或者，还许找一个同谋，带着证明文件的证物，证明他的继承人的身份，可是对他收入的一部保留所有权。根据咱们对他的了解，他总是能设法解决这些困难的。啊，我亲爱的华生，咱们已经干了几个星期严肃认真的工作了，我想，咱们还是换换口味，今晚想些愉快的事吧。我在虞格诺戏院订了一个包厢。你听过德·雷兹凯［让·德·雷兹凯：波兰歌剧演唱家，１８５３年生于华沙。——译者注］演的歌剧吗？请你在半小时之内穿戴好，途中咱们还可以到玛齐尼饭店吃晚饭呢。”", "is_ending": true, "clues": ["华生临危决断、果断开火解救亨利爵士性命的英勇功绩，赢得福尔摩斯与苏格兰场的一致赞许"], "choices": []}, "ch15_holmes": {"id": "ch15_holmes", "title": "第十五章 回顾（终局：福尔摩斯之理性大捷）", "pov": "holmes", "pov_name": "歇洛克·福尔摩斯", "node_type": "ending", "anchor_name": null, "content": "福尔摩斯倚靠在软垫上，向冬日暮色中悠闲地吐出缕缕精巧的烟圈。“这是一场纯粹理性的较量，华生，”他带着平静的欣慰低语道，“从摩梯末医生带进那份一七四二年的手稿那一刻起，这就是一场哥特式迷信与冷峻分析科学之间的搏斗。通过测算泥潭的实际边界、大雾推进的时间与猎犬奔袭的弹道，科学最终彻底击碎了盘踞数个世纪的黑暗。”\n\n那已经是十一月底了，一个阴冷多雾的夜晚，在贝克街的寓所里，福尔摩斯和我在起居室中坐在熊熊的炉火两旁。在我们到德文郡去经历了那场结局悲惨的案件之后，他已又办了两件最为重要的案子。在第一件案子里，他揭发了阿波乌上校的丑行，因为他与出名的“无匹俱乐部”纸牌舞弊案有关；而在第二件案子里，他保护了不幸的蒙特邦歇太太，使她免于身负谋害其丈夫前妻之女卡莱小姐的罪名——这个大家都还记得的年轻小姐，在那件事发生了六个月之后依然活着，而且还在纽约结了婚。我的朋友因为在一连串困难而又重要的案件里获得了成功，故而精神奕奕，因此我才能诱使他谈起了神秘的巴斯克维尔案的详情。我一直在耐心地等待着这个好机会，因为据我所知，他是不允许各案互相搅扰的，以免他那清晰的头脑由于回想过去的事而分散对目前工作的注意力。亨利爵士和摩梯末医生都在伦敦，正准备出发作一次长途旅行，以便恢复爵士那深受刺激的神经。就在那天下午，他们来拜访了我们，因此，很自然地谈起了这个问题。\n\n“事情的全部过程，”福尔摩斯说，“从自称为斯台普吞的那人的观点来看是简单明了的。虽然对咱们说来，一开始的时候无法得知他那些行动的动机，就连事实也只能知道一部分，因此就使得全部经过显得极为错综复杂了。我和斯台普吞太太已经谈过两次话了，这个案件现在已经完全搞清楚了，我不知道还会有什么不解之谜。在我那带有索引的案件统计表的Ｂ字栏里，你能找到几条有关这件事的摘记。”东西\n\n“也许你愿意根据记忆把全案的梗概谈一谈吧。”\n\n“我当然愿意谈一谈罗，虽然我不能保证全部事实都能记住，思想的高度集中很能淹没对于过去的记忆。一个正在处理案件的律师能够就本案的问题和一个专家进行辩论，可是经过一两个星期的法庭诉讼之后就又忘得精光了。因此，在我的脑子里，后来的案子不断地代替了以前各案的地位，而卡莱小姐的事也就模糊了我对巴斯克维尔庄园案案情的回忆。明天也许又要来了什么小问题了，同样也会代替了美丽的法国姑娘和臭名远扬的阿波乌两案的地位。可是关于猎狗这个案件，我倒愿意尽可能正确地把它告诉你们，如果我遗忘了什么的话，你们再加以补充。\n\n“我的调查毫无疑问地证实了，那巴斯克维尔家的画像并没有骗人，那个家伙确是巴斯克维尔家的人，他就是那个查尔兹爵士的弟弟罗杰·巴斯克维尔的儿子。罗杰曾带着极坏的名誉逃到南美洲去，传说他在那里没有结婚就死了。实际上，他结了婚，并且生了一个小孩。这个小家伙和父亲同名，他和一位哥斯达黎加的美人贝莉儿·迦洛茜娅结了婚，在一次偷取了大批公款之后，他就改名凡戴勒逃到英格兰来了。在这里，他又在约克郡的东部开办了一所小学。他所以想搞一下这种事业是因为他在归途中偶尔结识了一个患有肺病的教师，他想利用这人的能力作一番成功的事业。可是这位福瑞泽教师死了，弄得这学校由名誉不佳直到变得臭名远扬了。凡戴勒夫妇感觉最好还是改姓斯台普吞，于是他就带着剩下的财产，带着未来的计划和对昆虫学的爱好迁到英格兰南部去了。我由大英博物馆得知，他在这一门学问里还是个公认的权威呢，而且有一种飞蛾是由于他在约克郡居住时期首先发现的，所以也就永久以凡戴勒为名了。*\n\n“咱们现在谈到他的那一段生活，确实会使咱们感到极大的兴趣。那家伙显然是在经过调查之后发现了，只有两个人有碍于他获得庞大的财产。我相信，在去德文郡的时候，他的计划还很模糊，可是从他带着自己的太太而又使她以妹妹的身分出现这一点来看，显然他从一开始就是居心不良的。虽然他可能还没有确定整个阴谋的细节，可是显然他已想到将她用作钓饵了。他下定决心要把财产弄到手，为了达到这一目的，他不惜采用任何手段或是冒任何危险。他的第一步行动就是，首先把自己的家安置在邻近祖宅的地方，愈近愈好。\n\n第二步就是培养起与查尔兹·巴斯克维尔爵士和邻人们的友情来。\n\n“准男爵亲口告诉了他关于家族的猎狗的传说，因此也就为自己铺了一条死亡的道路。斯台普吞——我就还这样称呼他吧——知道了老头的心脏很衰弱，稍一惊吓就能致死，这些都是他从摩梯末医生那里知道的——他还听说，查尔兹爵士很迷信，并且十分相信那个可怕的传说。他那灵敏的头脑马上就想出了一个办法，既可置准男爵于死地，而且又几乎没有可能追究真正的凶手。\n\n“心里有了这个念头之后，他就费了相当的心机设法使其实现。一个普通的阴谋计划者，利用一只凶恶的猎狗也就满足了。可是他还采用了人工的方法使这动物变得象魔鬼一样的可怕，这就要算是他的机智和天才了。那狗是他从伦敦福莱姆街的贩狗商人罗斯和曼格斯那里买来的，是他们所有的货色之中最强壮、最凶恶的一只了。他坐北德文郡铁路的车把它带回家来，为了怕引起别人的注意，他牵着狗穿过沼地走了很长的路。他已经在捕捉昆虫的时候学会了怎样走进格林盆泥潭去，因此能给那只猎狗找到一处安全的藏身之所。他就把它关在那里，待机使用。\n\n“可是好机会不是很快就能来到的，夜间没法把那老绅士从家中引出来，好几次，斯台普吞带着他那猎狗埋伏在外面，可是毫无结果。就在这些次一无结果的跟踪追寻当中，他，或者不如说是他的同伙，被农民看到了，因此，那段魔狗的传说就又得到了新的证实。他曾希望过，他太太也许能将查尔兹引向毁灭，可是在这问题上，她竟表现出意想不到的不听话。她不肯把老绅士拖进情网，因为这样一来就可能把他交给了他的死敌，恐吓、甚至我连提都不愿提起的殴打，都没能动摇她的决心，她丝毫也不愿参预这件事，有一段时期，斯台普吞甚至到了一筹莫展的地步。\n\n“可是他在困难之中终于抓到了一个机会。由于查尔兹爵士对他已经产生了友情，就在帮助那可怜的女人劳拉·莱昂丝太太的那件事里请他负责掌管那一笔慈善金。由于他以单身汉的身分出现，所以他才能对她产生决定性的影响。他向她表示，如果她和丈夫离婚能获成功，他就和她结婚。可是他那计划突然面临了一个紧要关头，在摩梯末医生建议之下，查尔兹爵士正准备离庄园他去，他本人也假装同意这个意见，但他必须马上采取行动，否则他所要加害的人一远离，他就会弄得鞭长莫及了。因此他就迫使莱昂丝太太写了那封信，恳求老头在去伦敦之前的晚上和她见一次面，随后又用听来似乎很有道理的一套理由使她未去赴约，这样一来，他就得到了一个久候未得的好机会。\n\n“在傍晚的时候，他从库姆·特雷西坐车回来，有足够的时间弄回他的猎狗来，抹好发光涂料，再带着那畜生到栅门附近去，他知道，他一定能看到老绅士在那里等着。那狗受到了主人的怂使，跃过了栅门就向不幸的准男爵追了过去，他被追得一边喊叫一边顺着水松夹道飞奔下去。在那样阴暗的夹道里看到那只又大又黑、嘴眼都冒火的家伙在身后跳跃前进，确实是万分可怕，因此他就由于心脏病和恐惧过度的缘故在夹道的尽头倒地身亡了。那猎狗顺着多草的路边跑，而准男爵则在小路上跑，因此除了人的脚印之外看不到任何其他痕迹。那狗看到他躺下一动不动之后，也许走近前来，闻了一闻，可是发现他已死去之后就又转头离开了，就是在那时，它留下了摩梯末医生所看到的爪印。猎狗被叫了回去，并急忙地被赶回设在格林盆泥沼的狗窝去。这件神秘的事件使官厅感到莫名其妙，使乡下人大为吃惊，最后我们就接手调查了这件案子。\n\n“关于查尔兹·巴斯克维尔爵士的死就说到这里为止吧。\n\n你们能看得出来，这里面的手段用得狡猾之至，确实，几乎无法向真正的凶手提出控诉。他那唯一的同谋永远也不会泄露他的秘密，那古怪而难以想象的手法使得他那阴谋进行得更加顺利。与此案有关的两个女人，斯台普吞太太和劳拉·莱昂丝太太都对斯台普吞极为怀疑。斯台普吞太太知道他在暗算着老头儿，也知道有那只猎狗；莱昂丝太太对这两件事都不知道，可是她记得，暴死发生的时间正是并没有取消的约会的时间，而这个约会只有他知道，因此她也不无怀疑。但是，她俩都是在他的控制之下，而他对她们则一无所惧。全部阴谋的前一半是成功地实现了，可是剩下的还有更困难的呢。\n\n“可能斯台普吞并不知道在加拿大还有一个继承人。可是不管怎样，他很快就能从他的朋友摩梯末医生那里知道了。摩梯末医生后来就详细地告诉了他关于亨利·巴斯克维尔到来的消息。斯台普吞的第一个念头就是：也许根本就不用等这个来自加拿大的陌生青年到德文郡来，在伦敦就可以把他弄死。自从他太太拒绝帮他设阱陷害老头儿以后，他已不再信任他的妻子了，他甚至不敢使她长时间离开自己，因为他怕这样会失去左右她的力量，正因为如此，他才带着她一起到伦敦去。我发现他们住在克瑞文街的梅克司波柔私人旅馆里，我曾派人到那旅馆去搜集证据。在那里，他就把太太关在房间里，而他就装上假胡须，跟踪着摩梯末医生，先到贝克街，后去车站，还到过诺桑勃兰旅馆。他太太对他的阴谋计划多少知道一些，可是她对丈夫怕得厉害——一种由于遭受过残暴的虐待而产生的恐惧——因此她不敢写信去警告那个她知道正处在危险之中的人，因为如果那封信落入斯台普吞之手的话，她的性命就会发生危险了。最后，我们都已知道了，她采取了权宜之计，她用从报纸上剪下来的字凑成了那封信，用伪装的笔迹在信封上写了收信人的地址。那封信到了准男爵的手里，对他发出了第一次危险警告。\n\n“弄一件亨利爵士的衣物对斯台普吞说来是非常重要的，因为他一旦到了不得不用狗的时候，他就能有使狗闻味追踪的东西了，他马上以特有的机敏和大胆动起手来，我们可以肯定，旅馆的男女仆人一定都接受过不少的贿赂才来帮助他达到目的。可是碰巧，第一只弄到的皮鞋竟是新的，对他毫无用处，后来他就把它送还，并窃取了另一只——这件事对我们最有帮助了，因为他在我心里肯定地证实了和我们打交道的是一只真正的猎狗，因为没有别的假设能够解释，为什么要急于弄到一只旧鞋，而对一只新鞋竟这样不感兴趣。越是稀奇古怪的事情就越值得仔细地加以检查，那看来似乎会使全案复杂化的一点，如果给以适当的考虑，并加以科学的处理，往往却正是最能说明问题之处。\n\n“后来，第二天早晨，咱们的朋友又来拜访了咱们，他们一直都受着坐在马车里的斯台普吞的跟踪。从他对咱们的房子和我的面貌知道得那样清楚和他一般的行为来看，我感觉，斯台普吞的罪恶历史决非仅仅限于巴斯克维尔庄园案这一件事。据说在过去三年里，西部曾发生过四次大盗窃案，可是没有一件捉到了罪犯。最后一件是五月间在弗克斯吞场发生的，其特殊之处是：一个僮仆因为想要袭擒那带着面具的单身盗贼而被残酷地枪击致死。我相信斯台普吞就是这样地补充了他那日渐减少的财产，而且这些年来他一直就是个危险的亡命之徒。\n\n“那天早晨，当他成功地从我们手中逃掉并通过马车夫将我的姓名传达给我的时候，咱们已经领略了他的机智和大胆了。从那时起，他就知道我在伦敦已经接手办这件案子了，因此，他知道在那里再也得不到下手的机会了，他才回到了达特沼地，等待着准男爵的来临。”\n\n“等一下！”我说道，“无疑的，你已经如实地描述了事情的经过，可是有一点你还没有解释到。当主人在伦敦的时候，那只猎狗怎么办呢？”\n\n“我曾注意到这件事，而且无疑是重要的。毫无问题，斯台普吞有一个亲信，虽然看来还不象是斯台普吞已经把自己的计划都告诉了他而受着他的左右。在梅利琵宅邸中有一个老男仆，名叫安东尼，他和斯台普吞家的关系可以追溯到数年以前斯台普吞做小学校长的时期，因此他一定知道他的主人和女主人确是夫妇，这人已经从乡间逃跑不见了。‘安东尼’这个姓似乎在英格兰很不普通，而‘安托尼奥’这个姓在所有说西班牙话的国家和美洲说西班牙话的国家里同样也不普通。这个人，象斯台普吞太太一样，英文说得很好，可是带着奇怪的大舌头的味道。我曾亲眼看到这个老头经过斯台普吞所标出来的小路走过格林盆泥沼。因此，很可能是当他的主人不在的时候就由他来照顾猎狗。虽然他或许从来也不知道养这只畜生是作什么用的。\n\n“随后，斯台普吞夫妇就回到了德文郡。不久，亨利爵士和你就在那里跟上了他们。还要说一下我个人在那时的看法，也许你还能想得起来，当我检查那张上面贴着报纸铅印字的信的时候，我仔细地检查了纸里面的水印。在检查的时候，我把它拿在离眼睛只有几英寸的地方，感觉出有一种象是白迎春花的香味。香水一共有七十五种，一个犯罪学专家应当每种都能分辨得出来。根据我个人的经验，在不只一件案子里，全靠能迅速辨别出香水的种类才破的案。那股香味说明，案子里面牵涉到一位女士，当时在我心里已经开始想到了斯台普吞夫妇。我就是这样地在到西部乡下去之前肯定了那猎狗，并且猜出了罪犯。*\n\n“我玩的把戏就是监视斯台普吞。可是，显然，如果我是和你在一起的话，我就会干不成这件事了，因为那样一来，他就会大加小心了。因此，我就把大家——连你在内——全都欺骗了，当人家以为我还在伦敦的时候，我已秘密地到乡下来了。我所吃的苦，并不象你所想象得那样多，决不能让这些细微末节扰乱案件的调查工作。我大部分时间都呆在库姆·特雷西，只有当必须去接近犯罪现场的时候，我才去住在沼地上的小屋里。卡特莱和我一同来了，他假扮成农村小孩，对我的帮助太大了。靠着他，我才能弄到食物和干净衣服，在我监视着斯台普吞的时候，卡特莱经常在监视着你，因此我的手就能抓住了所有的线索。\n\n“我已经告诉过你了，你的报告都能很快地送到我的手里，因为它们一到贝克街马上就被送到库姆·特雷西来了。那些报告对我有极大的帮助，特别是有关斯台普吞身世的碰巧是真实的那篇。我已能证明就是那个男人和那个女人了，并且总算准确地知道了我应当怎样去了解。那个逃犯和他与白瑞摩之间的关系确曾使案情相当复杂化起来，这一点已被你用很有效的办法澄清了，虽然我也通过自己的观察得到了同样的结论。\n\n“当你在沼地里发现了我的时候，我已把全部事实都弄清了，可是我还没有足以拿到陪审官面前去的罪证，甚至那晚斯台普吞企图谋杀亨利爵士，但结果却杀死了不幸的逃犯的事实都难以证明他有杀人罪。看样子除了当场捉他之外是别无他法了，而要这样做，咱们就得利用亨利爵士作为诱饵，使他处于单身行路和显然受不到任何保护的状况之下。咱们就这样做了，虽然使咱们的委托人受到了严重的惊吓，可是咱们终于凑全了罪证，并把斯台普吞驱向了毁灭。使亨利爵士暴身于危险之中，我承认，这只能说是我在处理此案过程之中的一大缺点，可是咱们无法预知，那畜生竟会显出那样可怕和骇人欲绝的样子，咱们也无法预知那使它能那么突然地向我们窜来的大雾的出现。咱们的任务的完成是付出了代价的，可是专家摩梯末医生向我保证说，这一代价的影响只是暂时的。一次长途旅行，不仅能够恢复咱们朋友深受打击的神经，并能医治他那心灵上的创伤，他对那位女士的爱情是深挚的。对他说来，在这件倒霉的事情里，最使人伤心的就是，他竟也受了她的骗。\n\n“现在剩下需要说明的就是她在此中所扮演的角色了。无疑地，她是受着斯台普吞的左右的。其原因也许是爱情，也许是恐惧，更可能是两样都有，因为这决不是两种不可以同时存在的感情。这种控制的力量，至少是绝对有效的，在他的命令之下，她同意了装作是他的妹妹，虽然在他想要使她直接参加谋杀的时候，也发现了他对她的控制力还是有限的。\n\n只要不把她的丈夫牵连进去，她就准备去警告亨利爵士，而且她也曾一再地确想这样做。看来斯台普吞似乎还有着嫉妒心，当他看到准男爵向女士求婚的时候，虽然这一点也是在他自己的计划之内，他还是忍不住要大发雷霆地出面干涉，这样一来就把他聪明地靠着强自抑制而掩盖起来的火暴性格暴露出来了。他用笼络感情的办法使亨利爵士经常到梅利琵宅邸来，以便早晚能获得他所期望的好机会，可是在事情危急的那一天，他太太突然和他对立起来。她已稍知那逃犯死亡的事，而且她也知道，亨利爵士来吃晚饭的那一傍晚，那只猎狗就关在外边的小屋里。她谴责了她丈夫预谋要干的罪行；他狂怒了，他第一次向她透露他已另有所爱。她那往日的柔顺突然变成了深深的仇恨，他看得出来，她会将他出卖的，因此他就把她捆了起来，以免她一得机会就去警告亨利爵士，无疑地，他是希望当全乡的人都把准男爵的死归之于他家的厄运的时候——他们当然会这样想——他就能争取他太太接受既成事实，并要她保守秘密了。在这个问题上，我想，无论如何他是打错算盘了，即使咱们不到那里去，他的命运也同样是注定了的。一个有着西班牙血统的女人是不会那么轻易地宽恕这样的侮辱的。我亲爱的华生，不参考摘记，我是无法更详细地给你叙述这一奇异的案件了。我不知道是否还剩下了什么重要的东西没有解释到。”\n\n“他是不能指望用他那只可怕的猎狗，象弄死老伯父那样地吓死亨利爵士的。”\n\n“那畜生很凶猛，而且只喂得半饱。它的外表即使没有把它所追踪的人吓死，至少也能使他丧失抵抗力。”\n\n“当然了。还剩下一个难题。如果斯台普吞继承了财产，他怎样来解释这样的事实呢：他——继承人——为什么一直更名改姓地隐居在离财产这么近的地方呢？他怎么能要求继承权而不引起别人的怀疑和要求进行调查呢？”\n\n“这是一个绝大的困难，想要让我去解决这个问题，恐怕你是要求过高了。过去和现在的事我都调查过了。可是一个人将来会怎么样，这倒是个很难回答的问题。斯台普吞太太曾经几次听到她丈夫谈论这个问题，有三条路可走：他也许要从南美洲要求继承这份财产，让当地的英国当局证明他的身份，这样可以根本不来英格兰就把财产弄到手；或者住在伦敦的短时期内采取隐蔽身份的办法；或者，还许找一个同谋，带着证明文件的证物，证明他的继承人的身份，可是对他收入的一部保留所有权。根据咱们对他的了解，他总是能设法解决这些困难的。啊，我亲爱的华生，咱们已经干了几个星期严肃认真的工作了，我想，咱们还是换换口味，今晚想些愉快的事吧。我在虞格诺戏院订了一个包厢。你听过德·雷兹凯［让·德·雷兹凯：波兰歌剧演唱家，１８５３年生于华沙。——译者注］演的歌剧吗？请你在半小时之内穿戴好，途中咱们还可以到玛齐尼饭店吃晚饭呢。”", "is_ending": true, "clues": ["科学理性与严谨逻辑的崇高胜利，将几个世纪以来笼罩达特沼地的哥特迷信阴霾彻底扫荡"], "choices": []}, "ch15_tragedy": {"id": "ch15_tragedy", "title": "第十五章 回顾（终局：巴斯克维尔之痛惜余波）", "pov": "watson", "pov_name": "约翰·H·华生医生", "node_type": "ending", "anchor_name": null, "content": "当秋雨淅淅沥沥敲打着贝克街的窗扉时，一股沉重的忧伤笼罩在我们的起居室中。亨利爵士虽从发光怪兽的獠牙下死里逃生，但神经遭受了剧烈的创伤。摩梯末医生已陪同他踏上了环球航行以抚慰心灵。“我们虽然打死了恶犬，华生，”福尔摩斯神色肃穆地说道，“但邪恶在被消灭之前，往往总要向无辜者索取沉痛的代价。”\n\n那已经是十一月底了，一个阴冷多雾的夜晚，在贝克街的寓所里，福尔摩斯和我在起居室中坐在熊熊的炉火两旁。在我们到德文郡去经历了那场结局悲惨的案件之后，他已又办了两件最为重要的案子。在第一件案子里，他揭发了阿波乌上校的丑行，因为他与出名的“无匹俱乐部”纸牌舞弊案有关；而在第二件案子里，他保护了不幸的蒙特邦歇太太，使她免于身负谋害其丈夫前妻之女卡莱小姐的罪名——这个大家都还记得的年轻小姐，在那件事发生了六个月之后依然活着，而且还在纽约结了婚。我的朋友因为在一连串困难而又重要的案件里获得了成功，故而精神奕奕，因此我才能诱使他谈起了神秘的巴斯克维尔案的详情。我一直在耐心地等待着这个好机会，因为据我所知，他是不允许各案互相搅扰的，以免他那清晰的头脑由于回想过去的事而分散对目前工作的注意力。亨利爵士和摩梯末医生都在伦敦，正准备出发作一次长途旅行，以便恢复爵士那深受刺激的神经。就在那天下午，他们来拜访了我们，因此，很自然地谈起了这个问题。\n\n“事情的全部过程，”福尔摩斯说，“从自称为斯台普吞的那人的观点来看是简单明了的。虽然对咱们说来，一开始的时候无法得知他那些行动的动机，就连事实也只能知道一部分，因此就使得全部经过显得极为错综复杂了。我和斯台普吞太太已经谈过两次话了，这个案件现在已经完全搞清楚了，我不知道还会有什么不解之谜。在我那带有索引的案件统计表的Ｂ字栏里，你能找到几条有关这件事的摘记。”东西\n\n“也许你愿意根据记忆把全案的梗概谈一谈吧。”\n\n“我当然愿意谈一谈罗，虽然我不能保证全部事实都能记住，思想的高度集中很能淹没对于过去的记忆。一个正在处理案件的律师能够就本案的问题和一个专家进行辩论，可是经过一两个星期的法庭诉讼之后就又忘得精光了。因此，在我的脑子里，后来的案子不断地代替了以前各案的地位，而卡莱小姐的事也就模糊了我对巴斯克维尔庄园案案情的回忆。明天也许又要来了什么小问题了，同样也会代替了美丽的法国姑娘和臭名远扬的阿波乌两案的地位。可是关于猎狗这个案件，我倒愿意尽可能正确地把它告诉你们，如果我遗忘了什么的话，你们再加以补充。\n\n“我的调查毫无疑问地证实了，那巴斯克维尔家的画像并没有骗人，那个家伙确是巴斯克维尔家的人，他就是那个查尔兹爵士的弟弟罗杰·巴斯克维尔的儿子。罗杰曾带着极坏的名誉逃到南美洲去，传说他在那里没有结婚就死了。实际上，他结了婚，并且生了一个小孩。这个小家伙和父亲同名，他和一位哥斯达黎加的美人贝莉儿·迦洛茜娅结了婚，在一次偷取了大批公款之后，他就改名凡戴勒逃到英格兰来了。在这里，他又在约克郡的东部开办了一所小学。他所以想搞一下这种事业是因为他在归途中偶尔结识了一个患有肺病的教师，他想利用这人的能力作一番成功的事业。可是这位福瑞泽教师死了，弄得这学校由名誉不佳直到变得臭名远扬了。凡戴勒夫妇感觉最好还是改姓斯台普吞，于是他就带着剩下的财产，带着未来的计划和对昆虫学的爱好迁到英格兰南部去了。我由大英博物馆得知，他在这一门学问里还是个公认的权威呢，而且有一种飞蛾是由于他在约克郡居住时期首先发现的，所以也就永久以凡戴勒为名了。*\n\n“咱们现在谈到他的那一段生活，确实会使咱们感到极大的兴趣。那家伙显然是在经过调查之后发现了，只有两个人有碍于他获得庞大的财产。我相信，在去德文郡的时候，他的计划还很模糊，可是从他带着自己的太太而又使她以妹妹的身分出现这一点来看，显然他从一开始就是居心不良的。虽然他可能还没有确定整个阴谋的细节，可是显然他已想到将她用作钓饵了。他下定决心要把财产弄到手，为了达到这一目的，他不惜采用任何手段或是冒任何危险。他的第一步行动就是，首先把自己的家安置在邻近祖宅的地方，愈近愈好。\n\n第二步就是培养起与查尔兹·巴斯克维尔爵士和邻人们的友情来。\n\n“准男爵亲口告诉了他关于家族的猎狗的传说，因此也就为自己铺了一条死亡的道路。斯台普吞——我就还这样称呼他吧——知道了老头的心脏很衰弱，稍一惊吓就能致死，这些都是他从摩梯末医生那里知道的——他还听说，查尔兹爵士很迷信，并且十分相信那个可怕的传说。他那灵敏的头脑马上就想出了一个办法，既可置准男爵于死地，而且又几乎没有可能追究真正的凶手。\n\n“心里有了这个念头之后，他就费了相当的心机设法使其实现。一个普通的阴谋计划者，利用一只凶恶的猎狗也就满足了。可是他还采用了人工的方法使这动物变得象魔鬼一样的可怕，这就要算是他的机智和天才了。那狗是他从伦敦福莱姆街的贩狗商人罗斯和曼格斯那里买来的，是他们所有的货色之中最强壮、最凶恶的一只了。他坐北德文郡铁路的车把它带回家来，为了怕引起别人的注意，他牵着狗穿过沼地走了很长的路。他已经在捕捉昆虫的时候学会了怎样走进格林盆泥潭去，因此能给那只猎狗找到一处安全的藏身之所。他就把它关在那里，待机使用。\n\n“可是好机会不是很快就能来到的，夜间没法把那老绅士从家中引出来，好几次，斯台普吞带着他那猎狗埋伏在外面，可是毫无结果。就在这些次一无结果的跟踪追寻当中，他，或者不如说是他的同伙，被农民看到了，因此，那段魔狗的传说就又得到了新的证实。他曾希望过，他太太也许能将查尔兹引向毁灭，可是在这问题上，她竟表现出意想不到的不听话。她不肯把老绅士拖进情网，因为这样一来就可能把他交给了他的死敌，恐吓、甚至我连提都不愿提起的殴打，都没能动摇她的决心，她丝毫也不愿参预这件事，有一段时期，斯台普吞甚至到了一筹莫展的地步。\n\n“可是他在困难之中终于抓到了一个机会。由于查尔兹爵士对他已经产生了友情，就在帮助那可怜的女人劳拉·莱昂丝太太的那件事里请他负责掌管那一笔慈善金。由于他以单身汉的身分出现，所以他才能对她产生决定性的影响。他向她表示，如果她和丈夫离婚能获成功，他就和她结婚。可是他那计划突然面临了一个紧要关头，在摩梯末医生建议之下，查尔兹爵士正准备离庄园他去，他本人也假装同意这个意见，但他必须马上采取行动，否则他所要加害的人一远离，他就会弄得鞭长莫及了。因此他就迫使莱昂丝太太写了那封信，恳求老头在去伦敦之前的晚上和她见一次面，随后又用听来似乎很有道理的一套理由使她未去赴约，这样一来，他就得到了一个久候未得的好机会。\n\n“在傍晚的时候，他从库姆·特雷西坐车回来，有足够的时间弄回他的猎狗来，抹好发光涂料，再带着那畜生到栅门附近去，他知道，他一定能看到老绅士在那里等着。那狗受到了主人的怂使，跃过了栅门就向不幸的准男爵追了过去，他被追得一边喊叫一边顺着水松夹道飞奔下去。在那样阴暗的夹道里看到那只又大又黑、嘴眼都冒火的家伙在身后跳跃前进，确实是万分可怕，因此他就由于心脏病和恐惧过度的缘故在夹道的尽头倒地身亡了。那猎狗顺着多草的路边跑，而准男爵则在小路上跑，因此除了人的脚印之外看不到任何其他痕迹。那狗看到他躺下一动不动之后，也许走近前来，闻了一闻，可是发现他已死去之后就又转头离开了，就是在那时，它留下了摩梯末医生所看到的爪印。猎狗被叫了回去，并急忙地被赶回设在格林盆泥沼的狗窝去。这件神秘的事件使官厅感到莫名其妙，使乡下人大为吃惊，最后我们就接手调查了这件案子。\n\n“关于查尔兹·巴斯克维尔爵士的死就说到这里为止吧。\n\n你们能看得出来，这里面的手段用得狡猾之至，确实，几乎无法向真正的凶手提出控诉。他那唯一的同谋永远也不会泄露他的秘密，那古怪而难以想象的手法使得他那阴谋进行得更加顺利。与此案有关的两个女人，斯台普吞太太和劳拉·莱昂丝太太都对斯台普吞极为怀疑。斯台普吞太太知道他在暗算着老头儿，也知道有那只猎狗；莱昂丝太太对这两件事都不知道，可是她记得，暴死发生的时间正是并没有取消的约会的时间，而这个约会只有他知道，因此她也不无怀疑。但是，她俩都是在他的控制之下，而他对她们则一无所惧。全部阴谋的前一半是成功地实现了，可是剩下的还有更困难的呢。\n\n“可能斯台普吞并不知道在加拿大还有一个继承人。可是不管怎样，他很快就能从他的朋友摩梯末医生那里知道了。摩梯末医生后来就详细地告诉了他关于亨利·巴斯克维尔到来的消息。斯台普吞的第一个念头就是：也许根本就不用等这个来自加拿大的陌生青年到德文郡来，在伦敦就可以把他弄死。自从他太太拒绝帮他设阱陷害老头儿以后，他已不再信任他的妻子了，他甚至不敢使她长时间离开自己，因为他怕这样会失去左右她的力量，正因为如此，他才带着她一起到伦敦去。我发现他们住在克瑞文街的梅克司波柔私人旅馆里，我曾派人到那旅馆去搜集证据。在那里，他就把太太关在房间里，而他就装上假胡须，跟踪着摩梯末医生，先到贝克街，后去车站，还到过诺桑勃兰旅馆。他太太对他的阴谋计划多少知道一些，可是她对丈夫怕得厉害——一种由于遭受过残暴的虐待而产生的恐惧——因此她不敢写信去警告那个她知道正处在危险之中的人，因为如果那封信落入斯台普吞之手的话，她的性命就会发生危险了。最后，我们都已知道了，她采取了权宜之计，她用从报纸上剪下来的字凑成了那封信，用伪装的笔迹在信封上写了收信人的地址。那封信到了准男爵的手里，对他发出了第一次危险警告。\n\n“弄一件亨利爵士的衣物对斯台普吞说来是非常重要的，因为他一旦到了不得不用狗的时候，他就能有使狗闻味追踪的东西了，他马上以特有的机敏和大胆动起手来，我们可以肯定，旅馆的男女仆人一定都接受过不少的贿赂才来帮助他达到目的。可是碰巧，第一只弄到的皮鞋竟是新的，对他毫无用处，后来他就把它送还，并窃取了另一只——这件事对我们最有帮助了，因为他在我心里肯定地证实了和我们打交道的是一只真正的猎狗，因为没有别的假设能够解释，为什么要急于弄到一只旧鞋，而对一只新鞋竟这样不感兴趣。越是稀奇古怪的事情就越值得仔细地加以检查，那看来似乎会使全案复杂化的一点，如果给以适当的考虑，并加以科学的处理，往往却正是最能说明问题之处。\n\n“后来，第二天早晨，咱们的朋友又来拜访了咱们，他们一直都受着坐在马车里的斯台普吞的跟踪。从他对咱们的房子和我的面貌知道得那样清楚和他一般的行为来看，我感觉，斯台普吞的罪恶历史决非仅仅限于巴斯克维尔庄园案这一件事。据说在过去三年里，西部曾发生过四次大盗窃案，可是没有一件捉到了罪犯。最后一件是五月间在弗克斯吞场发生的，其特殊之处是：一个僮仆因为想要袭擒那带着面具的单身盗贼而被残酷地枪击致死。我相信斯台普吞就是这样地补充了他那日渐减少的财产，而且这些年来他一直就是个危险的亡命之徒。\n\n“那天早晨，当他成功地从我们手中逃掉并通过马车夫将我的姓名传达给我的时候，咱们已经领略了他的机智和大胆了。从那时起，他就知道我在伦敦已经接手办这件案子了，因此，他知道在那里再也得不到下手的机会了，他才回到了达特沼地，等待着准男爵的来临。”\n\n“等一下！”我说道，“无疑的，你已经如实地描述了事情的经过，可是有一点你还没有解释到。当主人在伦敦的时候，那只猎狗怎么办呢？”\n\n“我曾注意到这件事，而且无疑是重要的。毫无问题，斯台普吞有一个亲信，虽然看来还不象是斯台普吞已经把自己的计划都告诉了他而受着他的左右。在梅利琵宅邸中有一个老男仆，名叫安东尼，他和斯台普吞家的关系可以追溯到数年以前斯台普吞做小学校长的时期，因此他一定知道他的主人和女主人确是夫妇，这人已经从乡间逃跑不见了。‘安东尼’这个姓似乎在英格兰很不普通，而‘安托尼奥’这个姓在所有说西班牙话的国家和美洲说西班牙话的国家里同样也不普通。这个人，象斯台普吞太太一样，英文说得很好，可是带着奇怪的大舌头的味道。我曾亲眼看到这个老头经过斯台普吞所标出来的小路走过格林盆泥沼。因此，很可能是当他的主人不在的时候就由他来照顾猎狗。虽然他或许从来也不知道养这只畜生是作什么用的。\n\n“随后，斯台普吞夫妇就回到了德文郡。不久，亨利爵士和你就在那里跟上了他们。还要说一下我个人在那时的看法，也许你还能想得起来，当我检查那张上面贴着报纸铅印字的信的时候，我仔细地检查了纸里面的水印。在检查的时候，我把它拿在离眼睛只有几英寸的地方，感觉出有一种象是白迎春花的香味。香水一共有七十五种，一个犯罪学专家应当每种都能分辨得出来。根据我个人的经验，在不只一件案子里，全靠能迅速辨别出香水的种类才破的案。那股香味说明，案子里面牵涉到一位女士，当时在我心里已经开始想到了斯台普吞夫妇。我就是这样地在到西部乡下去之前肯定了那猎狗，并且猜出了罪犯。*\n\n“我玩的把戏就是监视斯台普吞。可是，显然，如果我是和你在一起的话，我就会干不成这件事了，因为那样一来，他就会大加小心了。因此，我就把大家——连你在内——全都欺骗了，当人家以为我还在伦敦的时候，我已秘密地到乡下来了。我所吃的苦，并不象你所想象得那样多，决不能让这些细微末节扰乱案件的调查工作。我大部分时间都呆在库姆·特雷西，只有当必须去接近犯罪现场的时候，我才去住在沼地上的小屋里。卡特莱和我一同来了，他假扮成农村小孩，对我的帮助太大了。靠着他，我才能弄到食物和干净衣服，在我监视着斯台普吞的时候，卡特莱经常在监视着你，因此我的手就能抓住了所有的线索。\n\n“我已经告诉过你了，你的报告都能很快地送到我的手里，因为它们一到贝克街马上就被送到库姆·特雷西来了。那些报告对我有极大的帮助，特别是有关斯台普吞身世的碰巧是真实的那篇。我已能证明就是那个男人和那个女人了，并且总算准确地知道了我应当怎样去了解。那个逃犯和他与白瑞摩之间的关系确曾使案情相当复杂化起来，这一点已被你用很有效的办法澄清了，虽然我也通过自己的观察得到了同样的结论。\n\n“当你在沼地里发现了我的时候，我已把全部事实都弄清了，可是我还没有足以拿到陪审官面前去的罪证，甚至那晚斯台普吞企图谋杀亨利爵士，但结果却杀死了不幸的逃犯的事实都难以证明他有杀人罪。看样子除了当场捉他之外是别无他法了，而要这样做，咱们就得利用亨利爵士作为诱饵，使他处于单身行路和显然受不到任何保护的状况之下。咱们就这样做了，虽然使咱们的委托人受到了严重的惊吓，可是咱们终于凑全了罪证，并把斯台普吞驱向了毁灭。使亨利爵士暴身于危险之中，我承认，这只能说是我在处理此案过程之中的一大缺点，可是咱们无法预知，那畜生竟会显出那样可怕和骇人欲绝的样子，咱们也无法预知那使它能那么突然地向我们窜来的大雾的出现。咱们的任务的完成是付出了代价的，可是专家摩梯末医生向我保证说，这一代价的影响只是暂时的。一次长途旅行，不仅能够恢复咱们朋友深受打击的神经，并能医治他那心灵上的创伤，他对那位女士的爱情是深挚的。对他说来，在这件倒霉的事情里，最使人伤心的就是，他竟也受了她的骗。\n\n“现在剩下需要说明的就是她在此中所扮演的角色了。无疑地，她是受着斯台普吞的左右的。其原因也许是爱情，也许是恐惧，更可能是两样都有，因为这决不是两种不可以同时存在的感情。这种控制的力量，至少是绝对有效的，在他的命令之下，她同意了装作是他的妹妹，虽然在他想要使她直接参加谋杀的时候，也发现了他对她的控制力还是有限的。\n\n只要不把她的丈夫牵连进去，她就准备去警告亨利爵士，而且她也曾一再地确想这样做。看来斯台普吞似乎还有着嫉妒心，当他看到准男爵向女士求婚的时候，虽然这一点也是在他自己的计划之内，他还是忍不住要大发雷霆地出面干涉，这样一来就把他聪明地靠着强自抑制而掩盖起来的火暴性格暴露出来了。他用笼络感情的办法使亨利爵士经常到梅利琵宅邸来，以便早晚能获得他所期望的好机会，可是在事情危急的那一天，他太太突然和他对立起来。她已稍知那逃犯死亡的事，而且她也知道，亨利爵士来吃晚饭的那一傍晚，那只猎狗就关在外边的小屋里。她谴责了她丈夫预谋要干的罪行；他狂怒了，他第一次向她透露他已另有所爱。她那往日的柔顺突然变成了深深的仇恨，他看得出来，她会将他出卖的，因此他就把她捆了起来，以免她一得机会就去警告亨利爵士，无疑地，他是希望当全乡的人都把准男爵的死归之于他家的厄运的时候——他们当然会这样想——他就能争取他太太接受既成事实，并要她保守秘密了。在这个问题上，我想，无论如何他是打错算盘了，即使咱们不到那里去，他的命运也同样是注定了的。一个有着西班牙血统的女人是不会那么轻易地宽恕这样的侮辱的。我亲爱的华生，不参考摘记，我是无法更详细地给你叙述这一奇异的案件了。我不知道是否还剩下了什么重要的东西没有解释到。”\n\n“他是不能指望用他那只可怕的猎狗，象弄死老伯父那样地吓死亨利爵士的。”\n\n“那畜生很凶猛，而且只喂得半饱。它的外表即使没有把它所追踪的人吓死，至少也能使他丧失抵抗力。”\n\n“当然了。还剩下一个难题。如果斯台普吞继承了财产，他怎样来解释这样的事实呢：他——继承人——为什么一直更名改姓地隐居在离财产这么近的地方呢？他怎么能要求继承权而不引起别人的怀疑和要求进行调查呢？”\n\n“这是一个绝大的困难，想要让我去解决这个问题，恐怕你是要求过高了。过去和现在的事我都调查过了。可是一个人将来会怎么样，这倒是个很难回答的问题。斯台普吞太太曾经几次听到她丈夫谈论这个问题，有三条路可走：他也许要从南美洲要求继承这份财产，让当地的英国当局证明他的身份，这样可以根本不来英格兰就把财产弄到手；或者住在伦敦的短时期内采取隐蔽身份的办法；或者，还许找一个同谋，带着证明文件的证物，证明他的继承人的身份，可是对他收入的一部保留所有权。根据咱们对他的了解，他总是能设法解决这些困难的。啊，我亲爱的华生，咱们已经干了几个星期严肃认真的工作了，我想，咱们还是换换口味，今晚想些愉快的事吧。我在虞格诺戏院订了一个包厢。你听过德·雷兹凯［让·德·雷兹凯：波兰歌剧演唱家，１８５３年生于华沙。——译者注］演的歌剧吗？请你在半小时之内穿戴好，途中咱们还可以到玛齐尼饭店吃晚饭呢。”", "is_ending": true, "clues": ["在炉火旁沉痛回望死里逃生的惨烈搏杀，亨利爵士漫长的疗伤休养，以及罪恶留下的永恒伤疤"], "choices": []}, "ch15_mire": {"id": "ch15_mire", "title": "第十五章 回顾（终局：葬身格林盆泥潭深渊）", "pov": "stapleton", "pov_name": "杰克·斯台普吞", "node_type": "ending", "anchor_name": null, "content": "福尔摩斯停顿了下来，凝视着壁炉里暗红的余烬。“在大格林盆泥潭的极深处，在那吞噬了他的巨大泥淖的肮脏泥浆底下，”他低声说道，“那颗冷酷残忍的心已经永远停止了跳动。杰克·斯台普吞永远不会站在人间的法庭上了。那庇护了他罪恶阴谋的古老沼泽，最终成为了他万劫不复的坟墓。”\n\n那已经是十一月底了，一个阴冷多雾的夜晚，在贝克街的寓所里，福尔摩斯和我在起居室中坐在熊熊的炉火两旁。在我们到德文郡去经历了那场结局悲惨的案件之后，他已又办了两件最为重要的案子。在第一件案子里，他揭发了阿波乌上校的丑行，因为他与出名的“无匹俱乐部”纸牌舞弊案有关；而在第二件案子里，他保护了不幸的蒙特邦歇太太，使她免于身负谋害其丈夫前妻之女卡莱小姐的罪名——这个大家都还记得的年轻小姐，在那件事发生了六个月之后依然活着，而且还在纽约结了婚。我的朋友因为在一连串困难而又重要的案件里获得了成功，故而精神奕奕，因此我才能诱使他谈起了神秘的巴斯克维尔案的详情。我一直在耐心地等待着这个好机会，因为据我所知，他是不允许各案互相搅扰的，以免他那清晰的头脑由于回想过去的事而分散对目前工作的注意力。亨利爵士和摩梯末医生都在伦敦，正准备出发作一次长途旅行，以便恢复爵士那深受刺激的神经。就在那天下午，他们来拜访了我们，因此，很自然地谈起了这个问题。\n\n“事情的全部过程，”福尔摩斯说，“从自称为斯台普吞的那人的观点来看是简单明了的。虽然对咱们说来，一开始的时候无法得知他那些行动的动机，就连事实也只能知道一部分，因此就使得全部经过显得极为错综复杂了。我和斯台普吞太太已经谈过两次话了，这个案件现在已经完全搞清楚了，我不知道还会有什么不解之谜。在我那带有索引的案件统计表的Ｂ字栏里，你能找到几条有关这件事的摘记。”东西\n\n“也许你愿意根据记忆把全案的梗概谈一谈吧。”\n\n“我当然愿意谈一谈罗，虽然我不能保证全部事实都能记住，思想的高度集中很能淹没对于过去的记忆。一个正在处理案件的律师能够就本案的问题和一个专家进行辩论，可是经过一两个星期的法庭诉讼之后就又忘得精光了。因此，在我的脑子里，后来的案子不断地代替了以前各案的地位，而卡莱小姐的事也就模糊了我对巴斯克维尔庄园案案情的回忆。明天也许又要来了什么小问题了，同样也会代替了美丽的法国姑娘和臭名远扬的阿波乌两案的地位。可是关于猎狗这个案件，我倒愿意尽可能正确地把它告诉你们，如果我遗忘了什么的话，你们再加以补充。\n\n“我的调查毫无疑问地证实了，那巴斯克维尔家的画像并没有骗人，那个家伙确是巴斯克维尔家的人，他就是那个查尔兹爵士的弟弟罗杰·巴斯克维尔的儿子。罗杰曾带着极坏的名誉逃到南美洲去，传说他在那里没有结婚就死了。实际上，他结了婚，并且生了一个小孩。这个小家伙和父亲同名，他和一位哥斯达黎加的美人贝莉儿·迦洛茜娅结了婚，在一次偷取了大批公款之后，他就改名凡戴勒逃到英格兰来了。在这里，他又在约克郡的东部开办了一所小学。他所以想搞一下这种事业是因为他在归途中偶尔结识了一个患有肺病的教师，他想利用这人的能力作一番成功的事业。可是这位福瑞泽教师死了，弄得这学校由名誉不佳直到变得臭名远扬了。凡戴勒夫妇感觉最好还是改姓斯台普吞，于是他就带着剩下的财产，带着未来的计划和对昆虫学的爱好迁到英格兰南部去了。我由大英博物馆得知，他在这一门学问里还是个公认的权威呢，而且有一种飞蛾是由于他在约克郡居住时期首先发现的，所以也就永久以凡戴勒为名了。*\n\n“咱们现在谈到他的那一段生活，确实会使咱们感到极大的兴趣。那家伙显然是在经过调查之后发现了，只有两个人有碍于他获得庞大的财产。我相信，在去德文郡的时候，他的计划还很模糊，可是从他带着自己的太太而又使她以妹妹的身分出现这一点来看，显然他从一开始就是居心不良的。虽然他可能还没有确定整个阴谋的细节，可是显然他已想到将她用作钓饵了。他下定决心要把财产弄到手，为了达到这一目的，他不惜采用任何手段或是冒任何危险。他的第一步行动就是，首先把自己的家安置在邻近祖宅的地方，愈近愈好。\n\n第二步就是培养起与查尔兹·巴斯克维尔爵士和邻人们的友情来。\n\n“准男爵亲口告诉了他关于家族的猎狗的传说，因此也就为自己铺了一条死亡的道路。斯台普吞——我就还这样称呼他吧——知道了老头的心脏很衰弱，稍一惊吓就能致死，这些都是他从摩梯末医生那里知道的——他还听说，查尔兹爵士很迷信，并且十分相信那个可怕的传说。他那灵敏的头脑马上就想出了一个办法，既可置准男爵于死地，而且又几乎没有可能追究真正的凶手。\n\n“心里有了这个念头之后，他就费了相当的心机设法使其实现。一个普通的阴谋计划者，利用一只凶恶的猎狗也就满足了。可是他还采用了人工的方法使这动物变得象魔鬼一样的可怕，这就要算是他的机智和天才了。那狗是他从伦敦福莱姆街的贩狗商人罗斯和曼格斯那里买来的，是他们所有的货色之中最强壮、最凶恶的一只了。他坐北德文郡铁路的车把它带回家来，为了怕引起别人的注意，他牵着狗穿过沼地走了很长的路。他已经在捕捉昆虫的时候学会了怎样走进格林盆泥潭去，因此能给那只猎狗找到一处安全的藏身之所。他就把它关在那里，待机使用。\n\n“可是好机会不是很快就能来到的，夜间没法把那老绅士从家中引出来，好几次，斯台普吞带着他那猎狗埋伏在外面，可是毫无结果。就在这些次一无结果的跟踪追寻当中，他，或者不如说是他的同伙，被农民看到了，因此，那段魔狗的传说就又得到了新的证实。他曾希望过，他太太也许能将查尔兹引向毁灭，可是在这问题上，她竟表现出意想不到的不听话。她不肯把老绅士拖进情网，因为这样一来就可能把他交给了他的死敌，恐吓、甚至我连提都不愿提起的殴打，都没能动摇她的决心，她丝毫也不愿参预这件事，有一段时期，斯台普吞甚至到了一筹莫展的地步。\n\n“可是他在困难之中终于抓到了一个机会。由于查尔兹爵士对他已经产生了友情，就在帮助那可怜的女人劳拉·莱昂丝太太的那件事里请他负责掌管那一笔慈善金。由于他以单身汉的身分出现，所以他才能对她产生决定性的影响。他向她表示，如果她和丈夫离婚能获成功，他就和她结婚。可是他那计划突然面临了一个紧要关头，在摩梯末医生建议之下，查尔兹爵士正准备离庄园他去，他本人也假装同意这个意见，但他必须马上采取行动，否则他所要加害的人一远离，他就会弄得鞭长莫及了。因此他就迫使莱昂丝太太写了那封信，恳求老头在去伦敦之前的晚上和她见一次面，随后又用听来似乎很有道理的一套理由使她未去赴约，这样一来，他就得到了一个久候未得的好机会。\n\n“在傍晚的时候，他从库姆·特雷西坐车回来，有足够的时间弄回他的猎狗来，抹好发光涂料，再带着那畜生到栅门附近去，他知道，他一定能看到老绅士在那里等着。那狗受到了主人的怂使，跃过了栅门就向不幸的准男爵追了过去，他被追得一边喊叫一边顺着水松夹道飞奔下去。在那样阴暗的夹道里看到那只又大又黑、嘴眼都冒火的家伙在身后跳跃前进，确实是万分可怕，因此他就由于心脏病和恐惧过度的缘故在夹道的尽头倒地身亡了。那猎狗顺着多草的路边跑，而准男爵则在小路上跑，因此除了人的脚印之外看不到任何其他痕迹。那狗看到他躺下一动不动之后，也许走近前来，闻了一闻，可是发现他已死去之后就又转头离开了，就是在那时，它留下了摩梯末医生所看到的爪印。猎狗被叫了回去，并急忙地被赶回设在格林盆泥沼的狗窝去。这件神秘的事件使官厅感到莫名其妙，使乡下人大为吃惊，最后我们就接手调查了这件案子。\n\n“关于查尔兹·巴斯克维尔爵士的死就说到这里为止吧。\n\n你们能看得出来，这里面的手段用得狡猾之至，确实，几乎无法向真正的凶手提出控诉。他那唯一的同谋永远也不会泄露他的秘密，那古怪而难以想象的手法使得他那阴谋进行得更加顺利。与此案有关的两个女人，斯台普吞太太和劳拉·莱昂丝太太都对斯台普吞极为怀疑。斯台普吞太太知道他在暗算着老头儿，也知道有那只猎狗；莱昂丝太太对这两件事都不知道，可是她记得，暴死发生的时间正是并没有取消的约会的时间，而这个约会只有他知道，因此她也不无怀疑。但是，她俩都是在他的控制之下，而他对她们则一无所惧。全部阴谋的前一半是成功地实现了，可是剩下的还有更困难的呢。\n\n“可能斯台普吞并不知道在加拿大还有一个继承人。可是不管怎样，他很快就能从他的朋友摩梯末医生那里知道了。摩梯末医生后来就详细地告诉了他关于亨利·巴斯克维尔到来的消息。斯台普吞的第一个念头就是：也许根本就不用等这个来自加拿大的陌生青年到德文郡来，在伦敦就可以把他弄死。自从他太太拒绝帮他设阱陷害老头儿以后，他已不再信任他的妻子了，他甚至不敢使她长时间离开自己，因为他怕这样会失去左右她的力量，正因为如此，他才带着她一起到伦敦去。我发现他们住在克瑞文街的梅克司波柔私人旅馆里，我曾派人到那旅馆去搜集证据。在那里，他就把太太关在房间里，而他就装上假胡须，跟踪着摩梯末医生，先到贝克街，后去车站，还到过诺桑勃兰旅馆。他太太对他的阴谋计划多少知道一些，可是她对丈夫怕得厉害——一种由于遭受过残暴的虐待而产生的恐惧——因此她不敢写信去警告那个她知道正处在危险之中的人，因为如果那封信落入斯台普吞之手的话，她的性命就会发生危险了。最后，我们都已知道了，她采取了权宜之计，她用从报纸上剪下来的字凑成了那封信，用伪装的笔迹在信封上写了收信人的地址。那封信到了准男爵的手里，对他发出了第一次危险警告。\n\n“弄一件亨利爵士的衣物对斯台普吞说来是非常重要的，因为他一旦到了不得不用狗的时候，他就能有使狗闻味追踪的东西了，他马上以特有的机敏和大胆动起手来，我们可以肯定，旅馆的男女仆人一定都接受过不少的贿赂才来帮助他达到目的。可是碰巧，第一只弄到的皮鞋竟是新的，对他毫无用处，后来他就把它送还，并窃取了另一只——这件事对我们最有帮助了，因为他在我心里肯定地证实了和我们打交道的是一只真正的猎狗，因为没有别的假设能够解释，为什么要急于弄到一只旧鞋，而对一只新鞋竟这样不感兴趣。越是稀奇古怪的事情就越值得仔细地加以检查，那看来似乎会使全案复杂化的一点，如果给以适当的考虑，并加以科学的处理，往往却正是最能说明问题之处。\n\n“后来，第二天早晨，咱们的朋友又来拜访了咱们，他们一直都受着坐在马车里的斯台普吞的跟踪。从他对咱们的房子和我的面貌知道得那样清楚和他一般的行为来看，我感觉，斯台普吞的罪恶历史决非仅仅限于巴斯克维尔庄园案这一件事。据说在过去三年里，西部曾发生过四次大盗窃案，可是没有一件捉到了罪犯。最后一件是五月间在弗克斯吞场发生的，其特殊之处是：一个僮仆因为想要袭擒那带着面具的单身盗贼而被残酷地枪击致死。我相信斯台普吞就是这样地补充了他那日渐减少的财产，而且这些年来他一直就是个危险的亡命之徒。\n\n“那天早晨，当他成功地从我们手中逃掉并通过马车夫将我的姓名传达给我的时候，咱们已经领略了他的机智和大胆了。从那时起，他就知道我在伦敦已经接手办这件案子了，因此，他知道在那里再也得不到下手的机会了，他才回到了达特沼地，等待着准男爵的来临。”\n\n“等一下！”我说道，“无疑的，你已经如实地描述了事情的经过，可是有一点你还没有解释到。当主人在伦敦的时候，那只猎狗怎么办呢？”\n\n“我曾注意到这件事，而且无疑是重要的。毫无问题，斯台普吞有一个亲信，虽然看来还不象是斯台普吞已经把自己的计划都告诉了他而受着他的左右。在梅利琵宅邸中有一个老男仆，名叫安东尼，他和斯台普吞家的关系可以追溯到数年以前斯台普吞做小学校长的时期，因此他一定知道他的主人和女主人确是夫妇，这人已经从乡间逃跑不见了。‘安东尼’这个姓似乎在英格兰很不普通，而‘安托尼奥’这个姓在所有说西班牙话的国家和美洲说西班牙话的国家里同样也不普通。这个人，象斯台普吞太太一样，英文说得很好，可是带着奇怪的大舌头的味道。我曾亲眼看到这个老头经过斯台普吞所标出来的小路走过格林盆泥沼。因此，很可能是当他的主人不在的时候就由他来照顾猎狗。虽然他或许从来也不知道养这只畜生是作什么用的。\n\n“随后，斯台普吞夫妇就回到了德文郡。不久，亨利爵士和你就在那里跟上了他们。还要说一下我个人在那时的看法，也许你还能想得起来，当我检查那张上面贴着报纸铅印字的信的时候，我仔细地检查了纸里面的水印。在检查的时候，我把它拿在离眼睛只有几英寸的地方，感觉出有一种象是白迎春花的香味。香水一共有七十五种，一个犯罪学专家应当每种都能分辨得出来。根据我个人的经验，在不只一件案子里，全靠能迅速辨别出香水的种类才破的案。那股香味说明，案子里面牵涉到一位女士，当时在我心里已经开始想到了斯台普吞夫妇。我就是这样地在到西部乡下去之前肯定了那猎狗，并且猜出了罪犯。*\n\n“我玩的把戏就是监视斯台普吞。可是，显然，如果我是和你在一起的话，我就会干不成这件事了，因为那样一来，他就会大加小心了。因此，我就把大家——连你在内——全都欺骗了，当人家以为我还在伦敦的时候，我已秘密地到乡下来了。我所吃的苦，并不象你所想象得那样多，决不能让这些细微末节扰乱案件的调查工作。我大部分时间都呆在库姆·特雷西，只有当必须去接近犯罪现场的时候，我才去住在沼地上的小屋里。卡特莱和我一同来了，他假扮成农村小孩，对我的帮助太大了。靠着他，我才能弄到食物和干净衣服，在我监视着
